<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 소감문 관리 시스템</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 글꼴: 본문과 제목 모두 Pretendard (제목은 굵은 고딕) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script>
    // ── 디자인 토큰: 교실의 칠판 · 분필 · 선생님 도장에서 가져온 색 ──
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '"Apple SD Gothic Neo"', '"Malgun Gothic"', 'sans-serif']
          },
          colors: {
            board: { DEFAULT: '#24493D', deep: '#1B3A30', soft: '#E1EBE6' },  // 칠판
            chalk: { DEFAULT: '#F3F0E4', yellow: '#F0CF5C' },                // 분필(흰색 · 노랑)
            stamp: { DEFAULT: '#CF3A2E', soft: '#FBEAE7' },                  // 도장 인주
            ink:   { DEFAULT: '#1D2B26', muted: '#5F706A' },                 // 글자
            page: '#E9EFEC',                                                  // 바탕
            line: '#D5DEDA'                                                   // 테두리
          }
        }
      }
    };
  </script>

  <!-- 자주 쓰는 모양을 이름 붙여 재사용 (Tailwind @apply) -->
  <style type="text/tailwindcss">
    @layer components {
      .field { @apply mt-1.5 block w-full rounded-lg border border-line bg-white px-3.5 py-3 text-base text-ink transition placeholder:text-ink-muted/60 focus:border-board focus:outline-none focus:ring-4 focus:ring-chalk-yellow/60; }
      .field-label { @apply block text-sm font-semibold text-ink; }
      .btn { @apply inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-lg px-4 py-2.5 text-sm font-bold transition active:translate-y-px disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-chalk-yellow/70; }
      .btn-primary { @apply bg-board text-chalk hover:bg-board-deep; }
      .btn-danger { @apply bg-stamp text-white hover:brightness-95; }
      .btn-ghost { @apply bg-white text-ink ring-1 ring-inset ring-line hover:bg-page; }
      .btn-yellow { @apply bg-chalk-yellow text-ink hover:brightness-95; }
      .btn-chalk { @apply bg-white/10 text-chalk ring-1 ring-inset ring-chalk/30 hover:bg-white/20; }
      .btn-sm { @apply rounded-md px-3 py-1.5 text-xs; }
      .panel { @apply rounded-2xl border border-line bg-white; }
      .tab-item { @apply rounded-md py-2.5 text-sm font-bold text-ink-muted transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-chalk-yellow/70; }
      .tab-item.is-active { @apply bg-white text-board shadow-sm; }
      .th { @apply whitespace-nowrap border-b border-line bg-page/60 px-3 py-2.5 text-left text-xs font-bold text-ink-muted; }
      .td { @apply border-b border-line/70 px-3 py-3 align-top; }
    }
  </style>

  <style>
    /* ── 칠판 띠: 이 앱에서 가장 눈에 띄는 단 하나의 요소 ── */
    .board {
      background-color: #24493D;
      background-image:
        radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1.6px),
        radial-gradient(rgba(255, 255, 255, .035) 1px, transparent 1.6px);
      background-size: 9px 9px, 17px 17px;
      background-position: 0 0, 4px 6px;
      border-bottom: 6px solid #B8C3BE; /* 분필 받침대 */
    }
    /* 제목: 굵은 고딕 */
    .board-title {
      font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      font-weight: 800;
      color: #F3F0E4;
      letter-spacing: -.02em;
    }
    /* ── 공책 줄: 소감문 입력칸 (줄 간격 2rem에 맞춰 밑줄) ── */
    .ruled {
      line-height: 2rem;
      background-image:
        linear-gradient(#fff, #fff),
        linear-gradient(to bottom, transparent calc(2rem - 1px), #DCE5E1 calc(2rem - 1px));
      background-size: 100% .75rem, 100% 2rem;
      background-position: 0 0, 0 calc(.75rem - 5px);   /* 줄이 글자 바로 아래에 오도록 5px 올림 */
      background-repeat: no-repeat, repeat;
      background-attachment: local;
    }
    /* ── 선생님 도장: 제출 완료 표시 ── */
    .stamp {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 9999px;
      border: 2.5px solid #CF3A2E; color: #CF3A2E;
      font-size: 12px; font-weight: 800; letter-spacing: -.02em;
      transform: rotate(-12deg);
      box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.5px rgba(207, 58, 46, .35);
    }
    .stamp-empty {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 9999px;
      border: 2px dashed #B5C2BC; color: #7E8F88; font-size: 11px; font-weight: 700;
    }
    .stamp-lg { width: 108px; height: 108px; font-size: 28px; border-width: 5px; box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 7px rgba(207, 58, 46, .35); }
    .stamp-press { animation: press .5s cubic-bezier(.2, .9, .3, 1.25) both; }
    @keyframes press {
      0%   { transform: scale(1.9) rotate(-12deg); opacity: 0; }
      60%  { transform: scale(.94) rotate(-12deg); opacity: 1; }
      100% { transform: scale(1) rotate(-12deg); opacity: 1; }
    }
    .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px; display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-bar { animation: loader 1.1s ease-in-out infinite; }
    @keyframes loader { from { transform: translateX(-100%); } to { transform: translateX(420%); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body class="min-h-screen break-keep bg-page font-sans text-ink antialiased">

  <!-- 서버와 통신 중일 때 화면 맨 위에 보이는 가는 막대 -->
  <div id="topLoader" class="fixed inset-x-0 top-0 z-[80] hidden h-1 overflow-hidden bg-chalk-yellow/30" role="progressbar" aria-label="불러오는 중">
    <div class="loader-bar h-full w-1/5 bg-chalk-yellow"></div>
  </div>

  <!-- ================================================================== -->
  <!-- 1. 로그인 화면                                                      -->
  <!-- ================================================================== -->
  <section id="page-login" class="page">
    <div class="board px-5 pb-14 pt-12 text-center">
      <h1 class="board-title text-3xl leading-tight sm:text-4xl">🏫 학생 소감문 관리</h1>
    </div>

    <div class="mx-auto -mt-6 w-full max-w-md px-4 pb-12">
      <div class="panel p-6 shadow-sm">
        <div class="grid grid-cols-2 gap-1 rounded-lg bg-page p-1" role="tablist" aria-label="로그인 대상">
          <button type="button" class="tab-item" data-role="student" role="tab" onclick="setLoginRole('student')">학생</button>
          <button type="button" class="tab-item" data-role="admin" role="tab" onclick="setLoginRole('admin')">교사</button>
        </div>

        <div id="loginIdWrap" class="mt-5">
          <label for="loginId" class="field-label">학번</label>
          <input id="loginId" type="text" inputmode="numeric" autocomplete="username" placeholder="예: 1101" class="field">
        </div>

        <label for="loginPw" class="field-label mt-4">비밀번호</label>
        <div class="relative">
          <input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호" class="field pr-12">
          <button type="button" data-eye onclick="togglePw('loginPw', this)" aria-label="비밀번호 보기"
            class="absolute bottom-0 right-0 top-1.5 flex items-center px-3.5 text-ink-muted hover:text-ink"></button>
        </div>

        <!-- 학번·비밀번호 기억하기 (학생 로그인에서만 보임) -->
        <div id="rememberWrap" class="mt-4">
          <label class="flex cursor-pointer items-start gap-2.5">
            <input id="rememberMe" type="checkbox" onchange="onRememberToggle(this.checked)"
              class="mt-0.5 h-4 w-4 shrink-0 cursor-pointer accent-[#24493D]">
            <span class="text-sm">
              <span class="font-semibold">학번·비밀번호 기억하기</span>
              <span class="mt-0.5 block text-xs leading-relaxed text-ink-muted">이 컴퓨터(브라우저)에만 저장돼요. 여러 사람이 함께 쓰는 컴퓨터에서는 켜지 마세요.</span>
            </span>
          </label>
          <!-- 기억해 둔 정보가 있을 때만 보이는 지우기 버튼 -->
          <button id="forgetBtn" type="button" onclick="forgetRemembered()"
            class="mt-2 hidden ml-[26px] text-xs font-bold text-stamp underline underline-offset-2">기억한 학번·비밀번호 지우기</button>
        </div>

        <button id="loginBtn" type="button" onclick="login()" class="btn btn-primary mt-6 w-full py-3 text-base">로그인</button>
        <p id="loginHelp" class="mt-4 text-center text-xs leading-relaxed text-ink-muted"></p>
      </div>
    </div>
  </section>

  <!-- ================================================================== -->
  <!-- 2. 학생 화면                                                        -->
  <!-- ================================================================== -->
  <section id="page-student" class="page hidden">
    <div class="board px-4 pb-6 pt-6">
      <div class="mx-auto flex max-w-2xl flex-wrap items-start justify-between gap-3">
        <div class="min-w-0">
          <h1 class="board-title whitespace-nowrap text-2xl leading-tight sm:text-3xl">소감문 쓰기</h1>
          <p class="mt-2 text-sm text-chalk/85">학번 <strong id="displayStudentId" class="ml-0.5 font-bold text-chalk"></strong></p>
        </div>
        <div class="flex shrink-0 flex-wrap justify-end gap-1.5">
          <button id="forgetHeaderBtn" type="button" onclick="forgetRemembered()" class="btn btn-chalk btn-sm hidden">기억 지우기</button>
          <button type="button" onclick="openPwModal(false)" class="btn btn-chalk btn-sm">비밀번호 바꾸기</button>
          <button type="button" onclick="logout()" class="btn btn-chalk btn-sm">로그아웃</button>
        </div>
      </div>

      <!-- 나의 제출 현황 -->
      <div class="mx-auto mt-5 max-w-2xl">
        <div class="flex items-baseline justify-between text-sm text-chalk/85">
          <span>제출한 활동</span>
          <strong id="myProgressText" class="text-base text-chalk-yellow">0 / 0</strong>
        </div>
        <div class="mt-1.5 h-2 overflow-hidden rounded-full bg-black/25">
          <div id="myProgressBar" class="h-full rounded-full bg-chalk-yellow transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="mx-auto max-w-2xl px-4 pb-16 pt-5">
      <div class="mb-4 grid grid-cols-2 gap-1 rounded-lg bg-white/60 p-1 ring-1 ring-line" role="tablist">
        <button type="button" class="tab-item" data-tab="write" role="tab" onclick="moveTab('write')">글쓰기</button>
        <button type="button" class="tab-item" data-tab="list" role="tab" onclick="moveTab('list')">
          내 글 목록 <span id="myCount" class="ml-1 rounded-full bg-page px-2 py-0.5 text-xs">0</span>
          <span id="myFeedbackBadge" class="ml-0.5 hidden rounded-full bg-board px-2 py-0.5 text-xs text-chalk">피드백 0</span>
        </button>
      </div>

      <!-- 2-1. 글쓰기 -->
      <div id="student-write" class="panel p-5 sm:p-6">
        <h2 id="formTitle" class="text-lg font-extrabold">소감문 작성</h2>
        <input type="hidden" id="editUniqueId">

        <label for="selectDate" class="field-label mt-4">활동</label>
        <select id="selectDate" class="field" onchange="autoFillActivity()">
          <option value="">활동을 고르세요</option>
        </select>
        <div id="dupNotice" class="mt-2 hidden rounded-lg bg-stamp-soft px-3 py-2.5 text-sm text-stamp">
          이 활동은 이미 소감문을 냈어요.
          <button type="button" onclick="editExistingForDate()" class="ml-1 font-bold underline underline-offset-2">낸 글 불러와서 고치기</button>
        </div>

        <label for="inputActivity" class="field-label mt-4">창체활동명 (자동 입력)</label>
        <input id="inputActivity" type="text" readonly tabindex="-1" class="field bg-page text-ink-muted">

        <!-- 고치기 화면: 선생님 피드백을 보면서 글을 고칠 수 있게 -->
        <div id="editFeedback" class="hidden"></div>

        <div class="mt-4 flex items-end justify-between">
          <label for="inputContent" class="field-label">소감문</label>
          <span id="charCount" class="text-xs text-ink-muted">0자</span>
        </div>
        <textarea id="inputContent" rows="8" oninput="updateCharCount()" class="field ruled resize-y break-keep"
          placeholder="활동에서 새로 알게 된 점, 느낀 점, 앞으로 해 보고 싶은 점을 적어 보세요."></textarea>

        <button id="submitBtn" type="button" onclick="submitReflection()" class="btn btn-primary mt-5 w-full py-3.5 text-base">제출하기</button>
        <button id="cancelBtn" type="button" onclick="cancelEdit()" class="btn btn-ghost mt-2 hidden w-full">수정 그만두기</button>
      </div>

      <!-- 2-2. 내 글 목록 (공책처럼 한 장 안에 점선으로 구분) -->
      <div id="student-list" class="panel hidden overflow-hidden">
        <div id="my-list-area" class="divide-y divide-dashed divide-line"></div>
      </div>
    </div>
  </section>

  <!-- ================================================================== -->
  <!-- 3. 교사 화면                                                        -->
  <!-- ================================================================== -->
  <section id="page-admin" class="page hidden">
    <div class="board px-4 pb-6 pt-6">
      <div class="mx-auto flex max-w-6xl flex-wrap items-start justify-between gap-3">
        <div>
          <h1 class="board-title whitespace-nowrap text-2xl leading-tight sm:text-3xl">소감문 제출 현황</h1>
          <p id="adminSummary" class="mt-2 text-sm text-chalk/85">불러오는 중</p>
        </div>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="openTeacherViewCollection()" class="btn btn-yellow btn-sm">교사 시점 글 모아 보기</button>
          <button type="button" onclick="resetStudentPassword()" class="btn btn-chalk btn-sm">학생 비밀번호 초기화</button>
          <button type="button" onclick="logout()" class="btn btn-chalk btn-sm">로그아웃</button>
        </div>
      </div>
    </div>

    <div class="mx-auto grid max-w-6xl gap-5 px-4 pb-16 pt-5 lg:grid-cols-[300px_1fr]">
      <!-- 왼쪽: 활동 관리 -->
      <aside class="space-y-5">
        <div class="panel p-4">
          <h2 class="text-sm font-extrabold">활동 추가</h2>
          <div class="mt-2 grid gap-2">
            <input type="date" id="newSettingDate" class="field mt-0" aria-label="활동 날짜">
            <input type="text" id="newSettingActivity" class="field mt-0" placeholder="활동명 (예: 안전 체험교육)" aria-label="활동명">
            <button id="addSettingBtn" type="button" onclick="addSetting()" class="btn btn-primary">활동 추가</button>
          </div>
        </div>
        <div class="panel p-4">
          <h2 class="text-sm font-extrabold">등록된 활동</h2>
          <p class="mt-0.5 text-xs text-ink-muted">누르면 학생별 제출 현황이 나와요.</p>
          <div id="adminActivityList" class="mt-3 grid gap-1.5 lg:max-h-[60vh] lg:overflow-y-auto lg:pr-1"></div>
        </div>
      </aside>

      <!-- 오른쪽: 조회 결과 -->
      <div class="min-w-0 space-y-3">
        <div id="adminNotice" class="hidden rounded-lg bg-chalk-yellow/30 px-4 py-3 text-sm leading-relaxed"></div>
        <div class="flex flex-wrap items-end gap-2">
          <div class="min-w-[220px] flex-1">
            <label for="filterId" class="field-label">학번으로 찾기</label>
            <input id="filterId" type="search" inputmode="numeric" oninput="searchById()" class="field" placeholder="학번이나 학번 앞부분 (예: 11)">
          </div>
          <button type="button" onclick="loadAdminData()" class="btn btn-ghost h-[50px]">새로고침</button>
        </div>

        <div class="panel overflow-hidden">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-line px-4 py-3">
            <h3 id="adminTableTitle" class="font-extrabold">조회 대기</h3>
            <div id="submitStats" class="text-sm font-bold text-board"></div>
          </div>
          <div id="detailFilter" class="hidden flex-wrap gap-1.5 border-b border-line px-4 py-2.5"></div>
          <!-- 선택한 글로 할 수 있는 일 -->
          <div id="bulkBar" class="hidden flex-wrap items-center gap-2 border-b border-line bg-board-soft/50 px-4 py-2.5">
            <span id="selectedCount" class="text-sm font-bold text-board">0개 선택</span>
            <button type="button" onclick="selectStudentChecked()" class="btn btn-ghost btn-sm">학생이 체크한 글 선택</button>
            <button type="button" onclick="clearSelection()" class="btn btn-ghost btn-sm">선택 해제</button>
            <span class="flex-1"></span>
            <button id="aiBulkBtn" type="button" onclick="openAiModal('feedback')" class="btn btn-primary btn-sm" disabled>AI 피드백 생성</button>
            <button id="aiTeacherViewBtn" type="button" onclick="openAiModal('teacherView')" class="btn btn-primary btn-sm" disabled>교사 시점 일괄 변환</button>
          </div>
          <div class="overflow-x-auto">
            <table id="adminTable" class="w-full min-w-[680px] text-sm">
              <thead><tr id="adminTableHeader"></tr></thead>
              <tbody><tr><td class="td py-14 text-center text-ink-muted">불러오는 중</td></tr></tbody>
            </table>
          </div>
        </div>
        <p class="text-right text-xs text-ink-muted sm:hidden">표를 좌우로 밀어서 볼 수 있어요.</p>
      </div>
    </div>
  </section>

  <!-- ================================================================== -->
  <!-- 공용 모달 (브라우저 alert / confirm / prompt 대신 사용)             -->
  <!-- ================================================================== -->
  <div id="modalRoot" class="fixed inset-0 z-[90] hidden items-end justify-center p-3 sm:items-center" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="absolute inset-0 bg-ink/50" onclick="dismissModal()"></div>
    <div id="modalPanel" class="relative max-h-[90vh] w-full max-w-sm overflow-y-auto rounded-2xl bg-white p-6 shadow-xl">
      <div id="modalIcon" class="hidden"></div>
      <h3 id="modalTitle" class="text-lg font-extrabold"></h3>
      <p id="modalMessage" class="mt-2 whitespace-pre-line text-sm leading-relaxed text-ink-muted"></p>
      <div id="modalBody" class="text-left"></div>
      <div id="modalButtons" class="mt-6 flex gap-2"></div>
    </div>
  </div>

  <!-- 토스트 (잠깐 보였다 사라지는 알림) -->
  <div id="toastRoot" class="pointer-events-none fixed inset-x-0 bottom-5 z-[95] flex flex-col items-center gap-2 px-4" aria-live="polite"></div>


<script>
  // ======================================================================
  //  0. 전역 상태
  // ======================================================================
  const ADMIN_LOGIN_ID = '관리자모드';                  // code.gs의 교사 로그인 식별값과 같아야 합니다
  const PW_PATTERN = /^[A-Za-z0-9!#$%^&*_.]{4,20}$/;     // 학생 비밀번호 규칙 (code.gs와 동일)
  const REMEMBER_KEY = 'reflection_login';               // 이 브라우저에 기억해 둔 학생 로그인 정보

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, ch => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
  }

  /** '2026-03-12' → '3월 12일 (목)' */
  function formatDateKo(dateStr) {
    const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return String(dateStr);
    const day = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getDay();
    return `${Number(m[2])}월 ${Number(m[3])}일 (${WEEKDAYS[day]})`;
  }

  /** 버튼을 '처리 중' 상태로 바꾸거나 되돌립니다. (두 번 누르기 방지) */
  function setBtnBusy(btn, busy, busyText) {
    if (!btn) return;
    if (busy) {
      btn.dataset.label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner" aria-hidden="true"></span>${esc(busyText || '처리하는 중')}`;
    } else if (btn.dataset.label !== undefined) {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.label;
      delete btn.dataset.label;
    }
  }

  function setLoading(on) {

    $('topLoader').classList.toggle('hidden', loadingCount === 0);
  }

  /** google.script.run을 Promise로 감싸서 await로 쓸 수 있게 합니다. */
  function callServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](...args);
    });
  }

  /**
   * 서버 호출 + 로딩 표시 + 공통 오류 처리
   * 오류가 나면 모달로 안내하고 null을 돌려주므로, 호출한 쪽은 `if (!res) return;`만 쓰면 됩니다.
   */
  async function request(fnName, args) {
    setLoading(true);
    try {
      return await callServer(fnName, ...(args || []));
    } catch (err) {
      const msg = String((err && err.message) || err || '').replace(/^(Error|Exception):\s*/, '');
      if (msg.indexOf('SESSION_EXPIRED') > -1) handleSessionExpired();
      else showAlert(msg || '서버와 연결하지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도하세요.', { title: '요청을 처리하지 못했어요' });
      return null;
    } finally {
      setLoading(false);
    }
  }

  const BTN_VARIANT = { primary: 'btn-primary', danger: 'btn-danger', ghost: 'btn-ghost', yellow: 'btn-yellow' };

  /**
   * 모달을 열고, 누른 버튼의 value로 끝나는 Promise를 돌려줍니다.
   *  - title, message(글자), html(입력칸 등), iconHtml(위쪽 그림), center(가운데 정렬)
   *  - buttons: [{ text, value, variant }]  (마지막 버튼이 주요 버튼)

   *  - beforeClose(value): false를 돌려주면 닫지 않습니다. (입력 검사, 서버 저장에 사용)
   */
  function openModal(o) {
    o = Object.assign({
      title: '', message: '', html: '', iconHtml: '', center: false, wide: false, locked: false,
      buttons: [{ text: '확인', value: true, variant: 'primary' }], dismissValue: null, beforeClose: null
    }, o);
    if (modalState) { const prev = modalState; modalState = null; prev.resolve(null); }

    const panel = $('modalPanel');
    panel.classList.toggle('text-center', o.center);
    panel.classList.toggle('max-w-sm', !o.wide);
    panel.classList.toggle('max-w-2xl', o.wide === true);
    panel.classList.toggle('max-w-4xl', o.wide === 'xl');
    $('modalIcon').innerHTML = o.iconHtml;
    $('modalIcon').classList.toggle('hidden', !o.iconHtml);
    $('modalTitle').textContent = o.title;
    $('modalMessage').textContent = o.message;
    $('modalMessage').classList.toggle('hidden', !o.message);
    $('modalBody').innerHTML = o.html;
    renderModalButtons(o.buttons);
    // 글자 입력칸에서 Enter를 누르면 주요(마지막) 버튼을 누른 것으로 처리
    $('modalBody').querySelectorAll('input:not([type="checkbox"]):not([data-enter="off"])').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); $('modalButtons').lastElementChild.click(); }
      });
    });

    $('modalRoot').classList.remove('hidden');
    $('modalRoot').classList.add('flex');
    return new Promise(resolve => {
      modalState = { resolve: resolve, beforeClose: o.beforeClose, dismissValue: o.dismissValue, locked: o.locked };
      setTimeout(() => {
        const target = $('modalBody').querySelector('input:not([disabled]), select:not([disabled]), textarea:not([disabled])') || $('modalButtons').lastElementChild;
        if (target) target.focus();
      }, 60);
    });
  }

  function renderModalButtons(buttons) {
    const wrap = $('modalButtons');
    wrap.innerHTML = '';
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = `btn flex-1 py-3 ${BTN_VARIANT[b.variant] || 'btn-ghost'}`;
      el.textContent = b.text;
      el.addEventListener('click', () => closeModal(b.value));
      wrap.appendChild(el);
    });
  }

  /** 열려 있는 모달의 제목·버튼·잠금 상태를 바꿉니다. (AI 진행 화면처럼 모달을 연 채로 내용이 바뀔 때) */
  function updateModal(o) {
    if (!modalState) return;
    if (o.title !== undefined) $('modalTitle').textContent = o.title;
    if (o.buttons) renderModalButtons(o.buttons);
    if (o.locked !== undefined) modalState.locked = o.locked;
    if (o.beforeClose !== undefined) modalState.beforeClose = o.beforeClose;
  }

  async function closeModal(value) {
    const state = modalState;
    if (!state) return;
    if (state.beforeClose && value !== false && value !== null) {
      const buttons = Array.from($('modalButtons').querySelectorAll('button'));
      buttons.forEach(b => { b.disabled = true; });
      let pass;
      try { pass = await state.beforeClose(value); }
      finally { buttons.forEach(b => { b.disabled = false; }); }
      if (pass === false || modalState !== state) return;   // 검사 실패, 또는 그사이 다른 모달이 열림
    }
    modalState = null;
    $('modalRoot').classList.add('hidden');
    $('modalRoot').classList.remove('flex');
    state.resolve(value);
  }

  // ───────── 학번·비밀번호 기억하기 (이 브라우저에만 저장) ─────────
  /**
   * 저장 형식: {id, pw}를 글자마다 섞어 16진수로 바꿔 둡니다.
   * 암호화가 아니라, 브라우저 저장소를 열어 봤을 때 비밀번호가 그대로 보이지 않게 하는 정도예요.
   * 그래서 공용 컴퓨터에서는 켜지 말라고 안내합니다.
   */
  function packLogin(data) {
    const s = JSON.stringify(data);
    let out = '';
    for (let i = 0; i < s.length; i++) out += (s.charCodeAt(i) ^ (0x5A + i % 11)).toString(16).padStart(4, '0');
    return out;
  }

  function unpackLogin(raw) {
    let s = '';
    for (let i = 0; i + 4 <= raw.length; i += 4) s += String.fromCharCode(parseInt(raw.slice(i, i + 4), 16) ^ (0x5A + (i / 4) % 11));
    const data = JSON.parse(s);
    return data && typeof data.id === 'string' ? { id: data.id, pw: String(data.pw || '') } : null;
  }

  /** 기억해 둔 정보 읽기 (없거나 내용이 깨졌으면 null) */
  function readRemembered() {
    try {
      const raw = localStorage.getItem(REMEMBER_KEY);
      return raw ? unpackLogin(raw) : null;
    } catch (e) {
      return null;
    }
  }

  /** 기억해 두기 (브라우저가 저장을 막으면 false) */
  function writeRemembered(id, pw) {
    try { localStorage.setItem(REMEMBER_KEY, packLogin({ id: id, pw: pw })); return true; }
    catch (e) { return false; }
  }

  function clearRemembered() {
    try { localStorage.removeItem(REMEMBER_KEY); } catch (e) { /* 지우지 못해도 로그인에는 영향 없음 */ }
  }

  /** 기억해 둔 정보가 있을 때만 [기억 지우기] 버튼을 보여 줍니다. (로그인 화면 · 학생 화면 상단) */
  function syncForgetButtons() {

  }

  function restoreRememberedLogin() {
    const saved = readRemembered();

  function onRememberToggle(checked) {
