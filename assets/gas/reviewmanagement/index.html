  async function forgetRemembered() {
    const saved = readRemembered();
    if (!saved) {
      syncForgetButtons();
      return showToast('이 브라우저에 기억해 둔 정보가 없어요.');
    }
    const ok = await showConfirm(`기억해 둔 학번(${saved.id})과 비밀번호를 이 컴퓨터(브라우저)에서 지울까요? 다음 로그인부터는 직접 입력해야 해요.`, {
      title: '기억한 학번·비밀번호 지우기', confirmText: '지우기', danger: true
    });
    if (!ok) return;
    clearRemembered();
    restoreRememberedLogin();   // 로그인 화면의 입력칸과 체크도 함께 비웁니다.
    showToast('기억해 둔 학번·비밀번호를 지웠어요.');
  }

  /** 비밀번호를 바꾸면 기억해 둔 비밀번호도 새 값으로 맞춥니다. */
  function updateRememberedPassword(newPw) {
    const saved = readRemembered();
    if (saved && saved.id === currentStudent.id) writeRemembered(saved.id, newPw);
  }

  function setLoginRole(role, focus) {
    loginRole = role;
    document.querySelectorAll('[data-role]').forEach(el => {
      const active = el.dataset.role === role;
      el.classList.toggle('is-active', active);
      el.setAttribute('aria-selected', String(active));
    });
    $('loginIdWrap').classList.toggle('hidden', role === 'admin');
    $('rememberWrap').classList.toggle('hidden', role === 'admin');   // 교사 비밀번호는 기억하지 않아요
    $('loginPw').placeholder = role === 'admin' ? '교사 비밀번호' : '비밀번호';
    $('loginHelp').textContent = role === 'admin'
      ? '교사 비밀번호는 구글 시트의 [환경설정] 메뉴에서 등록한 값이에요.'
      : '처음이라면 선생님이 알려 준 초기 비밀번호를 입력하세요.';
    if (role === 'admin') $('loginPw').value = '';
    else restoreRememberedLogin();
    if (focus === false) return;
    const filled = $('loginId').value && $('loginPw').value;
    (role === 'admin' ? $('loginPw') : (filled ? $('loginBtn') : $('loginId'))).focus();
  }

  function togglePw(inputId, btn) {
    const input = $(inputId);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show ? EYE_OFF : EYE_ON;
    btn.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
  }

  async function login() {
    const isAdmin = loginRole === 'admin';
    const id = isAdmin ? ADMIN_LOGIN_ID : $('loginId').value.trim();
    const pw = $('loginPw').value;
    if (!id || !pw) {
      return showAlert(isAdmin ? '교사 비밀번호를 입력하세요.' : '학번과 비밀번호를 입력하세요.', { title: '비어 있는 칸이 있어요' });
    }

    const btn = $('loginBtn');
    setBtnBusy(btn, true, '확인하는 중');
    const res = await request('verifyLogin', [id, pw]);
    setBtnBusy(btn, false);
    if (!res) return;
    if (!res.success) {
      // 기억해 둔 비밀번호가 더는 맞지 않으면(선생님이 초기화한 경우 등) 그 값은 지웁니다.
      const saved = !isAdmin ? readRemembered() : null;
      if (saved && saved.pw === pw) clearRemembered();
      return showAlert(res.message, { title: '로그인하지 못했어요' });
    }

    $('loginPw').value = '';
    sessionToken = res.token;
    if (res.role === 'admin') {
      showPage('page-admin');
      loadAdminData();
      return;
    }

    currentStudent = { id: res.studentId };
    if ($('rememberMe').checked) {
      if (!writeRemembered(res.studentId, pw)) showToast('이 브라우저에서는 로그인 정보를 기억할 수 없어요.', true);
    } else {
      clearRemembered();
    }
    proceedStudentLogin();
    if (res.isDefault) {
      const change = await showConfirm('아직 초기 비밀번호를 쓰고 있어요. 다른 사람이 내 학번으로 글을 내지 못하도록 지금 바꿀까요?', {
        title: '비밀번호를 바꿔 주세요', confirmText: '지금 바꾸기', cancelText: '다음에'
      });
      if (change) openPwModal(true);
    }
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    $(id).classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  async function logout() {
    const ok = await showConfirm('로그아웃할까요?', { title: '로그아웃', confirmText: '로그아웃' });
    if (!ok) return;
    if (sessionToken) callServer('logout', sessionToken).catch(() => {});
    clearState();
    showPage('page-login');
    setLoginRole(loginRole, false);   // 학생이면 기억해 둔 학번·비밀번호를 다시 채워 둠
  }

  /**
   * 로그아웃할 때 화면에 남은 개인 정보를 모두 지웁니다. (교실 공용 PC 대비)
   * '기억하기'로 저장해 둔 학번·비밀번호는 체크를 풀 때만 지워집니다.
   */
  function clearState() {
    sessionToken = '';
    currentStudent = { id: '' };
    activityData = []; myReflections = []; adminAllData = []; allStudentsList = [];
    currentDetail = null; detailFilter = 'all';
    selectedIds = new Set(); tableRecords = []; aiReady = false; missingColumns = []; tvGroups = []; tvRange = { from: '', to: '' };
    $('bulkBar').classList.add('hidden'); $('bulkBar').classList.remove('flex');
    $('filterId').value = '';
    $('my-list-area').innerHTML = '';
    document.querySelector('#adminTable tbody').innerHTML = '';
    resetForm();
    renderMyProgress();
  }

  /** 서버가 SESSION_EXPIRED를 돌려주면: 쓰던 글을 보관하고 로그인 화면으로 */
  function handleSessionExpired() {
    const content = $('inputContent').value;
    if (currentStudent.id && content.trim()) {
      pendingDraft = { studentId: currentStudent.id, date: $('selectDate').value, content: content, uniqueId: $('editUniqueId').value };
    }
    clearState();
    showPage('page-login');
    setLoginRole(loginRole, false);   // 학생이면 기억해 둔 학번·비밀번호를 다시 채워 둠
    showAlert(pendingDraft
      ? '로그인한 지 오래되어 로그아웃됐어요. 다시 로그인하면 쓰던 글을 되살려 드려요.'
      : '로그인한 지 오래되어 로그아웃됐어요. 다시 로그인하세요.', { title: '다시 로그인해 주세요' });
  }

  function openPwModal(isFirst) {
    return openModal({
      title: '비밀번호 바꾸기',
      message: '영문, 숫자, 특수문자(!#$%^&*_.)로 4~20자를 입력하세요.',
      html: `
        <div class="mt-4 space-y-3">
          <div>
            <label class="field-label" for="newPw1">새 비밀번호</label>
            <input id="newPw1" type="password" autocomplete="new-password" class="field">
          </div>
          <div>
            <label class="field-label" for="newPw2">새 비밀번호 확인</label>
            <input id="newPw2" type="password" autocomplete="new-password" class="field">
          </div>
          <p id="pwError" class="hidden text-sm font-semibold text-stamp"></p>
        </div>`,
      buttons: [
        { text: isFirst ? '다음에' : '취소', value: false, variant: 'ghost' },
        { text: '비밀번호 바꾸기', value: true, variant: 'primary' }
      ],
      dismissValue: false,
      beforeClose: async () => {
        const p1 = $('newPw1').value.trim();
        const p2 = $('newPw2').value.trim();
        if (!PW_PATTERN.test(p1)) return fieldError('pwError', '영문, 숫자, 특수문자(!#$%^&*_.)로 4~20자를 입력하세요.');
        if (p1 !== p2) return fieldError('pwError', '두 칸에 입력한 비밀번호가 서로 달라요.');
        const res = await request('changePassword', [sessionToken, p1]);
        if (!res) return false;
        if (!res.success) return fieldError('pwError', res.message);
        updateRememberedPassword(p1);   // 기억해 둔 비밀번호도 새 값으로
        showToast(res.message);
        return true;
      }
    });
  }


  // ======================================================================
  //  4. 학생 화면
  // ======================================================================
  function proceedStudentLogin() {
    $('displayStudentId').textContent = currentStudent.id;
    syncForgetButtons();   // 기억해 둔 정보가 있으면 상단에 [기억 지우기]가 보여요
    showPage('page-student');
    resetForm();
    moveTab('write');
    loadStudentData().then(restoreDraft);
  }

  async function loadStudentData() {
    const res = await request('getStudentDashboard', [sessionToken]);
    if (!res) return;
    activityData = res.activities;
    myReflections = res.reflections;
    renderDateOptions();
    autoFillActivity();
    renderMyList();
    renderMyProgress();
  }

  /** 다시 로그인한 같은 학생에게 쓰던 글을 되돌려 줍니다. */
  function restoreDraft() {
    if (!pendingDraft) return;
    const draft = pendingDraft;
    pendingDraft = null;
    if (draft.studentId !== currentStudent.id) return;
    const idx = draft.uniqueId ? myReflections.findIndex(r => r.uniqueId === draft.uniqueId) : -1;
    if (idx > -1) editItem(idx);
    $('selectDate').value = draft.date;
    autoFillActivity();
    $('inputContent').value = draft.content;
    updateCharCount();
    showToast('쓰던 글을 되살렸어요.');
  }

  function renderMyProgress() {
    const dates = new Set(activityData.map(a => a.date));
    const done = new Set(myReflections.map(r => r.date).filter(d => dates.has(d))).size;
    const total = activityData.length;
    $('myProgressText').textContent = `${done} / ${total}`;
    $('myProgressBar').style.width = total ? `${Math.round(done / total * 100)}%` : '0%';
    $('myCount').textContent = myReflections.length;
    const feedbackCount = myReflections.filter(r => r.feedback).length;
    $('myFeedbackBadge').textContent = `피드백 ${feedbackCount}`;
    $('myFeedbackBadge').classList.toggle('hidden', !feedbackCount);
  }

  /** 활동 선택 목록 만들기. extra: 목록에서 지워진 활동의 글을 고칠 때 임시로 넣는 항목 */
  function renderDateOptions(extra) {
    const select = $('selectDate');
    const keep = select.value;
    const submitted = new Set(myReflections.map(r => r.date));
    let html = '<option value="">활동을 고르세요</option>';
    activityData.forEach(a => {
      html += `<option value="${esc(a.date)}">[${esc(a.date.replace(/-/g, '.'))}] ${esc(a.activity)}${submitted.has(a.date) ? ' (제출함)' : ''}</option>`;
    });
    if (extra && !activityData.some(a => a.date === extra.date)) {
      html += `<option value="${esc(extra.date)}">[${esc(extra.date.replace(/-/g, '.'))}] ${esc(extra.activity)} (목록에서 빠진 활동)</option>`;
    }
    select.innerHTML = html;
    select.value = keep;
    if (select.value !== keep) select.value = '';
  }

  function autoFillActivity() {
    const date = $('selectDate').value;
    const editingId = $('editUniqueId').value;
    const matched = activityData.find(a => a.date === date);
    const editing = editingId ? myReflections.find(r => r.uniqueId === editingId) : null;
    $('inputActivity').value = matched ? matched.activity : (editing && editing.date === date ? editing.activity : '');
    const dup = date ? myReflections.find(r => r.date === date && r.uniqueId !== editingId) : null;
    $('dupNotice').classList.toggle('hidden', !dup);
  }

  async function editExistingForDate() {
    const idx = myReflections.findIndex(r => r.date === $('selectDate').value);
    if (idx === -1) return;
    if ($('inputContent').value.trim()) {
      const ok = await showConfirm('지금 쓰고 있는 내용은 지워져요. 낸 글을 불러올까요?', { title: '낸 글 불러오기', confirmText: '불러오기' });
      if (!ok) return;
    }
    editItem(idx);
  }

  function updateCharCount() {
    $('charCount').textContent = `${$('inputContent').value.length.toLocaleString()}자`;
  }

  async function submitReflection() {
    const date = $('selectDate').value;
    const content = $('inputContent').value;
    const uniqueId = $('editUniqueId').value;
    if (!date) return showAlert('소감문을 쓸 활동을 먼저 고르세요.', { title: '활동을 고르지 않았어요' });
    if (!content.trim()) return showAlert('소감문 내용을 입력하세요.', { title: '내용이 비어 있어요' });
    if (myReflections.some(r => r.date === date && r.uniqueId !== uniqueId)) return offerEditDuplicate(date);

    const ok = await showConfirm(uniqueId ? '고친 내용으로 저장할까요?' : '이 소감문을 제출할까요? 제출한 뒤에도 고칠 수 있어요.', {
      title: uniqueId ? '수정한 내용 저장' : '소감문 제출', confirmText: uniqueId ? '저장하기' : '제출하기'
    });
    if (!ok) return;

    const btn = $('submitBtn');
    setBtnBusy(btn, true, uniqueId ? '저장하는 중' : '제출하는 중');
    const res = await request('saveReflection', [sessionToken, { date: date, content: content, uniqueId: uniqueId }]);
    setBtnBusy(btn, false);
    if (!res) return;   // 실패해도 쓴 내용은 입력칸에 그대로 남아 있습니다.
    if (!res.success) {
      if (res.duplicate) { await loadStudentData(); return offerEditDuplicate(date); }
      return showAlert(res.message, { title: '저장하지 못했어요' });
    }

    const activity = $('inputActivity').value;
    resetForm();
    if (uniqueId) showToast(res.message);
    else showStampModal('제출했어요', `${formatDateKo(date)} ${activity}`);
    moveTab('list');
    loadStudentData();
  }

  async function offerEditDuplicate(date) {
    const typed = $('inputContent').value.trim();
    const go = await showConfirm(`${formatDateKo(date)} 활동은 이미 소감문을 냈어요. 낸 글을 불러와서 고칠까요?${typed ? '\n지금 쓰고 있는 내용은 지워져요.' : ''}`, {
      title: '이미 낸 활동이에요', confirmText: '불러와서 고치기', cancelText: '닫기'
    });
    if (!go) return;
    const idx = myReflections.findIndex(r => r.date === date);
    if (idx > -1) editItem(idx);
  }

  function moveTab(tab) {
    const isWrite = tab === 'write';
    $('student-write').classList.toggle('hidden', !isWrite);
    $('student-list').classList.toggle('hidden', isWrite);
    document.querySelectorAll('.tab-item[data-tab]').forEach(el => {
      const active = el.dataset.tab === tab;
      el.classList.toggle('is-active', active);
      el.setAttribute('aria-selected', String(active));
    });
  }

  /** 학생 화면의 '선생님 피드백' 상자 */
  function feedbackNoteHtml(text) {
    return `<div class="mt-3 rounded-lg border-l-4 border-board bg-board-soft px-3 py-2.5">
      <p class="text-xs font-bold text-board">선생님 피드백</p>
      <p class="mt-1 whitespace-pre-wrap break-words text-sm leading-relaxed">${esc(text)}</p>
    </div>`;
  }

  function renderMyList() {
    const area = $('my-list-area');
    if (!myReflections.length) {
      area.innerHTML = `
        <div class="px-5 py-12 text-center">
          <p class="font-bold">아직 낸 소감문이 없어요.</p>
          <p class="mt-1 text-sm text-ink-muted">활동을 고르고 첫 소감문을 써 보세요.</p>
          <button type="button" onclick="moveTab('write')" class="btn btn-primary mt-4">소감문 쓰기</button>
        </div>`;
      return;
    }
    area.innerHTML = myReflections.map((item, idx) => {
      const checked = item.check === 'O';
      return `
        <article class="px-5 py-4">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="text-xs font-semibold text-ink-muted">${esc(formatDateKo(item.date))}</p>
              <h3 class="truncate font-extrabold">${esc(item.activity)}</h3>
            </div>
            <button type="button" onclick="toggleCheck(${idx})" aria-pressed="${checked}"
              class="btn btn-sm shrink-0 ${checked ? 'btn-primary' : 'btn-ghost'}">${checked ? '✓ 체크함' : '체크'}</button>
          </div>
          <p class="mt-2 whitespace-pre-wrap break-words leading-7">${esc(item.content)}</p>
          ${item.feedback ? feedbackNoteHtml(item.feedback) : ''}
          <div class="mt-3 flex justify-end gap-1.5">
            <button type="button" onclick="editItem(${idx})" class="btn btn-ghost btn-sm">${item.feedback ? '피드백 보고 고치기' : '수정'}</button>
            <button type="button" onclick="deleteItem(${idx})" class="btn btn-ghost btn-sm text-stamp">삭제</button>
          </div>
        </article>`;
    }).join('');
  }

  async function toggleCheck(idx) {
    const item = myReflections[idx];
    if (!item) return;
    const res = await request('toggleSelfCheck', [sessionToken, item.uniqueId]);
    if (!res) return;
    if (!res.success) return showAlert(res.message, { title: '체크하지 못했어요' });
    item.check = res.check;
    renderMyList();
  }

  function editItem(idx) {
    const item = myReflections[idx];
    if (!item) return;
    moveTab('write');
    $('editUniqueId').value = item.uniqueId;
    renderDateOptions(item);
    $('selectDate').value = item.date;
    $('inputContent').value = item.content;
    $('formTitle').textContent = '소감문 고치기';
    $('submitBtn').textContent = '저장하기';
    $('cancelBtn').classList.remove('hidden');
    $('editFeedback').innerHTML = item.feedback ? feedbackNoteHtml(item.feedback) : '';
    $('editFeedback').classList.toggle('hidden', !item.feedback);
    autoFillActivity();
    updateCharCount();
    $('student-write').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function cancelEdit() {
    const item = myReflections.find(r => r.uniqueId === $('editUniqueId').value);
    const changed = item && item.content !== $('inputContent').value;
    if (changed) {
      const ok = await showConfirm('고친 내용은 저장되지 않아요. 수정을 그만둘까요?', { title: '수정 그만두기', confirmText: '그만두기', cancelText: '계속 고치기' });
      if (!ok) return;
    }
    resetForm();
  }

  async function deleteItem(idx) {
    const item = myReflections[idx];
    if (!item) return;
    const ok = await showConfirm(`${formatDateKo(item.date)} '${item.activity}' 소감문을 삭제할까요? 삭제한 글은 되돌릴 수 없어요.`, {
      title: '소감문 삭제', confirmText: '삭제', danger: true
    });
    if (!ok) return;
    const res = await request('deleteReflection', [sessionToken, item.uniqueId]);
    if (!res) return;
    if (!res.success) return showAlert(res.message, { title: '삭제하지 못했어요' });
    if ($('editUniqueId').value === item.uniqueId) resetForm();
    showToast(res.message);
    loadStudentData();
  }

  function resetForm() {
    $('formTitle').textContent = '소감문 작성';
    const btn = $('submitBtn');
    btn.disabled = false;
    btn.textContent = '제출하기';
    delete btn.dataset.label;
    $('cancelBtn').classList.add('hidden');
    $('editUniqueId').value = '';
    $('selectDate').value = '';
    $('inputActivity').value = '';
    $('inputContent').value = '';
    $('dupNotice').classList.add('hidden');
    $('editFeedback').innerHTML = '';
    $('editFeedback').classList.add('hidden');
    renderDateOptions();
    updateCharCount();
  }


  // ======================================================================
  //  5. 교사 화면
  // ======================================================================
  async function loadAdminData() {
    const res = await request('getAdminDashboard', [sessionToken]);
    if (!res) return;
    allStudentsList = res.students;
    activityData = res.activities;
    adminAllData = res.reflections;
    usesFallbackPassword = res.usesFallbackPassword;
    aiReady = res.aiReady;
    aiModel = res.aiModel;
    aiIntervalSec = res.aiIntervalSec;
    missingColumns = res.missingColumns || [];
    if (currentDetail) currentDetail = activityData.find(a => a.date === currentDetail.date) || null;

    updateAdminSummary();
    const notice = $('adminNotice');
    notice.classList.toggle('hidden', !missingColumns.length);
    notice.innerHTML = missingColumns.length
      ? `피드백과 교사 시점 기능을 쓰려면 먼저 구글 시트 상단 [📚 소감문 관리] &gt; [DB 세팅 및 초기화]에서 [안전 세팅]을 실행해 <b>${missingColumns.map(c => esc(c)).join(', ')}</b> 열을 추가하세요.`
      : '';
    renderActivityTags();
    renderCurrentTable();
  }

  function updateAdminSummary() {
    const feedbackCount = adminAllData.filter(r => r.feedback).length;
    const viewCount = adminAllData.filter(r => r.teacherView).length;
    $('adminSummary').textContent = `학생 ${allStudentsList.length}명, 활동 ${activityData.length}개, 제출된 소감문 ${adminAllData.length}건, 피드백 ${feedbackCount}건, 교사 시점 글 ${viewCount}건`;
  }

  /** 지금 보고 있는 표(활동별 현황 또는 학번 검색)를 다시 그립니다. */
  function renderCurrentTable() {
    if (currentDetail) renderDetailTable();
    else renderSearchTable();
  }

  /** 그 날짜 활동에 제출한 '명단 속' 학생 수 */
  function countSubmitted(date) {
    const ids = new Set(allStudentsList);
    return new Set(adminAllData.filter(r => r.date === date && ids.has(r.studentId)).map(r => r.studentId)).size;
  }

  function renderActivityTags() {
    const box = $('adminActivityList');
    if (!activityData.length) {
      box.innerHTML = '<p class="text-sm text-ink-muted">아직 등록된 활동이 없어요. 위에서 첫 활동을 추가하세요.</p>';
      return;
    }
    const total = allStudentsList.length;
    box.innerHTML = activityData.map((a, i) => {
      const done = countSubmitted(a.date);
      const pct = total ? Math.round(done / total * 100) : 0;
      const active = !!currentDetail && currentDetail.date === a.date;
      return `
        <button type="button" onclick="viewActivityDetail(${i})" aria-pressed="${active}"
          class="w-full rounded-lg border px-3 py-2.5 text-left transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-chalk-yellow/70 ${active ? 'border-board bg-board text-chalk' : 'border-line bg-white hover:border-board/50'}">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs ${active ? 'text-chalk/80' : 'text-ink-muted'}">${esc(formatDateKo(a.date))}</span>
            <span class="text-xs font-bold ${active ? 'text-chalk-yellow' : 'text-board'}">${done}/${total}</span>
          </div>
          <div class="mt-0.5 truncate text-sm font-bold">${esc(a.activity)}</div>
          <div class="mt-2 h-1 overflow-hidden rounded-full ${active ? 'bg-black/25' : 'bg-page'}">
            <div class="h-full rounded-full ${active ? 'bg-chalk-yellow' : 'bg-board'}" style="width:${pct}%"></div>
          </div>
        </button>`;
    }).join('');
  }

  function viewActivityDetail(index) {
    const act = activityData[index];
    if (!act) return;
    currentDetail = act;
    detailFilter = 'all';
    selectedIds = new Set();
    $('filterId').value = '';
    renderActivityTags();
    renderDetailTable();
    if (window.innerWidth < 1024) $('adminTableTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function setDetailFilter(mode) {
    detailFilter = mode;
    renderDetailTable();
  }

  /** 활동 하나를 골랐을 때: 명단 전체를 기준으로 제출/미제출과 피드백을 표시 */
  function renderDetailTable() {
    const act = currentDetail;
    $('adminTableTitle').textContent = `${formatDateKo(act.date)} ${act.activity}`;

    const roster = new Set(allStudentsList);
    const records = adminAllData.filter(r => r.date === act.date);
    const rows = allStudentsList.map(id => ({ id: id, record: records.find(r => r.studentId === id) || null, outside: false }));
    // 명단에 없는 학번(전학 등)의 글도 빠뜨리지 않고 아래에 보여 줍니다.
    records.filter(r => !roster.has(r.studentId)).forEach(r => rows.push({ id: r.studentId, record: r, outside: true }));

    const total = allStudentsList.length;
    const done = rows.filter(r => r.record && !r.outside).length;
    $('submitStats').textContent = `${done} / ${total}명 제출 (${total ? Math.round(done / total * 100) : 0}%)`;

    const counts = {
      all: rows.length,
      done: rows.filter(r => r.record).length,
      none: rows.filter(r => !r.record).length,
      nofb: rows.filter(r => r.record && !r.record.feedback).length,
      notv: rows.filter(r => r.record && !r.record.teacherView).length
    };
    const labels = { all: '전체', done: '제출', none: '미제출', nofb: '피드백 전', notv: '변환 전' };
    const filterBox = $('detailFilter');
    filterBox.classList.remove('hidden');
    filterBox.classList.add('flex');
    filterBox.innerHTML = Object.keys(labels).map(k => `
      <button type="button" onclick="setDetailFilter('${k}')" aria-pressed="${detailFilter === k}"
        class="btn btn-sm ${detailFilter === k ? 'btn-primary' : 'btn-ghost'}">${labels[k]} ${counts[k]}</button>`).join('');

    const visible = rows.filter(r =>
      detailFilter === 'all' ||
      (detailFilter === 'done' && r.record) ||
      (detailFilter === 'none' && !r.record) ||
      (detailFilter === 'nofb' && r.record && !r.record.feedback) ||
      (detailFilter === 'notv' && r.record && !r.record.teacherView));
    tableRecords = visible.filter(r => r.record).map(r => r.record);
    selectedIds = new Set(tableRecords.map(r => r.uniqueId).filter(id => selectedIds.has(id)));   // 안 보이는 글은 선택에서 뺌

    $('adminTableHeader').innerHTML = `
      <th class="th w-10">${selectAllHtml()}</th>
      <th class="th w-20">학번</th><th class="th w-16 text-center">제출</th>
      <th class="th w-20 whitespace-nowrap text-center">학생 체크</th><th class="th">소감문과 피드백</th>`;

    const tbody = document.querySelector('#adminTable tbody');
    if (!visible.length) {
      const emptyText = { none: '모든 학생이 제출했어요.', nofb: '피드백을 기다리는 글이 없어요.', notv: '교사 시점으로 바꿀 글이 없어요.' }[detailFilter] || '해당하는 학생이 없어요.';
      tbody.innerHTML = `<tr><td colspan="5" class="td py-12 text-center text-ink-muted">${emptyText}</td></tr>`;
      renderBulkBar();
      return;
    }
    tbody.innerHTML = visible.map(r => r.record ? `
      <tr>
        ${selectCell(r.record)}
        <td class="td font-bold">${r.outside
          ? `<span class="text-stamp">${esc(r.id || '학번 없음')}</span><div class="text-xs font-normal text-stamp">명단에 없음</div>`
          : esc(r.id)}</td>
        <td class="td text-center"><span class="stamp">제출</span></td>
        <td class="td text-center font-bold text-board">${r.record.check === 'O' ? '✓' : ''}</td>
        ${contentCell(r.record)}
      </tr>` : `
      <tr class="bg-page/40">
        <td class="td"></td>
        <td class="td text-ink-muted">${esc(r.id)}</td>
        <td class="td text-center"><span class="stamp-empty">미제출</span></td>
        <td class="td text-center text-ink-muted">-</td>
        <td class="td text-ink-muted">아직 내지 않았어요.</td>
      </tr>`).join('');
    renderBulkBar();
  }

  /** 학번 검색 입력칸이 바뀌면: 선택을 비우고 결과를 다시 그립니다. */
  function searchById() {
    const q = $('filterId').value.trim();
    if (q && currentDetail) { currentDetail = null; renderActivityTags(); }
    selectedIds = new Set();
    renderCurrentTable();
  }

  /** 학번 검색 결과 (앞부분만 입력해도 됩니다. 예: 11 → 11로 시작하는 모든 학번) */
  function renderSearchTable() {
    const q = $('filterId').value.trim();
    const filterBox = $('detailFilter');
    filterBox.classList.add('hidden');
    filterBox.classList.remove('flex');
    tableRecords = q ? adminAllData.filter(r => r.studentId.startsWith(q)) : [];
    selectedIds = new Set(tableRecords.map(r => r.uniqueId).filter(id => selectedIds.has(id)));
    $('adminTableHeader').innerHTML = `
      <th class="th w-10">${selectAllHtml()}</th>
      <th class="th w-28">날짜</th><th class="th w-16">학번</th><th class="th w-32">활동명</th>
      <th class="th w-20 whitespace-nowrap text-center">학생 체크</th><th class="th">소감문과 피드백</th>`;
    const tbody = document.querySelector('#adminTable tbody');

    if (!q) {
      $('adminTableTitle').textContent = '조회 대기';
      $('submitStats').textContent = '';
      tbody.innerHTML = '<tr><td colspan="6" class="td py-14 text-center text-ink-muted">활동을 고르거나, 학번을 입력하세요.</td></tr>';
      renderBulkBar();
      return;
    }
    $('adminTableTitle').textContent = `학번 '${q}' 검색 결과`;
    $('submitStats').textContent = `${tableRecords.length}건`;
    if (!tableRecords.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="td py-12 text-center text-ink-muted">학번 '${esc(q)}'에 해당하는 제출 기록이 없어요.</td></tr>`;
      renderBulkBar();
      return;
    }
    tbody.innerHTML = tableRecords.map(r => `
      <tr>
        ${selectCell(r)}
        <td class="td whitespace-nowrap">${esc(r.date)}</td>
        <td class="td font-bold">${esc(r.studentId || '-')}</td>
        <td class="td">${esc(r.activity)}</td>
        <td class="td text-center font-bold text-board">${r.check === 'O' ? '✓' : ''}</td>
        ${contentCell(r)}
      </tr>`).join('');
    renderBulkBar();
  }

  // ───────── 표에서 글 선택하기 ─────────
  function selectAllHtml() {
    const all = tableRecords.length > 0 && tableRecords.every(r => selectedIds.has(r.uniqueId));
    return `<input type="checkbox" class="h-4 w-4 cursor-pointer accent-[#24493D]" aria-label="표에 보이는 글 모두 선택"
      ${all ? 'checked' : ''} ${tableRecords.length ? '' : 'disabled'} onchange="toggleSelectAll(this.checked)">`;
  }

  /** 체크박스 칸: tableRecords의 번호로 글을 가리킵니다. (학번·내용에 따옴표가 있어도 안전) */
  function selectCell(rec) {
    const i = tableRecords.indexOf(rec);
    return `<td class="td"><input type="checkbox" class="h-4 w-4 cursor-pointer accent-[#24493D]" aria-label="이 글 선택"
      ${selectedIds.has(rec.uniqueId) ? 'checked' : ''} onchange="toggleSelect(${i}, this.checked)"></td>`;
  }

  function toggleSelect(index, on) {
    const rec = tableRecords[index];
    if (!rec) return;
    if (on) selectedIds.add(rec.uniqueId);
    else selectedIds.delete(rec.uniqueId);
    renderBulkBar();
  }

  function toggleSelectAll(on) {
    tableRecords.forEach(r => { if (on) selectedIds.add(r.uniqueId); else selectedIds.delete(r.uniqueId); });
    renderCurrentTable();
  }

  /** 학생이 스스로 '체크'한 글만 골라 선택합니다. */
  function selectStudentChecked() {
    const checked = tableRecords.filter(r => r.check === 'O');
    if (!checked.length) return showToast('이 표에는 학생이 체크한 글이 없어요.', true);
    selectedIds = new Set(checked.map(r => r.uniqueId));
    renderCurrentTable();
    showToast(`학생이 체크한 글 ${checked.length}개를 선택했어요.`);
  }

  function clearSelection() {
    selectedIds = new Set();
    renderCurrentTable();
  }

  function renderBulkBar() {
    const bar = $('bulkBar');
    const show = tableRecords.length > 0;
    bar.classList.toggle('hidden', !show);
    bar.classList.toggle('flex', show);
    const count = tableRecords.filter(r => selectedIds.has(r.uniqueId)).length;
    $('selectedCount').textContent = `${count}개 선택`;
    $('aiBulkBtn').disabled = count === 0;
    $('aiTeacherViewBtn').disabled = count === 0;
    const head = document.querySelector('#adminTableHeader input[type="checkbox"]');
    if (head) head.checked = show && count === tableRecords.length;
  }

  // ───────── 피드백 쓰기 ─────────
  /** 소감문 칸: 학생 글 바로 아래에 피드백·교사 시점 글과 쓰기/고치기 버튼을 붙여, 어느 글에 대한 것인지 한눈에 보이게 합니다. */
  function contentCell(rec) {
    const i = tableRecords.indexOf(rec);
    const boxes = [];
    const writeButtons = [];
    Object.keys(TEXT_FIELDS).forEach(field => {
      const f = TEXT_FIELDS[field];
      if (rec[field]) {
        boxes.push(`
        <div class="mt-2 flex flex-wrap items-start gap-2 rounded-lg border-l-4 ${f.box} px-3 py-2">
          <div class="min-w-0 flex-1 basis-56">
            <p class="text-xs font-bold ${f.labelColor}">${f.label}<span class="ml-1.5 font-medium text-ink-muted">${f.note}</span></p>
            <p class="mt-0.5 whitespace-pre-wrap break-words leading-relaxed">${esc(rec[field])}</p>
          </div>
          <button type="button" onclick="openTextModal('${field}', ${i})" aria-label="${f.label} 고치기" class="btn btn-ghost btn-sm shrink-0 self-start">고치기</button>
        </div>`);
      } else {
        writeButtons.push(`<button type="button" onclick="openTextModal('${field}', ${i})" class="btn btn-ghost btn-sm">${f.writeLabel}</button>`);
      }
    });
    return `<td class="td">
      <p class="whitespace-pre-wrap break-words leading-relaxed">${esc(rec.content)}</p>
      ${boxes.join('')}
      ${writeButtons.length ? `<div class="mt-2 flex flex-wrap gap-1.5">${writeButtons.join('')}</div>` : ''}
    </td>`;
  }

  /** 피드백 또는 교사 시점 글을 직접 쓰고 고치는 창 */
  function openTextModal(field, index) {
    const rec = tableRecords[index];
    const f = TEXT_FIELDS[field];
    if (!rec || !f) return;
    const done = openModal({
      wide: true,
      title: `${f.label} ${rec[field] ? '고치기' : '쓰기'}`,
      html: `
        <div class="mt-3 space-y-4">
          <div>
            <p class="text-xs font-semibold text-ink-muted">${esc(formatDateKo(rec.date))} ${esc(rec.activity)}</p>
            <p class="font-bold">${esc(rec.studentId)} 학생의 소감문</p>
            <div class="mt-1.5 max-h-48 overflow-y-auto whitespace-pre-wrap break-words rounded-lg border border-line bg-page/50 p-3 text-sm leading-relaxed">${esc(rec.content)}</div>
          </div>
          <div>
            <div class="flex items-end justify-between">
              <label class="field-label" for="textInput">${f.label}</label>
              <span id="textCount" class="text-xs text-ink-muted"></span>
            </div>
            <textarea id="textInput" rows="6" class="field resize-y leading-relaxed" placeholder="${esc(f.placeholder)}">${esc(rec[field])}</textarea>
            <p class="mt-1 text-xs text-ink-muted">${esc(f.help)}</p>
            <p id="textError" class="mt-1 hidden text-sm font-semibold text-stamp"></p>
          </div>
        </div>`,
      buttons: [{ text: '취소', value: false, variant: 'ghost' }, { text: `${f.label} 저장`, value: true, variant: 'primary' }],
      dismissValue: false,
      beforeClose: async () => {
        const res = await request(f.server, [sessionToken, rec.uniqueId, $('textInput').value]);
        if (!res) return false;
        if (!res.success) return fieldError('textError', res.message);
        rec[field] = res.text;
        showToast(res.message);
        updateAdminSummary();
        renderCurrentTable();
        return true;
      }
    });
    const input = $('textInput');
    const count = () => { $('textCount').textContent = `${input.value.length.toLocaleString()}자`; };
    input.addEventListener('input', count);
    count();
    return done;
  }

  // ───────── AI 일괄 작업 (피드백 생성 · 교사 시점 변환) ─────────
  function loadAiPrompt(mode) {
    const cfg = AI_MODES[mode];
    try { return localStorage.getItem(cfg.promptKey) || cfg.defaultPrompt; } catch (e) { return cfg.defaultPrompt; }
  }

  function saveAiPrompt(mode, text) {
    try { localStorage.setItem(AI_MODES[mode].promptKey, text); } catch (e) { /* 기억하지 못해도 이번 작업에는 영향 없음 */ }
  }

  /** 예상 시간: 글 하나에 (요청 간격 + AI 응답 약 3초) */
  function estimateAiTime(count) {
    const minutes = Math.ceil(count * (aiIntervalSec + 3) / 60);
    return minutes <= 1 ? '1분 이내' : `약 ${minutes}분`;
  }

  function openAiModal(mode) {
    const cfg = AI_MODES[mode];
    const targets = tableRecords.filter(r => selectedIds.has(r.uniqueId));
    if (!targets.length) return showAlert('표 왼쪽 체크박스로 글을 먼저 선택하세요.', { title: '선택한 글이 없어요' });
    if (!aiReady) {
      return showAlert('Gemini API 키가 아직 등록되지 않았어요. 구글 시트 상단 [📚 소감문 관리] > [환경설정]에서 등록한 뒤 [새로고침]을 누르세요.', { title: 'AI 기능을 쓸 수 없어요' });
    }
    const existing = targets.filter(r => r[cfg.field]).length;
    const done = openModal({
      wide: true,
      title: cfg.title,
      message: cfg.description(targets.length),
      html: `
        <div class="mt-4 space-y-3">
          <div class="rounded-xl border border-line bg-page/40 p-3">
            <div class="flex flex-wrap items-end gap-2">
              <div class="min-w-[200px] flex-1">
                <label class="field-label" for="promptSelect">프롬프트 보관함</label>
                <select id="promptSelect" class="field" disabled><option value="">불러오는 중</option></select>
              </div>
              <button id="promptDelete" type="button" class="btn btn-ghost h-[50px] text-stamp" disabled>삭제</button>
            </div>
            <p id="promptNote" class="mt-1.5 text-xs text-ink-muted"></p>
          </div>
          <div>
            <div class="flex items-end justify-between gap-2">
              <label class="field-label" for="aiPrompt">프롬프트</label>
              <button type="button" onclick="document.getElementById('aiPrompt').value = AI_MODES['${mode}'].defaultPrompt"
                class="text-xs font-bold text-board underline underline-offset-2">기본 프롬프트로 되돌리기</button>
            </div>
            <textarea id="aiPrompt" rows="6" class="field resize-y text-sm leading-relaxed">${esc(loadAiPrompt(mode))}</textarea>
            <div class="mt-1 flex flex-wrap items-end gap-2">
              <div class="min-w-[200px] flex-1">
                <label class="sr-only" for="promptName">보관함에 저장할 이름</label>
                <input id="promptName" type="text" maxlength="40" data-enter="off" class="field" placeholder="보관함에 저장할 이름 (예: 칭찬 중심 3문장)">
              </div>
              <button id="promptSave" type="button" class="btn btn-ghost h-[50px]" disabled>보관함에 저장</button>
            </div>
          </div>
          <label class="flex items-center gap-2 text-sm">
            <input id="aiSkipExisting" type="checkbox" checked class="h-4 w-4 accent-[#24493D]">
            ${cfg.skipLabel}${existing ? ` <span class="text-ink-muted">(선택한 글 중 ${existing}개)</span>` : ''}
          </label>
          <p class="text-xs leading-relaxed text-ink-muted">모델 <b class="text-ink">${esc(aiModel)}</b>, 요청 간격 ${aiIntervalSec}초, 예상 시간 ${estimateAiTime(targets.length)}. 모델과 요청 간격은 구글 시트 [환경설정]에서 바꿀 수 있어요.</p>
          <p class="rounded-lg bg-page px-3 py-2 text-xs leading-relaxed text-ink-muted">학번은 보내지 않고 활동명과 소감문만 보내요. 무료 API 키로 보낸 내용은 구글 서비스 개선에 쓰일 수 있으니, 글에 이름이나 연락처 같은 개인정보가 없는지 확인하세요.</p>
          <p id="aiError" class="hidden text-sm font-semibold text-stamp"></p>
        </div>`,
      buttons: [{ text: '취소', value: false, variant: 'ghost' }, { text: cfg.startLabel, value: true, variant: 'primary' }],
      dismissValue: false,
      beforeClose: () => {
        const prompt = $('aiPrompt').value.trim();
        if (!prompt) return fieldError('aiError', '프롬프트를 입력하세요.');
        if (prompt.length > 2000) return fieldError('aiError', '프롬프트는 2,000자까지 쓸 수 있어요.');
        saveAiPrompt(mode, prompt);
        const skip = $('aiSkipExisting').checked;
        setTimeout(() => runAiBatch(mode, targets.map(r => r.uniqueId), prompt, skip), 0);   // 이 모달이 닫힌 뒤 진행 화면을 엶
        return true;
      }
    });
    setupPromptLibrary(mode);
    return done;
  }

  /**
   * AI 창의 '프롬프트 보관함' (구글 시트 [프롬프트]에 보관)
   *  - 고르면 입력칸에 불러오고, 이름을 붙여 저장하면 같은 이름은 덮어쓰고 새 이름은 새 줄로 추가합니다.
   *  - 확인 창을 따로 띄우면 AI 창이 닫히므로, 안내는 창 안의 글줄로 보여 주고 삭제는 두 번 눌러야 합니다.
   */
  function setupPromptLibrary(mode) {
    const box = { prompts: [], ready: false, deleteArmed: false, timer: null };
    const select = $('promptSelect');
    const nameInput = $('promptName');
    const saveBtn = $('promptSave');
    const deleteBtn = $('promptDelete');
    const note = $('promptNote');

    const setNote = (text, tone) => {
      note.textContent = text;
      note.className = 'mt-1.5 text-xs ' + (tone === 'error' ? 'font-semibold text-stamp' : tone === 'ok' ? 'font-semibold text-board' : 'text-ink-muted');
    };
    const indexOfName = name => box.prompts.findIndex(p => p.name === name.trim());
    const disarmDelete = () => {
      box.deleteArmed = false;
      clearTimeout(box.timer);
      deleteBtn.textContent = '삭제';
    };
    const refreshButtons = () => {
      const name = nameInput.value.trim();
      saveBtn.disabled = !box.ready || !name;
      saveBtn.textContent = name && indexOfName(name) > -1 ? '같은 이름에 덮어쓰기' : '보관함에 저장';
      deleteBtn.disabled = !box.ready || select.value === '';
    };
    const render = selectName => {
      const placeholder = !box.ready ? '보관함을 쓸 수 없어요'
        : box.prompts.length ? `저장된 프롬프트 ${box.prompts.length}개 중 고르기` : '아직 저장된 프롬프트가 없어요';
      select.innerHTML = `<option value="">${placeholder}</option>` +
        box.prompts.map((p, i) => `<option value="${i}">${esc(p.name)}${p.type === '공통' ? ' (공통)' : ''}</option>`).join('');
      select.disabled = !box.ready || !box.prompts.length;
      const index = selectName ? indexOfName(selectName) : -1;
      select.value = index > -1 ? String(index) : '';
      disarmDelete();
      refreshButtons();
    };
    const call = async (fn, ...args) => {
      try {
        return await callServer(fn, sessionToken, ...args);
      } catch (err) {
        const msg = errText(err);
        if (msg.indexOf('SESSION_EXPIRED') > -1) { handleSessionExpired(); return null; }
        setNote(msg || '서버와 연결하지 못했어요.', 'error');
        return null;
      }
    };
    const applyList = res => {
      box.ready = !!res.ready;
      box.prompts = res.prompts || [];
    };

    select.addEventListener('change', () => {
      disarmDelete();
      const p = box.prompts[Number(select.value)];
      if (select.value !== '' && p) {
        $('aiPrompt').value = p.text;
        nameInput.value = p.name;
        setNote(`'${p.name}' 프롬프트를 불러왔어요.${p.updatedAt ? ` (마지막 저장 ${p.updatedAt})` : ''}`, 'ok');
      }
      refreshButtons();
    });
    nameInput.addEventListener('input', refreshButtons);
    nameInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!saveBtn.disabled) saveBtn.click();
    });

    saveBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const text = $('aiPrompt').value.trim();
      if (!name) return setNote('보관함에 저장할 이름을 입력하세요.', 'error');
      if (!text) return setNote('프롬프트 내용을 입력하세요.', 'error');
      saveBtn.disabled = true;
      setNote('보관함에 저장하는 중이에요.');
      const res = await call('savePrompt', mode, name, text);
      if (!res) return refreshButtons();
      if (!res.success) { setNote(res.message, 'error'); return refreshButtons(); }
      applyList(res);
      render(name);
      setNote(res.message, 'ok');
    });

    deleteBtn.addEventListener('click', async () => {
      const p = box.prompts[Number(select.value)];
      if (select.value === '' || !p) return;
      if (!box.deleteArmed) {
        box.deleteArmed = true;
        deleteBtn.textContent = '한 번 더 누르면 삭제';
        setNote(`'${p.name}' 프롬프트를 시트에서 지우려면 한 번 더 누르세요.`, 'error');
        box.timer = setTimeout(() => { disarmDelete(); refreshButtons(); }, 4000);
        return;
      }
      disarmDelete();
      deleteBtn.disabled = true;
      const res = await call('deletePrompt', mode, p.name);
      if (!res) return refreshButtons();
      if (!res.success) { setNote(res.message, 'error'); return refreshButtons(); }
      applyList(res);
      if (nameInput.value.trim() === p.name) nameInput.value = '';
      render('');
      setNote(res.message, 'ok');
    });

    // 창을 열 때마다 시트에서 새로 불러옵니다. (시트에서 직접 고친 내용도 반영)
    setNote('보관함을 불러오는 중이에요.');
    call('getPrompts', mode).then(res => {
      if (!res || !document.body.contains(select)) return;   // 그사이 창이 닫혔으면 그만
      if (!res.success) return setNote(res.message, 'error');
      applyList(res);
      render('');
      if (res.ready) setNote('고르면 아래 입력칸에 불러와요. 새로 쓰거나 고친 뒤 이름을 붙여 저장할 수 있어요. (구글 시트 [프롬프트]에 보관)');
      else setNote(res.message, 'error');
    });
  }

  /** 선택한 글을 한 개씩 서버로 보내고, AI에 보낸 뒤에는 [환경설정]의 요청 간격만큼 기다립니다. */
  async function runAiBatch(mode, ids, prompt, skipExisting) {
    const cfg = AI_MODES[mode];
    const job = { cancel: false };
    aiJob = job;
    const total = ids.length;
    const queue = ids.slice();
    const tries = {};
    const stats = { done: 0, skipped: 0, failed: [] };
    let fatalMessage = '';

    openModal({
      wide: true, locked: true,
      title: cfg.runningTitle,
      html: `
        <div class="mt-4">
          <div class="flex items-baseline justify-between gap-3 text-sm">
            <span id="aiStatus" class="font-semibold">준비하는 중</span>
            <strong id="aiCount" class="shrink-0">0 / ${total}</strong>
          </div>
          <div class="mt-2 h-2 overflow-hidden rounded-full bg-page">
            <div id="aiBar" class="h-full rounded-full bg-board transition-all duration-300" style="width:0%"></div>
          </div>
          <p class="mt-3 text-xs text-ink-muted">이 창을 닫거나 새로고침하면 멈춰요. 이미 저장된 글은 그대로 남아요.</p>
          <div id="aiResult" class="mt-4 hidden"></div>
        </div>`,
      buttons: [{ text: '중지', value: 'stop', variant: 'ghost' }],
      beforeClose: value => {
        if (value !== 'stop') return true;
        job.cancel = true;
        $('aiStatus').textContent = '지금 보낸 글까지만 처리하고 멈출게요';
        return false;
      }
    });

    const update = status => {
      const processed = stats.done + stats.skipped + stats.failed.length;
      if (status && !job.cancel) $('aiStatus').textContent = status;
      $('aiCount').textContent = `${processed} / ${total}`;
      $('aiBar').style.width = `${Math.round(processed / total * 100)}%`;
    };

    while (queue.length && !job.cancel) {
      const id = queue.shift();
      update(`AI가 ${cfg.label}을 쓰는 중이에요`);
      let res;
      try {
        res = await callServer('generateAiText', sessionToken, mode, [id], prompt, skipExisting);
      } catch (err) {
        const msg = errText(err);
        if (msg.indexOf('SESSION_EXPIRED') > -1) { aiJob = null; handleSessionExpired(); return; }
        fatalMessage = msg || '서버와 연결하지 못했어요.';
        queue.unshift(id);
        break;
      }
      if (!res.success) {
        fatalMessage = res.message;
        queue.unshift(id);
        break;
      }
      if (typeof res.intervalSec === 'number') aiIntervalSec = res.intervalSec;   // [환경설정]에서 바꾼 간격을 바로 반영
      let limited = false;
      res.results.forEach(r => {
        if (r.status === 'done') {
          stats.done++;
          const rec = adminAllData.find(x => x.uniqueId === r.uniqueId);
          if (rec) rec[cfg.field] = r.text;
        } else if (r.status === 'skipped') {
          stats.skipped++;
        } else if (r.fatal) {
          fatalMessage = r.message;
          queue.unshift(r.uniqueId);
        } else if (r.retryable && (tries[r.uniqueId] || 0) < AI_MAX_RETRY) {
          tries[r.uniqueId] = (tries[r.uniqueId] || 0) + 1;
          queue.push(r.uniqueId);
          limited = true;
        } else {
          stats.failed.push({ id: r.uniqueId, message: r.message });
        }
      });
      update();
      if (fatalMessage) break;
      if (!queue.length || !res.requested) continue;   // 남은 글이 없거나 AI에 보내지 않았으면(건너뜀) 기다리지 않음
      const wait = limited ? Math.max(AI_RETRY_WAIT_SEC, aiIntervalSec) : aiIntervalSec;
      if (wait > 0) {
        await aiWait(job, wait, sec => update(limited
          ? `요청이 몰려서 ${sec}초 기다렸다가 이어서 할게요`
          : `요청 간격을 지키는 중이에요 (${sec}초 뒤 다음 글)`));
      }
    }

    if (aiJob === job) aiJob = null;
    finishAiBatch(mode, { stats: stats, total: total, leftover: queue, fatalMessage: fatalMessage, cancelled: job.cancel });
  }

  async function aiWait(job, seconds, onTick) {
    for (let s = seconds; s > 0; s--) {
      if (job.cancel) return;
      onTick(s);
      await new Promise(resolve => setTimeout(resolve, 1000));
    }
  }

  /** AI 작업이 끝났을 때: 결과 요약을 보여 주고, 실패한 글은 다시 시도하기 쉽게 선택한 채로 둡니다. */
  function finishAiBatch(mode, o) {
    const cfg = AI_MODES[mode];
    const failedIds = o.stats.failed.map(f => f.id);
    const label = id => {
      const rec = adminAllData.find(r => r.uniqueId === id);
      return rec ? `${rec.studentId} 학생 (${formatDateKo(rec.date)})` : id;
    };
    const parts = [`저장 ${o.stats.done}개`];
    if (o.stats.skipped) parts.push(`건너뜀 ${o.stats.skipped}개`);
    if (failedIds.length) parts.push(`실패 ${failedIds.length}개`);
    if (o.leftover.length) parts.push(`처리 안 함 ${o.leftover.length}개`);

    $('aiStatus').textContent = parts.join(', ');
    const box = $('aiResult');
    box.classList.remove('hidden');
    box.innerHTML = `
      ${o.fatalMessage ? `<p class="rounded-lg bg-stamp-soft px-3 py-2 text-sm font-semibold text-stamp">${esc(o.fatalMessage)}</p>` : ''}
      ${failedIds.length ? `<ul class="mt-2 max-h-40 list-disc space-y-1 overflow-y-auto pl-5 text-sm">${o.stats.failed.map(f => `<li><b>${esc(label(f.id))}</b> ${esc(f.message)}</li>`).join('')}</ul>` : ''}
      ${failedIds.length || o.leftover.length ? `<p class="mt-2 text-xs text-ink-muted">실패했거나 처리하지 못한 글은 선택한 채로 남겨 뒀어요. 잠시 뒤 [${esc(cfg.buttonLabel)}] 버튼을 다시 누르면 이어서 할 수 있어요.</p>` : ''}`;

    selectedIds = new Set(failedIds.concat(o.leftover));
    updateModal({
      title: o.fatalMessage ? `${cfg.title}을 끝까지 하지 못했어요` : (o.cancelled ? `${cfg.title}을 멈췄어요` : cfg.doneTitle),
      buttons: [{ text: '닫기', value: true, variant: 'primary' }],
      locked: false,
      beforeClose: null
    });
    updateAdminSummary();
    renderCurrentTable();
  }

  // ───────── 학생별 교사 시점 글 모아 보기 · 엑셀 받기 ─────────
  /**
   * 교사 시점 글이 있는 소감문을 학생별로 묶습니다.
   *  - 조건: 학번 앞부분(prefix), 활동 날짜 범위(from ~ to, 시작일·종료일 당일 포함, 비어 있으면 제한 없음)
   *  - 정렬: 명단 순서(명단에 없는 학번은 뒤에), 학생 안에서는 날짜순
   */
  function groupTeacherViews(filter) {
    const f = Object.assign({ prefix: '', from: '', to: '' }, filter);
    const order = new Map(allStudentsList.map((id, i) => [id, i]));
    const groups = new Map();
    adminAllData
      .filter(r => r.teacherView && r.teacherView.trim())
      .filter(r => !f.prefix || r.studentId.startsWith(f.prefix))
      .filter(r => (!f.from || r.date >= f.from) && (!f.to || r.date <= f.to))   // 날짜는 'YYYY-MM-DD' 글자라 크기 비교가 곧 날짜 비교
      .forEach(r => {
        if (!groups.has(r.studentId)) groups.set(r.studentId, []);
        groups.get(r.studentId).push(r);
      });
    return Array.from(groups.entries())
      .map(([id, items]) => ({ id: id, items: items.slice().sort((a, b) => a.date.localeCompare(b.date)) }))
      .sort((a, b) => {
        const oa = order.has(a.id) ? order.get(a.id) : Number.MAX_SAFE_INTEGER;
        const ob = order.has(b.id) ? order.get(b.id) : Number.MAX_SAFE_INTEGER;
        return oa !== ob ? oa - ob : a.id.localeCompare(b.id);
      });
  }

  /** '2026-03-01' → '2026.3.1' (기간 안내용) */
  function dotDateKo(date) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || '');
    return m ? `${m[1]}.${Number(m[2])}.${Number(m[3])}` : (date || '');
  }

  /** '2026-03-12' → '3월 12일' */
  function shortDateKo(date) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || '');
    return m ? `${Number(m[2])}월 ${Number(m[3])}일` : (date || '');
  }

  /** 교사 시점 글 하나를 한 줄로: 줄바꿈과 겹친 공백을 띄어쓰기 한 칸으로 바꿉니다. */
  function oneLine(text) {
    return String(text || '').replace(/\s+/g, ' ').trim();
  }

  /** 학생 한 명의 교사 시점 글을 날짜순으로 이어 붙입니다. (웹 표·복사·엑셀 공통: 활동 이름 없이, 글 사이는 띄어쓰기 한 칸) */
  function joinTeacherViews(items) {
    return items.map(r => oneLine(r.teacherView)).filter(Boolean).join(' ');
  }

  function openTeacherViewCollection() {
    const done = openModal({
      wide: 'xl',
      title: '학생별 교사 시점 글',
      html: `
        <div class="mt-3">
          <div class="flex flex-wrap items-end gap-x-3 gap-y-2">
            <div class="min-w-[280px] flex-[2]">
              <div class="flex items-end justify-between gap-2">
                <span class="field-label">활동 날짜</span>
                <button id="tvAllDates" type="button" class="text-xs font-bold text-board underline underline-offset-2">전체 기간으로</button>
              </div>
              <div class="flex items-center gap-2">
                <input id="tvFrom" type="date" aria-label="활동 시작일" data-enter="off" class="field" value="${esc(tvRange.from)}">
                <span class="mt-1.5 shrink-0 text-ink-muted" aria-hidden="true">~</span>
                <input id="tvTo" type="date" aria-label="활동 종료일" data-enter="off" class="field" value="${esc(tvRange.to)}">
              </div>
            </div>
            <div class="min-w-[160px] flex-1">
              <label class="field-label" for="tvFilter">학번으로 좁히기</label>
              <input id="tvFilter" type="search" inputmode="numeric" data-enter="off" class="field" placeholder="학번 앞부분 (예: 11)">
            </div>
            <button id="tvDownload" type="button" onclick="downloadTeacherViews()" class="btn btn-primary h-[50px] px-4">엑셀 다운로드</button>
          </div>
          <p class="mt-1.5 text-xs text-ink-muted">시작일과 종료일 당일 활동도 포함해요. 날짜를 비워 두면 전체 기간의 글을 모아요.</p>
          <p id="tvSummary" class="mt-3 text-sm font-semibold text-ink-muted"></p>
          <div id="tvList" class="mt-2"></div>
        </div>`,
      buttons: [{ text: '닫기', value: true, variant: 'ghost' }]
    });
    ['tvFrom', 'tvTo', 'tvFilter'].forEach(id => $(id).addEventListener('input', renderTeacherViewList));
    ['tvFrom', 'tvTo'].forEach(id => $(id).addEventListener('change', renderTeacherViewList));
    $('tvAllDates').addEventListener('click', () => {
      $('tvFrom').value = '';
      $('tvTo').value = '';
      renderTeacherViewList();
    });
    renderTeacherViewList();
    return done;
  }

  /** 모아 보기 창의 조건: 학번 앞부분, 활동 시작일, 활동 종료일 */
  function readTvFilter() {
    return { prefix: $('tvFilter').value.trim(), from: $('tvFrom').value, to: $('tvTo').value };
  }

  function renderTeacherViewList() {
    const f = readTvFilter();
    tvRange = { from: f.from, to: f.to };
    const badRange = !!(f.from && f.to && f.from > f.to);
    tvGroups = badRange ? [] : groupTeacherViews(f);
    const count = tvGroups.reduce((n, g) => n + g.items.length, 0);
    const conditions = [];
    if (f.from || f.to) conditions.push(`활동 ${f.from ? dotDateKo(f.from) : '처음'} ~ ${f.to ? dotDateKo(f.to) : '끝'}`);
    if (f.prefix) conditions.push(`학번 '${f.prefix}'로 시작`);
    $('tvSummary').textContent = tvGroups.length
      ? `학생 ${tvGroups.length}명, 글 ${count}건${conditions.length ? ` (${conditions.join(', ')})` : ''}`
      : '';
    $('tvDownload').disabled = !tvGroups.length;

    if (!tvGroups.length) {
      const message = badRange ? '시작일이 종료일보다 늦어요. 활동 날짜를 다시 골라 주세요.'
        : conditions.length ? `고른 조건(${conditions.join(', ')})에 맞는 교사 시점 글이 없어요.`
        : '아직 교사 시점으로 바꾼 글이 없어요. 표에서 글을 선택하고 [교사 시점 일괄 변환]을 눌러 보세요.';
      $('tvList').innerHTML = `<p class="rounded-xl border border-dashed ${badRange ? 'border-stamp/60 text-stamp' : 'border-line text-ink-muted'} px-4 py-10 text-center text-sm font-semibold">${esc(message)}</p>`;
      return;
    }

    // 엑셀의 '학생별 모음' 시트와 같은 모양: 학번 | 교사 시점 글 | 글 수 (맨 오른쪽 복사 버튼은 화면에만)
    $('tvList').innerHTML = `
      <div class="max-h-[55vh] overflow-auto rounded-xl border border-line">
        <table class="w-full min-w-[600px] text-sm">
          <thead>
            <tr>
              <th class="th sticky top-0 z-10 w-24" style="background:#E9EFEC">학번</th>
              <th class="th sticky top-0 z-10" style="background:#E9EFEC">교사 시점 글</th>
              <th class="th sticky top-0 z-10 w-16 text-center" style="background:#E9EFEC">글 수</th>
              <th class="th sticky top-0 z-10 w-20" style="background:#E9EFEC"><span class="sr-only">복사</span></th>
            </tr>
          </thead>
          <tbody>
            ${tvGroups.map((g, gi) => `
            <tr>
              <td class="td font-bold">${esc(g.id)}</td>
              <td class="td break-words leading-relaxed">${esc(joinTeacherViews(g.items))}</td>
              <td class="td text-center">${g.items.length}</td>
              <td class="td text-center"><button type="button" onclick="copyTeacherViews(${gi})" class="btn btn-ghost btn-sm">복사</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  async function copyTeacherViews(index) {
    const group = tvGroups[index];
    if (!group) return;
    const copied = await copyText(joinTeacherViews(group.items));
    showToast(copied ? `${group.id} 학생의 글을 복사했어요.` : '복사하지 못했어요. 글을 직접 선택해 복사해 주세요.', !copied);
  }

  /** 클립보드 복사: 새 방식이 막혀 있으면 예전 방식으로 한 번 더 시도합니다. */
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) { /* 아래 방식으로 다시 시도 */ }
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
    area.remove();
    return copied;
  }

  /** 지금 창에 보이는 학생들의 교사 시점 글을 엑셀 파일로 내려받습니다. (고른 기간·학번 조건 그대로, 시트 2개: 학생별 모음, 활동별 상세) */
  function downloadTeacherViews() {
    if (!tvGroups.length) return;
    const f = readTvFilter();
    const summaryRows = tvGroups.map(g => [g.id, joinTeacherViews(g.items), g.items.length]);
    const detailRows = [];
    tvGroups.forEach(g => g.items.forEach(r => detailRows.push([g.id, r.date, r.activity, oneLine(r.teacherView)])));
    const bytes = buildXlsx([
      { name: '학생별 모음', columns: [{ header: '학번', width: 10 }, { header: '교사 시점 글', width: 100 }, { header: '글 수', width: 8 }], rows: summaryRows },
      { name: '활동별 상세', columns: [{ header: '학번', width: 10 }, { header: '날짜', width: 12 }, { header: '창체활동', width: 24 }, { header: '교사 시점 글', width: 90 }], rows: detailRows }
    ]);
    const range = f.from || f.to ? `_${f.from || '처음'}~${f.to || '끝'}` : '';
    const prefix = f.prefix.replace(/[^0-9A-Za-z가-힣]/g, '');
    downloadFile(bytes, `교사시점_글_모음${range}${prefix ? '_' + prefix : ''}_${todayStamp()}.xlsx`,
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    showToast(`엑셀 파일을 내려받았어요. (학생 ${tvGroups.length}명)`);
  }

  function todayStamp() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function downloadFile(bytes, filename, mime) {
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  /**
   * 엑셀(.xlsx) 파일 만들기: 외부 라이브러리 없이 브라우저에서 직접 만듭니다.
   * xlsx는 XML 파일 몇 개를 ZIP으로 묶은 형식이라, 필요한 XML을 만들고 압축하지 않은 ZIP으로 묶습니다.
   * sheets: [{ name, columns: [{ header, width }], rows: [[셀 값, ...]] }]
   *  - 글자는 텍스트 셀(학번 앞자리 0 보존, 줄바꿈 표시), 숫자는 숫자 셀로 넣습니다.
   */
  function buildXlsx(sheets) {
    const xml = v => String(v == null ? '' : v)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')   // XML에 넣을 수 없는 제어 문자 제거
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const colName = index => {
      let name = '';
      for (let n = index + 1; n > 0; n = Math.floor((n - 1) / 26)) name = String.fromCharCode(65 + (n - 1) % 26) + name;
      return name;
    };
    // 셀 모양 번호: 0 기본, 1 머리 줄(굵게·연녹색), 2 본문 글자(위쪽 정렬·줄바꿈), 3 본문 숫자(위쪽 정렬)
    const cell = (value, ref, header) => {
      if (!header && typeof value === 'number' && isFinite(value)) return `<c r="${ref}" s="3"><v>${value}</v></c>`;
      return `<c r="${ref}" t="inlineStr" s="${header ? 1 : 2}"><is><t xml:space="preserve">${xml(value)}</t></is></c>`;
    };
    // 주의: 이 파일은 앱스스크립트 HTML 템플릿으로 읽혀서, 꺾쇠('<') 바로 뒤에 물음표가 오면 서버 코드 표시로 오해합니다.
    //       그래서 XML 선언 글자를 나눠서 이어 붙입니다.
    const head = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?' + '>\n';
    // 주의: 앱스스크립트가 화면 코드를 보낼 때 슬래시 두 개 뒤를 주석으로 여겨 지우는 경우가 있어서,
    //       XML 주소 속 슬래시 두 개를 코드에 그대로 쓰지 않고 조립합니다. (만들어지는 주소 값은 똑같아요)
    const OOXML = ['http:', '', 'schemas.openxmlformats.org'].join('/');
    const NS_MAIN = OOXML + '/spreadsheetml/2006/main';
    const REL = OOXML + '/officeDocument/2006/relationships';
    const sheetXml = sheet => head +
      `<worksheet xmlns="${NS_MAIN}">` +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      `<cols>${sheet.columns.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.width || 12}" customWidth="1"/>`).join('')}</cols>` +
      '<sheetData>' +
      `<row r="1">${sheet.columns.map((c, i) => cell(c.header, colName(i) + '1', true)).join('')}</row>` +
      sheet.rows.map((row, r) => `<row r="${r + 2}">${row.map((v, i) => cell(v, colName(i) + (r + 2), false)).join('')}</row>`).join('') +
      '</sheetData></worksheet>';

    const files = [
      ['[Content_Types].xml', head +
        `<Types xmlns="${OOXML}/package/2006/content-types">` +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
        '</Types>'],
      ['_rels/.rels', head +
        `<Relationships xmlns="${OOXML}/package/2006/relationships">` +
        `<Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/>` +
        '</Relationships>'],
      ['xl/workbook.xml', head +
        `<workbook xmlns="${NS_MAIN}" xmlns:r="${REL}">` +
        `<sheets>${sheets.map((s, i) => `<sheet name="${xml(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>` +
        '</workbook>'],
      ['xl/_rels/workbook.xml.rels', head +
        `<Relationships xmlns="${OOXML}/package/2006/relationships">` +
        sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
        `<Relationship Id="rId${sheets.length + 1}" Type="${REL}/styles" Target="styles.xml"/>` +
        '</Relationships>'],
      ['xl/styles.xml', head +
        `<styleSheet xmlns="${NS_MAIN}">` +
        '<fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/><family val="2"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/><family val="2"/></font></fonts>' +
        '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFE1EBE6"/><bgColor indexed="64"/></patternFill></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="4">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
        '<xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf>' +
        '</cellXfs>' +
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
        '</styleSheet>']
    ];
    sheets.forEach((s, i) => files.push([`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s)]));
    const encoder = new TextEncoder();
    return zipStore(files.map(([name, text]) => ({ name: name, data: encoder.encode(text) })));
  }

  /** 압축하지 않는(store) ZIP 만들기: 파일마다 [로컬 헤더 + 내용], 끝에 [목록(중앙 디렉터리) + 끝 표시] */
  function zipStore(entries) {
    if (!zipStore.table) {
      zipStore.table = Array.from({ length: 256 }, (_, n) => {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
        return c >>> 0;
      });
    }
    const crc32 = bytes => {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) c = zipStore.table[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    };
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const encoder = new TextEncoder();
    const parts = [];
    const directory = [];
    let offset = 0;
    entries.forEach(entry => {
      const name = encoder.encode(entry.name);
      const crc = crc32(entry.data);
      const size = entry.data.length;
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);    // 로컬 헤더 표시
      local.setUint16(4, 20, true);            // 풀 때 필요한 버전
      local.setUint16(6, 0x0800, true);        // 파일 이름 UTF-8
      local.setUint16(8, 0, true);             // 압축 안 함
      local.setUint16(10, dosTime, true);
      local.setUint16(12, dosDate, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, size, true);
      local.setUint32(22, size, true);
      local.setUint16(26, name.length, true);
      local.setUint16(28, 0, true);
      parts.push(new Uint8Array(local.buffer), name, entry.data);

      const central = new DataView(new ArrayBuffer(46));
      central.setUint32(0, 0x02014b50, true);  // 중앙 디렉터리 표시
      central.setUint16(4, 20, true);
      central.setUint16(6, 20, true);
      central.setUint16(8, 0x0800, true);
      central.setUint16(10, 0, true);
      central.setUint16(12, dosTime, true);
      central.setUint16(14, dosDate, true);
      central.setUint32(16, crc, true);
      central.setUint32(20, size, true);
      central.setUint32(24, size, true);
      central.setUint16(28, name.length, true);
      central.setUint32(42, offset, true);     // 이 파일의 로컬 헤더 위치
      directory.push(new Uint8Array(central.buffer), name);
      offset += 30 + name.length + size;
    });
    const directorySize = directory.reduce((n, part) => n + part.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);        // 끝 표시
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, directorySize, true);
    end.setUint32(16, offset, true);
    const all = parts.concat(directory, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((n, part) => n + part.length, 0));
    let pos = 0;
    all.forEach(part => { out.set(part, pos); pos += part.length; });
    return out;
  }

  async function addSetting() {
    const date = $('newSettingDate').value;
    const activity = $('newSettingActivity').value.trim();
    if (!date || !activity) return showAlert('활동 날짜와 활동명을 모두 입력하세요.', { title: '비어 있는 칸이 있어요' });
    const btn = $('addSettingBtn');
    setBtnBusy(btn, true, '추가하는 중');
    const res = await request('addSetting', [sessionToken, date, activity]);
    setBtnBusy(btn, false);
    if (!res) return;
    if (!res.success) return showAlert(res.message, { title: '활동을 추가하지 못했어요' });
    showToast(res.message);
    $('newSettingActivity').value = '';
    loadAdminData();
  }

  /** 학생 비밀번호 초기화 (prompt 대신 명단에서 고르는 모달) */
  function resetStudentPassword() {
    if (!allStudentsList.length) {
      return showAlert('학생 명단이 비어 있어요. 구글 시트 [환경설정]의 학번 열에 학번을 먼저 입력하세요.', { title: '초기화할 학생이 없어요' });
    }
    const options = allStudentsList.map(id => `<option value="${esc(id)}">${esc(id)}</option>`).join('');
    return openModal({
      title: '학생 비밀번호 초기화',
      message: `고른 학생의 비밀번호를 초기 비밀번호${usesFallbackPassword ? '(1234)' : ''}로 되돌려요. 로그인 잠금도 함께 풀려요.`,
      html: `
        <div class="mt-4">
          <label class="field-label" for="resetTarget">학생</label>
          <select id="resetTarget" class="field"><option value="">학생을 고르세요</option>${options}</select>
          <p id="resetError" class="mt-2 hidden text-sm font-semibold text-stamp"></p>
        </div>`,
      buttons: [{ text: '취소', value: false, variant: 'ghost' }, { text: '비밀번호 초기화', value: true, variant: 'yellow' }],
      dismissValue: false,
      beforeClose: async () => {
        const id = $('resetTarget').value;
        if (!id) return fieldError('resetError', '초기화할 학생을 고르세요.');
        const res = await request('adminResetPassword', [sessionToken, id]);
        if (!res) return false;
        if (!res.success) return fieldError('resetError', res.message);
        showToast(res.message);
        return true;
      }
    });
  }
</script>
