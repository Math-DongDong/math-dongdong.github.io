<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body { height: 100%; margin: 0; }
    /* 얇은 세로 스크롤바 */
    .thin-scroll::-webkit-scrollbar { width: 6px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-white text-slate-800 font-sans">

  <div class="h-full flex flex-col">

    <!-- ================= 상단 안내 ================= -->
    <div class="px-5 pt-3 pb-3 border-b border-slate-100 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg shrink-0">
        <i class="fa-solid fa-people-arrows"></i>
      </div>
      <div>
        <p class="text-sm font-bold text-slate-800 leading-tight">함께 앉으면 곤란한 친구들을 자연스럽게 떨어뜨립니다</p>
        <p class="text-[11px] text-slate-400 mt-0.5 leading-snug">
          웹 앱의 [랜덤 배치 시작!]에만 조용히 적용되며,<br>
          <span class="text-emerald-600 font-semibold"><i class="fa-solid fa-eye-slash"></i> 웹 앱 화면에는 규칙이나 결과가 전혀 표시되지 않습니다.</span>
        </p>
      </div>
    </div>

    <!-- ================= 로딩 화면 ================= -->
    <div id="loadingView" class="flex-1 flex flex-col items-center justify-center gap-3 text-slate-400 text-sm">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-rose-500"></i>
      학생 명단과 규칙을 불러오는 중...
    </div>

    <!-- ================= 본문 (스크롤) ================= -->
    <div id="mainView" class="hidden flex-1 overflow-y-auto thin-scroll px-5 py-4 space-y-5">

      <!-- 최근 랜덤 배치 결과 (교사만 보는 곳) -->
      <section id="lastCheckCard" class="hidden"></section>

      <!-- 새 규칙 만들기 -->
      <section class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-4">
        <div class="flex items-center gap-1.5 text-xs font-extrabold text-slate-700">
          <i class="fa-solid fa-plus text-rose-500"></i> 새 규칙 만들기
        </div>

        <!-- ① 학생 선택 -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold text-slate-600">① 서로 떨어뜨릴 학생 <span class="text-slate-400 font-medium">(2명 이상)</span></label>
            <span class="text-[11px] font-bold text-rose-600"><span id="ruleSelCount">0</span>명 선택</span>
          </div>
          <div id="ruleSelectedSummary" class="flex flex-wrap gap-1 mb-2 min-h-[24px] items-center"></div>
          <div class="relative mb-2">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="ruleStudentSearch" oninput="renderStudentChips()" placeholder="이름 또는 번호로 검색"
              class="w-full pl-8 pr-3 py-2 border border-slate-300 rounded-xl text-xs font-medium bg-white focus:ring-2 focus:ring-rose-400 focus:outline-none">
          </div>
          <div id="ruleStudentChips" class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto thin-scroll p-0.5"></div>
        </div>

        <!-- ② 금지 방향 (알약 다중 선택 + 미니 미리보기) -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">② 붙어 앉으면 안 되는 방향 <span class="text-slate-400 font-medium">(여러 개 선택 가능)</span></label>
          <div class="flex items-center gap-3">
            <div id="ruleDirPills" class="flex flex-wrap gap-1.5 flex-1"></div>
            <div class="shrink-0 text-center">
              <div id="ruleDirPreview" class="grid grid-cols-3 gap-[3px]"></div>
              <div class="text-[9px] text-slate-400 mt-1">빨간 칸 = 금지</div>
            </div>
          </div>
        </div>

        <p id="ruleFormMsg" class="hidden"></p>

        <button onclick="addRuleFromForm()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> 규칙 추가
        </button>
      </section>

      <!-- 등록된 규칙 목록 -->
      <section>
        <div class="flex justify-between items-center mb-2">
          <h4 class="text-xs font-extrabold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-list-check text-indigo-600"></i> 등록된 분리 규칙 (<span id="ruleListCount">0</span>)
          </h4>
          <span class="text-[10px] text-slate-400">방향 알약을 눌러 바로 수정</span>
        </div>
        <div id="ruleListContainer" class="space-y-2"></div>
      </section>
    </div>

    <!-- ================= 하단 버튼 ================= -->
    <div class="px-5 py-3 border-t border-slate-100 bg-white">
      <p id="dirtyHint" class="hidden text-[11px] text-amber-600 font-semibold mb-2 text-center">
        <i class="fa-solid fa-circle-exclamation"></i> 저장하지 않은 변경사항이 있습니다
      </p>
      <div class="flex gap-2">
        <button onclick="requestClose()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">닫기</button>
        <button id="btnSave" onclick="saveRules()" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i> 저장하기
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 공용 커스텀 모달 (알림 / 확인) ================= -->
  <div id="dialogModal" class="fixed inset-0 bg-slate-900/40 hidden z-50 flex items-center justify-center p-5">
    <div id="dialogBox" class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center transform scale-95 transition-all duration-200">
      <div id="dialogIcon" class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"></div>
      <h3 id="dialogTitle" class="text-lg font-bold text-slate-800 mb-1"></h3>
      <p id="dialogMessage" class="text-xs text-slate-500 leading-relaxed mb-6 whitespace-pre-line"></p>
      <div id="dialogButtons" class="flex gap-2"></div>
    </div>
  </div>

  <!-- 하단 토스트 -->
  <div id="toast" class="hidden"></div>

  <script>
    // ==========================================================
    // 상수 / 상태
    // ==========================================================
    const DIR_ORDER = ['v', 'h', 'd'];
    const DIR_META = {
      v: { label: '상하',   icon: 'fa-arrows-up-down' },
      h: { label: '좌우',   icon: 'fa-arrows-left-right' },
      d: { label: '대각선', icon: 'fa-up-right-and-down-left-from-center' }
    };

    let students = [];          // 학생명단 시트의 학생
    let rules = [];             // 편집 중인 규칙 [{ids:[번호...], dirs:['v','h','d']}]
    let savedSnapshot = '[]';   // 마지막으로 저장된 상태 (변경 여부 비교용)
    let lastCheck = null;       // 최근 랜덤 배치 결과 {time, ruleCount, unmet:[{a,b,dir}]}
    let ruleSelectIds = [];     // [새 규칙 만들기]에서 고른 학생 번호
    let ruleDirs = ['v', 'h'];  // [새 규칙 만들기]에서 고른 방향 (기본: 상하·좌우)
    let toastTimer = null;
    let dialogActions = [];

    // ==========================================================
    // 초기 진입 : 학생 + 규칙 + 최근 결과 불러오기
    // ==========================================================
    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(data) {
          students = data.students || [];
          rules = (data.rules || []).map(r => ({ ids: r.ids.map(Number), dirs: r.dirs.slice() }));
          savedSnapshot = JSON.stringify(rules);
          lastCheck = data.lastCheck || null;

          document.getElementById('loadingView').classList.add('hidden');
          document.getElementById('mainView').classList.remove('hidden');
          renderLastCheck();
          renderStudentChips();
          renderDirPills();
          renderRuleList();
        })
        .withFailureHandler(function(err) {
          document.getElementById('loadingView').innerHTML = `
            <i class="fa-solid fa-triangle-exclamation text-2xl text-amber-500"></i>
            <div class="text-center px-6">데이터를 불러오지 못했습니다.<br>
            <span class="text-[11px]">${escapeHtml(err && err.message ? err.message : '')}</span></div>`;
        })
        .getAdvancedSettingsData();
    };

    // ==========================================================
    // 공용 유틸
    // ==========================================================
    function escapeHtml(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function findStudent(id) {
      return students.find(s => s.id == id) || null;
    }

    function studentLabel(id) {
      const st = findStudent(id);
      return st ? st.name : ('#' + id);
    }

    // 저장된 상태와 달라졌는지 확인해 하단 안내 표시
    function updateDirty() {
      const dirty = JSON.stringify(rules) !== savedSnapshot;
      document.getElementById('dirtyHint').classList.toggle('hidden', !dirty);
      return dirty;
    }

    // ==========================================================
    // 최근 랜덤 배치 결과 카드 (교사만 보는 곳)
    // ==========================================================
    function renderLastCheck() {
      const card = document.getElementById('lastCheckCard');
      const savedCount = JSON.parse(savedSnapshot).length;

      // 저장된 규칙이 없으면 결과 카드를 보여줄 필요 없음
      if (!savedCount) { card.className = 'hidden'; card.innerHTML = ''; return; }

      if (!lastCheck) {
        card.className = 'rounded-2xl border border-slate-200 bg-slate-50 p-3.5 text-xs text-slate-500 flex items-start gap-2';
        card.innerHTML = `<i class="fa-solid fa-clock mt-0.5 text-slate-400"></i>
          <div>아직 현재 규칙으로 랜덤 배치한 기록이 없습니다.<br>
          <span class="text-[11px] text-slate-400">웹 앱에서 [랜덤 배치 시작!]을 누른 뒤 이 창을 다시 열면 결과를 확인할 수 있어요.</span></div>`;
        return;
      }

      const unmet = lastCheck.unmet || [];
      if (!unmet.length) {
        card.className = 'rounded-2xl border border-emerald-200 bg-emerald-50 p-3.5 text-xs text-emerald-800 flex items-start gap-2';
        card.innerHTML = `<i class="fa-solid fa-circle-check mt-0.5 text-emerald-600"></i>
          <div><b>최근 랜덤 배치 (${escapeHtml(lastCheck.time)})</b><br>
          분리 규칙 ${lastCheck.ruleCount}개를 모두 지켜 배치했습니다.</div>`;
      } else {
        const lines = unmet.map(u =>
          `<li>${escapeHtml(u.a)} ↔ ${escapeHtml(u.b)} <span class="text-amber-600">(${escapeHtml(u.dir)})</span></li>`).join('');
        card.className = 'rounded-2xl border border-amber-200 bg-amber-50 p-3.5 text-xs text-amber-900 flex items-start gap-2';
        card.innerHTML = `<i class="fa-solid fa-triangle-exclamation mt-0.5 text-amber-500"></i>
          <div class="flex-1"><b>최근 랜덤 배치 (${escapeHtml(lastCheck.time)})</b><br>
          아래 ${unmet.length}쌍은 조건을 지키지 못했습니다.
          <ul class="list-disc pl-4 my-1.5 font-semibold space-y-0.5">${lines}</ul>
          <span class="text-[11px] text-amber-700">고정석·삭제한 책상·책상 간격을 조정하거나 금지 방향을 줄인 뒤, 웹 앱에서 [랜덤 배치]를 다시 눌러 주세요.</span></div>`;
      }
    }

    // ==========================================================
    // 커스텀 모달 / 토스트 (alert, confirm 대체)
    // ==========================================================
    /**
     * @param {object} o { type:'success'|'warning'|'info', title, message,
     *                     buttons:[{label, style:'primary'|'secondary'|'danger', onClick}] }
     */
    function showDialog(o) {
      const iconBox = document.getElementById('dialogIcon');
      const styles = {
        success: ['bg-emerald-100 text-emerald-600', 'fa-check'],
        warning: ['bg-amber-100 text-amber-600', 'fa-triangle-exclamation'],
        info:    ['bg-indigo-100 text-indigo-600', 'fa-circle-info']
      };
      const st = styles[o.type] || styles.info;
      iconBox.className = 'w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl ' + st[0];
      iconBox.innerHTML = `<i class="fa-solid ${st[1]}"></i>`;
      document.getElementById('dialogTitle').innerText = o.title || '알림';
      document.getElementById('dialogMessage').innerText = o.message || '';

      const btnStyle = {
        primary:   'bg-slate-900 hover:bg-slate-800 text-white shadow-md',
        secondary: 'bg-slate-100 hover:bg-slate-200 text-slate-700',
        danger:    'bg-red-600 hover:bg-red-700 text-white shadow-md'
      };
      const buttons = o.buttons && o.buttons.length ? o.buttons : [{ label: '확인', style: 'primary' }];
      dialogActions = buttons.map(b => b.onClick || null);
      document.getElementById('dialogButtons').innerHTML = buttons.map((b, i) =>
        `<button onclick="onDialogButton(${i})" class="flex-1 font-bold py-2.5 rounded-xl text-sm transition ${btnStyle[b.style || 'primary']}">${escapeHtml(b.label)}</button>`
      ).join('');

      const modal = document.getElementById('dialogModal');
      const box = document.getElementById('dialogBox');
      modal.classList.remove('hidden');
      setTimeout(() => { box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
    }

    function onDialogButton(i) {
      const fn = dialogActions[i];
      closeDialog();
      if (fn) fn();
    }

    function closeDialog() {
      const modal = document.getElementById('dialogModal');
      const box = document.getElementById('dialogBox');
      box.classList.remove('scale-100'); box.classList.add('scale-95');
      setTimeout(() => { modal.classList.add('hidden'); }, 150);
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      const color = type === 'success' ? 'bg-emerald-600' : (type === 'warning' ? 'bg-amber-500' : 'bg-slate-800');
      const icon = type === 'success' ? 'fa-circle-check' : (type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-info');
      t.className = 'fixed left-1/2 bottom-20 -translate-x-1/2 z-[70] px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold text-white flex items-center gap-2 max-w-[90vw] ' + color;
      t.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHtml(msg)}</span>`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.classList.add('hidden'); }, 2400);
    }

    // ==========================================================
    // ① 학생 선택 알약
    // ==========================================================
    function renderStudentChips() {
      const box = document.getElementById('ruleStudentChips');
      const q = document.getElementById('ruleStudentSearch').value.trim();

      if (!students.length) {
        box.innerHTML = `<div class="text-xs text-slate-400 py-3 w-full text-center leading-relaxed">
          학생명단 탭이 비어 있습니다.<br>학생명단 탭에 명단을 입력한 뒤 이 창을 다시 열어 주세요.</div>`;
      } else {
        const list = students.filter(s => !q || s.name.indexOf(q) !== -1 || String(s.id).indexOf(q) === 0);
        box.innerHTML = list.length ? list.map(s => {
          const on = ruleSelectIds.indexOf(s.id) !== -1;
          const cls = on
            ? 'bg-rose-600 border-rose-600 text-white shadow-sm'
            : 'bg-white border-slate-300 text-slate-600 hover:border-rose-300 hover:text-rose-600';
          return `<button type="button" onclick="toggleRuleStudent(${s.id})"
              class="px-2.5 py-1 rounded-full border text-[11px] font-bold transition flex items-center gap-1 ${cls}">
              ${on ? '<i class="fa-solid fa-check text-[9px]"></i>' : `<span class="text-slate-400 font-semibold">${s.id}</span>`}
              ${escapeHtml(s.name)}
            </button>`;
        }).join('') : '<div class="text-xs text-slate-400 py-3 w-full text-center">검색 결과가 없습니다.</div>';
      }
      renderSelectedSummary();
    }

    // 선택된 학생 요약 (× 로 빼기)
    function renderSelectedSummary() {
      const box = document.getElementById('ruleSelectedSummary');
      document.getElementById('ruleSelCount').innerText = ruleSelectIds.length;
      if (!ruleSelectIds.length) {
        box.innerHTML = '<span class="text-[11px] text-slate-400">아래에서 학생을 눌러 선택하세요.</span>';
        return;
      }
      box.innerHTML = ruleSelectIds.map(id => `
        <span class="inline-flex items-center gap-1 bg-rose-50 border border-rose-200 text-rose-700 text-[11px] font-bold pl-2 pr-1 py-0.5 rounded-full">
          ${escapeHtml(studentLabel(id))}
          <button type="button" onclick="toggleRuleStudent(${id})" class="w-4 h-4 rounded-full hover:bg-rose-200 flex items-center justify-center">
            <i class="fa-solid fa-xmark text-[9px]"></i>
          </button>
        </span>`).join('');
    }

    function toggleRuleStudent(id) {
      const i = ruleSelectIds.indexOf(id);
      if (i === -1) ruleSelectIds.push(id); else ruleSelectIds.splice(i, 1);
      hideFormMsg();
      renderStudentChips();
    }

    // ==========================================================
    // ② 방향 알약 + 3×3 미리보기
    // ==========================================================
    // 방향 알약 HTML (small=true 면 규칙 목록용 작은 크기)
    function dirPillHtml(code, on, handler, small) {
      const m = DIR_META[code];
      const size = small ? 'px-2 py-0.5 text-[10px]' : 'px-3 py-1.5 text-xs';
      const cls = on
        ? 'bg-rose-600 border-rose-600 text-white shadow-sm'
        : 'bg-white border-slate-300 text-slate-400 hover:text-slate-600 hover:border-slate-400';
      return `<button type="button" onclick="${handler}" class="rounded-full border font-bold transition flex items-center gap-1 ${size} ${cls}">
        <i class="fa-solid ${m.icon}"></i> ${m.label}</button>`;
    }

    function renderDirPills() {
      document.getElementById('ruleDirPills').innerHTML =
        DIR_ORDER.map(code => dirPillHtml(code, ruleDirs.indexOf(code) !== -1, `toggleRuleDir('${code}')`, false)).join('');
      renderDirPreview();
    }

    function toggleRuleDir(code) {
      const i = ruleDirs.indexOf(code);
      if (i === -1) ruleDirs.push(code); else ruleDirs.splice(i, 1);
      hideFormMsg();
      renderDirPills();
    }

    // 가운데 '나'를 기준으로 금지되는 칸을 빨갛게 표시
    function renderDirPreview() {
      const layout = ['d', 'v', 'd', 'h', 'me', 'h', 'd', 'v', 'd'];
      document.getElementById('ruleDirPreview').innerHTML = layout.map(k => {
        if (k === 'me') {
          return '<div class="w-7 h-5 rounded-[4px] bg-slate-800 text-white text-[9px] font-bold flex items-center justify-center">나</div>';
        }
        const blocked = ruleDirs.indexOf(k) !== -1;
        return `<div class="w-7 h-5 rounded-[4px] flex items-center justify-center text-[9px] transition ${blocked ? 'bg-rose-500 text-white' : 'bg-slate-200'}">
          ${blocked ? '<i class="fa-solid fa-xmark"></i>' : ''}</div>`;
      }).join('');
    }

    function showFormMsg(msg, type) {
      const el = document.getElementById('ruleFormMsg');
      el.className = 'text-[11px] font-semibold ' + (type === 'info' ? 'text-indigo-600' : 'text-red-500');
      el.innerHTML = `<i class="fa-solid ${type === 'info' ? 'fa-circle-info' : 'fa-circle-exclamation'}"></i> ${escapeHtml(msg)}`;
    }

    function hideFormMsg() {
      document.getElementById('ruleFormMsg').className = 'hidden';
    }

    // ==========================================================
    // 규칙 추가 / 수정 / 삭제
    // ==========================================================
    /**
     * [규칙 추가] : 검증 후 목록 맨 위에 추가
     * 같은 학생 묶음이 이미 있으면 새로 만들지 않고 방향만 합침
     */
    function addRuleFromForm() {
      if (ruleSelectIds.length < 2) { showFormMsg('떨어뜨릴 학생을 2명 이상 선택해 주세요.'); return false; }
      if (!ruleDirs.length) { showFormMsg('피해야 할 방향을 하나 이상 선택해 주세요.'); return false; }

      const ids = ruleSelectIds.slice().sort((a, b) => a - b);
      const dirs = DIR_ORDER.filter(d => ruleDirs.indexOf(d) !== -1);
      const key = ids.join(',');
      const dup = rules.find(r => r.ids.slice().sort((a, b) => a - b).join(',') === key);

      if (dup) {
        dup.dirs = DIR_ORDER.filter(d => dup.dirs.indexOf(d) !== -1 || dirs.indexOf(d) !== -1);
        showFormMsg('이미 있는 학생 묶음이라 방향만 합쳐 두었어요.', 'info');
      } else {
        rules.unshift({ ids: ids, dirs: dirs });
        hideFormMsg();
        showToast('규칙을 추가했어요. [저장하기]를 눌러 마무리하세요.', 'info');
      }

      ruleSelectIds = [];
      document.getElementById('ruleStudentSearch').value = '';
      renderStudentChips();
      renderRuleList();
      return true;
    }

    function renderRuleList() {
      const box = document.getElementById('ruleListContainer');
      document.getElementById('ruleListCount').innerText = rules.length;

      if (!rules.length) {
        box.innerHTML = `<div class="text-center py-6 text-xs text-slate-400 border border-dashed border-slate-200 rounded-xl">
          아직 등록된 분리 규칙이 없습니다.</div>`;
        updateDirty();
        return;
      }

      box.innerHTML = rules.map((r, idx) => {
        const names = r.ids.map(id => {
          const st = findStudent(id);
          return st
            ? `<span class="bg-slate-100 text-slate-700 text-[11px] font-bold px-2 py-0.5 rounded-full">${escapeHtml(st.name)}</span>`
            : `<span class="bg-slate-50 text-slate-400 text-[11px] font-semibold px-2 py-0.5 rounded-full border border-dashed border-slate-300">#${id} (명단 없음)</span>`;
        }).join('');
        const pills = DIR_ORDER.map(code =>
          dirPillHtml(code, r.dirs.indexOf(code) !== -1, `toggleRuleDirInList(${idx}, '${code}')`, true)).join('');

        return `<div class="border border-slate-200 rounded-xl p-3 bg-white">
          <div class="flex justify-between items-start gap-2 mb-2">
            <div class="flex flex-wrap items-center gap-1">
              <span class="text-[10px] font-extrabold text-rose-500 mr-0.5">#${idx + 1}</span>${names}
            </div>
            <button type="button" onclick="removeRule(${idx})" class="w-7 h-7 shrink-0 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="text-[10px] text-slate-400 font-semibold mr-0.5">금지 방향</span>${pills}
          </div>
        </div>`;
      }).join('');
      updateDirty();
    }

    // 목록에서 방향 알약 토글 (최소 1개는 유지)
    function toggleRuleDirInList(idx, code) {
      const r = rules[idx];
      if (!r) return;
      const i = r.dirs.indexOf(code);
      if (i !== -1) {
        if (r.dirs.length === 1) { showToast('방향은 최소 1개 이상 선택되어 있어야 해요.', 'warning'); return; }
        r.dirs.splice(i, 1);
      } else {
        r.dirs.push(code);
        r.dirs = DIR_ORDER.filter(d => r.dirs.indexOf(d) !== -1);
      }
      renderRuleList();
    }

    function removeRule(idx) {
      rules.splice(idx, 1);
      renderRuleList();
      showToast('규칙을 삭제했어요. [저장하기]를 눌러야 반영됩니다.', 'info');
    }

    // ==========================================================
    // 저장 / 닫기
    // ==========================================================
    function saveRules() {
      // 학생을 골라 놓고 [규칙 추가]를 깜빡한 경우 자동으로 추가
      if (ruleSelectIds.length >= 2 && ruleDirs.length) addRuleFromForm();

      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...`;
      const payload = rules.map(r => ({ ids: r.ids.slice(), dirs: r.dirs.slice() }));

      google.script.run
        .withSuccessHandler(function(count) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> 저장하기`;
          savedSnapshot = JSON.stringify(rules);
          lastCheck = null;          // 규칙이 바뀌었으므로 이전 결과는 초기화됨
          updateDirty();
          renderLastCheck();
          showDialog({
            type: 'success',
            title: '저장 완료',
            message: count
              ? `분리 규칙 ${count}개가 [분리규칙] 탭에 저장되었습니다.\n웹 앱에서 [랜덤 배치 시작!]을 누르면 화면에 아무 표시 없이 조용히 적용됩니다.`
              : '분리 규칙이 모두 비워졌습니다.\n이제 [랜덤 배치]는 조건 없이 섞습니다.',
            buttons: [
              { label: '계속 편집', style: 'secondary' },
              { label: '창 닫기', style: 'primary', onClick: () => google.script.host.close() }
            ]
          });
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> 저장하기`;
          showDialog({
            type: 'warning',
            title: '저장 실패',
            message: '분리 규칙을 저장하는 중 문제가 발생했습니다.\n잠시 후 다시 시도해 주세요.\n\n' + (err && err.message ? err.message : '')
          });
        })
        .saveSeparationRules(payload);
    }

    // 저장하지 않은 변경이 있으면 한 번 더 확인 후 닫기
    function requestClose() {
      if (!updateDirty()) { google.script.host.close(); return; }
      showDialog({
        type: 'warning',
        title: '저장하지 않고 닫을까요?',
        message: '추가·수정·삭제한 규칙이 아직 저장되지 않았습니다.\n닫으면 변경 내용이 사라집니다.',
        buttons: [
          { label: '계속 편집', style: 'secondary' },
          { label: '저장 안 하고 닫기', style: 'danger', onClick: () => google.script.host.close() }
        ]
      });
    }
  </script>
</body>
</html>
