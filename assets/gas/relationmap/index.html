<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24493d">
  <title>우리반 관계지도</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script>
    // ── 디자인 토큰: 교실의 칠판 · 분필 · 선생님 도장에서 가져온 색 ──
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', '"Apple SD Gothic Neo"', '"Malgun Gothic"', 'sans-serif'] },
          colors: {
            board: { DEFAULT: '#24493D', deep: '#1B3A30', soft: '#E1EBE6' },  // 칠판
            chalk: { DEFAULT: '#F3F0E4', yellow: '#F0CF5C' },                // 분필(흰색 · 노랑)
            stamp: { DEFAULT: '#CF3A2E', soft: '#FBEAE7' },                  // 도장 인주
            ink:   { DEFAULT: '#1D2B26', muted: '#5F706A' },                 // 글자
            amber: { soft: '#FDF3E1', DEFAULT: '#B4690E' },                   // 도움이 필요해 보이는 친구
            page: '#E9EFEC',                                                  // 바탕
            line: '#D5DEDA'                                                   // 테두리
          }
        }
      }
    };
  </script>
  <!-- 관계망 그래프 · 엑셀 내보내기 -->
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style type="text/tailwindcss">
    @layer components {
      .field { @apply mt-1.5 block w-full rounded-lg border border-line bg-white px-3.5 py-3 text-base text-ink transition placeholder:text-ink-muted/60 focus:border-board focus:outline-none focus:ring-4 focus:ring-chalk-yellow/60 disabled:bg-page; }
      .field-label { @apply block text-sm font-semibold text-ink; }
      .btn { @apply inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-lg px-4 py-2.5 text-sm font-bold transition active:translate-y-px disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-chalk-yellow/70; }
      .btn-primary { @apply bg-board text-chalk hover:bg-board-deep; }
      .btn-danger { @apply bg-stamp text-white hover:brightness-95; }
      .btn-ghost { @apply bg-white text-ink ring-1 ring-inset ring-line hover:bg-page; }
      .btn-yellow { @apply bg-chalk-yellow text-ink hover:brightness-95; }
      .btn-chalk { @apply bg-white/10 text-chalk ring-1 ring-chalk/30 hover:bg-white/20; }
      .btn-sm { @apply rounded-md px-3 py-1.5 text-xs; }
      .panel { @apply rounded-2xl border border-line bg-white; }
      .tab-item { @apply rounded-md py-2.5 text-sm font-bold text-ink-muted transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-chalk-yellow/70 disabled:opacity-40; }
      .tab-item.is-active { @apply bg-board text-chalk shadow-sm; }
      .seg { @apply inline-grid gap-1 rounded-lg bg-white p-1 ring-1 ring-line; }
      .seg .tab-item { @apply px-3 py-1.5; }
      .chip { @apply inline-flex shrink-0 items-center gap-1.5 rounded-full bg-white px-3 py-1.5 text-sm font-semibold text-ink-muted ring-1 ring-inset ring-line transition; }
      .chip-on { @apply bg-board text-chalk ring-board; }
      .pred { @apply rounded-full bg-board-soft px-2.5 py-0.5 text-xs font-bold text-board; }
      .pred-neg { @apply bg-stamp-soft text-stamp; }
      .pred-warn { @apply bg-amber-soft text-amber; }
      .stat { @apply rounded-xl border border-line bg-white px-4 py-3; }
      .th { @apply whitespace-nowrap border-b border-line bg-page/60 px-3 py-2.5 text-left text-xs font-bold text-ink-muted; }
      .td { @apply border-b border-line/70 px-3 py-3 align-top; }
    }
  </style>

  <style>
    /* ── 공통 제목바 ── */
    #pageHeader { padding: 1.25rem; border-bottom: 6px solid #B8C3BE; background-color: #24493D;
      background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.6px), radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.6px);
      background-size: 9px 9px, 17px 17px; background-position: 0 0, 4px 6px; }
    #pageHeader .header-content { max-width: 64rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: .75rem; text-align: center; }
    #pageHeader .header-title { margin: 0; display: flex; align-items: center; justify-content: center; gap: .5rem; color: #F3F0E4;
      font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 1.875rem; line-height: 2.25rem; font-weight: 800; letter-spacing: -.02em; }
    #pageHeader .header-role-info { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .5rem; }
    #pageHeader .header-badge { display: inline-flex; align-items: center; border-radius: .375rem; padding: .375rem .75rem; background: #F0CF5C; color: #1D2B26;
      font-size: .75rem; line-height: 1rem; font-weight: 700; white-space: nowrap; }
    #pageHeader .header-btn { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: .375rem; padding: .375rem .75rem; cursor: pointer;
      background: rgba(255,255,255,.1); color: #F3F0E4; box-shadow: inset 0 0 0 1px rgba(243,240,228,.3); font-size: .75rem; line-height: 1rem; font-weight: 700; white-space: nowrap; }
    #pageHeader .header-btn:hover { background: rgba(255,255,255,.2); }
    #pageHeader .header-btn:disabled { opacity: .5; cursor: not-allowed; }
    #pageHeader [hidden] { display: none !important; }
    @media (min-width: 640px) { #pageHeader .header-title { font-size: 2.25rem; line-height: 2.5rem; } }
    @media (min-width: 768px) {
      #pageHeader { padding-block: 1rem; }
      #pageHeader.teacher-view .header-content { flex-direction: row; justify-content: space-between; gap: 1.5rem; text-align: left; }
      #pageHeader.teacher-view .header-title { justify-content: flex-start; font-size: 2rem; }
      #pageHeader.teacher-view .header-role-info { flex-wrap: nowrap; justify-content: flex-end; }
    }
    /* ── 관계지도 칠판 ── */
    .board-canvas {
      background-color: #24493D;
      background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.6px), radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.6px);
      background-size: 9px 9px, 17px 17px; background-position: 0 0, 4px 6px;
      box-shadow: inset 0 0 0 6px #6B5A45, inset 0 0 0 8px #4D4032;   /* 나무 칠판 틀 */
    }
    .board-tray { background: #B8C3BE; }
    /* ── 설문지의 친구 이름 버튼 ── */
    .pill { border: 1px solid #D5DEDA; border-radius: 999px; padding: .5rem .9rem; background: #fff; font-weight: 600; transition: .15s; }
    .pill:hover:not(:disabled) { border-color: #24493D; }
    .pill[aria-pressed="true"] { background: #24493D; color: #fff; border-color: #24493D; }
    .pill:disabled { opacity: .35; cursor: not-allowed; }
    .pill:focus-visible { outline: 3px solid rgba(240,207,92,.8); outline-offset: 2px; }
    /* ── 교사 작업 탭 (밑줄형 탭) ── */
    .ws-tabs { display: flex; gap: .25rem; border-bottom: 1px solid #D5DEDA; overflow-x: auto; scrollbar-width: none; }
    .ws-tabs::-webkit-scrollbar { display: none; }
    .ws-tab { flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #5F706A; padding: .8rem 1rem; font-weight: 700; }
    .ws-tab[aria-selected="true"] { color: #24493D; border-bottom-color: #24493D; }
    .ws-tab:focus-visible { outline: 3px solid rgba(36,73,61,.22); outline-offset: -3px; }
    /* ── 도장 ── */
    .stamp { display: inline-flex; align-items: center; justify-content: center; width: 108px; height: 108px; border-radius: 9999px;
      border: 5px solid #CF3A2E; color: #CF3A2E; font-size: 28px; font-weight: 800; letter-spacing: -.02em; transform: rotate(-12deg);
      box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 7px rgba(207,58,46,.35); }
    .stamp-press { animation: press .5s cubic-bezier(.2,.9,.3,1.25) both; }
    @keyframes press { 0% { transform: scale(1.9) rotate(-12deg); opacity: 0; } 60% { transform: scale(.94) rotate(-12deg); opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: 1; } }
    .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px; display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chip-scroll { overflow-x: auto; scrollbar-width: none; } .chip-scroll::-webkit-scrollbar { display: none; }
    input, select, textarea { font-size: 16px; }
    [hidden] { display: none !important; }
    /* ── 오른쪽 Drawer (학생 상세정보) ── */
    .drawer { transform: translateX(100%); transition: transform .25s ease; }
    .drawer.open { transform: translateX(0); }
    div.vis-tooltip { background: #fff !important; color: #1D2B26 !important; border: 1px solid #D5DEDA !important; border-radius: 8px !important;
      font-family: Pretendard, sans-serif !important; padding: 6px 10px !important; max-width: 260px; white-space: normal !important; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>

<body class="min-h-screen break-keep bg-page font-sans text-ink antialiased">

  <!-- 공통 제목바 -->
  <header id="pageHeader">
    <div class="header-content">
      <h1 class="header-title"><span>🏫</span> 우리반 관계지도</h1>
      <div id="teacherHeaderInfo" class="header-role-info" hidden>
        <span class="header-badge">👩‍🏫 교사 모드</span>
        <button type="button" id="btn-logout" class="header-btn">로그아웃</button>
      </div>
      <div id="surveyHeaderInfo" class="header-role-info" hidden>
        <button type="button" id="sv-exit" class="header-btn">나가기</button>
      </div>
    </div>
  </header>

  <!-- ================================================================== -->
  <!-- 1. 첫 화면: 학생 / 교사 로그인                                       -->
  <!-- ================================================================== -->
  <section id="view-home">
    <div class="mx-auto mt-6 w-full max-w-md px-4 pb-12">
      <div class="panel p-6 shadow-sm">
        <div class="grid grid-cols-2 gap-1 rounded-lg bg-page p-1" role="tablist" aria-label="로그인 대상">
          <button type="button" class="tab-item" data-role="student" role="tab">학생</button>
          <button type="button" class="tab-item" data-role="teacher" role="tab">교사</button>
        </div>
        <div id="login-student" class="mt-5">
          <label for="login-no" class="field-label">학번</label>
          <input id="login-no" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="username" placeholder="예: 1630" class="field">
          <p class="mt-1 text-xs text-ink-muted">숫자 4~5자리</p>
          <label for="login-pw" class="field-label mt-4">비밀번호</label>
          <div class="relative">
            <input id="login-pw" type="password" maxlength="20" autocomplete="current-password" placeholder="비밀번호 (처음이면 선생님이 알려 준 초기 비밀번호)" class="field pr-12">
            <button type="button" data-eye="login-pw" aria-label="비밀번호 보기" class="absolute bottom-0 right-0 top-1.5 flex items-center px-3.5 text-ink-muted hover:text-ink"></button>
          </div>
        </div>
        <div id="login-teacher" class="mt-5 hidden">
          <label for="login-pin" class="field-label">교사 비밀번호</label>
          <div class="relative">
            <input id="login-pin" type="password" maxlength="20" autocomplete="current-password" placeholder="교사 비밀번호" class="field pr-12">
            <button type="button" data-eye="login-pin" aria-label="비밀번호 보기" class="absolute bottom-0 right-0 top-1.5 flex items-center px-3.5 text-ink-muted hover:text-ink"></button>
          </div>
        </div>
        <p id="login-error" class="mt-3 hidden rounded-lg bg-stamp-soft px-3 py-2.5 text-sm font-semibold text-stamp" role="alert"></p>
        <button id="login-btn" type="button" class="btn btn-primary mt-5 w-full py-3 text-base">설문 시작하기</button>
        <p id="login-help" class="mt-4 text-center text-xs leading-relaxed text-ink-muted"></p>
      </div>
      <p class="mt-6 text-center text-xs leading-relaxed text-ink-muted">설문 답변은 선생님만 볼 수 있어요. 친구들에게는 절대 보이지 않아요.</p>
    </div>
  </section>

  <!-- ================================================================== -->
  <!-- 2. 학생 설문: 한 장짜리 설문지                                       -->
  <!-- ================================================================== -->
  <section id="view-survey" class="hidden">
    <div class="mx-auto mt-6 max-w-2xl px-4 pb-16">
      <div id="sv-panel" class="panel p-5 shadow-sm sm:p-7"></div>
    </div>
  </section>

  <!-- ================================================================== -->
  <!-- 3. 교사 화면                                                         -->
  <!-- ================================================================== -->
  <section id="view-teacher" class="hidden">
    <!-- 도구 줄: 달 선택 · 마감 · 응답 수 · 엑셀 · 삭제 -->
    <div class="mx-auto max-w-6xl px-4 pt-4">
      <div id="month-bar" class="panel flex flex-wrap items-center gap-2 p-3 shadow-sm">
        <span class="text-sm font-bold">설문</span>
        <div class="flex items-center gap-1">
          <button id="m-prev" type="button" class="btn btn-ghost btn-sm px-2.5" aria-label="이전 달">‹</button>
          <select id="month-select" class="field mt-0 w-auto py-2 text-sm font-bold" aria-label="달 선택"></select>
          <button id="m-next" type="button" class="btn btn-ghost btn-sm px-2.5" aria-label="다음 달">›</button>
        </div>
        <button id="tb-toggle" type="button" class="btn btn-ghost btn-sm" hidden></button>
        <span id="tb-count" class="rounded-lg border border-line bg-page px-3 py-1.5 text-xs font-bold text-ink-muted"></span>
        <span class="flex-1"></span>
        <button id="tb-excel" type="button" class="btn btn-ghost btn-sm" disabled>📊 응답 엑셀</button>
        <button id="tb-delete" type="button" class="btn btn-ghost btn-sm text-stamp" disabled>🗑️ 설문 삭제</button>
      </div>
    </div>

    <div class="sticky top-0 z-30 mt-3 bg-page/95 backdrop-blur">
      <div class="mx-auto max-w-6xl px-4">
        <div id="tabbar" class="ws-tabs" role="tablist" aria-label="교사 작업 영역"></div>
      </div>
    </div>

    <main class="mx-auto max-w-6xl px-4 pb-16 pt-5">
      <!-- 지도 탭 -->
      <div id="tab-map" class="tab-panel" role="tabpanel">
        <div id="map-empty" hidden></div>
        <div id="map-body">
          <div id="map-stats" class="mb-4 grid grid-cols-2 gap-2 lg:grid-cols-4"></div>
          <div class="mb-3 flex flex-wrap items-center gap-2">
            <div class="seg grid-cols-2" role="group" aria-label="보기 방식">
              <button type="button" data-mode="month" class="tab-item">이번 달 지도</button>
              <button type="button" data-mode="diff" class="tab-item">지난달과 비교</button>
            </div>
          </div>
          <div class="mb-3 flex items-center gap-2">
            <div id="map-filters" class="chip-scroll flex min-w-0 flex-1 gap-2"></div>
            <select id="map-student-filter" class="field mt-0 w-auto shrink-0 py-1.5 text-sm font-semibold" aria-label="학생으로 관계 걸러 보기"></select>
          </div>
          <div class="overflow-hidden rounded-2xl">
            <div class="relative">
              <div id="network" class="board-canvas h-[58vh] min-h-[360px] lg:h-[68vh]" role="region"
                aria-label="우리 반 관계지도. 학생을 누르면 자세한 정보가 열려요. 같은 내용은 아래 살펴볼 점과 학생 응답 탭에서도 볼 수 있어요."></div>
              <div class="absolute right-3 top-3 flex gap-1.5">
                <button id="btn-relayout" type="button" class="btn btn-chalk btn-sm bg-board-deep/80">배치 다시 하기</button>
                <button id="btn-fit" type="button" class="btn btn-chalk btn-sm bg-board-deep/80">전체 보기</button>
              </div>
            </div>
            <div id="map-legend" class="board-tray flex flex-wrap gap-x-4 gap-y-1.5 px-4 py-2.5 text-xs font-semibold text-ink"></div>
          </div>
          <div class="mt-8">
            <h2 id="below-title" class="mb-3 text-lg font-extrabold">살펴볼 점</h2>
            <div id="map-alerts" class="space-y-2"></div>
          </div>
        </div>
      </div>
      <div id="tab-responses" class="tab-panel hidden" role="tabpanel"></div>
      <div id="tab-manage" class="tab-panel hidden" role="tabpanel"></div>
    </main>
  </section>

  <!-- 공용 레이어 -->
  <div id="modal-root"></div>
  <!-- 학생 상세정보 Drawer (오른쪽에서 열림 · ESC / 닫기 버튼으로 닫힘) -->
  <aside id="drawer" class="drawer fixed inset-y-0 right-0 z-[60] hidden w-full overflow-y-auto border-l border-line bg-white shadow-2xl sm:w-[460px]" role="dialog" aria-label="학생 상세정보"></aside>
  <div id="toast-root" class="pointer-events-none fixed inset-x-0 bottom-5 z-[95] flex flex-col items-center gap-2 px-4" aria-live="polite"></div>
  <div id="loading" class="fixed inset-0 z-[90] hidden items-center justify-center bg-ink/40 p-4">
    <div class="flex items-center gap-3 rounded-xl bg-white px-5 py-4 text-sm font-bold text-board shadow-xl"><span class="spinner"></span><span id="loading-text">불러오는 중</span></div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════
 *  0. 전역 상태
 * ═══════════════════════════════════════════════════════════════ */
const S = {
  token: null, data: null, month: '', tab: 'map',
  mode: 'month',                                        // 지도: month(이번 달) | diff(지난달과 비교)
  filters: { pos: true, neg: true, mutualOnly: false, mutualNegOnly: false },
  diffFilters: { added: true, removed: true, kept: true },
  focusId: null,                                        // 지도에서 강조 중인 학생
  studentFilter: '',                                    // 고른 학생의 관계만 남겨 보기 ('' = 전체)
  net: null, nodesDS: null, edgesDS: null, netDirty: true, netReady: null,
  positions: null, edgeInfo: {},
  sv: null, nameOf: {}, loginRole: 'student'
};
let surveyCloseTimer = null;
const POL = { POS: '긍정', NEG: '부정' };
/** 칠판 위 분필 색 (관계지도 전용) — 초록·회색은 색약 구분 검사를 통과하도록 보정 */
const CH = { chalk: '#F3F0E4', yellow: '#F0CF5C', red: '#FF5A5A', posBlue: '#4FA8F7', darkRed: '#C0221B', green: '#A3E07A', gray: '#A9B8B1', board: '#24493D' };
const TABS = [['map', '🗺️ 관계지도'], ['responses', '📋 학생 응답'], ['manage', '⚙️ 관리']];
const EYE_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

/* ═══════════════════════════════════════════════════════════════
 *  1. 공통 도구
 * ═══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nameOf = id => S.nameOf[id] || id;
const monthLabel = m => m ? `${m.slice(0, 4)}년 ${Number(m.slice(5, 7))}월` : '';
const shortMonth = m => m ? `${Number(m.slice(5, 7))}월` : '';
const cfg = () => (S.data || S.sv.data).config;
const climateLabel = v => { const c = cfg().climate.scale.find(x => x.v === Number(v)); return c ? `${c.v}점 ${c.label}` : ''; };
const scheduleLabel = s => { const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(s || ''); return m ? `${Number(m[2])}월 ${Number(m[3])}일 ${m[4]}` : ''; };
const scheduleMs = s => { const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(s || ''); return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4]), Number(m[5])).getTime() : 0; };
const POL_STYLE = {
  '긍정': { pred: 'pred', label: '즐겁게 지내는 친구' },
  '부정': { pred: 'pred pred-neg', label: '불편한 친구' }
};

function api(fn, ...args) {
  return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}
async function call(fn, ...args) {
  try { return await api(fn, ...args); }
  catch (err) {
    const msg = String((err && err.message) || err);
    if (msg.includes('AUTH:')) { await mAlert('다시 로그인해 주세요', msg.split('AUTH:')[1].trim()); logoutLocal(); return null; }
    await mAlert('요청을 처리하지 못했어요', msg.replace(/^(Exception|Error):\s*/, ''));
    return null;
  }
}
function loading(on, text) {
  $('#loading').classList.toggle('hidden', !on);
  $('#loading').classList.toggle('flex', on);
  if (text) $('#loading-text').textContent = text;
}
function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = `rounded-full px-4 py-2.5 text-sm font-semibold shadow-lg transition-opacity duration-300 ${isError ? 'bg-stamp text-white' : 'bg-ink text-chalk'}`;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2400);
}
function show(view) {
  ['home', 'survey', 'teacher'].forEach(v => $('#view-' + v).classList.toggle('hidden', v !== view));
  $('#pageHeader').classList.toggle('teacher-view', view === 'teacher');
  $('#teacherHeaderInfo').hidden = view !== 'teacher';
  $('#surveyHeaderInfo').hidden = view !== 'survey';
  window.scrollTo(0, 0);
}
function reasonHtml(e) {
  return e && e.text ? `<span class="text-sm leading-relaxed text-ink">“${esc(e.text)}”</span>` : '';
}
function tooltip(lines) {
  const box = document.createElement('div');
  lines.filter(Boolean).forEach((line, i) => {
    const row = document.createElement('div');
    row.textContent = line;
    if (!i) row.style.fontWeight = '800';
    box.appendChild(row);
  });
  return box;
}
document.querySelectorAll('[data-eye]').forEach(btn => {
  btn.innerHTML = EYE_ON;
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.eye), showIt = input.type === 'password';
    input.type = showIt ? 'text' : 'password';
    btn.innerHTML = showIt ? EYE_OFF : EYE_ON;
    btn.setAttribute('aria-label', showIt ? '숨기기' : '보기');
  });
});

/* ═══════════════════════════════════════════════════════════════
 *  2. 커스텀 모달 (alert / confirm / prompt 대체)
 * ═══════════════════════════════════════════════════════════════ */
function openModal(html, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-[90] flex items-end justify-center p-3 sm:items-center';
    wrap.innerHTML = `<div class="absolute inset-0 bg-ink/50" data-backdrop></div>
      <div class="relative max-h-[90vh] w-full ${opts.wide ? 'max-w-lg' : 'max-w-sm'} overflow-y-auto rounded-2xl bg-white p-6 shadow-xl" role="dialog" aria-modal="true">${html}</div>`;
    const onKey = e => { if (e.key === 'Escape') close(null); };
    const close = v => { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); };
    document.addEventListener('keydown', onKey);
    wrap.querySelector('[data-backdrop]').addEventListener('click', () => close(null));
    wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.close; close(v === 'true' ? true : v === 'false' ? false : v);
    }));
    $('#modal-root').appendChild(wrap);
    if (opts.onMount) opts.onMount(wrap, close);
    const f = wrap.querySelector('input, textarea, select') || wrap.querySelector('[data-close="true"], button');
    if (f) setTimeout(() => f.focus(), 60);
  });
}
function mAlert(title, message) {
  return openModal(`<h3 class="text-lg font-extrabold">${esc(title)}</h3>
    <p class="mt-2 whitespace-pre-line text-sm leading-relaxed text-ink-muted">${esc(message)}</p>
    <div class="mt-6 flex"><button data-close="true" class="btn btn-primary flex-1 py-3">확인</button></div>`);
}
function mConfirm(title, message, o) {
  o = o || {};
  return openModal(`<h3 class="text-lg font-extrabold">${esc(title)}</h3>
    <p class="mt-2 whitespace-pre-line text-sm leading-relaxed text-ink-muted">${esc(message)}</p>
    <div class="mt-6 flex gap-2"><button data-close="false" class="btn btn-ghost flex-1 py-3">${esc(o.cancel || '취소')}</button>
    <button data-close="true" class="btn ${o.danger ? 'btn-danger' : 'btn-primary'} flex-1 py-3">${esc(o.ok || '확인')}</button></div>`).then(v => v === true);
}
function mForm(o) {
  const field = f => {
    if (f.type === 'textarea') return `<textarea name="${f.name}" rows="${f.rows || 5}" maxlength="${f.maxlength || 2000}" class="field resize-y" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>`;
    if (f.type === 'select') return `<select name="${f.name}" class="field">${f.options.map(op => `<option value="${esc(op.v)}" ${String(op.v) === String(f.value == null ? '' : f.value) ? 'selected' : ''}>${esc(op.l)}</option>`).join('')}</select>`;
    return `<input name="${f.name}" type="${f.type || 'text'}" ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} maxlength="${f.maxlength || 100}" placeholder="${esc(f.placeholder || '')}" autocomplete="off" spellcheck="false" class="field" value="${esc(f.value == null ? '' : f.value)}">`;
  };
  return openModal(`<h3 class="text-lg font-extrabold">${esc(o.title)}</h3>
    ${o.message ? `<p class="mt-2 whitespace-pre-line text-sm leading-relaxed text-ink-muted">${esc(o.message)}</p>` : ''}
    <div class="mt-2">${o.fields.map(f => `<label class="mt-3 block"><span class="field-label">${esc(f.label)}</span>${field(f)}${f.help ? `<span class="mt-1 block text-xs text-ink-muted">${esc(f.help)}</span>` : ''}</label>`).join('')}</div>
    <p data-err class="mt-3 hidden whitespace-pre-line text-sm font-semibold text-stamp" role="alert"></p>
    ${o.extra || ''}
    <div class="mt-5 flex gap-2"><button data-close="" class="btn btn-ghost flex-1 py-3">취소</button><button data-submit class="btn btn-primary flex-1 py-3">${esc(o.submit || '확인')}</button></div>`, {
    wide: o.wide,
    onMount: (wrap, close) => {
      const err = wrap.querySelector('[data-err]'), btn = wrap.querySelector('[data-submit]');
      const submit = async () => {
        const values = {};
        o.fields.forEach(f => { values[f.name] = wrap.querySelector(`[name="${f.name}"]`).value.trim(); });
        const label = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>처리하는 중'; err.classList.add('hidden');
        let res;
        try { res = await o.onSubmit(values, wrap); } catch (e) { res = { error: String((e && e.message) || e) }; }
        btn.disabled = false; btn.innerHTML = label;
        if (res && res.error) { err.textContent = res.error; err.classList.remove('hidden'); return; }
        close(res === undefined ? values : res);
      };
      btn.addEventListener('click', submit);
      wrap.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
      if (o.onMount) o.onMount(wrap, close);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════
 *  3. 로그인 화면 (학생: 학번 + 비밀번호 / 교사: 교사 비밀번호)
 * ═══════════════════════════════════════════════════════════════ */
function setLoginRole(role) {
  S.loginRole = role;
  document.querySelectorAll('[data-role]').forEach(el => {
    const on = el.dataset.role === role;
    el.classList.toggle('is-active', on);
    el.setAttribute('aria-selected', String(on));
  });
  $('#login-student').classList.toggle('hidden', role !== 'student');
  $('#login-teacher').classList.toggle('hidden', role !== 'teacher');
  $('#login-btn').textContent = role === 'student' ? '설문 시작하기' : '교사 화면 열기';
  $('#login-help').textContent = role === 'student'
    ? '비밀번호를 잊었다면 선생님께 말씀해 주세요.'
    : '교사 비밀번호는 구글 시트 상단 [🌌 관계지도] > [환경설정]에서 등록한 값이에요.';
  $('#login-error').classList.add('hidden');
}
document.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => { setLoginRole(b.dataset.role); (b.dataset.role === 'student' ? $('#login-no') : $('#login-pin')).focus(); }));
$('#login-no').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-pw').focus(); });
$('#login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#login-btn').addEventListener('click', doLogin);
digitsOnly($('#login-no'));

function loginError(msg) { const el = $('#login-error'); el.textContent = msg; el.classList.remove('hidden'); }

async function doLogin() {
  const btn = $('#login-btn'), label = btn.textContent;
  const busy = on => { btn.disabled = on; btn.innerHTML = on ? '<span class="spinner"></span>확인하는 중' : esc(label); };
  $('#login-error').classList.add('hidden');
  try {
    if (S.loginRole === 'student') {
      const no = $('#login-no').value.trim(), pw = $('#login-pw').value.trim();
      if (!/^\d{4,5}$/.test(no)) return loginError('학번은 숫자 4~5자리로 입력해 주세요. (예: 1630)');
      if (!pw) return loginError('비밀번호를 입력해 주세요.');
      busy(true);
      const res = await api('enterSurvey', no, pw);
      busy(false);
      if (res.mustChange) return changePasswordFlow(no, pw);
      if (res.locked) { $('#login-pw').value = ''; return mAlert('이미 제출한 설문이에요', res.message); }
      if (!res.ok) return loginError(res.message);
      $('#login-pw').value = '';
      startSurvey({ data: res, no, pw });
    } else {
      const pin = $('#login-pin').value.trim();
      if (!pin) return loginError('교사 비밀번호를 입력해 주세요.');
      busy(true);
      const res = await api('teacherLogin', pin);
      busy(false);
      if (!res.ok) return loginError(res.message);
      $('#login-pin').value = '';
      S.token = res.token;
      try { sessionStorage.setItem('rm_token', res.token); } catch (e) {}
      enterTeacher();
    }
  } catch (e) {
    busy(false);
    loginError(String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '') || '서버와 연결하지 못했어요.');
  }
}

async function changePasswordFlow(no, oldPw) {
  const r = await mForm({
    title: '나만의 비밀번호로 바꿔 주세요',
    message: '처음 로그인했거나 선생님이 비밀번호를 초기화했어요. 다른 친구가 내 학번으로 들어오지 못하도록 새 비밀번호를 정해 주세요. 영문·숫자·기호를 섞어 띄어쓰기 없이 4~20자로 쓸 수 있어요.',
    fields: [
      { name: 'p1', label: '새 비밀번호 (띄어쓰기 없이 4~20자)', type: 'password', maxlength: 20 },
      { name: 'p2', label: '새 비밀번호 한 번 더', type: 'password', maxlength: 20 }
    ],
    submit: '바꾸고 설문 시작',
    onSubmit: async v => {
      if (!/^\S{4,20}$/.test(v.p1)) return { error: '띄어쓰기 없이 4~20자로 정해 주세요.' };
      if (v.p1 !== v.p2) return { error: '두 칸의 비밀번호가 서로 달라요.' };
      const res = await api('changeStudentPassword', no, oldPw, v.p1);
      if (!res.ok) return { error: res.message };
      return { ok: true, pw: v.p1 };
    }
  });
  if (!r || !r.ok) return;
  toast('비밀번호를 바꿨어요. 잊지 않게 기억해 두세요.');
  $('#login-pw').value = r.pw;
  doLogin();
}

function digitsOnly(input) {
  if (input) input.addEventListener('input', () => { const v = input.value.replace(/\D/g, '').slice(0, 5); if (v !== input.value) input.value = v; });
}

/* ═══════════════════════════════════════════════════════════════
 *  4. 학생 설문: 한 장짜리 설문지
 * ═══════════════════════════════════════════════════════════════ */
function startSurvey(r) {
  const d = r.data, prev = d.previous, answers = {};
  d.config.questions.forEach(q => { answers[q.key] = (prev[q.key] || []).map(x => ({ id: x.id, tags: (x.tags || []).slice(), text: x.text || '' })); });
  S.sv = { no: r.no, pw: r.pw, data: d, answers, climate: prev.climate || '', climateReason: prev.climateReason || '', done: false, submitting: false };
  show('survey');
  renderSurveyForm();
  armSurveyClose();
}

function setDirty(on) { window.onbeforeunload = on ? (e => { e.preventDefault(); e.returnValue = ''; }) : null; }

function goHomeFromSurvey() {
  setDirty(false);
  clearTimeout(surveyCloseTimer);
  S.sv = null;
  show('home');
}

$('#sv-exit').addEventListener('click', async () => {
  if (S.sv && !S.sv.done && !(await mConfirm('설문을 그만둘까요?', '제출하지 않은 답은 저장되지 않아요.', { ok: '나가기', cancel: '계속 쓰기' }))) return;
  goHomeFromSurvey();
});

function renderSurveyForm() {
  const sv = S.sv, d = sv.data, c = d.config;
  $('#sv-panel').innerHTML = `
    <div class="border-b border-line pb-5">
      <h2 class="text-xl font-extrabold leading-snug sm:text-2xl">${esc(d.monthLabel)} 우리 반 관계 설문</h2>
      <div class="mt-2.5 flex flex-wrap items-center gap-2">
        <span class="text-sm font-bold text-ink-muted">${esc(d.me.studentNo)} ${esc(d.me.name)}</span>
        <span class="rounded-full bg-board-soft px-3 py-1 text-xs font-bold text-board">${d.editing ? '수정 중' : '진행 중'}</span>
        ${d.closeAt ? `<span class="rounded-full bg-page px-3 py-1 text-xs font-bold text-ink-muted">${esc(scheduleLabel(d.closeAt))} 마감</span>` : ''}
      </div>
      <p class="mt-3 text-sm leading-relaxed text-ink-muted">정답은 없어요. 평소 느낌 그대로 솔직하게 답해 주세요. 친구를 골랐다면 어떤 이유인지 고르고, 자세한 이유도 꼭 적어 주세요. 답은 선생님만 볼 수 있어요.</p>
      ${d.editing
        ? '<p class="mt-3 rounded-lg bg-board-soft px-3 py-2.5 text-sm font-bold text-board">선생님이 수정 권한을 주셔서 지난번 답을 불러왔어요. 다시 제출하면 수정 권한은 끝나요.</p>'
        : '<p class="mt-3 rounded-lg bg-chalk-yellow/30 px-3 py-2.5 text-sm font-semibold">한 번 제출하면 답을 다시 불러올 수 없어요. 고칠 게 생기면 선생님께 수정 권한을 요청해야 해요.</p>'}
    </div>
    <div id="sv-questions">
      ${climateBlockHtml(1)}
      ${c.questions.map((q, i) => friendBlockHtml(q, i + 2)).join('')}
    </div>
    <button id="sv-submit" type="button" class="btn btn-primary mt-2 w-full py-3.5 text-base">응답 제출</button>`;
  c.questions.forEach(q => { renderPills(q.key); renderReasons(q.key); });
  bindSurveyEvents();
  setDirty(false);
}

function friendBlockHtml(q, n) {
  return `<div class="border-t border-dashed border-line py-6 first:border-t-0" data-q="${q.key}">
    <p class="text-base font-bold leading-snug">${n}. ${esc(q.title)}</p>
    <p class="mt-1 text-sm text-ink-muted">${esc(q.help)} <b class="text-ink">최대 ${q.max}명</b>까지 고를 수 있어요.</p>
    ${q.note ? `<p class="mt-3 rounded-lg bg-stamp-soft text-stamp px-3 py-2.5 text-sm font-semibold leading-relaxed">${esc(q.note)}</p>` : ''}
    <div class="mt-3 flex flex-wrap gap-2" data-pills="${q.key}" role="group" aria-label="${esc(q.title)}"></div>
    <div class="mt-4 space-y-3" data-reasons="${q.key}"></div>
    <p class="mt-2 hidden text-sm font-semibold text-stamp" data-qerr="${q.key}" role="alert"></p>
  </div>`;
}

function climateBlockHtml(n) {
  const sv = S.sv, c = sv.data.config.climate;
  return `<div class="border-t border-dashed border-line py-6 first:border-t-0" data-q="climate">
    <p class="text-base font-bold leading-snug">${n}. ${esc(c.question)} <span class="text-stamp">*</span></p>
    <div class="mt-3 overflow-hidden rounded-xl border border-line" role="radiogroup" aria-label="우리 반 분위기 점수" data-climate-group>
      ${c.scale.map((s, i) => `<button type="button" role="radio" data-climate="${s.v}" class="flex w-full items-center gap-3 px-4 py-3 text-left transition ${i ? 'border-t border-line' : ''}">
        <span data-score class="flex h-9 w-12 shrink-0 items-center justify-center rounded-lg text-sm font-extrabold tabular-nums">${s.v}점</span>
        <span class="font-semibold leading-snug">${esc(s.label)}</span></button>`).join('')}
    </div>
    <label class="mt-4 block"><span class="field-label">${esc(c.reasonLabel)}</span>
      <textarea id="sv-climate-reason" rows="2" maxlength="300" class="field resize-y" placeholder="${esc(c.placeholder)}">${esc(sv.climateReason)}</textarea></label>
    <p class="mt-2 hidden text-sm font-semibold text-stamp" data-qerr="climate" role="alert"></p>
  </div>`;
}

function paintClimate() {
  document.querySelectorAll('[data-climate]').forEach(b => {
    const on = Number(b.dataset.climate) === Number(S.sv.climate);
    b.setAttribute('aria-checked', on);
    b.classList.toggle('bg-board', on); b.classList.toggle('text-chalk', on); b.classList.toggle('hover:bg-page', !on);
    const score = b.querySelector('[data-score]');
    score.className = `flex h-9 w-12 shrink-0 items-center justify-center rounded-lg text-sm font-extrabold tabular-nums ${on ? 'bg-chalk-yellow text-ink' : 'bg-page text-ink'}`;
  });
}

function renderPills(key) {
  const sv = S.sv, picked = sv.answers[key];
  const other = key === 'positive' ? sv.answers.negative : key === 'negative' ? sv.answers.positive : [];
  document.querySelector(`[data-pills="${key}"]`).innerHTML = sv.data.classmates.map(c => {
    const on = picked.some(x => x.id === c.id), blocked = !on && (other || []).some(x => x.id === c.id);
    return `<button type="button" class="pill" data-pick="${key}" data-id="${esc(c.id)}" aria-pressed="${on}" ${blocked ? 'disabled title="다른 문항에서 이미 골랐어요"' : ''}>
      ${esc(c.name)}</button>`;
  }).join('') || '<p class="text-sm text-ink-muted">명단에 다른 친구가 아직 없어요.</p>';
}

function renderReasons(key) {
  const sv = S.sv, q = sv.data.config.questions.find(x => x.key === key);
  const box = document.querySelector(`[data-reasons="${key}"]`);
  box.innerHTML = sv.answers[key].map((x, i) => {
    const c = sv.data.classmates.find(m => m.id === x.id);
    const labelText = q.reasonLabel.replace('{name}', c ? c.name : '');
    return `<div class="rounded-xl border border-line bg-page/40 p-3" data-card="${key}|${esc(x.id)}">
      <p class="text-sm font-bold"><span class="mr-1.5 inline-flex h-5 w-5 items-center justify-center rounded-full bg-board text-[11px] text-chalk">${i + 1}</span>${esc(labelText)} <span class="text-stamp">*</span></p>
      <p class="mt-2 text-xs font-semibold text-ink-muted">어떤 이유인가요? (여러 개 고를 수 있어요)</p>
      <div class="mt-1.5 flex flex-wrap gap-1.5">${q.tags.map(t => `<button type="button" class="pill px-3 py-1 text-sm" data-tag="${esc(t)}" data-tq="${key}" data-id="${esc(x.id)}" aria-pressed="${x.tags.includes(t)}">${esc(t)}</button>`).join('')}</div>
      <p class="mt-3 text-xs font-semibold text-ink-muted">자세히 적어 주세요</p>
      <textarea rows="2" maxlength="${sv.data.config.reasonMax}" data-reason="${key}" data-id="${esc(x.id)}" class="field mt-1 resize-y" aria-label="${esc(labelText)}" placeholder="${esc(q.placeholder)}">${esc(x.text)}</textarea>
    </div>`;
  }).join('');
}

function bindSurveyEvents() {
  const sv = S.sv, root = $('#sv-questions');
  paintClimate();
  root.addEventListener('click', e => {
    if (sv.done || sv.submitting) return;
    const tag = e.target.closest('[data-tag]');
    if (tag) {
      const it = sv.answers[tag.dataset.tq].find(x => x.id === tag.dataset.id), t = tag.dataset.tag, k = it.tags.indexOf(t);
      if (k >= 0) it.tags.splice(k, 1); else it.tags.push(t);
      tag.setAttribute('aria-pressed', k < 0);
      document.querySelector(`[data-qerr="${tag.dataset.tq}"]`).classList.add('hidden');
      setDirty(true);
      return;
    }
    const pill = e.target.closest('[data-pick]');
    if (pill && !pill.disabled) {
      const key = pill.dataset.pick, id = pill.dataset.id, q = sv.data.config.questions.find(x => x.key === key);
      const list = sv.answers[key], i = list.findIndex(x => x.id === id);
      if (i >= 0) list.splice(i, 1);
      else if (list.length >= q.max) return toast(`${q.max}명까지 고를 수 있어요`, true);
      else list.push({ id, tags: [], text: '' });
      renderPills(key); renderReasons(key);
      if (key === 'positive') renderPills('negative');
      if (key === 'negative') renderPills('positive');
      document.querySelector(`[data-qerr="${key}"]`).classList.add('hidden');
      const again = document.querySelector(`[data-pick="${key}"][data-id="${CSS.escape(id)}"]`);
      if (again) again.focus({ preventScroll: true });
      setDirty(true);
      return;
    }
    const cl = e.target.closest('[data-climate]');
    if (cl) { sv.climate = Number(cl.dataset.climate); paintClimate(); document.querySelector('[data-qerr="climate"]').classList.add('hidden'); setDirty(true); }
  });
  root.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.reason) { const it = sv.answers[t.dataset.reason].find(x => x.id === t.dataset.id); if (it) it.text = t.value; }
    if (t.id === 'sv-climate-reason') sv.climateReason = t.value;
    setDirty(true);
  });
  $('#sv-submit').onclick = submitSurveyAnswers;
}

function validateSurvey() {
  const sv = S.sv, errs = [];
  const nm = id => (sv.data.classmates.find(c => c.id === id) || {}).name;
  const ce = document.querySelector('[data-qerr="climate"]');
  if (!sv.climate) { ce.textContent = '우리 반 분위기 점수를 하나 골라 주세요.'; ce.classList.remove('hidden'); errs.push('climate'); }
  else ce.classList.add('hidden');
  sv.data.config.questions.forEach(q => {
    const noTag = sv.answers[q.key].filter(x => !x.tags.length).map(x => nm(x.id));
    const noText = sv.answers[q.key].filter(x => !x.text.trim()).map(x => nm(x.id));
    const el = document.querySelector(`[data-qerr="${q.key}"]`);
    const msg = [noTag.length ? `${noTag.join(', ')}: 이유 분류를 하나 이상 골라 주세요.` : '', noText.length ? `${noText.join(', ')}: 자세한 이유를 적어 주세요.` : ''].filter(Boolean).join(' ');
    if (msg) { el.textContent = msg; el.classList.remove('hidden'); errs.push(q.key); }
    else el.classList.add('hidden');
  });
  if (errs.length) document.querySelector(`[data-q="${errs[0]}"]`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  return !errs.length;
}

async function submitSurveyAnswers() {
  const sv = S.sv;
  if (!sv || sv.submitting || sv.done) return;
  if (!validateSurvey()) return toast('빠진 답이 있어요. 빨간 글씨를 확인해 주세요.', true);
  const picked = sv.data.config.questions.reduce((n, q) => n + sv.answers[q.key].length, 0);
  if (!sv.answers.positive.length && !(await mConfirm('2번에서 친구를 고르지 않았어요', '요즘 함께 즐겁게 지내는 친구가 아직 없다면 그대로 제출해도 괜찮아요.', { ok: '그대로 제출', cancel: '다시 볼게요' }))) return;
  if (!(await mConfirm('설문을 제출할까요?', `고른 친구 ${picked}명, 우리 반 분위기 ${climateLabel(sv.climate)}
제출하면 답을 다시 불러올 수 없어요. 고칠 게 생기면 선생님께 수정 권한을 요청해야 해요.`, { ok: '제출하기' }))) return;
  const payload = { climate: sv.climate, climateReason: sv.climateReason.trim() };
  sv.data.config.questions.forEach(q => { payload[q.key] = sv.answers[q.key].map(x => ({ id: x.id, tags: x.tags, text: x.text.trim() })); });
  const btn = $('#sv-submit');
  sv.submitting = true;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>제출하는 중';
  $('#sv-exit').disabled = true;
  let res;
  try { res = await api('submitSurvey', sv.no, sv.pw, payload); }
  catch (e) { res = { ok: false, message: String((e && e.message) || e) }; }
  finally {
    sv.submitting = false;
    $('#sv-exit').disabled = false;
    if (btn.isConnected) { btn.disabled = false; btn.textContent = '응답 제출'; }
  }
  if (!res.ok) return mAlert('제출하지 못했어요', res.message);
  setDirty(false);
  clearTimeout(surveyCloseTimer);
  sv.done = true; sv.pw = '';
  $('#sv-panel').innerHTML = `
    <div class="px-2 py-10 text-center">
      <span class="stamp stamp-press">제출</span>
      <h2 class="mt-6 text-2xl font-extrabold">고마워요, ${esc(sv.data.me.name)}!</h2>
      <p class="mt-2 leading-relaxed text-ink-muted">${esc(sv.data.monthLabel)} 설문을 잘 받았어요.<br>친구들의 정보를 지키기 위해 제출한 답은 다시 불러오지 않아요.</p>
      <button id="sv-home" type="button" class="btn btn-ghost mt-8 px-6 py-3">처음으로</button>
    </div>`;
  window.scrollTo(0, 0);
  $('#sv-home').onclick = goHomeFromSurvey;
}

function endSurveyPanel(title, message) {
  setDirty(false);
  S.sv.done = true;
  clearTimeout(surveyCloseTimer);
  $('#sv-panel').innerHTML = `
    <div class="px-2 py-10 text-center">
      <p class="text-4xl" aria-hidden="true">🔒</p>
      <h2 class="mt-4 text-xl font-extrabold">${esc(title)}</h2>
      <p class="mt-2 leading-relaxed text-ink-muted">${esc(message)}</p>
      <button id="sv-home" type="button" class="btn btn-ghost mt-8 px-6 py-3">처음으로</button>
    </div>`;
  $('#sv-home').onclick = goHomeFromSurvey;
}

function armSurveyClose() {
  clearTimeout(surveyCloseTimer);
  const sv = S.sv, closeMs = sv && sv.data ? scheduleMs(sv.data.closeAt) : 0;
  if (!sv || !closeMs) return;
  surveyCloseTimer = setTimeout(() => {
    if (S.sv !== sv || sv.done) return;
    if (Date.now() < closeMs) return armSurveyClose();
    if (sv.submitting) return;
    endSurveyPanel('설문이 마감됐어요', '마감 시각이 지나 더 이상 제출할 수 없어요.');
  }, Math.max(0, Math.min(closeMs - Date.now(), 2147483647)));
}

async function loadDashboard(month) {

$('#tb-delete').addEventListener('click', async () => {

$('#tb-toggle').addEventListener('click', async () => {
  const cur = S.data.months.find(x => x.month === S.month);
  if (!cur) return;
  if (cur.status !== '진행중') {
    const other = S.data.months.find(x => x.status === '진행중' && x.month !== cur.month);
    if (!(await mConfirm(`${monthLabel(cur.month)} 설문을 다시 열까요?`, other ? `진행 중인 ${monthLabel(other.month)} 설문은 자동으로 마감돼요.` : '학생들이 다시 응답하거나 고칠 수 있어요.', { ok: '다시 열기' }))) return;
    loading(true, '설문을 여는 중');
    const r = await call('openMonth', S.token, cur.month);
    loading(false);
    if (r && r.ok) { toast('설문을 다시 열었어요'); loadDashboard(cur.month); } else if (r) mAlert('열지 못했어요', r.message);
    return;
  }
  openCloseModal(cur);
});

function openCloseModal(cur) {
  const pad = n => String(n).padStart(2, '0');
  const d = new Date(Date.now() + 24 * 3600 * 1000);
  const def = cur.closeAt ? cur.closeAt.replace(' ', 'T') : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T18:00`;
  openModal(`<h3 class="text-lg font-extrabold">${monthLabel(cur.month)} 설문 마감</h3>
    <label class="mt-4 flex cursor-pointer items-center justify-between gap-3 rounded-lg border border-line px-3 py-2.5 text-sm font-bold">
      <span>예약 마감 사용</span><input id="cs-toggle" type="checkbox" class="h-5 w-5 accent-[#24493D]" ${cur.closeAt ? 'checked' : ''}></label>
    <div id="cs-field" ${cur.closeAt ? '' : 'hidden'} class="mt-3">
      <label class="field-label" for="cs-when">마감 날짜와 시간</label>
      <input id="cs-when" type="datetime-local" class="field" value="${esc(def)}">
      <p class="mt-2 text-xs leading-relaxed text-ink-muted">예약 시각이 지나면 새 응답과 수정이 막혀요.</p>
    </div>
    <p id="cs-hint" ${cur.closeAt ? 'hidden' : ''} class="mt-2 text-xs leading-relaxed text-ink-muted">예약을 끄면 확인 후 바로 마감돼요. 마감한 뒤에도 [다시 열기]로 열 수 있어요.</p>
    <p id="cs-err" class="mt-2 hidden text-sm font-semibold text-stamp" role="alert"></p>
    <div class="mt-6 flex flex-wrap gap-2">
      ${cur.closeAt ? '<button type="button" id="cs-clear" class="btn btn-ghost mr-auto">예약 취소</button>' : ''}
      <button type="button" data-close="" class="btn btn-ghost">취소</button>
      <button type="button" id="cs-save" class="btn btn-primary">${cur.closeAt ? '예약 저장' : '바로 마감'}</button>
    </div>`, {
    onMount: (w, close) => {
      const tog = w.querySelector('#cs-toggle'), save = w.querySelector('#cs-save'), err = w.querySelector('#cs-err');
      const sync = () => { w.querySelector('#cs-field').hidden = !tog.checked; w.querySelector('#cs-hint').hidden = tog.checked; save.textContent = tog.checked ? '예약 저장' : '바로 마감'; };
      tog.addEventListener('change', sync);
      const done = async (fn, args, msg) => {
        save.disabled = true;
        const r = await call(fn, S.token, ...args);
        save.disabled = false;
        if (!r) return;
        if (!r.ok) { err.textContent = r.message; err.classList.remove('hidden'); return; }
        close(true); toast(msg); loadDashboard(cur.month);
      };
      save.onclick = () => tog.checked
        ? done('setCloseSchedule', [cur.month, w.querySelector('#cs-when').value], '마감 예약을 저장했어요')
        : done('closeMonth', [cur.month], '설문을 마감했어요');
      const clr = w.querySelector('#cs-clear');
      if (clr) clr.onclick = () => done('setCloseSchedule', [cur.month, ''], '마감 예약을 취소했어요');
    }
  });
}

function renderTabbar() {
  $('#tabbar').innerHTML = TABS.map(([k, label]) => `<button type="button" data-tab="${k}" role="tab" aria-controls="tab-${k}" aria-selected="${S.tab === k}" tabindex="${S.tab === k ? 0 : -1}" class="ws-tab">${label}</button>`).join('');
}
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });
$('#tabbar').addEventListener('keydown', e => {
  const moves = { ArrowRight: 1, ArrowLeft: -1 };

  const i = TABS.findIndex(([k]) => k === S.tab);
  switchTab(TABS[(i + moves[e.key] + TABS.length) % TABS.length][0]);

});
function switchTab(k) { S.tab = TABS.some(([key]) => key === k) ? k : 'map'; renderTabbar(); renderTab(S.tab); }
function renderTab(k) {

function renderNoMonth(k) {

document.addEventListener('click', e => {
