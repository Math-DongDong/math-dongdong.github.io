/* ── 응답 엑셀 (SheetJS): 학생별 응답 · 관계 목록 · 학생별 요약 ── */
function downloadResponsesXlsx() {
  if (!window.XLSX) return mAlert('엑셀 도구를 불러오지 못했어요', '인터넷 연결을 확인하고 새로고침한 뒤 다시 시도해 주세요.');
  const d = S.data, cur = d && d.cur, qs = d ? d.config.questions : [];
  if (!cur) return;
  const stu = id => d.students.find(x => x.id === id) || { studentNo: '', name: nameOf(id), number: '' };
  const cell = (id, pol) => cur.edges.filter(e => e.s === id && e.pol === pol).sort((a, b) => a.rank - b.rank)
    .map(e => `${nameOf(e.o)} [${(e.tags || []).join(', ')}] ${e.text}`).join('
');
  const sheet1 = [['학번', '이름', '제출', '1. 분위기 점수', '분위기 이유'].concat(qs.map((q, i) => `${i + 2}. ${POL_STYLE[q.pol].label}`))];
  d.students.forEach(s => {
    const st = cur.stats[s.id];
    sheet1.push([s.studentNo, s.name, st.responded ? 'O' : '', st.climate || '', st.climateReason || ''].concat(qs.map(q => cell(s.id, q.pol))));
  });
  const sheet2 = [['응답 학번', '응답 이름', '구분', '순서', '대상 학번', '대상 이름', '분류', '이유']];
  cur.edges.slice().sort((a, b) => String(stu(a.s).studentNo).localeCompare(String(stu(b.s).studentNo), 'ko', { numeric: true }) || a.pol.localeCompare(b.pol) || a.rank - b.rank)
    .forEach(e => sheet2.push([stu(e.s).studentNo, stu(e.s).name, POL_STYLE[e.pol].label, e.rank, stu(e.o).studentNo, stu(e.o).name, (e.tags || []).join(', '), e.text]));
  const sheet3 = [['학번', '이름', '받은 즐거운 선택', '서로 즐거운 관계', '받은 불편 응답', '분위기 점수']];
  d.students.forEach(s => { const st = cur.stats[s.id]; sheet3.push([s.studentNo, s.name, st.recvPos, st.mutual, st.recvNeg, st.climate || '']); });
  const wb = XLSX.utils.book_new();
  const add = (rows, name, widths) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(sheet1, '학생별 응답', [10, 10, 6, 12, 40, 50, 50]);
  add(sheet2, '관계 목록', [10, 10, 22, 6, 10, 10, 30, 50]);
  add(sheet3, '학생별 요약', [10, 10, 14, 14, 14, 10]);
  XLSX.writeFile(wb, `관계설문_${S.month}.xlsx`);
  toast('엑셀 파일을 내려받았어요');
}

/* ═══════════════════════════════════════════════════════════════
 *  6. 지도 탭: 칠판 관계지도 + 필터 알약 + 학생 개별 선택 드롭다운
 * ═══════════════════════════════════════════════════════════════ */
function renderMap() {
  const cur = S.data.cur, d = S.data.diff;
  $('#map-empty').hidden = true;
  $('#map-body').hidden = false;
  const prevT = d ? S.data.months.find(x => x.month === d.prevMonth) : null;
  const delta = (a, b, goodUp, digits) => {
    if (!prevT || a == null || b == null) return '';
    const x = Math.round((a - b) * 10) / 10;
    if (!x) return '<p class="mt-0.5 text-[11px] font-semibold text-ink-muted">지난달과 같아요</p>';
    return `<p class="mt-0.5 text-[11px] font-bold ${(goodUp ? x > 0 : x < 0) ? 'text-board' : 'text-stamp'}">지난달보다 ${x > 0 ? '+' : ''}${digits ? x.toFixed(1) : x}</p>`;
  };
  const stat = (label, value, unit, sub) => `<div class="stat"><p class="text-xs font-bold text-ink-muted">${label}</p>
    <p class="mt-0.5 text-2xl font-extrabold tabular-nums">${value}<span class="ml-0.5 text-sm font-semibold text-ink-muted">${unit}</span></p>${sub || ''}</div>`;
  const negCount = cur.edges.filter(e => e.pol === POL.NEG).length;
  $('#map-stats').innerHTML =
    stat('설문 응답', `${cur.responded}/${cur.total}`, '명') +
    stat('서로 즐거운 관계', cur.mutualPairs.length, '쌍', delta(cur.mutualPairs.length, prevT && prevT.mutual, true)) +
    stat('불편 응답', negCount, '건', delta(negCount, prevT && prevT.neg, false)) +
    stat('학급 분위기', cur.climate.avg == null ? '-' : cur.climate.avg.toFixed(1), '/ 5', delta(cur.climate.avg, prevT && prevT.climateAvg, true, true));
  renderMapControls(); renderLegend(); renderBelowMap();
  if (S.netDirty || !S.net) buildNetwork();
  else { S.net.setSize('100%', '100%'); S.net.redraw(); refreshGraph(); }
}

function renderMapControls() {
  document.querySelectorAll('[data-mode]').forEach(b => {
    const on = S.mode === b.dataset.mode;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
    if (b.dataset.mode === 'diff') { b.disabled = !S.data.diff; b.title = S.data.diff ? '' : '비교할 지난달이 없어요'; }
  });
  const chip = (key, on, label, color) => `<button type="button" data-filter="${key}" class="chip ${on ? 'chip-on' : ''}" aria-pressed="${on}"><span class="h-2.5 w-2.5 rounded-full ring-1 ring-black/20" style="background:${color}"></span>${label}</button>`;
  $('#map-filters').innerHTML = S.mode === 'month'
    ? chip('pos', S.filters.pos, '즐거운 관계', CH.posBlue) + chip('neg', S.filters.neg, '불편한 관계', CH.red) + chip('mutualOnly', S.filters.mutualOnly, '서로 즐거운 관계만', CH.yellow) + chip('mutualNegOnly', S.filters.mutualNegOnly, '서로 불편한 관계만', CH.red)
    : chip('added', S.diffFilters.added, '새로 생김', CH.green) + chip('removed', S.diffFilters.removed, '사라지거나 풀림', CH.gray) + chip('kept', S.diffFilters.kept, '그대로', CH.posBlue);
  renderStudentFilter();
}

/** 알약 태그 오른쪽 끝의 학생 드롭다운: 고른 학생과 이어진 관계만 남겨 봅니다 */
let studentFilterOptions = '';
function renderStudentFilter() {
  const sel = $('#map-student-filter'), list = S.data ? S.data.students : [];
  const options = '<option value="">전체</option>'
    + list.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
  if (options !== studentFilterOptions) { sel.innerHTML = options; studentFilterOptions = options; }
  if (S.studentFilter && !list.some(x => x.id === S.studentFilter)) S.studentFilter = '';
  sel.value = S.studentFilter;
  sel.disabled = !list.length;
  sel.classList.toggle('ring-2', !!S.studentFilter);
  sel.classList.toggle('ring-board', !!S.studentFilter);
}
$('#map-student-filter').addEventListener('change', e => {
  S.studentFilter = e.target.value;
  renderStudentFilter();
  refreshGraph();
  fitNetwork(true);
});

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  if (b.disabled || !S.data || !S.data.cur) return;
  S.mode = b.dataset.mode; renderMapControls(); renderLegend(); refreshGraph(); renderBelowMap();
}));
$('#map-filters').addEventListener('click', e => {
  const b = e.target.closest('[data-filter]'); if (!b) return;
  const f = S.mode === 'month' ? S.filters : S.diffFilters;
  const key = b.dataset.filter, turningOn = !f[key];
  f[key] = turningOn;
  // ‘서로 ~만’ 알약은 혼자서만 켜져요 — 켜면 나머지 알약은 모두 꺼집니다
  if (S.mode === 'month' && turningOn) {
    const mutualKeys = ['mutualOnly', 'mutualNegOnly'];
    if (mutualKeys.includes(key)) Object.keys(f).forEach(k => { if (k !== key) f[k] = false; });
    else mutualKeys.forEach(k => { f[k] = false; });
  }
  renderMapControls(); refreshGraph();
});

function renderLegend() {
  const item = (mark, text) => `<span class="inline-flex items-center gap-1.5"><span class="inline-flex h-5 items-center rounded bg-board px-1.5" aria-hidden="true">${mark}</span>${text}</span>`;
  const dot = (c, t) => item(`<span class="h-2.5 w-2.5 rounded-full" style="background:${c}"></span>`, t);
  const line = (c, t, dashed) => item(`<span class="inline-block w-5 border-t-[3px] ${dashed ? 'border-dashed' : ''}" style="border-color:${c}"></span>`, t);
  $('#map-legend').innerHTML = S.mode === 'month'
    ? dot(CH.yellow, '서로 즐거운 관계 있음') + dot(CH.chalk, '보통') + dot(CH.gray, '선택받지 못함') + dot(CH.darkRed, '불편 응답 2건 이상')
      + item(`<span class="h-3 w-3 rounded-full border-[3px]" style="background:${CH.darkRed};border-color:${CH.gray}"></span>`, '둘 다 해당')
      + line(CH.yellow, '서로 즐거운 관계') + line(CH.red, '서로 불편한 관계') + line(CH.posBlue, '즐거운 관계(→)') + line(CH.red, '불편한 관계(점선)', true)
    : dot(CH.green, '받은 선택 늘어남') + dot(CH.red, '줄어듦') + dot(CH.chalk, '같음')
      + line(CH.green, '새로 생긴 즐거운 관계') + line(CH.red, '새로 생긴 불편 관계', true) + line(CH.gray, '사라진 관계', true)
      + `<span class="basis-full text-[11px] font-medium text-ink/70">${shortMonth(S.data.diff.prevMonth)}과 ${shortMonth(S.month)} 모두 응답한 ${S.data.diff.comparable}명의 답만 비교해요.</span>`;
}

/* ── 칠판 위 관계지도 (vis-network) ── */
let layoutSeed = 11;
const NETWORK_OPTIONS = {
  autoResize: true,
  nodes: { shape: 'dot', scaling: { min: 10, max: 30, label: { enabled: false } } },
  edges: { smooth: { enabled: true, type: 'curvedCW', roundness: 0.16 }, selectionWidth: 0, hoverWidth: 0.6 },
  physics: {
    enabled: true, solver: 'forceAtlas2Based', minVelocity: 0.8,
    forceAtlas2Based: { gravitationalConstant: -85, centralGravity: 0.01, springLength: 140, springConstant: 0.06, damping: 0.5, avoidOverlap: 0.8 },
    stabilization: { enabled: true, iterations: 600, updateInterval: 40, fit: false }
  },
  interaction: { hover: true, tooltipDelay: 120, keyboard: false, selectConnectedEdges: false }
};
const edgeColor = (color, opacity) => ({ color, highlight: color, hover: color, opacity });

function makeNodes() {
  const cur = S.data.cur, diff = S.data.diff, dmap = {};
  if (diff) diff.students.forEach(x => { dmap[x.id] = x; });
  return S.data.students.map(s => {
    const st = cur.stats[s.id];
    let bg, title, border = CH.board, bw = 2;
    if (S.mode === 'diff' && diff) {
      const x = dmap[s.id], dd = x.curPos - x.prevPos;
      bg = dd > 0 ? CH.green : dd < 0 ? CH.red : CH.chalk;
      title = `${s.name}: 받은 선택 ${x.prevPos} → ${x.curPos}`;
    } else {
      const isolated = cur.responded && st.recvPos === 0, manyNeg = st.recvNeg >= 2;
      bg = manyNeg ? CH.darkRed : isolated ? CH.gray : st.mutual > 0 ? CH.yellow : CH.chalk;
      border = manyNeg && isolated ? CH.gray : CH.board;
      bw = manyNeg && isolated ? 5 : 2;
      title = `${s.name}: 받은 선택 ${st.recvPos}, 서로 즐거운 관계 ${st.mutual}, 불편 응답 ${st.recvNeg}`;
    }
    return {
      id: s.id, label: s.name, value: 1 + st.recvPos, title: tooltip([title]), borderWidth: bw,
      color: { background: bg, border: border, highlight: { background: bg, border: CH.yellow }, hover: { background: bg, border: CH.yellow } },
      font: { color: CH.chalk, size: 14, face: 'Pretendard', strokeWidth: 4, strokeColor: CH.board }
    };
  });
}

function makeEdges() {
  S.edgeInfo = {};
  const edges = [];
  let n = 0;
  const push = (edge, info) => { const id = 'e' + (n++); edge.id = id; edge.physics = false; S.edgeInfo[id] = info; edges.push(edge); };
  const short = e => (e.text ? '“' + e.text + '”' : '');
  const arrow = { to: { enabled: true, scaleFactor: 0.45 } };

  if (S.mode === 'month') {
    const es = S.data.cur.edges, has = {}, done = {};
    es.forEach(e => { has[e.s + '|' + e.o + '|' + e.pol] = e; });
    es.forEach(e => {
      const rev = has[e.o + '|' + e.s + '|' + e.pol];
      const pairKey = e.pol + '|' + [e.s, e.o].sort().join('|');
      const mutualOnlyMode = S.filters.mutualOnly || S.filters.mutualNegOnly;
      if (e.pol === POL.POS) {
        if (rev) {
          if (done[pairKey]) return; done[pairKey] = 1;
          if (!(mutualOnlyMode ? S.filters.mutualOnly : S.filters.pos)) return;
          push({ from: e.s, to: e.o, width: 3.6, color: edgeColor(CH.yellow, 0.95), title: tooltip([`${nameOf(e.s)} ↔ ${nameOf(e.o)}: 서로 즐거운 관계`]) }, { title: '서로 즐거운 관계예요', list: [e, rev] });
        } else if (S.filters.pos && !mutualOnlyMode) {
          push({ from: e.s, to: e.o, arrows: arrow, width: [0, 2.2, 1.6, 1.2][e.rank] || 1.2, color: edgeColor(CH.posBlue, 0.85), title: tooltip([`${nameOf(e.s)} → ${nameOf(e.o)}: ${short(e)}`]) }, { title: '즐겁게 지내는 친구로 골랐어요', list: [e] });
        }
      } else if (e.pol === POL.NEG) {
        // 서로 불편한 관계: 서로 즐거운 관계와 같은 굵은 실선, 색만 빨강
        if (rev) {
          if (done[pairKey]) return; done[pairKey] = 1;
          if (!(mutualOnlyMode ? S.filters.mutualNegOnly : S.filters.neg)) return;
          push({ from: e.s, to: e.o, width: 3.6, color: edgeColor(CH.red, 0.95), title: tooltip([`${nameOf(e.s)} ↔ ${nameOf(e.o)}: 서로 불편한 관계`]) }, { title: '서로 불편한 관계예요', list: [e, rev] });
        } else if (S.filters.neg && !mutualOnlyMode) {
          push({ from: e.s, to: e.o, arrows: arrow, width: 2, dashes: [6, 5], color: edgeColor(CH.red, 1), title: tooltip([`${nameOf(e.s)} → ${nameOf(e.o)}: ${short(e)}`]) }, { title: '마음이 불편하다고 답했어요', list: [e] });
        }
      }
    });
  } else {
    const d = S.data.diff, f = S.diffFilters;
    const add = (list, style, info) => list.forEach(e => push(Object.assign({ from: e.s, to: e.o, arrows: arrow, title: tooltip([`${nameOf(e.s)} → ${nameOf(e.o)}: ${info}`]) }, style), { title: info, list: [e] }));
    if (f.kept) {
      add(d.keptPos, { width: 1, color: edgeColor(CH.posBlue, 0.3) }, '두 달 연속 즐거운 관계');
      add(d.keptNeg, { width: 1, dashes: [6, 5], color: edgeColor(CH.red, 0.45) }, '두 달 연속 불편한 관계');
    }
    if (f.removed) {
      add(d.lostPos, { width: 1.6, dashes: [6, 6], color: edgeColor(CH.gray, 1) }, '지난달엔 즐거운 관계였지만 이번 달엔 고르지 않았어요');
      add(d.resolvedNeg, { width: 1.6, dashes: [2, 5], color: edgeColor(CH.green, 0.8) }, '지난달 불편했던 관계가 풀렸어요');
    }
    if (f.added) {
      add(d.newPos, { width: 3, color: edgeColor(CH.green, 1) }, '새로 생긴 즐거운 관계');
      add(d.newNeg, { width: 3, dashes: [6, 5], color: edgeColor(CH.red, 1) }, '새로 생긴 불편한 관계');
    }
  }
  return edges;
}

function makeLayoutEdges() {
  const weight = new Map();
  S.data.cur.edges.forEach(e => {
    if (e.pol !== POL.POS) return;
    const key = e.s < e.o ? `${e.s}|${e.o}` : `${e.o}|${e.s}`;
    weight.set(key, (weight.get(key) || 0) + Math.max(1, 4 - e.rank));
  });
  return [...weight.entries()].map(([key, w]) => { const [a, b] = key.split('|'); return { id: `L|${key}`, from: a, to: b, hidden: true, physics: true, length: Math.max(70, 150 - w * 14) }; });
}

function graphData() {
  const nodes = makeNodes(), edges = makeEdges(), f = S.focusId;
  const sf = nodes.some(nd => nd.id === S.studentFilter) ? S.studentFilter : '';
  const shown = new Set([sf]);
  if (sf) edges.forEach(e => { if (e.from === sf) shown.add(e.to); else if (e.to === sf) shown.add(e.from); });
  edges.forEach(e => { e.hidden = !!sf && e.from !== sf && e.to !== sf; });
  nodes.forEach(nd => { nd.hidden = !!sf && !shown.has(nd.id); });   // 필터를 풀 때 되살아나도록 항상 지정
  if (!f) return { nodes, edges };
  const near = new Set([f]);
  edges.forEach(e => { if (e.from === f) near.add(e.to); if (e.to === f) near.add(e.from); });
  edges.forEach(e => {
    if (e.from === f || e.to === f) { e.width = (e.width || 1) + 1.2; e.color = Object.assign({}, e.color, { opacity: 1 }); }
    else e.color = Object.assign({}, e.color, { opacity: 0.06 });
  });
  const faint = 'rgba(243,240,228,0.12)';
  nodes.forEach(nd => {
    if (nd.id === f) {
      nd.borderWidth = 5;
      nd.color = Object.assign({}, nd.color, { border: CH.yellow });
      nd.font = Object.assign({}, nd.font, { size: 17, color: CH.yellow });
    } else if (!near.has(nd.id)) {
      nd.color = { background: faint, border: 'rgba(243,240,228,0.18)', highlight: { background: faint, border: CH.yellow }, hover: { background: 'rgba(243,240,228,0.3)', border: CH.yellow } };
      nd.font = Object.assign({}, nd.font, { color: 'rgba(243,240,228,0.25)', strokeWidth: 0 });
    }
  });
  return { nodes, edges };
}

function refreshGraph() {
  if (!S.data || !S.data.cur || S.tab !== 'map') return;
  if (!S.net || S.netDirty) return buildNetwork();
  const g = graphData();
  S.nodesDS.update(g.nodes);
  S.edgesDS.clear();
  S.edgesDS.add(makeLayoutEdges().concat(g.edges));
}

function buildNetwork() {
  const box = $('#network');
  if (S.net) { S.net.destroy(); S.net = null; }
  S.netDirty = false;
  S.netReady = null;
  if (!window.vis) { box.innerHTML = '<p class="p-6 text-chalk">그래프 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>'; return; }
  if (!S.data.students.length) { box.innerHTML = '<p class="p-6 text-chalk">아직 학생이 없어요. 관리 탭에서 학생 명단을 추가해 주세요.</p>'; return; }
  box.innerHTML = '';
  const g = graphData(), saved = loadPositions();
  const placed = g.nodes.filter(nd => saved[nd.id]).map(nd => nd.id), allPlaced = placed.length === g.nodes.length;
  g.nodes.forEach(nd => { const p = saved[nd.id]; if (p) { nd.x = p.x; nd.y = p.y; if (!allPlaced) nd.fixed = true; } });
  S.nodesDS = new vis.DataSet(g.nodes);
  S.edgesDS = new vis.DataSet(makeLayoutEdges().concat(g.edges));
  const options = Object.assign({}, NETWORK_OPTIONS, { layout: { improvedLayout: true, randomSeed: layoutSeed } }, allPlaced ? { physics: { enabled: false } } : {});
  const net = S.net = new vis.Network(box, { nodes: S.nodesDS, edges: S.edgesDS }, options);
  if (allPlaced) { fitNetwork(false); S.netReady = Promise.resolve(); }
  else S.netReady = new Promise(done => {
    net.once('stabilizationIterationsDone', () => {
      if (S.net === net) {
        net.setOptions({ physics: { enabled: false } });
        if (placed.length) S.nodesDS.update(placed.map(id => ({ id, fixed: false })));
        savePositions();
        fitNetwork(false);
      }
      done();
    });
    setTimeout(done, 4000);
  });
  net.on('dragEnd', p => { if (p.nodes.length) savePositions(); });
  net.on('click', p => {
    if (p.nodes.length) return p.nodes[0] === S.focusId ? clearFocus() : focusStudent(p.nodes[0]);
    if (p.edges.length && S.edgeInfo[p.edges[0]]) return showEdgeInfo(S.edgeInfo[p.edges[0]]);
    if (drawerId || S.focusId) clearFocus();
  });
  if (S.focusId) net.selectNodes([S.focusId]);
}

function fitNetwork(animate) {
  if (!S.net) return;
  const opts = { maxZoomLevel: 1.4, animation: animate ? { duration: 400, easingFunction: 'easeInOutQuad' } : false };
  if (S.studentFilter && S.nodesDS) {
    const visible = S.nodesDS.get({ filter: nd => !nd.hidden }).map(nd => nd.id);
    if (visible.length) opts.nodes = visible;
  }
  S.net.fit(opts);
}

const POSITION_STORE_KEY = 'relationmap:pos';
function loadPositions() {
  if (!S.positions) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(POSITION_STORE_KEY) || '{}') || {}; } catch (e) { saved = {}; }
    S.positions = saved;
  }
  return S.positions;
}
function savePositions() {
  if (!S.net) return;
  const all = Object.assign({}, loadPositions(), S.net.getPositions());
  S.positions = all;
  try { localStorage.setItem(POSITION_STORE_KEY, JSON.stringify(all)); } catch (e) {}
}

$('#btn-fit').addEventListener('click', () => fitNetwork(true));
$('#btn-relayout').addEventListener('click', () => {
  if (!S.data || !S.data.cur) return;
  S.positions = {};
  try { localStorage.removeItem(POSITION_STORE_KEY); } catch (e) {}
  layoutSeed = Math.floor(Math.random() * 100000);
  buildNetwork();
});

async function focusStudent(id, opts) {
  opts = opts || {};
  if (!S.data || !S.data.cur || !S.data.cur.stats[id]) return;
  S.focusId = id;
  if (S.tab !== 'map') switchTab('map');
  else { refreshGraph(); renderBelowMap(); }
  openDrawer(id);
  if (S.netReady) await S.netReady;
  if (!S.net || S.focusId !== id) return;
  S.net.selectNodes([id]);
  if (opts.center) S.net.focus(id, { scale: Math.max(S.net.getScale(), 1), animation: { duration: 450 } });
}

function clearFocus() {
  if (drawerId) return closeDrawer();
  S.focusId = null;
  refreshGraph(); renderBelowMap();
  if (S.net) S.net.unselectAll();
}

function showEdgeInfo(info) {
  openModal(`<h3 class="text-lg font-extrabold">${esc(info.title)}</h3>
    <div class="mt-4 space-y-4">${info.list.map(e => `<div>
      <p class="text-sm font-bold"><button type="button" data-student="${esc(e.s)}" data-close="" class="underline underline-offset-4">${esc(nameOf(e.s))}</button>
      <span class="text-ink-muted"> → </span><button type="button" data-student="${esc(e.o)}" data-close="" class="underline underline-offset-4">${esc(nameOf(e.o))}</button>
      ${e.date ? `<span class="ml-1 text-xs font-normal text-ink-muted">${esc(e.date)}</span>` : ''}</p>
      <div class="mt-2 flex flex-wrap items-center gap-1.5">${reasonHtml(e) || '<span class="text-sm text-ink-muted">이유가 없어요</span>'}</div></div>`).join('')}</div>
    <div class="mt-6 flex"><button data-close="" class="btn btn-ghost flex-1 py-3">닫기</button></div>`);
}

/* ═══════════════════════════════════════════════════════════════
 *  7. 지도 아래 표: '살펴볼 점'(이번 달) / '지난달과 달라진 점'(비교 모드)
 * ═══════════════════════════════════════════════════════════════ */
function sectionTable(icon, title, note, tone, head, rows, unit, count) {
  if (!rows.length) return '';
  const toneBox = tone === 'neg' ? 'border-stamp/40' : tone === 'good' ? 'border-board/40' : '';
  const toneHead = tone === 'neg' ? 'bg-stamp-soft' : tone === 'good' ? 'bg-board-soft' : 'bg-page/50';
  const toneText = tone === 'neg' ? 'text-stamp' : tone === 'good' ? 'text-board' : '';
  return `<section class="panel overflow-hidden ${toneBox}">
    <div class="flex flex-wrap items-baseline gap-x-2 border-b border-line px-4 py-3 ${toneHead}">
      <h3 class="font-extrabold ${toneText}">${icon} ${title}</h3>
      ${unit === false ? '' : `<span class="text-sm font-bold text-ink-muted">${count == null ? rows.length : count}${unit || '건'}</span>`}
      ${note ? `<span class="basis-full text-xs text-ink-muted">${note}</span>` : ''}
    </div>
    <div class="overflow-x-auto"><table class="w-full min-w-[520px] text-sm">
      <thead><tr>${head.map(h => `<th class="th">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}</tbody></table></div>
  </section>`;
}
const tablesOrNote = (tables, note) => tables.join('') || `<div class="panel p-5 text-sm text-ink-muted">${note}</div>`;
const trCells = cells => `<tr>${cells.map(c => `<td class="td">${c}</td>`).join('')}</tr>`;
const whoLink = id => `<button type="button" data-student="${esc(id)}" class="font-bold text-board underline underline-offset-4">${esc(nameOf(id))}</button>`;
const dash = '<span class="text-ink-muted/60">-</span>';

function renderBelowMap() {
  if (!S.data || !S.data.cur) return;
  const diffMode = S.mode === 'diff' && S.data.diff;
  $('#below-title').textContent = diffMode ? `${shortMonth(S.data.diff.prevMonth)} → ${shortMonth(S.month)}, 지난달과 달라진 점` : '살펴볼 점';
  diffMode ? renderDiffTables() : renderAlerts();
}

function renderAlerts() {
  const cur = S.data.cur, w = cur.watch;
  $('#map-alerts').innerHTML = tablesOrNote([
    sectionTable('🚨', '세심한 확인이 필요한 응답', '따돌림·속상함을 뜻하는 분류를 골랐거나, 이유 글에 위험한 낱말이 들어 있어요.', 'neg', ['쓴 학생', '대상', '어디에서', '걸린 분류·낱말', '내용'],
      w.sensitive.map(x => trCells([whoLink(x.s), x.o ? whoLink(x.o) : dash, esc(x.where), `<span class="font-bold text-stamp">${esc(x.hits.join(', '))}</span>`, `“${esc(x.text)}”`]))),
    sectionTable('🌧️', '학급 분위기를 낮게 매긴 학생', '1점 교실에 있으면 불편하거나 불안하다 · 2점 마음에 별로 안든다', '', ['학생', '점수', '이유'],
      w.climateLow.map(x => trCells([whoLink(x.id), `<span class="font-extrabold ${x.score === 1 ? 'text-stamp' : ''}">${x.score}점</span>`, x.reason ? esc(x.reason) : dash])), '명'),
    sectionTable('🌑', '즐거운 친구로 선택받지 못한 학생', '이 학생이 고른 친구는 연결의 실마리가 될 수 있어요.', '', ['학생', '응답 여부', '이 학생이 즐겁게 지낸다고 고른 친구'],
      w.isolated.map(x => trCells([whoLink(x.id), x.responded ? '제출' : '<span class="text-ink-muted">미응답</span>', x.chose.length ? x.chose.map(whoLink).join(', ') : dash])), '명'),
    sectionTable('⚡', '서로 불편함 · 마음이 엇갈림', '마음이 엇갈림: 앞 학생은 즐거운 친구로 골랐지만 뒤 학생은 불편하다고 답했어요.', '', ['구분', '학생 A', 'A가 쓴 이유', '학생 B', 'B가 쓴 이유'],
      w.conflicts.map(x => trCells([`<b>${esc(x.type)}</b>`, whoLink(x.a), x.aText ? `“${esc(x.aText)}”` : '-', whoLink(x.b), x.bText ? `“${esc(x.bText)}”` : '-']))),
    sectionTable('⏳', '아직 응답하지 않은 학생', '', '', ['학생'], w.missing.length ? [trCells([w.missing.map(whoLink).join(', ')])] : [], '명', w.missing.length)
  ], cur.responded ? '눈에 띄게 살펴볼 점이 없어요.' : '아직 응답이 없어요. 학생들이 제출하면 여기에 살펴볼 점이 정리돼요.');
}

function renderDiffTables() {
  const d = S.data.diff, hl = d.highlights;
  const hlRows = [
    ['좋아짐', '친구 선택을 처음 받았어요', hl.escaped], ['좋아짐', '받은 친구 선택이 2명 이상 늘었어요', hl.grew],
    ['좋아짐', '학급 분위기를 2점 이상 높게 매겼어요', hl.climateUp],
    ['살펴볼 점', '지난달엔 선택받았지만 이번 달엔 아무도 고르지 않았어요', hl.newIsolated], ['살펴볼 점', '받은 친구 선택이 2명 이상 줄었어요', hl.shrank],
    ['살펴볼 점', '불편하다는 응답을 새로 받았어요', hl.newNegTarget], ['살펴볼 점', '학급 분위기를 2점 이상 낮게 매겼어요', hl.climateDown]
  ].filter(r => r[2].length).map(([g, k, ids]) => trCells([`<span class="rounded-full px-2 py-0.5 text-xs font-bold ${g === '좋아짐' ? 'bg-board-soft text-board' : 'bg-stamp-soft text-stamp'}">${g}</span>`, k, ids.map(whoLink).join(', ')]));
  const rel = [];
  const addRel = (label, list, tone) => list.forEach(e => rel.push(trCells([
    `<span class="font-bold ${tone === 'good' ? 'text-board' : tone === 'neg' ? 'text-stamp' : 'text-ink-muted'}">${label}</span>`,
    `${whoLink(e.s)} → ${whoLink(e.o)}`, (e.tags || []).length ? esc(e.tags.join(', ')) : dash, e.text ? esc(e.text) : dash])));
  addRel('새로 생긴 즐거운 관계', d.newPos, 'good');
  addRel('새로 생긴 불편한 관계', d.newNeg, 'neg');
  addRel('풀린 불편한 관계', d.resolvedNeg, 'good');
  addRel('사라진 즐거운 관계', d.lostPos, '');
  $('#map-alerts').innerHTML = tablesOrNote([
    sectionTable('🌱', '좋아진 점 · 살펴볼 점', `두 달 모두 응답한 ${d.comparable}명의 답을 기준으로 비교했어요.`, '', ['구분', '내용', '학생'], hlRows),
    sectionTable('🔗', '관계 변화 목록', '“고른 학생 → 대상”이에요. 사라진 관계의 분류·이유는 지난달에 쓴 내용이에요.', '', ['구분', '관계', '분류', '이유'], rel)
  ], `눈에 띄는 변화가 없어요. (두 달 모두 응답한 학생 ${d.comparable}명 기준)`);
}

/* ═══════════════════════════════════════════════════════════════
 *  8. 학생 정보 Drawer (지도 · 다른 탭 공용)
 * ═══════════════════════════════════════════════════════════════ */
function detailHtml(id) {
  const s = S.data.students.find(x => x.id === id);
  const cur = S.data.cur, st = cur.stats[id], E = cur.edges;
  const dx = S.data.diff ? S.data.diff.students.find(x => x.id === id) : null;
  const by = (pol, dir) => E.filter(e => e.pol === pol && (dir === 'out' ? e.s === id : e.o === id)).sort((a, b) => a.rank - b.rank);
  const relTable = (title, list, who, tone) => `
    <section class="border-t border-dashed border-line px-5 py-4">
      <h3 class="mb-2 text-sm font-extrabold ${tone === 'neg' ? 'text-stamp' : tone === 'warn' ? 'text-amber' : ''}">${title} <span class="font-semibold text-ink-muted">${list.length}명</span></h3>
      ${list.length ? `<table class="w-full text-[13px]"><thead><tr><th class="th w-[4.5rem] px-2">친구</th><th class="th px-2">분류</th><th class="th px-2">이유</th></tr></thead>
        <tbody>${list.map(e => `<tr><td class="td px-2">${whoLink(e[who])}</td><td class="td px-2 text-ink-muted">${esc((e.tags || []).join(', ') || '-')}</td><td class="td px-2">${esc(e.text || '')}</td></tr>`).join('')}</tbody></table>`
        : '<p class="text-sm text-ink-muted">없어요.</p>'}
    </section>`;
  const inferred = S.data.facts.filter(f => f.s === id && ['엇갈림', '공통 친구', '한방향 선택', '지난달과 비교'].includes(f.rule));
  const climate = Number(st.climate), prevClimate = dx ? Number(dx.prevClimate) : 0;
  const dd = (a, goodUp) => a ? `<span class="ml-1 text-[11px] font-bold ${(a > 0) === goodUp ? 'text-board' : 'text-stamp'}">(${a > 0 ? '+' : ''}${a})</span>` : '';
  return `
    <div class="sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-line bg-white/95 px-5 pb-3 pt-5 backdrop-blur">
      <div class="min-w-0">
        <p class="text-xs font-semibold text-ink-muted">학번 ${esc(s ? s.studentNo : '')} · ${monthLabel(S.month)}</p>
        <h2 class="mt-0.5 truncate text-2xl font-extrabold">${esc(s ? s.name : id)}</h2>
      </div>
      <button type="button" data-drawer-close class="btn btn-ghost btn-sm shrink-0" aria-label="상세정보 닫기 (ESC)">닫기 <span class="text-[10px] font-semibold text-ink-muted">ESC</span></button>
    </div>
    <div class="px-5 pb-4 pt-4">
      <table class="w-full text-[13px]">
        <thead><tr><th class="th px-2 text-center">받은 선택</th><th class="th px-2 text-center">서로 즐거운 관계</th><th class="th px-2 text-center">불편 응답</th><th class="th px-2 text-center">고른 친구</th></tr></thead>
        <tbody><tr class="text-center font-extrabold tabular-nums">
          <td class="td px-2">${st.recvPos}${dd(dx ? dx.curPos - dx.prevPos : 0, true)}</td><td class="td px-2">${st.mutual}</td>
          <td class="td px-2 ${st.recvNeg ? 'text-stamp' : ''}">${st.recvNeg}${dd(dx ? dx.curNeg - dx.prevNeg : 0, false)}</td>
          <td class="td px-2">${st.givenPos}</td></tr></tbody>
      </table>
      <table class="mt-3 w-full text-[13px]"><tbody>
        <tr><th class="th w-24 px-2">응답</th><td class="td px-2">${st.responded ? `제출 <span class="text-xs text-ink-muted">${esc(st.submittedAt || '')}</span>${st.editAllowed ? ' <span class="text-xs font-semibold text-amber">· 수정 권한 있음</span>' : ''}` : '<span class="text-ink-muted">미응답</span>'}</td></tr>
        <tr><th class="th px-2">우리 반 분위기</th><td class="td px-2 ${climate && climate <= 2 ? 'font-bold text-stamp' : ''}">${climate ? esc(climateLabel(climate)) : '-'}${prevClimate ? ` <span class="text-xs font-normal text-ink-muted">(지난달 ${prevClimate}점)</span>` : ''}</td></tr>
        <tr><th class="th px-2">분위기 이유</th><td class="td px-2">${st.climateReason ? esc(st.climateReason) : '-'}</td></tr>
      </tbody></table>
    </div>
    ${relTable('이 학생이 즐겁게 지내는 친구', by(POL.POS, 'out'), 'o')}
    ${relTable('이 학생을 즐거운 친구로 고른 친구', by(POL.POS, 'in'), 's')}
    ${relTable('이 학생이 불편하다고 한 친구', by(POL.NEG, 'out'), 'o', 'neg')}
    ${relTable('이 학생을 불편하다고 한 친구', by(POL.NEG, 'in'), 's', 'neg')}
    <section class="border-t border-dashed border-line px-5 py-4">
      <h3 class="mb-2 text-sm font-extrabold">규칙으로 찾은 관계 <span class="font-semibold text-ink-muted">${inferred.length}건</span></h3>
      ${inferred.length ? `<table class="w-full text-[13px]"><thead><tr><th class="th px-2">관계</th><th class="th px-2">대상</th><th class="th px-2">규칙</th></tr></thead><tbody>
        ${inferred.map(f => `<tr><td class="td px-2 font-semibold ${f.pol === '부정' ? 'text-stamp' : ''}">${esc(f.p)}</td><td class="td px-2">${f.oIsStudent ? whoLink(f.o) : `<b>${esc(f.o)}</b>`}${f.via ? `<div class="text-xs text-ink-muted">공통 친구 ${f.via.map(v => esc(nameOf(v))).join(', ')}</div>` : ''}</td><td class="td px-2 text-xs text-ink-muted">${esc(f.rule)}</td></tr>`).join('')}
      </tbody></table>` : '<p class="text-sm text-ink-muted">추론된 관계가 없어요.</p>'}
    </section>
    ${S.tab !== 'map' ? '<section class="border-t border-dashed border-line px-5 py-4"><button type="button" data-go-map class="btn btn-ghost w-full py-3">지도에서 보기</button></section>' : ''}`;
}

let drawerId = null;
function openDrawer(id) {
  if (!S.data || !S.data.cur || !S.data.students.some(x => x.id === id)) return;
  const d = $('#drawer'), wasOpen = !!drawerId, top = d.scrollTop, same = drawerId === id;
  drawerId = id;
  d.innerHTML = detailHtml(id);
  d.scrollTop = same ? top : 0;
  d.classList.remove('hidden');
  void d.offsetWidth;
  d.classList.add('open');
  if (!wasOpen) setTimeout(() => { const c = d.querySelector('[data-drawer-close]'); if (c) c.focus(); }, 80);
}
function closeDrawer() {
  if (!drawerId) return;
  drawerId = null;
  const d = $('#drawer');
  d.classList.remove('open');
  setTimeout(() => { if (!drawerId) { d.classList.add('hidden'); d.innerHTML = ''; } }, 260);
  if (S.focusId) { S.focusId = null; if (S.data && S.data.cur) { refreshGraph(); renderBelowMap(); } if (S.net) S.net.unselectAll(); }
}
$('#drawer').addEventListener('click', e => {
  if (e.target.closest('[data-drawer-close]')) return closeDrawer();
  if (e.target.closest('[data-go-map]') && drawerId) focusStudent(drawerId, { center: true });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawerId && !$('#modal-root').children.length) closeDrawer(); });

/* ═══════════════════════════════════════════════════════════════
 *  9. 학생 응답 탭: 학생 한 명 = 한 줄 (수정 권한)
 * ═══════════════════════════════════════════════════════════════ */
async function toggleEditPermission(id, allow) {
  const name = nameOf(id);
  const ok = await mConfirm(allow ? `${name} 학생에게 수정 권한을 줄까요?` : `${name} 학생의 수정 권한을 거둘까요?`,
    allow ? `${name} 학생이 다음에 로그인하면 ${monthLabel(S.month)}에 제출한 답을 불러와 고칠 수 있어요. 다시 제출하면 권한은 자동으로 끝나요.`
          : '학생이 더 이상 지난 답을 불러올 수 없어요.', { ok: allow ? '권한 주기' : '권한 거두기' });
  if (!ok) return;
  const r = await call('setEditPermission', S.token, S.month, id, allow);
  if (!r) return;
  if (!r.ok) return mAlert('바꾸지 못했어요', r.message);
  toast(allow ? `${name} 학생에게 수정 권한을 줬어요` : '수정 권한을 거뒀어요');
  await loadDashboard(S.month);
}

function renderResponses() {
  const el = $('#tab-responses'), d = S.data, qs = d.config.questions;
  el.innerHTML = `
    <p class="text-xs leading-relaxed text-ink-muted">이름을 누르면 학생 정보가 열려요. 이미 제출한 학생은 답을 다시 불러올 수 없어서, 고칠 게 있으면 이름 밑의 [수정 권한 주기]를 눌러 주세요. 다시 제출하면 권한은 자동으로 끝나요. 표가 넓으면 좌우로 밀어 보세요.</p>
    <div class="panel mt-3 overflow-x-auto">
      <table class="w-full min-w-[880px] text-sm">
        <thead><tr>
          <th class="th w-32">학생</th>
          <th class="th w-56">1. 우리 반 분위기</th>
          ${qs.map((q, i) => `<th class="th">${i + 2}. ${POL_STYLE[q.pol].label}</th>`).join('')}
        </tr></thead>
        <tbody id="rs-body"></tbody>
      </table>
    </div>`;
  fillResponses();
}

function fillResponses() {
  const d = S.data, cur = d.cur, qs = d.config.questions;
  const cell = (id, pol) => {
    const list = cur.edges.filter(e => e.s === id && e.pol === pol).sort((a, b) => a.rank - b.rank);
    return list.length ? list.map(e => `<div class="mb-1.5 last:mb-0"><span class="font-bold">${esc(nameOf(e.o))}</span>
      <span class="text-xs text-board">[${esc((e.tags || []).join(', '))}]</span> <span class="text-ink-muted">${esc(e.text)}</span></div>`).join('') : dash;
  };
  const rows = d.students;
  $('#rs-body').innerHTML = rows.length ? rows.map(s => {
    const st = cur.stats[s.id], c = Number(st.climate);
    const nameCell = `<td class="td"><button type="button" data-student="${esc(s.id)}" class="font-bold underline underline-offset-4">${esc(s.name)}</button>
      <div class="text-xs tabular-nums text-ink-muted">${esc(s.studentNo || '')}</div>
      <div class="mt-1.5">${st.responded
        ? `<button type="button" data-perm="${esc(s.id)}" data-allow="${st.editAllowed ? 'off' : 'on'}" class="btn btn-sm ${st.editAllowed ? 'btn-yellow' : 'btn-ghost'}">${st.editAllowed ? '수정 권한 거두기' : '수정 권한 주기'}</button>`
          + (st.editAllowed ? '<div class="mt-1 text-[11px] font-semibold text-amber">수정 가능 · 다시 내면 끝나요</div>' : '')
        : '<span class="rounded-full bg-page px-2 py-0.5 text-xs font-bold text-ink-muted ring-1 ring-line">미제출</span>'}</div></td>`;
    if (!st.responded) return `<tr class="bg-page/40">${nameCell}<td class="td text-ink-muted" colspan="${qs.length + 1}">아직 응답하지 않았어요.</td></tr>`;
    return `<tr>${nameCell}
      <td class="td"><span class="inline-flex rounded-full px-2 py-0.5 text-xs font-extrabold ${c <= 2 ? 'bg-stamp-soft text-stamp' : 'bg-board-soft text-board'}">${esc(climateLabel(c))}</span>
        ${st.climateReason ? `<p class="mt-1 text-ink-muted">${esc(st.climateReason)}</p>` : ''}</td>
      ${qs.map(qq => `<td class="td">${cell(s.id, qq.pol)}</td>`).join('')}
    </tr>`;
  }).join('') : `<tr><td class="td py-10 text-center text-ink-muted" colspan="${qs.length + 2}">아직 학생이 없어요. 관리 탭에서 학생 명단을 등록해 주세요.</td></tr>`;
  $('#rs-body').querySelectorAll('[data-perm]').forEach(b => b.onclick = () => toggleEditPermission(b.dataset.perm, b.dataset.allow === 'on'));
}

/* ═══════════════════════════════════════════════════════════════
 *  10. 관리 탭: 설문 달 + 학생 명단(학번 · 비밀번호)
 * ═══════════════════════════════════════════════════════════════ */
function suggestMonth() {
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const ms = S.data.months.map(x => x.month);
  if (!ms.includes(thisMonth)) return thisMonth;
  const last = ms[ms.length - 1], y = Number(last.slice(0, 4)), mo = Number(last.slice(5, 7));
  return mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`;
}

function renderManage() {
  const d = S.data, el = $('#tab-manage');
  const open = d.months.filter(x => x.status === '진행중').slice(-1)[0];
  const roster = d.roster, noPw = roster.filter(s => s.active && !s.hasPassword).length;
  el.innerHTML = `
    <div class="grid gap-5 lg:grid-cols-[320px_1fr]">
      <aside class="space-y-3">
        <div class="panel p-4 ${open ? 'ring-2 ring-chalk-yellow' : ''}">
          <h2 class="text-sm font-extrabold">달별 설문</h2>
          ${open ? `<p class="mt-2 text-xs font-semibold text-ink-muted">지금 진행 중</p><p class="text-2xl font-extrabold">${monthLabel(open.month)}</p>
            <p class="mt-0.5 text-sm font-semibold text-board">응답 ${open.responded}/${open.total}명${open.closeAt ? ` · ${esc(scheduleLabel(open.closeAt))} 마감 예약` : ''}</p>
            <button id="mg-close" type="button" class="btn btn-ghost mt-3 w-full">${shortMonth(open.month)} 설문 마감하기</button>`
          : '<p class="mt-2 text-sm leading-relaxed text-ink-muted">지금 진행 중인 설문이 없어요. 아래에서 달을 골라 열면 학생들이 참여할 수 있어요.</p>'}
        </div>
        <div class="panel p-4">
          <label class="field-label" for="mg-month">설문을 열 달</label>
          <input id="mg-month" type="month" class="field" value="${suggestMonth()}">
          <button id="mg-open" type="button" class="btn btn-primary mt-3 w-full">이 달 설문 열기</button>
          <p class="mt-2 text-xs leading-relaxed text-ink-muted">새 달을 열면 진행 중이던 달은 자동으로 마감돼요. 지난 달을 다시 열 수도 있어요.</p>
        </div>
        <div class="panel overflow-hidden"><div class="divide-y divide-line">${d.months.slice().reverse().map(x => `
          <div class="flex items-center gap-3 px-4 py-2.5 text-sm">
            <span class="flex-1 font-bold">${monthLabel(x.month)}</span>
            <span class="tabular-nums text-ink-muted">응답 ${x.responded}/${x.total}</span>
            ${x.closeAt && x.status === '진행중' ? `<span class="text-xs text-ink-muted">${esc(scheduleLabel(x.closeAt))} 마감 예약</span>` : ''}
            <span class="rounded-full px-2 py-0.5 text-xs font-bold ${x.status === '진행중' ? 'bg-chalk-yellow text-ink' : 'bg-page text-ink-muted'}">${x.status}</span>
          </div>`).join('') || '<p class="p-4 text-sm text-ink-muted">아직 연 달이 없어요.</p>'}</div></div>
      </aside>

      <div class="min-w-0">
        <div class="flex flex-wrap items-end justify-between gap-2">
          <div><h2 class="text-lg font-extrabold">학생 명단</h2>
            <p class="mt-0.5 text-sm text-ink-muted">학생은 학번(숫자 4~5자리)과 비밀번호로 들어와요. 새 학생과 초기화한 학생은 [환경설정]의 학생 초기 비밀번호로 들어와서, 첫 로그인 때 자기 비밀번호로 바꿔요.</p></div>
          <div class="flex flex-wrap gap-1.5">
            <button id="mg-add" type="button" class="btn btn-primary btn-sm">학생 추가</button>
            <button id="mg-bulk" type="button" class="btn btn-ghost btn-sm">명단 붙여넣기</button>
          </div>
        </div>
        ${noPw ? `<div class="mt-3 rounded-lg bg-stamp-soft px-4 py-3 text-sm font-semibold text-stamp">비밀번호가 없는 학생이 ${noPw}명 있어요. 이 학생들은 아직 설문에 들어올 수 없으니, 아래 명단에서 [비밀번호 초기화]를 눌러 주세요.</div>` : ''}
        <div class="panel mt-3 overflow-x-auto">
          <table class="w-full min-w-[480px] text-sm">
            <thead><tr><th class="th w-28">학번</th><th class="th">이름</th><th class="th w-32">비밀번호</th><th class="th w-52"></th></tr></thead>
            <tbody>${roster.length ? roster.map(s => `
              <tr class="${s.active ? '' : 'opacity-50'}">
                <td class="border-b border-line/70 px-3 py-2.5 font-bold tabular-nums">${esc(s.studentNo || '없음')}</td>
                <td class="border-b border-line/70 px-3 py-2.5 font-bold">${esc(s.name)}${s.active ? '' : ' <span class="text-xs font-semibold text-ink-muted">숨김</span>'}</td>
                <td class="border-b border-line/70 px-3 py-2.5"><span class="rounded-full px-2 py-0.5 text-xs font-bold ${!s.hasPassword ? 'bg-stamp-soft text-stamp' : s.initPw ? 'bg-chalk-yellow/50 text-ink' : 'bg-board-soft text-board'}">${!s.hasPassword ? '없음' : s.initPw ? '초기 비밀번호' : '학생이 정함'}</span></td>
                <td class="border-b border-line/70 px-3 py-2.5 text-right"><div class="flex justify-end gap-1.5">
                  <button type="button" data-edit="${esc(s.id)}" class="btn btn-ghost btn-sm">수정</button>
                  ${s.active ? `<button type="button" data-reset="${esc(s.id)}" class="btn btn-yellow btn-sm">비밀번호 초기화</button>`
                             : `<button type="button" data-unhide="${esc(s.id)}" class="btn btn-ghost btn-sm">다시 보이기</button>`}</div></td>
              </tr>`).join('') : '<tr><td colspan="4" class="px-3 py-12 text-center text-ink-muted">아직 학생이 없어요. [학생 추가]나 [명단 붙여넣기]로 시작해 보세요.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  if ($('#mg-close')) $('#mg-close').onclick = async () => {
    if (!(await mConfirm(`${shortMonth(open.month)} 설문을 마감할까요?`, '마감하면 학생들이 더 이상 응답할 수 없어요. 나중에 다시 열 수 있어요.', { ok: '마감하기' }))) return;
    const r = await call('closeMonth', S.token, open.month);
    if (r && r.ok) { toast('설문을 마감했어요'); loadDashboard(S.month); } else if (r) mAlert('마감하지 못했어요', r.message);
  };
  $('#mg-open').onclick = async () => {
    const mo = $('#mg-month').value;
    if (!mo) return mAlert('달을 골라 주세요', '설문을 열 달을 먼저 선택해 주세요.');
    if (open && open.month !== mo && !(await mConfirm(`${monthLabel(mo)} 설문을 열까요?`, `진행 중인 ${monthLabel(open.month)} 설문은 자동으로 마감돼요.`, { ok: '열기' }))) return;
    loading(true, '설문을 여는 중');
    const r = await call('openMonth', S.token, mo);
    loading(false);
    if (r && r.ok) { toast(`${monthLabel(mo)} 설문을 열었어요`); loadDashboard(mo); } else if (r) mAlert('열지 못했어요', r.message);
  };
  $('#mg-add').onclick = addOneStudent;
  $('#mg-bulk').onclick = addBulkStudents;
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editStudent(b.dataset.edit));
  el.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetOnePassword(b.dataset.reset));
  el.querySelectorAll('[data-unhide]').forEach(b => b.onclick = async () => {
    const r = await call('updateStudent', S.token, { id: b.dataset.unhide, active: true });
    if (r && r.ok) { toast('명단에 다시 보이게 했어요'); loadDashboard(S.month); } else if (r) mAlert('바꾸지 못했어요', r.message);
  });
}

async function addOneStudent() {
  const r = await mForm({
    title: '학생 추가', message: '비밀번호는 [환경설정]의 학생 초기 비밀번호로 정해져요. 학생은 첫 로그인 때 자기 비밀번호로 바꿔요.',
    fields: [
      { name: 'studentNo', label: '학번 (숫자 4~5자리)', inputmode: 'numeric', placeholder: '예: 1630', maxlength: 5 },
      { name: 'name', label: '이름', placeholder: '예: 김민준', maxlength: 20 }
    ],
    submit: '추가하기',
    onMount: w => digitsOnly(w.querySelector('[name="studentNo"]')),
    onSubmit: async v => {
      if (!/^\d{4,5}$/.test(v.studentNo)) return { error: '학번은 숫자 4~5자리로 입력해 주세요. (예: 1630)' };
      if (!v.name) return { error: '이름을 입력해 주세요.' };
      const res = await call('addStudents', S.token, [{ studentNo: v.studentNo, name: v.name }]);
      if (!res) return { error: '다시 시도해 주세요.' };
      return res.ok ? res : { error: res.message };
    }
  });
  if (r && r.ok) { toast('학생을 추가했어요. 비밀번호는 학생 초기 비밀번호예요.'); loadDashboard(S.month); }
}

function parseRosterLines(text) {
  const entries = [], problems = [];
  String(text || '').split(/?
/).forEach((line, index) => {
    const tokens = line.trim().split(/[\s,;]+/).filter(Boolean);
    if (!tokens.length) return;
    let studentNo = '', nameTokens = [];
    if (tokens.length >= 3 && /^\d{1,2}$/.test(tokens[0]) && /^\d{4,5}$/.test(tokens[1])) { studentNo = tokens[1]; nameTokens = tokens.slice(2); }
    else if (tokens.length >= 2 && /^\d{4,5}$/.test(tokens[0])) { studentNo = tokens[0]; nameTokens = tokens.slice(1); }
    else if (tokens.length >= 2 && /^\d{4,5}$/.test(tokens[tokens.length - 1])) { studentNo = tokens[tokens.length - 1]; nameTokens = tokens.slice(0, -1); }
    else { problems.push(`${index + 1}번째 줄: ${line.trim().slice(0, 30)}`); return; }
    const name = nameTokens.join(' ').trim();
    if (!name || name.length > 20) problems.push(`${index + 1}번째 줄: 이름은 1~20자로 적어 주세요.`);
    else entries.push({ studentNo, name });
  });
  return { entries, problems };
}

async function addBulkStudents() {
  const r = await mForm({
    title: '명단 붙여넣기', wide: true, message: '한 줄에 한 명씩 "학번 이름"으로 적어 주세요. 엑셀에서 두 칸을 복사해 붙여넣어도 돼요. 비밀번호는 모두 학생 초기 비밀번호예요.',
    fields: [{ name: 'list', label: '학생 명단', type: 'textarea', rows: 8, placeholder: '1630 김민준
1631 이서연
1632 박지호' }],
    submit: '모두 추가',
    onSubmit: async v => {
      const { entries, problems } = parseRosterLines(v.list);
      if (problems.length) return { error: '"학번(숫자 4~5자리) 이름" 형식이 아닌 줄이 있어요.
' + problems.slice(0, 3).join('
') };
      if (!entries.length) return { error: '추가할 학생을 적어 주세요.' };
      const res = await call('addStudents', S.token, entries);
      if (!res) return { error: '다시 시도해 주세요.' };
      return res.ok ? res : { error: res.message };
    }
  });
  if (r && r.ok) {
    toast(`${r.added}명을 추가했어요. 처음 비밀번호는 학생 초기 비밀번호예요.`);
    if (r.skipped && r.skipped.length) await mAlert('추가하지 못한 학생이 있어요', r.skipped.join('
'));
    loadDashboard(S.month);
  }
}

async function editStudent(id) {
  const s = S.data.roster.find(x => x.id === id);
  const r = await mForm({
    title: `${s.name} 정보 수정`,
    fields: [
      { name: 'studentNo', label: '학번 (숫자 4~5자리)', inputmode: 'numeric', value: s.studentNo, maxlength: 5 },
      { name: 'name', label: '이름', value: s.name, maxlength: 20 }
    ],
    submit: '저장',
    extra: s.active ? '<p class="mb-1 mt-3 text-right"><button type="button" data-remove class="text-xs font-bold text-stamp underline underline-offset-2">명단에서 빼기 (전학 등)</button></p>' : '',
    onMount: (wrap, close) => {
      digitsOnly(wrap.querySelector('[name="studentNo"]'));
      const rm = wrap.querySelector('[data-remove]');
      if (rm) rm.onclick = async () => {
        if (!(await mConfirm(`${s.name} 학생을 명단에서 뺄까요?`, '응답 기록이 있으면 지난 기록은 그대로 두고 명단·설문·지도에서만 숨겨요. 기록이 없으면 삭제해요.', { ok: '명단에서 빼기', danger: true }))) return;
        const res = await call('removeFromRoster', S.token, id);
        if (res && res.ok) { close('reload'); toast(res.mode === 'deleted' ? '명단에서 삭제했어요' : '명단에서 숨겼어요. 지난 기록은 그대로 남아요.'); }
        else if (res) mAlert('명단에서 빼지 못했어요', res.message);
      };
    },
    onSubmit: async v => {
      if (!/^\d{4,5}$/.test(v.studentNo)) return { error: '학번은 숫자 4~5자리로 입력해 주세요. (예: 1630)' };
      if (!v.name) return { error: '이름을 입력해 주세요.' };
      const res = await call('updateStudent', S.token, { id, name: v.name, studentNo: v.studentNo });
      if (!res) return { error: '다시 시도해 주세요.' };
      return res.ok ? 'reload' : { error: res.message };
    }
  });
  if (r === 'reload') loadDashboard(S.month);
}

async function resetOnePassword(id) {
  const s = S.data.roster.find(x => x.id === id);
  if (!(await mConfirm(`${s.name} 학생의 비밀번호를 초기화할까요?`, '학생 초기 비밀번호로 되돌려요. 학생은 다음 로그인 때 그 비밀번호로 들어와서 새 비밀번호를 정하게 돼요. 잠겨 있었다면 잠금도 풀려요.', { ok: '초기화' }))) return;
  const res = await call('resetPassword', S.token, id);
  if (res && res.ok) { toast(`${s.name} 학생의 비밀번호를 초기화했어요`); loadDashboard(S.month); }
  else if (res) mAlert('초기화하지 못했어요', res.message);
}

/* ═══════════════════════════════════════════════════════════════
 *  11. 시작
 * ═══════════════════════════════════════════════════════════════ */
(function init() {
  setLoginRole('student');
  let saved = null;
  try { saved = sessionStorage.getItem('rm_token'); } catch (e) {}
  if (saved) { S.token = saved; enterTeacher(); }
})();
</script>
