<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지 제목</title>

  <!-- 파비콘 -->
  <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg" type="image/jpeg" />

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  />

  <!-- 공통 네비게이션 CSS -->
  <link rel="stylesheet" href="../../../css/navbar.css" />

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .content-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }

    /* 예시 버튼 */
    .btn-primary {
      background: var(--primary);
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1.1rem;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <!-- 네비게이션바 -->
  <script src="../../../js/navbar.js" data-type="middleschool"></script>

  <main class="page-wrap">
    <div class="content-card">
      <h1 class="section-title">여기에 제목을 넣으세요</h1>
      <p class="section-subtitle">
        여기에 설명 문구를 넣고, 아래에 본문 내용을 채워 나가면 됩니다.
      </p>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="border rounded p-3">
            <h3>왼쪽 영역</h3>
            <p class="mb-0 text-muted">이곳에 실험/설명/입력 영역을 넣으면 됩니다.</p>
          </div>
        </div>

        <div class="col-md-6">
          <div class="border rounded p-3">
            <h3>오른쪽 영역</h3>
            <p class="mb-0 text-muted">결과 표시, 이미지, 표, 버튼 등을 배치할 수 있습니다.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
