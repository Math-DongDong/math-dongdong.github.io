<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════
    유형 A — 개인 기록형 템플릿 (공통 모듈 v4.2)

  이런 활동에 씁니다
    학생이 혼자 문제를 풀고, 끝나면 점수가 남고, 순위표가 나오는 활동.
    예) 정수와 유리수 마스터 / 곱셈과 나눗셈 마스터 / 좀비헌터 / 삼각형 닮음 카드게임

  특징
    · 데이터베이스는 Firestore 하나만 씁니다 (실시간 통신 없음)
    · 빠른 입장 + 학생 인증 + 게스트 승인 전부 지원
    · 대시보드에 학번 표시 토글, PIN 초기화, 엑셀 내보내기
    · v4.2 입장 — 학번은 1~3으로 시작하는 숫자 4~5자리, PIN은 4자리입니다. 학교는 방을 만든 선생님을 따릅니다.
    · 같은 닉네임의 여러 플레이 기록은 새 문서로 누적하고, 대시보드에서 닉네임별로 집계합니다.
    · 완료 체크포인트가 있는 게임은 최종 탈락 기록이 완료 상태를 false로 되돌리지 않도록 보존합니다.
      방 만들기는 game-kit의 createRoom()이 모드 선택·학교명 확인·creatorSchool 저장까지 합니다.
    · 종료는 한 번만 처리합니다(gameOver 플래그). 종료 버튼 연타·하트 0 타이머가 겹쳐도 기록은 1건입니다.
    · 대시보드에 학급 요약 카드(평균 점수·평균 정답률)와 학생 상세 모달(판별 기록)이 들어 있습니다.
    · 대시보드 플레이 칸은 학생이 접속해 있으면 접속중 / 다른화면 / 접속 끊김을, 끊긴 지 30분이 지나면 플레이 횟수를 보여 줍니다.
      접속 상태는 접속 전용 RTDB(presence/{컬렉션}/{방}/{닉네임})에 따로 둡니다 — game-kit의 startRoomPresence · watchRoomPresence.
    · 이어하기: 튕김·새로고침·뒤로가기 뒤 1분 안에 같은 기기로 같은 방에 들어오면 하던 판을 이어 갑니다 (js/play-resume.js).
      진행 상태는 이 기기 localStorage에만 두고(서버 쓰기 없음), 하트 0·종료 버튼으로 판이 끝나면 지웁니다.

  ★ 새 게임을 만들 때 고칠 곳은 "★ 여기" 표시를 따라가면 됩니다.
  ★ 컬렉션 이름만 '..._records' 로 지으면 보안 규칙은 손댈 필요가 없습니다.
═══════════════════════════════════════════════════════════════════════════
-->
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ★ 여기: 제목 -->
    <title>새 게임 - 중1 수학</title>
    <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../css/navbar.css">
    <link rel="stylesheet" href="../../../css/dashboard.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        .login-card {
            max-width: 480px;
            margin: 0 auto;
        }

        .game-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 학번 열: 기본 숨김. 표를 다시 그려도 유지되도록 클래스로만 제어합니다. */

            display: none;
        }

        #adminTableWrap.show-sid .col-studentid {
            display: table-cell;

        /* 플레이 열 접속 상태 점 — game-kit.js 의 STATUS_DOT_CSS 와 같은 내용 */
        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        .status-online {
            background-color: #198754;
        }

        .status-away {
            background-color: #ffc107;
        }

        .status-offline {

        }

        /* ★ 여기: 게임 화면 스타일 */
    </style>

</head>

<body>
    <!-- 알림 · 확인 · 입력 모달은 사이트 공용 모달(js/ui-dialog.js)이 처음 쓸 때 자동으로 만듭니다 -->

    <!-- 학생 상세 모달 (대시보드 표의 행을 누르면 열림) -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="detailTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="detailBody"></div>
            </div>
        </div>
    </div>

    <div id="navbar-placeholder"></div>
    <script src="../../../js/navbar.js"></script>

    <!-- ==================== 1. 입장 화면 ==================== -->
    <div id="login-section" class="section-container active-section">
        <div class="container py-4">
            <div class="login-card">
                <div class="text-center mb-4">
                    <!-- ★ 여기: 제목과 설명 -->
                    <h1 class="fw-bold fs-3">🎮 새 게임</h1>
                    <p class="text-muted">방 코드를 입력하고 게임을 시작하세요!</p>
                </div>
                <!-- 입장 카드는 room-auth.js가 통째로 그립니다 (방 코드 입력 하나뿐) -->
                <div id="room-entrance-container"></div>
            </div>
        </div>
    </div>

    <!-- ==================== 2. 게임 화면 ==================== -->
    <div id="game-section" class="section-container">
        <div class="container py-3">
            <div class="game-wrapper">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-warning text-dark fw-bold fs-6" id="level-badge">Lv.1</span>
                    <div class="d-flex align-items-center gap-3">
                        <span class="fw-bold" id="lives-display">❤️❤️❤️❤️❤️</span>
                        <span class="fw-bold">점수: <span id="score">0</span></span>
                        <button id="btn-end-play" class="btn btn-danger btn-sm fw-bold">종료</button>
                    </div>
                </div>

                <!-- ★ 여기: 문제 화면·입력 UI를 넣으세요 -->
                <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
                    <p class="text-muted mb-0">게임 화면을 여기에 만드세요.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 3. 게임 오버 화면 ==================== -->
    <div id="gameover-section" class="section-container">
        <div class="container py-4">
            <div class="login-card">
                <div class="card border-0 shadow-sm rounded-4 p-4 text-center mb-4">
                    <div class="display-4 mb-3">😭</div>
                    <h2 class="fw-bold text-danger mb-2">게임 종료!</h2>
                    <div class="bg-light rounded-4 p-3 mb-4">
                        <p class="fs-5 mb-1">최종 점수: <span id="final-score" class="fw-bold text-primary fs-3">0</span>점
                        </p>
                        <p class="fs-6 mb-1">정답률: <span id="final-accuracy" class="fw-bold text-info">0%</span></p>
                        <!-- ★ 여기: 도달 레벨 등 한 줄 요약 (없으면 비워 둡니다) -->
                        <p class="small text-muted mb-0" id="final-detail"></p>
                    </div>
                    <div id="save-status" class="text-success fw-bold small mb-3"></div>

                    <div class="bg-light border rounded-4 p-3 mb-4 text-start">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold mb-0">📊 내 순위와 주변 실력</h6>
                            <span class="badge bg-primary px-3 py-1" id="myRankBadge">-위</span>
                        </div>
                        <div class="small text-muted mb-2" id="rankSummaryText">순위를 계산 중입니다.</div>
                        <table class="table table-sm table-borderless align-middle mb-0" style="font-size:0.9rem;">
                            <thead>
                                <tr class="text-muted small">
                                    <th class="text-center" style="width:15%;">순위</th>
                                    <th style="width:55%;">닉네임</th>
                                    <th class="text-center" style="width:30%;">점수</th>
                                </tr>
                            </thead>
                            <tbody id="rankNearbyTable"></tbody>
                        </table>
                    </div>

                    <button id="btn-restart" class="btn btn-primary btn-lg w-100 fw-bold">🔄 다시 도전하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 4. 대시보드 ==================== -->
    <div id="dashboard-section" class="section-container">
        <div class="container py-4">
            <div class="admin-card mb-4">
                <!-- ★ 여기: data-title -->
                <div id="dash-header-placeholder"></div>
                <script src="../../../js/dashboard-header.js?v=4.2" data-title="새 게임 대시보드"></script>

                <!-- 게스트 대기자 알림 배너 영역 -->
                <div id="pendingGuestsContainer" class="mb-3"></div>

                <!-- 학급 요약 카드. ★ 여기: 게임별 통계 카드(유형별 정답률 등)를 col로 더 붙이세요 -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="dash-stat-box h-100 text-center p-3">
                            <div class="text-muted small fw-bold mb-2">학급 평균 점수</div>
                            <div class="fs-3 fw-bold text-success" id="dashAvgScore">-</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="dash-stat-box h-100 text-center p-3">
                            <div class="text-muted small fw-bold mb-2">학급 평균 정답률</div>
                            <div class="fs-3 fw-bold text-primary" id="dashAvgAcc">-</div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end align-items-center mb-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="toggleStudentId" style="cursor:pointer;">
                        <label class="form-check-label small fw-bold text-secondary" for="toggleStudentId"
                            style="cursor:pointer;">학번 표시</label>
                    </div>
                </div>

                <div class="table-responsive" id="adminTableWrap">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>순위</th>
                                <th class="col-studentid">학번</th>
                                <th>닉네임</th>
                                <!-- ★ 여기: 보여줄 항목 -->
                                <th>최고 점수</th>
                                <th>정답률</th>
                                <th>플레이</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <tr>
                                <td colspan="6" class="py-4 text-muted">방을 선택해주세요.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            renderRoomEntrance, customAlert, showPinResetModal
        } from "../../../js/room-auth.js?v=4.5";
        import {
            firestoreRoom, renderGuestApproval, bindDeleteRoomButton, bindStudentIdToggle,
            buildSidMap, escapeHtml, safeNumber,
            startRoomPresence, watchRoomPresence, presenceStatus, presenceNow, playStatusCell
        } from "../../../js/game-kit.js?v=4.7";
        import { createPlayResume } from "../../../js/play-resume.js";
        import {
            doc, setDoc, addDoc, getDocs, onSnapshot, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // ★ 여기: 컬렉션 이름. 반드시 '_records'로 끝나야 보안 규칙이 적용됩니다.
        const room = firestoreRoom("newgame_records");
        // 이어하기 (튕김·뒤로가기 복구). ★ 저장하는 상태 모양을 바꾸면 두 번째 값(버전)을 올리세요.
        const resume = createPlayResume(room.collectionName, 1);

        // =====================================================================
        // 전역 상태
        // =====================================================================
        let currentRoomCode = "";
        let playerNickname = "";
        let mySchool = "";      // 학생 인증 모드에서만 값이 있음
        let myStudentId = "";

        // ★ 여기: 게임 상태 변수
        let score = 0, lives = 5, solved = 0, attempts = 0;
        let gameOver = false;   // 종료 처리 중복 방지 (기록이 두 번 저장되지 않도록)
        let stopPresence = null;    // 접속 신호 중지 함수 (startRoomPresence)

        function $(id) { return document.getElementById(id); }
        function showSection(id) {
            document.querySelectorAll('.section-container').forEach(s => s.classList.remove('active-section'));
            $(id).classList.add('active-section');
        }

        // =====================================================================
        // 1. 방 입장
        //
        //  닉네임은 room-auth.js가 자동 발급합니다. 학생이 입력하는 것은 방 코드뿐입니다.
        // =====================================================================
        renderRoomEntrance('room-entrance-container', {
            getRoomData: room.getRoomData,                     // 방 존재 확인 + 모드 판정
            studentsCollectionRef: room.students,              // 닉네임 이름표·게스트 승인·학번
            onJoin: async (roomCode, nickname, authInfo) => {
                currentRoomCode = roomCode;
                playerNickname = nickname;
                mySchool = authInfo?.school || '';
                myStudentId = authInfo?.studentId || '';

                showSection('game-section');
                // 끝나지 않은 판이 이 기기에 남아 있으면 이어서, 없으면 새 게임
                const saved = resume.open(roomCode, nickname);
                if (!saved || !resumeGame(saved)) initGame();

                // 접속 신호 (접속 전용 RTDB) — 대시보드 플레이 칸의 접속중·다른화면·접속 끊김. 지우지 마세요.
                if (stopPresence) stopPresence();
                stopPresence = startRoomPresence(room.collectionName, roomCode, nickname);
            },
            onAdminSuccess: () => {
                showSection('dashboard-section');
                unsubRooms = room.watchRooms($('roomSelect'));
            }
        });

        // =====================================================================
        // 2. 게임 로직   ★ 여기가 게임마다 완전히 달라지는 부분입니다
        // =====================================================================
        function initGame() {
            score = 0; lives = 5; solved = 0; attempts = 0;
            gameOver = false;
            updateUI();
            // ★ 여기: 첫 문제 만들기 (문제를 만든 뒤 saveProgress())
            saveProgress();
        }

        function updateUI() {
            $('score').textContent = score;
            $('lives-display').textContent = '❤️'.repeat(lives) + '🖤'.repeat(5 - lives);
        }

        $('btn-end-play').addEventListener('click', () => endGame());
        $('btn-restart').addEventListener('click', () => { showSection('game-section'); initGame(); });

        // =====================================================================
        // 2-1. 이어하기 (js/play-resume.js)
        //
        //  ★ saveProgress()는 상태가 바뀌는 곳마다 부르세요 — 새 문제가 나온 직후, 오답으로 하트가 줄어든 직후.
        //    현재 문제(정답·문제 화면)도 함께 저장해야 새로고침으로 어려운 문제를 건너뛰지 못합니다.
        //  ★ 하트가 0이 되면 저장하지 않고, endGame()이 맨 앞에서 resume.clear()로 지웁니다.
        //  ★ 정답 처리 후 setTimeout으로 다음 문제로 넘어가는 사이에는 저장하지 마세요.
        //    (풀린 문제가 그대로 저장되면 복원했을 때 넘어갈 방법이 없습니다)
        // =====================================================================
        function saveProgress() {
            if (!currentRoomCode || gameOver || lives <= 0) return;
            resume.save({
                score, lives, solved, attempts
                // ★ 여기: 레벨·콤보·현재 문제(정답·문제 HTML) 등 이어하기에 필요한 값 (JSON으로 바꿀 수 있는 값만)
            });
        }

        /** @returns {boolean} 복원에 성공했는지 (false면 새 게임) */
        function resumeGame(saved) {
            if (!(saved.lives > 0)) { resume.clear(); return false; }
            score = safeNumber(saved.score);
            lives = safeNumber(saved.lives, 5);
            solved = safeNumber(saved.solved);
            attempts = safeNumber(saved.attempts);
            gameOver = false;
            // ★ 여기: 나머지 상태와 현재 문제 화면 복원
            updateUI();
            customAlert("이어하기", `이전에 하던 게임을 이어서 합니다.<br>점수 <b>${score}점</b> · 하트 <b>${lives}개</b>`);
            return true;
        }

        // =====================================================================
        // 3. 기록 저장
        //
        //  ★ records 문서에는 학번·학교를 절대 넣지 않습니다.
        //    게임오버 순위표가 로그인 없이 이 컬렉션을 읽기 때문입니다.
        //    (보안 규칙도 studentId·school·studentKey 키를 거부합니다)
        //    학번은 students 문서에만 두고, 대시보드가 닉네임으로 이어 붙입니다.
        //
        //  ★ 종료 버튼 연타, 하트 0 직후의 setTimeout(endGame) 등으로 두 번 불려도 한 번만 저장합니다.
        //  ★ 게임 중 열린 모달(문제·확인창)이 게임오버 화면 위에 남지 않도록 닫습니다.
        //  ★ save-status는 classList.replace 대신 className 전체를 바꿉니다.
        //    (실패 후 다시 도전해 성공해도 빨간 글씨가 남던 문제)
        // =====================================================================
        function setSaveStatus(text, color) {
            $('save-status').className = `text-${color} fw-bold small mb-3`;
            $('save-status').textContent = text;
        }

        async function endGame() {
            if (gameOver) return;
            gameOver = true;
            resume.clear();   // 끝난 판은 이어하기 대상에서 뺍니다
            document.querySelectorAll('.modal.show').forEach(m => bootstrap.Modal.getInstance(m)?.hide());

            const accuracy = attempts === 0 ? 0 : Math.round((solved / attempts) * 100);

            showSection('gameover-section');
            $('final-score').textContent = score;
            $('final-accuracy').textContent = accuracy + '%';
            $('final-detail').textContent = '';   // ★ 여기: 예) `도달 레벨: Lv.${level}`

            if (!currentRoomCode) { setSaveStatus('', 'success'); return; }
            setSaveStatus('💾 기록 저장 중...', 'primary');

            try {
                await addDoc(room.records(currentRoomCode), {
                    nickname: playerNickname,
                    score: safeNumber(score),    // 규칙이 숫자인지 검사합니다
                    accuracy,
                    totalSolved: solved,
                    totalAttempts: attempts,
                    // ★ 여기: 게임별 기록 항목 (최대 25개 키)
                    playedAt: serverTimestamp()
                });

                const patch = { nickname: playerNickname, lastScore: safeNumber(score), updatedAt: serverTimestamp() };
                if (mySchool) patch.school = mySchool;
                if (myStudentId) patch.studentId = myStudentId;
                await setDoc(doc(room.students(currentRoomCode), playerNickname), patch, { merge: true });

                setSaveStatus("✅ 기록이 저장되었습니다!", 'success');
            } catch (e) {
                console.error('기록 저장 실패:', e);
                setSaveStatus("⚠️ 기록 저장에 실패했습니다.", 'danger');
            }

            await loadGameOverRankings();
        }

        /** 같은 방 안에서 내 위치 ±2명 */
        async function loadGameOverRankings() {
            if (!currentRoomCode) return;
            try {
                const snap = await getDocs(room.records(currentRoomCode));
                const best = {};
                snap.forEach(d => {
                    const r = d.data();
                    const nick = String(r.nickname || '');
                    if (!nick) return;
                    const item = { nickname: nick, score: safeNumber(r.score) };
                    if (!best[nick] || item.score > best[nick].score) best[nick] = item;
                });

                const sorted = Object.values(best).sort((a, b) => b.score - a.score);
                const total = sorted.length;
                const myIdx = sorted.findIndex(i => i.nickname === playerNickname);

                if (myIdx !== -1) {
                    const rank = myIdx + 1;
                    $('myRankBadge').textContent = `${rank}위 / ${total}명`;
                    $('rankSummaryText').textContent =
                        `전체 ${total}명 중 상위 ${Math.max(1, Math.round((rank / total) * 100))}%에 해당합니다.`;
                }

                let start = 0, end = total;
                if (total > 5) {
                    start = Math.max(0, myIdx - 2);
                    end = Math.min(total, start + 5);
                    if (end - start < 5) start = Math.max(0, end - 5);
                }

                $('rankNearbyTable').innerHTML = sorted.slice(start, end).map((item, i) => {
                    const rank = start + i + 1;
                    const isMe = item.nickname === playerNickname;
                    return `<tr class="${isMe ? 'table-primary fw-bold' : ''}">
                        <td class="text-center">${rank}</td>
                        <td>${escapeHtml(item.nickname)}</td>
                        <td class="text-center">${safeNumber(item.score)}점</td>
                    </tr>`;
                }).join('');
            } catch (e) {
                console.error('주변 순위 로드 오류:', e);
            }
        }

        // =====================================================================
        // 4. 대시보드
        // =====================================================================
        let unsubRooms = null, unsubStudents = null, unsubRecords = null;
        let roomStudents = [], roomRecords = [];
        let currentAdminRoom = '';
        let excelData = [];
        // 접속 상태 (접속 전용 RTDB) · 마지막으로 그린 학생별 통계 · 기록 없는 접속 학생 목록 · 이 방 기록을 받았는지
        let unsubPresence = null, roomPresence = {}, lastStats = {}, renderedWaitingKey = '', recordsReady = false;

        // 교사 로그인 결과는 비동기로 나중에 도착합니다. 이 줄이 없으면 목록이 비어 보입니다.
        window.addEventListener('teacherAuthChanged', () => {
            if (unsubRooms) unsubRooms();
            unsubRooms = room.watchRooms($('roomSelect'));
        });

        $('roomSelect').addEventListener('change', (e) => {
            currentAdminRoom = e.target.value;
            if (unsubStudents) unsubStudents();
            if (unsubRecords) unsubRecords();
            if (unsubPresence) unsubPresence();
            unsubPresence = null; roomPresence = {}; recordsReady = false;
            if (!currentAdminRoom) { roomStudents = []; roomRecords = []; render(); return; }

            unsubStudents = onSnapshot(room.students(currentAdminRoom), snap => {
                roomStudents = []; snap.forEach(d => roomStudents.push(d.data())); render();
            });
            unsubRecords = onSnapshot(room.records(currentAdminRoom), snap => {
                roomRecords = []; snap.forEach(d => roomRecords.push(d.data())); recordsReady = true; render();
            });
            // 접속 상태는 RTDB에서 따로 받아 플레이 칸만 바꿉니다 (Firestore 재조회 없음)
            unsubPresence = watchRoomPresence(room.collectionName, currentAdminRoom, data => {
                roomPresence = data; refreshPlayCells();
            });
        });

        $('btn-create-room').addEventListener('click', async () => {
            const code = await room.createRoom();       // 입장 모드를 묻고 방을 만듭니다
            if (!code) return;
            $('roomSelect').value = code;
            $('roomSelect').dispatchEvent(new Event('change'));
        });

        $('btn-reset-pin')?.addEventListener('click', () => showPinResetModal());

        bindDeleteRoomButton($('btn-delete-room'), {
            getCode: () => currentAdminRoom,
            canDelete: (code) => room.canDelete(code),
            doDelete: (code) => room.deleteRoom(code),
            onDone: async () => {
                $('roomSelect').value = '';
                $('roomSelect').dispatchEvent(new Event('change'));
            }
        });

        bindStudentIdToggle($('toggleStudentId'), [$('adminTableWrap')]);

        function render() {
            renderGuestApproval($('pendingGuestsContainer'), roomStudents, {
                studentsRef: currentAdminRoom ? room.students(currentAdminRoom) : null,
                guestsRef: currentAdminRoom ? room.guests(currentAdminRoom) : null
            });

            $('dashAvgScore').textContent = '-';
            $('dashAvgAcc').textContent = '-';
            if (!currentAdminRoom) {
                $('adminTableBody').innerHTML = '<tr><td colspan="6" class="py-4 text-muted">방을 선택해주세요.</td></tr>';
                return;
            }

            const sidByNick = buildSidMap(roomStudents);

            // ★ 같은 닉네임의 플레이 기록을 덮어쓰지 않고 누적합니다.
            // ★ records는 로그인 없이 만들 수 있으므로, 숫자로 쓸 값은 전부 safeNumber를 거칩니다.
            //   문자열이 섞여 들어와도 화면에 코드로 해석되지 않습니다.
            const stats = {};
            roomRecords.forEach(r => {
                const nick = String(r.nickname || '');
                if (!nick) return;
                if (!stats[nick]) stats[nick] = { plays: 0, best: 0, solved: 0, attempts: 0 };
                const s = stats[nick];
                s.plays++;
                s.best = Math.max(s.best, safeNumber(r.score));
                // ★ 기록 필드 이름을 바꿨다면 옛 기록도 읽도록 대체 키를 둡니다. 예) safeNumber(r.round || r.level)
                s.solved += safeNumber(r.totalSolved);
                s.attempts += safeNumber(r.totalAttempts);
            });

            const keys = Object.keys(stats).sort((a, b) => stats[b].best - stats[a].best);

            // 접속 상태: 저장된 판은 없지만 접속해 있는 학생(첫 판 진행 중 등)도 표 아래쪽에 보여 줍니다
            // 플레이 칸: 접속중·다른화면·접속 끊김 → 끊긴 지 30분이 지나면 플레이 횟수 (refreshPlayCells가 이 칸만 갱신)
            const now = presenceNow();
            const waitingNames = waitingPresenceNames(stats, now);
            lastStats = stats;
            renderedWaitingKey = waitingNames.join('\n');
            const playCell = (nick, plays) => `<td data-play-nick="${escapeHtml(nick)}">${playStatusCell(roomPresence[nick], plays, now)}</td>`;
            const waitingRows = waitingNames.map(nick => {
                const sid = sidByNick[nick] || '';
                // ★ 여기: 표 열 수를 바꾸면 colspan(닉네임과 플레이 사이 열 수)도 맞춰 주세요
                return `<tr>
                    <td class="text-muted">-</td>
                    <td class="col-studentid fw-bold text-secondary">${sid ? escapeHtml(sid) : '-'}</td>
                    <td class="fw-bold">${escapeHtml(nick)}</td>
                    <td colspan="2" class="text-muted small">아직 저장된 기록이 없습니다</td>
                    ${playCell(nick, 0)}
                </tr>`;
            }).join('');

            if (keys.length === 0) {
                $('adminTableBody').innerHTML = waitingRows || '<tr><td colspan="6" class="py-4 text-muted">아직 참여한 학생이 없습니다.</td></tr>';
                excelData = [];
                return;
            }

            // 학급 평균은 학생별 '최고 점수'와 '누적 정답률'의 평균입니다 (판 수가 많은 학생에 쏠리지 않도록)
            const accOf = s => s.attempts > 0 ? Math.round((s.solved / s.attempts) * 100) : 0;
            $('dashAvgScore').textContent = `${Math.round(keys.reduce((t, k) => t + stats[k].best, 0) / keys.length)}점`;
            $('dashAvgAcc').textContent = `${Math.round(keys.reduce((t, k) => t + accOf(stats[k]), 0) / keys.length)}%`;

            excelData = [];
            $('adminTableBody').innerHTML = keys.map((nick, idx) => {
                const s = stats[nick];
                const acc = accOf(s);
                const sid = sidByNick[nick] || '';
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);

                excelData.push({
                    "학번": sid, "순위": idx + 1, "닉네임": nick,
                    "최고 점수": s.best, "정답률(%)": acc, "플레이 횟수": s.plays
                });

                // ★ 닉네임에 따옴표가 섞여도 안전하도록 onclick 대신 data-* 를 씁니다.
                return `<tr class="row-student" data-nick="${escapeHtml(nick)}" style="cursor:pointer;">
                    <td class="fw-bold">${medal}</td>
                    <td class="col-studentid fw-bold text-secondary">${sid ? escapeHtml(sid) : '-'}</td>
                    <td class="fw-bold">${escapeHtml(nick)}</td>
                    <td class="fw-bold text-primary">${s.best}점</td>
                    <td>${acc}%</td>
                    ${playCell(nick, s.plays)}
                </tr>`;
            }).join('') + waitingRows;
        }

        /** 저장된 판이 없는데 접속 상태가 살아 있는(30분 이내) 닉네임 */
        function waitingPresenceNames(stats, now) {
            return Object.keys(roomPresence)
                .filter(nick => !Object.prototype.hasOwnProperty.call(stats, nick) && presenceStatus(roomPresence[nick], now).key !== 'idle')
                .sort((a, b) => a.localeCompare(b, 'ko'));
        }

        /**
         * 접속 상태만 바뀌었을 때 — 표 전체가 아니라 플레이 칸만 다시 씁니다.
         * (게스트 승인 버튼·행 클릭이 신호마다 다시 그려져 끊기지 않도록 · Firestore 재조회 없음)
         */
        function refreshPlayCells() {
            if (!currentAdminRoom || !recordsReady) return;
            const now = presenceNow();
            // 기록 없이 접속한 학생이 새로 생기거나 30분이 지나 빠질 때만 표를 다시 그립니다
            if (waitingPresenceNames(lastStats, now).join('\n') !== renderedWaitingKey) { render(); return; }
            $('adminTableBody').querySelectorAll('td[data-play-nick]').forEach(td => {
                const nick = td.dataset.playNick;
                const plays = Object.prototype.hasOwnProperty.call(lastStats, nick) ? lastStats[nick].plays : 0;
                const html = playStatusCell(roomPresence[nick], plays, now);
                if (td.innerHTML !== html) td.innerHTML = html;
            });
        }
        setInterval(refreshPlayCells, 10000);   // 새 신호 없이 시간만 흘러 바뀌는 상태 (신호 멈춤 → 접속 끊김, 30분 경과 → 횟수)

        // 학생 상세 보기 — 이벤트 위임 (표를 다시 그려도 동작합니다)
        $('adminTableBody').addEventListener('click', (e) => {
            const row = e.target.closest('.row-student');
            if (row) openDetail(row.dataset.nick);
        });

        /** 한 학생의 판별 기록(최신순). 모달 본문도 innerHTML이므로 학생 입력값은 전부 이스케이프합니다. */
        function openDetail(nick) {
            const plays = roomRecords
                .filter(r => String(r.nickname || '') === nick)
                .sort((a, b) => (b.playedAt?.toMillis?.() || 0) - (a.playedAt?.toMillis?.() || 0));

            $('detailTitle').innerHTML = `📋 <b>${escapeHtml(nick)}</b> 학생의 학습 기록`;

            const rows = plays.map(r => {
                const dt = r.playedAt?.toMillis ? new Date(r.playedAt.toMillis()).toLocaleString('ko-KR') : '-';
                const attempts = safeNumber(r.totalAttempts);
                const acc = attempts > 0 ? Math.round((safeNumber(r.totalSolved) / attempts) * 100) : 0;
                // ★ 여기: 게임별 기록 항목 열 (thead와 colspan도 함께 늘리기)
                return `<tr>
                    <td>${escapeHtml(dt)}</td>
                    <td class="fw-bold text-primary">${safeNumber(r.score)}점</td>
                    <td>${acc}%</td>
                    <td>${safeNumber(r.totalSolved)} / ${attempts}</td>
                </tr>`;
            }).join('') || '<tr><td colspan="4" class="py-3 text-muted">기록이 없습니다.</td></tr>';

            // ★ 여기: 표 위에 유형별 누적 정답률 카드 등을 추가
            $('detailBody').innerHTML = `
                <h6 class="fw-bold mb-2"><i class="bi bi-clock-history text-secondary me-1"></i> 학습 로그</h6>
                <div class="table-responsive" style="max-height:280px; overflow-y:auto;">
                    <table class="table table-hover table-sm text-center align-middle small mb-0">
                        <thead class="table-light" style="position:sticky; top:0; z-index:1;">
                            <tr><th>일시</th><th>점수</th><th>정답률</th><th>맞힌 / 시도</th></tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
            bootstrap.Modal.getOrCreateInstance($('detailModal')).show();
        }

        // =====================================================================
        // 5. 학습로그 — 기록 한 판을 한 줄로 펼칩니다.
        // 위의 표(excelData)는 학생별 '요약'이라 판마다의 변화가 보이지 않습니다.
        // 두 번째 시트에 원본 기록을 그대로 모아 두면 정렬·피벗으로 성장 과정을 볼 수 있습니다.
        // =====================================================================
        function buildLogData() {
            const sidByNick = buildSidMap(roomStudents);
            const pad = n => String(n).padStart(2, '0');
            const fmtTime = ts => {
                const ms = ts?.toMillis?.() || 0;
                if (!ms) return '';
                const d = new Date(ms);
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };
            // 학번이 있는 학생을 먼저(명렬표 순), 빠른 입장 학생은 닉네임 순으로 뒤에 붙입니다.
            const sortKey = nick => sidByNick[nick] ? `0${sidByNick[nick]}` : `1${nick}`;

            const seq = {};
            return roomRecords
                .filter(r => String(r.nickname || '') !== '')
                .sort((a, b) => {
                    const ka = sortKey(String(a.nickname)), kb = sortKey(String(b.nickname));
                    if (ka !== kb) return ka.localeCompare(kb);
                    return (a.playedAt?.toMillis?.() || 0) - (b.playedAt?.toMillis?.() || 0);
                })
                .map(r => {
                    const nick = String(r.nickname);
                    seq[nick] = (seq[nick] || 0) + 1;
                    const attempts = safeNumber(r.totalAttempts);
                    return {
                        "학번": sidByNick[nick] || '',
                        "닉네임": nick,
                        "회차": seq[nick],
                        "일시": fmtTime(r.playedAt),
                        "점수": safeNumber(r.score),
                        "맞힌 문제": safeNumber(r.totalSolved),
                        "시도 수": attempts,
                        "정답률(%)": attempts > 0 ? Math.round((safeNumber(r.totalSolved) / attempts) * 100) : 0
                        // ★ 여기: 게임에서 더 저장하는 값(레벨·콤보·시간·레벨별 맞틀)을 열로 추가
                    };
                });
        }

        // [평가진단] 학생별 요약 + [학습로그] 판별 원본 기록
        $('btn-export-excel').addEventListener('click', () => {
            if (excelData.length === 0) return customAlert("알림", "다운로드할 데이터가 없습니다.");
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(excelData), "평가진단");
            const logData = buildLogData();
            if (logData.length > 0) {
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logData), "학습로그");
            }
            // ★ 여기: 파일 이름
            XLSX.writeFile(wb, `새게임_${currentAdminRoom}_${new Date().toISOString().slice(0, 10)}.xlsx`);
        });
    </script>
</body>

</html>
