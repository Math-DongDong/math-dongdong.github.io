<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 1:1 대전 게임 템플릿</title>
    <!-- 파비콘 -->
    <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 공통 CSS (네비바 & 대시보드) -->
    <link rel="stylesheet" href="../../../css/navbar.css">
    <link rel="stylesheet" href="../../../css/dashboard.css">

    <style>
        /* ===== 커스텀 게임 스타일 ===== */
        .game-canvas-wrapper {
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .turn-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .active-turn {
            box-shadow: 0 0 12px rgba(13, 110, 253, 0.5);
            border: 2px solid #0d6efd !important;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online { background-color: #198754; }
        .status-dot.away { background-color: #ffc107; }
        .status-dot.offline { background-color: #dc3545; }

        .waiting-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 0.25em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border .75s linear infinite;
        }
    </style>
</head>

<body>
    <!-- 상단 네비게이션바 -->
    <script src="../../../js/navbar.js"></script>

    <main class="container pt-4">
        <!-- 상단 방 정보 배지 -->
        <div class="text-end mb-3">
            <span class="badge bg-secondary fs-6" id="nav-room-info">대기 중</span>
        </div>

        <!-- ==================== 1. 랜딩 페이지 (방 입장 / 생성) ==================== -->
        <div id="landing-section" class="section-container active-section text-center py-5">
            <h1 class="fw-bold mb-4">🎮 실시간 1:1 대전 게임</h1>
            <p class="text-muted mb-5">방 코드를 입력하여 다른 친구와 실시간으로 대결하세요!</p>
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div id="room-entrance-container"></div>
                </div>
            </div>
        </div>

        <!-- ==================== 2. 대기실 (매칭 대기) ==================== -->
        <div id="waiting-section" class="section-container">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="card shadow-sm border-0 rounded-4 p-5">
                        <h3 class="fw-bold mb-2 text-primary" id="waiting-nickname-display">닉네임</h3>
                        <p class="text-muted mb-4">상대를 기다리고 있습니다...</p>
                        <div class="waiting-spinner text-primary mb-3"></div>
                        <p class="text-muted small">다른 학생이 입장하면 자동으로 게임이 시작됩니다.</p>
                        <div class="mt-3">
                            <span class="badge bg-light text-dark fs-6" id="waiting-count">대기 중: 1명</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 3. 1:1 실시간 대전 게임 화면 ==================== -->
        <div id="game-section" class="section-container">
            <div class="row justify-content-center g-3">
                <!-- 플레이어 턴 및 상태 바 -->
                <div class="col-12 col-lg-8">
                    <div class="card shadow-sm border-0 rounded-4 p-3 mb-3">
                        <div class="row text-center align-items-center g-2">
                            <div class="col-5">
                                <div class="turn-badge border bg-light" id="player-bar-p1">
                                    <span id="player-name-p1">플레이어1 (선공)</span>
                                </div>
                            </div>
                            <div class="col-2 fw-bold text-muted fs-5">VS</div>
                            <div class="col-5">
                                <div class="turn-badge border bg-light" id="player-bar-p2">
                                    <span id="player-name-p2">플레이어2 (후공)</span>
                                </div>
                            </div>
                        </div>

                        <!-- 턴 타이머 -->
                        <div class="progress mt-3" style="height: 6px;">
                            <div class="progress-bar bg-primary" id="timer-progress-bar" style="width: 100%;"></div>
                        </div>
                        <p class="small text-center mt-2 mb-0" id="game-status-text">차례를 기다리는 중...</p>
                    </div>

                    <!-- 메인 게임 영역 (커스텀 캔버스 or 게임 보드) -->
                    <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
                        <div class="game-canvas-wrapper my-3">
                            <!-- TODO: 여기에 게임 캔버스 또는 인터랙션 보드 배치 -->
                            <div id="custom-game-board" class="p-5 bg-light rounded-4 border w-100">
                                <h4 class="fw-bold text-secondary">🎯 게임 플레이 영역</h4>
                                <p class="text-muted small">게임 로직 및 조작 인터페이스를 배치하세요.</p>
                            </div>
                        </div>

                        <!-- 게임 결과 표시 영역 (종료 시 노출) -->
                        <div id="game-result-area" class="d-none mt-3">
                            <h2 class="fw-bold mb-2" id="game-result-title">🎉 승리!</h2>
                            <p class="text-muted" id="game-result-desc">축하합니다! 대전에서 승리했습니다.</p>
                            <button id="btn-back-to-waiting" class="btn btn-primary btn-lg fw-bold px-4">
                                🔄 대기실로 돌아가기
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 4. 선생님 대시보드 ==================== -->
        <div id="admin-section" class="section-container">
            <div class="admin-card mb-4">
                <!-- 대시보드 상단 헤더 (공통 모듈) -->
                <div id="dash-header-placeholder"></div>
                <script src="../../../js/dashboard-header.js" data-title="실시간 대전 대시보드" data-export="false" data-select-id="admin-room-select"></script>

                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h5 class="fw-bold mb-0">👥 참가자 및 대전 현황</h5>
                    <div class="d-flex align-items-center gap-3">
                        <div class="form-check form-switch fs-6 mb-0">
                            <input class="form-check-input" type="checkbox" id="admin-computer-toggle">
                            <label class="form-check-label fw-bold text-secondary" for="admin-computer-toggle">컴퓨터 추가</label>
                        </div>
                        <span class="badge bg-info fs-6" id="admin-player-count">0명 접속</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center" id="admin-record-table">
                        <thead class="table-light">
                            <tr>
                                <th>순위</th>
                                <th>닉네임</th>
                                <th>상태</th>
                                <th>대전 현황</th>
                                <th>승</th>
                                <th>패</th>
                                <th>승률</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="admin-record-tbody">
                            <tr><td colspan="8" class="py-4 text-muted">방을 선택해주세요.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ==================== Firebase & 게임 스크립트 ==================== -->
    <script type="module">
        import { ref, set, get, update, onValue, remove, query, orderByChild, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
        // TODO: 해당 프로젝트의 Firebase RTDB 인스턴스로 변경하세요
        import { rtdbRelativeFrequency as db } from "../../../js/firebase-config.js";
        import { renderRoomEntrance, customAlert, customConfirm } from "../../../js/room-auth.js";

        // =====================================================================
        // 상태 변수
        // =====================================================================
        let currentRoomCode = null;
        let currentNickname = null;
        let currentMatchId = null;
        let matchData = null;
        let isPlayer1 = false;

        let unsubAllPlayers = null, unsubWaiting = null, unsubMatch = null;
        let unsubAdminPlayers = null, unsubAdminMatches = null, unsubRoom = null;
        let heartbeatInterval = null, waitingInterval = null, timerInterval = null;

        let playersData = {};
        let adminPlayersData = {}, adminMatchesData = {};
        let isMatching = false;
        let localJoinedTime = Date.now();

        // UI 섹션
        const sectionLanding = document.getElementById('landing-section');
        const sectionWaiting = document.getElementById('waiting-section');
        const sectionGame = document.getElementById('game-section');
        const sectionAdmin = document.getElementById('admin-section');
        const navRoomInfo = document.getElementById('nav-room-info');

        function showSection(section) {
            [sectionLanding, sectionWaiting, sectionGame, sectionAdmin].forEach(s => s.classList.remove('active-section'));
            section.classList.add('active-section');
        }

        // Firebase RTDB 경로 헬퍼 (TODO: 게임 고유 노드명으로 수정)
        const DB_ROOT = "sample_match_rooms";
        function roomRef(code) { return ref(db, `${DB_ROOT}/${code}`); }
        function playerRef(code, nick) { return ref(db, `${DB_ROOT}/${code}/players/${nick}`); }
        function matchRef(code, mId) { return ref(db, `${DB_ROOT}/${code}/matches/${mId}`); }
        function waitingRef(code, nick) { return ref(db, `${DB_ROOT}/${code}/waiting/${nick}`); }

        // =====================================================================
        // 1. 방 입장 및 교사 인증
        // =====================================================================
        renderRoomEntrance('room-entrance-container', {
            joinBtnText: "🎮 방 입장하기",
            onJoin: async (code, nickname) => {
                const snap = await get(roomRef(code));
                if (!snap.exists()) return await customAlert("알림", "존재하지 않는 방 코드입니다.");

                currentRoomCode = code;
                currentNickname = nickname;

                // 플레이어 등록 및 초기 전적 설정
                const pSnap = await get(playerRef(code, nickname));
                if (!pSnap.exists()) {
                    await set(playerRef(code, nickname), {
                        nickname: nickname,
                        wins: 0,
                        losses: 0,
                        status: 'online',
                        lastHeartbeat: serverTimestamp(),
                        joinedAt: serverTimestamp()
                    });
                }

                startHeartbeat();
                enterWaitingRoom();
            },
            onAdminSuccess: () => {
                showSection(sectionAdmin);
                loadAdminRooms();
            }
        });

        // =====================================================================
        // 2. 하트비트 및 실시간 연결 관리
        // =====================================================================
        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            updateHeartbeat();
            heartbeatInterval = setInterval(updateHeartbeat, 10000);
        }

        async function updateHeartbeat() {
            if (!currentRoomCode || !currentNickname) return;
            try {
                await update(playerRef(currentRoomCode, currentNickname), {
                    lastHeartbeat: serverTimestamp(),
                    status: document.hidden ? 'away' : 'online'
                });
            } catch (e) { }
        }

        // =====================================================================
        // 3. 대기실 & 스마트 1:1 매칭
        // =====================================================================
        let currentWaitingList = [];

        async function enterWaitingRoom() {
            navRoomInfo.innerHTML = `방: <b>${currentRoomCode}</b> | <b>${currentNickname}</b>`;
            document.getElementById('waiting-nickname-display').textContent = currentNickname;
            showSection(sectionWaiting);

            localJoinedTime = Date.now();
            isMatching = false;

            if (unsubAllPlayers) { unsubAllPlayers(); unsubAllPlayers = null; }
            unsubAllPlayers = onValue(ref(db, `${DB_ROOT}/${currentRoomCode}/players`), (snap) => {
                playersData = snap.exists() ? snap.val() : {};
            });

            await set(waitingRef(currentRoomCode, currentNickname), { nickname: currentNickname, joinedAt: serverTimestamp() });

            if (unsubWaiting) { unsubWaiting(); unsubWaiting = null; }
            unsubWaiting = onValue(query(ref(db, `${DB_ROOT}/${currentRoomCode}/waiting`), orderByChild('joinedAt')), (snapshot) => {
                currentWaitingList = [];
                if (snapshot.exists()) snapshot.forEach(c => currentWaitingList.push({ id: c.key, ...c.val() }));
                attemptMatch();
            });

            if (waitingInterval) clearInterval(waitingInterval);
            waitingInterval = setInterval(attemptMatch, 1000);
        }

        async function attemptMatch() {
            if (currentMatchId || isMatching || currentWaitingList.length === 0) return;
            isMatching = true;

            try {
                // 이미 생성된 진행 중 매칭 확인
                const matchesSnap = await get(ref(db, `${DB_ROOT}/${currentRoomCode}/matches`));
                if (matchesSnap.exists()) {
                    const matches = matchesSnap.val();
                    for (const mId in matches) {
                        const m = matches[mId];
                        if (m.status === 'playing' && (m.player1 === currentNickname || m.player2 === currentNickname)) {
                            startMatchSession(mId, m);
                            return;
                        }
                    }
                }

                // 대기자 2명 이상일 때 매칭 생성 (방장 권한 위임)
                if (currentWaitingList.length >= 2 && currentWaitingList[0].id === currentNickname) {
                    const opponent = currentWaitingList[1];
                    const matchId = `${Date.now()}_${currentNickname}_${opponent.id}`;
                    
                    const updates = {};
                    updates[`matches/${matchId}`] = {
                        player1: currentNickname,
                        player2: opponent.id,
                        status: 'playing',
                        currentTurn: 'player1',
                        moves: [],
                        createdAt: serverTimestamp(),
                        lastMoveTime: serverTimestamp()
                    };
                    updates[`waiting/${currentNickname}`] = null;
                    updates[`waiting/${opponent.id}`] = null;

                    await update(ref(db, `${DB_ROOT}/${currentRoomCode}`), updates);
                }
            } catch (err) {
                console.error(err);
            } finally {
                isMatching = false;
            }
        }

        // =====================================================================
        // 4. 게임 세션 동기화 및 턴 관리
        // =====================================================================
        function startMatchSession(matchId, initialData) {
            currentMatchId = matchId;
            matchData = initialData;
            isPlayer1 = (initialData.player1 === currentNickname);

            if (unsubWaiting) { unsubWaiting(); unsubWaiting = null; }
            if (waitingInterval) { clearInterval(waitingInterval); waitingInterval = null; }

            document.getElementById('player-name-p1').textContent = `${initialData.player1} (선공)`;
            document.getElementById('player-name-p2').textContent = `${initialData.player2} (후공)`;
            document.getElementById('game-result-area').classList.add('d-none');

            showSection(sectionGame);

            if (unsubMatch) unsubMatch();
            unsubMatch = onValue(matchRef(currentRoomCode, matchId), (snap) => {
                if (!snap.exists()) return;
                matchData = snap.val();
                updateGameUI();
            });
        }

        function updateGameUI() {
            if (!matchData) return;
            const isMyTurn = (matchData.currentTurn === 'player1' && isPlayer1) || (matchData.currentTurn === 'player2' && !isPlayer1);

            const p1Bar = document.getElementById('player-bar-p1');
            const p2Bar = document.getElementById('player-bar-p2');
            p1Bar.classList.toggle('active-turn', matchData.currentTurn === 'player1');
            p2Bar.classList.toggle('active-turn', matchData.currentTurn === 'player2');

            const statusText = document.getElementById('game-status-text');
            if (matchData.status === 'finished') {
                document.getElementById('game-result-area').classList.remove('d-none');
                const isWinner = matchData.winner === currentNickname;
                document.getElementById('game-result-title').textContent = isWinner ? "🎉 승리!" : matchData.winner ? "😢 패배" : "🤝 무승부";
                statusText.textContent = "게임이 종료되었습니다.";
                return;
            }

            statusText.textContent = isMyTurn ? "✨ 내 차례입니다! 행동을 선택하세요." : "상대방의 차례입니다. 잠시 기다려주세요...";
            statusText.className = isMyTurn ? "small text-center mt-2 mb-0 text-primary fw-bold" : "small text-center mt-2 mb-0 text-muted";
        }

        document.getElementById('btn-back-to-waiting').addEventListener('click', () => {
            if (unsubMatch) { unsubMatch(); unsubMatch = null; }
            currentMatchId = null;
            matchData = null;
            enterWaitingRoom();
        });

        // =====================================================================
        // 5. 선생님 대시보드 로직
        // =====================================================================
        async function loadAdminRooms() {
            const snap = await get(ref(db, DB_ROOT));
            const select = document.getElementById('admin-room-select');
            select.innerHTML = '<option value="">방을 선택하세요</option>';
            if (snap.exists()) {
                const rooms = snap.val();
                Object.keys(rooms).sort((a, b) => (rooms[b].createdAt || 0) - (rooms[a].createdAt || 0)).forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = code;
                    select.appendChild(opt);
                });
            }
        }

        document.getElementById('btn-create-room').addEventListener('click', async () => {
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            await set(roomRef(code), {
                settings: { computerMatchEnabled: false },
                createdAt: serverTimestamp()
            });
            await loadAdminRooms();
            document.getElementById('admin-room-select').value = code;
            startAdminMonitoring(code);
            await customAlert("생성 완료", `새로운 방 [<b>${code}</b>]이 생성되었습니다.`);
        });

        document.getElementById('btn-delete-room').addEventListener('click', async () => {
            const code = document.getElementById('admin-room-select').value;
            if (!code) return await customAlert("알림", "삭제할 방을 선택하세요.");
            if (!await customConfirm("방 삭제", `방 [${code}] 데이터를 모두 삭제하시겠습니까?`)) return;

            await remove(roomRef(code));
            if (unsubAdminPlayers) { unsubAdminPlayers(); unsubAdminPlayers = null; }
            if (unsubAdminMatches) { unsubAdminMatches(); unsubAdminMatches = null; }
            if (unsubRoom) { unsubRoom(); unsubRoom = null; }

            document.getElementById('admin-record-tbody').innerHTML = '<tr><td colspan="8" class="py-4 text-muted">방을 선택해주세요.</td></tr>';
            document.getElementById('admin-player-count').textContent = '0명 접속';
            await loadAdminRooms();
            await customAlert("완료", "방이 삭제되었습니다.");
        });

        document.getElementById('admin-room-select').addEventListener('change', (e) => {
            const code = e.target.value;
            if (!code) {
                document.getElementById('admin-record-tbody').innerHTML = '<tr><td colspan="8" class="py-4 text-muted">방을 선택해주세요.</td></tr>';
                document.getElementById('admin-player-count').textContent = '0명 접속';
                if (unsubAdminPlayers) unsubAdminPlayers();
                if (unsubAdminMatches) unsubAdminMatches();
                if (unsubRoom) unsubRoom();
                return;
            }
            startAdminMonitoring(code);
        });

        function startAdminMonitoring(roomCode) {
            if (unsubAdminPlayers) unsubAdminPlayers();
            if (unsubAdminMatches) unsubAdminMatches();
            if (unsubRoom) unsubRoom();

            currentRoomCode = roomCode;

            unsubAdminPlayers = onValue(ref(db, `${DB_ROOT}/${roomCode}/players`), (snap) => {
                adminPlayersData = snap.exists() ? snap.val() : {};
                renderAdminTable();
            });

            unsubAdminMatches = onValue(ref(db, `${DB_ROOT}/${roomCode}/matches`), (snap) => {
                adminMatchesData = snap.exists() ? snap.val() : {};
                renderAdminTable();
            });
        }

        function renderAdminTable() {
            const tbody = document.getElementById('admin-record-tbody');
            const players = Object.entries(adminPlayersData);
            document.getElementById('admin-player-count').textContent = `${players.length}명 접속`;

            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-4 text-muted">아직 참여한 학생이 없습니다.</td></tr>';
                return;
            }

            // 다승 및 승률 순 정렬
            players.sort((a, b) => {
                const aWins = a[1].wins || 0, bWins = b[1].wins || 0;
                return bWins - aWins;
            });

            let html = '';
            players.forEach(([id, p], idx) => {
                const total = (p.wins || 0) + (p.losses || 0);
                const rate = total > 0 ? Math.round((p.wins / total) * 100) : 0;
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);

                html += `
                    <tr>
                        <td class="fw-bold">${medal}</td>
                        <td class="fw-bold">${p.nickname || id}</td>
                        <td><span class="status-dot ${p.status || 'online'}"></span> <small>${p.status === 'online' ? '접속중' : '자리비움'}</small></td>
                        <td><span class="text-muted">대기 중</span></td>
                        <td class="text-success fw-bold">${p.wins || 0}</td>
                        <td class="text-danger fw-bold">${p.losses || 0}</td>
                        <td><b>${rate}%</b></td>
                        <td><button class="btn btn-outline-danger btn-sm" onclick="kickPlayer('${id}')">강퇴</button></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        window.kickPlayer = async function(pId) {
            if (!await customConfirm("강퇴 확인", `해당 학생(${pId})을 강퇴하시겠습니까?`)) return;
            await remove(ref(db, `${DB_ROOT}/${currentRoomCode}/players/${pId}`));
            await remove(ref(db, `${DB_ROOT}/${currentRoomCode}/waiting/${pId}`));
        };
    </script>
</body>
</html>
