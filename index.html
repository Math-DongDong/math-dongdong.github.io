<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동동쌤's 웹 앱</title>

    <!-- 모바일 및 반응형 웹을 위한 Bootstrap 5 CSS 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 적용 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- 커스텀 CSS 스타일 적용 -->
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        /* 폰트 및 전역 설정 */
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
        }

        /* 페이지 제목 스타일 */
        .page-title {
            color: #2c3e50;
            font-weight: 800;
            margin-bottom: 0.75rem;
            font-size: 2.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
        }

        .page-title i {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }

        /* 페이지 소제목 스타일 */
        .page-subtitle {
            color: #64748b;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        /* 카드 테두리와 부드러운 그림자 효과 설정 */
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            background-color: #ffffff;
            overflow: hidden;
            text-decoration: none !important;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        /* 카드 이미지 비율 및 크기 조정 */
        .img-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1rem;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 카드 내부 여백 조정 */
        .card-body {
            padding: 0 1.25rem 1.5rem 1.25rem;
        }

        /* 카드 하단 텍스트 */
        .card-text-custom {
            color: #334155;
            font-size: 1.05rem;
            margin-top: 0.5rem;
        }

        /* 동적 페이드인 애니메이션 */
        #search-result-area {
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* QR 코드 대형 카드 채움 스타일 */
        .qr-code-large {
            width: 100%;
            max-width: 180px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <!-- 페이지 전체를 감싸는 컨테이너 -->
    <div class="container py-5">

        <!-- 헤더 영역 (제목 및 설명) -->
        <header class="text-center mb-5">
            <h1 class="page-title">동동쌤's 웹 앱</h1>
            <p class="page-subtitle">원하는 주제를 선택하여 바로 이동해보세요!</p>
        </header>

        <!-- 카드 영역 (가로로 3개 배치) -->
        <div class="row g-4">

            <!-- 첫 번째 카드: 중학 수학 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="./pages/middleschool/game/pig_game.html" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/중학수학.jpg" class="card-img-top" alt="중학 수학"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">중학 수학</div>
                    </div>
                </a>
            </div>

            <!-- 두 번째 카드: 인공지능 수학 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="./pages/aimath/image/resolution.html" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/인공지능수학.jpg" class="card-img-top" alt="인공지능 수학"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">인공지능 수학</div>
                    </div>
                </a>
            </div>

            <!-- 세 번째 카드: 산업 수학 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="https://industrialmath.streamlit.app/" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/산업수학.jpg" class="card-img-top" alt="산업 수학"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">산업 수학</div>
                    </div>
                </a>
            </div>

            <!-- 네 번째 카드: 업무자동화 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="./pages/automation/work/travel_expense_report.html" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/업무자동화.jpg" class="card-img-top" alt="업무자동화"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">업무자동화</div>
                    </div>
                </a>
            </div>

            <!-- 다섯 번째 카드: 동동봇 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="https://dongdongbot.streamlit.app/" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/동동이.jpg" class="card-img-top" alt="동동봇"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">동동봇</div>
                    </div>
                </a>
            </div>

            <!-- 여섯 번째 카드: 실시간 콘텐츠 검색 & 대형 QR 생성 카드 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 p-3 text-center d-flex flex-column justify-content-between">
                    <div class="w-100">
                        <!-- 타이틀 -->
                        <div class="fw-bold text-dark mb-2" style="font-size: 1.05rem;">
                            <i class="bi bi-search text-primary me-1"></i> 콘텐츠 검색 &amp; QR 생성
                        </div>

                        <!-- 검색 입력 필드 -->
                        <div class="mb-2 position-relative">
                            <input type="text" id="app-search-input"
                                class="form-control form-control-sm text-center rounded-pill shadow-sm"
                                placeholder="교구/앱 이름 검색..." list="app-datalist" autocomplete="off">
                            <datalist id="app-datalist"></datalist>
                        </div>

                        <!-- 검색 결과 / 바로가기 / 대형 QR 코드 영역 -->
                        <div id="search-result-area"
                            class="p-3 border rounded-3 bg-white shadow-sm my-2 d-flex flex-column align-items-center"
                            style="display: none;">
                            <div id="selected-app-title" class="fw-bold text-truncate text-primary small mb-2 w-100">
                            </div>

                            <!-- 카드 내부에 꽉 차는 실시간 대형 QR 코드 -->
                            <div class="d-flex justify-content-center my-1 w-100">
                                <img id="qr-code-img" src="" alt="QR 코드"
                                    class="border p-2 rounded bg-white shadow-xs qr-code-large">
                            </div>

                            <!-- 바로가기 버튼 -->
                            <a id="btn-go-link" href="#" target="_blank"
                                class="btn btn-sm btn-primary fw-bold w-100 mt-2 rounded-pill shadow-sm">
                                <i class="bi bi-box-arrow-up-right me-1"></i> 바로가기
                            </a>
                        </div>

                        <!-- 초기 대기 안내 메시지 -->
                        <div id="search-placeholder-msg" class="text-muted small py-4">
                            <i class="bi bi-qr-code-scan fs-2 text-secondary d-block mb-2"></i>
