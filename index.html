<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동동쌤's 웹 앱</title>

    <!-- 모바일 및 반응형 웹을 위한 Bootstrap 5 CSS 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 적용 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- 우리가 따로 작성한 커스텀 CSS 스타일 적용 -->
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        /* 폰트 및 전역 설정 */
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
        }

        /* 메인 화면 전용 디자인 */

        /* 페이지 제목 스타일 (남색 계열 적용) */
        .page-title {
            color: #2c3e50;
            font-weight: 800;
            margin-bottom: 0.75rem;
            font-size: 2.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
        }

        .page-title i {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }

        /* 페이지 소제목 스타일 (회색 계열 적용) */
        .page-subtitle {
            color: #64748b;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        /* 카드 테두리와 부드러운 그림자 효과 설정 */
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            background-color: #ffffff;
            overflow: hidden;
            text-decoration: none !important;
        }

        /* 카드에 마우스를 올렸을 때(hover) 살짝 떠오르는 효과 */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        /* 카드 이미지 비율 및 크기 조정 */
        .img-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1rem;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 카드 내부 여백 조정 */
        .card-body {
            padding: 0 1.25rem 1.5rem 1.25rem;
        }

        /* 카드 하단 텍스트 */
        .card-text-custom {
            color: #334155;
            font-size: 1.05rem;
            margin-top: 0.5rem;
        }

        /* 빈 여백 카드 스타일 */
        .card-placeholder {
            border: 2px dashed #cbd5e1 !important;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 280px;
            border-radius: 12px;
            cursor: default;
            transition: none !important;
        }

        .card-placeholder:hover {
            transform: none !important;
            box-shadow: none !important;
        }

        .card:hover .card-text-custom {
            color: #0f172a;
        }

        /* 바로가기 버튼 전용 호버 효과 */
        .btn-shortcut {
            transition: all 0.2s ease;
        }

        .btn-shortcut:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2) !important;
        }
    </style>
</head>

<body>

    <!-- 페이지 전체를 감싸는 컨테이너 -->
    <div class="container py-5">

        <!-- 헤더 영역 (제목 및 설명) -->
        <header class="text-center mb-5">
            <h1 class="page-title">동동쌤's 웹 앱</h1>
            <p class="page-subtitle">원하는 주제를 선택하여 바로 이동해보세요!</p>
        </header>

        <!-- 카드 영역 (가로로 3개 배치, 화면이 작아지면 2개, 1개로 줄어듦) -->
        <!-- row: 행 시작 / g-4: 카드 사이의 간격(gap) -->
        <div class="row g-4">

            <!-- 첫 번째 카드: 중학 수학 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="./pages/middleschool/game/pig_game.html" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/중학수학.jpg" class="card-img-top" alt="중학 수학"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">중학 수학</div>
                    </div>
                </a>
            </div>

            <!-- 두 번째 카드: 인공지능 수학 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="./pages/aimath/image/resolution.html" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/인공지능수학.jpg" class="card-img-top" alt="인공지능 수학"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">인공지능 수학</div>
                    </div>
                </a>
            </div>

            <!-- 세 번째 카드: 산업 수학 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="https://industrialmath.streamlit.app/" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/산업수학.jpg" class="card-img-top" alt="산업 수학"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">산업 수학</div>
                    </div>
                </a>
            </div>

            <!-- 네 번째 카드: 업무자동화 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="./pages/automation/work/travel_expense_report.html" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/업무자동화.jpg" class="card-img-top" alt="업무자동화"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">업무자동화</div>
                    </div>
                </a>
            </div>

            <!-- 다섯 번째 카드: 동동봇 -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="https://dongdongbot.streamlit.app/" class="card h-100 text-decoration-none">
                    <div class="img-container">
                        <img src="./assets/images/mainPage/동동이.jpg" class="card-img-top" alt="동동봇"
                            onerror="this.src='https://via.placeholder.com/300?text=(이미지 준비 중)'">
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end">
                        <div class="card-text-custom text-center fw-bold">동동봇</div>
                    </div>
                </a>
            </div>

            <!-- 여섯 번째 카드: 바로가기 생성 및 문의 정보 카드 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-placeholder h-100 p-4 text-center">
                    <!-- 상단 영역: 바로가기 버튼 -->
                    <div class="my-auto w-100">
                        <button type="button" id="btn-shortcut"
                            class="btn btn-primary btn-shortcut fw-bold rounded-pill px-4 py-2 w-100 shadow-sm"
                            onclick="handleCreateShortcut()">
                            <i class="bi bi-bookmark-plus-fill me-1"></i> 바로가기 생성
                        </button>
                    </div>

                    <!-- 하단 영역: 문의 메일 및 Copyright -->
                    <div class="w-100 pt-3 border-top border-secondary-subtle">
                        <p class="mb-1 text-secondary small">
                            <i class="bi bi-envelope-fill me-1 text-primary"></i> 문의: jjes0107@gmail.com
                        </p>
                        <p class="mb-0 text-muted" style="font-size: 0.78rem;">
                            © 동동쌤. All rights reserved.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 기능 작동을 위한 JS 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 바로가기 생성 스크립트 -->
    <script>
        function handleCreateShortcut() {
            const userAgent = navigator.userAgent.toLowerCase();

            if (userAgent.indexOf('iphone') > -1 || userAgent.indexOf('ipad') > -1) {
                alert("Safari 브라우저 하단의 [공유] 버튼을 누른 후\n['홈 화면에 추가']를 선택해주세요!");
            } else if (userAgent.indexOf('android') > -1) {
                alert("브라우저 우측 상단 메뉴(⋮)를 누른 후\n['홈 화면에 추가']를 선택해주세요!");
            } else {
                alert("PC 환경에서는 [Ctrl + D]를 눌러 북마크에 등록하여 사용하실 수 있습니다!");
            }
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
