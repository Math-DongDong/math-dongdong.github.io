 */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-student]');
  if (!b || !S.ctx || !S.ctx.cur) return;
  if (S.tab === 'map') focusStudent(b.dataset.student, { center: !b.closest('#drawer') });
  else openDrawer(b.dataset.student);
});

/* ═══════════════════════════════════════════════════════════════
 *  8. 지도 탭: 칠판 관계지도 + 학생 강조
 * ═══════════════════════════════════════════════════════════════ */
function renderMap() {
  const cur = S.ctx.cur, d = S.ctx.diff;
  $('#map-empty').hidden = true;
  $('#map-body').hidden = false;
  const prevT = d ? S.trend.find(x => x.month === d.prevMonth) : null;
  const delta = (a, b, goodUp, digits) => {
    if (!prevT || a == null || b == null) return '';
    const x = Math.round((a - b) * 10) / 10;
    if (!x) return '<p class="mt-0.5 text-[11px] font-semibold text-ink-muted">지난달과 같아요</p>';
    return `<p class="mt-0.5 text-[11px] font-bold ${(goodUp ? x > 0 : x < 0) ? 'text-board' : 'text-stamp'}">지난달보다 ${x > 0 ? '+' : ''}${digits ? x.toFixed(1) : x}</p>`;
  };
  const stat = (label, value, unit, sub) => `<div class="stat"><p class="text-xs font-bold text-ink-muted">${label}</p>
    <p class="mt-0.5 text-2xl font-extrabold tabular-nums">${value}<span class="ml-0.5 text-sm font-semibold text-ink-muted">${unit}</span></p>${sub || ''}</div>`;
  const negCount = cur.edges.filter(e => e.pol === POL.NEG).length;
  $('#map-stats').innerHTML =
    stat('설문 응답', `${cur.responded}/${cur.total}`, '명') +
    stat('서로 친구', cur.mutualPairs.length, '쌍', delta(cur.mutualPairs.length, prevT && prevT.mutual, true)) +
    stat('불편 응답', negCount, '건', delta(negCount, prevT && prevT.neg, false)) +
    stat('학급 분위기', cur.climate.avg == null ? '-' : cur.climate.avg.toFixed(1), '/ 5', delta(cur.climate.avg, prevT && prevT.climateAvg, true, true));
  renderMapControls(); renderLegend(); renderBelowMap();
  if (S.netDirty || !S.net) buildNetwork();
  else { S.net.setSize('100%', '100%'); S.net.redraw(); refreshGraph(); }   // 다른 탭에서 돌아왔을 때 크기 다시 맞춤
}

function renderMapControls() {
  document.querySelectorAll('[data-mode]').forEach(b => {
    const on = S.mode === b.dataset.mode;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
    if (b.dataset.mode === 'diff') { b.disabled = !S.ctx.diff; b.title = S.ctx.diff ? '' : '비교할 지난달이 없어요'; }
  });
  const chip = (key, on, label, color) => `<button type="button" data-filter="${key}" class="chip ${on ? 'chip-on' : ''}" aria-pressed="${on}"><span class="h-2.5 w-2.5 rounded-full ring-1 ring-black/20" style="background:${color}"></span>${label}</button>`;
  $('#map-filters').innerHTML = S.mode === 'month'
    ? chip('pos', S.filters.pos, '즐거운 관계', CH.posBlue) + chip('neg', S.filters.neg, '불편한 관계', CH.red) + chip('mutualOnly', S.filters.mutualOnly, '서로 친구만', CH.yellow)
    : chip('added', S.diffFilters.added, '새로 생김', CH.green) + chip('removed', S.diffFilters.removed, '사라지거나 풀림', CH.gray) + chip('kept', S.diffFilters.kept, '그대로', CH.posBlue);
}
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  if (b.disabled || !S.ctx || !S.ctx.cur) return;
  S.mode = b.dataset.mode; renderMapControls(); renderLegend(); refreshGraph(); renderBelowMap();
}));
$('#map-filters').addEventListener('click', e => {
  const b = e.target.closest('[data-filter]'); if (!b) return;
  const f = S.mode === 'month' ? S.filters : S.diffFilters;
  f[b.dataset.filter] = !f[b.dataset.filter];
  renderMapControls(); refreshGraph();
});

function renderLegend() {
  // 칠판 위 색이 그대로 보이도록 표시는 작은 칠판 조각 위에 그립니다
  const item = (mark, text) => `<span class="inline-flex items-center gap-1.5"><span class="inline-flex h-5 items-center rounded bg-board px-1.5" aria-hidden="true">${mark}</span>${text}</span>`;
  const dot = (c, t) => item(`<span class="h-2.5 w-2.5 rounded-full" style="background:${c}"></span>`, t);
  const line = (c, t, dashed) => item(`<span class="inline-block w-5 border-t-[3px] ${dashed ? 'border-dashed' : ''}" style="border-color:${c}"></span>`, t);
  $('#map-legend').innerHTML = S.mode === 'month'
    ? dot(CH.yellow, '서로 친구 있음') + dot(CH.chalk, '보통') + dot(CH.gray, '선택받지 못함') + dot(CH.darkRed, '불편 응답 2건 이상')
      + item(`<span class="h-3 w-3 rounded-full border-[3px]" style="background:${CH.darkRed};border-color:${CH.gray}"></span>`, '둘 다 해당')
      + line(CH.yellow, '서로 친구') + line(CH.posBlue, '즐거운 관계(→)') + line(CH.red, '불편한 관계(점선)', true)
    : dot(CH.green, '받은 선택 늘어남') + dot(CH.red, '줄어듦') + dot(CH.chalk, '같음')
      + line(CH.green, '새로 생긴 즐거운 관계') + line(CH.red, '새로 생긴 불편 관계', true) + line(CH.gray, '사라진 관계', true)
      + `<span class="basis-full text-[11px] font-medium text-ink/70">${shortMonth(S.ctx.diff.prevMonth)}과 ${shortMonth(S.month)} 모두 응답한 ${S.ctx.diff.comparable}명의 답만 비교해요.</span>`;
}

/* ── 칠판 위 관계지도 (vis-network) ──
 *  즐거운 관계만 보이지 않는 '배치용 선'으로 당겨 자리를 잡고(불편한 관계는 끌어당기지 않음),
 *  자리를 잡은 뒤에는 물리 계산을 꺼서 보기 방식·필터를 바꾸거나 응답이 들어와도 학생 자리가 움직이지 않습니다. */
let layoutSeed = 11;
const NETWORK_OPTIONS = {
  autoResize: true,
  nodes: { shape: 'dot', scaling: { min: 10, max: 30, label: { enabled: false } } },
  edges: { smooth: { enabled: true, type: 'curvedCW', roundness: 0.16 }, selectionWidth: 0, hoverWidth: 0.6 },
  physics: {
    enabled: true, solver: 'forceAtlas2Based', minVelocity: 0.8,
    forceAtlas2Based: { gravitationalConstant: -85, centralGravity: 0.01, springLength: 140, springConstant: 0.06, damping: 0.5, avoidOverlap: 0.8 },
    stabilization: { enabled: true, iterations: 600, updateInterval: 40, fit: false }
  },
  interaction: { hover: true, tooltipDelay: 120, keyboard: false, selectConnectedEdges: false }
};
const edgeColor = (color, opacity) => ({ color, highlight: color, hover: color, opacity });

/** 별(노드): 이번 달 모드는 관계 상태로, 비교 모드는 받은 선택의 증감으로 분필 색칠 */
function makeNodes() {
  const cur = S.ctx.cur, diff = S.ctx.diff, dmap = {};
  if (diff) diff.students.forEach(x => { dmap[x.id] = x; });
  return activeStudents().map(s => {
    const st = cur.stats[s.id];
    let bg, title, border = CH.board, bw = 2;
    if (S.mode === 'diff' && diff) {
      const x = dmap[s.id], dd = x.curPos - x.prevPos;
      bg = dd > 0 ? CH.green : dd < 0 ? CH.red : CH.chalk;
      title = `${s.name}: 받은 선택 ${x.prevPos} → ${x.curPos}`;
    } else {
      // 불편 응답 2건 이상 = 진한 빨강, 선택받지 못함 = 회색, 둘 다면 진한 빨강 + 굵은 회색 테두리
      const isolated = cur.responded && st.recvPos === 0, manyNeg = st.recvNeg >= 2;
      bg = manyNeg ? CH.darkRed : isolated ? CH.gray : st.mutual > 0 ? CH.yellow : CH.chalk;
      border = manyNeg && isolated ? CH.gray : CH.board;
      bw = manyNeg && isolated ? 5 : 2;
      title = `${s.name}: 받은 선택 ${st.recvPos}, 서로 친구 ${st.mutual}, 불편 응답 ${st.recvNeg}`;
    }
    return {
      id: s.id, label: s.name, value: 1 + st.recvPos, title: tooltip([title]), borderWidth: bw,
      color: { background: bg, border, highlight: { background: bg, border: CH.yellow }, hover: { background: bg, border: CH.yellow } },
      font: { color: CH.chalk, size: 14, face: 'Pretendard', strokeWidth: 4, strokeColor: CH.board }
    };
  });
}

/** 선(엣지): 누르면 보여줄 이유를 S.edgeInfo에 담아 둡니다. */
function makeEdges() {
  S.edgeInfo = {};
  const edges = [];
  let n = 0;
  const push = (edge, info) => { const id = 'e' + (n++); edge.id = id; edge.physics = false; S.edgeInfo[id] = info; edges.push(edge); };
  const short = e => (e.text ? '“' + e.text + '”' : '');
  const arrow = { to: { enabled: true, scaleFactor: 0.45 } };

  if (S.mode === 'month') {
    const es = S.ctx.cur.edges, has = {}, done = {};
    es.forEach(e => { has[e.s + '|' + e.o + '|' + e.pol] = e; });
    es.forEach(e => {
      const rev = has[e.o + '|' + e.s + '|' + e.pol];
      if (e.pol === POL.POS) {
        if (rev) {
          const k = [e.s, e.o].sort().join('|'); if (done[k]) return; done[k] = 1;
          if (!S.filters.pos && !S.filters.mutualOnly) return;
          push({ from: e.s, to: e.o, width: 3.6, color: edgeColor(CH.yellow, 0.95), title: tooltip([`${studentName(e.s)} ↔ ${studentName(e.o)}: 서로 친구`]) }, { title: '서로 친구예요', list: [e, rev] });
        } else if (S.filters.pos && !S.filters.mutualOnly) {
          push({ from: e.s, to: e.o, arrows: arrow, width: [0, 2.2, 1.6, 1.2][e.rank] || 1.2, color: edgeColor(CH.posBlue, 0.85), title: tooltip([`${studentName(e.s)} → ${studentName(e.o)}: ${short(e)}`]) }, { title: '즐겁게 지내는 친구로 골랐어요', list: [e] });
        }
      } else if (S.filters.mutualOnly) {
        return;
      } else if (e.pol === POL.NEG && S.filters.neg) {
        push({ from: e.s, to: e.o, arrows: arrow, width: 2, dashes: [6, 5], color: edgeColor(CH.red, 1), title: tooltip([`${studentName(e.s)} → ${studentName(e.o)}: ${short(e)}`]) }, { title: '마음이 불편하다고 답했어요', list: [e] });
      }
    });
  } else {
    const d = S.ctx.diff, f = S.diffFilters;
    const add = (list, style, info) => list.forEach(e => push(Object.assign({ from: e.s, to: e.o, arrows: arrow, title: tooltip([`${studentName(e.s)} → ${studentName(e.o)}: ${info}`]) }, style), { title: info, list: [e] }));
    if (f.kept) {
      add(d.keptPos, { width: 1, color: edgeColor(CH.posBlue, 0.3) }, '두 달 연속 즐거운 관계');
      add(d.keptNeg, { width: 1, dashes: [6, 5], color: edgeColor(CH.red, 0.45) }, '두 달 연속 불편한 관계');
    }
    if (f.removed) {
      add(d.lostPos, { width: 1.6, dashes: [6, 6], color: edgeColor(CH.gray, 1) }, '지난달엔 즐거운 관계였지만 이번 달엔 고르지 않았어요');
      add(d.resolvedNeg, { width: 1.6, dashes: [2, 5], color: edgeColor(CH.green, 0.8) }, '지난달 불편했던 관계가 풀렸어요');
    }
    if (f.added) {
      add(d.newPos, { width: 3, color: edgeColor(CH.green, 1) }, '새로 생긴 즐거운 관계');
      add(d.newNeg, { width: 3, dashes: [6, 5], color: edgeColor(CH.red, 1) }, '새로 생긴 불편한 관계');
    }
  }
  return edges;
}

/** 배치용 선: 즐거운 관계만, 서로 고르거나 먼저 고를수록 가깝게 (그리지는 않음) */
function makeLayoutEdges() {
  const weight = new Map();
  S.ctx.cur.edges.forEach(e => {
    if (e.pol !== POL.POS) return;
    const key = e.s < e.o ? `${e.s}|${e.o}` : `${e.o}|${e.s}`;
    weight.set(key, (weight.get(key) || 0) + Math.max(1, 4 - e.rank));
  });
  return [...weight.entries()].map(([key, w]) => { const [a, b] = key.split('|'); return { id: `L|${key}`, from: a, to: b, hidden: true, physics: true, length: Math.max(70, 150 - w * 14) }; });
}

/**
 * 학생 강조: 선택한 학생과 직접 이어진 친구·선은 또렷하게, 나머지는 분필 자국처럼 흐리게.
 * 지금 켜 둔 관계 종류(필터)의 선을 기준으로 이어진 친구를 찾습니다.
 */
function graphData() {
  const nodes = makeNodes(), edges = makeEdges(), f = S.focusId;
  if (!f) return { nodes, edges };
  const near = new Set([f]);
  edges.forEach(e => { if (e.from === f) near.add(e.to); if (e.to === f) near.add(e.from); });
  edges.forEach(e => {
    if (e.from === f || e.to === f) { e.width = (e.width || 1) + 1.2; e.color = Object.assign({}, e.color, { opacity: 1 }); }
    else e.color = Object.assign({}, e.color, { opacity: 0.06 });
  });
  const faint = 'rgba(243,240,228,0.12)';
  nodes.forEach(nd => {
    if (nd.id === f) {
      nd.borderWidth = 5;
      nd.color = Object.assign({}, nd.color, { border: CH.yellow });
      nd.font = Object.assign({}, nd.font, { size: 17, color: CH.yellow });
    } else if (!near.has(nd.id)) {
      nd.color = { background: faint, border: 'rgba(243,240,228,0.18)', highlight: { background: faint, border: CH.yellow }, hover: { background: 'rgba(243,240,228,0.3)', border: CH.yellow } };
      nd.font = Object.assign({}, nd.font, { color: 'rgba(243,240,228,0.25)', strokeWidth: 0 });
    }
  });
  return { nodes, edges };
}

/** 자리는 그대로 두고 색과 선만 바꿉니다. 다른 탭을 보는 중이면 지도 탭으로 돌아올 때 그립니다. */
function refreshGraph() {
  if (!S.ctx || !S.ctx.cur || S.tab !== 'map') return;
  if (!S.net || S.netDirty) return buildNetwork();
  const g = graphData();
  S.nodesDS.update(g.nodes);
  S.edgesDS.clear();
  S.edgesDS.add(makeLayoutEdges().concat(g.edges));
}

/** 그래프 만들기: 기억해 둔 자리를 써서 달을 바꾸거나 학생이 늘어도 학생 자리가 그대로예요. */
function buildNetwork() {
  const box = $('#network');
  if (S.net) { S.net.destroy(); S.net = null; }
  S.netDirty = false;
  S.netReady = null;
  if (typeof vis === 'undefined') { box.innerHTML = '<p class="p-6 text-chalk">그래프 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>'; return; }
  if (!activeStudents().length) { box.innerHTML = '<p class="p-6 text-chalk">아직 학생이 없어요. 관리 탭에서 학생 명단을 추가해 주세요.</p>'; return; }
  box.innerHTML = '';
  const g = graphData(), saved = loadPositions();
  const placed = g.nodes.filter(nd => saved[nd.id]).map(nd => nd.id), allPlaced = placed.length === g.nodes.length;
  // 자리가 있는 학생은 붙잡아 두고, 새로 들어온 학생만 빈자리를 찾게 합니다
  g.nodes.forEach(nd => { const p = saved[nd.id]; if (p) { nd.x = p.x; nd.y = p.y; if (!allPlaced) nd.fixed = true; } });
  S.nodesDS = new vis.DataSet(g.nodes);
  S.edgesDS = new vis.DataSet(makeLayoutEdges().concat(g.edges));
  const options = Object.assign({}, NETWORK_OPTIONS, { layout: { improvedLayout: true, randomSeed: layoutSeed } }, allPlaced ? { physics: { enabled: false } } : {});
  const net = S.net = new vis.Network(box, { nodes: S.nodesDS, edges: S.edgesDS }, options);
  if (allPlaced) { fitNetwork(false); S.netReady = Promise.resolve(); }
  else S.netReady = new Promise(done => {
    net.once('stabilizationIterationsDone', () => {
      if (S.net === net) {
        net.setOptions({ physics: { enabled: false } });
        if (placed.length) S.nodesDS.update(placed.map(id => ({ id, fixed: false })));
        savePositions();
        fitNetwork(false);
      }
      done();
    });
    setTimeout(done, 4000);
  });
  net.on('dragEnd', p => { if (p.nodes.length) savePositions(); });
  // 학생을 누르면 강조 + 정보창, 선을 누르면 이유, 빈 곳을 누르면 강조 해제
  net.on('click', p => {
    if (p.nodes.length) return p.nodes[0] === S.focusId ? clearFocus() : focusStudent(p.nodes[0]);   // 같은 학생을 다시 누르면 선택 해제
    if (p.edges.length && S.edgeInfo[p.edges[0]]) return showEdgeInfo(S.edgeInfo[p.edges[0]]);
    if (drawerId || S.focusId) clearFocus();
  });
  if (S.focusId) net.selectNodes([S.focusId]);
}

/** 칠판을 채우도록 맞춤 (vis 기본값은 1배보다 크게 키우지 않아 그림이 작게 모입니다) */
function fitNetwork(animate) {
  if (S.net) S.net.fit({ maxZoomLevel: 1.4, animation: animate ? { duration: 400, easingFunction: 'easeInOutQuad' } : false });
}

/* 학생 자리는 반마다 이 기기에 기억합니다 (끌어 옮긴 자리도) */
const positionStoreKey = () => `relationmap:pos:${S.roomCode}`;
function loadPositions() {
  if (!S.positions[S.roomCode]) {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(positionStoreKey()) || '{}') || {}; } catch (e) { saved = {}; }
    S.positions[S.roomCode] = saved;
  }
  return S.positions[S.roomCode];
}
function savePositions() {
  if (!S.net) return;
  const all = Object.assign({}, loadPositions(), S.net.getPositions());
  S.positions[S.roomCode] = all;
  try { localStorage.setItem(positionStoreKey(), JSON.stringify(all)); } catch (e) { /* 저장 공간이 없어도 지도는 그대로 씁니다 */ }
}

$('#btn-fit').addEventListener('click', () => fitNetwork(true));
$('#btn-relayout').addEventListener('click', () => {
  if (!S.ctx || !S.ctx.cur) return;
  S.positions[S.roomCode] = {};
  try { localStorage.removeItem(positionStoreKey()); } catch (e) { /* 무시 */ }
  layoutSeed = Math.floor(Math.random() * 100000);
  buildNetwork();
});

/** 지도에서 학생 강조 + 오른쪽 Drawer 열기 (center: 지도를 그 학생 쪽으로 옮김) */
async function focusStudent(id, opts) {
  opts = opts || {};
  if (!S.ctx || !S.ctx.cur || !S.ctx.cur.stats[id]) return;
  S.focusId = id;
  if (S.tab !== 'map') switchTab('map');
  else { refreshGraph(); renderBelowMap(); }
  openDrawer(id);
  if (S.netReady) await S.netReady;
  if (!S.net || S.focusId !== id) return;
  S.net.selectNodes([id]);
  if (opts.center) S.net.focus(id, { scale: Math.max(S.net.getScale(), 1), animation: { duration: 450 } });
}

/** 강조 해제 + Drawer 닫기 */
function clearFocus() {
  if (drawerId) return closeDrawer();
  S.focusId = null;
  refreshGraph(); renderBelowMap();
  if (S.net) S.net.unselectAll();
}

function showEdgeInfo(info) {
  openModal(`<h3 class="text-lg font-extrabold">${esc(info.title)}</h3>
    <div class="mt-4 space-y-4">${info.list.map(e => `<div>
      <p class="text-sm font-bold"><button type="button" data-student="${esc(e.s)}" data-close="" class="underline underline-offset-4">${esc(studentName(e.s))}</button>
      <span class="text-ink-muted"> → </span><button type="button" data-student="${esc(e.o)}" data-close="" class="underline underline-offset-4">${esc(studentName(e.o))}</button></p>
      <div class="mt-2 flex flex-wrap items-center gap-1.5">${reasonHtml(e) || '<span class="text-sm text-ink-muted">이유가 없어요</span>'}</div></div>`).join('')}</div>
    <div class="mt-6 flex"><button data-close="" class="btn btn-ghost flex-1 py-3">닫기</button></div>`);
}

/* ═══════════════════════════════════════════════════════════════
 *  9. 지도 아래 표: '살펴볼 점'(이번 달) / '지난달과 달라진 점'(비교 모드)
 * ═══════════════════════════════════════════════════════════════ */
/** 표 하나 = 소주제 하나 (count를 주면 줄 수 대신 그 수를 보여 줍니다). 0건인 표는 그리지 않습니다. */
function sectionTable(icon, title, note, tone, head, rows, unit, count) {
  if (!rows.length) return '';
  const toneBox = tone === 'neg' ? 'border-stamp/40' : tone === 'good' ? 'border-board/40' : '';
  const toneHead = tone === 'neg' ? 'bg-stamp-soft' : tone === 'good' ? 'bg-board-soft' : 'bg-page/50';
  const toneText = tone === 'neg' ? 'text-stamp' : tone === 'good' ? 'text-board' : '';
  return `<section class="panel overflow-hidden ${toneBox}">
    <div class="flex flex-wrap items-baseline gap-x-2 border-b border-line px-4 py-3 ${toneHead}">
      <h3 class="font-extrabold ${toneText}">${icon} ${title}</h3>
      ${unit === false ? '' : `<span class="text-sm font-bold text-ink-muted">${count == null ? rows.length : count}${unit || '건'}</span>`}
      ${note ? `<span class="basis-full text-xs text-ink-muted">${note}</span>` : ''}
    </div>
    <div class="overflow-x-auto"><table class="w-full min-w-[520px] text-sm">
      <thead><tr>${head.map(h => `<th class="th">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}</tbody></table></div>
  </section>`;
}
/** 표들을 붙이고, 모두 0건이면 한 줄 안내만 */
const tablesOrNote = (tables, note) => tables.join('') || `<div class="panel p-5 text-sm text-ink-muted">${note}</div>`;
const trCells = cells => `<tr>${cells.map(c => `<td class="td">${c}</td>`).join('')}</tr>`;
const whoLink = id => `<button type="button" data-student="${esc(id)}" class="font-bold text-board underline underline-offset-4">${esc(studentName(id))}</button>`;
const dash = '<span class="text-ink-muted/60">-</span>';

/** 지도 아래: 이번 달 모드는 '살펴볼 점', 비교 모드는 '지난달과 달라진 점' */
function renderBelowMap() {
  if (!S.ctx || !S.ctx.cur) return;
  const diffMode = S.mode === 'diff' && S.ctx.diff;
  $('#below-title').textContent = diffMode ? `${shortMonth(S.ctx.diff.prevMonth)} → ${shortMonth(S.month)}, 지난달과 달라진 점` : '살펴볼 점';
  if (diffMode) renderDiffTables(); else renderAlerts();
}

/** 살펴볼 점: 소주제별 표 */
function renderAlerts() {
  const cur = S.ctx.cur, w = cur.watch;
  $('#map-alerts').innerHTML = tablesOrNote([
    sectionTable('🚨', '세심한 확인이 필요한 응답', '따돌림·속상함을 뜻하는 분류를 골랐거나, 이유 글에 위험한 낱말이 들어 있어요.', 'neg', ['쓴 학생', '대상', '어디에서', '걸린 분류·낱말', '내용'],
      w.sensitive.map(x => trCells([whoLink(x.s), x.o ? whoLink(x.o) : dash, esc(x.where), `<span class="font-bold text-stamp">${esc(x.hits.join(', '))}</span>`, `“${esc(x.text)}”`]))),
    sectionTable('🌧️', '학급 분위기를 낮게 매긴 학생', '1점 교실에 있으면 불편하거나 불안하다 · 2점 마음에 별로 안든다', '', ['학생', '점수', '이유'],
      w.climateLow.map(x => trCells([whoLink(x.id), `<span class="font-extrabold ${x.score === 1 ? 'text-stamp' : ''}">${x.score}점</span>`, x.reason ? esc(x.reason) : dash])), '명'),
    sectionTable('🌑', '즐거운 친구로 선택받지 못한 학생', '이 학생이 고른 친구는 연결의 실마리가 될 수 있어요.', '', ['학생', '응답 여부', '이 학생이 즐겁게 지낸다고 고른 친구'],
      w.isolated.map(x => trCells([whoLink(x.id), x.responded ? '제출' : '<span class="text-ink-muted">미응답</span>', x.chose.length ? x.chose.map(whoLink).join(', ') : dash])), '명'),
    sectionTable('⚡', '서로 불편함 · 마음이 엇갈림', '마음이 엇갈림: 앞 학생은 즐거운 친구로 골랐지만 뒤 학생은 불편하다고 답했어요.', '', ['구분', '학생 A', 'A가 쓴 이유', '학생 B', 'B가 쓴 이유'],
      w.conflicts.map(x => trCells([`<b>${esc(x.type)}</b>`, whoLink(x.a), x.aText ? `“${esc(x.aText)}”` : '-', whoLink(x.b), x.bText ? `“${esc(x.bText)}”` : '-']))),
    sectionTable('⏳', '아직 응답하지 않은 학생', '', '', ['학생'], w.missing.length ? [trCells([w.missing.map(whoLink).join(', ')])] : [], '명', w.missing.length)
  ], cur.responded ? '눈에 띄게 살펴볼 점이 없어요.' : '아직 응답이 없어요. 학생들이 제출하면 여기에 살펴볼 점이 정리돼요.');
}

/** 지난달과 달라진 점 (표 2개) */
function renderDiffTables() {
  const d = S.ctx.diff;
  // 좋아진 점 · 살펴볼 점
  const hl = d.highlights;
  const hlRows = [
    ['좋아짐', '친구 선택을 처음 받았어요', hl.escaped], ['좋아짐', '받은 친구 선택이 2명 이상 늘었어요', hl.grew],
    ['좋아짐', '학급 분위기를 2점 이상 높게 매겼어요', hl.climateUp],
    ['살펴볼 점', '지난달엔 선택받았지만 이번 달엔 아무도 고르지 않았어요', hl.newIsolated], ['살펴볼 점', '받은 친구 선택이 2명 이상 줄었어요', hl.shrank],
    ['살펴볼 점', '불편하다는 응답을 새로 받았어요', hl.newNegTarget], ['살펴볼 점', '학급 분위기를 2점 이상 낮게 매겼어요', hl.climateDown]
  ].filter(r => r[2].length).map(([g, k, ids]) => trCells([`<span class="rounded-full px-2 py-0.5 text-xs font-bold ${g === '좋아짐' ? 'bg-board-soft text-board' : 'bg-stamp-soft text-stamp'}">${g}</span>`, k, ids.map(whoLink).join(', ')]));
  // 관계 변화 목록
  const rel = [];
  const addRel = (label, list, tone) => list.forEach(e => rel.push(trCells([
    `<span class="font-bold ${tone === 'good' ? 'text-board' : tone === 'neg' ? 'text-stamp' : 'text-ink-muted'}">${label}</span>`,
    `${whoLink(e.s)} → ${whoLink(e.o)}`, (e.tags || []).length ? esc(e.tags.join(', ')) : dash, e.text ? esc(e.text) : dash])));
  addRel('새로 생긴 즐거운 관계', d.newPos, 'good');
  addRel('새로 생긴 불편한 관계', d.newNeg, 'neg');
  addRel('풀린 불편한 관계', d.resolvedNeg, 'good');
  addRel('사라진 즐거운 관계', d.lostPos, '');
  $('#map-alerts').innerHTML = tablesOrNote([
    sectionTable('🌱', '좋아진 점 · 살펴볼 점', `두 달 모두 응답한 ${d.comparable}명의 답을 기준으로 비교했어요.`, '', ['구분', '내용', '학생'], hlRows),
    sectionTable('🔗', '관계 변화 목록', '“고른 학생 → 대상”이에요. 사라진 관계의 분류·이유는 지난달에 쓴 내용이에요.', '', ['구분', '관계', '분류', '이유'], rel)
  ], `눈에 띄는 변화가 없어요. (두 달 모두 응답한 학생 ${d.comparable}명 기준)`);
}

/* ═══════════════════════════════════════════════════════════════
 *  10. 학생 정보 Drawer (지도 · 다른 탭 공용)
 * ═══════════════════════════════════════════════════════════════ */
/** 학생 상세정보 (Drawer 안) — 소주제별 표 */
function detailHtml(id) {
  const s = studentOf(id), cur = S.ctx.cur, st = cur.stats[id], E = cur.edges;
  const dx = S.ctx.diff ? S.ctx.diff.students.find(x => x.id === id) : null;
  const by = (pol, dir) => E.filter(e => e.pol === pol && (dir === 'out' ? e.s === id : e.o === id)).sort((a, b) => a.rank - b.rank);
  const relTable = (title, list, who, tone) => `
    <section class="border-t border-dashed border-line px-5 py-4">
      <h3 class="mb-2 text-sm font-extrabold ${tone === 'neg' ? 'text-stamp' : ''}">${title} <span class="font-semibold text-ink-muted">${list.length}명</span></h3>
      ${list.length ? `<table class="w-full text-[13px]"><thead><tr><th class="th w-[4.5rem] px-2">친구</th><th class="th px-2">분류</th><th class="th px-2">이유</th></tr></thead>
        <tbody>${list.map(e => `<tr><td class="td px-2">${whoLink(e[who])}</td><td class="td px-2 text-ink-muted">${esc((e.tags || []).join(', ') || '-')}</td><td class="td px-2">${esc(e.text || '')}</td></tr>`).join('')}</tbody></table>`
        : '<p class="text-sm text-ink-muted">없어요.</p>'}
    </section>`;
  const inferred = S.ctx.facts.filter(f => f.s === id && ['엇갈림', '공통 친구', '한방향 선택', '지난달과 비교'].includes(f.rule));
  const climate = Number(st.climate), prevClimate = dx ? Number(dx.prevClimate) : 0;
  const dd = (a, goodUp) => a ? `<span class="ml-1 text-[11px] font-bold ${(a > 0) === goodUp ? 'text-board' : 'text-stamp'}">(${a > 0 ? '+' : ''}${a})</span>` : '';
  return `
    <div class="sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-line bg-white/95 px-5 pb-3 pt-5 backdrop-blur">
      <div class="min-w-0">
        <p class="text-xs font-semibold text-ink-muted">학번 ${esc(id)} · ${monthLabel(S.month)}</p>
        <h2 class="mt-0.5 truncate text-2xl font-extrabold">${esc(s ? s.name : id)}</h2>
      </div>
      <button type="button" data-drawer-close class="btn btn-ghost btn-sm shrink-0" aria-label="상세정보 닫기 (ESC)">닫기 <span class="text-[10px] font-semibold text-ink-muted">ESC</span></button>
    </div>
    <div class="px-5 pb-4 pt-4">
      <table class="w-full text-[13px]">
        <thead><tr><th class="th px-2 text-center">받은 선택</th><th class="th px-2 text-center">서로 친구</th><th class="th px-2 text-center">불편 응답</th><th class="th px-2 text-center">고른 친구</th></tr></thead>
        <tbody><tr class="text-center font-extrabold tabular-nums">
          <td class="td px-2">${st.recvPos}${dd(dx ? dx.curPos - dx.prevPos : 0, true)}</td><td class="td px-2">${st.mutual}</td>
          <td class="td px-2 ${st.recvNeg ? 'text-stamp' : ''}">${st.recvNeg}${dd(dx ? dx.curNeg - dx.prevNeg : 0, false)}</td>
          <td class="td px-2">${st.givenPos}</td></tr></tbody>
      </table>
      <table class="mt-3 w-full text-[13px]"><tbody>
        <tr><th class="th w-24 px-2">응답</th><td class="td px-2">${st.responded ? `제출 <span class="text-xs text-ink-muted">${esc(scheduleLabel(st.submittedAt))}</span>${st.editAllowed ? ' <span class="text-xs font-semibold text-amber">· 수정 권한 있음</span>' : ''}` : '<span class="text-ink-muted">미응답</span>'}</td></tr>
        <tr><th class="th px-2">우리 반 분위기</th><td class="td px-2 ${climate && climate <= 2 ? 'font-bold text-stamp' : ''}">${climate ? esc(climateLabel(climate)) : '-'}${prevClimate ? ` <span class="text-xs font-normal text-ink-muted">(지난달 ${prevClimate}점)</span>` : ''}</td></tr>
        <tr><th class="th px-2">분위기 이유</th><td class="td px-2">${st.climateReason ? esc(st.climateReason) : '-'}</td></tr>
      </tbody></table>
    </div>
    ${relTable('이 학생이 즐겁게 지내는 친구', by(POL.POS, 'out'), 'o')}
    ${relTable('이 학생을 즐거운 친구로 고른 친구', by(POL.POS, 'in'), 's')}
    ${relTable('이 학생이 불편하다고 한 친구', by(POL.NEG, 'out'), 'o', 'neg')}
    ${relTable('이 학생을 불편하다고 한 친구', by(POL.NEG, 'in'), 's', 'neg')}
    <section class="border-t border-dashed border-line px-5 py-4">
      <h3 class="mb-2 text-sm font-extrabold">규칙으로 찾은 관계 <span class="font-semibold text-ink-muted">${inferred.length}건</span></h3>
      ${inferred.length ? `<table class="w-full text-[13px]"><thead><tr><th class="th px-2">관계</th><th class="th px-2">대상</th><th class="th px-2">규칙</th></tr></thead><tbody>
        ${inferred.map(f => `<tr><td class="td px-2 font-semibold ${f.pol === '부정' ? 'text-stamp' : ''}">${esc(f.p)}</td><td class="td px-2">${f.oIsStudent ? whoLink(f.o) : `<b>${esc(f.o)}</b>`}${f.via ? `<div class="text-xs text-ink-muted">공통 친구 ${f.via.map(v => esc(studentName(v))).join(', ')}</div>` : ''}</td><td class="td px-2 text-xs text-ink-muted">${esc(f.rule)}</td></tr>`).join('')}
      </tbody></table>` : '<p class="text-sm text-ink-muted">추론된 관계가 없어요.</p>'}
    </section>
    ${S.tab !== 'map' ? '<section class="border-t border-dashed border-line px-5 py-4"><button type="button" data-go-map class="btn btn-ghost w-full py-3">지도에서 보기</button></section>' : ''}`;
}

function openDrawer(id) {
  if (!S.ctx || !S.ctx.cur || !S.ctx.cur.stats[id]) return;
  const d = $('#drawer'), wasOpen = !!drawerId, top = d.scrollTop, same = drawerId === id;
  drawerId = id;
  d.innerHTML = detailHtml(id);
  d.scrollTop = same ? top : 0;   // 실시간으로 다시 그릴 때는 읽던 자리를 지킵니다
  d.classList.remove('hidden');
  void d.offsetWidth;   // 숨김을 푼 자리를 먼저 계산해야 미끄러져 들어오는 효과가 보여요
  d.classList.add('open');
  if (!wasOpen) setTimeout(() => { const c = d.querySelector('[data-drawer-close]'); if (c) c.focus(); }, 80);
}
function closeDrawer() {
  if (!drawerId) return;
  drawerId = null;
  const d = $('#drawer');
  d.classList.remove('open');
  setTimeout(() => { if (!drawerId) { d.classList.add('hidden'); d.innerHTML = ''; } }, 260);
  if (S.focusId) { S.focusId = null; if (S.ctx && S.ctx.cur) { refreshGraph(); renderBelowMap(); } if (S.net) S.net.unselectAll(); }
}
$('#drawer').addEventListener('click', e => {
  if (e.target.closest('[data-drawer-close]')) return closeDrawer();
  if (e.target.closest('[data-go-map]') && drawerId) focusStudent(drawerId, { center: true });
});
// ESC: 모달이 열려 있으면 모달만 닫히고, 아니면 Drawer를 닫습니다.
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawerId && !$('#modal-root').children.length) closeDrawer(); });

/* ═══════════════════════════════════════════════════════════════
 *  11. 학생 응답 탭: 학생 한 명 = 한 줄 (검색 · 수정 권한 · 응답 엑셀)
 * ═══════════════════════════════════════════════════════════════ */
/** 수정 권한 주기·거두기 — 친구들의 정보를 지키기 위해 학생 화면은 지난 답을 불러오지 않고 처음부터 다시 받습니다 */
async function toggleEditPermission(id, allow) {
  const name = studentName(id), month = S.month;
  const ok = await mConfirm(allow ? `${name} 학생에게 수정 권한을 줄까요?` : `${name} 학생의 수정 권한을 거둘까요?`,
    allow ? `${name} 학생이 ${monthLabel(month)} 설문을 다시 낼 수 있어요. 친구들의 정보를 지키기 위해 지난번 답은 불러오지 않고 처음부터 다시 적어요. 다시 제출하면 지난 답을 대신하고 권한은 자동으로 끝나요.`
          : '학생이 더 이상 다시 제출할 수 없어요.', { ok: allow ? '권한 주기' : '권한 거두기' });
  if (!ok) return;
  try {
    await updateDoc(doc(db, COLLECTION, S.roomCode, 'receipts', `${month}_${id}`), { editAllowed: allow });
    toast(allow ? `${name} 학생에게 수정 권한을 줬어요` : '수정 권한을 거뒀어요');
  } catch (err) {
    console.error('수정 권한 변경 실패:', err);
    mAlert('바꾸지 못했어요', failText(err, '수정 권한을 바꾸지 못했어요.'));
  }
}

function renderResponses() {
  const el = $('#tab-responses'), qs = SURVEY_CONFIG.questions;
  if (!$('#rs-body')) {   // 틀은 한 번만 그리고, 실시간 갱신 때는 표 내용만 바꿉니다
    el.innerHTML = `
      <p class="text-xs leading-relaxed text-ink-muted">이름을 누르면 학생 정보가 열려요. 이미 제출한 학생은 답을 다시 불러올 수 없어서, 고칠 게 있으면 이름 밑의 [수정 권한 주기]를 눌러 주세요. 다시 제출하면 권한은 자동으로 끝나요. 표가 넓으면 좌우로 밀어 보세요.</p>
      <div class="panel mt-3 overflow-x-auto">
        <table class="w-full min-w-[880px] text-sm">
          <thead><tr>
            <th class="th w-32">학생</th>
            <th class="th w-56">1. 우리 반 분위기</th>
            ${qs.map((q, i) => `<th class="th">${i + 2}. ${POL_LABEL[q.pol]}</th>`).join('')}
          </tr></thead>
          <tbody id="rs-body"></tbody>
        </table>
      </div>`;
  }
  fillResponses();
}

function fillResponses() {
  const cur = S.ctx.cur, qs = SURVEY_CONFIG.questions;
  const cell = (id, pol) => {
    const list = cur.edges.filter(e => e.s === id && e.pol === pol).sort((a, b) => a.rank - b.rank);
    return list.length ? list.map(e => `<div class="mb-1.5 last:mb-0"><span class="font-bold">${esc(studentName(e.o))}</span>
      <span class="text-xs text-board">[${esc((e.tags || []).join(', '))}]</span> <span class="text-ink-muted">${esc(e.text)}</span></div>`).join('') : dash;
  };
  const rows = activeStudents();
  $('#rs-body').innerHTML = rows.length ? rows.map(s => {
    const st = cur.stats[s.id], c = Number(st.climate);
    // 이름 밑: 제출한 학생은 [수정 권한] 버튼, 아직 안 낸 학생은 '미제출'
    const nameCell = `<td class="td"><button type="button" data-student="${esc(s.id)}" class="font-bold underline underline-offset-4">${esc(s.name)}</button>
      <div class="text-xs tabular-nums text-ink-muted">${esc(s.id)}</div>
      <div class="mt-1.5">${st.responded
        ? `<button type="button" data-perm="${esc(s.id)}" data-allow="${st.editAllowed ? 'off' : 'on'}" class="btn btn-sm ${st.editAllowed ? 'btn-yellow' : 'btn-ghost'}">${st.editAllowed ? '수정 권한 거두기' : '수정 권한 주기'}</button>`
          + (st.editAllowed ? '<div class="mt-1 text-[11px] font-semibold text-amber">수정 가능 · 다시 내면 끝나요</div>' : '')
        : '<span class="rounded-full bg-page px-2 py-0.5 text-xs font-bold text-ink-muted ring-1 ring-line">미제출</span>'}</div></td>`;
    if (!st.responded) return `<tr class="bg-page/40">${nameCell}<td class="td text-ink-muted" colspan="${qs.length + 1}">아직 응답하지 않았어요.</td></tr>`;
    return `<tr>${nameCell}
      <td class="td"><span class="inline-flex rounded-full px-2 py-0.5 text-xs font-extrabold ${c <= 2 ? 'bg-stamp-soft text-stamp' : 'bg-board-soft text-board'}">${esc(climateLabel(c))}</span>
        ${st.climateReason ? `<p class="mt-1 text-ink-muted">${esc(st.climateReason)}</p>` : ''}</td>
      ${qs.map(qq => `<td class="td">${cell(s.id, qq.pol)}</td>`).join('')}
    </tr>`;
  }).join('') : `<tr><td class="td py-10 text-center text-ink-muted" colspan="${qs.length + 2}">아직 학생이 없어요. 관리 탭에서 학생 명단을 등록해 주세요.</td></tr>`;
}

/* ── 응답 엑셀 (SheetJS): 학생별 응답 · 관계 목록 · 학생별 요약 ── */
function downloadResponsesXlsx() {
  if (typeof XLSX === 'undefined') return mAlert('엑셀 도구를 불러오지 못했어요', '인터넷 연결을 확인하고 새로고침한 뒤 다시 시도해 주세요.');
  const cur = S.ctx && S.ctx.cur, qs = SURVEY_CONFIG.questions;
  if (!cur) return;
  const students = activeStudents();
  const cell = (id, pol) => cur.edges.filter(e => e.s === id && e.pol === pol).sort((a, b) => a.rank - b.rank)
    .map(e => `${studentName(e.o)} [${(e.tags || []).join(', ')}] ${e.text}`).join('\n');
  const sheet1 = [['학번', '이름', '제출', '1. 분위기 점수', '분위기 이유'].concat(qs.map((q, i) => `${i + 2}. ${POL_LABEL[q.pol]}`))];
  students.forEach(s => {
    const st = cur.stats[s.id];
    sheet1.push([s.id, s.name, st.responded ? 'O' : '', st.climate || '', st.climateReason || ''].concat(qs.map(q => cell(s.id, q.pol))));
  });
  const sheet2 = [['응답 학번', '응답 이름', '구분', '순서', '대상 학번', '대상 이름', '분류', '이유']];
  cur.edges.slice().sort((a, b) => compareStudentNo(a.s, b.s) || a.pol.localeCompare(b.pol) || a.rank - b.rank)
    .forEach(e => sheet2.push([e.s, studentName(e.s), POL_LABEL[e.pol], e.rank, e.o, studentName(e.o), (e.tags || []).join(', '), e.text]));
  const sheet3 = [['학번', '이름', '받은 즐거운 선택', '서로 친구', '받은 불편 응답', '분위기 점수']];
  students.forEach(s => { const st = cur.stats[s.id]; sheet3.push([s.id, s.name, st.recvPos, st.mutual, st.recvNeg, st.climate || '']); });
  const wb = XLSX.utils.book_new();
  const add = (rows, name, widths) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(sheet1, '학생별 응답', [10, 10, 6, 12, 40, 50, 50]);
  add(sheet2, '관계 목록', [10, 10, 22, 6, 10, 10, 30, 50]);
  add(sheet3, '학생별 요약', [10, 10, 14, 10, 14, 10]);
  const roomName = String((S.room && S.room.memo) || S.roomCode).replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, `관계설문_${roomName}_${S.month}.xlsx`);
  toast('엑셀 파일을 내려받았어요');
}

/* ═══════════════════════════════════════════════════════════════

function suggestMonth() {
  const thisMonth = currentMonthKey();
  const ms = S.model.months.map(x => x.month);
  if (!ms.includes(thisMonth)) return thisMonth;
  const last = ms[ms.length - 1], y = Number(last.slice(0, 4)), mo = Number(last.slice(5, 7));
  return mo === 12 ? `${y + 1}-01` : `${y}-${pad2(mo + 1)}`;
}

let pinLoading = '';
/** 명단 학생의 PIN 상태 — student_auth 문서 한 개 읽기는 허용돼요. 관리 탭을 열 때 읽고, 그 뒤에는 새 학생만 더 읽습니다. */
async function loadPinStates() {
  const code = S.roomCode, school = String((S.room && S.room.creatorSchool) || '').trim();
  const missing = S.model.students.map(s => s.id).filter(id => !(id in S.pinStates));
  if (!code || !school || !missing.length) return;
  const token = `${code}|${missing.join(',')}`;
  if (pinLoading === token) return;
  pinLoading = token;
  const entries = await Promise.all(missing.map(async id => {
    try {
      const snap = await getDoc(doc(db, 'student_auth', makeStudentKey(school, id)));
      return [id, !snap.exists() ? 'none' : snap.data().pinSetAt ? 'set' : 'reset'];
    } catch (err) {
      console.warn('PIN 상태 확인 실패:', id, err);
      return [id, 'unknown'];
    }
  }));
  if (pinLoading === token) pinLoading = '';
  if (S.roomCode !== code) return;
  entries.forEach(([id, state]) => { S.pinStates[id] = state; });
  if (S.tab === 'manage' && S.model) renderManage();
}

$('#tab-manage').addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || !S.roomCode || !S.model) return;
  const action = b.dataset.action;
  if (action === 'close-month') return closeMonthNow(b.dataset.month);
  if (action === 'open-month') return openMonthFlow($('#mg-month').value);
  if (action === 'add') return addOneStudent();
  if (action === 'bulk') return addBulkStudents();
  const student = studentOf(b.dataset.id);
  if (!student) return;
  if (action === 'edit') return editStudent(student);
  if (action === 'pin') return resetPinFor(student);
  if (action === 'unhide') return changeRoster(roster => {
    if (!roster[student.id]) throw new Error('명단에서 학생을 찾을 수 없어요.');
    roster[student.id] = Object.assign({}, roster[student.id], { active: true });
  }, '명단에 다시 보이게 했어요');
});

/** 반 삭제: 설문조사 Form의 [설문 삭제]와 같은 흐름 (확인 → 삭제 → 선택 해제 → 완료 안내) */
async function deleteRoomFlow() {
  const code = S.roomCode;
  if (!code) return;
  const ok = await customConfirm('반 삭제', `[<strong>${esc(code)}</strong>] 반과 모든 응답을 삭제할까요? 이 작업은 되돌릴 수 없습니다.`);
  if (!ok) return;
  stopRoomSync();   // 지우는 동안 반쯤 지워진 데이터를 그리지 않도록
  loading(true, '반을 삭제하는 중');
  try {
    await removeRoom(code);
    loading(false);
    selectRoom('');
    try { await loadTeacherRooms(); } catch (err) { console.error('반 목록 조회 실패:', err); }
    await customAlert('삭제 완료', '반과 응답을 삭제했습니다.');
  } catch (err) {
    loading(false);
    console.error('반 삭제 실패:', err);
    if (S.roomCode === code) startRoomSync(code, true);
    await customAlert('반 삭제 실패', (err && err.message) || '권한과 네트워크를 확인해주세요.');
  }
}

async function closeMonthNow(month) {
  if (!(await mConfirm(`${shortMonth(month)} 설문을 마감할까요?`, '마감하면 학생들이 더 이상 응답할 수 없어요. 나중에 다시 열 수 있어요.', { ok: '마감하기' }))) return;
  await updateRoomFields([monthPath(month, 'status'), 'closed', monthPath(month, 'closeAt'), null], '설문을 마감했어요', '마감하지 못했어요');
}

/** 이 달 설문 열기: 새 달이면 만들고, 있던 달이면 다시 엽니다. 진행 중이던 다른 달은 마감합니다. */
async function openMonthFlow(month) {
  if (!MONTH_PATTERN.test(month || '')) return mAlert('달을 골라 주세요', '설문을 열 달을 먼저 선택해 주세요.');
  const existing = S.model.months.find(x => x.month === month);
  if (existing && existing.status === 'open') { S.month = month; refreshDashboard(); return toast(`${monthLabel(month)} 설문은 이미 진행 중이에요`); }
  const open = S.model.months.filter(x => x.status === 'open').slice(-1)[0];
  if (open && !(await mConfirm(`${monthLabel(month)} 설문을 열까요?`, `진행 중인 ${monthLabel(open.month)} 설문은 자동으로 마감돼요.`, { ok: '열기' }))) return;
  if (!activeStudents().length && !(await mConfirm('명단이 비어 있어요', '명단에 있는 학생만 응답할 수 있어요. 그래도 설문을 열까요?', { ok: '열기' }))) return;
  if (!(await updateRoomFields(openMonthChanges(month, !existing), `${monthLabel(month)} 설문을 열었어요`, '설문을 열지 못했어요'))) return;
  S.pendingMonth = month;   // 새 달이 실시간으로 도착하면 그 달을 보여 줍니다
  refreshDashboard();
}

/* ── 학생 명단 ── */
const defaultNumber = id => Number(String(id).slice(-2)) || 0;   // 학번 끝 두 자리 = 번호 (명단 정렬용)
/** 응답 기록이 있는 학생: 직접 냈거나, 다른 학생이 고른 적이 있음 */
const hasRecords = id => S.model.submits.some(x => x.s === id) || S.model.answers.some(a => a.o === id);
/** 우리가 낸 안내(Error)는 그대로, Firestore 오류는 권한 안내와 함께 */
const rosterError = err => (err && err.code ? failText(err, '명단을 바꾸지 못했어요.') : String((err && err.message) || err));

function validateRosterEntry({ id, name }) {
  if (!STUDENT_ID_PATTERN.test(id || '')) return `학번 ${id || '(빈칸)'}: 1~3으로 시작하는 숫자 4~5자리로 적어 주세요.`;
  if (!name || name.length > 20) return `학번 ${id}: 이름은 1~20자로 적어 주세요.`;
  return '';
}

/** 최신 명단을 트랜잭션으로 읽어 바꿉니다 (mutator가 Error를 던지면 저장하지 않음) */
function mutateRoster(mutator) {
  const ref = roomRef();
  return runTransaction(db, async tx => {
    const snap = await tx.get(ref);
    if (!snap.exists()) throw new Error('반 정보를 찾을 수 없어요.');
    const roster = Object.assign({}, snap.data().roster || {});
    const result = mutator(roster);
    tx.update(ref, { roster, updatedAt: serverTimestamp() });
    return result;
  });
}

async function changeRoster(mutator, okMessage) {
  loading(true, '명단을 저장하는 중');
  let failure = null;
  try { await mutateRoster(mutator); } catch (err) { failure = err; }
  loading(false);
  if (failure) {
    console.error('명단 변경 실패:', failure);
    await mAlert('명단을 바꾸지 못했어요', rosterError(failure));
    return false;
  }
  if (okMessage) toast(okMessage);
  return true;
}

async function addOneStudent() {
  const r = await mForm({
    title: '학생 추가', message: 'PIN은 학생이 처음 들어올 때 정해요.',
    fields: [
      { name: 'studentNo', label: '학번 (1~3으로 시작하는 숫자 4~5자리)', inputmode: 'numeric', placeholder: '예: 1630', maxlength: 5 },
      { name: 'name', label: '이름', placeholder: '예: 김민준', maxlength: 20 }
    ],
    submit: '추가하기',
    onMount: w => digitsOnly(w.querySelector('[name="studentNo"]')),
    onSubmit: async v => {
      if (!STUDENT_ID_PATTERN.test(v.studentNo)) return { error: '학번은 1~3으로 시작하는 숫자 4~5자리로 입력해 주세요. (예: 1630)' };
      if (!v.name) return { error: '이름을 입력해 주세요.' };
      try {
        await mutateRoster(roster => {
          if (roster[v.studentNo]) throw new Error(`학번 ${v.studentNo}은(는) 이미 명단에 있어요.`);
          roster[v.studentNo] = { no: defaultNumber(v.studentNo), name: v.name, active: true };
        });
        return { ok: true };
      } catch (err) { return { error: rosterError(err) }; }
    }
  });
  if (r && r.ok) toast('학생을 추가했어요. PIN은 처음 들어올 때 정해요.');
}

/** 붙여넣은 줄 → 명단 항목 (「학번 이름」, 「이름 학번」, 「번호 학번 이름」 · 탭·쉼표·띄어쓰기 구분) */
function parseRosterLines(text) {
  const entries = [], problems = [];
  String(text || '').split(/\r?\n/).forEach((line, index) => {
    const tokens = line.trim().split(/[\s,;]+/).filter(Boolean);
    if (!tokens.length) return;
    let id = '', nameTokens = [];
    if (tokens.length >= 3 && /^\d{1,2}$/.test(tokens[0]) && STUDENT_ID_PATTERN.test(tokens[1])) { id = tokens[1]; nameTokens = tokens.slice(2); }
    else if (tokens.length >= 2 && STUDENT_ID_PATTERN.test(tokens[0])) { id = tokens[0]; nameTokens = tokens.slice(1); }
    else if (tokens.length >= 2 && STUDENT_ID_PATTERN.test(tokens[tokens.length - 1])) { id = tokens[tokens.length - 1]; nameTokens = tokens.slice(0, -1); }
    else { problems.push(`${index + 1}번째 줄: ${line.trim().slice(0, 30)}`); return; }
    const entry = { id, name: nameTokens.join(' ').trim() };
    const problem = validateRosterEntry(entry);
    if (problem) problems.push(`${index + 1}번째 줄: ${problem}`); else entries.push(entry);
  });
  return { entries, problems };
}

async function addBulkStudents() {
  const r = await mForm({
    title: '명단 붙여넣기', wide: true, message: '한 줄에 한 명씩 "학번 이름"으로 적어 주세요. 엑셀에서 두 칸을 복사해 붙여넣어도 돼요.',
    fields: [{ name: 'list', label: '학생 명단', type: 'textarea', rows: 8, placeholder: '1630 김민준\n1631 이서연\n1632 박지호' }],
    submit: '모두 추가',
    onSubmit: async v => {
      const { entries, problems } = parseRosterLines(v.list);
      if (problems.length) return { error: '"학번(1~3으로 시작하는 숫자 4~5자리) 이름" 형식이 아닌 줄이 있어요.\n' + problems.slice(0, 3).join('\n') };
      if (!entries.length) return { error: '추가할 학생을 적어 주세요.' };
      try {
        return await mutateRoster(roster => {
          let added = 0;
          const skipped = [];
          entries.forEach(x => {
            if (roster[x.id]) { skipped.push(`${x.id} ${x.name} — 이미 명단에 있는 학번이에요`); return; }
            roster[x.id] = { no: defaultNumber(x.id), name: x.name, active: true };
            added++;
          });
          return { ok: true, added, skipped };
        });
      } catch (err) { return { error: rosterError(err) }; }
    }
  });
  if (!r || !r.ok) return;
  toast(`${r.added}명을 추가했어요. PIN은 처음 들어올 때 정해요.`);
  if (r.skipped.length) await mAlert('추가하지 못한 학생이 있어요', r.skipped.join('\n'));
}

/** 수정: 학번과 이름. 응답이 학번으로 이어져 있어서, 학번은 아직 기록이 없는 학생만 바꿀 수 있어요. (전학 등은 [명단에서 빼기]) */
async function editStudent(s) {
  const r = await mForm({
    title: `${s.name} 정보 수정`,
    fields: [
      { name: 'studentNo', label: '학번 (1~3으로 시작하는 숫자 4~5자리)', inputmode: 'numeric', value: s.id, maxlength: 5 },
      { name: 'name', label: '이름', value: s.name, maxlength: 20 }
    ],
    submit: '저장',
    extra: s.active ? '<p class="mb-1 mt-3 text-right"><button type="button" data-remove class="text-xs font-bold text-stamp underline underline-offset-2">명단에서 빼기 (전학 등)</button></p>' : '',
    onMount: (wrap, close) => {
      digitsOnly(wrap.querySelector('[name="studentNo"]'));
      const rm = wrap.querySelector('[data-remove]');
      if (rm) rm.addEventListener('click', async () => {
        if (!(await mConfirm(`${s.name} 학생을 명단에서 뺄까요?`, '응답 기록이 있으면 지난 기록은 그대로 두고 명단·설문·지도에서만 숨겨요. 기록이 없으면 삭제해요.', { ok: '명단에서 빼기', danger: true }))) return;
        try {
          const mode = await mutateRoster(roster => {
            if (!roster[s.id]) throw new Error('명단에서 학생을 찾을 수 없어요.');
            if (hasRecords(s.id)) { roster[s.id] = Object.assign({}, roster[s.id], { active: false }); return 'hidden'; }
            delete roster[s.id];
            return 'deleted';
          });
          close('removed');
          toast(mode === 'deleted' ? '명단에서 삭제했어요' : '명단에서 숨겼어요. 지난 기록은 그대로 남아요.');
        } catch (err) { mAlert('명단에서 빼지 못했어요', rosterError(err)); }
      });
    },
    onSubmit: async v => {
      if (!STUDENT_ID_PATTERN.test(v.studentNo)) return { error: '학번은 1~3으로 시작하는 숫자 4~5자리로 입력해 주세요. (예: 1630)' };
      if (!v.name) return { error: '이름을 입력해 주세요.' };
      const moved = v.studentNo !== s.id;
      if (moved && hasRecords(s.id)) return { error: '응답 기록이 있는 학생은 학번을 바꿀 수 없어요. 학번이 틀렸다면 [명단에서 빼기]를 누른 뒤 바른 학번으로 새로 추가해 주세요.' };
      try {
        await mutateRoster(roster => {
          if (!roster[s.id]) throw new Error('명단에서 학생을 찾을 수 없어요.');
          if (moved && roster[v.studentNo]) throw new Error(`학번 ${v.studentNo}은(는) 이미 명단에 있어요.`);
          const entry = Object.assign({}, roster[s.id], { name: v.name });
          if (moved) { delete roster[s.id]; entry.no = defaultNumber(v.studentNo); }
          roster[v.studentNo] = entry;
        });
        return { ok: true };
      } catch (err) { return { error: rosterError(err) }; }
    }
  });
  if (r && r.ok) toast('학생 정보를 고쳤어요');
}

/** PIN 초기화 — 이 반에 들어와 담당 선생님으로 등록된 학생만 (보안 규칙의 '내 학생' 판정과 같음) */
async function resetPinFor(student) {
  const key = makeStudentKey(String(S.room.creatorSchool || '').trim(), student.id);
  try {
    const snap = await getDoc(doc(db, 'student_auth', key));
    if (!snap.exists()) return mAlert('아직 들어온 적 없는 학생이에요', `${student.name} 학생은 아직 한 번도 들어오지 않았어요. 처음 들어올 때 PIN을 정해요.`);
    const teachers = Array.isArray(snap.data().teachers) ? snap.data().teachers : [];
    if (!S.teacher.isAdmin && !teachers.includes(S.teacher.name)) return mAlert('초기화할 수 없어요', '이 반에 들어온 적이 있는 학생만 PIN을 초기화할 수 있어요.');
    if (!(await mConfirm(`${student.name} 학생의 PIN을 초기화할까요?`, `${student.name}(${student.id}) 학생은 다음에 들어올 때 새 4자리 PIN을 정해요.`, { ok: '초기화', danger: true }))) return;
    await resetStudentPin(key);
    S.pinStates[student.id] = 'reset';
    if (S.tab === 'manage' && S.model) renderManage();
    toast(`${student.name} 학생의 PIN을 초기화했어요`);
  } catch (err) {
    console.error('PIN 초기화 실패:', err);
    mAlert('초기화하지 못했어요', isPermissionError(err) ? 'PIN을 초기화할 권한이 없어요. 내 학교 학생인지, 교사 정보의 학교명이 맞는지 확인해 주세요.' : String((err && err.message) || err));
  }
}

/* ═══════════════════════════════════════════════════════════════
 *  13. 로그인 상태 (승인된 교사 → 교사 화면, 그 밖에는 첫 화면)
 *      로그인 상태가 빠르게 바뀌면 앞선 처리가 늦게 끝날 수 있어, 가장 최근 변경만 화면에 반영합니다.
 * ═══════════════════════════════════════════════════════════════ */
onAuthStateChanged(auth, async user => {
  const sequence = ++authSequence;
  const wasTeacher = !!S.teacher;
  S.user = user;
  S.teacher = null;
  if (!user) {
    if (wasTeacher) await leaveTeacherView();
    showStudentEntry();
    return;
  }
  const isAdmin = String(user.email || '').trim().toLowerCase() === ADMIN_EMAIL;
  let record = {};
  try {
    const snap = await getDoc(doc(db, 'teachers', user.uid));
    if (snap.exists()) record = snap.data() || {};
  } catch (err) {
    console.warn('교사 정보 조회 실패:', err);
  }
  if (sequence !== authSequence) return;
  if (!isAdmin && record.status !== 'approved') {
    if (wasTeacher) await leaveTeacherView();
    showStudentEntry();
    return;
  }
  S.teacher = {
    name: record.name || (isAdmin ? '관리자' : '교사'),
    // 관리자도 실제 학교명이 있어야 반을 만듭니다 ([새 반 만들기]에서 막음)
    school: String(record.school || ''),
    isAdmin
  };
  showStudentEntry();   // 로그아웃하면 바로 반 코드 입력 화면이 보이도록
  if (S.sv && !S.sv.done) return;   // 이 기기에서 학생이 설문을 쓰는 중이면 화면을 바꾸지 않습니다
  await enterTeacher();
});
</script>
