<!DOCTYPE html>
<!--
  우리반 관계지도 (Firestore 버전)
  앱스스크립트 index.html의 화면(칠판 디자인 · vis-network 관계지도 · 학생 상세 Drawer · 제출 도장)을 따르고,
  로그인과 저장만 이 사이트 방식으로 바꿨습니다.
   - 학생: 반 코드 → 학번 · 4자리 PIN (room-auth.js) → 한 장짜리 관계 설문
   - 교사: 구글 로그인(승인된 교사) → 관계지도 · 학생 응답 · 관리(반 · 설문 달 · 명단)
  데이터: relation_maps/{반 코드} — 보안 규칙은 assets/template/firebase/가이드북.md 13장을 콘솔에 추가해야 동작합니다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24493d">
  <title>우리반 관계지도</title>
  <link rel="icon" href="../../assets/images/mainPage/동동이.jpg">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script>
    // ── 디자인 토큰: 교실의 칠판 · 분필 · 선생님 도장에서 가져온 색 ──
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', '"Apple SD Gothic Neo"', '"Malgun Gothic"', 'sans-serif'] },
          colors: {
            board: { DEFAULT: '#24493D', deep: '#1B3A30', soft: '#E1EBE6' },  // 칠판
            chalk: { DEFAULT: '#F3F0E4', yellow: '#F0CF5C' },                // 분필(흰색 · 노랑)
            stamp: { DEFAULT: '#CF3A2E', soft: '#FBEAE7' },                  // 도장 인주
            ink:   { DEFAULT: '#1D2B26', muted: '#5F706A' },                 // 글자
            amber: { soft: '#FDF3E1', DEFAULT: '#B4690E' },                   // 도움이 필요해 보이는 친구
            page: '#E9EFEC',                                                  // 바탕
            line: '#D5DEDA'                                                   // 테두리
          }
        }
      }
    };
  </script>
  <!-- 관계망 그래프 · 엑셀 내보내기 · 학생 인증 창(room-auth.js가 쓰는 Bootstrap 모달) -->
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style type="text/tailwindcss">
    @layer components {
      .field { @apply mt-1.5 block w-full rounded-lg border border-line bg-white px-3.5 py-3 text-base text-ink transition placeholder:text-ink-muted/60 focus:border-board focus:outline-none focus:ring-4 focus:ring-chalk-yellow/60 disabled:bg-page; }
      .field-label { @apply block text-sm font-semibold text-ink; }
      .btn { @apply inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-lg px-4 py-2.5 text-sm font-bold transition active:translate-y-px disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-chalk-yellow/70; }
      .btn-primary { @apply bg-board text-chalk hover:bg-board-deep; }
      .btn-danger { @apply bg-stamp text-white hover:brightness-95; }
      .btn-ghost { @apply bg-white text-ink ring-1 ring-inset ring-line hover:bg-page; }
      .btn-yellow { @apply bg-chalk-yellow text-ink hover:brightness-95; }
      .btn-chalk { @apply bg-white/10 text-chalk ring-1 ring-inset ring-chalk/30 hover:bg-white/20; }
      .btn-sm { @apply rounded-md px-3 py-1.5 text-xs; }
      .panel { @apply rounded-2xl border border-line bg-white; }
      .tab-item { @apply rounded-md py-2.5 text-sm font-bold text-ink-muted transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-chalk-yellow/70 disabled:opacity-40; }
      .tab-item.is-active { @apply bg-board text-chalk shadow-sm; }
      .seg { @apply inline-grid gap-1 rounded-lg bg-white p-1 ring-1 ring-line; }
      .seg .tab-item { @apply px-3 py-1.5; }
      .chip { @apply inline-flex shrink-0 items-center gap-1.5 rounded-full bg-white px-3 py-1.5 text-sm font-semibold text-ink-muted ring-1 ring-inset ring-line transition; }
      .chip-on { @apply bg-board text-chalk ring-board; }
      .name-chip { @apply inline-flex items-center rounded-full bg-page px-3 py-1 text-sm font-semibold text-ink ring-1 ring-inset ring-line hover:ring-board; }
      .pred { @apply rounded-full bg-board-soft px-2.5 py-0.5 text-xs font-bold text-board; }
      .pred-neg { @apply bg-stamp-soft text-stamp; }
      .pred-warn { @apply bg-amber-soft text-amber; }
      .src-badge { @apply whitespace-nowrap rounded-full px-2 py-0.5 text-[11px] font-semibold text-ink-muted ring-1 ring-inset ring-line; }
      .h-section { @apply mb-3 mt-10 text-lg font-extrabold; }
      .stat { @apply rounded-xl border border-line bg-white px-4 py-3; }
      .th { @apply whitespace-nowrap border-b border-line bg-page/60 px-3 py-2.5 text-left text-xs font-bold text-ink-muted; }
      .td { @apply border-b border-line/70 px-3 py-3 align-top; }
    }
  </style>

  <style>
    /* ── 칠판 띠 (헤더) ── */
    .board {
      background-color: #24493D;
      background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.6px), radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.6px);
      background-size: 9px 9px, 17px 17px; background-position: 0 0, 4px 6px;
      border-bottom: 6px solid #B8C3BE;   /* 분필 받침대 */
    }
    .board-title { font-weight: 800; color: #F3F0E4; letter-spacing: -.02em; }
    /* ── 관계지도 칠판 ── */
    .board-canvas {
      background-color: #24493D;
      background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.6px), radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.6px);
      background-size: 9px 9px, 17px 17px; background-position: 0 0, 4px 6px;
      box-shadow: inset 0 0 0 6px #6B5A45, inset 0 0 0 8px #4D4032;   /* 나무 칠판 틀 */
    }
    .board-tray { background: #B8C3BE; }
    /* ── 설문지의 친구 이름 버튼 ── */
    .pill { border: 1px solid #D5DEDA; border-radius: 999px; padding: .5rem .9rem; background: #fff; font-weight: 600; transition: .15s; }
    .pill:hover:not(:disabled) { border-color: #24493D; }
    .pill[aria-pressed="true"] { background: #24493D; color: #fff; border-color: #24493D; }
    .pill:disabled { opacity: .35; cursor: not-allowed; }
    .pill:focus-visible { outline: 3px solid rgba(240,207,92,.8); outline-offset: 2px; }
    /* ── 교사 작업 탭 (밑줄형 탭) ── */
    .ws-tabs { display: flex; gap: .25rem; border-bottom: 1px solid #D5DEDA; overflow-x: auto; scrollbar-width: none; }
    .ws-tabs::-webkit-scrollbar { display: none; }
    .ws-tab { flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #5F706A; padding: .8rem 1rem; font-weight: 700; }
    .ws-tab[aria-selected="true"] { color: #24493D; border-bottom-color: #24493D; }
    .ws-tab:focus-visible { outline: 3px solid rgba(36,73,61,.22); outline-offset: -3px; }
    /* ── 도장 ── */
    .stamp { display: inline-flex; align-items: center; justify-content: center; width: 108px; height: 108px; border-radius: 9999px;
      border: 5px solid #CF3A2E; color: #CF3A2E; font-size: 28px; font-weight: 800; letter-spacing: -.02em; transform: rotate(-12deg);
      box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 7px rgba(207,58,46,.35); }
    .stamp-press { animation: press .5s cubic-bezier(.2,.9,.3,1.25) both; }
    @keyframes press { 0% { transform: scale(1.9) rotate(-12deg); opacity: 0; } 60% { transform: scale(.94) rotate(-12deg); opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: 1; } }
    .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px; display: inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chip-scroll { overflow-x: auto; scrollbar-width: none; } .chip-scroll::-webkit-scrollbar { display: none; }
    input, select, textarea { font-size: 16px; }
    [hidden] { display: none !important; }
    /* ── 오른쪽 Drawer (학생 상세정보) ── */
    .drawer { transform: translateX(100%); transition: transform .25s ease; }
    .drawer.open { transform: translateX(0); }
    div.vis-tooltip { background: #fff !important; color: #1D2B26 !important; border: 1px solid #D5DEDA !important; border-radius: 8px !important;
      font-family: Pretendard, sans-serif !important; padding: 6px 10px !important; max-width: 260px; white-space: normal !important; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* ── room-auth.js 공통 창(Bootstrap 모달)이 이 페이지에서도 제 모양으로 뜨도록 ── */
    .d-none { display: none !important; }
    .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important;
      overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
    .modal { position: fixed; top: 0; left: 0; z-index: 80; display: none; width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; outline: 0; }
    .modal.fade .modal-dialog { transition: transform .2s ease-out; transform: translateY(-16px); }
    .modal.show .modal-dialog { transform: none; }
    .modal-dialog { position: relative; width: auto; margin: 1rem; pointer-events: none; }
    @media (min-width: 640px) { .modal-dialog { max-width: 480px; margin: 2rem auto; } }
    .modal-dialog-centered { display: flex; align-items: center; min-height: calc(100% - 3.5rem); }
    .modal-content { position: relative; display: flex; flex-direction: column; width: 100%; pointer-events: auto; background: #fff; outline: 0;
      border: 1px solid #D5DEDA; border-radius: 1rem; padding: 1.25rem; box-shadow: 0 20px 35px rgba(29,43,38,.18); }
    .modal-header { display: flex !important; align-items: center !important; justify-content: space-between !important; border: 0 !important; padding: 0 0 .5rem 0 !important; }
    .modal-title { margin: 0 !important; font-weight: 800 !important; color: #1D2B26 !important; }
    .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; border: 0 !important; padding-top: 1rem; }
    .modal-backdrop { position: fixed; top: 0; left: 0; z-index: 70; width: 100vw; height: 100vh; background-color: #1D2B26; }
    .modal-backdrop.fade { opacity: 0; transition: opacity .15s linear; }
    .modal-backdrop.show { opacity: .5; }
    .btn-close { display: inline-grid; width: 2rem; height: 2rem; place-items: center; border: 0; background: transparent; color: #5F706A; cursor: pointer; }
    .btn-close::before { content: "×"; font-size: 1.5rem; line-height: 1; }
    .btn-secondary { background: #fff; color: #1D2B26; box-shadow: inset 0 0 0 1px #D5DEDA; }
    .alert { border-radius: .65rem; padding: .6rem .8rem; }
    .alert-info { background: #E1EBE6; color: #24493D; }
    .alert-warning { background: #FDF3E1; color: #8A5A0D; }
    #customModal .modal-body { color: #5F706A; line-height: 1.6; }
    #customModal #customModalInput { box-sizing: border-box; width: 100%; border: 1px solid #D5DEDA; border-radius: .625rem; padding: .75rem 1rem; color: #1D2B26; }
    #studentAuthModal .modal-content, #studentConfirmModal .modal-content { border-radius: 1.25rem !important; padding: 1.5rem !important; }
    #studentAuthModal .form-control, #studentConfirmModal .form-control, #newPinModal .form-control {
      box-sizing: border-box; width: 100%; border-radius: .625rem !important; border: 1.5px solid #DCE5E1 !important; background-color: #F7F8FA !important;
      color: #1F2925 !important; font-size: 1.15rem !important; padding: .75rem 1rem !important; }
    #studentAuthModal .form-control:focus, #studentConfirmModal .form-control:focus { border-color: #24493D !important; box-shadow: 0 0 0 3px rgba(36,73,61,.15) !important; outline: none !important; }
    #btnConfirmStudentAuth, #btnConfirmStudentInfo { background-color: #24493D !important; color: #F3F0E4 !important; border-radius: .625rem !important; padding: .75rem 1.5rem !important; font-weight: 700 !important; border: none !important; }

    /* ── 첫 화면: room-auth.js 입장 카드를 로그인 카드 모양으로 ── */
    #login-student #room-entrance-card { background: transparent !important; border: 0 !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
    #login-student #room-entrance-card > h5, #login-student #btnOpenDashboard { display: none !important; }
    #login-student #roomCodeInput { display: block; box-sizing: border-box; width: 100% !important; margin: .375rem 0 .5rem !important; border-radius: .5rem !important;
      border: 1px solid #D5DEDA !important; background: #fff !important; padding: .75rem .875rem !important; color: #1D2B26 !important;
      font-size: 1.25rem !important; font-weight: 800 !important; letter-spacing: .3em; text-align: center !important; box-shadow: none !important; }
    #login-student #roomCodeInput::placeholder { letter-spacing: normal; font-weight: 600; color: rgba(95,112,106,.6); }
    #login-student #roomCodeInput:focus { border-color: #24493D !important; outline: none !important; box-shadow: 0 0 0 4px rgba(240,207,92,.6) !important; }
    #login-student #roomEntranceHint { min-height: 1.2rem; margin-bottom: .5rem; color: #5F706A; font-size: .8125rem; text-align: center; }
    #login-student .form-check { display: flex !important; align-items: center !important; justify-content: center !important; gap: .5rem !important; }
    #login-student .form-check-label { color: #1D2B26; font-size: .875rem; font-weight: 700; cursor: pointer; }
    #login-student .form-check + .text-center { margin: .25rem 0 0; color: #5F706A; font-size: .75rem !important; line-height: 1.45; }
    #login-student #guestModeCheck { appearance: none; position: relative; flex: 0 0 auto; width: 2.25rem; height: 1.25rem; margin: 0; border: 1px solid #AEB8C4;
      border-radius: 999px; background: #C8D0D9; cursor: pointer; transition: background-color .16s ease, border-color .16s ease; }
    #login-student #guestModeCheck::before { content: ""; position: absolute; top: .125rem; left: .125rem; width: .875rem; height: .875rem; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.22); transition: transform .16s ease; }
    #login-student #guestModeCheck:checked { border-color: #24493D; background: #24493D; }
    #login-student #guestModeCheck:checked::before { transform: translateX(1rem); }
    #login-student #btnJoinRoom { display: flex; align-items: center; justify-content: center; width: 100% !important; margin-top: 1.25rem !important;
      border: 0 !important; border-radius: .5rem !important; background: #24493D !important; color: #F3F0E4 !important; padding: .75rem 1rem !important;
      font-size: 1rem !important; font-weight: 700 !important; }
    #login-student #btnJoinRoom:hover { background: #1B3A30 !important; }
  </style>
</head>

<body class="min-h-screen break-keep bg-page font-sans text-ink antialiased">

  <!-- ================================================================== -->
  <!-- 1. 첫 화면: 학생(반 코드 · 학번 · PIN) / 교사(구글 로그인)            -->
  <!-- ================================================================== -->
  <section id="view-home">
    <div class="board px-5 pb-14 pt-12 text-center">
      <p class="text-sm font-semibold text-chalk/70">한 달에 한 번, 우리 반 친구 사이를 그려요</p>
      <h1 class="board-title mt-2 text-3xl leading-tight sm:text-4xl">🏫 우리반 관계지도</h1>
    </div>
    <div class="mx-auto -mt-6 w-full max-w-md px-4 pb-12">
      <div class="panel p-6 shadow-sm">
        <div class="grid grid-cols-2 gap-1 rounded-lg bg-page p-1" role="tablist" aria-label="로그인 대상">
          <button type="button" class="tab-item" data-role="student" role="tab">학생</button>
          <button type="button" class="tab-item" data-role="teacher" role="tab">교사</button>
        </div>
        <div id="login-student" class="mt-5">
          <label for="roomCodeInput" class="field-label">반 코드</label>
          <div id="room-entrance-container"></div>
        </div>
        <div id="login-teacher" class="mt-5 hidden">
          <p class="text-sm leading-relaxed text-ink-muted">관계지도와 학생 응답은 승인된 선생님만 볼 수 있어요. 구글 계정으로 로그인해 주세요.</p>
          <p id="teacher-login-note" class="mt-3 hidden rounded-lg bg-stamp-soft px-3 py-2.5 text-sm font-semibold text-stamp" role="alert"></p>
          <button id="teacher-google-btn" type="button" class="btn btn-primary mt-5 w-full py-3 text-base">구글 계정으로 로그인</button>
          <button id="teacher-signout-btn" type="button" class="btn btn-ghost mt-2 hidden w-full py-3">로그아웃</button>
        </div>
        <p id="login-help" class="mt-4 text-center text-xs leading-relaxed text-ink-muted"></p>
      </div>
      <p class="mt-6 text-center text-xs leading-relaxed text-ink-muted">설문 답변은 선생님만 볼 수 있어요. 친구들에게는 절대 보이지 않아요.</p>
    </div>
  </section>

  <!-- ================================================================== -->
  <!-- 2. 학생 설문: 한 장짜리 설문지                                       -->
  <!-- ================================================================== -->
  <section id="view-survey" class="hidden">
    <div class="board px-4 pb-12 pt-6">
      <div class="mx-auto flex max-w-2xl items-center justify-between gap-3">
        <h1 class="board-title text-xl leading-tight sm:text-2xl">🏫 우리반 관계 설문</h1>
        <button id="sv-exit" type="button" class="btn btn-chalk btn-sm shrink-0">나가기</button>
      </div>
    </div>
    <div class="mx-auto -mt-8 max-w-2xl px-4 pb-16">
      <div id="sv-panel" class="panel p-5 shadow-sm sm:p-7"></div>
    </div>
  </section>

  <!-- ================================================================== -->
  <!-- 3. 교사 화면                                                         -->
  <!-- ================================================================== -->
  <section id="view-teacher" class="hidden">
    <div class="board px-4 py-4">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3">
        <h1 class="board-title whitespace-nowrap text-xl sm:text-2xl">🏫 우리반 관계지도</h1>
        <div class="flex items-center gap-2">
          <span class="rounded-full bg-chalk-yellow px-2.5 py-0.5 text-xs font-bold text-ink">👩‍🏫 교사 모드</span>
          <span id="teacher-name" class="hidden text-sm font-semibold text-chalk/80 sm:inline"></span>
          <button id="btn-logout" type="button" class="btn btn-chalk btn-sm">로그아웃</button>
        </div>
      </div>
    </div>
    <div class="mx-auto max-w-6xl space-y-2 px-4 pt-4">
      <!-- 반 줄: 반 선택 · 새 반 · 예시 · 새로고침 -->
      <div class="panel flex flex-wrap items-center gap-2 p-3 shadow-sm">
        <select id="admin-school" class="field mt-0 w-auto py-2 text-sm" aria-label="학교별 반 필터" hidden><option value="">전체 학교</option></select>
        <label for="roomSelect" class="text-sm font-bold">반</label>
        <select id="roomSelect" class="field mt-0 w-auto min-w-0 flex-1 py-2 text-sm font-bold sm:max-w-xs"><option value="">반을 선택하세요</option></select>
        <button id="btn-new-room" type="button" class="btn btn-primary btn-sm">＋ 새 반</button>
        <button id="btn-demo" type="button" class="btn btn-ghost btn-sm">예시로 미리보기</button>
        <span class="flex-1"></span>
        <span id="room-count" class="text-xs font-semibold text-ink-muted"></span>
        <button id="btn-refresh" type="button" class="btn btn-ghost btn-sm" disabled>↻ 새로고침</button>
      </div>
      <!-- 도구 줄: 달 선택 · 상태 · 마감 · 응답 수 · 삭제 -->
      <div id="month-bar" class="panel flex flex-wrap items-center gap-2 p-3 shadow-sm" hidden>
        <span class="text-sm font-bold">설문 달</span>
        <div class="flex items-center gap-1">
          <button id="m-prev" type="button" class="btn btn-ghost btn-sm px-2.5" aria-label="이전 달">‹</button>
          <select id="month-select" class="field mt-0 w-auto py-2 text-sm font-bold" aria-label="달 선택"></select>
          <button id="m-next" type="button" class="btn btn-ghost btn-sm px-2.5" aria-label="다음 달">›</button>
        </div>

/** html을 담은 모달을 열고, data-close 버튼의 값으로 끝나는 Promise를 돌려줍니다. */
function openModal(html, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-[90] flex items-end justify-center p-3 sm:items-center';
    wrap.innerHTML = `<div class="absolute inset-0 bg-ink/50" data-backdrop></div>
      <div class="relative max-h-[90vh] w-full ${opts.wide ? 'max-w-lg' : 'max-w-sm'} overflow-y-auto rounded-2xl bg-white p-6 shadow-xl" role="dialog" aria-modal="true">${html}</div>`;
    const onKey = e => { if (e.key === 'Escape') close(null); };
    const close = v => { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); };
    document.addEventListener('keydown', onKey);
    wrap.querySelector('[data-backdrop]').addEventListener('click', () => close(null));
    wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.close; close(v === 'true' ? true : v === 'false' ? false : v);
    }));
    $('#modal-root').appendChild(wrap);
    if (opts.onMount) opts.onMount(wrap, close);
    const f = wrap.querySelector('input, textarea, select') || wrap.querySelector('[data-close="true"], button');
    if (f) setTimeout(() => f.focus(), 60);
  });
}

        try { res = await o.onSubmit(values, wrap); } catch (e) { res = { error: String((e && e.message) || e) }; }
        btn.disabled = false; btn.innerHTML = label;
        if (res && res.error) { err.textContent = res.error; err.classList.remove('hidden'); return; }
        close(res === undefined ? values : res);
      };
      btn.addEventListener('click', submit);
      wrap.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
      if (o.onMount) o.onMount(wrap, close);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════
 *  4. 분석 — 데이터 모델 · 한 달 분석 · 지난달 비교 · 온톨로지 추론
 *     (Apps Script 버전 loadModel_ · analyzeMonth_ · diffMonths_ · buildFacts_와 같은 규칙)
 * ═══════════════════════════════════════════════════════════════ */

/** Firestore 문서 → 분석용 모델 { students, months, answers, submits } */
function buildModel(room, responses, receipts) {
  const now = Date.now();
  const roster = room?.roster && typeof room.roster === 'object' ? room.roster : {};
  const students = Object.entries(roster).map(([id, value]) => ({
    id, studentNo: id, number: safeNumber(value?.no, 0), name: String(value?.name || '').trim(), active: value?.active !== false
  })).filter(student => STUDENT_ID_PATTERN.test(student.id) && student.name)
    .sort((a, b) => compareStudentNo(a.studentNo, b.studentNo) || a.number - b.number);

  // 마감 예약 시각이 지난 '진행 중' 달은 마감으로 봅니다.
  const months = Object.entries(room?.months || {}).map(([month, value]) => {
    const closeAt = timestampMillis(value?.closeAt);
    const saved = value?.status === 'open' ? 'open' : 'closed';
    return { month, saved, status: saved === 'open' && closeAt && closeAt <= now ? 'closed' : saved, closeAt, openedAt: timestampMillis(value?.openedAt) };
  }).filter(item => MONTH_PATTERN.test(item.month)).sort((a, b) => a.month.localeCompare(b.month));

  const answers = [];
  const submits = [];
  (responses || []).forEach(response => {
    const month = String(response?.month || '');
    const s = String(response?.studentId || '');
    if (!MONTH_PATTERN.test(month) || !s) return;
    SURVEY_CONFIG.questions.forEach(question => {
      const list = Array.isArray(response[question.key]) ? response[question.key] : [];
      const used = new Set();
      list.slice(0, question.max).forEach(item => {
        const o = String(item?.id || '');
        if (!o || o === s || used.has(o)) return;
        used.add(o);
        answers.push({
          month, s, o, pol: question.pol, rank: used.size,
          tags: (Array.isArray(item.tags) ? item.tags : []).map(tag => String(tag).slice(0, 30)).slice(0, 10),
          text: String(item.text || '').slice(0, SURVEY_CONFIG.reasonMax)
        });
      });
    });
    const climate = Number(response.climate);
    submits.push({
      month, s,
      climate: climate >= 1 && climate <= 5 ? Math.round(climate) : '',
      climateReason: String(response.climateReason || '').slice(0, SURVEY_CONFIG.climateReasonMax),
      at: timestampMillis(response.submittedAt),
      editAllowed: !!receipts?.[`${month}_${s}`]?.editAllowed
    });
  });
  return { students, months, answers, submits };
}

/** 학생이 쓴 글에서 SURVEY_CONFIG.alertWords 낱말을 찾습니다. */
function alertWordsIn(text) {
  const normalized = String(text || '').replace(/\s+/g, ' ');
  return SURVEY_CONFIG.alertWords.filter(word => word && normalized.includes(word));
}

function sensitiveHits(tags, text) {
  return (tags || []).filter(tag => SURVEY_CONFIG.alertTags.includes(tag)).concat(alertWordsIn(text));
}

/**
 * 한 달 분석: 관계 선, 학생별 통계, 학급 분위기, 서로 친구, 엇갈림, 그리고 '살펴볼 점' 5가지
 *  watch.sensitive · climateLow · isolated · conflicts · missing
 */
function analyzeMonth(model, month) {
  const students = model.students.filter(student => student.active);
  const ids = new Set(students.map(student => student.id));
  const edges = model.answers.filter(a => a.month === month && ids.has(a.s) && ids.has(a.o));
  const subs = {};
  model.submits.filter(item => item.month === month && ids.has(item.s)).forEach(item => { subs[item.s] = item; });
  const responded = new Set(Object.keys(subs));
  edges.forEach(e => responded.add(e.s));
  const has = new Set(edges.map(e => `${e.s}|${e.o}|${e.pol}`));

  const stats = {};
  students.forEach(student => {
    const sub = subs[student.id];
    stats[student.id] = {
      id: student.id, recvPos: 0, recvNeg: 0, givenPos: 0, givenNeg: 0, mutual: 0,
      responded: responded.has(student.id), editAllowed: !!sub?.editAllowed, submittedAt: sub?.at || 0,
      climate: sub ? sub.climate : '', climateReason: sub ? sub.climateReason : ''
    };
  });
  edges.forEach(e => {
    if (e.pol === POL.POS) { stats[e.s].givenPos++; stats[e.o].recvPos++; }
    else { stats[e.s].givenNeg++; stats[e.o].recvNeg++; }
  });

  const mutualPairs = [], mutualNeg = [], mixed = [];
  edges.forEach(e => {
    if (e.pol === POL.POS && e.s < e.o && has.has(`${e.o}|${e.s}|${POL.POS}`)) {
      mutualPairs.push([e.s, e.o]);
      stats[e.s].mutual++;
      stats[e.o].mutual++;
    }
    if (e.pol === POL.NEG && e.s < e.o && has.has(`${e.o}|${e.s}|${POL.NEG}`)) mutualNeg.push([e.s, e.o]);
    if (e.pol === POL.POS && has.has(`${e.o}|${e.s}|${POL.NEG}`)) mixed.push([e.s, e.o]);
  });

  // 학급 분위기: 평균과 1~5점 분포
  const scores = students.map(student => Number(stats[student.id].climate)).filter(v => v >= 1 && v <= 5);
  const dist = [0, 0, 0, 0, 0];
  scores.forEach(v => { dist[v - 1]++; });
  const climate = { avg: scores.length ? round1(scores.reduce((a, b) => a + b, 0) / scores.length) : null, count: scores.length, dist };

  // 살펴볼 점
  const anyResponse = responded.size > 0;
  const watch = { sensitive: [], climateLow: [], isolated: [], conflicts: [], missing: [] };
  edges.filter(e => e.pol === POL.NEG).forEach(e => {
    const hits = sensitiveHits(e.tags, e.text);
    if (hits.length) watch.sensitive.push({ s: e.s, o: e.o, where: '불편한 친구', hits, tags: e.tags, text: e.text });
  });
  students.forEach(student => {
    const st = stats[student.id];
    const climateHits = alertWordsIn(st.climateReason);
    if (climateHits.length) watch.sensitive.push({ s: student.id, o: '', where: '분위기 이유', hits: climateHits, tags: [], text: st.climateReason });
    const score = Number(st.climate);
    if (score && score <= 2) watch.climateLow.push({ id: student.id, score, reason: st.climateReason });
    if (anyResponse && st.recvPos === 0) {
      watch.isolated.push({ id: student.id, responded: st.responded, chose: edges.filter(e => e.s === student.id && e.pol === POL.POS).map(e => e.o) });
    }
  });
  watch.climateLow.sort((a, b) => a.score - b.score);
  const textOf = (s, o, pol) => edges.find(e => e.s === s && e.o === o && e.pol === pol)?.text || '';
  mutualNeg.forEach(([a, b]) => watch.conflicts.push({ a, b, type: '서로 불편함', aText: textOf(a, b, POL.NEG), bText: textOf(b, a, POL.NEG) }));
  mixed.forEach(([a, b]) => watch.conflicts.push({ a, b, type: '마음이 엇갈림', aText: textOf(a, b, POL.POS), bText: textOf(b, a, POL.NEG) }));
  watch.missing = anyResponse ? students.filter(student => !responded.has(student.id)).map(student => student.id) : [];

  return {
    month, total: students.length, responded: responded.size, missing: watch.missing,
    edges: edges.map(e => ({ s: e.s, o: e.o, pol: e.pol, rank: e.rank, tags: e.tags, text: e.text })),
    stats, climate, mutualPairs, mutualNeg, mixed, watch
  };
}

/** 지난달과 비교 — '두 달 모두 응답한 학생'이 한 선택만 견줘 착시를 막습니다. */
function diffMonths(cur, prev) {
  const both = new Set(Object.keys(cur.stats).filter(id => cur.stats[id].responded && prev.stats[id]?.responded));
  const key = e => `${e.s}|${e.o}|${e.pol}`;
  const curEdges = cur.edges.filter(e => both.has(e.s));
  const prevEdges = prev.edges.filter(e => both.has(e.s) && cur.stats[e.o]);
  const curKeys = new Set(curEdges.map(key));
  const prevKeys = new Set(prevEdges.map(key));
  const pick = (list, pol, otherKeys, want) => list.filter(e => e.pol === pol && otherKeys.has(key(e)) === want);
  const pairsOf = analysis => {
    const out = new Map();
    analysis.mutualPairs.filter(([a, b]) => both.has(a) && both.has(b)).forEach(pair => out.set(pair.join('|'), pair));
    return out;
  };
  const curPairs = pairsOf(cur), prevPairs = pairsOf(prev);
  const count = (list, id, pol) => list.filter(e => e.o === id && e.pol === pol).length;

  const students = Object.keys(cur.stats).map(id => ({
    id, comparable: both.has(id),
    prevPos: count(prevEdges, id, POL.POS), curPos: count(curEdges, id, POL.POS),
    prevNeg: count(prevEdges, id, POL.NEG), curNeg: count(curEdges, id, POL.NEG),
    prevClimate: prev.stats[id] ? prev.stats[id].climate : '', curClimate: cur.stats[id].climate
  }));
  const highlights = { escaped: [], grew: [], climateUp: [], newIsolated: [], shrank: [], newNegTarget: [], climateDown: [] };
  students.forEach(x => {
    const delta = x.curPos - x.prevPos;
    if (x.prevPos === 0 && x.curPos > 0) highlights.escaped.push(x.id);
    else if (delta >= 2) highlights.grew.push(x.id);
    if (x.prevPos > 0 && x.curPos === 0) highlights.newIsolated.push(x.id);
    else if (delta <= -2) highlights.shrank.push(x.id);
    if (x.curNeg > x.prevNeg) highlights.newNegTarget.push(x.id);
    const pc = Number(x.prevClimate), cc = Number(x.curClimate);
    if (pc && cc && pc - cc >= 2) highlights.climateDown.push(x.id);
    if (pc && cc && cc - pc >= 2) highlights.climateUp.push(x.id);
  });
  return {
    prevMonth: prev.month, comparable: both.size,
    newPos: pick(curEdges, POL.POS, prevKeys, false), keptPos: pick(curEdges, POL.POS, prevKeys, true), lostPos: pick(prevEdges, POL.POS, curKeys, false),
    newNeg: pick(curEdges, POL.NEG, prevKeys, false), keptNeg: pick(curEdges, POL.NEG, prevKeys, true), resolvedNeg: pick(prevEdges, POL.NEG, curKeys, false),
    newMutual: [...curPairs.keys()].filter(k => !prevPairs.has(k)).map(k => curPairs.get(k)),
    lostMutual: [...prevPairs.keys()].filter(k => !curPairs.has(k)).map(k => prevPairs.get(k)),
    mutualPrev: prev.mutualPairs.length, mutualCur: cur.mutualPairs.length,
    climatePrev: prev.climate, climateCur: cur.climate,
    students, highlights
  };
}

/**
 * 온톨로지: 사실(트리플) 만들기 + 추론 — 학생 정보창의 '규칙으로 찾은 관계'에 쓰입니다.
 *  사실 = { s(주어), p(관계), o(대상), src(설문/추론), rule(추론 규칙) }
 *  ① 역관계 ② 상호선택 ③ 엇갈림 ④ 공통 친구(다리 놓기) ⑤ 한방향 선택(연결 기회) ⑥ 지난달과 비교
 */
const REL_NAMES = { [POL.POS]: ['즐겁게 지냄', '즐거운 친구로 선택받음'], [POL.NEG]: ['불편함을 느낌', '불편하다고 지목됨'] };

function buildFacts(cur, diff) {
  const ids = cur.stats;
  const facts = [];
  const add = (s, p, o, src, rule, extra) => facts.push({ s, p, o, src, rule: rule || '', oIsStudent: !!ids[o], ...(extra || {}) });
  const pairKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
  const tone = pol => (pol === POL.NEG ? '부정' : '긍정');

  // 기본 사실 + ① 역관계
  cur.edges.forEach(e => {
    const meta = { pol: tone(e.pol), tags: e.tags, text: e.text, rank: e.rank };
    add(e.s, REL_NAMES[e.pol][0], e.o, '설문', '', meta);
    add(e.o, REL_NAMES[e.pol][1], e.s, '추론', '역관계', meta);
  });
  // ② 상호선택 · ③ 엇갈림
  const addPair = (list, p, rule, pol) => list.forEach(([a, b]) => {
    add(a, p, b, '추론', rule, { pol, pair: true });
    add(b, p, a, '추론', rule, { pol, pair: true });
  });
  addPair(cur.mutualPairs, '서로 친구', '상호선택', '긍정');
  addPair(cur.mutualNeg, '서로 불편함', '상호선택', '부정');
  addPair(cur.mixed, '마음이 엇갈림', '엇갈림', '부정');

  // 연결망: 즐거운 관계는 무방향 연결(먼저 고를수록 가중치 큼), 불편 관계는 '부정 쌍'
  const adj = {}, negPair = {}, posOut = {}, mutualSet = {};
  Object.keys(ids).forEach(id => { adj[id] = {}; posOut[id] = {}; mutualSet[id] = {}; });
  cur.edges.forEach(e => {
    if (e.pol === POL.NEG) { negPair[pairKey(e.s, e.o)] = true; return; }
    const weight = Math.max(1, 4 - e.rank);
    posOut[e.s][e.o] = true;
    adj[e.s][e.o] = (adj[e.s][e.o] || 0) + weight;
    adj[e.o][e.s] = (adj[e.o][e.s] || 0) + weight;
  });
  cur.mutualPairs.forEach(([a, b]) => { mutualSet[a][b] = true; mutualSet[b][a] = true; });

  // ④ 공통 친구 → 다리 놓기 후보 (선택받은 수가 적은 학생 쪽부터 15쌍)
  const bridgeMap = {};
  Object.keys(ids).forEach(bridge => {
    const friends = Object.keys(mutualSet[bridge]);
    for (let i = 0; i < friends.length; i++) {
      for (let j = i + 1; j < friends.length; j++) {
        const k = pairKey(friends[i], friends[j]);
        if (adj[friends[i]][friends[j]] || negPair[k]) continue;
        const [a, c] = k.split('|');
        (bridgeMap[k] = bridgeMap[k] || { a, c, via: [] }).via.push(bridge);
      }
    }
  });
  Object.values(bridgeMap)
    .map(x => ({ ...x, need: Math.min(ids[x.a].recvPos, ids[x.c].recvPos) }))
    .sort((x, y) => x.need - y.need || y.via.length - x.via.length)
    .slice(0, 15)
    .forEach(x => {
      add(x.a, '다리 놓기 후보', x.c, '추론', '공통 친구', { via: x.via, pair: true, pol: '긍정' });
      add(x.c, '다리 놓기 후보', x.a, '추론', '공통 친구', { via: x.via, pair: true, pol: '긍정' });
    });

  // ⑤ 한방향 선택 → 연결 기회
  Object.keys(ids).forEach(s => {
    const st = ids[s];
    if (!st.responded || (st.recvPos > 0 && st.mutual > 0)) return;
    Object.keys(posOut[s]).forEach(o => {
      if (!posOut[o][s] && !negPair[pairKey(s, o)]) add(s, '연결 기회', o, '추론', '한방향 선택', { pol: '긍정' });
    });
  });

  // ⑥ 지난달과 비교
  if (diff) {
    const rule = '지난달과 비교';
    diff.newPos.forEach(e => add(e.s, '새로 즐겁게 지냄', e.o, '추론', rule, { pol: '긍정', text: e.text }));
    diff.lostPos.forEach(e => add(e.s, '즐거운 관계가 사라짐', e.o, '추론', rule, { pol: '부정', text: e.text }));
    diff.newNeg.forEach(e => add(e.s, '새로 불편해짐', e.o, '추론', rule, { pol: '부정', text: e.text }));
    diff.resolvedNeg.forEach(e => add(e.s, '불편함이 풀림', e.o, '추론', rule, { pol: '긍정', text: e.text }));
    addPair(diff.newMutual, '새로 서로 친구', rule, '긍정');
    addPair(diff.lostMutual, '서로 친구가 끊김', rule, '부정');
  }
  return facts;
}

/** 선택한 달 + 그 이전 달 분석과 비교·추론을 한 번에 만듭니다. */
function buildContext(model, month) {
  const list = model.months.map(item => item.month);
  let selected = list.includes(month) ? month : '';
  if (!selected) {
    const open = model.months.filter(item => item.status === 'open');
    selected = open.length ? open[open.length - 1].month : (list[list.length - 1] || '');
  }
  const index = list.indexOf(selected);
  const prevMonth = index > 0 ? list[index - 1] : '';
  const cur = selected ? analyzeMonth(model, selected) : null;
  const prev = prevMonth ? analyzeMonth(model, prevMonth) : null;
  const diff = cur && prev ? diffMonths(cur, prev) : null;
  return { month: selected, prevMonth, cur, prev, diff, facts: cur ? buildFacts(cur, diff) : [] };
}

/** 월별 추이 (응답 · 서로 친구 · 불편 응답 · 선택받지 못한 학생 · 분위기 평균) */
function buildTrend(model, ctx) {
  return model.months.map(item => {
    const analysis = item.month === ctx.month ? ctx.cur : item.month === ctx.prevMonth ? ctx.prev : analyzeMonth(model, item.month);
    return {
      month: item.month, status: item.status, closeAt: item.closeAt,
      responded: analysis.responded, total: analysis.total,
      mutual: analysis.mutualPairs.length,
      neg: analysis.edges.filter(e => e.pol === POL.NEG).length,
      isolated: analysis.responded ? Object.values(analysis.stats).filter(st => st.recvPos === 0).length : null,
      climateAvg: analysis.climate.avg
    };
  });
}

/* ═══════════════════════════════════════════════════════════════
 *  5. 예시 데이터 — 9월(마감) · 10월(진행 중), 저장하지 않고 화면에서만 씁니다
 *     10월 변화: 류현우(1619)에게 새 친구 · 전소율(1620)을 향한 불편 응답 감소

/** 예시 이유 글에 어울리는 분류 태그 고르기 (예시 데이터 전용) */
function demoNegativeTags(text) {
  const rules = [['놀려', '놀리거나 장난이 심해요'], ['장난', '놀리거나 장난이 심해요'], ['다퉜', '다툰 일이 있었어요'], ['싸웠', '다툰 일이 있었어요'],
    ['다툰', '다툰 일이 있었어요'], ['약속', '약속을 잘 안 지켜요'], ['함부로', '말 때문에 속상했어요'], ['못한다고', '말 때문에 속상했어요'], ['', '함께 있으면 불편해요']];
  return [rules.find(([word]) => text.includes(word))[1]];
}

function demoOctoberPositive() {
  const map = JSON.parse(JSON.stringify(DEMO.posSep));
  DEMO.octSkip.forEach(code => delete map[code]);
  Object.assign(map, {
    S03: ['S09', 'S13', 'S19'], S09: ['S03', 'S19', 'S15'], S19: ['S03', 'S09', 'S15'],
    S10: ['S04', 'S02', 'S12'], S06: ['S14', 'S17', 'S10']
  });
  return map;
}

function buildDemoData() {
  const roster = {};
  DEMO.names.forEach((name, index) => { roster[`16${pad2(index + 1)}`] = { no: index + 1, name, active: true }; });
  const room = {
    memo: '예시 반 · 1학년 6반', creatorSchool: '예시중학교', creatorName: '예시', roomMode: 'auth', roster,
    months: {
      '2026-09': { status: 'closed', openedAt: Date.parse('2026-09-07T09:00:00+09:00'), closeAt: null },
      '2026-10': { status: 'open', openedAt: Date.parse('2026-10-05T09:00:00+09:00'), closeAt: null }
    }
  };
  const responses = [];
  const addMonth = (month, positiveMap, negativeList, climates, day, skip) => {
    const order = Object.keys(positiveMap);
    DEMO.names.forEach((_, index) => {
      const code = `S${pad2(index + 1)}`;
      if (skip.includes(code)) return;
      const positive = (positiveMap[code] || []).map((target, rank) => {
        const [tags, text] = DEMO.posText[(order.indexOf(code) * 3 + rank) % DEMO.posText.length];
        return { id: demoStudentId(target), tags, text };
      });
      const negative = negativeList.filter(([from]) => from === code)
        .map(([, target, text]) => ({ id: demoStudentId(target), tags: demoNegativeTags(text), text }));
      responses.push({
        month, studentId: demoStudentId(code), climate: climates[index],
        climateReason: DEMO.climateReason[month]?.[code] || '', positive, negative,
        submittedAt: Date.parse(`${day}T09:${pad2(30 + index)}:00+09:00`)
      });
    });
  };
  addMonth('2026-09', DEMO.posSep, DEMO.negSep, DEMO.climateSep, '2026-09-08', []);
  addMonth('2026-10', demoOctoberPositive(), DEMO.negOct, DEMO.climateOct, '2026-10-06', DEMO.octSkip);
  return { room, responses, receipts: {} };
}

/* ═══════════════════════════════════════════════════════════════
 *  7. 학생 설문: 한 장짜리 설문지
 *     1번: 우리 반 분위기 5점 척도(필수) + 이유(선택)
 *     2~3번: 친구 이름 버튼을 눌러 고르면, 고른 친구마다 이유 분류와 자세한 이유를 받음
 *     제출은 PIN 게이트 갱신과 같은 batch로 씁니다 — 보안 규칙이 같은 요청 안에서 학번의 PIN을 확인합니다.
 *     제출한 답은 학생 본인도 다시 읽지 못합니다 (receipts에는 제출 여부만 있음).
 * ═══════════════════════════════════════════════════════════════ */
/** 진행 중인 달 가운데 가장 최근 달 (마감 예약 시각이 지난 달은 빼고) */
function pickOpenMonth(months) {
  const now = Date.now();
  return Object.entries(months || {})
    .map(([month, v]) => ({ month, status: v && v.status, closeAt: timestampMillis(v && v.closeAt) }))
    .filter(x => MONTH_PATTERN.test(x.month) && x.status === 'open' && (!x.closeAt || x.closeAt > now))
    .sort((a, b) => b.month.localeCompare(a.month))[0] || null;
}

async function openStudentSurvey(roomCode, authInfo) {
  const studentId = String((authInfo && authInfo.studentId) || '').trim();
  const stop = (title, message) => { window.releaseStudentPresence && window.releaseStudentPresence(); guestProof = null; return mAlert(title, message); };
  if (!studentId) return stop('들어가지 못했어요', '학생 정보를 확인할 수 없어요. 다시 들어와 주세요.');
  loading(true, '설문을 불러오는 중');
  let room = null, open = null, receipt = null, failure = null;
  try {
    const snap = await getDoc(doc(db, COLLECTION, roomCode));
    room = snap.exists() ? snap.data() : null;
    open = room ? pickOpenMonth(room.months) : null;
    const me = room && room.roster && room.roster[studentId];
    if (open && me && me.active !== false) {
      const r = await getDoc(doc(db, COLLECTION, roomCode, 'receipts', `${open.month}_${studentId}`));
      receipt = r.exists() ? r.data() : null;
    }
  } catch (err) { failure = err; }
  loading(false);
  if (failure) {
    console.error('설문 정보 불러오기 실패:', failure);
    return stop('설문을 불러오지 못했어요', isPermissionError(failure) ? '설문 정보를 읽을 권한이 없어요. 선생님께 알려 주세요. (보안 규칙)' : '네트워크를 확인하고 다시 들어와 주세요.');
  }
  if (!room) return stop('들어가지 못했어요', '반 정보를 찾을 수 없어요. 반 코드를 확인해 주세요.');
  const me = room.roster && room.roster[studentId];
  if (!me || me.active === false) return stop('명단에서 찾지 못했어요', `학번 ${studentId}이(가) 이 반 명단에 없어요. 학번이 맞는지 확인하고, 맞다면 선생님께 명단 등록을 부탁해 주세요.`);
  if (!open) return stop('지금은 설문 기간이 아니에요', '선생님이 설문을 시작하면 다시 들어와 주세요.');
  if (receipt && !receipt.editAllowed) return stop('이미 제출한 설문이에요', `${monthLabel(open.month)} 설문은 이미 제출했어요. 친구들의 정보를 지키기 위해 제출한 답은 다시 불러오지 않아요. 고칠 내용이 있으면 선생님께 수정 권한을 요청해 주세요.`);
  startSurvey(roomCode, room, studentId, authInfo, open, !!receipt);
}

function startSurvey(roomCode, room, studentId, authInfo, open, editing) {
  const roster = room.roster || {}, answers = {};
  SURVEY_CONFIG.questions.forEach(q => { answers[q.key] = []; });
  S.sv = {
    roomCode, room, studentId, isGuest: !!authInfo.isGuest,
    studentKey: makeStudentKey(String(authInfo.school || room.creatorSchool || '').trim(), studentId),
    month: open.month, closeAt: open.closeAt, editing,
    me: { id: studentId, name: String(roster[studentId].name || '').trim(), studentNo: studentId },
    classmates: Object.entries(roster)
      .filter(([id, v]) => id !== studentId && v && v.active !== false && String(v.name || '').trim())
      .map(([id, v]) => ({ id, number: safeNumber(v.no, 0), name: String(v.name).trim() }))
      .sort((a, b) => compareStudentNo(a.id, b.id)),
    answers, climate: '', climateReason: '', done: false, submitting: false
  };
  show('survey');
  renderSurveyForm();
  armSurveyClose();
}

/** 친구 이름 버튼: 2번(즐거운)과 3번(불편한)에는 같은 친구를 함께 고를 수 없어요. */
function renderPills(key) {
  const sv = S.sv;
  const picked = sv.answers[key];
  const other = key === 'positive' ? sv.answers.negative : key === 'negative' ? sv.answers.positive : [];
  document.querySelector(`[data-pills="${key}"]`).innerHTML = sv.classmates.map(c => {
    const on = picked.some(x => x.id === c.id), blocked = !on && (other || []).some(x => x.id === c.id);
    return `<button type="button" class="pill" data-pick="${key}" data-id="${esc(c.id)}" aria-pressed="${on}" ${blocked ? 'disabled title="다른 문항에서 이미 골랐어요"' : ''}>${esc(c.name)}</button>`;
  }).join('') || '<p class="text-sm text-ink-muted">명단에 다른 친구가 아직 없어요.</p>';
}

/** 고른 친구마다: 이유 분류 태그(여러 개) + 자세한 이유(직접 입력) */
function renderReasons(key) {
  const sv = S.sv, q = questionOf(key);
  document.querySelector(`[data-reasons="${key}"]`).innerHTML = sv.answers[key].map((x, i) => {
    const c = sv.classmates.find(m => m.id === x.id);
    return `<div class="rounded-xl border border-line bg-page/40 p-3" data-card="${key}|${esc(x.id)}">
      <p class="text-sm font-bold"><span class="mr-1.5 inline-flex h-5 w-5 items-center justify-center rounded-full bg-board text-[11px] text-chalk">${i + 1}</span>${esc(q.reasonLabel.replace('{name}', c ? c.name : ''))} <span class="text-stamp">*</span></p>
      <p class="mt-2 text-xs font-semibold text-ink-muted">어떤 이유인가요? (여러 개 고를 수 있어요)</p>
      <div class="mt-1.5 flex flex-wrap gap-1.5">${q.tags.map(t => `<button type="button" class="pill px-3 py-1 text-sm" data-tag="${esc(t)}" data-tq="${key}" data-id="${esc(x.id)}" aria-pressed="${x.tags.includes(t)}">${esc(t)}</button>`).join('')}</div>
      <p class="mt-3 text-xs font-semibold text-ink-muted">자세히 적어 주세요</p>
      <textarea rows="2" maxlength="${SURVEY_CONFIG.reasonMax}" data-reason="${key}" data-id="${esc(x.id)}" class="field mt-1 resize-y" aria-label="${esc(q.reasonLabel.replace('{name}', c ? c.name : ''))}" placeholder="${esc(q.placeholder)}">${esc(x.text)}</textarea>
    </div>`;
  }).join('');
}

function bindSurveyEvents() {
  const sv = S.sv, root = $('#sv-questions');
  paintClimate();
  root.addEventListener('click', e => {
    if (sv.done || sv.submitting) return;
    const tag = e.target.closest('[data-tag]');
    if (tag) {
      const it = sv.answers[tag.dataset.tq].find(x => x.id === tag.dataset.id), t = tag.dataset.tag, k = it.tags.indexOf(t);
      if (k >= 0) it.tags.splice(k, 1); else it.tags.push(t);
      tag.setAttribute('aria-pressed', k < 0);
      document.querySelector(`[data-qerr="${tag.dataset.tq}"]`).classList.add('hidden');
      setDirty(true);
      return;
    }
    const pill = e.target.closest('[data-pick]');
    if (pill && !pill.disabled) {
      const key = pill.dataset.pick, id = pill.dataset.id, q = questionOf(key);
      const list = sv.answers[key], i = list.findIndex(x => x.id === id);
      if (i >= 0) list.splice(i, 1);
      else if (list.length >= q.max) return toast(`${q.max}명까지 고를 수 있어요`, true);
      else list.push({ id, tags: [], text: '' });
      renderPills(key); renderReasons(key);
      if (key === 'positive') renderPills('negative');
      if (key === 'negative') renderPills('positive');
      document.querySelector(`[data-qerr="${key}"]`).classList.add('hidden');
      // 다시 그린 뒤에도 키보드 위치를 잃지 않도록 같은 이름 버튼에 초점을 돌려줍니다
      const again = document.querySelector(`[data-pick="${key}"][data-id="${CSS.escape(id)}"]`);
      if (again) again.focus({ preventScroll: true });
      setDirty(true);
      return;
    }
    const cl = e.target.closest('[data-climate]');
    if (cl) { sv.climate = Number(cl.dataset.climate); paintClimate(); document.querySelector('[data-qerr="climate"]').classList.add('hidden'); setDirty(true); }
  });
  root.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.reason) { const it = sv.answers[t.dataset.reason].find(x => x.id === t.dataset.id); if (it) it.text = t.value; }
    if (t.id === 'sv-climate-reason') sv.climateReason = t.value;
    setDirty(true);
  });
  $('#sv-submit').onclick = submitSurveyAnswers;
}

/** 제출 전 확인: 고른 친구마다 분류 태그와 자세한 이유가 있는지, 분위기 점수를 골랐는지 */
function validateSurvey() {
  const sv = S.sv, errs = [];
  const nm = id => (sv.classmates.find(c => c.id === id) || {}).name;
  const ce = document.querySelector('[data-qerr="climate"]');
  if (!sv.climate) { ce.textContent = '우리 반 분위기 점수를 하나 골라 주세요.'; ce.classList.remove('hidden'); errs.push('climate'); }
  else ce.classList.add('hidden');
  SURVEY_CONFIG.questions.forEach(q => {
    const noTag = sv.answers[q.key].filter(x => !x.tags.length).map(x => nm(x.id));
    const noText = sv.answers[q.key].filter(x => !x.text.trim()).map(x => nm(x.id));
    const el = document.querySelector(`[data-qerr="${q.key}"]`);
    const msg = [noTag.length ? `${noTag.join(', ')}: 이유 분류를 하나 이상 골라 주세요.` : '', noText.length ? `${noText.join(', ')}: 자세한 이유를 적어 주세요.` : ''].filter(Boolean).join(' ');
    if (msg) { el.textContent = msg; el.classList.remove('hidden'); errs.push(q.key); }
    else el.classList.add('hidden');
  });
  if (errs.length) document.querySelector(`[data-q="${errs[0]}"]`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  return !errs.length;
}

async function submitSurveyAnswers() {
  const sv = S.sv;
  if (!sv || sv.submitting || sv.done) return;
  if (!validateSurvey()) return toast('빠진 답이 있어요. 빨간 글씨를 확인해 주세요.', true);
  const picked = SURVEY_CONFIG.questions.reduce((n, q) => n + sv.answers[q.key].length, 0);
  if (!sv.answers.positive.length && !(await mConfirm('2번에서 친구를 고르지 않았어요', '요즘 함께 즐겁게 지내는 친구가 아직 없다면 그대로 제출해도 괜찮아요.', { ok: '그대로 제출', cancel: '다시 볼게요' }))) return;
  if (!(await mConfirm('설문을 제출할까요?', `고른 친구 ${picked}명, 우리 반 분위기 ${climateLabel(sv.climate)}\n제출하면 답을 다시 불러올 수 없어요. 고칠 게 생기면 선생님께 수정 권한을 요청해야 해요.`, { ok: '제출하기' }))) return;
  const btn = $('#sv-submit');
  sv.submitting = true;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>제출하는 중';
  $('#sv-exit').disabled = true;   // 제출하는 동안 나가면 학생 정보가 비어 버립니다
  let outcome;
  try { outcome = await submitWithProof(sv); }
  finally {
    sv.submitting = false;
    $('#sv-exit').disabled = false;
    if (btn.isConnected) { btn.disabled = false; btn.textContent = '응답 제출'; }
  }
  if (outcome === 'done') return showSurveyDone();
  if (outcome === 'cancelled') return;
  const [title, message] = SUBMIT_FAILURES[outcome] || SUBMIT_FAILURES.network;
  await mAlert(title, message);
  if (['closed', 'locked', 'roster'].includes(outcome)) endSurveyPanel(title, message);
}

const SUBMIT_FAILURES = {
  closed: ['설문이 마감됐어요', '마감 시각이 지나 제출하지 못했어요.'],
  roster: ['명단에서 찾지 못했어요', '반 명단에서 내 학번을 찾지 못해 제출하지 못했어요. 선생님께 알려 주세요.'],
  locked: ['이미 제출한 설문이에요', '고치려면 선생님께 수정 권한을 요청해 주세요.'],
  pin: ['PIN을 확인하지 못했어요', '선생님이 PIN을 초기화했다면 [나가기]를 누르고 다시 들어와 새 PIN을 정해 주세요.'],
  network: ['제출하지 못했어요', '인터넷 연결을 확인하고 다시 [응답 제출]을 눌러 주세요.']
};

/** 저장된 증명값으로 제출하고, PIN 때문에 거부되면 PIN을 한 번 더 받아 다시 시도합니다 → 'done' | 'cancelled' | 실패 이유 */
async function submitWithProof(sv) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const proof = await getSubmitProof(sv, attempt > 0);
    if (!proof) return 'cancelled';
    try {
      await commitSurvey(sv, proof);
      return 'done';
    } catch (err) {
      console.error('설문 제출 실패:', err);
      const reason = await diagnoseSubmitError(sv, err);
      if (reason !== 'pin' || attempt > 0) return reason;
    }
  }
  return 'pin';
}

/** 제출용 PIN 증명값: 게스트는 입장 때 만든 값, 본인 기기는 room-auth가 저장한 값, 없으면 PIN을 한 번 더 받습니다 */
async function getSubmitProof(sv, askAgain) {
  const key = sv.studentKey;
  if (!askAgain) {
    if (guestProof && guestProof.key === key) return guestProof.proof;
    const owner = getPhoneOwnerAuth();
    if (!sv.isGuest && owner && makeStudentKey(owner.school, owner.studentId) === key) return owner.proof;
  }
  const r = await mForm({
    title: 'PIN 확인',
    message: askAgain ? 'PIN을 확인하지 못했어요. 이 학번의 4자리 PIN을 다시 입력해 주세요.' : '제출하려면 이 학번의 4자리 PIN을 한 번 더 입력해 주세요.',
    fields: [{ name: 'pin', label: '4자리 PIN', type: 'password', inputmode: 'numeric', maxlength: 4 }],
    submit: '확인',
    onSubmit: async v => (/^\d{4}$/.test(v.pin) ? { pin: v.pin } : { error: 'PIN은 숫자 4자리예요.' })
  });
  if (!r || !r.pin) return null;
  const proof = await derivePinProof(r.pin, key);
  if (sv.isGuest) guestProof = { key, proof };
  return proof;
}

async function commitSurvey(sv, proof) {
  const deviceFp = await deriveDeviceFingerprint(getDeviceId());
  const responseId = `${sv.month}_${sv.studentId}`;
  const list = key => sv.answers[key].map(x => ({ id: x.id, tags: x.tags.slice(), text: x.text.trim().slice(0, SURVEY_CONFIG.reasonMax) }));
  const batch = writeBatch(db);
  // ① PIN 게이트 갱신 — 기존 student_auth 규칙이 증명값을 PIN 해시와 대조합니다
  batch.set(doc(db, 'student_auth', sv.studentKey, 'gate', deviceFp), { proof, at: serverTimestamp() });
  // ② 응답 — 선생님만 읽습니다
  batch.set(doc(db, COLLECTION, sv.roomCode, 'responses', responseId), {
    month: sv.month, studentId: sv.studentId, deviceFp,
    climate: sv.climate, climateReason: sv.climateReason.trim().slice(0, SURVEY_CONFIG.climateReasonMax),
    positive: list('positive'), negative: list('negative'),
    submittedAt: serverTimestamp()
  });
  // ③ 제출 표시 — 학생 화면이 '이미 제출'을 알 수 있도록 내용 없이 여부만
  batch.set(doc(db, COLLECTION, sv.roomCode, 'receipts', responseId), { month: sv.month, studentId: sv.studentId, submittedAt: serverTimestamp(), editAllowed: false });
  await batch.commit();
}

/** 제출이 거부된 이유를 다시 읽어 구분합니다: closed · roster · locked · pin · network */
async function diagnoseSubmitError(sv, err) {
  if (!isPermissionError(err)) return 'network';
  try {
    const snap = await getDoc(doc(db, COLLECTION, sv.roomCode));
    if (!snap.exists()) return 'closed';
    const room = snap.data(), me = room.roster && room.roster[sv.studentId];
    if (!me || me.active === false) return 'roster';
    const period = room.months && room.months[sv.month], closeAt = timestampMillis(period && period.closeAt);
    if (!period || period.status !== 'open' || (closeAt && closeAt <= Date.now())) return 'closed';
    const receipt = await getDoc(doc(db, COLLECTION, sv.roomCode, 'receipts', `${sv.month}_${sv.studentId}`));
    if (receipt.exists() && !receipt.data().editAllowed) return 'locked';
  } catch (checkErr) {
    console.warn('제출 실패 원인 확인 실패:', checkErr);
    return 'network';
  }
  return 'pin';
}

function showSurveyDone() {
  const sv = S.sv;
  setDirty(false);
  sv.done = true;
  clearTimeout(surveyCloseTimer);
  $('#sv-panel').innerHTML = `
    <div class="px-2 py-10 text-center">

      <button id="sv-home" type="button" class="btn btn-ghost mt-8 px-6 py-3">처음으로</button>
    </div>`;
  window.scrollTo(0, 0);
  $('#sv-home').onclick = goHomeFromSurvey;
}

/** 마감 · 이미 제출 · 명단 밖처럼 더 쓸 수 없을 때 설문지를 안내로 바꿉니다 */
function endSurveyPanel(title, message) {
  setDirty(false);
  S.sv.done = true;
  clearTimeout(surveyCloseTimer);
  $('#sv-panel').innerHTML = `
    <div class="px-2 py-10 text-center">
      <p class="text-4xl" aria-hidden="true">🔒</p>
      <h2 class="mt-4 text-xl font-extrabold">${esc(title)}</h2>
      <p class="mt-2 leading-relaxed text-ink-muted">${esc(message)}</p>
      <button id="sv-home" type="button" class="btn btn-ghost mt-8 px-6 py-3">처음으로</button>
    </div>`;
  $('#sv-home').onclick = goHomeFromSurvey;
}

/** 쓰는 도중 마감 예약 시각이 되면 설문지를 닫습니다 */
function armSurveyClose() {
  clearTimeout(surveyCloseTimer);
  const sv = S.sv;
  if (!sv || !sv.closeAt) return;
  surveyCloseTimer = setTimeout(() => {
    if (S.sv !== sv || sv.done) return;
    if (Date.now() < sv.closeAt) return armSurveyClose();
    if (sv.submitting) return;
    endSurveyPanel('설문이 마감됐어요', '마감 시각이 지나 더 이상 제출할 수 없어요.');
  }, Math.max(0, Math.min(sv.closeAt - Date.now(), 2147483647)));
}

/* ═══════════════════════════════════════════════════════════════
 *  8. 교사: 진입 · 반 줄 · 도구 줄(달 선택 · 마감 · 삭제) · 탭

const monthPath = (month, field) => (field ? new FieldPath('months', month, field) : new FieldPath('months', month));

function renderRoomOptions() {
  const list = $('#roomSelect'), schoolSelect = $('#admin-school');
  let visible = S.rooms;
  if (S.teacher && S.teacher.isAdmin) {
    const unspecified = '__unspecified__';
    const schoolOf = r => String(r.data.creatorSchool || '').trim() || unspecified;
    const schools = [...new Set(S.rooms.map(schoolOf))].sort((a, b) => a.localeCompare(b, 'ko'));
    const selected = schoolSelect.value;
    schoolSelect.innerHTML = '<option value="">전체 학교</option>' + schools.map(s => `<option value="${esc(s)}">${esc(s === unspecified ? '학교 미지정' : s)}</option>`).join('');

  $('#room-count').textContent = `${S.rooms.length}개 반`;

async function loadTeacherRooms() {

function renderTeacherEmpty() {

async function selectRoom(code) {
  if (unsubRoomStudents) { unsubRoomStudents(); unsubRoomStudents = null; }

  closeDrawer();
  $('#roomSelect').value = code || '';

  renderToolbar();

  $('#teacher-empty').hidden = true;

  if (S.roomCode !== code) return;

    renderGuestApprovals(snap.docs.map(d => ({ nickname: d.id, ...d.data() })));
  }, err => console.error('게스트 학생 목록 조회 실패:', err));

/** 반 문서 · 응답 · 제출 표시를 한 번에 읽습니다. 실시간이 아니라 반을 고를 때와 [새로고침]을 누를 때 읽습니다. */
async function loadRoomData() {
  const code = S.roomCode;
  if (!code || S.demo) return;
  loading(true, '관계지도를 그리는 중');
  let failure = null;
  try {
    const [roomSnap, responseSnap, receiptSnap] = await Promise.all([
      getDoc(roomRef(code)),
      getDocs(collection(db, COLLECTION, code, 'responses')),
      getDocs(collection(db, COLLECTION, code, 'receipts'))
    ]);
    if (S.roomCode === code) {
      if (!roomSnap.exists()) throw new Error('선택한 반을 찾을 수 없어요.');
      const room = roomSnap.data();
      if (!S.teacher.isAdmin && room.createdBy !== S.user.uid) throw new Error('이 반을 관리할 권한이 없어요.');
      S.room = room;
      S.responses = responseSnap.docs.map(d => d.data());
      S.receipts = Object.fromEntries(receiptSnap.docs.map(d => [d.id, d.data()]));
      S.loadedAt = Date.now();
    }
  } catch (err) { failure = err; }
  loading(false);
  if (S.roomCode !== code) return;
  if (failure) {
    console.error('반 정보 불러오기 실패:', failure);
    return mAlert('데이터를 불러오지 못했어요', failText(failure, '다시 시도해 주세요.'));
  }
  refreshDashboard();
}

function refreshDashboard() {
  S.model = buildModel(S.room, S.responses, S.receipts);
  S.ctx = buildContext(S.model, S.month);
  S.month = S.ctx.month;
  S.trend = buildTrend(S.model, S.ctx);
  if (S.focusId && !(S.ctx.cur && S.ctx.cur.stats[S.focusId])) S.focusId = null;
  S.netDirty = true;
  $('#workspace').hidden = false;
  $('#teacher-empty').hidden = true;
  renderToolbar();
  renderTab(S.tab);
  if (drawerId) { if (S.ctx.cur && S.ctx.cur.stats[drawerId]) openDrawer(drawerId); else closeDrawer(); }
}

/** 도구 줄: ‹ 달 선택 › · 진행 상태 · [마감하기]/[다시 열기] · 응답 수 · [설문 삭제] */
function renderToolbar() {
  const ms = S.model ? S.model.months : [], i = ms.findIndex(x => x.month === S.month), cur = ms[i];
  $('#month-bar').hidden = !S.room;
  if (!S.room) return;
  $('#month-select').innerHTML = ms.length
    ? ms.map(x => `<option value="${x.month}" ${x.month === S.month ? 'selected' : ''}>${monthLabel(x.month)}</option>`).join('')
    : '<option value="">설문 달 없음</option>';
  $('#month-select').disabled = !ms.length;
  $('#m-prev').disabled = i <= 0;
  $('#m-next').disabled = i < 0 || i >= ms.length - 1;
  $('#tb-time').textContent = S.demo ? '예시 데이터' : S.loadedAt ? `${scheduleLabel(S.loadedAt)} 기준` : '';
  const st = $('#tb-status'), tg = $('#tb-toggle');
  if (!cur) { st.textContent = ''; st.hidden = true; tg.hidden = true; $('#tb-count').hidden = true; $('#tb-delete').disabled = true; return; }
  const open = cur.status === 'open';
  st.hidden = false;
  st.className = `rounded-full px-3 py-1 text-xs font-bold ${open ? 'bg-board-soft text-board' : 'bg-page text-ink-muted ring-1 ring-line'}`;
  st.textContent = open ? (cur.closeAt ? `진행 중 · ${scheduleLabel(cur.closeAt)} 마감 예약` : '진행 중') : (cur.saved === 'open' && cur.closeAt ? '마감 (예약 시각 지남)' : '마감');
  tg.hidden = S.demo;
  tg.textContent = open ? '마감하기' : '다시 열기';
  $('#tb-count').hidden = false;
  $('#tb-count').textContent = `응답 ${S.ctx.cur.responded} / ${S.ctx.cur.total}명`;
  $('#tb-delete').disabled = S.demo;
}
$('#month-select').addEventListener('change', e => { S.month = e.target.value; refreshDashboard(); });
$('#m-prev').addEventListener('click', () => { const ms = S.model.months, i = ms.findIndex(x => x.month === S.month); if (i > 0) { S.month = ms[i - 1].month; refreshDashboard(); } });
$('#m-next').addEventListener('click', () => { const ms = S.model.months, i = ms.findIndex(x => x.month === S.month); if (i < ms.length - 1) { S.month = ms[i + 1].month; refreshDashboard(); } });

/** 반 문서의 여러 칸을 한 번에 고치고 다시 읽습니다 */
async function updateRoomFields(changes, okMessage, failTitle) {
  loading(true, '저장하는 중');
  let failure = null;
  try { await updateDoc(roomRef(), ...changes, 'updatedAt', serverTimestamp()); }
  catch (err) { failure = err; }
  loading(false);
  if (failure) {
    console.error(failTitle, failure);
    await mAlert(failTitle, failText(failure, '다시 시도해 주세요.'));
    return false;
  }
  if (okMessage) toast(okMessage);
  await loadRoomData();
  return true;
}

/** 이 달을 열고, 진행 중인 다른 달은 마감합니다 (학생은 한 번에 한 달만 응답) */
function openMonthChanges(month, extra) {
  const changes = [monthPath(month), Object.assign({ status: 'open', closeAt: null }, extra || {})];
  S.model.months.filter(x => x.saved === 'open' && x.month !== month)
    .forEach(x => changes.push(monthPath(x.month, 'status'), 'closed', monthPath(x.month, 'closeAt'), null));
  return changes;
}

$('#tb-toggle').addEventListener('click', async () => {
  const cur = S.model && S.model.months.find(x => x.month === S.month);
  if (!cur || S.demo) return;
  if (cur.status !== 'open') {
    const other = S.model.months.find(x => x.status === 'open' && x.month !== cur.month);
    if (!(await mConfirm(`${monthLabel(cur.month)} 설문을 다시 열까요?`, other ? `진행 중인 ${monthLabel(other.month)} 설문은 자동으로 마감돼요.` : '학생들이 다시 응답할 수 있어요. 이미 제출한 학생은 수정 권한이 있어야 다시 낼 수 있어요.', { ok: '다시 열기' }))) return;
    const changes = openMonthChanges(cur.month);
    changes.splice(0, 2, monthPath(cur.month, 'status'), 'open', monthPath(cur.month, 'closeAt'), null);   // 시작 시각은 그대로 둡니다
    await updateRoomFields(changes, '설문을 다시 열었어요', '설문을 열지 못했어요');
    return;
  }
  openCloseModal(cur);
});

/** 마감 창: 예약을 켜면 날짜·시간을 고르고, 끄면 바로 마감 */
function openCloseModal(cur) {
  const scheduled = cur.status === 'open' && cur.closeAt ? cur.closeAt : 0;
  const tomorrow = new Date(Date.now() + 24 * 3600 * 1000);
  tomorrow.setHours(18, 0, 0, 0);
  openModal(`<h3 class="text-lg font-extrabold">${esc(monthLabel(cur.month))} 설문 마감</h3>
    <label class="mt-4 flex cursor-pointer items-center justify-between gap-3 rounded-lg border border-line px-3 py-2.5 text-sm font-bold">
      <span>예약 마감 사용</span><input id="cs-toggle" type="checkbox" class="h-5 w-5 accent-[#24493D]" ${scheduled ? 'checked' : ''}></label>
    <div id="cs-field" ${scheduled ? '' : 'hidden'} class="mt-3">
      <label class="field-label" for="cs-when">마감 날짜와 시간</label>
      <input id="cs-when" type="datetime-local" class="field" value="${esc(toLocalDateTimeInput(scheduled || tomorrow.getTime()))}">
      <p class="mt-2 text-xs leading-relaxed text-ink-muted">예약 시각이 지나면 새 응답과 수정이 막혀요.</p>
    </div>
    <p id="cs-hint" ${scheduled ? 'hidden' : ''} class="mt-2 text-xs leading-relaxed text-ink-muted">예약을 끄면 확인 후 바로 마감돼요. 마감한 뒤에도 [다시 열기]로 열 수 있어요.</p>
    <p id="cs-err" class="mt-2 hidden text-sm font-semibold text-stamp" role="alert"></p>
    <div class="mt-6 flex flex-wrap gap-2">
      ${scheduled ? '<button type="button" id="cs-clear" class="btn btn-ghost mr-auto">예약 취소</button>' : ''}
      <button type="button" data-close="" class="btn btn-ghost">취소</button>
      <button type="button" id="cs-save" class="btn btn-primary">${scheduled ? '예약 저장' : '바로 마감'}</button>
    </div>`, {
    onMount: (w, close) => {
      const tog = w.querySelector('#cs-toggle'), save = w.querySelector('#cs-save'), err = w.querySelector('#cs-err');
      const sync = () => { w.querySelector('#cs-field').hidden = !tog.checked; w.querySelector('#cs-hint').hidden = tog.checked; save.textContent = tog.checked ? '예약 저장' : '바로 마감'; };
      tog.addEventListener('change', sync);
      const done = async (changes, msg) => {
        save.disabled = true;
        const ok = await updateRoomFields(changes, msg, '마감 설정을 저장하지 못했어요');
        save.disabled = false;
        if (ok) close(true);
      };
      save.addEventListener('click', () => {
        if (!tog.checked) return done([monthPath(cur.month, 'status'), 'closed', monthPath(cur.month, 'closeAt'), null], `${monthLabel(cur.month)} 설문을 마감했어요`);
        const when = new Date(w.querySelector('#cs-when').value);
        if (!Number.isFinite(when.getTime()) || when.getTime() <= Date.now()) { err.textContent = '마감 날짜와 시간은 지금보다 뒤로 정해 주세요.'; err.classList.remove('hidden'); return; }
        done([monthPath(cur.month, 'status'), 'open', monthPath(cur.month, 'closeAt'), Timestamp.fromDate(when)], `${scheduleLabel(when.getTime())}에 마감되도록 예약했어요`);
      });
      const clear = w.querySelector('#cs-clear');
      if (clear) clear.addEventListener('click', () => done([monthPath(cur.month, 'closeAt'), null], '마감 예약을 취소했어요'));
    }
  });
}

/** 설문 삭제: 이 달의 설문과 응답을 모두 지움 (달 이름을 그대로 입력해야 실행) */
$('#tb-delete').addEventListener('click', async () => {
  const month = S.month, label = monthLabel(month);
  if (!month || S.demo) return;
  const count = S.model.submits.filter(x => x.month === month).length;
  const r = await mForm({
    title: `${label} 설문을 삭제할까요?`,
    message: `${label}의 설문과 학생 응답 ${count}명분이 모두 지워져요. 되돌릴 수 없으니 먼저 [📋 학생 응답] 탭의 [응답 엑셀]로 내려받아 두길 권해요. 계속하려면 아래 칸에 “${label}”을 그대로 입력하세요.`,
    fields: [{ name: 'confirm', label: '확인 입력', placeholder: label, maxlength: 20 }],

      catch (err) { console.error('설문 달 삭제 실패:', err); return { error: failText(err, '삭제하지 못했어요.') }; }
    }
  });

  closeDrawer();
  toast(`${label} 설문을 삭제했어요`);
  S.month = '';
  await loadRoomData();

async function deleteMonthData(month) {
  for (const sub of ['responses', 'receipts']) {
    const snap = await getDocs(query(collection(db, COLLECTION, S.roomCode, sub), where('month', '==', month)));
    for (let start = 0; start < snap.docs.length; start += 400) {
      const batch = writeBatch(db);
      snap.docs.slice(start, start + 400).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
  }
  await updateDoc(roomRef(), monthPath(month), deleteField(), 'updatedAt', serverTimestamp());
}

/* ── 새 반 · 반 삭제 ── */
function makeRoomCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 4 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
}

async function createRoom(memo, startNow) {
  const month = currentMonthKey();
  const data = {
    createdBy: S.user.uid,                  // ★ 보안 규칙 필수 필드
    creatorName: S.teacher.name,
    creatorSchool: S.teacher.school,        // ★ 규칙: 내 teachers 문서의 학교와 같아야 합니다 (관리자 제외)
    roomMode: 'auth',                        // ★ 학번·PIN 인증만 씁니다
    memo,
    roster: {},
    months: startNow ? { [month]: { status: 'open', openedAt: serverTimestamp(), closeAt: null } } : {},
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };
  for (let attempt = 0; attempt < 8; attempt++) {
    const code = makeRoomCode();
    try {
      await runTransaction(db, async tx => {
        const ref = roomRef(code);
        if ((await tx.get(ref)).exists()) throw new Error('ROOM_CODE_TAKEN');
        tx.set(ref, data);
      });
      return code;
    } catch (err) {
      if (err.message !== 'ROOM_CODE_TAKEN') throw err;
    }
  }
  throw new Error('반 코드를 만들지 못했어요. 다시 시도해 주세요.');
}

async function removeRoom(code) {
  // Firestore는 문서를 지워도 하위 컬렉션이 남으므로 하위 문서부터 지웁니다 (규칙이 반 문서를 읽으므로 반 문서는 마지막에)
  for (const sub of ['responses', 'receipts', 'students', 'guests']) {
    const snap = await getDocs(collection(db, COLLECTION, code, sub));
    for (let start = 0; start < snap.docs.length; start += 400) {
      const batch = writeBatch(db);
      snap.docs.slice(start, start + 400).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
  }
  await deleteDoc(roomRef(code));
}
