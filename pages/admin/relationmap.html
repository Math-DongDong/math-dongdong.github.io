/* ── 탭 ── */
function renderTabbar() {
  $('#tabbar').innerHTML = TABS.map(([key, label]) => `<button type="button" class="ws-tab" role="tab" data-tab="${key}" aria-controls="tab-${key}" aria-selected="${S.tab === key}" tabindex="${S.tab === key ? 0 : -1}">${label}</button>`).join('');
}
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) renderTab(b.dataset.tab); });
$('#tabbar').addEventListener('keydown', e => {
  const moves = { ArrowRight: 1, ArrowLeft: -1 };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const i = TABS.findIndex(([k]) => k === S.tab);
  renderTab(TABS[(i + moves[e.key] + TABS.length) % TABS.length][0]);
  const b = $(`#tabbar [data-tab="${S.tab}"]`);
  if (b) b.focus();
});
function renderTab(tab) {
  S.tab = TABS.some(([k]) => k === tab) ? tab : 'map';
  document.querySelectorAll('#tabbar [data-tab]').forEach(b => { const on = b.dataset.tab === S.tab; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  TABS.forEach(([k]) => $(`#tab-${k}`).classList.toggle('hidden', k !== S.tab));
  if (!S.model) return;
  if (S.tab === 'map') renderMapTab();
  if (S.tab === 'responses') renderResponsesTab();
  if (S.tab === 'manage') renderManageTab();
}

/* ═══════════════════════════════════════════════════════════════
 *  9. 교사: 관계지도 탭 (통계 · 보기 방식 · 필터 · 칠판 지도 · 범례 · 살펴볼 점)
 * ═══════════════════════════════════════════════════════════════ */
function renderMapTab() {
  const cur = S.ctx && S.ctx.cur;
  $('#map-empty').hidden = !!cur;
  $('#map-body').hidden = !cur;
  if (!cur) {
    $('#map-empty').innerHTML = `${activeStudents().length ? '아직 시작한 설문이 없어요.' : '학생 명단과 설문이 아직 없어요. [⚙️ 관리] 탭에서 학생 명단부터 등록하세요.'}
      ${S.demo ? '' : `<div class="mt-4"><button type="button" class="btn btn-primary" data-start-month>${esc(monthLabel(currentMonthKey()))} 설문 시작</button></div>`}`;
    return;
  }
  if (S.mode === 'diff' && !S.ctx.diff) S.mode = 'month';
  document.querySelectorAll('[data-mode]').forEach(b => {
    const on = b.dataset.mode === S.mode;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
    if (b.dataset.mode === 'diff') { b.disabled = !S.ctx.diff; b.title = S.ctx.diff ? '' : '비교할 지난달 설문이 없어요'; }
  });
  $('#map-caption').textContent = S.mode === 'diff'
    ? `${shortMonth(S.ctx.prevMonth)}과 ${shortMonth(S.ctx.month)}에 모두 응답한 ${S.ctx.diff.comparable}명의 선택을 견줘요`
    : '학생을 누르면 자세한 정보가 열려요. 끌어서 자리를 옮길 수 있어요.';
  renderMapStats();
  renderFilters();
  renderNetwork();
  renderLegend();
  renderAlerts();
  renderClimatePanel();
  renderTrendPanel();
}
$('#map-empty').addEventListener('click', e => { if (e.target.closest('[data-start-month]')) startMonth(currentMonthKey()); });
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  if (b.disabled || S.mode === b.dataset.mode) return;
  S.mode = b.dataset.mode;
  renderMapTab();
}));

/** 지난달과 견준 변화 (▲ 좋아짐 · ▼ 나빠짐) */
function deltaOf(key, upIsGood, digits) {
  const now = S.trend.find(t => t.month === S.ctx.month), before = S.ctx.prevMonth && S.trend.find(t => t.month === S.ctx.prevMonth);
  if (!now || !before || now[key] == null || before[key] == null) return null;
  const factor = 10 ** (digits || 0), diff = Math.round((now[key] - before[key]) * factor) / factor;
  if (!diff) return { text: `${shortMonth(S.ctx.prevMonth)}과 같아요`, color: UI.same };
  const good = upIsGood ? diff > 0 : diff < 0;
  return { text: `${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)} (${shortMonth(S.ctx.prevMonth)} 대비)`, color: good ? UI.good : UI.bad };
}

function renderMapStats() {
  const now = S.trend.find(t => t.month === S.ctx.month) || {};
  const stats = [
    ['학급 분위기', now.climateAvg == null ? '–' : `${now.climateAvg}점`, deltaOf('climateAvg', true, 1), '5점 만점'],
    ['서로 친구', `${now.mutual || 0}쌍`, deltaOf('mutual', true), '서로 고른 짝'],
    ['불편 응답', `${now.neg || 0}건`, deltaOf('neg', false), '불편한 친구로 고른 수'],
    ['선택받지 못한 학생', now.isolated == null ? '–' : `${now.isolated}명`, deltaOf('isolated', false), '즐거운 친구로 0명']
  ];
  $('#map-stats').innerHTML = stats.map(([label, value, d, note]) => `<div class="stat">
    <p class="text-xs font-bold text-ink-muted">${label}</p>
    <p class="mt-0.5 text-2xl font-extrabold">${value}</p>
    <p class="mt-0.5 text-xs font-semibold" style="color:${d ? d.color : UI.same}">${esc(d ? d.text : note)}</p></div>`).join('');
}

function renderFilters() {
  const cur = S.ctx.cur;
  const chip = (key, group, label, on) => `<button type="button" class="chip ${on ? 'chip-on' : ''}" data-filter="${key}" data-group="${group}" aria-pressed="${on}">${label}</button>`;
  let html;
  if (S.mode === 'diff') {
    const d = S.ctx.diff;
    const added = d.newPos.length + d.newNeg.length;
    const removed = d.lostPos.concat(d.resolvedNeg).filter(e => cur.stats[e.s] && cur.stats[e.o]).length;
    html = chip('added', 'diff', `새로 생김 ${added}`, S.diffFilters.added) + chip('removed', 'diff', `사라짐 ${removed}`, S.diffFilters.removed) + chip('kept', 'diff', `변화 없음 ${cur.edges.length - added}`, S.diffFilters.kept);
  } else {
    const pos = cur.edges.filter(e => e.pol === POL.POS).length;
    html = chip('pos', 'month', `즐거운 관계 ${pos}`, S.filters.pos) + chip('neg', 'month', `불편한 관계 ${cur.edges.length - pos}`, S.filters.neg) + chip('mutualOnly', 'month', '서로 선택만', S.filters.mutualOnly);
  }
  if (S.focusId) html += `<button type="button" class="chip chip-on" data-filter="focus">✕ ${esc(studentName(S.focusId))} 강조 풀기</button>`;
  $('#map-filters').innerHTML = html;
}
$('#map-filters').addEventListener('click', e => {
  const b = e.target.closest('[data-filter]');
  if (!b) return;
  if (b.dataset.filter === 'focus') return focusStudent(null);
  const group = b.dataset.group === 'diff' ? S.diffFilters : S.filters;
  group[b.dataset.filter] = !group[b.dataset.filter];
  renderFilters();
  renderNetwork();
});

/* ── 칠판 위 관계지도 (vis-network) ──
 *  즐거운 관계만 보이지 않는 '배치용 선'으로 당겨 자리를 잡고(불편한 관계는 끌어당기지 않음),
 *  자리를 잡은 뒤에는 물리 계산을 꺼서 보기 방식·필터를 바꿔도 학생 자리가 움직이지 않습니다. */
const NETWORK_OPTIONS = {
  autoResize: true,
  layout: { improvedLayout: true, randomSeed: 11 },
  interaction: { hover: true, tooltipDelay: 120, dragNodes: true, dragView: true, zoomView: true, keyboard: false, selectConnectedEdges: false },
  physics: {
    enabled: true, solver: 'forceAtlas2Based', minVelocity: 0.8,
    forceAtlas2Based: { gravitationalConstant: -85, centralGravity: 0.01, springLength: 140, springConstant: 0.06, damping: 0.5, avoidOverlap: 0.8 },
    stabilization: { enabled: true, iterations: 600, updateInterval: 40, fit: false }
  },
  nodes: {
    shape: 'dot', borderWidth: 2, borderWidthSelected: 4,
    font: { face: 'Pretendard, sans-serif', size: 15, color: CH.chalk, strokeWidth: 4, strokeColor: CH.board },
    color: { background: CH.deep, border: CH.chalk, highlight: { background: CH.board, border: CH.yellow }, hover: { background: CH.board, border: CH.yellow } }
  },
  edges: { selectionWidth: 1, hoverWidth: 0.6, smooth: { enabled: true, type: 'curvedCW', roundness: 0.16 } }
};

function ensureNetwork() {
  if (S.net) return S.net;
  if (typeof vis === 'undefined') return null;
  S.nodesDS = new vis.DataSet();
  S.edgesDS = new vis.DataSet();
  S.net = new vis.Network($('#network'), { nodes: S.nodesDS, edges: S.edgesDS }, NETWORK_OPTIONS);
  S.net.on('click', p => {
    if (p.nodes.length) { focusStudent(p.nodes[0]); openDrawer(p.nodes[0]); }
    else if (!p.edges.length) focusStudent(null);
  });
  S.net.on('stabilizationIterationsDone', () => { S.net.setOptions({ physics: { enabled: false } }); savePositions(); fitNetwork(false); });
  S.net.on('dragEnd', p => { if (p.nodes.length) savePositions(); });
  return S.net;
}
/** 칠판을 채우도록 맞춤 (vis 기본값은 1배보다 크게 키우지 않아 그림이 작게 모입니다) */
function fitNetwork(animate) {
  if (S.net) S.net.fit({ maxZoomLevel: 1.4, animation: animate ? { duration: 400, easingFunction: 'easeInOutQuad' } : false });
}

const positionKey = () => (S.demo ? 'demo' : S.roomCode);
function loadPositions() {
  const key = positionKey();
  if (!S.positions[key]) {
    let saved = {};
    if (!S.demo) { try { saved = JSON.parse(localStorage.getItem(`relationmap:pos:${key}`) || '{}') || {}; } catch (e) { saved = {}; } }
    S.positions[key] = saved;
  }
  return S.positions[key];
}
function savePositions() {
  if (!S.net) return;
  const key = positionKey(), all = Object.assign({}, loadPositions(), S.net.getPositions());
  S.positions[key] = all;
  if (!S.demo) { try { localStorage.setItem(`relationmap:pos:${key}`, JSON.stringify(all)); } catch (e) { /* 저장 공간이 없어도 지도는 그대로 씁니다 */ } }
}

function renderNetwork() {
  const net = ensureNetwork();
  if (!net) { $('#network').innerHTML = '<p class="p-6 text-sm font-semibold text-chalk">관계지도 도구를 불러오지 못했어요. 페이지를 새로고침해 주세요.</p>'; return; }
  const edges = buildLayoutEdges().concat(buildEdges());
  if (S.netDirty) {
    S.netDirty = false;
    const nodes = buildNodes(loadPositions(), false);
    const needsLayout = nodes.some(n => n.x === undefined);
    net.setOptions({ physics: { enabled: needsLayout } });
    S.nodesDS.clear(); S.edgesDS.clear();
    S.nodesDS.add(nodes);
    S.edgesDS.add(edges);
    if (needsLayout) net.stabilize(600); else fitNetwork(false);
    return;
  }
  S.nodesDS.update(buildNodes(null, true));   // 모양만 바꾸고 자리는 그대로
  S.edgesDS.clear();
  S.edgesDS.add(edges);
}

/** 강조 중인 학생과 선으로 이어진 학생 */
function focusNeighbors() {
  const set = new Set();
  if (!S.focusId) return set;
  const list = S.ctx.cur.edges.concat(S.mode === 'diff' ? S.ctx.diff.lostPos.concat(S.ctx.diff.resolvedNeg) : []);
  list.forEach(e => { if (e.s === S.focusId) set.add(e.o); if (e.o === S.focusId) set.add(e.s); });
  return set;
}

function buildNodes(positions, styleOnly) {
  const cur = S.ctx.cur, anyResponse = cur.responded > 0, near = focusNeighbors();
  return activeStudents().map(st0 => {
    const st = cur.stats[st0.id], isolated = anyResponse && st.recvPos === 0, focused = S.focusId === st0.id;
    const border = focused ? CH.yellow : isolated ? CH.orange : st.responded ? CH.chalk : CH.muted;
    const node = {
      id: st0.id,
      label: isolated ? `${st0.name} ⚠` : st0.name,
      title: tooltip([`${st0.number ? `${st0.number}번 ` : ''}${st0.name}`, `즐거운 친구로 ${st.recvPos}명에게 선택받음`, `서로 친구 ${st.mutual}명 · 불편 지목 ${st.recvNeg}명`,
        st.responded ? `학급 분위기 ${st.climate || '–'}점` : '아직 응답하지 않았어요', isolated ? '⚠ 즐거운 친구로 선택받지 못했어요' : '']),
      size: 13 + Math.min(st.recvPos, 6) * 2.2,
      borderWidth: focused ? 5 : isolated ? 3 : 2,
      color: { background: focused ? CH.board : CH.deep, border, highlight: { background: CH.board, border: CH.yellow }, hover: { background: CH.board, border: CH.yellow } },
      shapeProperties: { borderDashes: st.responded ? false : [4, 4] },
      font: { color: st.responded ? CH.chalk : CH.muted },
      opacity: S.focusId && !focused && !near.has(st0.id) ? 0.22 : 1
    };
    if (!styleOnly && positions && positions[st0.id]) { node.x = positions[st0.id].x; node.y = positions[st0.id].y; }
    return node;
  });
}

/** 배치용 선: 즐거운 관계만, 서로 고르거나 먼저 고를수록 가깝게 (그리지는 않음) */
function buildLayoutEdges() {
  const weight = new Map();
  S.ctx.cur.edges.forEach(e => {
    if (e.pol !== POL.POS) return;
    const key = e.s < e.o ? `${e.s}|${e.o}` : `${e.o}|${e.s}`;
    weight.set(key, (weight.get(key) || 0) + Math.max(1, 4 - e.rank));
  });
  return [...weight.entries()].map(([key, w]) => { const [a, b] = key.split('|'); return { id: `L|${key}`, from: a, to: b, hidden: true, physics: true, length: Math.max(70, 150 - w * 14) }; });
}

/** 보이는 선: 이번 달(즐거움 파랑 · 서로 친구 노랑 · 불편 빨강 점선) / 비교(굵은 선 새로 생김 · 점선 사라짐 · 회색 변화 없음) */
function buildEdges() {
  const cur = S.ctx.cur, out = [];
  const key = e => `${e.s}|${e.o}|${e.pol}`;
  const why = e => [e.tags && e.tags.length ? `[${e.tags.join(', ')}]` : '', e.text ? `“${e.text}”` : ''].filter(Boolean).join(' ');
  const push = (item, a, b, alpha) => {
    const color = item.colorHex, faded = S.focusId && a !== S.focusId && b !== S.focusId;
    delete item.colorHex;
    item.color = { color, highlight: color, hover: color, opacity: (alpha == null ? 1 : alpha) * (faded ? 0.07 : 1) };
    item.physics = false;
    out.push(item);
  };
  if (S.mode === 'diff') {
    const d = S.ctx.diff, added = new Set(d.newPos.concat(d.newNeg).map(key));
    cur.edges.forEach(e => {
      const isPos = e.pol === POL.POS, isNew = added.has(key(e));
      if (!S.diffFilters[isNew ? 'added' : 'kept']) return;
      push({
        id: `d|${key(e)}`, from: e.s, to: e.o, colorHex: isNew ? (isPos ? CH.posBlue : CH.red) : CH.gray,
        width: isNew ? 2.8 : 1.1, dashes: isPos ? false : [6, 5], arrows: { to: { enabled: true, scaleFactor: isNew ? 0.6 : 0.45 } },
        title: tooltip([`${studentName(e.s)} → ${studentName(e.o)}`, `${isPos ? '즐겁게 지냄' : '불편함을 느낌'} · ${isNew ? '이번 달에 새로 생겼어요' : '지난달에도 있었거나 견줄 자료가 없어요'}`, why(e)])
      }, e.s, e.o, isNew ? 1 : 0.55);
    });
    if (S.diffFilters.removed) {
      d.lostPos.concat(d.resolvedNeg).forEach(e => {
        if (!cur.stats[e.s] || !cur.stats[e.o]) return;
        const isPos = e.pol === POL.POS;
        push({
          id: `r|${key(e)}`, from: e.s, to: e.o, colorHex: isPos ? CH.posBlue : CH.red, width: 1.5, dashes: [2, 6],
          arrows: { to: { enabled: true, scaleFactor: 0.45 } },
          title: tooltip([`${studentName(e.s)} → ${studentName(e.o)}`, isPos ? `${shortMonth(d.prevMonth)}에는 즐겁게 지냈는데 이번 달에는 고르지 않았어요` : `${shortMonth(d.prevMonth)}의 불편함이 이번 달에는 사라졌어요`, why(e)])
        }, e.s, e.o, 0.8);
      });
    }
    return out;
  }
  const mutualPos = new Set(cur.mutualPairs.map(p => p.join('|'))), mutualNeg = new Set(cur.mutualNeg.map(p => p.join('|')));
  cur.edges.forEach(e => {
    const isPos = e.pol === POL.POS;
    if (isPos ? !S.filters.pos : !S.filters.neg) return;
    const pairId = e.s < e.o ? `${e.s}|${e.o}` : `${e.o}|${e.s}`;
    if ((isPos ? mutualPos : mutualNeg).has(pairId)) {
      if (e.s > e.o) return;   // 서로 고른 관계는 굵은 선 하나로
      const back = cur.edges.find(x => x.s === e.o && x.o === e.s && x.pol === e.pol);
      push({
        id: `m|${pairId}|${e.pol}`, from: e.s, to: e.o, colorHex: isPos ? CH.yellow : CH.red,
        width: isPos ? 3.6 : 3.2, dashes: isPos ? false : [8, 5], arrows: { to: { enabled: false } }, smooth: { enabled: false },
        title: tooltip([`${studentName(e.s)} ↔ ${studentName(e.o)}`, isPos ? '서로 즐겁게 지내는 친구' : '서로 불편함', `${studentName(e.s)}: ${why(e)}`, back ? `${studentName(e.o)}: ${why(back)}` : ''])
      }, e.s, e.o);
      return;
    }
    if (S.filters.mutualOnly) return;
    push({
      id: `e|${key(e)}`, from: e.s, to: e.o, colorHex: isPos ? CH.posBlue : CH.red,
      width: isPos ? 1.7 : 2, dashes: isPos ? false : [6, 5], arrows: { to: { enabled: true, scaleFactor: 0.55 } },
      title: tooltip([`${studentName(e.s)} → ${studentName(e.o)} (${e.rank}순위)`, isPos ? '즐겁게 지냄' : '불편함을 느낌', why(e)])
    }, e.s, e.o);
  });
  return out;
}

$('#btn-fit').addEventListener('click', () => fitNetwork(true));
$('#btn-relayout').addEventListener('click', () => {
  if (!S.net || !S.ctx || !S.ctx.cur) return;
  const key = positionKey();
  S.positions[key] = {};
  if (!S.demo) { try { localStorage.removeItem(`relationmap:pos:${key}`); } catch (e) { /* 무시 */ } }
  S.net.setOptions({ layout: { randomSeed: Math.floor(Math.random() * 100000) } });
  S.netDirty = true;
  renderNetwork();
});

/** 지도에서 한 학생과 그 친구들만 또렷하게 */
function focusStudent(id) {
  S.focusId = id && S.ctx && S.ctx.cur && S.ctx.cur.stats[id] ? id : null;
  if (S.tab === 'map' && S.ctx && S.ctx.cur) { renderFilters(); renderNetwork(); }
}

/** 범례 — 칠판 위 색과 같아 보이도록 작은 칠판 조각 위에 그립니다 */
function renderLegend() {
  const line = (color, o) => {
    o = o || {};
    const arrow = o.arrow !== false;
    return `<span class="inline-flex items-center rounded bg-board px-1.5 py-1" aria-hidden="true"><svg width="30" height="10"><line x1="1" y1="5" x2="${arrow ? 22 : 29}" y2="5" stroke="${color}" stroke-opacity="${o.alpha || 1}" stroke-width="${o.width || 2}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''}/>${arrow ? `<path d="M21,1.5 L29,5 L21,8.5 z" fill="${color}" fill-opacity="${o.alpha || 1}"/>` : ''}</svg></span>`;
  };
  const node = (border, dash) => `<span class="inline-flex items-center rounded bg-board px-1.5 py-0.5" aria-hidden="true"><svg width="16" height="16"><circle cx="8" cy="8" r="5.5" fill="${CH.deep}" stroke="${border}" stroke-width="2" ${dash ? 'stroke-dasharray="3 2"' : ''}/></svg></span>`;
  const items = S.mode === 'diff' ? [
    [line(CH.posBlue, { width: 2.8 }), '새로 생긴 즐거운 관계'],
    [line(CH.red, { width: 2.8, dash: '6 5' }), '새로 생긴 불편한 관계'],
    [line(CH.posBlue, { width: 1.5, dash: '2 6', alpha: 0.8 }), '지난달에만 있던 관계 (점선)'],
    [line(CH.gray, { width: 1.2, alpha: 0.6 }), '변화 없음']
  ] : [
    [line(CH.posBlue, { width: 1.7 }), '즐겁게 지냄 (고른 쪽 → 고른 친구)'],
    [line(CH.yellow, { width: 3.6, arrow: false }), '서로 친구'],
    [line(CH.red, { width: 2, dash: '6 5' }), '불편함을 느낌'],
    [line(CH.red, { width: 3.2, dash: '8 5', arrow: false }), '서로 불편함']
  ];
  items.push([node(CH.chalk), '응답함'], [node(CH.muted, true), '아직 응답 안 함'], [node(CH.orange), '⚠ 즐거운 친구로 선택받지 못함']);
  $('#map-legend').innerHTML = items.map(([k, label]) => `<span class="inline-flex items-center gap-1.5">${k}${esc(label)}</span>`).join('') +
    '<span class="text-ink-muted">· 원이 클수록 즐거운 친구로 많이 선택받았어요</span>';
}

/** 살펴볼 점 (이번 달) · 지난달과 달라진 점 (비교) */
function renderAlerts() {
  const box = $('#map-alerts'), cur = S.ctx.cur;
  const card = (pred, predClass, title, count, body) => `<div class="panel p-4">
    <div class="flex flex-wrap items-center gap-2"><span class="${predClass}">${esc(pred)}</span><h3 class="text-sm font-extrabold">${esc(title)}</h3><span class="ml-auto text-xs font-bold text-ink-muted">${count}</span></div>
    <div class="mt-3 space-y-2.5 text-sm">${body}</div></div>`;
  if (S.mode === 'diff') {
    $('#below-title').textContent = '지난달과 달라진 점';
    const d = S.ctx.diff, h = d.highlights;
    const pair = p => `<span class="inline-flex flex-wrap items-center gap-1">${nameChip(p[0])}<span class="text-ink-muted">↔</span>${nameChip(p[1])}</span>`;
    const edge = e => `<span class="inline-flex flex-wrap items-center gap-1">${nameChip(e.s)}<span class="text-ink-muted">→</span>${nameChip(e.o)}</span>`;
    const group = (pred, cls, title, items, render) => (items.length ? card(pred, cls, title, items.length, `<div class="flex flex-wrap gap-2">${items.map(render).join('')}</div>`) : '');
    const html = [
      group('좋아졌어요', 'pred', '새로 서로 친구가 됐어요', d.newMutual, pair),
      group('좋아졌어요', 'pred', '선택받지 못하다가 선택받았어요', h.escaped, nameChip),
      group('좋아졌어요', 'pred', '즐거운 친구로 2명 이상 더 선택받았어요', h.grew, nameChip),
      group('좋아졌어요', 'pred', '불편함이 풀렸어요', d.resolvedNeg, edge),
      group('좋아졌어요', 'pred', '분위기 점수가 2점 이상 올랐어요', h.climateUp, nameChip),
      group('살펴봐요', 'pred pred-warn', '선택받다가 선택받지 못했어요', h.newIsolated, nameChip),
      group('살펴봐요', 'pred pred-warn', '즐거운 친구로 2명 이상 덜 선택받았어요', h.shrank, nameChip),
      group('살펴봐요', 'pred pred-neg', '불편하다고 지목받는 일이 늘었어요', h.newNegTarget, nameChip),
      group('살펴봐요', 'pred pred-neg', '새로 불편해진 관계', d.newNeg, edge),
      group('살펴봐요', 'pred pred-warn', '서로 친구가 끊겼어요', d.lostMutual, pair),
      group('살펴봐요', 'pred pred-warn', '분위기 점수가 2점 이상 내려갔어요', h.climateDown, nameChip)
    ].join('');
    box.innerHTML = html || '<div class="panel p-5 text-sm text-ink-muted">눈에 띄는 변화가 없어요.</div>';
    return;
  }
  $('#below-title').textContent = '살펴볼 점';
  if (!cur.responded) { box.innerHTML = '<div class="panel p-5 text-sm text-ink-muted">아직 응답이 없어요. 학생들이 제출하면 여기에 살펴볼 점이 정리돼요.</div>'; return; }
  const w = cur.watch;
  const quote = text => (text ? `<p class="mt-1 leading-relaxed">“${esc(text)}”</p>` : '');
  const html = [
    w.sensitive.length ? card('세심한 확인', 'pred pred-neg', '세심한 확인이 필요한 표현', w.sensitive.length, w.sensitive.map(x => `<div>
      <div class="flex flex-wrap items-center gap-1.5">${nameChip(x.s)}${x.o ? `<span class="text-ink-muted">→</span>${nameChip(x.o)}` : ''}<span class="src-badge">${esc(x.where)}</span>${x.hits.map(t => `<span class="pred pred-neg">${esc(t)}</span>`).join('')}</div>${quote(x.text)}</div>`).join('')) : '',
    w.climateLow.length ? card('도움이 필요해 보여요', 'pred pred-warn', '학급 분위기를 1~2점으로 답한 학생', w.climateLow.length, w.climateLow.map(x => `<div>
      <div class="flex flex-wrap items-center gap-1.5">${nameChip(x.id)}<span class="pred pred-warn">${x.score}점</span></div>${quote(x.reason)}</div>`).join('')) : '',
    w.isolated.length ? card('도움이 필요해 보여요', 'pred pred-warn', '즐거운 친구로 선택받지 못한 학생', w.isolated.length, w.isolated.map(x => `<div class="flex flex-wrap items-center gap-1.5">
      ${nameChip(x.id)}${x.responded ? '' : '<span class="src-badge">미응답</span>'}${x.chose.length ? `<span class="text-xs text-ink-muted">이 학생이 고른 친구: ${x.chose.map(o => esc(studentName(o))).join(', ')}</span>` : ''}</div>`).join('')) : '',
    w.conflicts.length ? card('갈등', 'pred pred-neg', '서로 불편함 · 마음이 엇갈림', w.conflicts.length, w.conflicts.map(x => `<div>
      <div class="flex flex-wrap items-center gap-1.5">${nameChip(x.a)}<span class="text-ink-muted">↔</span>${nameChip(x.b)}<span class="${x.type === '서로 불편함' ? 'pred pred-neg' : 'pred pred-warn'}">${esc(x.type)}</span></div>
      ${x.aText ? `<p class="mt-1 text-xs leading-relaxed"><b>${esc(studentName(x.a))}</b> “${esc(x.aText)}”</p>` : ''}${x.bText ? `<p class="text-xs leading-relaxed"><b>${esc(studentName(x.b))}</b> “${esc(x.bText)}”</p>` : ''}</div>`).join('')) : '',
    w.missing.length ? card('미응답', 'src-badge', '아직 응답하지 않은 학생', w.missing.length, `<div class="flex flex-wrap gap-1.5">${w.missing.map(id => nameChip(id)).join('')}</div>`) : ''
  ].join('');
  box.innerHTML = html || '<div class="panel p-5 text-sm text-ink-muted">눈에 띄게 살펴볼 점이 없어요.</div>';
}

function renderClimatePanel() {
  const { dist, avg, count } = S.ctx.cur.climate;
  if (!count) { $('#map-climate').innerHTML = '<p class="text-sm text-ink-muted">아직 응답이 없어요.</p>'; return; }
  const max = Math.max(...dist, 1);
  $('#map-climate').innerHTML = `<p class="text-sm">평균 <b class="text-2xl font-extrabold">${avg}</b>점 <span class="text-xs text-ink-muted">· ${count}명 응답 · 5점 만점</span></p>
    <ul class="mt-3 space-y-2.5">${SURVEY_CONFIG.climate.scale.map(item => {
      const n = dist[item.v - 1];
      return `<li><p class="text-xs"><b>${item.v}점</b> ${esc(item.label)}</p>
        <div class="mt-1 flex items-center gap-2">${n ? `<div class="h-3.5 rounded-r bg-board" style="width:${((n / max) * 82).toFixed(1)}%"></div>` : ''}<span class="text-xs font-bold tabular-nums">${n}명</span></div></li>`;
    }).join('')}</ul>`;
}

function renderTrendPanel() {
  const rows = [
    ['응답', t => `${t.responded}/${t.total}명`],
    ['학급 분위기', t => (t.climateAvg == null ? '–' : `${t.climateAvg}점`)],
    ['서로 친구', t => `${t.mutual}쌍`],
    ['불편 응답', t => `${t.neg}건`],
    ['선택받지 못한 학생', t => (t.isolated == null ? '–' : `${t.isolated}명`)]
  ];
  const here = t => (t.month === S.ctx.month ? ' bg-board-soft/60 font-bold' : '');
  $('#map-trend').innerHTML = `<table class="min-w-full text-sm">
    <thead><tr><th class="th">항목</th>${S.trend.map(t => `<th class="th text-right${here(t)}">${monthLabel(t.month)}<span class="block text-[10px] font-semibold">${t.status === 'open' ? '진행 중' : '마감'}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(([label, value]) => `<tr><th scope="row" class="td text-left text-xs font-bold text-ink-muted">${label}</th>${S.trend.map(t => `<td class="td text-right tabular-nums${here(t)}">${value(t)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

/* ═══════════════════════════════════════════════════════════════
 *  10. 학생 상세정보 Drawer
 * ═══════════════════════════════════════════════════════════════ */
const RULE_INFO = [
  ['', '설문', '학생이 직접 고른 친구예요.'],
  ['역관계', '① 역관계', '다른 친구가 이 학생을 고른 관계예요.'],
  ['상호선택', '② 상호선택', '두 학생이 서로를 골랐어요.'],
  ['엇갈림', '③ 엇갈림', '한쪽은 즐겁다고, 다른 쪽은 불편하다고 답했어요.'],
  ['공통 친구', '④ 공통 친구', '서로 친구인 친구를 함께 둔 두 학생이에요. 다리를 놓아 주기 좋아요.'],
  ['한방향 선택', '⑤ 한방향 선택', '이 학생은 골랐지만 상대는 아직 고르지 않았어요. 연결 기회예요.'],
  ['지난달과 비교', '⑥ 지난달과 비교', '두 달 모두 응답한 학생끼리 견줬어요.']
];
const RULE_ORDER = RULE_INFO.map(r => r[0]);

function factRow(f) {
  const arrow = f.pair ? '↔' : f.rule === '역관계' ? '←' : '→';
  const extra = [];
  if (f.tags && f.tags.length) extra.push(f.tags.map(t => `<span class="src-badge">${esc(t)}</span>`).join(' '));
  if (f.text) extra.push(`<span class="text-ink-muted">“${esc(f.text)}”</span>`);
  if (f.via && f.via.length) extra.push(`<span class="text-ink-muted">공통 친구: ${f.via.map(v => esc(studentName(v))).join(', ')}</span>`);
  const rule = (RULE_INFO.find(r => r[0] === f.rule) || RULE_INFO[0])[1];
  return `<li class="rounded-xl border border-line p-3">
    <div class="flex flex-wrap items-center gap-1.5"><span class="${f.pol === '부정' ? 'pred pred-neg' : 'pred'}">${esc(f.p)}</span><span class="text-ink-muted">${arrow}</span>${nameChip(f.o)}<span class="src-badge ml-auto">${esc(rule)}</span></div>
    ${extra.length ? `<div class="mt-1.5 text-xs leading-relaxed">${extra.join(' ')}</div>` : ''}</li>`;
}

function drawerHtml(id) {
  const ctx = S.ctx, st = ctx.cur.stats[id], who = studentOf(id) || { name: id };
  const picks = pol => S.model.answers.filter(a => a.month === ctx.month && a.s === id && a.pol === pol).sort((a, b) => a.rank - b.rank);
  const compare = ctx.diff && ctx.diff.students.find(x => x.id === id);
  const facts = ctx.facts.filter(f => f.s === id && f.rule).sort((a, b) => RULE_ORDER.indexOf(a.rule) - RULE_ORDER.indexOf(b.rule));
  const box = (label, value) => `<div class="rounded-xl bg-page px-3 py-2.5 text-center"><p class="text-[11px] font-bold text-ink-muted">${label}</p><p class="text-xl font-extrabold tabular-nums">${value}</p></div>`;
  const pickList = (pol, cls) => {
    const list = picks(pol);
    if (!list.length) return '<p class="text-sm text-ink-muted">고른 친구가 없어요.</p>';
    return `<ul class="space-y-2">${list.map(a => `<li class="rounded-xl border border-line p-3">
      <div class="flex flex-wrap items-center gap-1.5"><span class="text-sm font-bold">${RANK_MARKS[a.rank - 1] || a.rank}</span>${nameChip(a.o)}</div>
      ${a.tags.length ? `<div class="mt-1.5 flex flex-wrap gap-1">${a.tags.map(t => `<span class="${cls}">${esc(t)}</span>`).join('')}</div>` : ''}
      ${a.text ? `<p class="mt-1.5 text-sm leading-relaxed">“${esc(a.text)}”</p>` : ''}</li>`).join('')}</ul>`;
  };
  return `
    <div class="sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-line bg-white px-5 py-4">
      <div class="min-w-0">
        <p class="text-xs font-bold text-ink-muted">${who.number ? `${who.number}번 · ` : ''}학번 ${esc(id)}</p>
        <h2 class="text-xl font-extrabold">${esc(who.name)}</h2>
        <div class="mt-1.5 flex flex-wrap gap-1.5">
          <span class="${st.responded ? 'pred' : 'src-badge'}">${st.responded ? `응답함${st.submittedAt ? ` · ${esc(scheduleLabel(st.submittedAt))}` : ''}` : '아직 응답하지 않음'}</span>
          ${st.editAllowed ? '<span class="pred pred-warn">수정 권한 있음</span>' : ''}
        </div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" data-drawer-close>닫기</button>
    </div>
    <div class="space-y-6 px-5 py-5">
      <div class="grid grid-cols-3 gap-2">${box('받은 즐거움', st.recvPos)}${box('서로 친구', st.mutual)}${box('받은 불편', st.recvNeg)}</div>
      <section>
        <h3 class="text-sm font-extrabold">학급 분위기</h3>
        <p class="mt-1 text-sm">${st.climate ? esc(climateLabel(st.climate)) : '–'}</p>
        ${st.climateReason ? `<p class="mt-1 text-sm leading-relaxed text-ink-muted">“${esc(st.climateReason)}”</p>` : ''}
      </section>
      ${compare && compare.comparable ? `<section class="rounded-xl bg-board-soft/60 p-3 text-sm leading-relaxed">
        <h3 class="font-extrabold text-board">${esc(shortMonth(ctx.prevMonth))}과 비교</h3>
        <p class="mt-1">받은 즐거움 ${compare.prevPos} → ${compare.curPos} · 받은 불편 ${compare.prevNeg} → ${compare.curNeg} · 분위기 ${compare.prevClimate || '–'} → ${compare.curClimate || '–'}</p></section>` : ''}
      <section><h3 class="mb-2 text-sm font-extrabold">이 학생이 고른 즐거운 친구</h3>${pickList(POL.POS, 'pred')}</section>
      <section><h3 class="mb-2 text-sm font-extrabold">이 학생이 고른 불편한 친구</h3>${pickList(POL.NEG, 'pred pred-neg')}</section>
      <section>
        <h3 class="text-sm font-extrabold">규칙으로 찾은 관계</h3>
        <details class="mt-1 text-xs text-ink-muted"><summary class="cursor-pointer font-semibold">규칙 설명</summary>
          <ul class="mt-1 list-disc space-y-0.5 pl-4">${RULE_INFO.slice(1).map(r => `<li><b>${esc(r[1])}</b> ${esc(r[2])}</li>`).join('')}</ul></details>
        ${facts.length ? `<ul class="mt-3 space-y-2">${facts.map(factRow).join('')}</ul>` : '<p class="mt-2 text-sm text-ink-muted">아직 찾은 관계가 없어요.</p>'}
      </section>
    </div>`;
}

function openDrawer(id) {
  if (!S.ctx || !S.ctx.cur || !S.ctx.cur.stats[id]) return;
  const el = $('#drawer'), wasOpen = drawerId !== null;
  drawerId = id;
  el.innerHTML = drawerHtml(id);
  el.scrollTop = 0;
  el.classList.remove('hidden');
  requestAnimationFrame(() => el.classList.add('open'));
  if (!wasOpen) { const btn = el.querySelector('[data-drawer-close]'); if (btn) btn.focus({ preventScroll: true }); }
}
function closeDrawer() {
  const el = $('#drawer');
  if (drawerId === null && el.classList.contains('hidden')) return;
  drawerId = null;
  el.classList.remove('open');
  setTimeout(() => { if (drawerId === null) el.classList.add('hidden'); }, 260);
}
$('#drawer').addEventListener('click', e => {
  if (e.target.closest('[data-drawer-close]')) return closeDrawer();
  const chip = e.target.closest('[data-student]');
  if (chip) { focusStudent(chip.dataset.student); openDrawer(chip.dataset.student); }
});
$('#view-teacher').addEventListener('click', e => {
  const chip = e.target.closest('[data-student]');
  if (chip) { focusStudent(chip.dataset.student); openDrawer(chip.dataset.student); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawerId !== null && !$('#modal-root').children.length) closeDrawer(); });

/* ═══════════════════════════════════════════════════════════════
 *  11. 교사: 학생 응답 탭 (표 · 수정 권한 · 응답 삭제 · 응답 엑셀)
 * ═══════════════════════════════════════════════════════════════ */
function monthAnswers(id, pol) { return S.model.answers.filter(a => a.month === S.month && a.s === id && a.pol === pol).sort((a, b) => a.rank - b.rank); }

function renderResponsesTab() {
  const box = $('#tab-responses'), ctx = S.ctx;
  if (!ctx.cur) { box.innerHTML = '<div class="panel p-8 text-center text-sm text-ink-muted">아직 시작한 설문이 없어요. [⚙️ 관리] 탭에서 설문을 시작하세요.</div>'; return; }
  const students = activeStudents().sort(byNumber);
  const submits = new Map(S.model.submits.filter(x => x.month === ctx.month).map(x => [x.s, x]));
  const lock = S.demo ? 'disabled' : '';
  const picksCell = (id, pol) => {
    const list = monthAnswers(id, pol);
    if (!list.length) return '<span class="text-ink-muted">–</span>';
    return list.map(a => {
      const alert = pol === POL.NEG && sensitiveHits(a.tags, a.text).length > 0;
      return `<div class="mb-2 last:mb-0"><p class="font-bold">${RANK_MARKS[a.rank - 1] || a.rank} ${esc(studentName(a.o))}${alert ? ' <span class="pred pred-neg">확인 필요</span>' : ''}</p>
        ${a.tags.length ? `<p class="mt-0.5 flex flex-wrap gap-1">${a.tags.map(t => `<span class="src-badge">${esc(t)}</span>`).join('')}</p>` : ''}
        ${a.text ? `<p class="mt-0.5 text-xs leading-relaxed text-ink-muted">“${esc(a.text)}”</p>` : ''}</div>`;
    }).join('');
  };
  const rows = students.map(s => {
    const sub = submits.get(s.id), st = ctx.cur.stats[s.id];
    const name = `<td class="td whitespace-nowrap">${nameChip(s.id, s.name)}<span class="mt-1 block text-[11px] text-ink-muted tabular-nums">${esc(s.id)}</span></td>`;
    const counts = `<td class="td text-right tabular-nums">${st.recvPos}</td><td class="td text-right tabular-nums">${st.mutual}</td><td class="td text-right tabular-nums">${st.recvNeg}</td>`;
    if (!sub) return `<tr><td class="td tabular-nums">${s.number || ''}</td>${name}<td class="td text-ink-muted" colspan="4">아직 제출하지 않았어요</td>${counts}<td class="td text-ink-muted">–</td><td class="td text-ink-muted">–</td></tr>`;
    const reasonAlert = alertWordsIn(sub.climateReason).length > 0;
    return `<tr>
      <td class="td tabular-nums">${s.number || ''}</td>${name}
      <td class="td whitespace-nowrap text-xs">${esc(scheduleLabel(sub.at))}</td>
      <td class="td min-w-[9rem] text-xs"><b class="text-sm">${sub.climate ? `${sub.climate}점` : '–'}</b> ${esc(climateLabel(sub.climate).replace(/^\d점 /, ''))}
        ${sub.climateReason ? `<p class="mt-1 leading-relaxed text-ink-muted">“${esc(sub.climateReason)}”${reasonAlert ? ' <span class="pred pred-neg">확인 필요</span>' : ''}</p>` : ''}</td>
      <td class="td min-w-[13rem]">${picksCell(s.id, POL.POS)}</td>
      <td class="td min-w-[13rem]">${picksCell(s.id, POL.NEG)}</td>
      ${counts}
      <td class="td whitespace-nowrap"><button type="button" class="btn btn-sm ${sub.editAllowed ? 'btn-yellow' : 'btn-ghost'}" data-edit-permission="${esc(s.id)}" aria-pressed="${sub.editAllowed}" ${lock}>${sub.editAllowed ? '허용 중 · 거두기' : '수정 권한 주기'}</button></td>
      <td class="td whitespace-nowrap"><button type="button" class="btn btn-ghost btn-sm text-stamp" data-delete-response="${esc(s.id)}" ${lock}>응답 삭제</button></td>
    </tr>`;
  }).join('');
  box.innerHTML = `
    <div class="mb-3 flex flex-wrap items-center gap-2">
      <h2 class="text-lg font-extrabold">학생 응답</h2>
      <span class="rounded-full bg-white px-3 py-1 text-xs font-bold text-ink-muted ring-1 ring-line">${esc(monthLabel(ctx.month))} · 제출 ${students.filter(s => submits.has(s.id)).length} / ${students.length}명</span>
      <span class="flex-1"></span>
      <button type="button" id="btn-excel" class="btn btn-ghost btn-sm">📥 응답 엑셀</button>
    </div>
    <p class="mb-3 text-xs leading-relaxed text-ink-muted">수정 권한을 주면 학생이 이번 달 설문을 처음부터 다시 낼 수 있어요. 친구들의 정보를 지키기 위해 학생 화면에는 지난번 답이 보이지 않고, 다시 제출하면 권한은 저절로 사라져요.</p>
    <div class="panel overflow-x-auto"><table class="min-w-full text-sm">
      <thead><tr><th class="th">번호</th><th class="th">이름</th><th class="th">제출</th><th class="th">학급 분위기</th><th class="th">즐거운 친구</th><th class="th">불편한 친구</th><th class="th text-right">받은 즐거움</th><th class="th text-right">서로 친구</th><th class="th text-right">받은 불편</th><th class="th">수정 권한</th><th class="th">관리</th></tr></thead>
      <tbody>${rows || '<tr><td class="td text-center text-ink-muted" colspan="11">학생 명단이 비어 있어요. [⚙️ 관리] 탭에서 등록하세요.</td></tr>'}</tbody>
    </table></div>`;
}

$('#tab-responses').addEventListener('click', async e => {
  if (e.target.closest('#btn-excel')) return downloadExcel();
  const perm = e.target.closest('[data-edit-permission]'), del = e.target.closest('[data-delete-response]');
  if (S.demo || !S.roomCode || (!perm && !del)) return;
  const month = S.month;
  if (perm) {
    const id = perm.dataset.editPermission, allow = perm.getAttribute('aria-pressed') !== 'true';
    if (allow && !(await mConfirm('수정 권한을 줄까요?', `${studentName(id)} 학생이 ${monthLabel(month)} 설문을 다시 낼 수 있어요.\n친구들의 정보를 지키기 위해 학생 화면에는 지난번 답이 보이지 않아요. 다시 제출하면 지금 응답을 대신하고, 권한은 저절로 사라져요.`, { ok: '권한 주기' }))) return;
    perm.disabled = true;
    try {
      await updateDoc(doc(db, COLLECTION, S.roomCode, 'receipts', `${month}_${id}`), { editAllowed: allow });
      toast(allow ? `${studentName(id)} 학생에게 수정 권한을 줬어요` : '수정 권한을 거뒀어요');
      await loadRoomData();
    } catch (err) {
      console.error('수정 권한 변경 실패:', err);
      perm.disabled = false;
      mAlert('바꾸지 못했어요', failText(err, '수정 권한을 바꾸지 못했어요.'));
    }
    return;
  }
  const id = del.dataset.deleteResponse;
  if (!(await mConfirm('응답을 삭제할까요?', `${studentName(id)} 학생의 ${monthLabel(month)} 응답을 지워요. 지우면 학생이 다시 제출할 수 있어요.\n되돌릴 수 없어요.`, { ok: '삭제', danger: true }))) return;
  del.disabled = true;
  try {
    const batch = writeBatch(db);
    batch.delete(doc(db, COLLECTION, S.roomCode, 'responses', `${month}_${id}`));
    batch.delete(doc(db, COLLECTION, S.roomCode, 'receipts', `${month}_${id}`));
    await batch.commit();
    toast('응답을 삭제했어요');
    await loadRoomData();
  } catch (err) {
    console.error('응답 삭제 실패:', err);
    del.disabled = false;
    mAlert('삭제하지 못했어요', failText(err, '응답을 삭제하지 못했어요.'));
  }
});

function downloadExcel() {
  const ctx = S.ctx;
  if (!ctx || !ctx.cur) return;
  if (typeof XLSX === 'undefined') return mAlert('엑셀을 만들지 못했어요', '엑셀 도구를 불러오지 못했어요. 페이지를 새로고침한 뒤 다시 시도해 주세요.');
  const students = activeStudents().sort(byNumber);
  const submits = new Map(S.model.submits.filter(x => x.month === ctx.month).map(x => [x.s, x]));
  const posMax = questionOf('positive').max, negMax = questionOf('negative').max;
  const header = ['번호', '학번', '이름', '제출 시각', '학급 분위기', '분위기 이유'];
  for (let i = 1; i <= posMax; i++) header.push(`즐거운 친구${i}`, `분류${i}`, `이유${i}`);
  for (let i = 1; i <= negMax; i++) header.push(`불편한 친구${i}`, `불편 분류${i}`, `불편 이유${i}`);
  header.push('수정 권한');
  const rows = students.map(s => {
    const sub = submits.get(s.id);
    const row = [s.number || '', s.id, s.name, sub ? new Date(sub.at).toLocaleString('ko-KR') : '미응답', (sub && sub.climate) || '', (sub && sub.climateReason) || ''];
    const fill = (list, max) => { for (let i = 0; i < max; i++) row.push(list[i] ? studentName(list[i].o) : '', list[i] ? list[i].tags.join(', ') : '', list[i] ? list[i].text : ''); };
    fill(sub ? monthAnswers(s.id, POL.POS) : [], posMax);
    fill(sub ? monthAnswers(s.id, POL.NEG) : [], negMax);
    row.push(sub && sub.editAllowed ? '허용' : '');
    return row;
  });
  const relations = ctx.cur.edges.map(e => [monthLabel(ctx.month), studentName(e.s), e.s, studentName(e.o), e.o, e.pol === POL.POS ? '즐거움' : '불편', e.rank, e.tags.join(', '), e.text]);
  const summary = students.map(s => { const st = ctx.cur.stats[s.id]; return [s.number || '', s.id, s.name, st.responded ? '응답' : '미응답', st.climate || '', st.recvPos, st.mutual, st.recvNeg, st.givenPos, st.givenNeg]; });
  const sheet = (aoa, widths) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(wch => ({ wch })); return ws; };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet([header, ...rows], header.map((h, i) => (i < 3 ? 9 : /이유/.test(h) ? 36 : 14))), '응답');
  XLSX.utils.book_append_sheet(wb, sheet([['달', '응답 학생', '응답 학번', '대상 학생', '대상 학번', '구분', '순서', '분류', '이유'], ...relations], [10, 10, 9, 10, 9, 8, 6, 26, 40]), '관계 목록');
  XLSX.utils.book_append_sheet(wb, sheet([['번호', '학번', '이름', '응답', '분위기', '받은 즐거움', '서로 친구', '받은 불편', '고른 즐거움', '고른 불편'], ...summary], [6, 9, 10, 8, 8, 11, 10, 10, 11, 10]), '학생별 요약');
  const roomName = String((S.room && S.room.memo) || S.roomCode || '예시').replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, `관계지도_${roomName}_${ctx.month}.xlsx`);
}

async function startMonth(month) {

/* ── 학생 명단 ── */
const defaultNumber = id => Number(String(id).slice(-2)) || 0;   // 학번 끝 두 자리 = 번호

function validateRosterEntry({ id, number, name }) {
  if (!STUDENT_ID_PATTERN.test(id)) return `학번 ${id || '(빈칸)'}: 1~3으로 시작하는 숫자 4~5자리로 적어 주세요.`;
  if (!Number.isInteger(number) || number < 0 || number > 99) return `학번 ${id}: 번호는 0~99 사이의 정수로 적어 주세요.`;
  if (!name || name.length > 20) return `학번 ${id}: 이름은 1~20자로 적어 주세요.`;
  return '';
}

/** 최신 명단을 트랜잭션으로 읽어 바꿉니다 (mutator가 Error를 던지면 저장하지 않음) */
function mutateRoster(mutator) {
  const ref = roomRef();
  return runTransaction(db, async tx => {
    const snap = await tx.get(ref);
    if (!snap.exists()) throw new Error('반 정보를 찾을 수 없어요.');
    const roster = Object.assign({}, snap.data().roster || {});
    const result = mutator(roster);
    tx.update(ref, { roster, updatedAt: serverTimestamp() });
    return result;
  });
}

async function changeRoster(mutator, okMessage) {
  loading(true, '명단을 저장하는 중');
  let failure = null, result;
  try { result = await mutateRoster(mutator); } catch (err) { failure = err; }
  loading(false);
  if (failure) {
    console.error('명단 변경 실패:', failure);
    await mAlert('명단을 바꾸지 못했어요', failText(failure, '다시 시도해 주세요.'));
    return null;
  }
  if (okMessage) toast(typeof okMessage === 'function' ? okMessage(result) : okMessage);
  await loadRoomData();
  return result || true;
}

async function addStudent() {
  const id = $('#mg-add-id').value.trim(), name = $('#mg-add-name').value.trim();
  const number = $('#mg-add-no').value === '' ? defaultNumber(id) : Number($('#mg-add-no').value);
  const problem = validateRosterEntry({ id, number, name });
  if (problem) return mAlert('명단에 넣지 못했어요', problem);
  const ok = await changeRoster(roster => {
    if (roster[id]) throw new Error(`학번 ${id}은(는) 이미 명단에 있어요.`);
    roster[id] = { no: number, name, active: true };
  }, `${name} 학생을 추가했어요`);
  if (ok && $('#mg-add-no')) $('#mg-add-no').focus();
}

/** 붙여넣은 줄 → 명단 항목 (「번호 학번 이름」·「학번 이름」·「이름 학번」, 탭·쉼표·띄어쓰기 구분) */
function parseRosterLines(text) {
  const entries = [], problems = [];
  String(text || '').split(/\r?\n/).forEach((line, index) => {
    const tokens = line.trim().split(/[\s,;]+/).filter(Boolean);
    if (!tokens.length) return;
    let number = null, id = '', nameTokens = [];
    if (tokens.length >= 3 && /^\d{1,2}$/.test(tokens[0]) && STUDENT_ID_PATTERN.test(tokens[1])) { number = Number(tokens[0]); id = tokens[1]; nameTokens = tokens.slice(2); }
    else if (tokens.length >= 2 && STUDENT_ID_PATTERN.test(tokens[0])) { id = tokens[0]; nameTokens = tokens.slice(1); }
    else if (tokens.length >= 2 && STUDENT_ID_PATTERN.test(tokens[tokens.length - 1])) { id = tokens[tokens.length - 1]; nameTokens = tokens.slice(0, -1); }
    else { problems.push(`${index + 1}번째 줄: 학번을 찾지 못했어요 (${line.trim().slice(0, 30)})`); return; }
    const entry = { id, number: number == null ? defaultNumber(id) : number, name: nameTokens.join(' ').trim() };
    const problem = validateRosterEntry(entry);
    if (problem) problems.push(`${index + 1}번째 줄: ${problem}`); else entries.push(entry);
  });
  return { entries, problems };
}

async function bulkAddStudents() {
  const { entries, problems } = parseRosterLines($('#mg-bulk').value);
  if (!entries.length) return mAlert('명단에 넣지 못했어요', problems.length ? problems.slice(0, 8).join('\n') : '추가할 학생을 한 줄에 한 명씩 적어 주세요.');
  const result = await changeRoster(roster => {
    const added = [], skipped = [];
    entries.forEach(x => {
      if (roster[x.id]) { skipped.push(x.id); return; }
      roster[x.id] = { no: x.number, name: x.name, active: true };
      added.push(x.id);
    });
    return { added, skipped };
  }, r => `${r.added.length}명을 추가했어요`);
  if (!result || !result.added) return;
  if (result.skipped.length || problems.length) {
    const lines = [];
    if (result.skipped.length) lines.push(`이미 있는 학번 ${result.skipped.length}개는 건너뛰었어요: ${result.skipped.slice(0, 10).join(', ')}`);
    if (problems.length) lines.push(`읽지 못한 줄 ${problems.length}개\n${problems.slice(0, 6).join('\n')}`);
    await mAlert(`${result.added.length}명을 추가했어요`, lines.join('\n\n'));
  }
}

async function editStudent(student) {
  const r = await mForm({
    title: '학생 정보 고치기',
    message: `학번 ${student.id} · 학번은 학생이 로그인할 때 쓰는 값이라 고칠 수 없어요. 학번이 틀렸다면 바른 학번으로 새로 추가하고 이 학생은 지우세요.`,
    fields: [
      { name: 'no', label: '번호', inputmode: 'numeric', maxlength: 2, value: student.number || '' },
      { name: 'name', label: '이름', maxlength: 20, value: student.name }
    ],
    submit: '저장',
    onSubmit: async v => {
      const number = v.no === '' ? defaultNumber(student.id) : Number(v.no);
      const problem = validateRosterEntry({ id: student.id, number, name: v.name });
      return problem ? { error: problem } : { number, name: v.name };
    }
  });
  if (!r || !r.name) return;
  await changeRoster(roster => {
    if (!roster[student.id]) throw new Error('명단에서 학생을 찾을 수 없어요.');
    roster[student.id] = Object.assign({}, roster[student.id], { no: r.number, name: r.name });
  }, '학생 정보를 고쳤어요');
}

/** PIN 초기화 — 이 반에 들어와 담당 선생님으로 등록된 학생만 (보안 규칙의 '내 학생' 판정과 같음) */
async function resetPinFor(student) {
  const key = makeStudentKey(String(S.room.creatorSchool || '').trim(), student.id);
  try {
    const snap = await getDoc(doc(db, 'student_auth', key));
    if (!snap.exists()) return mAlert('아직 들어온 적 없는 학생이에요', `${student.name} 학생은 아직 한 번도 들어오지 않았어요. 처음 들어올 때 PIN을 정해요.`);
    const teachers = Array.isArray(snap.data().teachers) ? snap.data().teachers : [];
    if (!S.teacher.isAdmin && !teachers.includes(S.teacher.name)) return mAlert('초기화할 수 없어요', '이 반에 들어온 적이 있는 학생만 PIN을 초기화할 수 있어요.');
    if (!(await mConfirm('PIN을 초기화할까요?', `${student.name}(${student.id}) 학생은 다음에 들어올 때 새 4자리 PIN을 정해요.`, { ok: '초기화', danger: true }))) return;
    await resetStudentPin(key);
    toast(`${student.name} 학생의 PIN을 초기화했어요`);
  } catch (err) {
    console.error('PIN 초기화 실패:', err);
    mAlert('초기화하지 못했어요', isPermissionError(err) ? 'PIN을 초기화할 권한이 없어요. 내 학교 학생인지, 교사 정보의 학교명이 맞는지 확인해 주세요.' : String((err && err.message) || err));
  }
}

/* ═══════════════════════════════════════════════════════════════
 *  13. 로그인 상태 (승인된 교사 → 교사 화면, 그 밖에는 첫 화면)
 *      로그인 상태가 빠르게 바뀌면 앞선 처리가 늦게 끝날 수 있어, 가장 최근 변경만 화면에 반영합니다.
 * ═══════════════════════════════════════════════════════════════ */
onAuthStateChanged(auth, async user => {
  const sequence = ++authSequence;
  const wasTeacher = !!S.teacher;
  S.user = user;
  S.teacher = null;
  if (!user) {
    if (wasTeacher) await leaveTeacherView();
    renderTeacherLoginNote();
    return;
  }
  const isAdmin = String(user.email || '').trim().toLowerCase() === ADMIN_EMAIL;
  let record = {};
  try {
    const snap = await getDoc(doc(db, 'teachers', user.uid));
    if (snap.exists()) record = snap.data() || {};
  } catch (err) {
    console.warn('교사 정보 조회 실패:', err);
  }
  if (sequence !== authSequence) return;
  if (!isAdmin && record.status !== 'approved') {
    if (wasTeacher) await leaveTeacherView();
    renderTeacherLoginNote();
    if (S.loginRequested) setLoginRole('teacher');
    S.loginRequested = false;
    return;
  }
  S.loginRequested = false;
  const school = String(record.school || '');
  S.teacher = {
    name: record.name || (isAdmin ? '관리자' : '교사'),
    // 관리자 계정은 학교가 비어 있거나 '관리자'라 학생 인증 학교로 '동동쌤'을 씁니다 (설문 템플릿과 같음)
    school: isAdmin && (!school.trim() || school.trim() === '관리자') ? '동동쌤' : school,
    isAdmin
  };
  renderTeacherLoginNote();
  if (S.sv && !S.sv.done) return;   // 이 기기에서 학생이 설문을 쓰는 중이면 화면을 바꾸지 않습니다
  await enterTeacher();
});

setLoginRole('student');
</script>
