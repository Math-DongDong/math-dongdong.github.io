<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아하수학 | 중학교 수학 한 걸음씩</title>

    <!-- 파비콘 -->
    <link rel="icon" href="../../assets/images/mainPage/동동이.jpg" type="image/jpeg" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <!-- 공통 네비게이션 CSS -->
    <link rel="stylesheet" href="../../css/navbar.css" />

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        :root {
            --bg: #ffffff;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --aha: #15803d;
            --aha-soft: #ecfdf5;
            --aha-line: #86efac;
            --wait: #b45309;
            --wait-soft: #fffbeb;
            --wait-line: #fcd34d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Pretendard Variable', sans-serif;
            line-height: 1.7;
            word-break: keep-all;
        }

        .page-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .hero {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.6rem 1.3rem;
        }

        .hero h1 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 0.5rem;
        }

        .hero p {
            margin: 0;
            font-size: 1.02rem;
            color: #374151;
        }

        .legend {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .legend span {
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
            border: 1px solid;
        }

        .legend .aha {
            color: var(--aha);
            background: var(--aha-soft);
            border-color: var(--aha-line);
        }

        .legend .wait {
            color: var(--wait);
            background: var(--wait-soft);
            border-color: var(--wait-line);
        }

        .unit-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 2.2rem 0 0.9rem;
            padding-left: 0.7rem;
            border-left: 5px solid var(--primary);
        }

        .topic-card {
            display: block;
            height: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 6px solid var(--border);
            border-radius: 16px;
            padding: 1.15rem 1.1rem 1rem;
            text-decoration: none;
            color: inherit;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        a.topic-card:hover {
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }

        .topic-card.soon {
            background: #fafafa;
            color: #9ca3af;
        }

        .topic-card.state-aha {
            border-left-color: var(--aha);
        }

        .topic-card.state-wait {
            border-left-color: var(--wait);
        }

        .topic-card.state-new {
            border-left-color: var(--primary);
        }

        .topic-no {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--primary);
            color: #fff;
            font-weight: 800;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .topic-card.soon .topic-no {
            background: #d1d5db;
        }

        .topic-name {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin: 0;
        }

        .topic-desc {
            font-size: 0.95rem;
            color: var(--muted);
            margin: 0.5rem 0 0.7rem;
        }

        .topic-card.soon .topic-desc {
            color: #9ca3af;
        }

        .goal-chip {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 600;
            background: #f1f5f9;
            color: #475569;
            border-radius: 999px;
            padding: 0.18rem 0.6rem;
            margin: 0 0.25rem 0.3rem 0;
        }

        /* ---------- 상태 시각화 ---------- */
        .state-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 999px;
            padding: 0.35rem 0.85rem;
            border: 2px solid;
            margin-top: 0.9rem;
        }

        .state-pill.aha {
            color: var(--aha);
            background: var(--aha-soft);
            border-color: var(--aha-line);
        }

        .state-pill.wait {
            color: var(--wait);
            background: var(--wait-soft);
            border-color: var(--wait-line);
        }

        .state-pill.none {
            color: #64748b;
            background: #f8fafc;
            border-color: var(--border);
        }

        .state-pill i {
            font-size: 1.05rem;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin-top: 0.7rem;
        }

        .mini-progress {
            flex: 1;
            height: 10px;
            border-radius: 99px;
            background: #f1f5f9;
            overflow: hidden;
        }

        .mini-progress>div {
            height: 100%;
            width: 0;
            border-radius: 99px;
            transition: width .4s ease;
        }

        .percent-text {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--muted);
            min-width: 42px;
            text-align: right;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.6rem;
        }

        .chip {
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 0.2rem 0.65rem;
            background: #f1f5f9;
            color: #475569;
        }

        .chip.gold {
            background: var(--wait-soft);
            color: var(--wait);
        }

        .chip.green {
            background: var(--aha-soft);
            color: var(--aha);
        }

        .chip.soon {
            background: #f1f5f9;
            color: #9ca3af;
        }

        .footer-note {
            margin-top: 2.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <!-- 네비게이션바 -->
    <script src="../../js/navbar.js" data-type="middleschool"></script>

    <main class="page-wrap">

        <section class="hero">
            <h1>아하수학</h1>
            <p>
                수학이 어려워도 괜찮아요. 화면을 위에서 아래로 천천히 내리기만 하면 돼요.
                개념을 다 읽고 <b>기초 미션을 모두 한 번에 맞히면</b> 주제 표시가 <b>아하!</b> 로 바뀝니다.
            </p>
            <div class="legend">
                <span class="aha"><i class="bi bi-lightbulb-fill"></i> 아하! 이해했어요</span>
                <span class="wait"><i class="bi bi-bookmark-fill"></i> 아직은.... 다시 볼래요</span>
            </div>
            <div class="mt-3" id="resumeBox" hidden>
                <a class="btn btn-primary fw-bold px-3" id="resumeLink" href="#">이어서 학습하기</a>
            </div>
        </section>

        <!-- 주제 목록이 이 안에 자동으로 그려집니다 -->
        <div id="topicArea"></div>

        <p class="footer-note">
            학습 기록(자가진단 · 문제 풀이)은 지금 사용하는 <b>기기의 브라우저</b>에 저장돼요.
            다른 기기에서 열면 기록이 보이지 않아요.
            <button class="btn btn-link p-0 align-baseline text-decoration-none" id="clearAll">기록 모두 지우기</button>
        </p>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /* =====================================================================
           [ 주제 추가 방법 ]
           아래 TOPICS 배열에 항목을 하나 더 넣기만 하면 카드가 자동으로 생깁니다.

           id     : 학습 페이지에서 쓰는 주제 ID (저장 키 'ahamath.{id}.v1' 와 반드시 같게)
           unit   : 단원 이름 (같은 unit끼리 자동으로 묶여서 표시됨. 띄어쓰기까지 똑같이!)
           no     : 카드 왼쪽 번호
           title  : 주제 이름
           desc   : 한 줄 소개
           goals  : 작은 회색 칩으로 보이는 학습 내용 (개수 자유)
           href   : 학습 페이지 경로 (ahamath 폴더 안)
           status : 'ready'(학습 가능) 또는 'soon'(준비 중)
           ===================================================================== */
        const TOPICS = [
            {
                id: 'daepyogap',
                unit: '중1. 자료의 정리와 해석',
                no: 1,
                title: '대푯값',
                desc: '여러 개의 숫자를 하나의 숫자로 대신 말하는 방법을 배워요.',
                goals: ['평균', '중앙값', '최빈값'],
                href: './ahamath/representativevalue.html',
                status: 'ready'
            },
            {
                id: 'frequency',
                unit: '중1. 자료의 정리와 해석',
                no: 2,
                title: '도수분포표와 히스토그램',
                desc: '자료를 구간으로 나누어 표와 그래프로 나타내요.',
                goals: ['줄기와 잎 그림', '도수분포표', '히스토그램', '도수분포다각형'],
                href: './ahamath/frequency.html',
                status: 'ready'
            },
            {
                id: 'relative',
                unit: '중1. 자료의 정리와 해석',
                no: 3,
                title: '상대도수와 그 그래프',
                desc: '수가 다른 두 집단을 공평하게 비교하는 방법을 배워요.',
                goals: ['상대도수', '두 자료 비교하기'],
                href: './ahamath/relative.html',
                status: 'soon'
            }
        ];

        /* ---------- 저장된 학습 기록 읽기 ---------- */
        function readSummary(topicId) {
            try {
                const raw = window.localStorage.getItem('ahamath.' + topicId + '.v1');
                if (!raw) { return null; }
                const data = JSON.parse(raw);
                return data.summary || null;
            } catch (e) { return null; }
        }

        /* ---------- 상태 계산 ----------
           아하! 표시는 기초 미션을 모두 '한 번에' 맞혔을 때만 켜집니다.       */
        function stateOf(summary) {
            if (!summary || !summary.updatedAt) {
                return {
                    key: 'new', cls: 'none', icon: 'bi-play-circle',
                    text: '아직 시작하지 않았어요', color: 'var(--primary)', percent: 0, chips: []
                };
            }

            const basicFirst = summary.basicFirstTry || 0;
            const basicTotal = summary.basicTotal || 5;
            const chips = ['<span class="chip">기초 미션 ' + basicFirst + ' / ' + basicTotal + ' 한 번에 맞힘</span>'];
            if (summary.challengeMastered) {
                chips.push('<span class="chip gold"><i class="bi bi-stars"></i> 도전 완료</span>');
            } else if (summary.challengeFirstTry) {
                chips.push('<span class="chip gold">도전 ' + summary.challengeFirstTry + ' / ' + (summary.challengeTotal || 3) + '</span>');
            }

            if (summary.mastered) {
                return {
                    key: 'aha', cls: 'aha', icon: 'bi-lightbulb-fill',
                    text: '아하! 이해했어요', color: 'var(--aha)',
                    percent: summary.percent || 100, chips: chips
                };
            }
            return {
                key: 'wait', cls: 'wait', icon: 'bi-bookmark-fill',
                text: '아직은.... 다시 볼래요', color: 'var(--wait)',
                percent: summary.percent || 0, chips: chips
            };
        }

        /* ---------- 카드 그리기 ---------- */
        function cardHTML(topic) {
            const summary = topic.status === 'ready' ? readSummary(topic.id) : null;
            const state = stateOf(summary);
            const goals = topic.goals.map(function (g) { return '<span class="goal-chip">' + g + '</span>'; }).join('');

            const head =
                '<div class="d-flex align-items-start gap-2">' +
                '<span class="topic-no">' + topic.no + '</span>' +
                '<div class="flex-grow-1">' +
                '<h3 class="topic-name">' + topic.title + '</h3>' +
                '<p class="topic-desc">' + topic.desc + '</p>' +
                '<div>' + goals + '</div>' +
                '</div>' +
                (topic.status === 'ready' ? '<i class="bi bi-chevron-right text-primary fs-5"></i>' : '') +
                '</div>';

            if (topic.status !== 'ready') {
                return '<div class="topic-card soon">' + head +
                    '<div class="chip-row"><span class="chip soon">준비 중이에요</span></div></div>';
            }

            const body =
                '<span class="state-pill ' + state.cls + '"><i class="bi ' + state.icon + '"></i> ' + state.text + '</span>' +
                '<div class="progress-row">' +
                '<span class="mini-progress"><div style="width:' + state.percent + '%;background:' + state.color + '"></div></span>' +
                '<span class="percent-text">' + state.percent + '%</span>' +
                '</div>' +
                (state.chips.length ? '<div class="chip-row">' + state.chips.join('') + '</div>' : '');

            return '<a class="topic-card state-' + state.key + '" href="' + topic.href + '">' + head + body + '</a>';
        }

        function renderTopics() {
            const area = document.getElementById('topicArea');
            const groups = [];
            TOPICS.forEach(function (t) {
                let group = groups.filter(function (g) { return g.unit === t.unit; })[0];
                if (!group) { group = { unit: t.unit, items: [] }; groups.push(group); }
                group.items.push(t);
            });

            area.innerHTML = groups.map(function (group) {
                return '<h2 class="unit-title">' + group.unit + '</h2>' +
                    '<div class="row g-3">' +
                    group.items.map(function (t) {
                        return '<div class="col-12 col-md-6">' + cardHTML(t) + '</div>';
                    }).join('') +
                    '</div>';
            }).join('');
        }

        /* ---------- 이어서 학습하기 ---------- */
        function renderResume() {
            let latest = null;
            TOPICS.forEach(function (t) {
                if (t.status !== 'ready') { return; }
                const summary = readSummary(t.id);
                if (!summary || !summary.updatedAt) { return; }
                if (!latest || summary.updatedAt > latest.updatedAt) {
                    latest = { topic: t, updatedAt: summary.updatedAt };
                }
            });
            if (!latest) { return; }
            const box = document.getElementById('resumeBox');
            const link = document.getElementById('resumeLink');
            link.href = latest.topic.href;
            link.textContent = latest.topic.title + ' 이어서 학습하기';
            box.hidden = false;
        }

        document.getElementById('clearAll').addEventListener('click', function () {
            if (!window.confirm('모든 주제의 학습 기록을 지울까요?')) { return; }
            try {
                TOPICS.forEach(function (t) { window.localStorage.removeItem('ahamath.' + t.id + '.v1'); });
            } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
            renderTopics();
            document.getElementById('resumeBox').hidden = true;
        });

        renderTopics();
        renderResume();
    </script>
</body>

</html>
