<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아하! 수학 | 중학교 수학 한 걸음씩</title>

    <!-- 파비콘 -->
    <link rel="icon" href="../../assets/images/mainPage/동동이.jpg" type="image/jpeg" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <!-- 공통 네비게이션 CSS -->
    <link rel="stylesheet" href="../../css/navbar.css" />

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        :root {
            --bg: #ffffff;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --aha: #15803d;
            --aha-soft: #ecfdf5;
            --aha-line: #86efac;
            --wait: #b45309;
            --wait-soft: #fffbeb;
            --wait-line: #fcd34d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Pretendard Variable', sans-serif;
            line-height: 1.7;
            word-break: keep-all;
        }

        .page-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .hero {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.6rem 1.3rem;
        }

        .hero h1 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 0.5rem;
        }

        .hero p {
            margin: 0;
            font-size: 1.02rem;
            color: #374151;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 0.35rem 0.5rem;
            border: 1px solid;
            text-align: center;
            white-space: nowrap;
            width: 100%;
        }

        .legend .aha {
            color: var(--aha);
            background: var(--aha-soft);
            border-color: var(--aha-line);
        }

        .legend .wait {
            color: var(--wait);
            background: var(--wait-soft);
            border-color: var(--wait-line);
        }

        /* ---------- 단원 바로가기 칩 ---------- */
        .jump-row {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding: 1.2rem 0 0.3rem;
            scrollbar-width: none;
        }

        .jump-row::-webkit-scrollbar {
            display: none;
        }

        .jump-chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.88rem;
            font-weight: 700;
            color: #475569;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.35rem 0.85rem;
            white-space: nowrap;
        }

        .jump-chip .jc-n {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--muted);
        }

        .jump-chip.done {
            background: var(--aha-soft);
            border-color: var(--aha-line);
            color: var(--aha);
        }

        .jump-chip.done .jc-n {
            color: var(--aha);
        }

        /* ---------- 단원 접기 (카드가 아니라 제목줄처럼) ---------- */
        .unit-block {
            margin-top: 2rem;
            scroll-margin-top: 70px;
        }

        .unit-block:first-child {
            margin-top: 1rem;
        }

        .unit-head {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-radius: 10px;
            padding: 0.3rem 0.4rem 0.45rem;
            transition: background .18s ease;
        }

        .unit-head:hover {
            background: #f8fafc;
        }

        .uh-arrow {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: #f1f5f9;
            color: var(--muted);
            font-size: 0.92rem;
            transition: transform .2s ease, background .2s ease, color .2s ease;
        }

        .unit-block.open .uh-arrow {
            transform: rotate(90deg);
            background: var(--primary-soft);
            color: var(--primary);
        }

        .unit-block.open.done .uh-arrow {
            background: var(--aha-soft);
            color: var(--aha);
        }

        .uh-name {
            flex: 1 1 auto;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .uh-count {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--muted);
            white-space: nowrap;
        }

        .unit-block.done .uh-count {
            color: var(--aha);
        }

        /* 제목 아래 밑줄이 곧 진행률 막대예요 */
        .uh-rule {
            height: 3px;
            margin: 0 0.4rem;
            border-radius: 99px;
            background: var(--border);
            overflow: hidden;
        }

        .uh-rule>div {
            height: 100%;
            border-radius: 99px;
            transition: width .4s ease;
        }

        .unit-body {
            padding-top: 1rem;
        }

        .topic-card {
            display: block;
            height: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 6px solid var(--border);
            border-radius: 16px;
            padding: 1.15rem 1.1rem 1rem;
            text-decoration: none;
            color: inherit;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        a.topic-card:hover {
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }

        .topic-card.soon {
            background: #fafafa;
            color: #9ca3af;
        }

        .topic-card.state-aha {
            border-left-color: var(--aha);
        }

        .topic-card.state-wait {
            border-left-color: var(--wait);
        }

        .topic-card.state-new {
            border-left-color: var(--primary);
        }

        .topic-no {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--primary);
            color: #fff;
            font-weight: 800;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .topic-card.soon .topic-no {
            background: #d1d5db;
        }

        .topic-name {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin: 0;
        }

        .topic-desc {
            font-size: 0.95rem;
            color: var(--muted);
            margin: 0.5rem 0 0.7rem;
        }

        .topic-card.soon .topic-desc {
            color: #9ca3af;
        }

        .goal-chip {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 600;
            background: #f1f5f9;
            color: #475569;
            border-radius: 999px;
            padding: 0.18rem 0.6rem;
            margin: 0 0.25rem 0.3rem 0;
        }

        /* ---------- 상태 시각화 ---------- */
        .state-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 999px;
            padding: 0.35rem 0.85rem;
            border: 2px solid;
            margin-top: 0.9rem;
        }

        .state-pill.aha {
            color: var(--aha);
            background: var(--aha-soft);
            border-color: var(--aha-line);
        }

        .state-pill.wait {
            color: var(--wait);
            background: var(--wait-soft);
            border-color: var(--wait-line);
        }

        .state-pill.none {
            color: #64748b;
            background: #f8fafc;
            border-color: var(--border);
        }

        .state-pill i {
            font-size: 1.05rem;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin-top: 0.7rem;
        }

        .mini-progress {
            flex: 1;
            height: 10px;
            border-radius: 99px;
            background: #f1f5f9;
            overflow: hidden;
        }

        .mini-progress>div {
            height: 100%;
            width: 0;
            border-radius: 99px;
            transition: width .4s ease;
        }

        .percent-text {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--muted);
            min-width: 42px;
            text-align: right;
        }

        .chip-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.45rem;
            margin-top: 0.65rem;
        }

        .chip-row>.chip:only-child {
            grid-column: 1 / -1;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 0.32rem 0.4rem;
            background: #f1f5f9;
            color: #475569;
            text-align: center;
            white-space: nowrap;
            width: 100%;
        }

        .chip.gold {
            background: var(--wait-soft);
            color: var(--wait);
        }

        .chip.green {
            background: var(--aha-soft);
            color: var(--aha);
        }

        .chip.soon {
            background: #f1f5f9;
            color: #9ca3af;
        }

        .footer-note {
            margin-top: 2.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <!-- 네비게이션바 -->
    <script src="../../js/navbar.js" data-type="middleschool"></script>

    <main class="page-wrap">

        <section class="hero">
            <h1>아하! 수학</h1>
            <p>
                수학이 어려워도 괜찮아요. 화면을 위에서 아래로 천천히 내리기만 하면 돼요.
                마지막에 <b>아하!</b> 인지 <b>아직은....</b> 인지만 한 번 눌러 주면 됩니다.
            </p>
            <div class="legend">
                <span class="aha"><i class="bi bi-lightbulb-fill"></i> 아하! 이해했어요</span>
                <span class="wait"><i class="bi bi-bookmark-fill"></i> 아직은.... 다시 볼래요</span>
            </div>
            <div class="mt-3" id="resumeBox" hidden>
                <a class="btn btn-primary fw-bold px-3" id="resumeLink" href="#">이어서 학습하기</a>
            </div>
        </section>

        <!-- 단원 바로가기 (자동으로 그려집니다) -->
        <div class="jump-row" id="jumpRow"></div>

        <!-- 주제 목록이 이 안에 자동으로 그려집니다 -->
        <div id="topicArea"></div>

        <p class="footer-note">
            학습 기록은 지금 사용하는 <b>기기의 브라우저</b>에 저장돼요.
            다른 기기에서 열면 기록이 보이지 않아요.
            미션 개수는 <b>한 번에 맞힌 문항</b>만 세요.
            <button class="btn btn-link p-0 align-baseline text-decoration-none" id="clearAll">기록 모두 지우기</button>
        </p>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /* =====================================================================
           [ 주제 추가 방법 ]
           아래 TOPICS 배열에 항목을 하나 더 넣기만 하면 카드가 자동으로 생깁니다.

           id     : 학습 페이지에서 쓰는 주제 ID (저장 키 'ahamath.{id}.v1' 와 반드시 같게)
           unit   : 단원 이름 (같은 unit끼리 자동으로 묶여서 표시됨. 띄어쓰기까지 똑같이!)
           no     : 카드 왼쪽 번호
           title  : 주제 이름
           desc   : 한 줄 소개
           goals  : 작은 회색 칩으로 보이는 학습 내용 (개수 자유)
           href   : 학습 페이지 경로 (ahamath 폴더 안)
           status : 'ready'(학습 가능) 또는 'soon'(준비 중)

           basicTotal / challengeTotal
                  : 그 주제의 기초·도전 미션 문항 수.
                    아직 한 번도 들어가 보지 않은 학생에게 '0 / 4' 처럼 보여 주기 위한 값이라
                    학습 페이지의 문항 수와 같게 적어 주세요.
                    한 번이라도 학습 페이지를 열면 실제 문항 수로 자동으로 맞춰집니다.
                    도전 미션이 없는 주제는 challengeTotal 을 0 으로 두면 칩이 사라집니다.

           [ 단원 접기 ]
           같은 unit 끼리 묶여 접었다 펼 수 있습니다. 주제가 늘어나도 화면이 길어지지 않아요.
           - 처음 들어오면 가장 최근에 공부하던 단원만 펼쳐집니다
           - 펼쳐 둔 단원은 기기에 기억됩니다 (저장 키 'ahamath.ui.units')
           - 맨 위 칩을 누르면 그 단원으로 바로 이동합니다

           [ 미션 개수를 세는 규칙 ]
           '한 번에 맞힌 문항(firstTry)'만 개수로 인정합니다.
           두 번째 시도에 맞힌 문항은 세지 않고, 학습 페이지의 '다시 볼 문제'나
           '아하! 이해했어요 → 기초 미션 풀기'로 다시 풀어서 한 번에 맞히는 순간
           학습 페이지가 기록을 올려 주고, 그 값이 이 카드에 그대로 반영됩니다.
           ===================================================================== */
        const TOPICS = [
            {
                id: 'prime',
                unit: '중1. 소인수분해',
                no: 1,
                title: '소수와 합성수',
                desc: '더 쪼개지지 않는 수를 찾아봐요',
                goals: ['약수', '소수', '합성수'],
                href: './ahamath/1/prime.html',
                status: 'ready',
                basicTotal: 5,
                challengeTotal: 3
            },
            {
                id: 'factorization',
                unit: '중1. 소인수분해',
                no: 2,
                title: '소인수분해',
                desc: '자연수를 소인수만의 곱으로 나타내요',
                goals: ['소인수', '거듭제곱', '소인수분해'],
                href: './ahamath/1/factorization.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'gcdlcm',
                unit: '중1. 소인수분해',
                no: 3,
                title: '최대공약수와 최소공배수',
                desc: '소인수분해로 두 수의 관계를 봐요',
                goals: ['최대공약수', '최소공배수', '서로소'],
                href: './ahamath/1/gcdlcm.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'coordinate',
                unit: '중1. 좌표평면과 그래프',
                no: 1,
                title: '순서쌍과 좌표',
                desc: '평면 위의 자리를 수 두 개로 정확하게 알려 주는 방법을 배워요.',
                goals: ['수직선', '좌표평면', '순서쌍', '사분면'],
                href: './ahamath/1/coordinate.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'graph',
                unit: '중1. 좌표평면과 그래프',
                no: 2,
                title: '그래프',
                desc: '변하는 모습을 그림 한 장으로 나타내고 읽는 방법을 배워요.',
                goals: ['그래프', '그래프 해석'],
                href: './ahamath/1/graph.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'proportion',
                unit: '중1. 좌표평면과 그래프',
                no: 3,
                title: '정비례와 반비례',
                desc: '한쪽이 두 배가 될 때 다른 쪽이 어떻게 변하는지 배워요.',
                goals: ['정비례', '반비례', '관계식', '그래프'],
                href: './ahamath/1/proportion.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'daepyogap',
                unit: '중1. 자료의 정리와 해석',
                no: 1,
                title: '대푯값',
                desc: '여러 개의 숫자를 하나의 숫자로 대신 말하는 방법을 배워요.',
                goals: ['평균', '중앙값', '최빈값'],
                href: './ahamath/1/representativevalue.html',
                status: 'ready',
                basicTotal: 5,
                challengeTotal: 3
            },
            {
                id: 'frequency',
                unit: '중1. 자료의 정리와 해석',
                no: 2,
                title: '도수분포표와 히스토그램',
                desc: '자료를 구간으로 나누어 표와 그래프로 나타내요.',
                goals: ['줄기와 잎 그림', '도수분포표', '히스토그램', '도수분포다각형'],
                href: './ahamath/1/frequency.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 2
            },
            {
                id: 'relative',
                unit: '중1. 자료의 정리와 해석',
                no: 3,
                title: '상대도수와 그 그래프',
                desc: '수가 다른 두 집단을 공평하게 비교하는 방법을 배워요.',
                goals: ['상대도수', '두 자료 비교하기'],
                href: './ahamath/1/relative.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 2
            }
        ];

        /* ---------- 저장된 학습 기록 읽기 ---------- */
        function readRecord(topicId) {
            try {
                const raw = window.localStorage.getItem('ahamath.' + topicId + '.v1');
                if (!raw) { return null; }
                return JSON.parse(raw);
            } catch (e) { return null; }
        }

        /* 한 번에 맞힌 문항만 세기 (요약이 없는 예전 기록을 위한 보조 계산)
           기초 미션은 q, 도전 미션은 x 로 시작하는 문항 ID 를 씁니다. */
        function countFirstTry(best, prefix) {
            if (!best) { return 0; }
            let count = 0;
            Object.keys(best).forEach(function (id) {
                if (id.indexOf(prefix) === 0 && best[id] === 'firstTry') { count++; }
            });
            return count;
        }

        /* 학습 페이지가 저장한 요약값을 우선 쓰고, 없을 때만 위 보조 계산을 씁니다 */
        function solvedCount(summary, best, key, prefix, total) {
            const fromSummary = summary[key];
            const value = (typeof fromSummary === 'number') ? fromSummary : countFirstTry(best, prefix);
            return Math.max(0, Math.min(value, total));
        }

        /* ---------- 미션 칩 ---------- */
        function missionChip(label, solved, total, gold) {
            const text = label + ' ' + solved + ' / ' + total;
            if (solved === 0) {
                return '<span class="chip soon"><i class="bi bi-dash-circle"></i> ' + text + '</span>';
            }
            if (solved >= total) {
                return '<span class="chip ' + (gold ? 'gold' : 'green') + '">' +
                    '<i class="bi ' + (gold ? 'bi-stars' : 'bi-check-circle-fill') + '"></i> ' + text + '</span>';
            }
            return '<span class="chip' + (gold ? ' gold' : '') + '"><i class="bi bi-pencil-fill"></i> ' + text + '</span>';
        }

        /* ---------- 상태 계산 ---------- */
        function stateOf(record, topic) {
            const summary = (record && record.summary) || {};
            const best = (record && record.best) || {};
            const hasStarted = !!(record && (record.updatedAt || summary.updatedAt || record.gate));

            const basicTotal = summary.basicTotal || topic.basicTotal || 4;
            const challengeTotal = (typeof summary.challengeTotal === 'number')
                ? summary.challengeTotal
                : (topic.challengeTotal || 0);

            const basicSolved = solvedCount(summary, best, 'basicFirstTry', 'q', basicTotal);
            const challengeSolved = solvedCount(summary, best, 'challengeFirstTry', 'x', challengeTotal);

            const chips = [missionChip('기초 미션', basicSolved, basicTotal, false)];
            if (challengeTotal > 0) {
                chips.push(missionChip('도전 미션', challengeSolved, challengeTotal, true));
            }

            if (!hasStarted) {
                return {
                    key: 'new', cls: 'none', icon: 'bi-play-circle',
                    text: '아직 시작하지 않았어요', color: 'var(--primary)', percent: 0, chips: chips
                };
            }

            /* 진행률은 학습 페이지와 같은 식으로 계산합니다 (자가진단 1칸 + 한 번에 맞힌 기초 미션) */
            const gate = record.gate || summary.gate || null;
            const percent = Math.min(100, Math.round(((gate ? 1 : 0) + basicSolved) / (1 + basicTotal) * 100));

            // 아하! 이해했어요 : 'aha'를 눌렀거나, 기초 미션을 모두 한 번에 맞혔을 때
            const isAha = (gate === 'aha' || summary.mastered || (basicTotal > 0 && basicSolved >= basicTotal));

            if (isAha) {
                return {
                    key: 'aha', cls: 'aha', icon: 'bi-lightbulb-fill',
                    text: '아하! 이해했어요', color: 'var(--aha)', percent: percent, chips: chips
                };
            }

            // '아직은.... 다시 볼래요'를 눌렀거나 학습 진행 중인 경우
            return {
                key: 'wait', cls: 'wait', icon: 'bi-bookmark-fill',
                text: '아직은.... 다시 볼래요', color: 'var(--wait)', percent: percent, chips: chips
            };
        }

        /* ---------- 카드 그리기 ---------- */
        function cardHTML(topic) {
            const record = topic.status === 'ready' ? readRecord(topic.id) : null;
            const state = stateOf(record, topic);
            const goals = topic.goals.map(function (g) { return '<span class="goal-chip">' + g + '</span>'; }).join('');

            const head =
                '<div class="d-flex align-items-start gap-2">' +
                '<span class="topic-no">' + topic.no + '</span>' +
                '<div class="flex-grow-1">' +
                '<h3 class="topic-name">' + topic.title + '</h3>' +
                '<p class="topic-desc">' + topic.desc + '</p>' +
                '<div>' + goals + '</div>' +
                '</div>' +
                (topic.status === 'ready' ? '<i class="bi bi-chevron-right text-primary fs-5"></i>' : '') +
                '</div>';

            if (topic.status !== 'ready') {
                return '<div class="topic-card soon">' + head +
                    '<div class="chip-row"><span class="chip soon">준비 중이에요</span></div></div>';
            }

            const body = state.key === 'new' ? '' :
                '<span class="state-pill ' + state.cls + '"><i class="bi ' + state.icon + '"></i> ' + state.text + '</span>' +
                '<div class="progress-row">' +
                '<span class="mini-progress"><div style="width:' + state.percent + '%;background:' + state.color + '"></div></span>' +
                '<span class="percent-text">' + state.percent + '%</span>' +
                '</div>' +
                (state.chips.length ? '<div class="chip-row">' + state.chips.join('') + '</div>' : '');

            return '<a class="topic-card state-' + state.key + '" href="' + topic.href + '">' + head + body + '</a>';
        }

        /* ---------- 단원 묶기 · 단원별 진행 상황 ---------- */
        const UI_KEY = 'ahamath.ui.units';

        function groupTopics() {
            const groups = [];
            TOPICS.forEach(function (t) {
                let group = groups.filter(function (g) { return g.unit === t.unit; })[0];
                if (!group) { group = { unit: t.unit, items: [] }; groups.push(group); }
                group.items.push(t);
            });
            return groups;
        }

        function unitStat(group) {
            let ready = 0, aha = 0, sum = 0;
            group.items.forEach(function (t) {
                if (t.status !== 'ready') { return; }
                ready++;
                const state = stateOf(readRecord(t.id), t);
                if (state.key === 'aha') { aha++; }
                sum += state.percent || 0;
            });
            return { ready: ready, aha: aha, percent: ready ? Math.round(sum / ready) : 0 };
        }

        /* 가장 최근에 공부한 주제 (이어서 학습하기 · 처음 펼칠 단원에 씁니다) */
        function latestTopic() {
            let latest = null;
            TOPICS.forEach(function (t) {
                if (t.status !== 'ready') { return; }
                const record = readRecord(t.id);
                const updated = record && (record.updatedAt || (record.summary && record.summary.updatedAt));
                if (!updated) { return; }
                if (!latest || updated > latest.updatedAt) { latest = { topic: t, updatedAt: updated }; }
            });
            return latest;
        }

        function readOpenUnits() {
            try {
                const raw = window.localStorage.getItem(UI_KEY);
                if (!raw) { return null; }
                const list = JSON.parse(raw);
                return Array.isArray(list) ? list : null;
            } catch (e) { return null; }
        }

        function saveOpenUnits() {
            try { window.localStorage.setItem(UI_KEY, JSON.stringify(openUnits)); } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
        }

        let openUnits = null;

        function initOpenUnits(groups) {
            if (openUnits) { return; }
            openUnits = readOpenUnits();
            if (openUnits) { return; }
            const latest = latestTopic();                 // 처음 들어오면 최근 단원만 펼쳐 둡니다
            openUnits = [latest ? latest.topic.unit : (groups[0] ? groups[0].unit : '')];
        }

        function applyUnit(index, open) {
            const block = document.getElementById('unit-' + index);
            if (!block) { return; }
            block.classList.toggle('open', open);
            block.querySelector('.unit-head').setAttribute('aria-expanded', open ? 'true' : 'false');
            block.querySelector('.unit-body').hidden = !open;
        }

        function setUnitOpen(index, unit, open) {
            const at = openUnits.indexOf(unit);
            if (open && at < 0) { openUnits.push(unit); }
            if (!open && at > -1) { openUnits.splice(at, 1); }
            saveOpenUnits();
            applyUnit(index, open);
        }

        /* ---------- 화면 그리기 ---------- */
        function renderTopics() {
            const groups = groupTopics();
            initOpenUnits(groups);

            /* 맨 위 단원 바로가기 칩 */
            document.getElementById('jumpRow').innerHTML = groups.map(function (group, i) {
                const stat = unitStat(group);
                const done = stat.ready > 0 && stat.aha >= stat.ready;
                const short = group.unit.replace(/^[^.]*\.\s*/, '');     // '중1. ' 은 떼고 짧게
                return '<button type="button" class="jump-chip' + (done ? ' done' : '') + '" data-unit="' + i + '">' +
                    short + '<span class="jc-n">' + stat.aha + '/' + stat.ready + '</span></button>';
            }).join('');

            /* 단원별 카드 목록 */
            document.getElementById('topicArea').innerHTML = groups.map(function (group, i) {
                const stat = unitStat(group);
                const done = stat.ready > 0 && stat.aha >= stat.ready;
                const open = openUnits.indexOf(group.unit) > -1;
                const color = done ? 'var(--aha)' : 'var(--primary)';
                return '<section class="unit-block' + (open ? ' open' : '') + (done ? ' done' : '') +
                    '" id="unit-' + i + '">' +
                    '<button type="button" class="unit-head" data-unit="' + i + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
                    '<span class="uh-arrow"><i class="bi bi-chevron-right"></i></span>' +
                    '<span class="uh-name">' + group.unit + '</span>' +
                    '<span class="uh-count">' +
                    (done ? '<i class="bi bi-check-circle-fill"></i> ' : '') +
                    '아하! ' + stat.aha + ' / ' + stat.ready + '</span>' +
                    '</button>' +
                    '<div class="uh-rule"><div style="width:' + stat.percent + '%;background:' + color + '"></div></div>' +
                    '<div class="unit-body"' + (open ? '' : ' hidden') + '>' +
                    '<div class="row g-3">' +
                    group.items.map(function (t) {
                        return '<div class="col-12 col-md-6">' + cardHTML(t) + '</div>';
                    }).join('') +
                    '</div></div></section>';
            }).join('');

            /* 머리줄을 누르면 접었다 폈다 */
            Array.prototype.slice.call(document.querySelectorAll('.unit-head')).forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const i = Number(btn.dataset.unit);
                    const unit = groups[i].unit;
                    setUnitOpen(i, unit, openUnits.indexOf(unit) < 0);
                });
            });

            /* 칩을 누르면 그 단원을 펼치고 그리로 이동 */
            Array.prototype.slice.call(document.querySelectorAll('.jump-chip')).forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const i = Number(btn.dataset.unit);
                    setUnitOpen(i, groups[i].unit, true);
                    const block = document.getElementById('unit-' + i);
                    if (block) { block.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
                });
            });
        }

        /* ---------- 이어서 학습하기 ---------- */
        function renderResume() {
            const latest = latestTopic();
            if (!latest) { return; }
            const box = document.getElementById('resumeBox');
            const link = document.getElementById('resumeLink');
            link.href = latest.topic.href;
            link.textContent = latest.topic.title + ' 이어서 학습하기';
            box.hidden = false;
        }

        document.getElementById('clearAll').addEventListener('click', function () {
            if (!window.confirm('모든 주제의 학습 기록을 지울까요?')) { return; }
            try {
                TOPICS.forEach(function (t) { window.localStorage.removeItem('ahamath.' + t.id + '.v1'); });
            } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
            renderTopics();
            document.getElementById('resumeBox').hidden = true;
        });

        renderTopics();
        renderResume();
    </script>
</body>

</html>
