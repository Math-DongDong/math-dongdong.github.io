<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아하! 수학 | 중학교 수학 한 걸음씩</title>

    <!-- 파비콘 -->
    <link rel="icon" href="../../assets/images/mainPage/동동이.jpg" type="image/jpeg" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <!-- 공통 네비게이션 CSS -->
    <link rel="stylesheet" href="../../css/navbar.css" />

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        :root {
            --bg: #ffffff;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --aha: #15803d;
            --aha-soft: #ecfdf5;
            --aha-line: #86efac;
            --wait: #b45309;
            --wait-soft: #fffbeb;
            --wait-line: #fcd34d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Pretendard Variable', sans-serif;
            line-height: 1.7;
            word-break: keep-all;
        }

        .page-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .hero {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.6rem 1.3rem;
        }

        .hero h1 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 0.5rem;
        }

        .hero p {
            margin: 0;
            font-size: 1.02rem;
            color: #374151;
        }

        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 0.35rem 0.5rem;
            border: 1px solid;
            text-align: center;
            white-space: nowrap;
            width: 100%;
        }

        .legend .aha {
            color: var(--aha);
            background: var(--aha-soft);
            border-color: var(--aha-line);
        }

        .legend .wait {
            color: var(--wait);
            background: var(--wait-soft);
            border-color: var(--wait-line);
        }

        /* ---------- 단원 탭 (가로 스크롤) ---------- */
        .unit-tabs {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding: 1.4rem 0 0.25rem;
            scrollbar-width: none;
        }

        .unit-tabs::-webkit-scrollbar {
            display: none;
        }

        .unit-tab {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.92rem;
            font-weight: 700;
            color: #475569;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.42rem 0.95rem;
            white-space: nowrap;
            transition: background .18s ease, color .18s ease, border-color .18s ease;
        }

        .unit-tab:hover {
            background: #e2e8f0;
        }

        .unit-tab .ut-n {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--muted);
        }

        .unit-tab.done {
            background: var(--aha-soft);
            border-color: var(--aha-line);
            color: var(--aha);
        }

        .unit-tab.done .ut-n {
            color: var(--aha);
        }

        .unit-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .unit-tab.active.done {
            background: var(--aha);
            border-color: var(--aha);
        }

        .unit-tab.active .ut-n {
            color: rgba(255, 255, 255, 0.85);
        }

        /* ---------- 선택된 단원 패널 ---------- */
        .unit-panel {
            margin-top: 1.1rem;
            animation: panelIn .22s ease;
        }

        @keyframes panelIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .up-head {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0 0.25rem 0.45rem;
        }

        .up-name {
            flex: 1 1 auto;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .up-count {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--muted);
            white-space: nowrap;
        }

        .unit-panel.done .up-count {
            color: var(--aha);
        }

        /* 제목 아래 밑줄이 곧 진행률 막대예요 */
        .up-rule {
            height: 3px;
            margin: 0 0.25rem 1rem;
            border-radius: 99px;
            background: var(--border);
            overflow: hidden;
        }

        .up-rule>div {
            height: 100%;
            border-radius: 99px;
            transition: width .4s ease;
        }

        /* ---------- 주제 목록 (한 줄에 한 주제) ---------- */
        .topic-list {
            background: var(--card);
            border: 1px solid #eef2f7;
            border-radius: 16px;
            overflow: hidden;
        }

        .topic-row {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
            padding: 0.78rem 0.95rem;
            border-top: 1px solid #f1f5f9;
            border-left: 4px solid var(--border);
            text-decoration: none;
            color: inherit;
            transition: background .15s ease;
        }

        .topic-row:first-child {
            border-top: none;
        }

        a.topic-row:hover {
            background: #f8fafc;
        }

        a.topic-row:hover .tr-go {
            color: var(--primary);
            transform: translateX(2px);
        }

        .topic-row.state-aha {
            border-left-color: var(--aha);
        }

        .topic-row.state-wait {
            border-left-color: var(--wait);
        }

        .topic-row.state-new {
            border-left-color: var(--primary);
        }

        .topic-row.soon {
            background: #fafafa;
            border-left-color: #e5e7eb;
        }

        .tr-no {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 800;
        }

        .topic-row.state-aha .tr-no {
            background: var(--aha-soft);
            color: var(--aha);
        }

        .topic-row.state-wait .tr-no {
            background: var(--wait-soft);
            color: var(--wait);
        }

        .topic-row.soon .tr-no {
            background: #f1f5f9;
            color: #b6bec9;
        }

        .tr-main {
            flex: 1 1 180px;
            min-width: 0;
        }

        .tr-name {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .tr-flag {
            font-size: 0.85rem;
        }

        .tr-flag.aha {
            color: var(--aha);
        }

        .tr-flag.wait {
            color: var(--wait);
        }

        .tr-desc {
            display: block;
            margin-top: 0.1rem;
            font-size: 0.82rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-row.soon .tr-desc {
            color: #9ca3af;
        }

        /* 미션 : 문항 하나가 점 하나 */
        .tr-miss {
            flex: 0 0 auto;
            display: flex;
            gap: 0.9rem;
            margin-left: auto;
        }

        .m-item {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--muted);
        }

        .m-dots {
            display: inline-flex;
            gap: 3px;
        }

        .m-dots i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: background .3s ease;
        }

        .m-dots i.done {
            background: var(--aha);
        }

        .m-dots i.gold {
            background: var(--wait);
        }

        .m-count {
            font-weight: 800;
            color: #94a3b8;
        }

        .m-item.full .m-count {
            color: var(--aha);
        }

        .m-item.full.gold .m-count {
            color: var(--wait);
        }

        .tr-go {
            flex: 0 0 auto;
            color: #cbd5e1;
            font-size: 1rem;
            transition: color .15s ease, transform .15s ease;
        }

        .tr-soon {
            margin-left: auto;
            font-size: 0.8rem;
            font-weight: 700;
            color: #9ca3af;
        }

        /* 좁은 화면에서는 미션 줄만 아래로 내려요 */
        @media (max-width: 575.98px) {
            .tr-go {
                order: 3;
                margin-left: auto;
            }

            .tr-miss {
                order: 4;
                flex-basis: 100%;
                margin-left: 33px;
                margin-top: 0.35rem;
            }
        }

        .footer-note {
            margin-top: 2.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <!-- 네비게이션바 -->
    <script src="../../js/navbar.js" data-type="middleschool"></script>

    <main class="page-wrap">

        <section class="hero">
            <h1>아하! 수학</h1>
            <p>
                어려워도 괜찮아요. 화면을 천천히 내리기만 하면 돼요.
                마지막에 <b>아하!</b> 인지 <b>아직은....</b> 인지만 한 번 눌러 주면 됩니다.
            </p>
            <div class="legend">
                <span class="aha"><i class="bi bi-lightbulb-fill"></i> 아하! 이해했어요</span>
                <span class="wait"><i class="bi bi-bookmark-fill"></i> 아직은.... 다시 볼래요</span>
            </div>
            <div class="mt-3" id="resumeBox" hidden>
                <a class="btn btn-primary fw-bold px-3" id="resumeLink" href="#">이어서 학습하기</a>
            </div>
        </section>

        <!-- 단원 탭 (자동으로 그려집니다) -->
        <div class="unit-tabs" id="unitTabs" role="tablist" aria-label="단원 선택"></div>

        <!-- 선택한 단원의 주제 목록이 이 안에 자동으로 그려집니다 -->
        <div id="topicArea"></div>

        <p class="footer-note">
            학습 기록은 지금 사용하는 <b>기기의 브라우저</b>에 저장돼요.
            다른 기기에서 열면 기록이 보이지 않아요.
            미션 개수는 <b>한 번에 맞힌 문항</b>만 세요.
            <button class="btn btn-link p-0 align-baseline text-decoration-none" id="clearAll">기록 모두 지우기</button>
        </p>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /* =====================================================================
           [ 주제 추가 방법 ]
           아래 TOPICS 배열에 항목을 하나 더 넣기만 하면 목록이 자동으로 생깁니다.

           id     : 학습 페이지에서 쓰는 주제 ID (저장 키 'ahamath.{id}.v1' 와 반드시 같게)
           unit   : 단원 이름 (같은 unit끼리 자동으로 한 탭에 묶임. 띄어쓰기까지 똑같이!)
           no     : 목록 왼쪽 번호
           title  : 주제 이름
           desc   : 한 줄 소개 (목록에서 제목 아래 한 줄로 보입니다)
           href   : 학습 페이지 경로 (ahamath 폴더 안)
           status : 'ready'(학습 가능) 또는 'soon'(준비 중)

           basicTotal / challengeTotal
                  : 그 주제의 기초·도전 미션 문항 수.
                    아직 한 번도 들어가 보지 않은 학생에게 '0 / 4' 처럼 보여 주기 위한 값이라
                    학습 페이지의 문항 수와 같게 적어 주세요.
                    한 번이라도 학습 페이지를 열면 실제 문항 수로 자동으로 맞춰집니다.
                    도전 미션이 없는 주제는 challengeTotal 을 0 으로 두면 칩이 사라집니다.

           [ 단원 탭 ]
           같은 unit 끼리 묶여 상단 탭 하나가 됩니다. 주제가 늘어나도 화면이 길어지지 않아요.
           - 처음 들어오면 가장 최근에 공부하던 단원 탭이 열립니다
           - 마지막으로 본 탭은 기기에 기억됩니다 (저장 키 'ahamath.ui.unit')
           - 탭 옆 숫자는 그 단원의 '아하! 개수 / 학습 가능한 주제 수' 입니다

           [ 미션 개수를 세는 규칙 ]
           '한 번에 맞힌 문항(firstTry)'만 개수로 인정합니다.
           두 번째 시도에 맞힌 문항은 세지 않고, 학습 페이지의 '다시 볼 문제'나
           '아하! 이해했어요 → 기초 미션 풀기'로 다시 풀어서 한 번에 맞히는 순간
           학습 페이지가 기록을 올려 주고, 그 값이 이 목록에 그대로 반영됩니다.
           ===================================================================== */
        const TOPICS = [
            {
                id: 'prime',
                unit: '중1. 소인수분해',
                no: 1,
                title: '소수와 합성수',
                desc: '더 쪼개지지 않는 수를 찾아봐요',
                href: './ahamath/1/prime.html',
                status: 'ready',
                basicTotal: 5,
                challengeTotal: 3
            },
            {
                id: 'factorization',
                unit: '중1. 소인수분해',
                no: 2,
                title: '소인수분해',
                desc: '자연수를 소인수만의 곱으로 나타내요',
                href: './ahamath/1/factorization.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'gcdlcm',
                unit: '중1. 소인수분해',
                no: 3,
                title: '최대공약수와 최소공배수',
                desc: '소인수분해로 두 수의 관계를 봐요',
                href: './ahamath/1/gcdlcm.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'rational',
                unit: '중1. 정수와 유리수',
                no: 1,
                title: '정수와 유리수',
                desc: '자연수만으로 적을 수 없는 수를 부호와 함께 정리해요',
                href: './ahamath/1/rational.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'compare',
                unit: '중1. 정수와 유리수',
                no: 2,
                title: '절댓값과 수의 대소 관계',
                desc: '0에서 얼마나 떨어졌는지 재고, 어느 수가 더 큰지 견주어요',
                href: './ahamath/1/compare.html',
                status: 'ready',
                basicTotal: 5,
                challengeTotal: 3
            },
            {
                id: 'addsub',
                unit: '중1. 정수와 유리수',
                no: 3,
                title: '정수와 유리수의 덧셈과 뺄셈',
                desc: '부호를 정리하고 덧셈 하나로 계산해요',
                href: './ahamath/1/addsub.html',
                status: 'ready',
                basicTotal: 5,
                challengeTotal: 3
            },
            {
                id: 'multiplication',
                unit: '중1. 정수와 유리수',
                no: 5,
                title: '정수와 유리수의 곱셈',
                desc: '음수를 곱하면 부호가 어떻게 정해질까요',
                href: './ahamath/1/multiplication.html',
                status: 'soon',
                basicTotal: 5,
                challengeTotal: 3
            },
            {
                id: 'division',
                unit: '중1. 정수와 유리수',
                no: 6,
                title: '정수와 유리수의 나눗셈',
                desc: '나눗셈은 곱셈을 거꾸로 본 것이에요',
                href: './ahamath/1/division.html',
                status: 'soon',
                basicTotal: 5,
                challengeTotal: 2
            },
            {
                id: 'mixed',
                unit: '중1. 정수와 유리수',
                no: 7,
                title: '복잡한 식의 계산',
                desc: '어디부터 계산하느냐로 답이 달라져요',
                href: './ahamath/1/mixed.html',
                status: 'soon',
                basicTotal: 5,
                challengeTotal: 3
            },

            {
                id: 'coordinate',
                unit: '중1. 좌표평면과 그래프',
                no: 1,
                title: '순서쌍과 좌표',
                desc: '평면 위의 자리를 수 두 개로 정확하게 알려 주는 방법을 배워요.',
                href: './ahamath/1/coordinate.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'graph',
                unit: '중1. 좌표평면과 그래프',
                no: 2,
                title: '그래프',
                desc: '변하는 모습을 그림 한 장으로 나타내고 읽는 방법을 배워요.',
                href: './ahamath/1/graph.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'proportion',
                unit: '중1. 좌표평면과 그래프',
                no: 3,
                title: '정비례와 반비례',
                desc: '한쪽이 두 배가 될 때 다른 쪽이 어떻게 변하는지 배워요.',
                href: './ahamath/1/proportion.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 3
            },
            {
                id: 'daepyogap',
                unit: '중1. 자료의 정리와 해석',
                no: 1,
                title: '대푯값',
                desc: '여러 개의 숫자를 하나의 숫자로 대신 말하는 방법을 배워요.',
                href: './ahamath/1/representativevalue.html',
                status: 'ready',
                basicTotal: 5,
                challengeTotal: 3
            },
            {
                id: 'frequency',
                unit: '중1. 자료의 정리와 해석',
                no: 2,
                title: '도수분포표와 히스토그램',
                desc: '자료를 구간으로 나누어 표와 그래프로 나타내요.',
                href: './ahamath/1/frequency.html',
                status: 'ready',
                basicTotal: 4,

            },
            {
                id: 'relative',
                unit: '중1. 자료의 정리와 해석',
                no: 3,
                title: '상대도수와 그 그래프',
                desc: '수가 다른 두 집단을 공평하게 비교하는 방법을 배워요.',
                href: './ahamath/1/relative.html',
                status: 'ready',
                basicTotal: 4,
                challengeTotal: 2
            }
        ];

        /* ---------- 저장된 학습 기록 읽기 ---------- */
        function readRecord(topicId) {
            try {
                const raw = window.localStorage.getItem('ahamath.' + topicId + '.v1');
                if (!raw) { return null; }
                return JSON.parse(raw);
            } catch (e) { return null; }
        }

        /* 한 번에 맞힌 문항만 세기 (요약이 없는 예전 기록을 위한 보조 계산)
           기초 미션은 q, 도전 미션은 x 로 시작하는 문항 ID 를 씁니다. */
        function countFirstTry(best, prefix) {
            if (!best) { return 0; }
            let count = 0;
            Object.keys(best).forEach(function (id) {
                if (id.indexOf(prefix) === 0 && best[id] === 'firstTry') { count++; }
            });
            return count;
        }

        /* 학습 페이지가 저장한 요약값을 우선 쓰고, 없을 때만 위 보조 계산을 씁니다 */
        function solvedCount(summary, best, key, prefix, total) {
            const fromSummary = summary[key];
            const value = (typeof fromSummary === 'number') ? fromSummary : countFirstTry(best, prefix);
            return Math.max(0, Math.min(value, total));
        }

        /* ---------- 미션 표시 (문항 하나가 점 하나) ---------- */
        function missionRow(label, solved, total, gold) {
            let dots = '';
            for (let i = 0; i < total; i++) {
                dots += '<i class="' + (i < solved ? (gold ? 'gold' : 'done') : '') + '"></i>';
            }
            return '<span class="m-item' + (solved >= total ? ' full' : '') + (gold ? ' gold' : '') +
                '" title="' + label + ' 미션 ' + solved + ' / ' + total + '">' +
                '<span class="m-label">' + label + '</span>' +
                '<span class="m-dots">' + dots + '</span>' +
                '<span class="m-count">' + solved + '/' + total + '</span>' +
                '</span>';
        }

        /* ---------- 상태 계산 ---------- */
        function stateOf(record, topic) {
            const summary = (record && record.summary) || {};
            const best = (record && record.best) || {};
            const hasStarted = !!(record && (record.updatedAt || summary.updatedAt || record.gate));

            const basicTotal = summary.basicTotal || topic.basicTotal || 4;
            const challengeTotal = (typeof summary.challengeTotal === 'number')
                ? summary.challengeTotal
                : (topic.challengeTotal || 0);

            const basicSolved = solvedCount(summary, best, 'basicFirstTry', 'q', basicTotal);
            const challengeSolved = solvedCount(summary, best, 'challengeFirstTry', 'x', challengeTotal);

            const rows = [missionRow('기초', basicSolved, basicTotal, false)];
            if (challengeTotal > 0) {
                rows.push(missionRow('도전', challengeSolved, challengeTotal, true));
            }

            if (!hasStarted) {
                return {
                    key: 'new', cls: 'none', icon: 'bi-play-circle',
                    text: '아직 시작하지 않았어요', flag: '', color: 'var(--primary)', percent: 0, rows: rows
                };
            }

            /* 진행률은 학습 페이지와 같은 식으로 계산합니다 (자가진단 1칸 + 한 번에 맞힌 기초 미션) */
            const gate = record.gate || summary.gate || null;
            const percent = Math.min(100, Math.round(((gate ? 1 : 0) + basicSolved) / (1 + basicTotal) * 100));

            // 아하! 이해했어요 : 'aha'를 눌렀거나, 기초 미션을 모두 한 번에 맞혔을 때
            const isAha = (gate === 'aha' || summary.mastered || (basicTotal > 0 && basicSolved >= basicTotal));

            if (isAha) {
                return {
                    key: 'aha', cls: 'aha', icon: 'bi-lightbulb-fill',
                    text: '아하! 이해했어요', flag: 'bi-lightbulb-fill', color: 'var(--aha)', percent: percent, rows: rows
                };
            }

            // '아직은.... 다시 볼래요'를 눌렀거나 학습 진행 중인 경우
            return {
                key: 'wait', cls: 'wait', icon: 'bi-bookmark-fill',
                text: '아직은.... 다시 볼래요', flag: 'bi-bookmark-fill', color: 'var(--wait)', percent: percent, rows: rows
            };
        }

        /* ---------- 주제 한 줄 그리기 ---------- */
        function rowHTML(topic) {
            const record = topic.status === 'ready' ? readRecord(topic.id) : null;
            const state = stateOf(record, topic);

            const main =
                '<span class="tr-no">' + topic.no + '</span>' +
                '<span class="tr-main">' +
                '<span class="tr-name">' + topic.title +
                (state.flag ? '<i class="bi ' + state.flag + ' tr-flag ' + state.cls + '" title="' + state.text + '"></i>' : '') +
                '</span>' +
                '<span class="tr-desc">' + topic.desc + '</span>' +
                '</span>';

            if (topic.status !== 'ready') {
                return '<div class="topic-row soon">' + main + '<span class="tr-soon">준비 중이에요</span></div>';
            }

            return '<a class="topic-row state-' + state.key + '" href="' + topic.href + '">' + main +
                '<i class="bi bi-chevron-right tr-go"></i>' +
                '<span class="tr-miss">' + state.rows.join('') + '</span>' +
                '</a>';
        }

        /* ---------- 단원 묶기 · 단원별 진행 상황 ---------- */
        const UI_KEY = 'ahamath.ui.unit';

        function groupTopics() {
            const groups = [];
            TOPICS.forEach(function (t) {
                let group = groups.filter(function (g) { return g.unit === t.unit; })[0];
                if (!group) { group = { unit: t.unit, items: [] }; groups.push(group); }
                group.items.push(t);
            });
            return groups;
        }

        function unitStat(group) {
            let ready = 0, aha = 0, sum = 0;
            group.items.forEach(function (t) {
                if (t.status !== 'ready') { return; }
                ready++;
                const state = stateOf(readRecord(t.id), t);
                if (state.key === 'aha') { aha++; }
                sum += state.percent || 0;
            });
            return { ready: ready, aha: aha, percent: ready ? Math.round(sum / ready) : 0 };
        }

        /* 가장 최근에 공부한 주제 (이어서 학습하기 · 처음 열릴 탭에 씁니다) */
        function latestTopic() {
            let latest = null;
            TOPICS.forEach(function (t) {
                if (t.status !== 'ready') { return; }
                const record = readRecord(t.id);
                const updated = record && (record.updatedAt || (record.summary && record.summary.updatedAt));
                if (!updated) { return; }
                if (!latest || updated > latest.updatedAt) { latest = { topic: t, updatedAt: updated }; }
            });
            return latest;
        }

        function readActiveUnit() {
            try { return window.localStorage.getItem(UI_KEY) || null; } catch (e) { return null; }
        }

        function saveActiveUnit() {
            try { window.localStorage.setItem(UI_KEY, activeUnit); } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
        }

        let activeUnit = null;

        /* 저장된 탭 → 최근 학습 단원 → 첫 단원 순서로 선택합니다 */
        function initActiveUnit(groups) {
            const exists = function (unit) {
                return !!unit && groups.some(function (g) { return g.unit === unit; });
            };
            if (exists(activeUnit)) { return; }

            const saved = readActiveUnit();
            if (exists(saved)) { activeUnit = saved; return; }

            const latest = latestTopic();
            if (latest && exists(latest.topic.unit)) { activeUnit = latest.topic.unit; return; }

            activeUnit = groups[0] ? groups[0].unit : '';
        }

        /* ---------- 화면 그리기 ---------- */
        function renderTopics() {
            const groups = groupTopics();
            initActiveUnit(groups);

            /* 상단 단원 탭 */
            document.getElementById('unitTabs').innerHTML = groups.map(function (group, i) {
                const stat = unitStat(group);
                const done = stat.ready > 0 && stat.aha >= stat.ready;
                const active = group.unit === activeUnit;
                const short = group.unit.replace(/^[^.]*\.\s*/, '');     // '중1. ' 은 떼고 짧게
                return '<button type="button" role="tab" aria-selected="' + (active ? 'true' : 'false') + '"' +
                    ' class="unit-tab' + (done ? ' done' : '') + (active ? ' active' : '') + '" data-unit="' + i + '">' +
                    short + '<span class="ut-n">' + stat.aha + '/' + stat.ready + '</span></button>';
            }).join('');

            /* 선택된 단원의 주제 목록 */
            const current = groups.filter(function (g) { return g.unit === activeUnit; })[0] || groups[0];
            if (current) {
                const stat = unitStat(current);
                const done = stat.ready > 0 && stat.aha >= stat.ready;
                const color = done ? 'var(--aha)' : 'var(--primary)';

                document.getElementById('topicArea').innerHTML =
                    '<section class="unit-panel' + (done ? ' done' : '') + '" role="tabpanel">' +
                    '<div class="up-head">' +
                    '<span class="up-name">' + current.unit + '</span>' +
                    '<span class="up-count">' +
                    (done ? '<i class="bi bi-check-circle-fill"></i> ' : '') +
                    '아하! ' + stat.aha + ' / ' + stat.ready + '</span>' +
                    '</div>' +
                    '<div class="up-rule"><div style="width:' + stat.percent + '%;background:' + color + '"></div></div>' +
                    '<div class="topic-list">' +
                    current.items.map(function (t) { return rowHTML(t); }).join('') +
                    '</div></section>';
            }

            /* 탭을 누르면 그 단원 목록으로 바꿉니다 */
            Array.prototype.slice.call(document.querySelectorAll('.unit-tab')).forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const unit = groups[Number(btn.dataset.unit)].unit;
                    if (unit === activeUnit) { return; }
                    activeUnit = unit;
                    saveActiveUnit();
                    renderTopics();
                });
            });

            /* 선택된 탭이 화면 밖에 있으면 가운데로 끌어옵니다 (좁은 화면 대응) */
            const activeTab = document.querySelector('.unit-tab.active');
            if (activeTab) { activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
        }

        /* ---------- 이어서 학습하기 ---------- */
        function renderResume() {
            const latest = latestTopic();
            if (!latest) { return; }
            const box = document.getElementById('resumeBox');
            const link = document.getElementById('resumeLink');
            link.href = latest.topic.href;
            link.textContent = latest.topic.title + ' 이어서 학습하기';
            box.hidden = false;
        }

        document.getElementById('clearAll').addEventListener('click', function () {
            if (!window.confirm('모든 주제의 학습 기록을 지울까요?')) { return; }
            try {
                TOPICS.forEach(function (t) { window.localStorage.removeItem('ahamath.' + t.id + '.v1'); });
            } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
            renderTopics();
            document.getElementById('resumeBox').hidden = true;
        });

        renderTopics();
        renderResume();
    </script>
</body>

</html>
