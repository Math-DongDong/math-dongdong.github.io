<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로토 게임</title>
    <!-- 파비콘 및 PWA 설정 -->
    <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../../../css/navbar.css">
    <link rel="stylesheet" href="../../../css/dashboard.css">

    <!-- 커스텀 스타일 -->
    <style>
        /* 표(Table) 스타일 */
        .blotto-table th,
        .blotto-table td {
            text-align: center;
            vertical-align: middle;
        }

        .blotto-table th:first-child {
            background-color: #f1f3f5;
            font-weight: bold;
        }

        .round-row td {
            background-color: #fff;
        }

        .hidden-value {
            color: transparent;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        .submitted-check {
            color: #198754;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 1등 점수 강조 */
        .score-top-col {
            background: linear-gradient(135deg, #fff8dc, #ffe066) !important;
            border-left: 3px solid #f5a623;
            border-right: 3px solid #f5a623;
        }

        .score-top-col .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #b45309;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .thead-top-col {
            background: linear-gradient(135deg, #fff8dc, #ffe066) !important;
            border-left: 3px solid #f5a623;
            border-right: 3px solid #f5a623;
            color: #92400e;
            font-weight: 900;
        }

        /* 학생 카드 디자인 */
        .player-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            border: 2px solid #e9ecef;
        }

        .player-card.revealing {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(13, 110, 253, 0.25);
            border-color: #0d6efd !important;
            z-index: 10;
        }

        .reveal-badge {
            transition: all 0.5s;
            font-size: 1.5rem;
            font-weight: 900;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 라운드 기록 테이블 */
        .history-table {
            font-size: 0.88rem;
        }

        .history-table th {
            background-color: #f8f9fa;
            font-weight: 700;
            text-align: center;
            vertical-align: middle;
        }

        .history-table td {
            text-align: center;
            vertical-align: middle;
        }

        .history-table .rank-1 {
            background: linear-gradient(135deg, #fff8dc, #ffe066);
            font-weight: 900;
            color: #b45309;
        }

        .history-table .rank-last {
            background: #fff0f0;
            color: #888;
        }

        /* 1등 강조 (game over) */
        @keyframes winner-glow {

            0%,
            100% {
                box-shadow: 0 0 12px 3px rgba(255, 193, 7, 0.5);
                border-color: #ffc107;
            }

            50% {
                box-shadow: 0 0 28px 8px rgba(255, 193, 7, 0.9);
                border-color: #ff9800;
            }
        }

        .player-card.winner {
            background: linear-gradient(135deg, #fffde7, #fff8dc) !important;
            border: 3px solid #ffc107 !important;
            transform: scale(1.04);
            animation: winner-glow 1.8s ease-in-out infinite;
            z-index: 5;
        }

        .player-card.winner .winner-crown {
            font-size: 2rem;
            display: block;
            animation: pop 0.5s ease;
        }

        .player-card.winner .winner-score {
            font-size: 2rem;
            font-weight: 900;
            color: #b45309;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <!-- 공통 모달 -->
    <div class="modal fade" id="customModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="customModalTitle">알림</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pb-0" id="customModalBody">
                    <!-- Message -->
                </div>
                <div class="modal-footer border-0 pt-3">
                    <button type="button" class="btn btn-secondary rounded-3 px-4 d-none"
                        id="customModalCancel">취소</button>
                    <button type="button" class="btn btn-primary rounded-3 px-4" id="customModalConfirm">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상단 네비게이션바 공통 스크립트 -->
    <script src="../../../js/navbar.js"></script>

    <main class="container pt-4">
        <!-- 현재 접속 중인 방 정보 -->
        <div class="text-end mb-3">
            <span class="badge bg-secondary fs-6" id="nav-room-info">대기 중</span>
        </div>

        <!-- ==================== 1. 랜딩 페이지 ==================== -->
        <div id="landing-section" class="section-container active-section text-center py-5">
            <h1 class="fw-bold mb-4">⚔️ 블로토 대령 게임</h1>
            <p class="text-muted mb-5">병력을 효율적으로 배분하여 더 많은 전장에서 승리하세요!</p>

            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div id="room-entrance-container"></div>
                </div>
            </div>
        </div>

        <!-- ==================== 2. 교사(관리자) 대시보드 ==================== -->
        <div id="admin-section" class="section-container">
            <!-- 대시보드 상단 헤더 (공통 모듈) -->
            <div id="dash-header-placeholder"></div>
            <script src="../../../js/dashboard-header.js" data-title="블로토 게임 대시보드" data-export="false" data-select-id="admin-room-select"></script>

            <div class="row g-4" id="admin-settings-area" style="display: none;">
                <div class="col-12">
                    <div class="card shadow-sm border-0 rounded-4 p-4">
                        <h5 class="fw-bold mb-3">⚙️ 게임 설정</h5>
                        <div class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label">참여 모둠 수</label>
                                <input type="number" id="setting-teams" class="form-control" value="7" min="2" max="20">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">병사 수</label>
                                <input type="number" id="setting-soldiers" class="form-control" value="200" min="10"
                                    max="1000">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">총 라운드 수</label>
                                <input type="number" id="setting-rounds" class="form-control" value="7" min="1"
                                    max="20">
                            </div>
                            <div class="col-md-3">
                                <button id="btn-confirm-create" class="btn btn-success w-100 fw-bold">새 게임 시작</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4 mt-2" id="admin-board-area" style="display: none;">
                <div class="col-12">
                    <div class="card shadow-sm border-0 rounded-4 p-4 overflow-auto">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">📊 현황판 (현재: <span id="admin-current-round-text"
                                    class="text-primary">1</span> 라운드)</h5>
                            <button id="btn-next-round" class="btn btn-warning fw-bold" disabled>결과 확인</button>
                        </div>

                        <div id="admin-cards-container" class="row g-3 justify-content-center">
                            <!-- 동적 생성: 학생 카드들 -->
                        </div>

                        <!-- 라운드별 기록 테이블 -->
                        <div id="admin-history-area" class="mt-4" style="display:none;">
                            <h6 class="fw-bold text-secondary mb-2">📋 라운드별 출전 기록</h6>
                            <div class="table-responsive">
                                <table class="table table-bordered history-table" id="admin-history-table">
                                    <thead id="admin-history-thead"></thead>
                                    <tbody id="admin-history-tbody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 3. 학생(모둠) 플레이 화면 ==================== -->
        <div id="student-section" class="section-container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
                        <h3 class="fw-bold mb-1 text-primary" id="student-nickname-display">모둠 이름</h3>
                        <p class="text-muted mb-4">현재 라운드: <span class="badge bg-danger fs-6"
                                id="student-round-display">1 / 7</span></p>

                        <div class="bg-light rounded p-4 mb-4">
                            <h5 class="fw-bold mb-2">잔여 병사 수</h5>
                            <h1 class="display-4 fw-bold text-success" id="student-remaining-display">200</h1>
                        </div>

                        <div id="student-input-area">
                            <h5 class="fw-bold mb-3">⚔️ 이번 라운드 출전 병사 수</h5>
                            <div class="input-group input-group-lg mb-3">
                                <input type="number" id="student-deploy-input" class="form-control text-center fw-bold"
                                    placeholder="0" min="0">
                                <button class="btn btn-primary fw-bold px-4" id="btn-submit-deploy">출전!</button>
                            </div>
                            <p class="text-muted small text-start">※ 남은 병사 수보다 많이 출전시킬 수 없습니다.</p>
                        </div>

                        <div id="student-waiting-area" class="d-none">
                            <div class="spinner-border text-primary mb-3" role="status"></div>
                            <h5 class="fw-bold text-primary">출전 완료!</h5>
                            <p class="text-muted">다른 모둠이 제출할 때까지 대기 중입니다...</p>
                            <button class="btn btn-outline-secondary mt-2" id="btn-edit-deploy">수정하기</button>
                        </div>

                        <div id="student-finished-area" class="d-none">
                            <h2 class="fw-bold text-success mb-3">🏆 게임 종료!</h2>
                            <p class="text-muted">모든 라운드가 끝났습니다.<br>선생님 화면에서 최종 순위를 확인하세요.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 스크립트 로직 -->
    <script type="module">
        import { rtdbBlotto as db } from "../../../js/firebase-config.js";
        import {
            renderRoomEntrance, customAlert, customPrompt, customConfirm
        } from "../../../js/room-auth.js";
        import {
            ref, set, get, child, push, onValue, update, remove, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        // =====================================================================
        // 전역 상태 변수
        // =====================================================================
        let currentRoomCode = null;
        let currentNickname = null;
        let roomSettings = null;
        let roomState = null;
        let playersData = {}; // key: nickname, value: player data

        let unsubRoom = null;
        let unsubPlayers = null;

        let isEditingDeploy = false;
        let lastSeenRound = 0;
        let isAnimating = false; // DB 업데이트/5초 대기 중 렌더링 방지용
        let revealIndex = -1;           // 현재까지 공개된 카드 인덱스 (-1: 언제 0이전)
        let currentRoundDeployments = []; // 현재 라운드 공개용 데이터

        // UI 영역
        const sectionLanding = document.getElementById('landing-section');
        const sectionStudent = document.getElementById('student-section');
        const sectionAdmin = document.getElementById('admin-section');
        const navRoomInfo = document.getElementById('nav-room-info');

        // =====================================================================
        // 1. 랜딩 페이지 로직 및 방 입장
        // =====================================================================
        renderRoomEntrance('room-entrance-container', {
            joinBtnText: "방 입장하기",
            onJoin: async (code, nickname) => {
                const roomRef = ref(db, "blotto_rooms/" + code);
                const docSnap = await get(roomRef);

                if (!docSnap.exists()) {
                    return await customAlert("알림", "존재하지 않는 방 코드입니다.");
                }

                const roomData = docSnap.val();
                const teamsMax = roomData.settings.teamsCount;

                // 이미 있는 닉네임인지 확인 (재접속)
                const playerRef = ref(db, "blotto_rooms/" + code + "/players/" + nickname);
                const playerSnap = await get(playerRef);

                if (!playerSnap.exists()) {
                    // 신규 접속인 경우 인원 수 체크
                    const playersCol = ref(db, "blotto_rooms/" + code + "/players");
                    const currentPlayersSnap = await get(playersCol);
                    if (currentPlayersSnap.size >= teamsMax) {
                        return await customAlert("입장 불가", "해당 게임의 모둠 수가 꽉 찼습니다.");
                    }

                    // 플레이어 데이터 생성
                    await set(playerRef, {
                        nickname: nickname,
                        score: 0,
                        remaining: roomData.settings.maxSoldiers,
                        rounds: {},
                        joinedAt: serverTimestamp()
                    });
                }

                currentRoomCode = code;
                currentNickname = nickname;

                sectionLanding.classList.remove('active-section');
                sectionStudent.classList.add('active-section');

                startStudentRealtimeSync();
            },
            onAdminSuccess: () => {
                sectionLanding.classList.remove('active-section');
                sectionAdmin.classList.add('active-section');
                document.getElementById('admin-settings-area').style.display = 'block';
                document.getElementById('admin-board-area').style.display = 'none';
                loadAdminRooms();
            }
        });

        // 새로운 방 만들기
        document.getElementById('btn-create-room').addEventListener('click', () => {
            document.getElementById('admin-settings-area').style.display = 'block';
            document.getElementById('admin-board-area').style.display = 'none';
            document.getElementById('admin-active-room').textContent = "";
            if (unsubRoom) unsubRoom();
            if (unsubPlayers) unsubPlayers();
        });

        document.getElementById('btn-confirm-create').addEventListener('click', async () => {
            const teams = parseInt(document.getElementById('setting-teams').value);
            const soldiers = parseInt(document.getElementById('setting-soldiers').value);
            const rounds = parseInt(document.getElementById('setting-rounds').value);

            if (!teams || !soldiers || !rounds) return customAlert("오류", "설정 값을 모두 올바르게 입력하세요.");

            const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();

            try {
                // 방 기본 정보 생성
                await set(ref(db, "blotto_rooms/" + roomCode), {
                    settings: {
                        teamsCount: teams,
                        maxSoldiers: soldiers,
                        maxRounds: rounds
                    },
                    state: {
                        currentRound: 1,
                        status: "playing"
                    },
                    createdAt: serverTimestamp()
                });

                await customAlert("방 생성 완료", `게임이 개설되었습니다.<br>방 코드: [ <b class="text-primary fs-3">${roomCode}</b> ]<br>학생들에게 코드를 안내해 주세요.`);

                startAdminMonitoring(roomCode);
            } catch (error) {
                console.error(error);
                await customAlert("오류", "방 생성에 실패했습니다.");
            }
        });




        // =====================================================================
        // 2. 선생님 대시보드 로직
        // =====================================================================
        function startAdminMonitoring(roomCode) {
            currentRoomCode = roomCode;
            document.getElementById('admin-settings-area').style.display = 'none';
            document.getElementById('admin-board-area').style.display = 'block';

            const select = document.getElementById('admin-room-select');
            if (select && select.querySelector(`option[value="${roomCode}"]`)) {
                select.value = roomCode;
            } else if (select) {
                const option = document.createElement('option');
                option.value = roomCode;
                option.textContent = roomCode;
                select.appendChild(option);
                select.value = roomCode;
            }

            if (unsubRoom) unsubRoom();
            if (unsubPlayers) unsubPlayers();

            // 방 정보 구독
            unsubRoom = onValue(ref(db, "blotto_rooms/" + roomCode), (docSnap) => {
                if (docSnap.exists()) {
                    roomSettings = docSnap.val().settings;
                    roomState = docSnap.val().state;
                    renderAdminBoard();
                }
            });

            // 플레이어 정보 구독
            unsubPlayers = onValue(ref(db, "blotto_rooms/" + roomCode + "/players"), (snapshot) => {
                playersData = {};
                snapshot.forEach(doc => {
                    playersData[doc.key] = doc.val();
                });
                renderAdminBoard();
            });
        }

        async function loadAdminRooms() {
            const snapshot = await get(ref(db, "blotto_rooms"));
            const select = document.getElementById('admin-room-select');
            select.innerHTML = '<option value="">방을 선택하세요</option>';
            const rooms = [];
            if (snapshot.exists()) {
                snapshot.forEach(docSnap => {
                    rooms.push({ id: docSnap.key, data: docSnap.val() });
                });
                rooms.sort((a, b) => (b.data.createdAt || 0) - (a.data.createdAt || 0));
                rooms.forEach(room => {
                    const option = document.createElement('option');
                    option.value = room.id;
                    option.textContent = room.id;
                    select.appendChild(option);
                });
            }
        }

        document.getElementById('admin-room-select').addEventListener('change', (e) => {
            const code = e.target.value;
            if (!code) {
                document.getElementById('admin-settings-area').style.display = 'block';
                document.getElementById('admin-board-area').style.display = 'none';
                if (unsubRoom) { unsubRoom(); unsubRoom = null; }
                if (unsubPlayers) { unsubPlayers(); unsubPlayers = null; }
                return;
            }
            startAdminMonitoring(code);
        });

        document.getElementById('btn-delete-room').addEventListener('click', async () => {
            const select = document.getElementById('admin-room-select');
            const roomCode = select.value;

            if (!roomCode) {
                return await customAlert("알림", "삭제할 방을 선택해 주세요.");
            }

            const confirmed = await customConfirm(
                "방 삭제 확인",
                `[ <b class="text-danger">${roomCode}</b> ] 방을 정말로 삭제하시겠습니까?<br><small class="text-muted">삭제된 방과 관련된 모든 학생 데이터는 복구할 수 없습니다.</small>`
            );

            if (!confirmed) return;

            try {
                // RTDB에서는 부모 경로를 지우면 하위도 모두 삭제됨
                await remove(ref(db, "blotto_rooms/" + roomCode));

                if (unsubRoom) { unsubRoom(); unsubRoom = null; }
                if (unsubPlayers) { unsubPlayers(); unsubPlayers = null; }

                document.getElementById('admin-active-room').textContent = "";
                document.getElementById('admin-settings-area').style.display = 'block';
                document.getElementById('admin-board-area').style.display = 'none';

                await loadAdminRooms();
                await customAlert("삭제 완료", "방이 성공적으로 삭제되었습니다.");
            } catch (error) {
                console.error(error);
                await customAlert("오류", "방 삭제 처리 중 오류가 발생했습니다.");
            }
        });

        function renderAdminBoard() {
            if (!roomSettings || !roomState) return;
            if (isAnimating) return; // 연출 중일 때는 화면 갱신 방지

            const container = document.getElementById('admin-cards-container');
            const currentRound = roomState.currentRound;
            const maxRounds = roomSettings.maxRounds;

            document.getElementById('admin-current-round-text').textContent = currentRound;

            // 플레이어 목록 배열 (가입순 정렬) - 실제 닉네임이 있는 플레이어만 필터링
            const playersList = Object.values(playersData)
                .filter(p => !!p.nickname)
                .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));

            // 1등 점수 구하기
            const scores = playersList.map(p => p.score || 0);
            const maxScore = scores.length > 0 ? Math.max(...scores) : -Infinity;

            let html = ``;
            let allSubmittedCurrentRound = true;
            let joinedPlayersCount = playersList.length;

            playersList.forEach(p => {
                const nickname = p.nickname;
                const isTop = (maxScore > 0 && p.score === maxScore);
                const badgeHtml = isTop ? `<span class="badge bg-warning text-dark fs-6 ms-2">🥇 1위</span>` : '';

                const currentSubmitted = p.rounds[currentRound];
                let roundStatusHtml = ``;

                if (currentSubmitted !== undefined) {
                    if (currentRound <= maxRounds && roomState.status === "playing") {
                        // 모두 제출 전까지는 숫자를 숨김
                        roundStatusHtml = `<div class="text-success fw-bold mt-2" style="font-size:1.2rem;" id="deploy-display-${nickname}">✔ 제출 완료</div>`;
                    } else {
                        // 결과가 이미 공개된(완료된) 게임 상태
                        roundStatusHtml = `<div class="text-primary fw-bold mt-2" style="font-size:1.5rem;">⚔️ ${currentSubmitted} 명</div>`;
                    }
                } else {
                    if (currentRound <= maxRounds) allSubmittedCurrentRound = false;
                    roundStatusHtml = `<div class="text-muted mt-2" style="font-size:1.1rem;" id="deploy-display-${nickname}">... 대기 중 ...</div>`;
                }

                const isGameOver = (roomState.status === 'finished');
                const winnerExtra = (isGameOver && isTop) ? `
                    <div class="text-center mt-2">
                        <span class="winner-crown">🍑</span>
                        <div class="winner-score">${p.score}점</div>
                        <div class="text-warning fw-bold" style="font-size:0.9rem;">🥇 최종 우승!</div>
                    </div>` : '';

                html += `
                <div class="col-md-4 col-sm-6">
                    <div class="card p-3 player-card h-100${isGameOver && isTop ? ' winner' : ''}" id="admin-card-${nickname}">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="fw-bold mb-0 text-dark">${nickname} ${badgeHtml}</h5>
                        </div>
                        <div class="d-flex justify-content-between text-muted small mb-3">
                            <span>점수: <b class="text-primary fs-6">${p.score}</b> 점</span>
                            <span>남은 병사: <b class="text-success fs-6">${p.remaining}</b> 명</span>
                        </div>
                        <div class="text-center bg-light rounded py-3">
                            <div class="small fw-bold text-secondary mb-1">[ ${currentRound} 라운드 출전 ]</div>
                            ${roundStatusHtml}
                        </div>
                        ${winnerExtra}
                    </div>
                </div>`;
            });

            if (playersList.length === 0) {
                html = `<div class="col-12 text-center text-muted py-5 fs-5">아직 입장한 모둠이 없습니다.</div>`;
            }

            container.innerHTML = electricityHtml(html);

            // ── 라운드별 기록 테이블 렌더링 ──
            const historyArea = document.getElementById('admin-history-area');
            const historyThead = document.getElementById('admin-history-thead');
            const historyTbody = document.getElementById('admin-history-tbody');

            // 공개된 라운드(현재 라운드보다 이전)만 표시
            const revealedRounds = [];
            for (let r = 1; r < currentRound && r <= maxRounds; r++) revealedRounds.push(r);

            if (revealedRounds.length > 0 && playersList.length > 0) {
                historyArea.style.display = 'block';

                // 헤더: 라운드 | 닉네임1 | 닉네임2 ...
                let theadHtml = '<tr><th>라운드</th>';
                playersList.forEach(p => { theadHtml += `<th>${p.nickname}</th>`; });
                theadHtml += '</tr>';
                historyThead.innerHTML = theadHtml;

                let tbodyHtml = '';
                revealedRounds.forEach(r => {
                    // 해당 라운드 출전 수 배열
                    const deploys = playersList.map(p => (p.rounds && p.rounds[r] !== undefined) ? p.rounds[r] : '-');
                    const numericDeploys = deploys.filter(v => v !== '-').map(Number);
                    const maxDeploy = numericDeploys.length > 0 ? Math.max(...numericDeploys) : null;
                    const minDeploy = numericDeploys.length > 0 ? Math.min(...numericDeploys) : null;

                    tbodyHtml += `<tr><th>${r}라운드</th>`;
                    deploys.forEach(v => {
                        let cls = '';
                        if (v !== '-') {
                            if (Number(v) === maxDeploy && maxDeploy !== minDeploy) cls = 'rank-1';
                            else if (Number(v) === minDeploy && maxDeploy !== minDeploy) cls = 'rank-last';
                        }
                        tbodyHtml += `<td class="${cls}">${v !== '-' ? v + '명' : '-'}</td>`;
                    });
                    tbodyHtml += '</tr>';
                });
                historyTbody.innerHTML = tbodyHtml;
            } else {
                historyArea.style.display = 'none';
            }

            // 다음 라운드 버튼 활성화 로직
            const btnNext = document.getElementById('btn-next-round');
            if (roomState.status === "finished" || currentRound > maxRounds) {
                btnNext.disabled = true;
                btnNext.textContent = "게임 종료";
                btnNext.className = "btn btn-secondary fw-bold";
            } else if (joinedPlayersCount > 1 && allSubmittedCurrentRound) {
                btnNext.disabled = false;
                btnNext.textContent = "한명씩 결과 확인";
                btnNext.className = "btn btn-success fw-bold";
            } else {
                btnNext.disabled = true;
                btnNext.textContent = "모두 제출 시 활성화됨";
                btnNext.className = "btn btn-warning fw-bold";
            }
        }

        // HTML 이스케이프가 아닌 단순 HTML 래퍼
        function electricityHtml(html) { return html; }


        // 한 명씩 결과 공개 및 라운드 종료 처리
        document.getElementById('btn-next-round').addEventListener('click', async () => {
            const btnNext = document.getElementById('btn-next-round');
            if (btnNext.disabled) return; // 이중 클릭 방지

            const currentRound = roomState.currentRound;
            const maxRounds = roomSettings.maxRounds;

            // ▶ 첫 번째 클릭: 현재 라운드 데이터 수집 및 및 랜덤 셔플
            if (revealIndex === -1) {
                currentRoundDeployments = Object.values(playersData)
                    .filter(p => p.nickname && p.rounds[currentRound] !== undefined)
                    .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0))
                    .map(p => ({ nickname: p.nickname, deployed: p.rounds[currentRound] }));

                // Fisher-Yates 셈플 - 매번 다른 순서로 공개
                for (let i = currentRoundDeployments.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentRoundDeployments[i], currentRoundDeployments[j]] = [currentRoundDeployments[j], currentRoundDeployments[i]];
                }

                isAnimating = true; // re-render 차단
                revealIndex = 0;
            } else {
                revealIndex++;
            }

            // 현재 인덱스 학생 카드 공개
            btnNext.disabled = true;
            const pData = currentRoundDeployments[revealIndex];
            const card = document.getElementById(`admin-card-${pData.nickname}`);
            const display = document.getElementById(`deploy-display-${pData.nickname}`);

            if (card && display) {
                card.classList.add('revealing');
                display.innerHTML = `<span class="reveal-badge text-danger pop">⚔️ ${pData.deployed}명</span>`;
                await new Promise(resolve => setTimeout(resolve, 500));
                card.classList.remove('revealing');
            }

            const isLast = revealIndex >= currentRoundDeployments.length - 1;

            if (!isLast) {
                // 다음 학생이 더 있음 → 버튼 다시 활성화
                const remaining = currentRoundDeployments.length - revealIndex - 1;
                btnNext.textContent = `다음 공개 (${revealIndex + 1}/${currentRoundDeployments.length})`;
                btnNext.className = "btn btn-primary fw-bold";
                btnNext.disabled = false;
            } else {
                // 마지막 학생 공개 완료 → 5초 조용히 대기 후 점수 반영
                btnNext.textContent = "점수 반영 중...";
                btnNext.className = "btn btn-secondary fw-bold";

                await new Promise(resolve => setTimeout(resolve, 5000));

                // ── 점수 계산 ──
                const teamsCount = currentRoundDeployments.length;
                const sorted = [...currentRoundDeployments].sort((a, b) => b.deployed - a.deployed);
                let rank = 1, prevDep = -1, skipped = 0;
                const scoreUpdates = {};
                for (const item of sorted) {
                    if (item.deployed === prevDep) { skipped++; }
                    else { rank = rank + skipped; skipped = 1; }
                    scoreUpdates[item.nickname] = Math.max(0, teamsCount - rank);
                    prevDep = item.deployed;
                }

                // ── DB 업데이트 ──
                try {
                    for (const { nickname } of currentRoundDeployments) {
                        const player = playersData[nickname];
                        const deployed = player.rounds[currentRound] || 0;
                        const newRemaining = Math.max(0, player.remaining - deployed);
                        const newScore = player.score + (scoreUpdates[nickname] || 0);
                        await updateDoc(doc(db, "blotto_rooms", currentRoomCode, "players", nickname), {
                            remaining: newRemaining,
                            score: newScore
                        });
                    }
                    const nextStatus = currentRound >= maxRounds ? "finished" : "playing";
                    await updateDoc(doc(db, "blotto_rooms", currentRoomCode), {
                        "state.currentRound": currentRound + 1,
                        "state.status": nextStatus
                    });
                } catch (err) {
                    console.error(err);
                    await customAlert("오류", "라운드 처리 중 문제가 발생했습니다.");
                } finally {
                    // 상태 리셋 후 정상 렌더링 재개
                    revealIndex = -1;
                    currentRoundDeployments = [];
                    isAnimating = false;
                    renderAdminBoard();
                }
            }
        });


        // =====================================================================
        // 3. 학생(모둠) 플레이 로직
        // =====================================================================
        function startStudentRealtimeSync() {
            navRoomInfo.innerHTML = `방 코드: <b>${currentRoomCode}</b> | 접속: <b>${currentNickname}</b>`;
            document.getElementById('student-nickname-display').textContent = currentNickname;

            // 방 정보 구독 (라운드 진행 상황 파악)
            unsubRoom = onValue(ref(db, "blotto_rooms/" + currentRoomCode), (docSnap) => {
                if (docSnap.exists()) {
                    roomSettings = docSnap.val().settings;
                    roomState = docSnap.val().state;
                    updateStudentUI();
                }
            });

            // 내 정보 구독 (잔여 병사 등 갱신)
            unsubPlayers = onValue(ref(db, "blotto_rooms/" + currentRoomCode + "/players/" + currentNickname), (docSnap) => {
                if (docSnap.exists()) {
                    playersData[currentNickname] = docSnap.val();
                    updateStudentUI();
                }
            });
        }

        function updateStudentUI() {
            if (!roomSettings || !roomState || !playersData[currentNickname]) return;

            const myData = playersData[currentNickname];
            const currentRound = roomState.currentRound;
            const maxRounds = roomSettings.maxRounds;

            document.getElementById('student-remaining-display').textContent = myData.remaining;

            const inputArea = document.getElementById('student-input-area');
            const waitingArea = document.getElementById('student-waiting-area');
            const finishedArea = document.getElementById('student-finished-area');
            const deployInput = document.getElementById('student-deploy-input');

            if (roomState.status === "finished" || currentRound > maxRounds) {
                document.getElementById('student-round-display').textContent = `게임 종료`;
                inputArea.classList.add('d-none');
                waitingArea.classList.add('d-none');
                finishedArea.classList.remove('d-none');
                return;
            }

            document.getElementById('student-round-display').textContent = `${currentRound} / ${maxRounds}`;

            if (lastSeenRound !== currentRound) {
                isEditingDeploy = false;
                lastSeenRound = currentRound;
            }

            // 현재 라운드를 이미 제출했는지 확인
            const hasSubmittedRound = myData.rounds[currentRound] !== undefined;

            if (hasSubmittedRound && !isEditingDeploy) {
                inputArea.classList.add('d-none');
                waitingArea.classList.remove('d-none');
            } else {
                inputArea.classList.remove('d-none');
                waitingArea.classList.add('d-none');
                if (!isEditingDeploy) {
                    deployInput.value = ""; // 입력창 초기화
                }
                deployInput.max = myData.remaining;
            }
        }

        document.getElementById('btn-edit-deploy').addEventListener('click', () => {
            isEditingDeploy = true;
            document.getElementById('student-deploy-input').value = playersData[currentNickname].rounds[roomState.currentRound] || "";
            updateStudentUI();
        });

        // 출전 버튼 클릭 (학생)
        document.getElementById('btn-submit-deploy').addEventListener('click', async () => {
            const myData = playersData[currentNickname];
            const currentRound = roomState.currentRound;

            const rawInput = document.getElementById('student-deploy-input').value.trim();
            // 빈 값이면 0으로 처리, 아니면 정수 제한
            let deployCount = rawInput === '' ? 0 : parseInt(rawInput, 10);

            if (isNaN(deployCount) || deployCount < 0) {
                return await customAlert("알림", "출전할 병사 수를 올바르게 입력하세요.");
            }
            if (deployCount > myData.remaining) {
                return await customAlert("알림", "남은 병사 수보다 많이 출전시킬 수 없습니다.");
            }

            try {
                const playerRef = ref(db, "blotto_rooms/" + currentRoomCode + "/players/" + currentNickname);
                // rounds 맵 업데이트
                await set(playerRef, {
                    rounds: {
                        [currentRound]: deployCount
                    }
                }, { merge: true });
                isEditingDeploy = false;

            } catch (err) {
                console.error(err);
                await customAlert("오류", "제출 중 오류가 발생했습니다.");
            }
        });

    </script>
