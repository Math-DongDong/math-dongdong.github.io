<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>좀비헌터 - 중1 수학</title>
    <!-- 파비콘 -->
    <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../css/navbar.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        .section-container {
            display: none;
        }

        .active-section {
            display: block;
        }

        /* Landing */
        .landing-card {
            max-width: 500px;
            margin: 2rem auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .hall-of-fame {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 2rem;
        }

        .hof-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .hof-item:last-child {
            border-bottom: none;
        }

        /* Game */
        .game-layout {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .game-layout {
                flex-direction: row;
            }
        }

        .canvas-container {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background: #e2e8f0;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        .controls-container {
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        @media (min-width: 768px) {
            .controls-container {
                width: 320px;
            }
        }

        .game-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .function-type-btn {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .function-type-btn.active {
            border-color: #4f46e5;
            background: #e0e7ff;
            color: #4f46e5;
        }

        .slider-container {
            margin: 2rem 0;
            text-align: center;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #4f46e5;
        }

        .equation-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            color: #1e293b;
        }

        .fire-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: 700;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .fire-btn:hover {
            background: #dc2626;
        }

        /* Admin */
        .admin-table {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-pill {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-normal {
            background: #dcfce7;
            color: #166534;
        }

        .status-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .status-sos {
            background: #fee2e2;
            color: #991b1b;
        }

        /* 모달 스타일 */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1050;
            justify-content: center;
            align-items: center;
        }

        .modal-content-box {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- 네비게이션 바 위치 (JS에서 로드) -->
    <div id="navbar-placeholder"></div>

    <!-- 1. 랜딩 섹션 -->
    <section id="landing-section" class="section-container active-section container pt-4">
        <div class="landing-card">
            <div class="text-center mb-4">
                <h1 class="fw-bold fs-3" style="color:#4f46e5;">🧟 좀비헌터</h1>
                <p class="text-muted">좌표의 비밀: 정비례와 반비례</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                <input type="text" id="playerName" class="form-control form-control-lg text-center fw-bold mb-3"
                    placeholder="닉네임 입력 (예: 동동)" maxlength="10">
                <button id="startBtn" class="btn btn-primary btn-lg w-100 mb-2 fw-bold"
                    style="background:#4f46e5; border:none;">🎮 게임 시작</button>
                <button id="adminBtn" class="btn btn-dark btn-lg w-100 fw-bold">대시보드 열기</button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-trophy text-warning"></i> 🏆 명예의 전당 (Top 5)</h5>
                <div id="hofList" class="mt-2">
                    <!-- JS 렌더링 -->
                    <div class="text-muted small text-center">데이터를 불러오는 중...</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 2. 게임 섹션 -->
    <section id="game-section" class="section-container container pt-4">
        <div class="game-layout">
            <!-- 좌측: 캔버스 -->
            <div class="canvas-container">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>

            <!-- 우측: 컨트롤 -->
            <div class="controls-container">
                <div class="game-header">
                    <div>
                        <div class="small opacity-75">Stage</div>
                        <div class="fw-bold fs-5" id="stageDisplay">1 / 4</div>
                    </div>
                    <div class="text-end">
                        <div class="small opacity-75">Score</div>
                        <div class="fw-bold fs-5" id="scoreDisplay">0</div>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="fw-bold mb-2">무기 선택 (함수형태)</div>
                    <button class="function-type-btn active" data-type="linear">정비례 (y = ax)</button>
                    <button class="function-type-btn" data-type="inverse">반비례 (y = a/x)</button>
                </div>

                <div class="slider-container">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="fw-bold">a 값 조절</span>
                        <span id="aValueDisplay" class="badge bg-primary fs-6">2</span>
                    </div>
                    <input type="range" id="aSlider" min="-24" max="24" value="2" step="1">
                    <div class="d-flex justify-content-between mt-1 small text-muted">
                        <span>-24</span>
                        <span>0</span>
                        <span>24</span>
                    </div>
                </div>

                <div class="equation-display" id="equationDisplay">
                    y = 2x
                </div>

                <button id="fireBtn" class="fire-btn">
                    <i class="bi bi-lightning-fill"></i> 레이저 발사!
                </button>

                <div id="feedbackText" class="mt-3 text-center fw-bold text-danger" style="min-height: 24px;"></div>
            </div>
        </div>
    </section>

    <!-- 3. 게임 오버 섹션 -->
    <section id="gameover-section" class="section-container container pt-5">
        <div class="landing-card text-center">
            <h1 class="fw-bold mb-4">미션 완료!</h1>
            <h4 class="mb-2">최종 점수: <span id="finalScore" class="text-primary">0</span>점</h4>
            <p class="text-muted mb-4">모든 좀비를 소탕했습니다!</p>
            <button id="restartBtn" class="btn btn-primary btn-lg w-100">처음으로 돌아가기</button>
        </div>
    </section>

    <!-- 4. 관리자 섹션 -->
    <section id="admin-section" class="section-container container pt-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">👨‍🏫 교사 대시보드 (좀비헌터)</h3>
                <button id="adminBackBtn" class="btn btn-dark fw-bold">메인으로</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>닉네임</th>
                            <th class="text-center">현재 Stage</th>
                            <th class="text-center">총 시도</th>
                            <th class="text-center">상태</th>
                            <th>취약 오개념 분석</th>
                            <th class="text-end">마지막 활동</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- JS 렌더링 -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- 커스텀 모달 -->
    <div id="customModal">
        <div class="modal-content-box shadow">
            <h5 id="modalMessage" class="mb-4 lh-base"></h5>
            <div id="modalInputContainer" class="mb-3" style="display: none;">
                <input type="password" id="modalInput" class="form-control text-center" placeholder="비밀번호">
            </div>
            <div class="d-flex gap-2 justify-content-center">
                <button id="modalCancelBtn" class="btn btn-secondary px-4" style="display: none;">취소</button>
                <button id="modalConfirmBtn" class="btn btn-primary px-4">확인</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { rtdbZombieHunter } from '../../../js/firebase-config.js';
        import { ref, set, onValue, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        // ----- 공통 네비게이션 로드 -----
        fetch('../../../components/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                const script = document.createElement('script');
                script.src = '../../../js/navbar.js';
                document.body.appendChild(script);
            });

        // ----- 상태 변수 -----
        let currentUserId = null;
        let myName = '';

        // 게임 상태
        let currentStage = 1;
        let score = 0;
        let currentFuncType = 'linear'; // linear, inverse
        let currentA = 2;
        let attemptsInStage = 0;
        let totalAttempts = 0;

        // Canvas 상태
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scale = 20; // 1단위 = 20px
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // 스테이지 정보
        // coordinate: 실제 x,y 값 (단위)
        let stages = [
            {
                id: 1,
                name: "정비례의 길",
                type: "linear",
                targetA: 2,
                zombies: [{ x: 1, y: 2, active: true }, { x: 2, y: 4, active: true }, { x: 3, y: 6, active: true }]
            },
            {
                id: 2,
                name: "부호의 마법",
                type: "linear",
                targetA: -5,
                zombies: [{ x: -2, y: 10, active: true }, { x: 2, y: -10, active: true }]
            },
            {
                id: 3,
                name: "반비례 성채",
                type: "inverse",
                targetA: 12,
                zombies: [{ x: 2, y: 6, active: true }, { x: 3, y: 4, active: true }, { x: 4, y: 3, active: true }]
            },
            {
                id: 4,
                name: "혼돈의 대격돌",
                type: "mixed",
                mixedTargets: [{ type: 'linear', a: 4 }, { type: 'inverse', a: 24 }],
                zombies: [
                    { x: 1, y: 4, active: true }, { x: 2, y: 8, active: true }, // y=4x
                    { x: 2, y: 12, active: true }, { x: 3, y: 8, active: true } // y=24/x
                ]
            }
        ];

        let currentZombies = [];

        // ----- 모달 함수 -----
        function customAlert(msg, callback) {
            document.getElementById('modalInputContainer').style.display = 'none';
            document.getElementById('modalCancelBtn').style.display = 'none';
            document.getElementById('modalMessage').innerHTML = msg.replace(/\n/g, '<br>');
            document.getElementById('customModal').style.display = 'flex';

            document.getElementById('modalConfirmBtn').onclick = () => {
                document.getElementById('customModal').style.display = 'none';
                if (callback) callback();
            };
        }

        function customPrompt(msg, callback) {
            document.getElementById('modalInputContainer').style.display = 'block';
            document.getElementById('modalInput').value = '';
            document.getElementById('modalCancelBtn').style.display = 'inline-block';
            document.getElementById('modalMessage').innerHTML = msg.replace(/\n/g, '<br>');
            document.getElementById('customModal').style.display = 'flex';

            document.getElementById('modalCancelBtn').onclick = () => {
                document.getElementById('customModal').style.display = 'none';
                callback(null);
            };

            document.getElementById('modalConfirmBtn').onclick = () => {
                const val = document.getElementById('modalInput').value.trim();
                document.getElementById('customModal').style.display = 'none';
                callback(val);
            };
        }

        // ----- 섹션 전환 -----
        function showSection(id) {
            document.querySelectorAll('.section-container').forEach(el => el.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
        }

        // ----- 시작 & 초기화 -----
        document.getElementById('startBtn').addEventListener('click', async () => {
            const name = document.getElementById('playerName').value.trim();
            if (!name) {
                customAlert('닉네임을 입력해주세요!');
                return;
            }
            myName = name;
            currentUserId = 'user_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

            // Firebase에 내 정보 생성
            await set(ref(rtdbZombieHunter, `students/${currentUserId}`), {
                name: myName,
                stage: 1,
                attempts: 0,
                score: 0,
                status: 'normal',
                conceptError: '',
                lastActive: serverTimestamp()
            });

            // 게임 초기화
            currentStage = 1;
            score = 0;
            totalAttempts = 0;
            initStage(currentStage);

            showSection('game-section');
        });

        // 명예의 전당 렌더링
        onValue(ref(rtdbZombieHunter, 'hallOfFame'), (snapshot) => {
            const data = snapshot.val();
            const hofList = document.getElementById('hofList');
            if (!data) {
                hofList.innerHTML = '<div class="text-muted small text-center">아직 기록이 없습니다.</div>';
                return;
            }

            const arr = Object.values(data).sort((a, b) => b.score - a.score).slice(0, 5);
            let html = `<div class="table-responsive"><table class="table table-sm table-hover mb-0">
                <thead><tr>
                    <th class="text-center">#</th>
                    <th>닉네임</th>
                    <th class="text-center">점수</th>
                </tr></thead><tbody>`;

            arr.forEach((item, idx) => {
                let rankHtml = `<span class="text-muted small">${idx + 1}</span>`;
                if (idx === 0) rankHtml = '🥇';
                if (idx === 1) rankHtml = '🥈';
                if (idx === 2) rankHtml = '🥉';

                html += `<tr>
                    <td class="text-center">${rankHtml}</td>
                    <td>${item.name}</td>
                    <td class="text-center fw-bold text-primary">${item.score}</td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            hofList.innerHTML = html;
        });

        // ----- 게임 로직 -----
        function initStage(stageNum) {
            document.getElementById('stageDisplay').innerText = `${stageNum} / ${stages.length}`;
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('feedbackText').innerText = '';

            attemptsInStage = 0;

            // 좀비 복사 (깊은 복사)
            const st = stages[stageNum - 1];
            currentZombies = JSON.parse(JSON.stringify(st.zombies));

            // 컨트롤 초기화
            currentA = 2;
            document.getElementById('aSlider').value = 2;
            document.getElementById('aValueDisplay').innerText = 2;
            setFuncType('linear');

            updateEquationDisplay();
            drawCanvas();

            updateFirebase({ stage: stageNum });
        }

        // 함수 타입 변경
        document.querySelectorAll('.function-type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                setFuncType(e.target.dataset.type);
            });
        });

        function setFuncType(type) {
            currentFuncType = type;
            document.querySelectorAll('.function-type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.function-type-btn[data-type="${type}"]`).classList.add('active');
            updateEquationDisplay();
        }

        // 슬라이더 변경
        document.getElementById('aSlider').addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (val === 0) {
                // a=0은 반비례에서 오류이므로 1 또는 -1로 보정
                val = currentA > 0 ? 1 : -1;
                e.target.value = val;
            }
            currentA = val;
            document.getElementById('aValueDisplay').innerText = val;
            updateEquationDisplay();
        });

        function updateEquationDisplay() {
            const eqDiv = document.getElementById('equationDisplay');
            if (currentFuncType === 'linear') {
                eqDiv.innerHTML = `y = ${currentA}x`;
            } else {
                eqDiv.innerHTML = `y = ${currentA} / x`;
            }
        }

        // ----- 그리기 (Canvas) -----
        function drawCanvas(laserAnimX = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 그리드 및 축 그리기
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += scale) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height); ctx.stroke(); // Y축
            ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY); ctx.stroke(); // X축

            // 2. 좀비 그리기
            currentZombies.forEach(z => {
                if (z.active) {
                    const px = centerX + z.x * scale;
                    const py = centerY - z.y * scale;
                    ctx.fillStyle = '#10b981'; // 좀비색(초록)
                    ctx.beginPath();
                    ctx.arc(px, py, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#065f46';
                    ctx.stroke();
                }
            });

            // 3. 레이저 그리기 (선택)
            if (laserAnimX !== null) {
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.beginPath();

                let points = [];
                for (let x = -15; x <= 15; x += 0.1) {
                    if (x > laserAnimX) break; // 애니메이션 효과

                    let y = 0;
                    if (currentFuncType === 'linear') {
                        y = currentA * x;
                    } else {
                        if (x === 0) continue;
                        y = currentA / x;
                    }

                    const px = centerX + x * scale;
                    const py = centerY - y * scale;

                    // 반비례 점근선 끊기
                    if (currentFuncType === 'inverse' && Math.abs(x) < 0.2) {
                        ctx.stroke();
                        ctx.beginPath();
                    } else {
                        points.push({ px, py });
                    }
                }

                if (points.length > 0) {
                    ctx.moveTo(points[0].px, points[0].py);
                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(points[i].px, points[i].py);
                    }
                }
                ctx.stroke();
            }
        }

        // ----- 발사 및 충돌 판정 -----
        document.getElementById('fireBtn').addEventListener('click', () => {
            document.getElementById('fireBtn').disabled = true;
            attemptsInStage++;
            totalAttempts++;

            // 애니메이션
            let animX = -15;
            let hitCount = 0;

            const timer = setInterval(() => {
                animX += 1.5;
                drawCanvas(animX);

                if (animX > 15) {
                    clearInterval(timer);
                    document.getElementById('fireBtn').disabled = false;

                    // 충돌 검사
                    currentZombies.forEach(z => {
                        if (!z.active) return;

                        let hit = false;
                        if (currentFuncType === 'linear') {
                            if (z.y === currentA * z.x) hit = true;
                        } else {
                            if (z.x !== 0 && z.y === currentA / z.x) hit = true;
                        }

                        if (hit) {
                            z.active = false;
                            hitCount++;
                            score += 100;
                        }
                    });

                    drawCanvas(15); // 완료 화면
                    document.getElementById('scoreDisplay').innerText = score;

                    // 판정
                    const remaining = currentZombies.filter(z => z.active).length;

                    // Firebase 업데이트 (상태 분석)
                    let status = 'normal';
                    let conceptError = '';

                    if (attemptsInStage >= 3) status = 'warning';
                    if (attemptsInStage >= 5) status = 'sos';

                    if (currentStage === 2 && currentA > 0 && attemptsInStage >= 2) {
                        conceptError = 'a < 0 부호 오개념 (2,4사분면)';
                    } else if (currentStage === 3 && currentFuncType === 'linear' && attemptsInStage >= 2) {
                        conceptError = '반비례 쌍곡선 미적용';
                    } else if (currentStage === 4 && attemptsInStage >= 4) {
                        conceptError = '정비례/반비례 식별 지연';
                    }

                    updateFirebase({
                        attempts: totalAttempts,
                        score: score,
                        status: status,
                        conceptError: conceptError
                    });

                    if (remaining === 0) {
                        document.getElementById('feedbackText').innerText = '명중! 다음 스테이지로 이동합니다.';
                        setTimeout(() => {
                            if (currentStage < stages.length) {
                                currentStage++;
                                initStage(currentStage);
                            } else {
                                gameOver();
                            }
                        }, 1500);
                    } else {
                        if (hitCount > 0) {
                            document.getElementById('feedbackText').innerText = `일부 소탕! (${remaining}마리 남음)`;
                        } else {
                            document.getElementById('feedbackText').innerText = '빗나갔습니다! 식을 수정해보세요.';
                        }
                    }
                }
            }, 30);
        });

        function updateFirebase(data) {
            if (!currentUserId) return;
            data.lastActive = serverTimestamp();
            update(ref(rtdbZombieHunter, `students/${currentUserId}`), data);
        }

        async function gameOver() {
            showSection('gameover-section');
            document.getElementById('finalScore').innerText = score;

            // 명예의 전당 등록
            await set(ref(rtdbZombieHunter, `hallOfFame/${currentUserId}`), {
                name: myName,
                score: score,
                timestamp: serverTimestamp()
            });
        }

        document.getElementById('restartBtn').addEventListener('click', () => {
            showSection('landing-section');
        });

        // ----- 관리자 로직 -----
        document.getElementById('adminBtn').addEventListener('click', () => {
            customPrompt("관리자 비밀번호를 입력하세요.", (pwd) => {
                if (pwd === "1004") {
                    showSection('admin-section');
                    startAdminListener();
                } else if (pwd !== null) {
                    customAlert("비밀번호가 틀렸습니다.");
                }
            });
        });

        document.getElementById('adminBackBtn').addEventListener('click', () => {
            showSection('landing-section');
        });

        function startAdminListener() {
            onValue(ref(rtdbZombieHunter, 'students'), (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('adminTableBody');
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">접속한 학생이 없습니다.</td></tr>';
                    return;
                }

                const now = Date.now();
                const rows = Object.values(data).map(student => {
                    let statusClass = 'status-normal';
                    let statusText = '원활';

                    if (student.status === 'warning') { statusClass = 'status-warning'; statusText = '지연'; }
                    if (student.status === 'sos') { statusClass = 'status-sos'; statusText = 'SOS 경고'; }

                    // 활동 안한지 3분 넘으면 멈춤
                    const lastActiveTime = student.lastActive || now;
                    if (now - lastActiveTime > 3 * 60 * 1000) {
                        statusClass = 'status-warning';
                        statusText = '멈춤';
                    }

                    return `
                        <tr>
                            <td class="fw-bold">${student.name}</td>
                            <td class="text-center">Stage ${student.stage}</td>
                            <td class="text-center">${student.attempts}회</td>
                            <td class="text-center"><span class="status-pill ${statusClass}">${statusText}</span></td>
                            <td class="text-danger fw-bold">${student.conceptError || '-'}</td>
                            <td class="text-muted small text-end">${new Date(lastActiveTime).toLocaleTimeString()}</td>
                        </tr>
                    `;
                }).join('');

                tbody.innerHTML = rows;
            });
        }
    </script>
</body>

</html>
