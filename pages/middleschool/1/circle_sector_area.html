<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원과 부채꼴의 넓이 탐구 - 중1 수학</title>
    <!-- 파비콘 및 PWA 설정 -->
    <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 네비게이션바 공통 CSS 연결 -->
    <link rel="stylesheet" href="../../../css/navbar.css">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        /* ===== 전역 설정 ===== */
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto,
                'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        /* ===== 메인 콘텐츠 영역 ===== */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .page-header h1 {
            font-weight: 800;
            font-size: 1.9rem;
            margin-bottom: 6px;
        }

        .page-header p {
            color: #64748b;
            margin-bottom: 0;
        }

        /* ===== 캔버스 영역 ===== */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
        }

        #sceneCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===== 제어 패널 ===== */
        .settings-panel {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            height: 100%;
            background: #ffffff;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 6px;
        }

        .slider-value {
            color: #2563eb;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <!-- 공통 네비게이션바 로드 -->
    <div id="navbar-placeholder"></div>
    <script src="../../../js/navbar.js"></script>

    <main class="main-content">
        <div class="page-header text-center text-lg-start mb-4">
            <h1>🍕 원과 부채꼴의 넓이 탐구</h1>
            <p>부채꼴을 똑같은 조각으로 쪼갠 뒤 엇갈려 붙여 보고, 어떤 도형에 가까워지는지 관찰해 보세요.</p>
        </div>

        <section class="row g-4">
            <!-- 1. 2D 시각화 캔버스 (좌측) -->
            <div class="col-lg-8">
                <div id="canvas-wrapper">
                    <canvas id="sceneCanvas"></canvas>
                </div>
            </div>

            <!-- 2. 제어 컨트롤러 패널 (우측) -->
            <div class="col-lg-4">
                <div class="settings-panel d-flex flex-column">
                    <h5 class="fw-bold mb-3 text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-sliders"></i> 시뮬레이터 제어
                    </h5>

                    <!-- 중심각 -->
                    <div class="mb-4">
                        <div class="slider-label">
                            <span>중심각의 크기</span>
                            <span><span class="slider-value" id="angleValue">360</span>°</span>
                        </div>
                        <input type="range" class="form-range" id="angleSlider" min="10" max="360" step="5" value="360">
                    </div>

                    <!-- 분할 개수 -->
                    <div class="mb-4">
                        <div class="slider-label">
                            <span>쪼개는 조각의 개수</span>
                            <span><span class="slider-value" id="piecesValue">12</span> 개</span>
                        </div>
                        <input type="range" class="form-range" id="piecesSlider" min="2" max="120" step="2" value="12">
                    </div>

                    <button type="button" class="btn btn-primary w-100 fw-bold py-2" id="rearrangeButton">
                        <i class="bi bi-play-fill"></i> 재배열 하기
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 외부 Three.js 렌더링 모듈 수입 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ===== 전역 상태 =====
        const state = {
            angle: 360,       // 중심각(도)
            pieces: 12,       // 분할 개수
            progress: 0,      // 재배열 진행도 (0: 부채꼴, 1: 재배열 완료)
            direction: 0      // 진행 방향 (1: 재배열, -1: 되돌리기, 0: 정지)
        };

        const WORLD_RADIUS = 2.2;   // 화면상의 반지름(월드 단위)
        const ARC_SEGMENTS = 24;    // 조각의 호를 근사하는 분할 수
        const ANIMATION_SPEED = 0.5;

        const canvas = document.getElementById('sceneCanvas');
        const wrapper = document.getElementById('canvas-wrapper');
        const rearrangeButton = document.getElementById('rearrangeButton');

        let scene, camera, renderer, pieceGroup;
        let viewWidth = 8;   // 화면에 담아야 하는 가로 크기(월드 단위)
        let viewHeight = 6;  // 화면에 담아야 하는 세로 크기(월드 단위)

        // ===== 2D 장면 초기화 =====
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.OrthographicCamera(-4, 4, 3, -3, 0.1, 100);
            camera.position.set(0, 0, 10);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            pieceGroup = new THREE.Group();
            scene.add(pieceGroup);

            resizeRenderer();
            window.addEventListener('resize', resizeRenderer);
        }

        function resizeRenderer() {
            const width = wrapper.clientWidth;
            const height = wrapper.clientHeight;
            if (width === 0 || height === 0) return;
            renderer.setSize(width, height, false);
            updateCameraFrustum();
        }

        // 도형 전체가 화면에 들어오도록 직교 카메라 범위 조정
        function updateCameraFrustum() {
            const aspect = wrapper.clientWidth / Math.max(wrapper.clientHeight, 1);
            const halfHeight = Math.max(viewHeight / 2, (viewWidth / 2) / aspect);
            camera.top = halfHeight;
            camera.bottom = -halfHeight;
            camera.left = -halfHeight * aspect;
            camera.right = halfHeight * aspect;
            camera.updateProjectionMatrix();
        }

        // ===== 부채꼴 한 조각의 평면 형상 생성 =====
        function createPieceShape(pieceAngle) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            for (let s = 0; s <= ARC_SEGMENTS; s++) {
                const a = -pieceAngle / 2 + pieceAngle * (s / ARC_SEGMENTS);
                shape.lineTo(WORLD_RADIUS * Math.sin(a), WORLD_RADIUS * Math.cos(a));
            }
            shape.lineTo(0, 0);
            return shape;
        }

        // 시작 회전각과 더 가까운 ±180° 목표 회전각 선택
        function nearestFlipRotation(startRotation) {
            return Math.abs(startRotation - Math.PI) <= Math.abs(startRotation + Math.PI) ? Math.PI : -Math.PI;
        }

        // ===== 조각 전체 재생성 =====
        function buildPieces() {
            while (pieceGroup.children.length > 0) {
                const child = pieceGroup.children[0];
                pieceGroup.remove(child);
                child.traverse(function (obj) {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                });
            }

            const pieceCount = state.pieces;
            const totalAngle = state.angle * Math.PI / 180;
            const pieceAngle = totalAngle / pieceCount;

            const halfChord = WORLD_RADIUS * Math.sin(pieceAngle / 2);   // 재배열 시 가로 이동 간격
            const pieceHeight = WORLD_RADIUS * Math.cos(pieceAngle / 2); // 재배열 시 세로 높이
            const startAngle = Math.PI / 2 - totalAngle / 2;             // 부채꼴을 +Y축 대칭으로 배치

            // 중심(꼭짓점) 기준 부채꼴 전체의 범위 → 화면 중앙에 오도록 보정
            const halfTotalAngle = totalAngle / 2;
            const sectorTop = WORLD_RADIUS;
            const sectorBottom = Math.min(0, WORLD_RADIUS * Math.cos(halfTotalAngle));
            const sectorHalfWidth = (halfTotalAngle >= Math.PI / 2)
                ? WORLD_RADIUS
                : WORLD_RADIUS * Math.sin(halfTotalAngle);
            const sectorCenterY = (sectorTop + sectorBottom) / 2;

            const geometry = new THREE.ShapeGeometry(createPieceShape(pieceAngle), ARC_SEGMENTS);
            const edgeGeometry = new THREE.EdgesGeometry(geometry);

            for (let i = 0; i < pieceCount; i++) {
                const hue = 0.58 - 0.16 * (i / Math.max(pieceCount - 1, 1));
                const material = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(hue, 0.72, i % 2 === 0 ? 0.60 : 0.72)
                });
                const mesh = new THREE.Mesh(geometry, material);

                // 조각 테두리 선
                mesh.add(new THREE.LineSegments(
                    edgeGeometry,
                    new THREE.LineBasicMaterial({ color: 0xffffff })
                ));

                const startRotation = (startAngle + (i + 0.5) * pieceAngle) - Math.PI / 2;
                const isUpward = (i % 2 === 0);

                mesh.userData.startPosition = new THREE.Vector3(0, -sectorCenterY, 0);
                mesh.userData.endPosition = new THREE.Vector3(
                    i * halfChord - (pieceCount - 1) * halfChord / 2,
                    (isUpward ? 0 : pieceHeight) - pieceHeight / 2,
                    0
                );
                mesh.userData.startRotation = startRotation;
                mesh.userData.endRotation = isUpward ? 0 : nearestFlipRotation(startRotation);

                pieceGroup.add(mesh);
            }

            // 부채꼴 상태와 재배열 상태 중 더 큰 쪽에 맞춰 화면 범위 결정
            const rearrangedWidth = (pieceCount + 1) * halfChord;
            const rearrangedHeight = pieceHeight;
            viewWidth = Math.max(2 * sectorHalfWidth, rearrangedWidth) * 1.2;
            viewHeight = Math.max(sectorTop - sectorBottom, rearrangedHeight) * 1.25;
            updateCameraFrustum();

            applyProgress();
        }

        // ===== 진행도에 따른 위치/회전 보간 =====
        function applyProgress() {
            const t = state.progress;
            const eased = t * t * (3 - 2 * t); // smoothstep

            pieceGroup.children.forEach(function (mesh) {
                const data = mesh.userData;
                mesh.position.lerpVectors(data.startPosition, data.endPosition, eased);
                mesh.rotation.z = data.startRotation + (data.endRotation - data.startRotation) * eased;
            });
        }

        // ===== 슬라이더 및 버튼 이벤트 =====
        // 슬라이더를 조작하면 부채꼴 상태로 되돌려 새 조건의 도형을 다시 그린다
        function resetToSector() {
            state.progress = 0;
            state.direction = 0;
            buildPieces();
            updateButtonLabel();
        }

        document.getElementById('angleSlider').addEventListener('input', function () {
            state.angle = Number(this.value);
            document.getElementById('angleValue').textContent = state.angle;
            resetToSector();
        });

        document.getElementById('piecesSlider').addEventListener('input', function () {
            state.pieces = Number(this.value);
            document.getElementById('piecesValue').textContent = state.pieces;
            resetToSector();
        });

        rearrangeButton.addEventListener('click', function () {
            state.direction = (state.progress >= 1) ? -1 : 1;
        });

        function updateButtonLabel() {
            rearrangeButton.innerHTML = (state.progress >= 1)
                ? '<i class="bi bi-arrow-counterclockwise"></i> 원래대로'
                : '<i class="bi bi-play-fill"></i> 재배열 하기';
        }

        // ===== 애니메이션 루프 =====
        let lastTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);
            const delta = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (state.direction !== 0) {
                state.progress += state.direction * delta * ANIMATION_SPEED;
                if (state.progress >= 1) {
                    state.progress = 1;
                    state.direction = 0;
                } else if (state.progress <= 0) {
                    state.progress = 0;
                    state.direction = 0;
                }
                applyProgress();
                updateButtonLabel();
            }

            renderer.render(scene, camera);
        }

        // ===== 시작 =====
        initScene();
        buildPieces();
        updateButtonLabel();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
