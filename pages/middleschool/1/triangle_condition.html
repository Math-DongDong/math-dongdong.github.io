<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>삼각형이 만들어지는 조건</title>

  <!-- 파비콘 -->
  <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg" type="image/jpeg" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

  <!-- 공통 네비게이션 CSS -->
  <link rel="stylesheet" href="../../../css/navbar.css" />

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --side-a: #ef4444;
      --side-b: #10b981;
      --side-c: #2563eb;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .content-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      background: #fff;
    }

    #triangleCanvas {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
    }

    .result-banner {
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 12px;
    }

  </style>
</head>

<body>
  <!-- 네비게이션바 -->
  <script src="../../../js/navbar.js" data-type="middleschool"></script>

  <main class="page-wrap">
    <header class="mb-4 text-center">
      <h1 class="fw-bold mb-2">📐 삼각형이 만들어지는 조건</h1>
      <p class="text-secondary mb-0">세 막대의 길이를 바꾸어 보며, 언제 삼각형이 만들어지는지 규칙을 찾아보세요.</p>
    </header>

    <!-- 탐구하기 -->
    <section id="explorePane">
            <div class="content-card mx-auto" style="max-width: 900px;">
              <div class="position-relative">
                <canvas id="triangleCanvas" width="800" height="500"></canvas>
                <button id="randomButton" class="btn btn-light border btn-sm position-absolute top-0 end-0 m-2 shadow-sm">
                  <i class="bi bi-shuffle"></i> 무작위 <span class="text-secondary">(<span id="roundCounter">1</span>/5)</span>
                </button>
              </div>
              <div class="d-flex justify-content-center gap-2 mt-3">
                <button id="fallButton" class="btn btn-primary btn-lg px-4"><i class="bi bi-play-fill"></i> 삼각형 만들기</button>
                <button id="resetButton" class="btn btn-outline-secondary btn-lg"><i class="bi bi-arrow-counterclockwise"></i> 다시 세우기</button>
              </div>
              <div id="resultBanner" class="result-banner text-center p-3 mt-3"></div>
            </div>
    </section>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const SIDE_COLORS = { a: '#ef4444', b: '#10b981', c: '#2563eb' };

    const ROUND_SIZE = 5;
    let currentSides = { a: 5, b: 6, c: 8 };
    let statusQueue = [];
    let roundIndex = 0;
    const canvas = document.getElementById('triangleCanvas');
    const context = canvas.getContext('2d');

    /* ---------- 판정 ---------- */
    function classifyTriangle(a, b, c) {
      const longest = Math.max(a, b, c);
      const sumOfOthers = a + b + c - longest;
      if (longest < sumOfOthers) return 'possible';
      if (longest === sumOfOthers) return 'degenerate';
      return 'impossible';
    }

    function getSides() {
      return {
        ...currentSides
      };
    }

    /* ---------- 애니메이션 상태 ---------- */
    const HALF_PI = Math.PI / 2;
    const GRAVITY = 40;            // 화면 단위 중력 가속도
    const SWING_DAMPING = 0.35;    // 흔들림 감쇠 계수
    const FALL_DURATION = 1.1;     // 삼각형이 될 때 내려오는 시간(초)
    let scene = null;
    let animationFrameId = null;
    let lastFrameTime = 0;

    // 각도 φ: 밑변에서 안쪽(상대 꼭짓점 방향)으로 잰 각, 시작은 수직(π/2)
    function createStick(length, targetAngle) {
      return { length, angle: HALF_PI, velocity: 0, targetAngle, sweptMin: HALF_PI, sweptMax: HALF_PI };
    }

    function getTargetAngles(a, b, c) {
      const clamp = value => Math.min(1, Math.max(-1, value));
      const xC = (b * b + c * c - a * a) / (2 * c);
      return { xC, angleA: Math.acos(clamp(xC / b)), angleB: Math.acos(clamp((c - xC) / a)) };
    }

    function resetScene() {
      cancelAnimationFrame(animationFrameId);
      const { a, b, c } = getSides();
      const targets = getTargetAngles(a, b, c);
      scene = {
        a, b, c,
        status: classifyTriangle(a, b, c),
        phase: 'standing',
        elapsed: 0,
        stickA: createStick(b, targets.angleA), // 꼭짓점 A에 붙은 변 b
        stickB: createStick(a, targets.angleB)  // 꼭짓점 B에 붙은 변 a
      };
      showBanner('ready');
      updateButtons();
      drawScene();
    }

    function startFalling() {
      if (scene.phase !== 'standing') resetScene();
      scene.phase = 'falling';
      if (scene.status === 'impossible') {
        [scene.stickA, scene.stickB].forEach(stick => {
          stick.angle = HALF_PI - 0.01;
          stick.velocity = -0.4;
        });
      }
      showBanner('falling');
      updateButtons();
      lastFrameTime = performance.now();
      animationFrameId = requestAnimationFrame(animate);
    }

    function trackSweep(stick) {
      stick.sweptMin = Math.min(stick.sweptMin, stick.angle);
      stick.sweptMax = Math.max(stick.sweptMax, stick.angle);
    }

    function stepPendulum(stick, deltaTime) {
      // 한쪽 끝이 고정된 막대: φ'' = -(3g / 2L)·cos φ - 감쇠·φ'
      const angularAcceleration = -(3 * GRAVITY / (2 * stick.length)) * Math.cos(stick.angle)
        - SWING_DAMPING * stick.velocity;
      stick.velocity += angularAcceleration * deltaTime;
      stick.angle += stick.velocity * deltaTime;
      trackSweep(stick);
    }

    function animate(now) {
      const deltaTime = Math.min((now - lastFrameTime) / 1000, 1 / 30);
      lastFrameTime = now;
      scene.elapsed += deltaTime;
      const sticks = [scene.stickA, scene.stickB];
      let keepRunning = true;

      if (scene.status === 'impossible') {
        // 작은 시간 간격으로 나누어 안정적으로 계산
        for (let i = 0; i < 4; i++) sticks.forEach(stick => stepPendulum(stick, deltaTime / 4));
        if (scene.phase === 'falling' && sticks.every(stick => stick.angle < 0)) {
          scene.phase = 'swinging';
          showBanner('impossible');
          updateButtons();
        }
        const settled = sticks.every(stick =>
          Math.abs(stick.velocity) < 0.003 && Math.abs(stick.angle + HALF_PI) < 0.002);
        if (settled) keepRunning = false;
      } else {
        const progress = Math.min(scene.elapsed / FALL_DURATION, 1);
        const eased = progress * progress; // 중력처럼 점점 빨라짐
        sticks.forEach(stick => {
          stick.angle = HALF_PI + (stick.targetAngle - HALF_PI) * eased;
          trackSweep(stick);
        });
        if (progress >= 1) {
          scene.phase = 'done';
          showBanner(scene.status);
          updateButtons();
          keepRunning = false;
        }
      }

      drawScene();
      if (keepRunning) animationFrameId = requestAnimationFrame(animate);
    }

    /* ---------- 캔버스 그리기 ---------- */
    function drawStick(from, to, color) {
      context.strokeStyle = color;
      context.lineWidth = 8;
      context.lineCap = 'round';
      context.beginPath();
      context.moveTo(from.x, from.y);
      context.lineTo(to.x, to.y);
      context.stroke();
    }

    // 막대 바깥쪽(도형 중심 반대편)에 흰 배경 라벨 표시
    function drawStickLabel(from, to, color, label, center, preferredNormalY) {
      const length = Math.hypot(to.x - from.x, to.y - from.y) || 1;
      let normalX = -(to.y - from.y) / length;
      let normalY = (to.x - from.x) / length;
      const midX = (from.x + to.x) / 2;
      const midY = (from.y + to.y) / 2;
      const awayFromCenter = (midX - center.x) * normalX + (midY - center.y) * normalY;
      const flip = Math.abs(awayFromCenter) < 1 ? normalY * preferredNormalY < 0 : awayFromCenter < 0;
      if (flip) { normalX = -normalX; normalY = -normalY; }

      const labelX = midX + normalX * 30;
      const labelY = midY + normalY * 30;
      context.font = 'bold 22px Pretendard Variable, sans-serif';
      const boxWidth = context.measureText(label).width + 16;
      const boxHeight = 30;
      context.fillStyle = 'rgba(255, 255, 255, 0.92)';
      context.strokeStyle = color;
      context.lineWidth = 1.5;
      context.beginPath();
      if (context.roundRect) context.roundRect(labelX - boxWidth / 2, labelY - boxHeight / 2, boxWidth, boxHeight, 8);
      else context.rect(labelX - boxWidth / 2, labelY - boxHeight / 2, boxWidth, boxHeight);
      context.fill();
      context.stroke();

      context.fillStyle = color;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(label, labelX, labelY);
    }

    // 캔버스 왼쪽 위 세 변의 길이 정보
    function drawLengthInfo(a, b, c) {
      const items = [[`a = ${a}`, SIDE_COLORS.a], [`b = ${b}`, SIDE_COLORS.b], [`c = ${c}`, SIDE_COLORS.c]];
      context.font = 'bold 26px Pretendard Variable, sans-serif';
      context.textAlign = 'left';
      context.textBaseline = 'middle';
      let cursorX = 20;
      items.forEach(([text, color]) => {
        context.fillStyle = color;
        context.fillText(text, cursorX, 32);
        cursorX += context.measureText(text).width + 28;
      });
    }

    function drawPoint(point, name, labelOffsetX, labelOffsetY) {
      context.fillStyle = '#1f2937';
      context.beginPath();
      context.arc(point.x, point.y, 6, 0, Math.PI * 2);
      context.fill();
      context.font = 'bold 20px Pretendard Variable, sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(name, point.x + labelOffsetX, point.y + labelOffsetY);
    }

    function drawTracedArc(center, radius, color, startAngle, endAngle) {
      if (endAngle - startAngle < 0.001) return;
      context.save();
      context.strokeStyle = color;
      context.globalAlpha = 0.85;
      context.lineWidth = 3;
      context.beginPath();
      context.arc(center.x, center.y, radius, startAngle, endAngle);
      context.stroke();
      context.restore();
    }

    function drawScene() {
      const { a, b, c, status, stickA, stickB } = scene;
      const width = canvas.width;
      const height = canvas.height;
      const padding = 55;
      const infoHeight = 50; // 위쪽 길이 정보·무작위 버튼 영역
      const { xC } = getTargetAngles(a, b, c);

      context.clearRect(0, 0, width, height);
      drawLengthInfo(a, b, c);

      // 화면 범위 (막대가 움직이는 전체 영역)
      const minWorldX = Math.min(0, c - a, status === 'impossible' ? 0 : xC);
      const maxWorldX = Math.max(c, b, status === 'impossible' ? c : xC);
      const maxWorldY = Math.max(a, b);
      const minWorldY = status === 'impossible' ? -maxWorldY : 0;
      const scale = Math.min(
        (width - padding * 2) / (maxWorldX - minWorldX),
        (height - infoHeight - padding * 2) / (maxWorldY - minWorldY)
      );
      const offsetX = (width - (maxWorldX - minWorldX) * scale) / 2 - minWorldX * scale;
      const offsetY = infoHeight + (height - infoHeight - (maxWorldY - minWorldY) * scale) / 2 + maxWorldY * scale;
      const toCanvas = (x, y) => ({ x: offsetX + x * scale, y: offsetY - y * scale });

      const pointA = toCanvas(0, 0);
      const pointB = toCanvas(c, 0);
      const tipA = toCanvas(b * Math.cos(stickA.angle), b * Math.sin(stickA.angle));
      const tipB = toCanvas(c - a * Math.cos(stickB.angle), a * Math.sin(stickB.angle));
      drawTracedArc(pointA, b * scale, SIDE_COLORS.b, -stickA.sweptMax, -stickA.sweptMin);
      drawTracedArc(pointB, a * scale, SIDE_COLORS.a, Math.PI + stickB.sweptMin, Math.PI + stickB.sweptMax);

      const isFormed = scene.phase === 'done' && status === 'possible';
      if (isFormed) {
        context.fillStyle = 'rgba(37, 99, 235, 0.1)';
        context.beginPath();
        context.moveTo(pointA.x, pointA.y);
        context.lineTo(pointB.x, pointB.y);
        context.lineTo(tipA.x, tipA.y);
        context.closePath();
        context.fill();
      }

      drawStick(pointA, pointB, SIDE_COLORS.c);
      drawStick(tipA, pointA, SIDE_COLORS.b);
      drawStick(pointB, tipB, SIDE_COLORS.a);

      // 라벨은 막대를 모두 그린 뒤 맨 위에 표시
      const center = {
        x: (pointA.x + pointB.x + tipA.x + tipB.x) / 4,
        y: (pointA.y + pointB.y + tipA.y + tipB.y) / 4
      };
      drawStickLabel(pointA, pointB, SIDE_COLORS.c, `c = ${c}`, center, 1);
      drawStickLabel(pointA, tipA, SIDE_COLORS.b, `b = ${b}`, center, -1);
      drawStickLabel(tipB, pointB, SIDE_COLORS.a, `a = ${a}`, center, -1);
      drawPoint(pointA, 'A', -20, 20);
      drawPoint(pointB, 'B', 20, 20);
      if (isFormed) drawPoint(tipA, 'C', 0, -24);
      if (scene.phase === 'done' && status === 'degenerate') drawPoint(tipA, '', 0, 0);
    }

    /* ---------- 결과 표시 ---------- */
    function showBanner(kind) {
      const bannerStyles = {
        ready: ['bg-light text-secondary', '▶ ‘삼각형 만들기’를 눌러 두 막대를 내려 보세요.'],
        falling: ['bg-light text-secondary', '두 막대가 호를 그리며 내려오는 중...'],
        possible: ['bg-success-subtle text-success-emphasis', '✅ 두 막대의 끝이 만나 삼각형이 만들어졌어요!'],
        degenerate: ['bg-warning-subtle text-warning-emphasis', '⚠️ 두 막대가 밑변 위에 딱 포개져요. 삼각형이 아니에요!'],
        impossible: ['bg-danger-subtle text-danger-emphasis', '❌ 두 막대의 끝이 만나지 않아요. 삼각형이 될 수 없어요!']
      };
      const banner = document.getElementById('resultBanner');
      banner.className = `result-banner text-center p-3 mt-3 ${bannerStyles[kind][0]}`;
      banner.textContent = bannerStyles[kind][1];
    }

    function updateButtons() {
      document.getElementById('fallButton').disabled = scene.phase !== 'standing';
      document.getElementById('resetButton').disabled = scene.phase === 'standing';
    }

    function updateAll() {
      document.getElementById('roundCounter').textContent = roundIndex;
      resetScene();
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = randomInt(0, i);
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    // 5번 중 등호·성립·불가 각 1번 + 나머지 2번은 무작위
    function buildStatusQueue() {
      const allStatuses = ['possible', 'degenerate', 'impossible'];
      const randomStatus = () => allStatuses[randomInt(0, 2)];
      return shuffle([...allStatuses, randomStatus(), randomStatus()]);
    }

    // 목표 결과가 나오도록 길이를 뽑고, 가장 긴 길이를 밑변 c에 배치
    function generateSides(targetStatus) {
      let sides;
      do {
        const [shortA, shortB, longest] = [randomInt(1, 15), randomInt(1, 15), randomInt(1, 15)].sort((x, y) => x - y);
        sides = { a: shortA, b: shortB, c: longest };
      } while (
        classifyTriangle(sides.a, sides.b, sides.c) !== targetStatus ||
        (sides.a === currentSides.a && sides.b === currentSides.b && sides.c === currentSides.c)
      );
      return sides;
    }

    function randomizeSides() {
      if (roundIndex >= ROUND_SIZE || statusQueue.length === 0) {
        statusQueue = buildStatusQueue();
        roundIndex = 0;
      }
      roundIndex += 1;
      currentSides = generateSides(statusQueue.shift());
      updateAll();
    }

    /* ---------- 이벤트 ---------- */
    document.getElementById('fallButton').addEventListener('click', startFalling);
    document.getElementById('resetButton').addEventListener('click', resetScene);
    document.getElementById('randomButton').addEventListener('click', randomizeSides);

    randomizeSides();
  </script>
</body>

</html>
