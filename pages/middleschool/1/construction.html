            free: {
                group: '자유 연습',
                title: '자유 작도',
                description: '눈금 없는 자와 컴퍼스로 자유롭게 작도해 보세요.',
                steps: [
                    '점·교점 근처를 클릭하면 자동으로 정확한 위치에 달라붙어요.',
                    '컴퍼스: ① 중심 클릭 → ② 벌릴 점 클릭 → ③ 시작할 곳 클릭 → ④ 돌려서 끝낼 곳 클릭',
                    '정삼각형, 정육각형, 직각 등 다양한 도형의 작도에 도전해 보세요!'
                ],
                build: () => [],
                check: null
            }
        };

        // 꼭짓점 이름(A, B, C)까지 맞는 삼각형이 있는지 판정 (isMatch: 이름 붙은 꼭짓점으로 조건 확인)
        function checkTriangle(isMatch, conditionText) {
            const triangles = findUserTriangles();
            if (!triangles.length) return { success: false, message: '아직 삼각형이 완성되지 않았어요. 자 도구로 세 꼭짓점을 선분으로 이어 주세요.' };
            const isSolved = triangles.some(vertices => {
                const namedVertices = nameTriangleVertices(vertices);
                return namedVertices && isMatch(namedVertices);
            });
            if (isSolved) return { success: true, message: `🎉 정답! ${conditionText} △ABC를 정확히 작도했어요.` };
            const vertexOrders = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
            const isShapeCorrect = triangles.some(vertices =>
                vertexOrders.some(([i, j, k]) => isMatch({ A: vertices[i], B: vertices[j], C: vertices[k] })));
            if (isShapeCorrect) return { success: false, message: '삼각형의 모양은 맞지만 꼭짓점의 이름이 조건과 달라요. 점 도구로 꼭짓점을 클릭해 이름을 A, B, C로 알맞게 바꿔 주세요.' };
            return { success: false, message: `삼각형은 있지만 ${conditionText} 삼각형이 아니에요. 컴퍼스로 길이와 각을 정확히 옮겼는지 확인해 보세요.` };
        }

        function nameTriangleVertices(vertices) {
            const namedVertices = {};
            vertices.forEach(vertex => {
                const label = pointLabelAt(vertex);
                if (label) namedVertices[label] = vertex;
            });
            return namedVertices.A && namedVertices.B && namedVertices.C ? namedVertices : null;
        }

        const pointLabelAt = position => allObjects().find(o => o.kind === 'point' && o.label && dist(o, position) < CHECK_LENGTH_EPS)?.label ?? '';
        const angleAt = (vertex, p1, p2) => angleBetween(sub(p1, vertex), sub(p2, vertex));

        // ===== 상태 =====
        const state = {
            missionId: 'segmentCopy',
            givenObjects: [],
            userObjects: [],
            undoStack: [],
            redoStack: [],
            activeTool: 'ruler'
        };
        const demoState = { active: false, playing: false, actions: [], objects: [], index: 0, progress: 0, hold: 0, speed: 1, lastTime: null, frameId: null,
            continuous: false, focusStep: 0 };  // continuous=false면 단계 보기 (focusStep: 보고 있는 단계)
        const view = { scale: 1, offsetX: 0, offsetY: 0 };
        const pointer = { isDown: false, downScreen: null, moved: false, type: 'mouse', hoverScreen: null, hoverSnap: null, hoverErase: null };
        // end: 두 번째 점을 찍어 [선분 / 반직선] 선택을 기다리는 중이면 그 끝점
        const rulerState = { start: null, end: null, justStarted: false };
        const compassState = {
            stage: 'measure1', centerSnap: null, radius: null,
            startAngle: null, lastAngle: null, sweep: 0, sweepPressed: false, startedOnPress: false, justStarted: false, measureSnap: null
        };
        let intersectionCache = [];
        let pixelRatio = 1;

        // ===== DOM =====
        const canvas = document.getElementById('construction-canvas');
        // 정답 보기 모달에 그릴 때 잠시 대상 캔버스를 바꾸므로 let
        let ctx = canvas.getContext('2d');
        const missionSelect = document.getElementById('mission-select');
        const statusText = document.getElementById('status-text');
        const compassChoice = document.getElementById('compass-choice');
        const rulerChoice = document.getElementById('ruler-choice');
        const checkButton = document.getElementById('btn-check');
        const checkToast = document.getElementById('check-toast');
        const demoButton = document.getElementById('btn-demo');
        const demoPlayButton = document.getElementById('btn-demo-play');
        const demoPlayIcon = document.getElementById('demo-play-icon');
        const demoCaption = document.getElementById('demo-caption');

        const allObjects = () => state.givenObjects.concat(state.userObjects);
        const getUserObjects = kind => state.userObjects.filter(o => o.kind === kind);
        const isCurve = o => o.kind === 'line' || o.kind === 'arc';

        // ===== 좌표 변환 =====
        const worldToScreen = p => ({ x: p.x * view.scale + view.offsetX, y: p.y * view.scale + view.offsetY });
        const screenToWorld = p => ({ x: (p.x - view.offsetX) / view.scale, y: (p.y - view.offsetY) / view.scale });

        function fitView() {
            const width = canvas.clientWidth, height = canvas.clientHeight;
            if (!width || !height) return;
            // 캔버스 안 상단 도구 막대에 가리지 않도록 그 아래 영역에 맞춤
            const topInset = document.getElementById('canvas-topbar').offsetHeight;
            const availableHeight = height - topInset;
            view.scale = Math.min(width / WORLD_WIDTH, availableHeight / WORLD_HEIGHT) * 0.96;
            view.offsetX = (width - WORLD_WIDTH * view.scale) / 2;
            view.offsetY = topInset + (availableHeight - WORLD_HEIGHT * view.scale) / 2;
        }

        function zoomAt(screenPoint, factor) {
            const world = screenToWorld(screenPoint);
            view.scale = Math.min(10, Math.max(0.15, view.scale * factor));
            view.offsetX = screenPoint.x - world.x * view.scale;
            view.offsetY = screenPoint.y - world.y * view.scale;
            render();
        }

        // ===== 기하 계산 =====
        function inLineRange(line, t) {
            if (line.lineType === 'segment') return t >= -1e-9 && t <= 1 + 1e-9;
            if (line.lineType === 'ray') return t >= -1e-9;
            return true;
        }

        function isAngleOnArc(arc, angle) {
            if (Math.abs(arc.sweep) >= TWO_PI - 1e-9) return true;
            return arc.sweep >= 0
                ? positiveMod(angle - arc.start) <= arc.sweep + 1e-9
                : positiveMod(arc.start - angle) <= -arc.sweep + 1e-9;
        }

        const arcPointAt = (arc, angle) => ({ x: arc.cx + arc.r * Math.cos(angle), y: arc.cy + arc.r * Math.sin(angle) });
        const isPointOnArc = (arc, p) => isAngleOnArc(arc, Math.atan2(p.y - arc.cy, p.x - arc.cx));

        function distanceToInfiniteLine(p, a, b) {
            return Math.abs(cross(sub(b, a), sub(p, a))) / (dist(a, b) || 1);
        }

        function projectOntoLineObject(p, line) {
            const direction = sub(line.p2, line.p1);
            let t = dot(sub(p, line.p1), direction) / dot(direction, direction);
            if (line.lineType !== 'line') t = Math.max(0, t);
            if (line.lineType === 'segment') t = Math.min(1, t);
            return { x: line.p1.x + t * direction.x, y: line.p1.y + t * direction.y };
        }

        const distanceToLineObject = (p, line) => dist(p, projectOntoLineObject(p, line));

        function projectOntoCurve(p, curve) {
            if (curve.kind === 'line') return projectOntoLineObject(p, curve);
            const offset = { x: p.x - curve.cx, y: p.y - curve.cy };
            if (Math.hypot(offset.x, offset.y) < 1e-9) return null;
            const angle = Math.atan2(offset.y, offset.x);
            if (isAngleOnArc(curve, angle)) return arcPointAt(curve, angle);
            const startPoint = arcPointAt(curve, curve.start), endPoint = arcPointAt(curve, curve.start + curve.sweep);
            return dist(p, startPoint) < dist(p, endPoint) ? startPoint : endPoint;
        }

        function intersectLineLine(l1, l2) {
            const d1 = sub(l1.p2, l1.p1), d2 = sub(l2.p2, l2.p1);
            const denominator = cross(d1, d2);
            if (Math.abs(denominator) < 1e-12) return [];
            const w = sub(l2.p1, l1.p1);
            const t = cross(w, d2) / denominator, u = cross(w, d1) / denominator;
            if (!inLineRange(l1, t) || !inLineRange(l2, u)) return [];
            return [{ x: l1.p1.x + t * d1.x, y: l1.p1.y + t * d1.y }];
        }

        function intersectLineArc(line, arc) {
            const d = sub(line.p2, line.p1), f = { x: line.p1.x - arc.cx, y: line.p1.y - arc.cy };
            const a = dot(d, d), b = 2 * dot(f, d), c = dot(f, f) - arc.r * arc.r;
            let discriminant = b * b - 4 * a * c;
            if (discriminant < -1e-9 * a) return [];
            discriminant = Math.max(0, discriminant);
            const root = Math.sqrt(discriminant);
            const parameters = root < 1e-12 ? [-b / (2 * a)] : [(-b - root) / (2 * a), (-b + root) / (2 * a)];
            return parameters
                .filter(t => inLineRange(line, t))
                .map(t => ({ x: line.p1.x + t * d.x, y: line.p1.y + t * d.y }))
                .filter(p => isPointOnArc(arc, p));
        }

        function intersectArcArc(arc1, arc2) {
            const c1 = { x: arc1.cx, y: arc1.cy }, c2 = { x: arc2.cx, y: arc2.cy };
            const d = dist(c1, c2);
            if (d < 1e-9 || d > arc1.r + arc2.r + 1e-9 || d < Math.abs(arc1.r - arc2.r) - 1e-9) return [];
            const along = (arc1.r * arc1.r - arc2.r * arc2.r + d * d) / (2 * d);
            const height = Math.sqrt(Math.max(0, arc1.r * arc1.r - along * along));
            const direction = { x: (c2.x - c1.x) / d, y: (c2.y - c1.y) / d };
            const base = { x: c1.x + along * direction.x, y: c1.y + along * direction.y };
            const candidates = height < 1e-12
                ? [base]
                : [{ x: base.x - height * direction.y, y: base.y + height * direction.x }, { x: base.x + height * direction.y, y: base.y - height * direction.x }];
            return candidates.filter(p => isPointOnArc(arc1, p) && isPointOnArc(arc2, p));
        }

        function intersectCurves(first, second) {
            if (first.kind === 'line' && second.kind === 'line') return intersectLineLine(first, second);
            if (first.kind === 'line') return intersectLineArc(first, second);
            if (second.kind === 'line') return intersectLineArc(second, first);
            return intersectArcArc(first, second);
        }

        function recomputeIntersections() {
            const curves = allObjects().filter(isCurve);
            const result = [];
            for (let i = 0; i < curves.length; i++) {
                for (let j = i + 1; j < curves.length; j++) {
                    intersectCurves(curves[i], curves[j]).forEach(p => {
                        if (!result.some(q => dist(p, q) < 1e-6)) result.push(p);
                    });
                }
            }
            intersectionCache = result;
        }

        // ===== 삼각형 판별 =====
        // 세 점을 꼭짓점으로 하는 삼각형 찾기
        // 두 꼭짓점이 이미 그어진 선분 하나 위에 함께 있으면(긴 선분 안의 일부) 그 변도 그어진 것으로 봄
        function findUserTriangles() {
            const segments = getUserObjects('line');
            const vertices = [];
            getUserObjects('point').forEach(point => {
                if (!vertices.some(v => dist(v, point) < CHECK_LENGTH_EPS)) vertices.push(point);
            });
            const isOnSegment = (p, segment) => distanceToLineObject(p, segment) < CHECK_LENGTH_EPS;
            const isConnected = vertices.map(p => vertices.map(q =>
                p !== q && segments.some(segment => isOnSegment(p, segment) && isOnSegment(q, segment))));
            const triangles = [];
            for (let i = 0; i < vertices.length; i++) {
                for (let j = i + 1; j < vertices.length; j++) {
                    if (!isConnected[i][j]) continue;
                    for (let k = j + 1; k < vertices.length; k++) {
                        if (!isConnected[i][k] || !isConnected[j][k]) continue;
                        if (Math.abs(cross(sub(vertices[j], vertices[i]), sub(vertices[k], vertices[i]))) < 1) continue;
                        triangles.push([vertices[i], vertices[j], vertices[k]]);
                    }
                }
            }
            return triangles;
        }

        // ===== 스냅 (점 > 교점 > 도형 위 > 자유) =====
        function findSnap(screenPos, pointerType) {
            const world = screenToWorld(screenPos);
            const threshold = (pointerType === 'touch' ? 22 : 12) / view.scale;
            let best = null, bestDistance = threshold;

            allObjects().forEach(o => {
                if (o.kind !== 'point') return;
                const d = dist(world, o);
                if (d < bestDistance) { best = { x: o.x, y: o.y, type: 'point', ref: o }; bestDistance = d; }
            });
            if (best) return best;

            bestDistance = threshold;
            intersectionCache.forEach(p => {
                const d = dist(world, p);
                if (d < bestDistance) { best = { x: p.x, y: p.y, type: 'intersection' }; bestDistance = d; }
            });
            if (best) return best;

            bestDistance = threshold * 0.8;
            allObjects().filter(isCurve).forEach(curve => {
                const projection = projectOntoCurve(world, curve);
                if (!projection) return;
                const d = dist(world, projection);
                if (d < bestDistance) { best = { x: projection.x, y: projection.y, type: 'object' }; bestDistance = d; }
            });
            return best || { x: world.x, y: world.y, type: 'free' };
        }

        function findErasableObject(screenPos, pointerType) {
            const world = screenToWorld(screenPos);
            const threshold = (pointerType === 'touch' ? 20 : 12) / view.scale;
            let best = null, bestDistance = threshold;
            getUserObjects('point').forEach(point => {
                const d = dist(world, point);
                if (d < bestDistance) { best = point; bestDistance = d; }
            });
            if (best) return best;
            state.userObjects.filter(isCurve).forEach(curve => {
                const projection = projectOntoCurve(world, curve);
                if (!projection) return;
                const d = dist(world, projection);
                if (d < bestDistance) { best = curve; bestDistance = d; }
            });
            return best;
        }

        // ===== 점 이름 =====
        function nextPointLabel() {
            const usedLabels = new Set(allObjects().filter(o => o.kind === 'point').map(o => o.label));
            for (const suffix of ['', "'", "''"]) {
                for (const letter of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
                    if (!usedLabels.has(letter + suffix)) return letter + suffix;
                }
            }
            return '';
        }

        function ensurePointAt(snap) {
            if (snap.type === 'point') return snap.ref;
            const point = createPoint(snap, nextPointLabel());
            state.userObjects.push(point);
            return point;
        }

        // ===== 기록 / 되돌리기 =====
        const captureSnapshot = () => JSON.stringify(state.userObjects);

        function restoreSnapshot(json) {
            state.userObjects = JSON.parse(json);
        }

        function pushHistory() {
            state.undoStack.push(captureSnapshot());
            if (state.undoStack.length > 200) state.undoStack.shift();
            state.redoStack.length = 0;
        }

        function undo() {
            if (!state.undoStack.length) return;
            state.redoStack.push(captureSnapshot());
            restoreSnapshot(state.undoStack.pop());
            resetToolState();
            geometryChanged();
        }

        function redo() {
            if (!state.redoStack.length) return;
            state.undoStack.push(captureSnapshot());
            restoreSnapshot(state.redoStack.pop());
            resetToolState();
            geometryChanged();
        }

        function geometryChanged() {
            recomputeIntersections();
            render();
            updateUi();
        }

        // ===== 도구 동작 =====
        function resetToolState() {
            rulerState.start = null;
            rulerState.end = null;
            Object.assign(compassState, {
                // 벌린 간격(radius)은 기억, 아직 벌리지 않았다면 두 점 재기부터
                stage: compassState.radius ? 'center' : 'measure1', centerSnap: null, startAngle: null, lastAngle: null,
                sweep: 0, sweepPressed: false, startedOnPress: false, justStarted: false, measureSnap: null
            });
        }

        function handlePointTap(snap) {
            if (snap.type === 'point') {
                if (!snap.ref.given) renamePoint(snap.ref);
                return;
            }
            pushHistory();
            ensurePointAt(snap);
            geometryChanged();
        }

        async function renamePoint(point) {
            const toPointLabel = value => value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
            const input = await showCustomModal('✏️ 점 이름 바꾸기', '새 이름을 영어 대문자로 입력하세요. (비우면 이름 없음)', { type: 'prompt', defaultValue: point.label, inputFilter: toPointLabel });
            if (input === null) return;
            const newLabel = toPointLabel(input);
            if (newLabel === point.label) return;
            const duplicate = newLabel ? allObjects().find(o => o.kind === 'point' && o !== point && o.label === newLabel) : null;
            if (duplicate?.given) {
                await showCustomModal('⚠️ 이름 중복', `${newLabel}은(는) 주어진 점의 이름이라 사용할 수 없어요.`);
                return;
            }
            if (duplicate && !await showCustomModal('⚠️ 이름 중복', `이미 점 ${newLabel}이(가) 있어요. 기존 점의 이름을 지우고 이 점을 ${newLabel}(으)로 바꿀까요?`, { type: 'confirm' })) return;
            pushHistory();
            if (duplicate) duplicate.label = '';
            point.label = newLabel;
            geometryChanged();
        }

        function eraseObject(target) {
            pushHistory();
            state.userObjects = state.userObjects.filter(o => o !== target);
            geometryChanged();
        }

        // lineType: 'segment'(선분) 또는 'ray'(첫 점에서 시작해 두 번째 점 쪽으로 뻗는 반직선)
        function commitRulerLine(startSnap, endSnap, lineType) {
            pushHistory();
            const p1 = ensurePointAt(startSnap), p2 = ensurePointAt(endSnap);
            const line = createLine(lineType, p1, p2);
            state.userObjects.push(line);
            geometryChanged();
        }

        // 컴퍼스를 벌린 뒤 연필로 그리기 시작할 곳을 고르는 단계
        function beginPencilStart() {
            Object.assign(compassState, { stage: 'start', startAngle: null, lastAngle: null, sweep: 0, sweepPressed: false, startedOnPress: false });
        }

        // 연필 시작점 확정 → 이후 포인터를 따라 돌며 그리기
        function setPencilStart(world) {
            const c = compassState, center = c.centerSnap;
            if (dist(world, center) * view.scale < 10) return false;
            const angle = Math.atan2(world.y - center.y, world.x - center.x);
            Object.assign(c, { stage: 'sweep', startAngle: angle, lastAngle: angle, sweep: 0 });
            return true;
        }

        function updateSweep(world) {
            const c = compassState, center = c.centerSnap;
            if (c.startAngle === null || dist(world, center) * view.scale < 10) return;
            const angle = Math.atan2(world.y - center.y, world.x - center.x);
            c.sweep = Math.max(-TWO_PI, Math.min(TWO_PI, c.sweep + normalizeAngle(angle - c.lastAngle)));
            c.lastAngle = angle;
        }

        function commitArc() {
            const c = compassState;
            pushHistory();
            const centerPoint = ensurePointAt(c.centerSnap);
            const arc = createArc(centerPoint, c.radius, c.startAngle, c.sweep);
            state.userObjects.push(arc);
            resetToolState();
            geometryChanged();
        }

        function compassPress() {
            const c = compassState, snap = pointer.hoverSnap;
            c.justStarted = false;
            if (c.stage === 'center' || c.stage === 'choose') {
                // 중심 클릭 → [벌린 간격 유지 / 조절] 선택 (선택 중 다른 곳을 클릭하면 중심 이동)
                c.centerSnap = snap;
                c.stage = 'choose';
            } else if (c.stage === 'start') {
                c.startedOnPress = setPencilStart(screenToWorld(pointer.downScreen));
            } else if (c.stage === 'sweep') {
                c.sweepPressed = true;
                updateSweep(screenToWorld(pointer.downScreen));
            } else if (c.stage === 'measure1') {
                c.measureSnap = snap;
                c.stage = 'measure2';
                c.justStarted = true;
            }
        }

        function compassRelease() {
            const c = compassState, snap = pointer.hoverSnap;
            if (c.stage === 'radius') {
                const radius = dist(c.centerSnap, snap);
                if (radius * view.scale < 3) return;
                c.radius = radius;
                beginPencilStart();
            } else if (c.stage === 'sweep') {
                if (c.startedOnPress) {
                    // 시작점을 누른 채 돌렸다 떼면(터치·드래그) 바로 완성, 클릭만 했으면 끝점 클릭을 기다림
                    c.startedOnPress = false;
                    if (pointer.moved && Math.abs(c.sweep) > 0.03) commitArc();
                    return;
                }
                if (!c.sweepPressed) return;
                c.sweepPressed = false;
                if (Math.abs(c.sweep) > 0.03) commitArc();
            } else if (c.stage === 'measure2') {
                if (c.justStarted && !pointer.moved) return;
                const length = dist(c.measureSnap, snap);
                if (length * view.scale < 3) return;
                // 첫 번째 점에 바늘을 꽂은 채로 바로 그리기 단계로 ([그리지 않기]로 간격만 기억 가능)
                c.radius = length;
                c.centerSnap = c.measureSnap;
                beginPencilStart();
            }
        }

        function handlePress() {
            switch (state.activeTool) {
                case 'ruler':
                    if (!rulerState.start || rulerState.end) {
                        // 처음 시작하거나, 선택 버튼이 떠 있을 때 다른 곳을 누르면 그 점에서 새로 시작
                        rulerState.start = pointer.hoverSnap;
                        rulerState.end = null;
                        rulerState.justStarted = true;
                    } else {
                        rulerState.justStarted = false;
                    }
                    break;
                case 'compass':
                    compassPress();
                    break;
            }
        }

        function handleRelease(screenPos) {
            switch (state.activeTool) {
                case 'point':
                    if (!pointer.moved) handlePointTap(pointer.hoverSnap);
                    break;
                case 'eraser':
                    if (!pointer.moved) {
                        const target = findErasableObject(screenPos, pointer.type);
                        if (target) eraseObject(target);
                    }
                    break;
                case 'ruler': {
                    if (!rulerState.start || rulerState.end || (rulerState.justStarted && !pointer.moved)) break;
                    if (dist(rulerState.start, pointer.hoverSnap) * view.scale < 3) { rulerState.start = null; break; }
                    rulerState.end = pointer.hoverSnap;
                    break;
                }
                case 'compass':
                    compassRelease();
                    break;
            }
        }

        // ===== 그리기 =====
        function getLineDrawEnds(line) {
            if (line.lineType === 'segment') return [line.p1, line.p2];
            const direction = unit(sub(line.p2, line.p1));
            const forward = { x: line.p1.x + direction.x * FAR_DISTANCE, y: line.p1.y + direction.y * FAR_DISTANCE };
            if (line.lineType === 'ray') return [line.p1, forward];
            return [{ x: line.p1.x - direction.x * FAR_DISTANCE, y: line.p1.y - direction.y * FAR_DISTANCE }, forward];
        }

        function drawLine(line, color, width, dash = []) {
            const [start, end] = getLineDrawEnds(line).map(worldToScreen);
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash(dash);
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
            ctx.restore();
        }

        function drawArc(arc, color, width, dash = []) {
            const center = worldToScreen({ x: arc.cx, y: arc.cy });
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.setLineDash(dash);
            ctx.beginPath();
            if (Math.abs(arc.sweep) >= TWO_PI - 1e-9) ctx.arc(center.x, center.y, arc.r * view.scale, 0, TWO_PI);
            else ctx.arc(center.x, center.y, arc.r * view.scale, arc.start, arc.start + arc.sweep, arc.sweep < 0);
            ctx.stroke();
            ctx.restore();
        }

        function drawLabel(text, screenX, screenY, font, color = '#0f172a') {
            ctx.save();
            ctx.font = font;
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = color;
            ctx.strokeText(text, screenX, screenY);
            ctx.fillText(text, screenX, screenY);
            ctx.restore();
        }

        function drawPoint(point) {
            const p = worldToScreen(point);
            ctx.save();
            ctx.fillStyle = point.given ? COLORS.given : COLORS.userPoint;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4.5, 0, TWO_PI);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // ===== 점 이름 자동 배치 (선·원의 일부·다른 이름과 겹치지 않는 위치 선택) =====
        const POINT_LABEL_FONT = "700 15px 'Pretendard Variable', sans-serif";
        // 주어진 글자: 길이 a, b, c는 기울임, 각(∠A 등)은 점 이름처럼 똑바로
        // 글자 왼쪽 x (화면 좌표): 각 이름은 꼭짓점에서 10px 왼쪽에서 끝나도록
        const givenTextLeft = (text, screenX, width) => text.alignRightOf ? screenX - 10 - width : screenX - 8;
        const givenTextFont = text => text.startsWith('∠')
            ? "700 17px 'Pretendard Variable', sans-serif"
            : "italic 700 17px 'Pretendard Variable', serif";
        const LABEL_HEIGHT = 12;

        // 점 기준 후보 위치 (선호 순서): 글자 왼쪽 x, 기준선 y
        const LABEL_CANDIDATES = [
            (p, w) => ({ x: p.x + 7, y: p.y - 8 }),           // 오른쪽 위
            (p, w) => ({ x: p.x + 9, y: p.y + 5 }),           // 오른쪽
            (p, w) => ({ x: p.x - 7 - w, y: p.y - 8 }),       // 왼쪽 위
            (p, w) => ({ x: p.x - 9 - w, y: p.y + 5 }),       // 왼쪽
            (p, w) => ({ x: p.x - w / 2, y: p.y - 10 }),      // 위
            (p, w) => ({ x: p.x - w / 2, y: p.y + 21 }),      // 아래
            (p, w) => ({ x: p.x + 7, y: p.y + 19 }),          // 오른쪽 아래
            (p, w) => ({ x: p.x - 7 - w, y: p.y + 19 })       // 왼쪽 아래
        ];

        const rectsOverlap = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;

        // 선분(화면 좌표)이 사각형을 지나는지 (Liang–Barsky 클리핑)
        function segmentHitsRect(a, b, rect) {
            let t0 = 0, t1 = 1;
            const dx = b.x - a.x, dy = b.y - a.y;
            const checks = [[-dx, a.x - rect.left], [dx, rect.right - a.x], [-dy, a.y - rect.top], [dy, rect.bottom - a.y]];
            for (const [p, q] of checks) {
                if (Math.abs(p) < 1e-12) { if (q < 0) return false; continue; }
                const t = q / p;
                if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
                else { if (t < t0) return false; if (t < t1) t1 = t; }
            }
            return true;
        }

        // 원의 일부(화면 좌표)가 사각형 테두리를 지나는지: 테두리를 따라가며 원과 만나는 곳의 각도 확인
        function arcHitsRect(arc, rect) {
            const center = worldToScreen({ x: arc.cx, y: arc.cy }), r = arc.r * view.scale;
            const corners = [[rect.left, rect.top], [rect.right, rect.top], [rect.right, rect.bottom], [rect.left, rect.bottom]];
            const nearestX = Math.max(rect.left, Math.min(center.x, rect.right)), nearestY = Math.max(rect.top, Math.min(center.y, rect.bottom));
            const farthest = Math.max(...corners.map(([x, y]) => Math.hypot(x - center.x, y - center.y)));
            if (Math.hypot(nearestX - center.x, nearestY - center.y) > r || farthest < r) return false;
            const samples = [];
            for (let i = 0; i < 4; i++) {
                const [x1, y1] = corners[i], [x2, y2] = corners[(i + 1) % 4];
                for (let k = 0; k < 8; k++) samples.push({ x: x1 + (x2 - x1) * k / 8, y: y1 + (y2 - y1) * k / 8 });
            }
            const offset = s => Math.hypot(s.x - center.x, s.y - center.y) - r;
            return samples.some((s, i) => {
                const next = samples[(i + 1) % samples.length];
                if (offset(s) * offset(next) > 0) return false;
                const mid = { x: (s.x + next.x) / 2, y: (s.y + next.y) / 2 };
                return isAngleOnArc(arc, Math.atan2(mid.y - center.y, mid.x - center.x));
            });
        }

        function drawPointLabels(objects) {
            ctx.save();
            const occupied = objects.filter(o => o.kind === 'text').map(text => {
                ctx.font = givenTextFont(text.text);
                const p = worldToScreen(text), width = ctx.measureText(text.text).width;
                const left = givenTextLeft(text, p.x, width);
                return { left, right: left + width, top: p.y - 14, bottom: p.y + 3 };
            });
            const pointBoxes = objects.filter(o => o.kind === 'point').map(point => {
                const p = worldToScreen(point);
                return { left: p.x - 5, right: p.x + 5, top: p.y - 5, bottom: p.y + 5 };
            });
            const curves = objects.filter(o => o.kind === 'line' || o.kind === 'arc' || o.kind === 'mark');
            ctx.restore();

            objects.filter(o => o.kind === 'point' && o.label).forEach(point => {
                const p = worldToScreen(point);
                ctx.save();
                ctx.font = POINT_LABEL_FONT;
                const width = ctx.measureText(point.label).width;
                ctx.restore();
                let best = null, bestPenalty = Infinity;
                for (const candidate of LABEL_CANDIDATES) {
                    const position = candidate(p, width);
                    const rect = { left: position.x - 2, right: position.x + width + 2, top: position.y - LABEL_HEIGHT - 2, bottom: position.y + 3 };
                    let penalty = 0;
                    curves.forEach(curve => {
                        const hit = curve.kind === 'line'
                            ? segmentHitsRect(...getLineDrawEnds(curve).map(worldToScreen), rect)
                            : arcHitsRect(curve, rect);
                        if (hit) penalty += 10;
                    });
                    penalty += occupied.filter(box => rectsOverlap(box, rect)).length * 10;
                    penalty += pointBoxes.filter(box => rectsOverlap(box, rect)).length * 5;
                    if (penalty < bestPenalty) { best = { position, rect }; bestPenalty = penalty; }
                    if (penalty === 0) break;
                }
                occupied.push(best.rect);
                drawLabel(point.label, best.position.x, best.position.y, POINT_LABEL_FONT);
            });
        }

        function drawRing(screenPoint, radius, color, fillColor = null) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(screenPoint.x, screenPoint.y, radius, 0, TWO_PI);
            if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
            ctx.stroke();
            ctx.restore();
        }

        // 컴퍼스 모양 (바늘, 연필, 손잡이)
        function drawCompass(needleWorld, pencilWorld) {
            const needle = worldToScreen(needleWorld), pencil = worldToScreen(pencilWorld);
            const span = dist(needle, pencil);
            const direction = span > 1 ? unit(sub(pencil, needle)) : { x: 1, y: 0 };
            let normal = { x: direction.y, y: -direction.x };
            if (normal.y > 0) normal = { x: -normal.x, y: -normal.y };
            const legLength = Math.max(span * 0.62, 70);
            const height = Math.sqrt(legLength * legLength - (span / 2) * (span / 2));
            const hinge = { x: (needle.x + pencil.x) / 2 + normal.x * height, y: (needle.y + pencil.y) / 2 + normal.y * height };

            ctx.save();
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(71, 85, 105, 0.85)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(hinge.x, hinge.y); ctx.lineTo(needle.x, needle.y);
            ctx.moveTo(hinge.x, hinge.y); ctx.lineTo(pencil.x, pencil.y);
            ctx.stroke();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.moveTo(hinge.x, hinge.y);
            ctx.lineTo(hinge.x + normal.x * 16, hinge.y + normal.y * 16);
            ctx.stroke();
            ctx.fillStyle = '#64748b';
            ctx.beginPath(); ctx.arc(hinge.x, hinge.y, 6, 0, TWO_PI); ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(needle.x, needle.y, 2.5, 0, TWO_PI); ctx.fill();
            ctx.fillStyle = COLORS.arc;
            ctx.beginPath(); ctx.arc(pencil.x, pencil.y, 3.5, 0, TWO_PI); ctx.fill();
            ctx.restore();
        }

        // 눈금 없는 자 모양 (반투명 막대)
        function drawRulerBand(startWorld, endWorld) {
            const start = worldToScreen(startWorld), end = worldToScreen(endWorld);
            const length = dist(start, end);
            if (length < 2) return;
            ctx.save();
            ctx.translate(start.x, start.y);
            ctx.rotate(Math.atan2(end.y - start.y, end.x - start.x));
            ctx.fillStyle = 'rgba(148, 163, 184, 0.18)';
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.45)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.rect(-30, 0, length + 60, 26);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawToolPreview() {
            const hover = pointer.hoverSnap;
            if (state.activeTool === 'ruler' && rulerState.start && (rulerState.end || hover)) {
                const end = rulerState.end || hover;
                drawRulerBand(rulerState.start, end);
                if (dist(rulerState.start, end) > 1e-6) {
                    // 선택 대기 중에는 반직선으로 뻗을 방향을 연하게 함께 표시
                    if (rulerState.end) drawLine({ lineType: 'ray', p1: rulerState.start, p2: end }, 'rgba(100,116,139,0.35)', 1, [2, 5]);
                    drawLine({ lineType: 'segment', p1: rulerState.start, p2: end }, COLORS.preview, 1.5, [6, 4]);
                }
                return;
            }
            if (state.activeTool !== 'compass') return;
            const c = compassState;
            if (c.stage === 'radius' && hover) {
                const radius = dist(c.centerSnap, hover);
                drawArc({ cx: c.centerSnap.x, cy: c.centerSnap.y, r: radius, start: 0, sweep: TWO_PI }, 'rgba(100,116,139,0.35)', 1, [4, 5]);
                drawCompass(c.centerSnap, hover);
            } else if (c.stage === 'start' || c.stage === 'sweep') {
                const arcPreview = { cx: c.centerSnap.x, cy: c.centerSnap.y, r: c.radius, start: c.startAngle ?? 0, sweep: c.sweep };
                drawArc({ ...arcPreview, start: 0, sweep: TWO_PI }, 'rgba(100,116,139,0.25)', 1, [4, 5]);
                let pencilAngle = 0;
                if (c.stage === 'sweep') {
                    drawArc(arcPreview, COLORS.arc, 2);
                    pencilAngle = c.startAngle + c.sweep;
                } else if (pointer.hoverScreen) {
                    const world = screenToWorld(pointer.hoverScreen);
                    pencilAngle = Math.atan2(world.y - c.centerSnap.y, world.x - c.centerSnap.x);
                }
                drawCompass(c.centerSnap, arcPointAt(arcPreview, pencilAngle));
            } else if (c.stage === 'choose') {
                // 기억된 벌린 간격으로 보조선 표시
                drawArc({ cx: c.centerSnap.x, cy: c.centerSnap.y, r: c.radius, start: 0, sweep: TWO_PI }, 'rgba(100,116,139,0.55)', 1.2, [4, 5]);
                drawCompass(c.centerSnap, { x: c.centerSnap.x - c.radius, y: c.centerSnap.y });
            } else if (c.stage === 'center' && hover) {
                drawArc({ cx: hover.x, cy: hover.y, r: c.radius, start: 0, sweep: TWO_PI }, 'rgba(100,116,139,0.35)', 1, [4, 5]);
                drawCompass(hover, { x: hover.x - c.radius, y: hover.y });
            } else if (c.stage === 'measure2' && hover) {
                drawArc({ cx: c.measureSnap.x, cy: c.measureSnap.y, r: dist(c.measureSnap, hover), start: 0, sweep: TWO_PI }, 'rgba(100,116,139,0.35)', 1, [4, 5]);
                drawCompass(c.measureSnap, hover);
            }
        }

        function drawSnapIndicator() {
            const snap = pointer.hoverSnap;
            if (!snap || !['point', 'ruler', 'compass'].includes(state.activeTool)) return;
            if (state.activeTool === 'compass' && ['start', 'sweep'].includes(compassState.stage)) return;
            if (pointer.type !== 'mouse' && !pointer.isDown) return;
            const p = worldToScreen(snap);
            if (snap.type === 'point') drawRing(p, 9, COLORS.snap);
            else if (snap.type === 'intersection') drawRing(p, 8, '#f59e0b', 'rgba(245, 158, 11, 0.2)');
            else if (snap.type === 'object') drawRing(p, 4, COLORS.snap, 'rgba(37, 99, 235, 0.5)');
        }

        function render() {
            const width = canvas.clientWidth, height = canvas.clientHeight;
            if (!width || !height) return;
            updateCompassChoice();
            updateRulerChoice();
            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 시연 중에는 학생 작도 대신 시연 도형을 표시
            const objects = demoState.active ? state.givenObjects.concat(demoState.objects) : allObjects();
            objects.filter(o => o.kind === 'mark').forEach(mark => drawArc(mark, COLORS.given, 1.5));
            objects.filter(o => o.kind === 'arc').forEach(arc => drawArc(arc, COLORS.arc, 1.6));
            objects.filter(o => o.kind === 'line').forEach(line => drawLine(line, line.given ? COLORS.given : COLORS.userLine, line.given ? 2.4 : 2));

            if (demoState.active) {
                objects.filter(o => o.kind === 'point').forEach(point => drawPoint(point));
                drawGivenTexts(objects);
                drawPointLabels(objects);
                drawDemoAnimation();
                return;
            }

            if (state.activeTool === 'eraser' && pointer.hoverErase) {
                const target = pointer.hoverErase;
                if (target.kind === 'line') drawLine(target, COLORS.erase, 4);
                else if (target.kind === 'arc') drawArc(target, COLORS.erase, 4);
                else drawRing(worldToScreen(target), 9, COLORS.erase);
            }

            objects.filter(o => o.kind === 'point').forEach(point => drawPoint(point));
            drawGivenTexts(objects);
            drawPointLabels(objects);

            drawToolPreview();
            drawSnapIndicator();
        }

        function drawGivenTexts(objects) {
            objects.filter(o => o.kind === 'text').forEach(text => {
                const p = worldToScreen(text), font = givenTextFont(text.text);
                ctx.save();
                ctx.font = font;
                const width = ctx.measureText(text.text).width;
                ctx.restore();
                drawLabel(text.text, givenTextLeft(text, p.x, width), p.y, font);
            });
        }

        // ===== UI 갱신 =====
        function updateStatus() {
            const c = compassState;
            const messages = {
                point: '클릭하여 점을 찍어요. 이미 있는 점을 클릭하면 이름을 바꿀 수 있어요.',
                ruler: rulerState.end ? '[선분 긋기] 또는 [반직선 긋기]를 선택하세요. (다른 곳을 클릭하면 새로 시작해요)'
                    : rulerState.start ? '두 번째 점을 클릭하세요. (Esc: 취소)' : '첫 번째 점을 클릭하세요.',
                eraser: '지울 도형을 클릭하세요. (주어진 도형은 지울 수 없어요)',
                pan: '드래그하여 화면을 이동해요. 마우스 휠이나 오른쪽 아래 버튼으로 확대·축소할 수 있어요.'
            };
            const compassMessages = {
                center: '바늘을 꽂을 중심을 클릭하세요.',
                choose: '[벌린 간격 유지] 또는 [벌린 간격 조절]을 선택하세요. (다른 곳을 클릭하면 중심이 옮겨져요)',
                radius: '컴퍼스를 새로 벌릴 점을 클릭하세요.',
                start: '연필로 그리기 시작할 곳을 클릭하세요. (터치: 시작할 곳을 누른 채 돌린 뒤 떼기)',
                sweep: '컴퍼스를 돌려 그린 뒤, 끝낼 곳을 클릭하세요.',
                measure1: '컴퍼스의 바늘을 꽂을 첫 번째 점을 클릭하세요.',
                measure2: '컴퍼스를 벌릴 두 번째 점을 클릭하세요. 벌린 간격은 기억돼요.'
            };
            statusText.textContent = state.activeTool === 'compass' ? compassMessages[c.stage] : messages[state.activeTool];
        }

        // [벌린 간격 유지 / 조절] 버튼을 컴퍼스 중심 옆에 배치 (확대·이동 시에도 따라감)
        function updateCompassChoice() {
            const stage = compassState.stage;
            const isVisible = !demoState.active && state.activeTool === 'compass' && (stage === 'choose' || stage === 'start');
            compassChoice.classList.toggle('d-none', !isVisible);
            if (!isVisible) return;
            // 선택 단계: [유지 / 조절], 연필 시작 단계: [그리지 않기]
            document.getElementById('btn-keep-radius').classList.toggle('d-none', stage !== 'choose');
            document.getElementById('btn-adjust-radius').classList.toggle('d-none', stage !== 'choose');
            document.getElementById('btn-skip-drawing').classList.toggle('d-none', stage !== 'start');
            placeChoiceNear(compassChoice, compassState.centerSnap);
        }

        // [선분 긋기 / 반직선 긋기] 버튼을 두 번째 점 옆에 배치
        function updateRulerChoice() {
            const isVisible = !demoState.active && state.activeTool === 'ruler' && !!rulerState.end;
            rulerChoice.classList.toggle('d-none', !isVisible);
            if (isVisible) placeChoiceNear(rulerChoice, rulerState.end);
        }

        // 선택 버튼 묶음을 기준점 오른쪽에 두되 캔버스·상단 막대를 벗어나지 않게
        function placeChoiceNear(element, worldPoint) {
            const anchor = worldToScreen(worldPoint);
            const maxLeft = canvas.clientWidth - element.offsetWidth - 8;
            const maxTop = canvas.clientHeight - element.offsetHeight - 8;
            const minTop = document.getElementById('canvas-topbar').offsetHeight + 8;
            element.style.left = `${Math.max(8, Math.min(anchor.x + 30, maxLeft))}px`;
            element.style.top = `${Math.max(minTop, Math.min(anchor.y - element.offsetHeight / 2, maxTop))}px`;
        }

        function updateUi() {
            document.getElementById('btn-undo').disabled = !state.undoStack.length;
            document.getElementById('btn-redo').disabled = !state.redoStack.length;
            updateStatus();
        }

        // 정답 확인 결과를 화면 중앙 토스트로 표시 ([닫기]를 누를 때까지 유지)
        function showFeedback(result) {
            checkToast.classList.toggle('text-bg-success', result.success);
            checkToast.classList.toggle('text-bg-warning', !result.success);
            document.getElementById('check-toast-message').innerHTML = result.message;
            bootstrap.Toast.getOrCreateInstance(checkToast).show();
        }

        // ===== 커스텀 모달 (alert / confirm / prompt 대체) =====
        const customModalElement = document.getElementById('customModal');
        let modalQueue = Promise.resolve();

        customModalElement.addEventListener('hide.bs.modal', () => {
            if (customModalElement.contains(document.activeElement)) document.activeElement.blur();
        });

        // type: 'alert' → true, 'confirm' → true/false, 'prompt' → 입력값/null
        // inputFilter: 입력값을 실시간으로 바꾸는 함수 (prompt 전용)
        function openCustomModal(title, message, { type = 'alert', defaultValue = '', inputFilter = null } = {}) {
            return new Promise(resolve => {
                const modal = bootstrap.Modal.getOrCreateInstance(customModalElement);
                const input = document.getElementById('customModalInput');
                const confirmButton = document.getElementById('customModalConfirm');
                const cancelButton = document.getElementById('customModalCancel');
                const isPrompt = type === 'prompt';

                document.getElementById('customModalTitle').textContent = title;
                document.getElementById('customModalMessage').textContent = message;
                input.classList.toggle('d-none', !isPrompt);
                input.value = inputFilter ? inputFilter(defaultValue) : defaultValue;
                cancelButton.classList.toggle('d-none', type === 'alert');

                // X 버튼·바깥 클릭·Esc로 닫으면 취소로 처리
                let result = isPrompt ? null : type === 'alert';
                // 열리는 애니메이션 중에는 Bootstrap이 hide()를 무시하므로, 다 열린 뒤 닫기
                let isFullyShown = false, isClosePending = false;
                const close = value => {
                    result = value;
                    if (isFullyShown) modal.hide(); else isClosePending = true;
                };
                const handleConfirm = () => close(isPrompt ? input.value : true);
                const handleCancel = () => close(isPrompt ? null : false);
                const handleEnter = event => { if (event.key === 'Enter' && !event.isComposing) handleConfirm(); };
                // 한글 조합 중에는 건드리지 않고, 조합이 끝나면 걸러냄
                const handleFilter = event => {
                    if (!inputFilter || event.isComposing) return;
                    const filtered = inputFilter(input.value);
                    if (filtered !== input.value) input.value = filtered;
                };
                const handleShown = () => {
                    isFullyShown = true;
                    if (isClosePending) { modal.hide(); return; }
                    if (isPrompt) { input.focus(); input.select(); } else confirmButton.focus();
                };
                const handleHidden = () => {
                    confirmButton.removeEventListener('click', handleConfirm);
                    cancelButton.removeEventListener('click', handleCancel);
                    input.removeEventListener('keydown', handleEnter);
                    input.removeEventListener('input', handleFilter);
                    input.removeEventListener('compositionend', handleFilter);
                    customModalElement.removeEventListener('shown.bs.modal', handleShown);
                    customModalElement.removeEventListener('hidden.bs.modal', handleHidden);
                    resolve(result);
                };

                confirmButton.addEventListener('click', handleConfirm);
                cancelButton.addEventListener('click', handleCancel);
                input.addEventListener('keydown', handleEnter);
                input.addEventListener('input', handleFilter);
                input.addEventListener('compositionend', handleFilter);
                customModalElement.addEventListener('shown.bs.modal', handleShown);
                customModalElement.addEventListener('hidden.bs.modal', handleHidden);
                modal.show();
            });
        }

        // 모달을 하나씩 순서대로 띄우기
        function showCustomModal(title, message, options) {
            const run = () => openCustomModal(title, message, options);
            const result = modalQueue.then(run, run);
            modalQueue = result.catch(() => { });
            return result;
        }

        function setActiveTool(tool) {
            state.activeTool = tool;
            document.getElementById(`tool-${tool}`).checked = true;
            resetToolState();
            canvas.style.cursor = tool === 'pan' ? 'grab' : (tool === 'eraser' ? 'pointer' : 'crosshair');
            pointer.hoverErase = null;
            updateStatus();
            render();
        }

        // ===== 작도 시연 플레이어 =====
        const DEMO_DURATIONS = { measure: 1100, arc: 1500, point: 450, line: 1100 };
        const DEMO_HOLD = 350;
        const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const lerp = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
        const lastDemoStep = () => demoState.actions.reduce((max, action) => Math.max(max, action.step), 0);
        const currentDemoStep = () => demoState.actions[demoState.index]?.step ?? lastDemoStep() + 1;

        function demoActionResult(action) {
            switch (action.type) {
                case 'arc': return [{ kind: 'arc', cx: action.center.x, cy: action.center.y, r: action.radius, start: action.start, sweep: action.sweep }];
                case 'point': return [{ kind: 'point', x: action.at.x, y: action.at.y, label: action.label }];
                case 'line': return [{ kind: 'line', lineType: action.lineType, p1: action.p1, p2: action.p2 }];
                default: return [];
            }
        }

        const demoArcShape = action => ({ cx: action.center.x, cy: action.center.y, r: action.radius });

        // 컴퍼스가 순간이동하지 않도록 컴퍼스 동작 사이에 이동 동작(compassMove)을 끼워 넣기
        // 컴퍼스 자세: { needle: 바늘 위치, pencil: 연필 위치 }
        function addCompassMoves(actions) {
            const result = [];
            let pose = null;
            actions.forEach(original => {
                const action = { ...original };
                if (action.type !== 'measure' && action.type !== 'arc') {
                    result.push({ ...action, restingCompass: pose });
                    return;
                }
                if (action.type === 'measure') {
                    // 벌어져 있던 길이 그대로 옮긴 뒤 새 길이로 벌리기
                    const opening = pose ? dist(pose.needle, pose.pencil) : 0;
                    const direction = unit(sub(action.to, action.from));
                    action.startPencil = { x: action.from.x + direction.x * opening, y: action.from.y + direction.y * opening };
                }
                const startPose = action.type === 'measure'
                    ? { needle: action.from, pencil: action.startPencil }
                    : { needle: action.center, pencil: arcPointAt(demoArcShape(action), action.start) };
                if (pose) {
                    const travel = Math.max(dist(pose.needle, startPose.needle), dist(pose.pencil, startPose.pencil));
                    if (travel > 0.5) result.push({ type: 'compassMove', step: action.step, from: pose, to: startPose, duration: Math.min(1400, 450 + travel * 1.5) });
                }
                result.push(action);
                pose = action.type === 'measure'
                    ? { needle: action.from, pencil: action.to }
                    : { needle: action.center, pencil: arcPointAt(demoArcShape(action), action.start + action.sweep) };
            });
            return result;
        }

        // 바늘은 직선으로, 연필은 벌린 길이·방향을 함께 보간
        function interpolateCompassPose(from, to, t) {
            const needle = lerp(from.needle, to.needle, t);
            const fromVector = sub(from.pencil, from.needle), toVector = sub(to.pencil, to.needle);
            const fromLength = Math.hypot(fromVector.x, fromVector.y), toLength = Math.hypot(toVector.x, toVector.y);
            const toAngle = Math.atan2(toVector.y, toVector.x);
            const fromAngle = fromLength > 1e-6 ? Math.atan2(fromVector.y, fromVector.x) : toAngle;
            const length = fromLength + (toLength - fromLength) * t;
            const angle = fromAngle + normalizeAngle(toAngle - fromAngle) * t;
            return { needle, pencil: { x: needle.x + length * Math.cos(angle), y: needle.y + length * Math.sin(angle) } };
        }

        // 진행 중인 동작을 도구 모양과 함께 그리기
        function drawDemoAnimation() {
            const action = demoState.actions[demoState.index];
            if (!action) return;
            const t = easeInOut(Math.min(1, demoState.progress));
            if (action.restingCompass) drawCompass(action.restingCompass.needle, action.restingCompass.pencil);
            if (action.type === 'compassMove') {
                const pose = interpolateCompassPose(action.from, action.to, t);
                drawCompass(pose.needle, pose.pencil);
            } else if (action.type === 'measure') {
                drawCompass(action.from, lerp(action.startPencil, action.to, t));
            } else if (action.type === 'arc') {
                const partialArc = { cx: action.center.x, cy: action.center.y, r: action.radius, start: action.start, sweep: action.sweep * t };
                if (t > 0) drawArc(partialArc, COLORS.arc, 2);
                drawCompass(action.center, arcPointAt(partialArc, partialArc.start + partialArc.sweep));
            } else if (action.type === 'point') {
                drawRing(worldToScreen(action.at), 4 + 12 * (1 - t), COLORS.userPoint);
            } else if (action.type === 'line') {
                drawRulerBand(action.p1, action.p2);
                if (t > 0) drawLine({ lineType: 'segment', p1: action.p1, p2: lerp(action.p1, action.p2, t) }, COLORS.userLine, 2);
            }
        }

        function finishDemoAction() {
            const action = demoState.actions[demoState.index];
            demoState.objects.push(...demoActionResult(action));
            demoState.index++;
            demoState.progress = 0;
            const next = demoState.actions[demoState.index];
            if (action.type === 'compassMove') demoState.hold = 80;
            else demoState.hold = next && next.step !== action.step ? DEMO_HOLD * 3 : DEMO_HOLD;
            if (!next) {
                pauseDemo();
            } else if (!demoState.continuous && next.step !== action.step) {
                demoState.hold = 0;
                pauseDemo();
            }
        }

        function demoTick(time) {
            if (!demoState.playing) return;
            const elapsed = demoState.lastTime === null ? 0 : (time - demoState.lastTime) * demoState.speed;
            demoState.lastTime = time;
            if (demoState.hold > 0) {
                demoState.hold -= elapsed;
            } else {
                const action = demoState.actions[demoState.index];
                demoState.progress += elapsed / (action.duration ?? DEMO_DURATIONS[action.type]);
                if (demoState.progress >= 1) finishDemoAction();
            }
            render();
            updateDemoUi();
            if (demoState.playing) demoState.frameId = requestAnimationFrame(demoTick);
        }

        // step 이전 단계의 동작을 모두 완료한 상태로 이동
        function jumpToDemoStep(step) {
            demoState.objects = [];
            demoState.index = 0;
            demoState.progress = 0;
            demoState.hold = 0;
            while (demoState.index < demoState.actions.length && demoState.actions[demoState.index].step < step) {
                demoState.objects.push(...demoActionResult(demoState.actions[demoState.index]));
                demoState.index++;
            }
            if (demoState.index >= demoState.actions.length) pauseDemo();
            render();
            updateDemoUi();
        }

        function playDemo() {
            if (demoState.index >= demoState.actions.length) jumpToDemoStep(0);
            demoState.playing = true;
            demoState.lastTime = null;
            cancelAnimationFrame(demoState.frameId);
            demoState.frameId = requestAnimationFrame(demoTick);
            updateDemoUi();
        }

        function pauseDemo() {
            demoState.playing = false;
            cancelAnimationFrame(demoState.frameId);
            updateDemoUi();
        }

        // 단계 보기: 앞 단계까지 완성된 상태에서 해당 단계 하나만 재생
        function playDemoStep(step) {
            demoState.focusStep = Math.max(0, Math.min(step, lastDemoStep()));
            jumpToDemoStep(demoState.focusStep);
            playDemo();
        }

        function setDemoContinuous(isContinuous) {
            demoState.continuous = isContinuous;
            pauseDemo();
            if (!isContinuous) demoState.focusStep = Math.min(currentDemoStep(), lastDemoStep());
            updateDemoUi();
        }

        function startDemo() {
            const mission = MISSIONS[state.missionId];
            if (!mission.demo) return;
            resetToolState();
            pointer.hoverSnap = null;
            demoState.active = true;
            demoState.actions = addCompassMoves(mission.demo());
            document.getElementById('tool-panel').classList.add('d-none');
            document.getElementById('demo-panel').classList.remove('d-none');
            canvas.style.cursor = 'default';
            if (demoState.continuous) {
                jumpToDemoStep(0);
                playDemo();
            } else {
                playDemoStep(demoState.focusStep);  // 따라 하기 전에 보던 단계부터 이어서
            }
        }

        function closeDemo() {
            pauseDemo();
            demoState.active = false;
            demoState.objects = [];
            document.getElementById('tool-panel').classList.remove('d-none');
            document.getElementById('demo-panel').classList.add('d-none');
            setActiveTool(state.activeTool);
        }

        function updateDemoUi() {
            if (!demoState.active) return;
            const steps = MISSIONS[state.missionId].steps;
            const isContinuous = demoState.continuous;
            document.getElementById('btn-demo-play').classList.toggle('d-none', !isContinuous);
            document.getElementById('demo-step-controls').classList.toggle('d-none', isContinuous);
            if (isContinuous) {
                const step = currentDemoStep();
                const isFinished = demoState.index >= demoState.actions.length;
                document.getElementById('demo-step-badge').textContent = isFinished ? '시연 완료' : `${step + 1} / ${steps.length} 단계`;
                demoCaption.innerHTML = isFinished
                    ? '시연이 끝났어요! [따라 하기]를 눌러 직접 작도해 보세요.'
                    : `${step + 1}. ${steps[step]}` + (demoState.playing ? '' : ' <span class="text-secondary fw-normal">(▶를 누르면 재생돼요)</span>');
            } else {
                // 단계 보기: 보고 있는 단계를 표시, 처음/마지막 단계에서는 이전/다음 비활성
                const step = demoState.focusStep;
                document.getElementById('demo-step-badge').textContent = `${step + 1} / ${steps.length} 단계`;
                demoCaption.innerHTML = `${step + 1}. ${steps[step]}`;
                document.getElementById('btn-demo-prev').disabled = step <= 0;
                document.getElementById('btn-demo-next').disabled = step >= lastDemoStep();
            }
            // 매 프레임 아이콘을 새로 만들면 클릭이 씹히므로 상태가 바뀔 때만 클래스 변경
            const iconClass = `bi ${demoState.playing ? 'bi-pause-fill' : 'bi-play-fill'} pe-none`;
            if (demoPlayIcon.className !== iconClass) demoPlayIcon.className = iconClass;
        }

        // ===== 문제 불러오기 =====
        function buildMissionSelect() {
            const groups = {};
            Object.entries(MISSIONS).forEach(([id, mission]) => {
                if (!groups[mission.group]) {
                    groups[mission.group] = document.createElement('optgroup');
                    groups[mission.group].label = mission.group;
                    missionSelect.appendChild(groups[mission.group]);
                }
                groups[mission.group].appendChild(new Option(mission.title, id));
            });
        }

        function loadMission(id) {
            if (demoState.active) closeDemo();
            demoState.focusStep = 0;
            const mission = MISSIONS[id];
            state.missionId = id;
            state.givenObjects = mission.build();
            demoButton.classList.toggle('d-none', !mission.demo);
            document.getElementById('btn-answer').classList.toggle('d-none', !mission.demo);
            state.userObjects = [];
            state.undoStack = [];
            state.redoStack = [];
            compassState.radius = null;
            resetToolState();

            missionSelect.value = id;
            document.getElementById('mission-description').innerHTML = mission.description;
            checkButton.classList.toggle('d-none', !mission.check);

            fitView();
            geometryChanged();
        }

        // ===== 이벤트 =====
        const getScreenPos = event => {
            const rect = canvas.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
        };

        canvas.addEventListener('pointerdown', event => {
            if (demoState.active || (event.pointerType === 'mouse' && event.button !== 0)) return;
            canvas.setPointerCapture(event.pointerId);
            const screenPos = getScreenPos(event);
            Object.assign(pointer, { isDown: true, downScreen: screenPos, moved: false, type: event.pointerType, hoverScreen: screenPos });
            pointer.hoverSnap = findSnap(screenPos, event.pointerType);
            if (state.activeTool === 'pan') canvas.style.cursor = 'grabbing';
            handlePress();
            updateStatus();
            render();
        });

        canvas.addEventListener('pointermove', event => {
            if (demoState.active) return;
            const screenPos = getScreenPos(event);
            const previous = pointer.hoverScreen;
            pointer.type = event.pointerType;
            pointer.hoverScreen = screenPos;
            // 터치는 손가락 떨림이 있으므로 더 많이 움직여야 드래그로 판단
            const dragThreshold = event.pointerType === 'touch' ? 14 : 6;
            if (pointer.isDown && dist(screenPos, pointer.downScreen) > dragThreshold) pointer.moved = true;

            if (state.activeTool === 'pan') {
                if (pointer.isDown && previous) {
                    view.offsetX += screenPos.x - previous.x;
                    view.offsetY += screenPos.y - previous.y;
                    render();
                }
                return;
            }
            pointer.hoverSnap = findSnap(screenPos, event.pointerType);
            if (state.activeTool === 'eraser') pointer.hoverErase = findErasableObject(screenPos, event.pointerType);
            if (state.activeTool === 'compass' && compassState.stage === 'sweep') updateSweep(screenToWorld(screenPos));
            render();
        });

        canvas.addEventListener('pointerup', event => {
            if (!pointer.isDown) return;
            const screenPos = getScreenPos(event);
            pointer.hoverScreen = screenPos;
            if (state.activeTool !== 'pan') pointer.hoverSnap = findSnap(screenPos, event.pointerType);
            else canvas.style.cursor = 'grab';
            handleRelease(screenPos);
            pointer.isDown = false;
            updateStatus();
            render();
        });

        canvas.addEventListener('pointercancel', () => { pointer.isDown = false; });

        canvas.addEventListener('pointerleave', event => {
            if (event.pointerType !== 'mouse') return;
            pointer.hoverSnap = null;
            pointer.hoverScreen = null;
            pointer.hoverErase = null;
            render();
        });

        canvas.addEventListener('wheel', event => {
            event.preventDefault();
            zoomAt(getScreenPos(event), event.deltaY < 0 ? 1.1 : 1 / 1.1);
        }, { passive: false });

        document.querySelectorAll('input[name="tool"]').forEach(input => {
            input.addEventListener('change', () => setActiveTool(input.value));
        });


        document.getElementById('btn-keep-radius').addEventListener('click', () => {
            if (compassState.stage !== 'choose') return;
            beginPencilStart();
            updateStatus();
            render();
        });

        document.getElementById('btn-adjust-radius').addEventListener('click', () => {
            if (compassState.stage !== 'choose') return;
            compassState.stage = 'radius';
            updateStatus();
            render();
        });

        // 자: 두 점을 찍은 뒤 선분 / 반직선 선택
        const finishRuler = lineType => {
            if (!rulerState.end) return;
            const startSnap = rulerState.start, endSnap = rulerState.end;
            rulerState.start = rulerState.end = null;
            commitRulerLine(startSnap, endSnap, lineType);
        };
        document.getElementById('btn-draw-segment').addEventListener('click', () => finishRuler('segment'));
        document.getElementById('btn-draw-ray').addEventListener('click', () => finishRuler('ray'));

        // 벌린 간격은 기억한 채 그리기만 취소
        document.getElementById('btn-skip-drawing').addEventListener('click', () => {
            if (compassState.stage !== 'start') return;
            resetToolState();
            updateStatus();
            render();
        });


        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-redo').addEventListener('click', redo);
        document.getElementById('btn-clear').addEventListener('click', async () => {
            if (!state.userObjects.length) return;
            if (!await showCustomModal('🗑️ 모두 지우기', '내가 작도한 내용을 모두 지울까요?', { type: 'confirm' })) return;
            pushHistory();
            state.userObjects = [];
            resetToolState();
            geometryChanged();
        });

        const canvasCenter = () => ({ x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 });
        document.getElementById('btn-zoom-in').addEventListener('click', () => zoomAt(canvasCenter(), 1.25));
        document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAt(canvasCenter(), 1 / 1.25));
        document.getElementById('btn-zoom-fit').addEventListener('click', () => { fitView(); render(); });


        missionSelect.addEventListener('change', async () => {
            const nextMissionId = missionSelect.value;
            if (state.userObjects.length) {
                missionSelect.value = state.missionId;
                if (!await showCustomModal('📋 문제 바꾸기', '문제를 바꾸면 지금까지의 작도가 지워져요. 계속할까요?', { type: 'confirm' })) return;
            }
            loadMission(nextMissionId);
        });

        demoButton.addEventListener('click', startDemo);
        demoPlayButton.addEventListener('click', () => demoState.playing ? pauseDemo() : playDemo());
        document.getElementById('btn-demo-prev').addEventListener('click', () => playDemoStep(demoState.focusStep - 1));
        document.getElementById('btn-demo-replay').addEventListener('click', () => playDemoStep(demoState.focusStep));
        document.getElementById('btn-demo-next').addEventListener('click', () => playDemoStep(demoState.focusStep + 1));
        document.getElementById('demo-continuous').addEventListener('change', event => setDemoContinuous(event.target.checked));
        document.getElementById('btn-demo-close').addEventListener('click', closeDemo);

        // ===== 정답 보기 =====
        const answerModalElement = document.getElementById('answerModal');
        const answerCanvas = document.getElementById('answer-canvas');

        // 주어진 도형 + 정답 작도(시연 결과)를 모달 캔버스에 그리기 (기존 그리기 함수 재사용)
        function renderAnswerPreview() {
            const mission = MISSIONS[state.missionId];
            if (!mission.demo) return;
            const width = answerCanvas.clientWidth, height = answerCanvas.clientHeight;
            const ratio = window.devicePixelRatio || 1;
            answerCanvas.width = Math.round(width * ratio);
            answerCanvas.height = Math.round(height * ratio);

            const mainContext = ctx, mainView = { ...view };
            ctx = answerCanvas.getContext('2d');
            view.scale = Math.min(width / WORLD_WIDTH, height / WORLD_HEIGHT) * 0.96;
            view.offsetX = (width - WORLD_WIDTH * view.scale) / 2;
            view.offsetY = (height - WORLD_HEIGHT * view.scale) / 2;
            try {
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);
                const objects = state.givenObjects.concat(mission.demo().flatMap(demoActionResult));
                objects.filter(o => o.kind === 'mark').forEach(mark => drawArc(mark, COLORS.given, 1.5));
                objects.filter(o => o.kind === 'arc').forEach(arc => drawArc(arc, COLORS.arc, 1.6));
                objects.filter(o => o.kind === 'line').forEach(line => drawLine(line, line.given ? COLORS.given : COLORS.userLine, line.given ? 2.4 : 2));
                objects.filter(o => o.kind === 'point').forEach(point => drawPoint(point));
                drawGivenTexts(objects);
                drawPointLabels(objects);
            } finally {
                ctx = mainContext;
                Object.assign(view, mainView);
            }
        }

        document.getElementById('btn-answer').addEventListener('click', () => {
            const mission = MISSIONS[state.missionId];
            document.getElementById('answer-steps').innerHTML = mission.steps.map(step => `<li class="mb-1">${step}</li>`).join('');
            bootstrap.Modal.getOrCreateInstance(answerModalElement).show();
        });
        answerModalElement.addEventListener('shown.bs.modal', renderAnswerPreview);

        checkButton.addEventListener('click', () => {
            const mission = MISSIONS[state.missionId];
            if (mission.check) showFeedback(mission.check());
        });

        document.addEventListener('keydown', event => {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') return;
            if (customModalElement.classList.contains('show') || answerModalElement.classList.contains('show')) return;
            if (demoState.active) {
                if (event.key === 'Escape') closeDemo();
                return;
            }
            const key = event.key.toLowerCase();
            if (event.key === 'Escape') {
                resetToolState();
                updateStatus();
                render();
            } else if ((event.ctrlKey || event.metaKey) && key === 'z') {
                event.preventDefault();
                if (event.shiftKey) redo(); else undo();
            } else if ((event.ctrlKey || event.metaKey) && key === 'y') {
                event.preventDefault();
                redo();
            }
        });

        function resizeCanvas() {
            pixelRatio = window.devicePixelRatio || 1;
            canvas.width = Math.round(canvas.clientWidth * pixelRatio);
            canvas.height = Math.round(canvas.clientHeight * pixelRatio);
            fitView();
            render();
        }

        new ResizeObserver(resizeCanvas).observe(document.getElementById('canvas-wrapper'));

        // ===== 초기화 =====
        buildMissionSelect();
        setActiveTool('ruler');
        loadMission('segmentCopy');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
