<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도형의 작도 연습 - 중1 수학</title>
    <!-- 파비콘 -->
    <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 네비게이션바 공통 CSS 연결 -->
    <link rel="stylesheet" href="../../../css/navbar.css">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

        /* ===== 전역 설정 ===== */
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #64748b;
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }

        /* ===== 작도 캔버스 ===== */
        #canvas-wrapper {
            position: relative;
            width: 100%;
            height: 680px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            overflow: hidden;
        }

        @media (max-width: 991px) {
            #canvas-wrapper {
                height: 700px;
            }
        }

        #construction-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        /* 캔버스 안 상단 도구 막대 */
        .canvas-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 4;
            padding: 0.6rem 0.75rem;
            background-color: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid #e2e8f0;
        }

        #status-text {
            min-height: 1.3em;
        }

        /* 선분 기호 (윗줄) */
        .seg {
            text-decoration: overline;
        }

        .answer-canvas-wrapper {
            position: relative;
            height: 60vh;
            min-height: 320px;
        }

        #answer-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* 반직선 기호 (글자 위 오른쪽 화살표) */
        .ray {
            position: relative;
            display: inline-block;
            padding-top: 0.2em;
            line-height: 1;
        }

        .ray::before {
            content: '';
            position: absolute;
            left: 0;
            right: 1px;
            top: 0.02em;
            border-top: 1px solid currentColor;
        }

        .ray::after {
            content: '';
            position: absolute;
            right: 1px;
            top: -0.13em;
            width: 0.3em;
            height: 0.3em;
            border-top: 1px solid currentColor;
            border-right: 1px solid currentColor;
            transform: rotate(45deg);
        }

        .compass-choice {
            position: absolute;
            z-index: 5;
            white-space: nowrap;
        }

        .zoom-controls {
            position: absolute;
            right: 12px;
            bottom: 12px;
        }

        .settings-panel {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
        }
    </style>
</head>

<body>

        <!-- 2. 작도 영역 -->
        <section id="canvas-wrapper">
            <canvas id="construction-canvas"></canvas>

            <!-- 캔버스 상단 막대: 작도 도구 (시연 중에는 시연 조절로 교체) -->
            <div id="canvas-topbar" class="canvas-topbar">
                <div id="tool-panel">

                            <input type="radio" class="btn-check" name="tool" id="tool-eraser" value="eraser"

                            <label class="btn btn-outline-dark" for="tool-eraser"><i class="bi bi-eraser"></i> 지우개</label>

                            <input type="radio" class="btn-check" name="tool" id="tool-pan" value="pan" autocomplete="off">

                        <div class="d-flex gap-2 ms-auto">

            <!-- 컴퍼스 중심 옆에 뜨는 선택 버튼 -->

            <div id="compass-choice" class="compass-choice d-none d-flex flex-column gap-1">

                <button type="button" class="btn btn-sm btn-light border shadow-sm" id="btn-adjust-radius">벌린 간격 조절</button>

    <script>
        // ===== 상수 =====
        const WORLD_WIDTH = 1000;
        const WORLD_HEIGHT = 600;
        const TWO_PI = Math.PI * 2;
        const FAR_DISTANCE = 1e5;
        const CHECK_LENGTH_EPS = 1e-2;
        const CHECK_ANGLE_EPS = 1e-4;
        const COLORS = {
            given: '#0f172a',
            userLine: '#2563eb',
            arc: '#f97316',
            userPoint: '#dc2626',
            snap: '#2563eb',
            preview: '#64748b',
            erase: '#ef4444'
        };

        // ===== 벡터 유틸 =====
        const sub = (p, q) => ({ x: p.x - q.x, y: p.y - q.y });
        const dot = (u, v) => u.x * v.x + u.y * v.y;
        const cross = (u, v) => u.x * v.y - u.y * v.x;
        const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
        const unit = v => { const length = Math.hypot(v.x, v.y) || 1; return { x: v.x / length, y: v.y / length }; };
        const angleBetween = (u, v) => Math.abs(Math.atan2(cross(u, v), dot(u, v)));
        const normalizeAngle = angle => Math.atan2(Math.sin(angle), Math.cos(angle));
        const positiveMod = angle => ((angle % TWO_PI) + TWO_PI) % TWO_PI;
        const isNear = (a, b, eps = CHECK_LENGTH_EPS) => Math.abs(a - b) < eps;

        // 화면 기준 반시계 방향 각도(도)로 점 위치 계산 (캔버스는 y축이 아래 방향)
        function polarPoint(origin, degrees, length) {
            const radians = degrees * Math.PI / 180;
            return { x: origin.x + length * Math.cos(radians), y: origin.y - length * Math.sin(radians) };
        }

        // ===== 도형 객체 생성 =====
        let objectIdCounter = 0;
        const createPoint = (p, label = '', given = false) => ({ id: ++objectIdCounter, kind: 'point', x: p.x, y: p.y, label, given });
        const createLine = (lineType, p1, p2, given = false, label = '') => ({ id: ++objectIdCounter, kind: 'line', lineType, p1: { x: p1.x, y: p1.y }, p2: { x: p2.x, y: p2.y }, given, label });
        const createArc = (center, r, start, sweep) => ({ id: ++objectIdCounter, kind: 'arc', cx: center.x, cy: center.y, r, start, sweep, given: false });
        const createText = (p, text) => ({ id: ++objectIdCounter, kind: 'text', x: p.x, y: p.y, text, given: true });

        function createAngleMark(vertex, fromDegrees, toDegrees) {
            return {
                id: ++objectIdCounter, kind: 'mark', cx: vertex.x, cy: vertex.y, r: 26,
                start: -fromDegrees * Math.PI / 180, sweep: -(toDegrees - fromDegrees) * Math.PI / 180, given: true
            };
        }

        // 이름 붙은 주어진 선분 (a, b, c 등)
        function createGivenSegment(p1, p2, label) {
            return [
                createLine('segment', p1, p2, true, label),
                createPoint(p1, '', true),
                createPoint(p2, '', true),
                createText({ x: p1.x - 30, y: p1.y + 5 }, label)
            ];
        }

        // 주어진 각 (꼭짓점에서 두 변이 뻗어나감)
        function createGivenAngle(vertex, degrees, armLength, label) {
            const armEnd1 = polarPoint(vertex, 0, armLength);
            const armEnd2 = polarPoint(vertex, degrees, armLength);
            return [
                createLine('segment', vertex, armEnd1, true),
                createLine('segment', vertex, armEnd2, true),
                createAngleMark(vertex, 0, degrees),
                createPoint(vertex, '', true),
                createPoint(armEnd1, '', true),
                createPoint(armEnd2, '', true),
                // 각 이름은 꼭짓점 왼쪽에 붙여 표시 (화면 크기와 관계없이 꼭짓점과 일정 간격)
                { ...createText({ x: vertex.x, y: vertex.y + 6 }, label), alignRightOf: true }
            ];
        }

        // ===== 작도 시연 동작 정의 (step: 작도 단계 번호) =====
        const demoMeasure = (step, from, to) => ({ type: 'measure', step, from, to });
        const demoPoint = (step, at, label = '') => ({ type: 'point', step, at, label });
        const demoLine = (step, lineType, p1, p2) => ({ type: 'line', step, lineType, p1, p2 });

        // 목표점 주변을 지나는 짧은 호
        function demoArcAround(step, center, radius, target, spread = 0.35) {
            const angle = Math.atan2(target.y - center.y, target.x - center.x);
            return { type: 'arc', step, center, radius, start: angle - spread, sweep: spread * 2 };
        }

        // 화면 기준 각도 fromDegrees ~ toDegrees 구간을 덮는 호 (양 끝 여유 포함)
        function demoArcBetween(step, center, radius, fromDegrees, toDegrees) {
            const start = -fromDegrees * Math.PI / 180, sweep = -(toDegrees - fromDegrees) * Math.PI / 180;
            const direction = Math.sign(sweep) || 1;
            return { type: 'arc', step, center, radius, start: start - 0.25 * direction, sweep: sweep + 0.5 * direction };
        }

        // 크기가 같은 각의 작도 (steps: 5개 동작 묶음의 작도 단계 번호, 숫자 하나면 모두 같은 단계)
        // sideLength: 마지막에 긋는 각의 변 길이 (기본값은 교점까지), lineType: 그 변의 종류 (선분 / 반직선)
        function demoAngleCopy(steps, givenVertex, givenDegrees, target, baseDegrees, turnDegrees, radius, labels = [], sideLength = radius, lineType = 'segment') {
            const stepOf = index => Array.isArray(steps) ? steps[index] : steps;
            const givenStart = polarPoint(givenVertex, 0, radius), givenEnd = polarPoint(givenVertex, givenDegrees, radius);
            const targetStart = polarPoint(target, baseDegrees, radius), targetEnd = polarPoint(target, baseDegrees + turnDegrees, radius);
            const lineEnd = polarPoint(target, baseDegrees + turnDegrees, sideLength);
            return [
                demoArcBetween(stepOf(0), givenVertex, radius, 0, givenDegrees),
                demoPoint(stepOf(0), givenStart, labels[0]), demoPoint(stepOf(0), givenEnd, labels[1]),
                demoArcBetween(stepOf(1), target, radius, baseDegrees, baseDegrees + turnDegrees),
                demoPoint(stepOf(1), targetStart, labels[2]),
                demoMeasure(stepOf(2), givenStart, givenEnd),
                demoArcAround(stepOf(3), targetStart, dist(givenStart, givenEnd), targetEnd),
                demoPoint(stepOf(3), targetEnd, labels[3]),
                demoLine(stepOf(4), lineType, target, lineEnd)
            ];
        }

        // 삼각형 1단계: 선분을 길게 긋고 점 B를 찍은 뒤, 길이 a를 옮겨 점 C를 찍기 (BC = a 작도)
        function demoBaseSide(step, B, C, givenStartOfA, lineStart, lineEnd) {
            const a = dist(B, C);
            return [
                demoLine(step, 'segment', lineStart, lineEnd), demoPoint(step, B, 'B'),
                demoMeasure(step, givenStartOfA, { x: givenStartOfA.x + a, y: givenStartOfA.y }),
                demoArcAround(step, B, a, C), demoPoint(step, C, 'C')
            ];
        }

        function upperCircleIntersection(center1, radius1, center2, radius2) {
            const toCircle = (center, r) => ({ cx: center.x, cy: center.y, r, start: 0, sweep: TWO_PI });
            return intersectArcArc(toCircle(center1, radius1), toCircle(center2, radius2)).sort((p, q) => p.y - q.y)[0];
        }

        // 선분 기호(윗줄) 표기: 문구는 innerHTML로 출력
        const seg = name => `<span class="seg">${name}</span>`;
        // 반직선 기호(글자 위 화살표) 표기
        const ray = name => `<span class="ray">${name}</span>`;

        // ===== 연습 문제 정의 =====
        const MISSIONS = {
            segmentCopy: {
                group: '기본 도형의 작도',
                title: '길이가 같은 선분의 작도',
                description: '선분 AB와 길이가 같은 선분 PQ를 반직선 위에 작도하고 점 Q를 찍으세요.',
                steps: [
                    '점 A, 점 B를 차례로 클릭해 컴퍼스를 선분 AB의 길이만큼 벌린 뒤, [그리지 않기]를 누릅니다.',
                    '점 P를 클릭해 바늘을 꽂고 [벌린 간격 유지]를 선택한 뒤, 반직선과 만나도록 원의 일부를 그립니다.',
