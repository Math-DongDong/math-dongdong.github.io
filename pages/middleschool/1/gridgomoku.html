<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좌표평면 오목</title>
    <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../css/navbar.css">
    <link rel="stylesheet" href="../../../css/dashboard.css">

    <style>
        .gomoku-board-wrapper {
            max-width: 100%;
            display: flex;
            justify-content: center;
        }

        .gomoku-board-wrapper canvas {
            max-width: 100%;
            height: auto !important;
        }

        .player-bars-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .player-info-bar {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #fff;
            border: 2px solid #e9ecef;
        }

        .player-info-bar .stone-indicator {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
        }

        .player-info-bar .stone-indicator.black {
            background: radial-gradient(circle at 35% 35%, #555, #111);
        }

        .player-info-bar .stone-indicator.white {
            background: radial-gradient(circle at 35% 35%, #fff, #ccc);
            border: 1px solid #aaa;
        }

        .player-info-bar.active-turn {
            border-color: #0d6efd;
            background: #e7f1ff;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .roulette-input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .roulette-wrapper {
            width: 90px;
            height: 36px;
            overflow-x: scroll;
            overflow-y: hidden;
            overscroll-behavior-x: none;
            -webkit-tap-highlight-color: transparent;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.08);
            white-space: nowrap;
            cursor: grab;
        }

        .roulette-wrapper::-webkit-scrollbar {
            display: none;
        }

        .roulette-wrapper.dragging {
            cursor: grabbing;
            user-select: none;
        }

        .roulette-inner {
            display: inline-flex;
            flex-direction: row;
        }

        .roulette-item {
            width: 30px;
            height: 36px;
            line-height: 36px;
            text-align: center;
            color: #cbd5e1;
            transition: all 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: inline-block;
            flex-shrink: 0;
        }

        .coord-item {
            scroll-snap-align: center;
        }

        .roulette-item.selected {
            color: #0d6efd;
            font-weight: 900;
            background: #e7f1ff;
            border-radius: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online {
            background: #28a745;
        }

        .status-dot.away {
            background: #ffc107;
        }

        .status-dot.offline {
            background: #dc3545;
        }

        .waiting-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e9ecef;
            border-top: 5px solid #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .waiting-spinner {
                animation: none;
            }
        }

        .win-rate-bar {
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
        }

        .win-rate-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="modal fade" id="customModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="customModalTitle">알림</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pb-0" id="customModalBody"></div>
                <div class="modal-footer border-0 pt-3">
                    <button type="button" class="btn btn-secondary rounded-3 px-4 d-none"
                        id="customModalCancel">취소</button>
                    <button type="button" class="btn btn-primary rounded-3 px-4" id="customModalConfirm">확인</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../../js/navbar.js"></script>

    <main class="container pt-4">
        <div class="text-end mb-3">
            <span class="badge bg-secondary fs-6" id="nav-room-info">대기 중</span>
        </div>

        <div id="landing-section" class="section-container active-section text-center py-5">
            <h1 class="fw-bold mb-4">📐 좌표평면 오목</h1>
            <p class="text-muted mb-5">좌표를 입력하여 좌표평면 위에서 오목 대결을 펼쳐보세요!</p>
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div id="room-entrance-container"></div>
                </div>
            </div>
        </div>

        <div id="admin-section" class="section-container">
            <div class="admin-card mb-4">
                <!-- 대시보드 상단 헤더 (공통 모듈) -->
                <div id="dash-header-placeholder"></div>
                <script src="../../../js/dashboard-header.js" data-title="좌표평면 오목 대시보드" data-export="false"
                    data-select-id="admin-room-select"></script>

                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h5 class="fw-bold mb-0">👥 참가자 및 대전 현황</h5>
                    <span class="badge bg-info fs-6" id="admin-player-count">0명 접속</span>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center" id="admin-record-table">
                        <thead class="table-light">
                            <tr>
                                <th>닉네임</th>
                                <th>상태</th>
                                <th>대전 현황</th>
                                <th>승</th>
                                <th>패</th>
                                <th>승률</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="admin-record-tbody">
                            <tr>
                                <td colspan="7" class="py-4 text-muted">방을 선택해주세요.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="waiting-section" class="section-container">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="card shadow-sm border-0 rounded-4 p-5">
                        <h3 class="fw-bold mb-2 text-primary" id="waiting-nickname-display">닉네임</h3>
                        <p class="text-muted mb-4">상대를 기다리고 있습니다...</p>
                        <div class="waiting-spinner"></div>
                        <p class="text-muted small">다른 학생이 입장하면 자동으로 게임이 시작됩니다.</p>
                        <div class="mt-3"><span class="badge bg-light text-dark fs-6" id="waiting-count">대기 중: 1명</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-section" class="section-container">
            <div class="row justify-content-center g-3">
                <div class="col-lg-8">
                    <div class="player-bars-row mb-2">
                        <div class="player-info-bar" id="player-bar-black">
                            <div><span class="stone-indicator black me-2"></span><span class="fw-bold"
                                    id="player-name-black">흑돌</span></div>
                        </div>
                        <div class="player-info-bar" id="player-bar-white">
                            <div><span class="stone-indicator white me-2"></span><span class="fw-bold"
                                    id="player-name-white">백돌</span></div>
                        </div>
                    </div>

                    <div class="progress mb-3 shadow-sm"
                        style="height: 8px; background-color: #e9ecef; border-radius: 4px; overflow: hidden;">
                        <div id="timer-progress-bar" class="progress-bar bg-primary" role="progressbar"
                            style="width: 100%; transition: width 0.1s linear, background-color 0.3s ease;"></div>
                    </div>

                    <div class="card shadow-sm border-0 rounded-4 p-3" id="game-input-area">
                        <div class="roulette-input-row">
                            <span class="text-muted">(</span>
                            <div class="roulette-wrapper" id="roulette-x">
                                <div class="roulette-inner"></div>
                            </div>
                            <span class="text-muted">,</span>
                            <div class="roulette-wrapper" id="roulette-y">
                                <div class="roulette-inner"></div>
                            </div>
                            <span class="text-muted">)</span>
                            <button id="btn-place-stone" class="btn btn-primary fw-bold px-4 py-2">두기</button>
                        </div>
                        <p class="text-muted small text-center mt-2 mb-0" id="game-status-text">좌우로 스크롤하여 좌표를 선택하고 돌을
                            놓으세요.</p>
                        <!-- [응급처치 4] 상대가 경기에 들어오지 않을 때의 수동 탈출구 (첫 수 전에만 노출) -->
                        <button id="btn-abandon-match" class="btn btn-outline-secondary fw-bold w-100 mt-2 d-none">
                            🔄 상대 응답 없음 — 경기 취소하고 다시 매칭하기
                        </button>
                    </div>

                    <div class="gomoku-board-wrapper mt-3">
                        <canvas id="gomoku-canvas" role="img" aria-label="좌표평면 오목판"></canvas>
                    </div>

                    <div class="card shadow-sm border-0 rounded-4 p-4 mt-3 text-center d-none" id="game-result-area">
                        <h2 class="fw-bold mb-2" id="game-result-title"></h2>
                        <p class="text-muted" id="game-result-desc"></p>
                        <button id="btn-back-to-waiting" class="btn btn-primary fw-bold px-4">대기실로 돌아가기</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { rtdbGridGomoku as db } from "../../../js/firebase-config.js";
        import {
            renderRoomEntrance, customAlert, customConfirm, escapeHtml, rememberEntrance
        } from "../../../js/room-auth.js";
        import {
            ref, set, get, update, remove, onValue, serverTimestamp,
            query, orderByChild, runTransaction, increment, onDisconnect
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        // =====================================================================
        // 설정 상수 (수업 상황에 맞게 여기만 고치면 됩니다)
        // =====================================================================
        const BOARD_N = 14;                 // 격자 칸 수 (좌표 -7 ~ 7)
        const HALF_N = 7;
        const WIN_COUNT = 5;                // 정확히 5목만 승리 (장목 불인정)
        const PADDING = 40;

        const ROULETTE_ITEM_W = 30;         // CSS .roulette-item width와 반드시 동일
        const TURN_LIMIT_SEC = 30;          // 한 수당 제한 시간
        const AFK_LIMIT_MS = 65000;         // 이 시간 이상 이탈 시 몰수패
        const OFFLINE_MS = 60000;           // 관리자 화면에서 '접속 끊김'으로 표시할 기준
        const HEARTBEAT_MS = 10000;         // 하트비트 주기
        const WAITER_STALE_MS = 25000;      // [통일] 대기자 생존 신호(alive) 신선도 — 하트비트의 2.5배
        // (기존 15초는 여유가 5초뿐이라 학교 와이파이 지연에 오탐이 잦았음)
        const MAX_CONSECUTIVE_PASS = 4;     // 연속 패스 이 횟수 도달 시 무승부 종료
        const REMATCH_WAIT_SEC = 20;        // 직전 상대와 재대결을 허용하기까지 대기 시간
        const MATCH_LOCK_MS = 3000;         // 매칭 잠금 유지 시간
        const STALL_LIMIT_MS = 60000;       // [응급처치 3] 상대 턴이 제한시간을 넘겨도 변화가 없을 때 추가로 기다릴 시간
        const ABANDON_BTN_MS = 40000;       // [응급처치 4] 첫 수가 나오기 전 취소 버튼을 노출하기까지의 시간
        const NICKNAME_RE = /^[가-힣a-zA-Z0-9_\- ]{1,10}$/;  // 입력창 maxlength=10과 동일하게 맞춤
        const ROOM_CODE_RE = /^[A-Z0-9]{4}$/;                // 방 코드도 Firebase 경로에 쓰이므로 검증

        // =====================================================================
        // 서버 시간 보정
        // =====================================================================
        let serverTimeOffset = 0;
        onValue(ref(db, '.info/serverTimeOffset'), (snap) => { serverTimeOffset = snap.val() || 0; });
        function getServerTime() { return Date.now() + serverTimeOffset; }

        // =====================================================================
        // 상태 변수
        // =====================================================================
        let CELL_SIZE = 32;
        let currentRoomCode = null;
        let currentNickname = null;
        let currentMatchId = null;
        let myColor = null;

        let localSessionId = null;
        let isKicked = false;
        let myAwayStartTime = 0;

        let unsubMe = null;
        let unsubMatch = null, unsubWaiting = null, unsubOpponent = null;
        let unsubMatchPtr = null;       // [응급처치 1] 매칭 성사 감지용 포인터 전용 구독
        // [통일] players 전체 구독(unsubAllPlayers)은 제거되었습니다.
        // 활성 판정은 waiting 노드 안의 alive/visible로, 직전 상대는 아래 로컬 변수 + waiting.last로 대체.
        let myLastOpponent = null;      // 입장 시 players/{me}/lastOpponent에서 복원, 매칭 시 갱신

        let opponentSynced = false;
        let opponentLastHeartbeatValue = null;
        let opponentHeartbeatLocalTime = 0;
        let opponentStatus = 'online';
        let opponentAwayStartTime = 0;
        let opponentMatchId = null;
        let gameSyncStartedAt = 0;

        let heartbeatInterval = null, waitingInterval = null;
        let localJoinedTime = 0;

        let matchData = null;
        let boardState = {};
        let winStones = [];

        let isJoining = false;          // 입장 처리 중복 실행 방지 (room-auth도 버튼을 잠급니다)
        let matchDisconnectArmed = false;
        let resultHandled = false;      // 결과 모달 중복 표시 방지
        let isSubmittingMove = false;   // 착수 연타 / 타임아웃 중복 패스 방지
        let stallHandled = false;       // [응급처치 3] 정체 판정 1회만 실행
        let abandonBtnTimer = null;     // [응급처치 4] 취소 버튼 노출 타이머

        const sectionLanding = document.getElementById('landing-section');
        const sectionAdmin = document.getElementById('admin-section');
        const sectionWaiting = document.getElementById('waiting-section');
        const sectionGame = document.getElementById('game-section');
        const navRoomInfo = document.getElementById('nav-room-info');

        function showSection(section) {
            [sectionLanding, sectionAdmin, sectionWaiting, sectionGame].forEach(s => s.classList.remove('active-section'));
            section.classList.add('active-section');
        }

        // escapeHtml은 room-auth.js에서 공용으로 가져옵니다.

        function roomRef(roomCode) { return ref(db, `gomoku_rooms/${roomCode}`); }
        function playerRef(roomCode, nickname) { return ref(db, `gomoku_rooms/${roomCode}/players/${nickname}`); }
        function matchRef(roomCode, matchId) { return ref(db, `gomoku_rooms/${roomCode}/matches/${matchId}`); }
        function waitingRef(roomCode, nickname) { return ref(db, `gomoku_rooms/${roomCode}/waiting/${nickname}`); }
        function playersCollRef(roomCode) { return ref(db, `gomoku_rooms/${roomCode}/players`); }
        function waitingCollRef(roomCode) { return ref(db, `gomoku_rooms/${roomCode}/waiting`); }
        function matchLockRef(roomCode) { return ref(db, `gomoku_rooms/${roomCode}/matchLock`); }
        function roomIndexRef() { return ref(db, 'gomoku_room_index'); }

        // =====================================================================
        // 공용: 경기 종료 / 전적 정산
        // =====================================================================

        // 진행 중인 경기만 원자적으로 종료. 먼저 성공한 클라이언트 1개만 committed=true.
        async function finishMatchAtomic(roomCode, matchId, winnerId, reason) {
            if (!roomCode || !matchId) return false;
            try {
                const res = await runTransaction(matchRef(roomCode, matchId), (cur) => {
                    if (!cur || cur.status !== 'playing') return; // 중단
                    cur.status = 'finished';
                    cur.winner = winnerId || null;
                    cur.endReason = reason;
                    return cur;
                });
                return res.committed;
            } catch (e) { return false; }
        }

        // 종료된 경기의 승패를 정확히 1회만 반영. 누가 호출해도 안전.
        async function settleMatch(roomCode, matchId, data) {
            if (!data || data.status !== 'finished' || data.statsApplied) return;
            let committed = false;
            try {
                const res = await runTransaction(
                    ref(db, `gomoku_rooms/${roomCode}/matches/${matchId}/statsApplied`),
                    (cur) => (cur === true ? undefined : true)
                );
                committed = res.committed;
            } catch (e) { return; }
            if (!committed) return;

            const { player1, player2, winner } = data;
            const winnerValid = winner && (winner === player1 || winner === player2);

            // 강퇴 등으로 이미 삭제된 학생 노드를 되살리지 않도록 처리
            async function applyTo(nickname, field) {
                if (!nickname) return;
                const pRef = playerRef(roomCode, nickname);
                try {
                    // 트랜잭션은 캐시가 없으면 null로 중단되므로 서버 값을 직접 확인합니다
                    const snap = await get(pRef);
                    if (!snap.exists()) return;   // 강퇴 등으로 이미 삭제된 학생

                    const patch = { currentOpponent: null };
                    if (field) patch[field] = increment(1);   // 서버 원자 연산 (캐시 불필요)
                    await update(pRef, patch);
                } catch (e) { }
            }
            await applyTo(player1, winnerValid ? (player1 === winner ? 'wins' : 'losses') : null);
            await applyTo(player2, winnerValid ? (player2 === winner ? 'wins' : 'losses') : null);
            // currentMatchId는 각자 대기실 복귀 시 정리합니다.
        }

        // =====================================================================
        // 대기실 → 게임 화면 전환 공통 처리
        // (포인터 전용 구독 / 매칭 루프 / 재접속 복구 세 경로가 모두 사용)
        // =====================================================================
        function enterGame(mid, m) {
            if (currentMatchId) return;   // 다른 경로가 먼저 진입한 경우 중복 방지
            cleanupWaiting();
            currentMatchId = mid;
            myColor = m.player1 === currentNickname ? 'black' : 'white';
            myLastOpponent = m.player1 === currentNickname ? m.player2 : m.player1;   // [통일] 직전 상대 갱신
            matchData = m;
            navRoomInfo.innerHTML = `방: <b>${escapeHtml(currentRoomCode)}</b> | <b>${escapeHtml(currentNickname)}</b>`;
            showSection(sectionGame);
            startGameSync();
        }

        // =====================================================================
        // 랜딩 페이지 로직
        // =====================================================================
        renderRoomEntrance('room-entrance-container', {
            joinBtnText: "방 입장하기",
            // [추가] 게임방법 슬라이드: 방 입장하기와 대시보드 열기 사이에 버튼 자동 생성
            guideBtnText: "📖 게임방법 보기",
            guideTitle: "📐 좌표평면 오목 — 게임 방법",
            guideSlides: [
                {
                    src: "../../../assets/images/gridgomoku/매칭 상대 탐색 중.gif",
                    alt: "매칭 상대 탐색 화면",
                    title: "1. 매칭 상대 탐색",
                    desc: "방 코드와 닉네임으로 입장하면 대기실에서 자동으로 상대를 찾습니다. 화면을 켠 채로 기다리면 매칭이 이루어집니다."
                },
                {
                    src: "../../../assets/images/gridgomoku/게임방법.gif",
                    alt: "게임 방법 화면",
                    title: "2. 게임 방법",
                    desc: "룰렛을 좌우로 돌려 (x, y) 좌표를 고른 뒤 [두기] 버튼으로 돌을 놓습니다. 한 수당 제한 시간은 30초입니다."
                },
                {
                    src: "../../../assets/images/gridgomoku/승리조건.jpg",
                    alt: "승리 조건 설명",
                    title: "3. 승리 조건",
                    desc: "가로·세로·대각선으로 정확히 5개의 돌을 연속으로 이으면 승리합니다. (6개 이상 장목은 승리로 인정되지 않아요!)"
                }
            ],
            // room-auth.js가 onJoin을 await하고 버튼도 잠급니다. 여기서는 로직 중복 실행만 막습니다.
            onJoin: async (code, nickname) => {
                if (isJoining) return;
                isJoining = true;

                try {
                    code = (code || '').trim().toUpperCase();
                    nickname = (nickname || '').trim();

                    if (!ROOM_CODE_RE.test(code)) {
                        return await customAlert("방 코드 확인", "방 코드는 영문 대문자와 숫자 4자리입니다.");
                    }
                    if (!NICKNAME_RE.test(nickname)) {
                        return await customAlert("닉네임 확인",
                            "닉네임은 한글·영문·숫자·밑줄·하이픈만 사용해 1~10자로 입력해주세요.");
                    }

                    const snap = await get(roomRef(code));
                    if (!snap.exists()) return await customAlert("알림", "존재하지 않는 방 코드입니다.");

                    localSessionId = Date.now().toString() + Math.random().toString(36).substring(2, 6);
                    isKicked = false;
                    let wasOfflineTooLong = false;

                    const pSnap = await get(playerRef(code, nickname));
                    if (pSnap.exists()) {
                        const pData = pSnap.val();
                        const lastBeat = typeof pData.lastHeartbeat === 'number' ? pData.lastHeartbeat : 0;
                        const diff = getServerTime() - lastBeat;

                        // [모서리 1 수정] 하드 차단 대신 확인 후 이어받기.
                        // 와이파이가 끊긴 학생이 곧바로 재접속하면 서버가 아직 끊김을 감지하기 전이라
                        // 자기 자신의 유령 세션이 'online'으로 남아 있어 스스로에게 막히는 문제가 있었습니다.
                        // 진짜 다른 기기가 살아 있는 경우라도, 아래에서 새 sessionId를 기록하는 순간
                        // 옛 기기가 subscribeSession에서 불일치를 감지하고 스스로 물러나므로 안전합니다.
                        if (diff <= OFFLINE_MS && pData.status === 'online') {
                            const ok = await customConfirm("이어서 접속할까요?",
                                `<b>${escapeHtml(nickname)}</b> 이름으로 접속 중인 기기가 있습니다.<br><br>` +
                                `내가 쓰던 이름이 맞다면 <b>[확인]</b>을 눌러 이어서 접속하세요.<br>` +
                                `<span class="text-muted small">(기존 기기의 연결은 끊어지고, 전적은 그대로 이어집니다)</span><br><br>` +
                                `<b class="text-danger">다른 친구가 쓰는 이름이라면</b> [취소]를 누르고<br>다른 닉네임을 사용해주세요.`);
                            if (!ok) return;
                        }
                        if (diff > AFK_LIMIT_MS) wasOfflineTooLong = true;

                        myLastOpponent = pData.lastOpponent || null;   // [통일] 직전 상대 기억을 DB에서 복원

                        await update(playerRef(code, nickname), {
                            status: 'online', lastHeartbeat: serverTimestamp(), sessionId: localSessionId
                        });
                    } else {
                        myLastOpponent = null;
                        await set(playerRef(code, nickname), {
                            nickname, wins: 0, losses: 0, status: 'online',
                            lastHeartbeat: serverTimestamp(), joinedAt: serverTimestamp(), sessionId: localSessionId
                        });
                    }

                    currentRoomCode = code; currentNickname = nickname;

                    // [추가] 입장에 성공한 방 코드·닉네임을 기기에 저장 → 다음 접속 때 자동 입력
                    rememberEntrance(code, nickname);

                    // 브라우저를 강제 종료해도 서버가 즉시 offline 처리
                    try {
                        await onDisconnect(playerRef(code, nickname)).update({ status: 'offline' });
                    } catch (e) { }

                    subscribeSession();
                    startHeartbeat();

                    const existing = await resolveMyMatch();
                    if (existing && wasOfflineTooLong) {
                        const isP1 = existing.data.player1 === nickname;
                        const winnerId = isP1 ? existing.data.player2 : existing.data.player1;
                        await finishMatchAtomic(code, existing.id, winnerId, 'offline');
                        const fresh = await get(matchRef(code, existing.id));
                        if (fresh.exists()) await settleMatch(code, existing.id, fresh.val());
                        await update(playerRef(code, nickname), { currentMatchId: null, currentOpponent: null });
                        await customAlert("몰수패", "접속이 1분 이상 끊겨 기존 게임에서 몰수패 처리되었습니다.");
                        enterWaitingRoom();
                        return;
                    }

                    if (existing) {
                        enterGame(existing.id, existing.data);
                    } else {
                        enterWaitingRoom();
                    }
                } catch (e) {
                    await customAlert("연결 확인", "입장하지 못했습니다.<br>네트워크 상태를 확인한 뒤 다시 시도해주세요.");
                } finally {
                    isJoining = false;
                }
            },
            onAdminSuccess: () => {
                showSection(sectionAdmin);
                loadAdminRooms();
            }
        });

        // 세션 내내 유지되는 구독 (대기실 복귀 시에도 해제하지 않음)
        function subscribeSession() {
            // 방 노드를 통째로 구독하면 다른 모든 학생의 하트비트와 모든 대국의 착수가
            // 매번 전원에게 내려와 트래픽이 급증하므로, 내 정보만 구독합니다.
            if (unsubMe) { unsubMe(); unsubMe = null; }
            unsubMe = onValue(playerRef(currentRoomCode, currentNickname), (playerSnap) => {
                if (!currentRoomCode) return;
                if (!playerSnap.exists()) {
                    isKicked = true; cleanupAll();
                    customAlert("알림", "방에서 강퇴되었습니다.").then(() => window.location.reload());
                    return;
                }
                const data = playerSnap.val();
                if (data.sessionId && data.sessionId !== localSessionId) {
                    isKicked = true; cleanupAll();
                    customAlert("중복 접속", "다른 기기에서 접속하여 연결이 끊어졌습니다.").then(() => window.location.reload());
                }
            });
        }

        // =====================================================================
        // 하트비트 및 접속 유지 로직
        // =====================================================================
        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            updateHeartbeat();
            heartbeatInterval = setInterval(updateHeartbeat, HEARTBEAT_MS);
            document.removeEventListener('visibilitychange', handleVisibility);
            document.addEventListener('visibilitychange', handleVisibility);
        }

        // 트랜잭션으로 처리하여 강퇴된 학생이 유령 데이터로 되살아나는 것을 차단
        async function updateHeartbeat() {
            if (!currentRoomCode || !currentNickname || isKicked) return;
            try {
                await runTransaction(playerRef(currentRoomCode, currentNickname), (cur) => {
                    if (cur === null) return; // 이미 삭제(강퇴)된 경우 되살리지 않음
                    cur.lastHeartbeat = getServerTime();
                    cur.status = document.hidden ? 'away' : 'online';
                    return cur;
                });
            } catch (e) { }

            // [통일] 대기실이면 대기열 생존 신호도 함께 갱신.
            // → 탭이 켜진 채 조용히 끊긴 유령 대기자가 25초 뒤 자동으로 매칭 후보에서 빠지고,
            //   players 전체 구독 없이 waiting 노드만으로 활성 판정이 가능해집니다.
            if (sectionWaiting.classList.contains('active-section')) {
                update(waitingRef(currentRoomCode, currentNickname), { alive: serverTimestamp() }).catch(() => { });
            }
        }

        function handleVisibility() {
            if (!currentRoomCode || !currentNickname || isKicked) return;
            const isHidden = document.hidden;

            // [통일] 대기실이면 매칭 대상 여부를 즉시 갱신
            // (하트비트는 최대 10초 늦지만 visibilitychange는 즉각 반영됨)
            if (sectionWaiting.classList.contains('active-section')) {
                update(waitingRef(currentRoomCode, currentNickname), {
                    visible: !isHidden, alive: serverTimestamp()
                }).catch(() => { });
            }

            if (isHidden) {
                myAwayStartTime = getServerTime();
            } else {
                if (myAwayStartTime > 0 && (getServerTime() - myAwayStartTime) > AFK_LIMIT_MS) {
                    if (currentMatchId && matchData && matchData.status === 'playing') triggerSelfForfeit();
                }
                myAwayStartTime = 0;
            }
            updateHeartbeat();
        }

        async function triggerSelfForfeit() {
            if (!matchData || matchData.status !== 'playing') return;
            const isP1 = matchData.player1 === currentNickname;
            const winnerId = isP1 ? matchData.player2 : matchData.player1;
            await finishMatchAtomic(currentRoomCode, currentMatchId, winnerId, 'offline');
        }

        async function triggerOpponentForfeit() {
            if (!matchData || matchData.status !== 'playing') return;
            await finishMatchAtomic(currentRoomCode, currentMatchId, currentNickname, 'offline');
        }

        // =====================================================================
        // 관리자 대시보드
        // =====================================================================
        async function loadAdminRooms() {
            const select = document.getElementById('admin-room-select');
            if (!select) return;

            let rooms = {};
            const idxSnap = await get(roomIndexRef());
            if (idxSnap.exists()) {
                rooms = idxSnap.val();
            } else {
                // 인덱스가 없던 기존 데이터용 1회 마이그레이션
                const full = await get(ref(db, 'gomoku_rooms'));
                if (full.exists()) {
                    const val = full.val();
                    const migrate = {};
                    Object.keys(val).forEach(id => {
                        rooms[id] = { createdAt: val[id].createdAt || 0 };
                        migrate[id] = { createdAt: val[id].createdAt || 0 };
                    });
                    try { await update(roomIndexRef(), migrate); } catch (e) { }
                }
            }

            select.innerHTML = '<option value="">방을 선택하세요</option>';
            let count = 0;
            Object.keys(rooms)
                .filter(roomId => {
                    if (window.isAdmin) return true;
                    const r = rooms[roomId];
                    return (r && (r.createdBy === window.currentTeacherUid || r.creatorEmail === window.currentTeacherEmail));
                })
                .sort((a, b) => (rooms[b].createdAt || 0) - (rooms[a].createdAt || 0))
                .forEach(roomId => {
                    count++;
                    const option = document.createElement('option');
                    option.value = roomId; option.textContent = roomId;
                    select.appendChild(option);
                });
            if (count === 0 && !window.isAdmin) {
                select.innerHTML = '<option value="">생성한 방이 없습니다 (새 방을 만드세요)</option>';
            }
        }
        window.addEventListener('teacherAuthChanged', () => loadAdminRooms());

        // 헷갈리는 문자(0/O, 1/I)를 제외해 저학년 입력 실수를 줄입니다.
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        document.getElementById('btn-create-room')?.addEventListener('click', async () => {
            const btn = document.getElementById('btn-create-room');
            btn.disabled = true;
            try {
                let roomCode = null;
                for (let attempt = 0; attempt < 20; attempt++) {
                    const candidate = generateRoomCode();
                    if (!(await get(roomRef(candidate))).exists()) { roomCode = candidate; break; }
                }
                if (!roomCode) return await customAlert('오류', '방 코드를 만들지 못했습니다. 잠시 후 다시 시도해주세요.');

                const roomMeta = {
                    createdAt: serverTimestamp(),
                    createdBy: window.currentTeacherUid || '',
                    creatorEmail: window.currentTeacherEmail || '',
                    creatorName: window.currentTeacherName || ''
                };
                await set(roomRef(roomCode), roomMeta);
                await set(ref(db, `gomoku_room_index/${roomCode}`), roomMeta);
                await loadAdminRooms();
                const sel = document.getElementById('admin-room-select');
                if (sel) sel.value = roomCode;
                startAdminMonitoring(roomCode);
                await customAlert('생성 완료', `방 코드: [ <b class="text-primary fs-3">${roomCode}</b> ]`);
            } catch (error) {
                await customAlert('오류', '방을 만들지 못했습니다. 잠시 후 다시 시도해주세요.');
            } finally { btn.disabled = false; }
        });

        document.getElementById('admin-room-select')?.addEventListener('change', (e) => {
            const code = e.target.value;
            if (!code) {
                document.getElementById('admin-record-tbody').innerHTML = '<tr><td colspan="7" class="py-4 text-muted">방을 선택해주세요.</td></tr>';
                document.getElementById('admin-player-count').textContent = '0명 접속';
                cleanupAdmin();
                return;
            }
            startAdminMonitoring(code);
        });

        document.getElementById('btn-delete-room')?.addEventListener('click', async () => {
            const code = document.getElementById('admin-room-select')?.value;
            if (!code) return await customAlert("알림", "삭제할 방을 선택하세요.");

            const rSnap = await get(ref(db, `gomoku_room_index/${code}`));
            const rData = rSnap.exists() ? rSnap.val() : {};
            if (!window.isAdmin && rData.createdBy && rData.createdBy !== window.currentTeacherUid) {
                return await customAlert("권한 없음", "직접 생성한 방만 삭제할 수 있습니다.");
            }

            const confirmed = await customConfirm("방 삭제",
                `방 <b>${escapeHtml(code)}</b> 의 학생 기록과 대국이 <b>모두 삭제</b>됩니다.<br>되돌릴 수 없습니다. 계속할까요?`);
            if (!confirmed) return;

            const delBtn = document.getElementById('btn-delete-room');
            if (delBtn) delBtn.disabled = true;   // 삭제 중 더블 클릭 방지
            try {
                await remove(roomRef(code));
                await remove(ref(db, `gomoku_room_index/${code}`));
                cleanupAdmin();
                document.getElementById('admin-record-tbody').innerHTML = '<tr><td colspan="7" class="py-4 text-muted">방을 선택해주세요.</td></tr>';
                document.getElementById('admin-player-count').textContent = '0명 접속';
                await loadAdminRooms();
                await customAlert("완료", "방이 삭제되었습니다.");
            } catch (e) {
                await customAlert("오류", "방을 삭제하지 못했습니다.");
            } finally {
                if (delBtn) delBtn.disabled = false;
            }
        });

        let unsubAdminPlayers = null, adminRenderInterval = null;
        let adminPlayersData = {};
        let adminRenderPending = false, adminLastRender = 0;

        function startAdminMonitoring(roomCode) {
            cleanupAdmin();
            adminPlayersData = {};
            currentRoomCode = roomCode;
            const sel = document.getElementById('admin-room-select');
            if (sel) sel.value = roomCode;

            // matches 컬렉션은 구독하지 않습니다.
            // 대전 현황은 players/{id}/currentOpponent 값으로 표시합니다.
            unsubAdminPlayers = onValue(playersCollRef(roomCode), (snapshot) => {
                adminPlayersData = snapshot.exists() ? snapshot.val() : {};
                scheduleAdminRender();
            });

            // 조용히 끊긴 학생의 상태를 주기적으로 갱신
            adminRenderInterval = setInterval(renderAdminBoard, 5000);
        }

        // 하트비트마다 표 전체를 다시 그리지 않도록 1초 단위로 묶어서 렌더링
        function scheduleAdminRender() {
            const now = Date.now();
            if (now - adminLastRender > 1000) { adminLastRender = now; renderAdminBoard(); return; }
            if (adminRenderPending) return;
            adminRenderPending = true;
            setTimeout(() => { adminRenderPending = false; adminLastRender = Date.now(); renderAdminBoard(); }, 1000);
        }

        // [변경] 상태 판정을 한 곳으로 모음: 접속중(녹색) / 다른화면(노랑) / 접속 끊김(빨강)
        // order 값은 정렬 우선순위 (접속중 → 다른화면 → 접속 끊김)
        function statusInfo(p) {
            const diff = getServerTime() - (p.lastHeartbeat || 0);
            if (diff > OFFLINE_MS || p.status === 'offline') {
                return { l: '접속 끊김', c: 'offline', t: 'text-danger', order: 2 };
            }
            if (p.status === 'away') {
                return { l: '다른화면', c: 'away', t: 'text-warning', order: 1 };
            }
            return { l: '접속중', c: 'online', t: 'text-success', order: 0 };
        }

        function renderAdminBoard() {
            const recordTbody = document.getElementById('admin-record-tbody');
            const countEl = document.getElementById('admin-player-count');
            if (!recordTbody || !countEl) return;

            const playersList = Object.entries(adminPlayersData);
            const onlineCount = playersList.filter(([, p]) => statusInfo(p).order === 0).length;
            countEl.textContent = `${onlineCount}명 접속`;

            if (playersList.length === 0) {
                recordTbody.innerHTML = '<tr><td colspan="7" class="py-4 text-muted">아직 참여한 학생이 없습니다.</td></tr>';
                return;
            }

            // [변경] 1순위: 접속 상태(접속중 → 다른화면 → 접속 끊김), 2순위: 승수, 3순위: 승률
            const sorted = [...playersList].sort((a, b) => {
                const sa = statusInfo(a[1]).order, sb = statusInfo(b[1]).order;
                if (sa !== sb) return sa - sb;
                const aW = a[1].wins || 0, bW = b[1].wins || 0;
                const aT = aW + (a[1].losses || 0), bT = bW + (b[1].losses || 0);
                const aR = aT > 0 ? aW / aT : 0, bR = bT > 0 ? bW / bT : 0;
                return bW !== aW ? bW - aW : bR - aR;
            });

            let html = '';
            sorted.forEach(([id, p]) => {
                const st = statusInfo(p);

                const total = (p.wins || 0) + (p.losses || 0);
                const rate = total > 0 ? Math.round((p.wins || 0) / total * 100) : 0;
                const rateLabel = total > 0 ? `${rate}%` : '기록 없음';

                const matchInfo = p.currentOpponent
                    ? `<span class="text-primary fw-bold">vs ${escapeHtml(p.currentOpponent)}</span>`
                    : '<span class="text-muted">대기 중</span>';

                html += `<tr>
                    <td class="fw-bold">${escapeHtml(p.nickname || id)}</td>
                    <td><div class="d-flex align-items-center gap-1 justify-content-center"><span class="status-dot ${st.c}"></span><small class="${st.t} fw-bold">${st.l}</small></div></td>
                    <td>${matchInfo}</td>
                    <td class="text-success fw-bold">${p.wins || 0}</td>
                    <td class="text-danger fw-bold">${p.losses || 0}</td>
                    <td><div class="d-flex align-items-center gap-2 justify-content-center"><div class="win-rate-bar flex-grow-1" style="max-width:80px; min-width:40px"><div class="fill" style="width:${rate}%"></div></div><b class="${total > 0 ? '' : 'text-muted fw-normal small'}">${rateLabel}</b></div></td>
                    <td>${st.c !== 'online' ? `<button class="btn btn-outline-danger btn-sm btn-kick" data-id="${escapeHtml(id)}">강퇴</button>` : '-'}</td>
                </tr>`;
            });
            recordTbody.innerHTML = html;

            recordTbody.querySelectorAll('.btn-kick').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const pId = btn.dataset.id;
                    if (!await customConfirm("강퇴", `${escapeHtml(pId)} 학생을 강퇴할까요?`)) return;
                    const mid = adminPlayersData[pId]?.currentMatchId;
                    if (mid) {
                        const mSnap = await get(matchRef(currentRoomCode, mid));
                        if (mSnap.exists() && mSnap.val().status === 'playing') {
                            const m = mSnap.val();
                            const winner = m.player1 === pId ? m.player2 : m.player1;
                            await finishMatchAtomic(currentRoomCode, mid, winner, 'kick');
                            const fresh = await get(matchRef(currentRoomCode, mid));
                            if (fresh.exists()) await settleMatch(currentRoomCode, mid, fresh.val());
                        }
                    }
                    try { await remove(waitingRef(currentRoomCode, pId)); } catch (e) { }
                    await remove(playerRef(currentRoomCode, pId));
                });
            });
        }

        // =====================================================================
        // 대기실 및 매칭
        // =====================================================================
        let currentWaitingList = [];
        let isMatching = false;

        // 전체 matches 스캔 대신 players/{me}/currentMatchId 포인터를 사용
        async function resolveMyMatch() {
            if (!currentRoomCode || !currentNickname) return null;

            // [응급처치 2] 로컬 캐시(playersData)를 신뢰하지 않고 항상 서버에서 포인터를 직접 읽습니다.
            // 캐시가 낡아 있으면 매칭 성사를 영영 모르는 사고가 있었습니다. (값 하나 읽기라 비용은 미미)
            let mid = null;
            try {
                const pSnap = await get(ref(db, `gomoku_rooms/${currentRoomCode}/players/${currentNickname}/currentMatchId`));
                mid = pSnap.val();
            } catch (e) { return null; }
            if (!mid) return null;

            const mSnap = await get(matchRef(currentRoomCode, mid));
            if (!mSnap.exists()) {
                await update(playerRef(currentRoomCode, currentNickname), { currentMatchId: null, currentOpponent: null });
                return null;
            }
            const data = mSnap.val();
            if (data.status !== 'playing') {
                await settleMatch(currentRoomCode, mid, data);
                await update(playerRef(currentRoomCode, currentNickname), { currentMatchId: null, currentOpponent: null });
                return null;
            }
            return { id: mid, data };
        }

        async function enterWaitingRoom() {
            navRoomInfo.innerHTML = `방: <b>${escapeHtml(currentRoomCode)}</b> | <b>${escapeHtml(currentNickname)}</b>`;
            document.getElementById('waiting-nickname-display').textContent = currentNickname;

            showSection(sectionWaiting);
            localJoinedTime = getServerTime();
            isMatching = false;

            if (waitingInterval) clearInterval(waitingInterval);
            waitingInterval = setInterval(attemptSmartMatch, 1000);

            // [통일] 대기열 항목: joinedAt(순서, 고정) + alive(생존 신호, 하트비트마다 갱신)
            //        + visible(즉시 반영) + last(직전 상대 — 양방향 회피 판단용)
            await set(waitingRef(currentRoomCode, currentNickname), {
                nickname: currentNickname,
                joinedAt: serverTimestamp(),
                alive: serverTimestamp(),
                visible: !document.hidden,
                last: myLastOpponent || null
            });
            try { await onDisconnect(waitingRef(currentRoomCode, currentNickname)).remove(); } catch (e) { }

            // [응급처치 1] 매칭 성사를 절대 놓치지 않도록 내 포인터 한 칸만 전용 구독합니다.
            // isMatching 플래그·로컬 캐시와 무관하게 서버가 값을 밀어주므로,
            // "A는 게임중인데 B는 대기실" 사고의 세 가지 원인을 모두 우회합니다.
            if (unsubMatchPtr) { unsubMatchPtr(); unsubMatchPtr = null; }
            unsubMatchPtr = onValue(ref(db, `gomoku_rooms/${currentRoomCode}/players/${currentNickname}/currentMatchId`), async (snap) => {
                const mid = snap.val();
                if (!mid || mid === currentMatchId || isKicked) return;
                try {
                    const mSnap = await get(matchRef(currentRoomCode, mid));
                    if (!mSnap.exists()) return;
                    const m = mSnap.val();
                    if (m.status !== 'playing') return;                     // 끝난 경기로 되돌아가지 않음
                    if (m.player1 !== currentNickname && m.player2 !== currentNickname) return;  // 내 경기인지 검증
                    enterGame(mid, m);
                } catch (e) { }
            });

            // [통일] players 전체 구독은 제거되었습니다.
            // 기존에는 isActiveWaiter가 모든 학생의 하트비트를 참조해야 해서 대기실의 전원이
            // 초당 수 건의 남의 하트비트 델타를 계속 내려받았습니다 (30명 교실 최대 트래픽 원인).
            // 이제 활성 판정에 필요한 정보(alive/visible/last)가 waiting 노드 안에 있으므로
            // 아래 waiting 구독 하나로 충분하며, 매칭될수록 트래픽이 0을 향해 줄어듭니다.

            if (unsubWaiting) { unsubWaiting(); unsubWaiting = null; }
            unsubWaiting = onValue(query(waitingCollRef(currentRoomCode), orderByChild('joinedAt')), (snapshot) => {
                currentWaitingList = [];
                if (snapshot.exists()) snapshot.forEach(childSnap => { currentWaitingList.push({ id: childSnap.key, ...childSnap.val() }); });
                attemptSmartMatch();
            });
        }

        // [통일] 활성 대기자 판정 — waiting 항목만으로 판단 (players 참조 없음)
        // 화면을 실제로 보고 있고(visible), 생존 신호가 25초 이내로 신선한 사람만 매칭 후보.
        // alive가 없는 옛 형식 항목은 joinedAt으로 폴백되어 25초 뒤 자연스럽게 후보에서 빠집니다.
        function isActiveWaiter(w) {
            if (!w) return false;
            if (w.visible !== true) return false;
            const aliveTs = typeof w.alive === 'number' ? w.alive
                : (typeof w.joinedAt === 'number' ? w.joinedAt : 0);
            return (getServerTime() - aliveTs) < WAITER_STALE_MS;
        }

        async function attemptSmartMatch() {
            if (currentMatchId || isMatching || isKicked) return;
            isMatching = true;
            try {
                // [응급처치 2] 캐시 조건 없이 매 시도마다 서버에서 포인터를 확인
                // (응급처치 1의 전용 구독이 주 방어선, 이 확인은 이중 안전망)
                const myMatch = await resolveMyMatch();
                if (myMatch) {
                    enterGame(myMatch.id, myMatch.data);
                    return;
                }
                if (currentMatchId) return;   // 위 await 사이에 포인터 구독이 먼저 진입한 경우
                if (currentWaitingList.length === 0) return;

                const waitTimeSec = Math.floor((getServerTime() - localJoinedTime) / 1000);
                const waitingCountEl = document.getElementById('waiting-count');
                const activeWaitingCount = currentWaitingList.filter(p => isActiveWaiter(p)).length;

                if (activeWaitingCount >= 2) {
                    waitingCountEl.className = waitTimeSec < 10 ? "badge bg-warning text-dark fs-6" : "badge bg-info text-dark fs-6";
                    waitingCountEl.textContent = waitTimeSec < 10 ? `새로운 상대를 찾는 중... (대기: ${activeWaitingCount}명)` : `매칭 진행 중!`;
                } else {
                    waitingCountEl.className = "badge bg-light text-dark fs-6";
                    waitingCountEl.textContent = `대기 중: 1명`;
                }

                // 명단 첫 번째 활성 대기자만 매칭을 진행 (리더 선출)
                // [통일] 판정에 필요한 정보가 전부 waiting 스냅샷 하나 안에 있으므로,
                // 서로 다른 시점의 두 스냅샷(waiting/players)을 조인하던 어긋남이 사라집니다.
                const activeInitiator = currentWaitingList.find(p => isActiveWaiter(p));
                if (!activeInitiator) return;
                if (activeInitiator.id !== currentNickname) return;

                let matchPartner = null, oldOpponent = null;

                for (const candidate of currentWaitingList) {
                    if (candidate.id === currentNickname) continue;
                    if (!isActiveWaiter(candidate)) continue;
                    // [통일] 후보의 직전 상대는 waiting 항목의 last로 판정 (players 참조 없음)
                    if (candidate.id !== myLastOpponent && currentNickname !== (candidate.last || null)) {
                        matchPartner = candidate; break;
                    } else if (!oldOpponent) oldOpponent = candidate;
                }

                if (!matchPartner && oldOpponent && waitTimeSec >= REMATCH_WAIT_SEC) {
                    matchPartner = oldOpponent;
                }
                if (!matchPartner) return;

                // 기기 시계 오차로 두 명이 동시에 '내가 첫 번째'라고 판단하는 경합을 막는 잠금
                let lockHeld = false;
                try {
                    const lock = await runTransaction(matchLockRef(currentRoomCode), (cur) => {
                        const now = getServerTime();
                        if (cur && cur.until && cur.until > now) return; // 다른 사람이 매칭 중
                        return { by: currentNickname, until: now + MATCH_LOCK_MS };
                    });
                    if (!lock.committed) return;
                    lockHeld = true;

                    // 잠금을 얻는 사이 상대가 빠졌을 수 있으므로 재확인
                    const freshWait = await get(waitingCollRef(currentRoomCode));
                    const w = freshWait.exists() ? freshWait.val() : {};
                    if (!w[currentNickname]) return;
                    if (!w[matchPartner.id]) return;

                    const matchId = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                    const updates = {};
                    updates[`matches/${matchId}`] = {
                        player1: activeInitiator.id, player2: matchPartner.id, moves: [],
                        status: 'playing', currentTurn: 'black',
                        createdAt: serverTimestamp(), lastMoveTime: serverTimestamp()
                    };
                    updates[`players/${activeInitiator.id}/lastOpponent`] = matchPartner.id;
                    updates[`players/${activeInitiator.id}/currentMatchId`] = matchId;
                    updates[`players/${activeInitiator.id}/currentOpponent`] = matchPartner.id;
                    updates[`waiting/${activeInitiator.id}`] = null;
                    updates[`players/${matchPartner.id}/lastOpponent`] = activeInitiator.id;
                    updates[`players/${matchPartner.id}/currentMatchId`] = matchId;
                    updates[`players/${matchPartner.id}/currentOpponent`] = activeInitiator.id;
                    updates[`waiting/${matchPartner.id}`] = null;
                    updates['matchLock'] = null; // 매칭 성공과 동시에 잠금 해제

                    await update(roomRef(currentRoomCode), updates);
                    myLastOpponent = matchPartner.id;   // [통일] 성사 즉시 로컬 기억 갱신
                    lockHeld = false;
                } catch (err) {
                } finally {
                    if (lockHeld) { try { await set(matchLockRef(currentRoomCode), null); } catch (e) { } }
                }
            } finally { isMatching = false; }
        }

        // =====================================================================
        // 오목판 그리기 및 룰렛
        // =====================================================================
        const canvas = document.getElementById('gomoku-canvas');
        const ctx = canvas.getContext('2d');
        let rouletteInitialized = false;

        function initRoulette() {
            const rxInner = document.querySelector('#roulette-x .roulette-inner');
            const ryInner = document.querySelector('#roulette-y .roulette-inner');
            if (!rxInner || !ryInner) return;
            if (rxInner.querySelector('.coord-item')) return;

            const pad = `<div class="roulette-item padding-item" style="width:${ROULETTE_ITEM_W}px;"></div>`;
            let html = pad;
            for (let i = -HALF_N; i <= HALF_N; i++) html += `<div class="roulette-item coord-item" data-val="${i}">${i}</div>`;
            html += pad;
            rxInner.innerHTML = html; ryInner.innerHTML = html;

            const rxW = document.getElementById('roulette-x'), ryW = document.getElementById('roulette-y');
            if (!rouletteInitialized) {
                setupRouletteScroll(rxW); setupRouletteScroll(ryW);
                rouletteInitialized = true;
                setTimeout(() => { setRouletteValue(rxW, 0); setRouletteValue(ryW, 0); }, 100);
            }
        }

        function setupRouletteScroll(wrapper) {
            let isDragging = false, startX = 0, startScroll = 0;
            wrapper.addEventListener('scroll', () => {
                const items = wrapper.querySelectorAll('.coord-item');
                const selIdx = Math.round(wrapper.scrollLeft / ROULETTE_ITEM_W);
                items.forEach((item, index) => item.classList.toggle('selected', index === selIdx));
            });
            wrapper.addEventListener('pointerdown', (e) => {
                if (e.pointerType !== 'mouse') return;
                isDragging = true; startX = e.clientX; startScroll = wrapper.scrollLeft;
                wrapper.classList.add('dragging');
                wrapper.style.scrollSnapType = 'none'; wrapper.style.scrollBehavior = 'auto';
                wrapper.setPointerCapture(e.pointerId);
            });
            wrapper.addEventListener('pointermove', (e) => { if (isDragging) wrapper.scrollLeft = startScroll - (e.clientX - startX); });
            const stop = (e) => {
                if (!isDragging) return;
                isDragging = false; wrapper.classList.remove('dragging');
                wrapper.style.scrollSnapType = 'x mandatory'; wrapper.style.scrollBehavior = 'smooth';
                if (wrapper.hasPointerCapture(e.pointerId)) wrapper.releasePointerCapture(e.pointerId);
                wrapper.scrollTo({ left: Math.round(wrapper.scrollLeft / ROULETTE_ITEM_W) * ROULETTE_ITEM_W, behavior: 'smooth' });
            };
            wrapper.addEventListener('pointerup', stop);
            wrapper.addEventListener('pointercancel', stop);
        }

        function getRouletteValue(wrapper) {
            const sel = wrapper.querySelector('.coord-item.selected');
            return sel ? parseInt(sel.dataset.val) : 0;
        }
        function setRouletteValue(wrapper, value) {
            const items = wrapper.querySelectorAll('.coord-item');
            let idx = -1;
            items.forEach((item, i) => { if (parseInt(item.dataset.val) === value) idx = i; });
            if (idx !== -1) wrapper.scrollTo({ left: idx * ROULETTE_ITEM_W, behavior: 'smooth' });
        }

        function initBoard() {
            CELL_SIZE = Math.max(24, Math.floor((Math.min(window.innerWidth - 40, 600) - PADDING * 2) / BOARD_N));
            const size = BOARD_N * CELL_SIZE + PADDING * 2;
            if (canvas.width !== size) { // 크기가 그대로면 캔버스를 지우지 않음
                canvas.width = size; canvas.height = size;
                canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
            }
            initRoulette();
        }

        function drawBoard() {
            const size = canvas.width;
            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = '#f5e6c8'; ctx.fillRect(0, 0, size, size);
            ctx.font = `bold ${Math.max(10, CELL_SIZE * 0.35)}px "Pretendard Variable", Pretendard, system-ui, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

            for (let i = 0; i <= BOARD_N; i++) {
                const coord = i - HALF_N;
                const px = PADDING + i * CELL_SIZE, py = PADDING + (BOARD_N - i) * CELL_SIZE;
                ctx.beginPath(); ctx.moveTo(px, PADDING); ctx.lineTo(px, PADDING + BOARD_N * CELL_SIZE);
                if (coord === 0) { ctx.lineWidth = 2; ctx.strokeStyle = '#333'; } else { ctx.lineWidth = 0.5; ctx.strokeStyle = '#8B6914'; }
                ctx.stroke();
                ctx.beginPath(); ctx.moveTo(PADDING, py); ctx.lineTo(PADDING + BOARD_N * CELL_SIZE, py);
                if (coord === 0) { ctx.lineWidth = 2; ctx.strokeStyle = '#333'; } else { ctx.lineWidth = 0.5; ctx.strokeStyle = '#8B6914'; }
                ctx.stroke();
                ctx.fillStyle = '#666';
                ctx.fillText(coord.toString(), px, PADDING + BOARD_N * CELL_SIZE + 18);
                ctx.fillText(coord.toString(), PADDING - 20, py);
            }
            ctx.fillStyle = '#333';
            ctx.beginPath(); ctx.arc(PADDING + HALF_N * CELL_SIZE, PADDING + HALF_N * CELL_SIZE, 4, 0, Math.PI * 2); ctx.fill();

            const stoneRad = Math.max(10, CELL_SIZE * 0.4);
            const moves = matchData?.moves || [];
            const lastPlay = [...moves].reverse().find(m => !m.pass);

            for (const [key, color] of Object.entries(boardState)) {
                const [x, y] = key.split(',').map(Number);
                const px = PADDING + (x + HALF_N) * CELL_SIZE, py = PADDING + (HALF_N - y) * CELL_SIZE;
                const isWin = winStones.some(ws => ws.x === x && ws.y === y);
                const isLast = lastPlay && lastPlay.x === x && lastPlay.y === y;

                ctx.beginPath(); ctx.arc(px + 2, py + 2, stoneRad, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fill();

                const grad = ctx.createRadialGradient(px - stoneRad * 0.3, py - stoneRad * 0.3, stoneRad * 0.1, px, py, stoneRad);
                grad.addColorStop(0, color === 'black' ? '#555' : '#fff');
                grad.addColorStop(1, color === 'black' ? '#111' : '#ccc');
                ctx.beginPath(); ctx.arc(px, py, stoneRad, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
                if (color === 'white') { ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1; ctx.stroke(); }
                if (isLast && !isWin) { ctx.beginPath(); ctx.arc(px, py, stoneRad + 3, 0, Math.PI * 2); ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 2.5; ctx.stroke(); }
                if (isWin) { ctx.beginPath(); ctx.arc(px, py, stoneRad + 3, 0, Math.PI * 2); ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.stroke(); }
            }
        }

        // =====================================================================
        // 게임 로직
        // =====================================================================
        let timerInterval = null;

        function buildBoard(moves) {
            const b = {};
            (moves || []).forEach((m, i) => { if (!m.pass) b[`${m.x},${m.y}`] = i % 2 === 0 ? 'black' : 'white'; });
            return b;
        }
        function inRange(x, y) { return x >= -HALF_N && x <= HALF_N && y >= -HALF_N && y <= HALF_N; }
        function trailingPassCount(moves) {
            let c = 0;
            for (let i = (moves || []).length - 1; i >= 0 && moves[i].pass; i--) c++;
            return c;
        }

        // 정확히 5목일 때만 승리 (6목 이상은 승리 아님)
        function checkWin(board, x, y, color) {
            for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
                let stones = [{ x, y }];
                for (const s of [1, -1]) {
                    let st = 1;
                    while (true) {
                        const nx = x + dx * s * st, ny = y + dy * s * st;
                        if (board[`${nx},${ny}`] === color) { stones.push({ x: nx, y: ny }); st++; } else break;
                    }
                }
                if (stones.length === WIN_COUNT) { stones.sort((a, b) => a.x - b.x || a.y - b.y); return stones; }
            }
            return null;
        }

        function startGameSync() {
            cleanupMatchSubs();

            opponentSynced = false;
            opponentLastHeartbeatValue = null;
            opponentHeartbeatLocalTime = getServerTime();
            opponentStatus = 'online';
            opponentAwayStartTime = 0;
            opponentMatchId = null;
            gameSyncStartedAt = getServerTime();
            resultHandled = false;
            isSubmittingMove = false;
            stallHandled = false;

            document.getElementById('game-result-area').classList.add('d-none');
            document.getElementById('game-input-area').classList.remove('d-none');

            // [응급처치 4] 첫 수가 나오기 전까지 경기가 시작되지 않으면 수동 취소 버튼 노출
            const abandonBtn = document.getElementById('btn-abandon-match');
            abandonBtn.classList.add('d-none');
            clearTimeout(abandonBtnTimer);
            abandonBtnTimer = setTimeout(() => {
                if (matchData && matchData.status === 'playing' && (matchData.moves?.length || 0) === 0) {
                    abandonBtn.classList.remove('d-none');
                }
            }, ABANDON_BTN_MS);

            timerInterval = setInterval(checkTimer, 100);

            // 브라우저 강제 종료 시 서버가 자동으로 몰수 처리
            const oppId = matchData.player1 === currentNickname ? matchData.player2 : matchData.player1;
            try {
                onDisconnect(matchRef(currentRoomCode, currentMatchId))
                    .update({ status: 'finished', winner: oppId, endReason: 'offline' });
                matchDisconnectArmed = true;
            } catch (e) { }

            unsubMatch = onValue(matchRef(currentRoomCode, currentMatchId), (snapshot) => {
                if (!snapshot.exists()) return;
                matchData = snapshot.val();
                if (!matchData.moves) matchData.moves = [];

                boardState = buildBoard(matchData.moves);
                winStones = matchData.winLine || [];

                // [응급처치 4] 첫 수가 나오면 취소 버튼은 영구히 숨김 (지는 판 도망 방지)
                if ((matchData.moves?.length || 0) > 0) {
                    clearTimeout(abandonBtnTimer);
                    document.getElementById('btn-abandon-match').classList.add('d-none');
                }

                if (matchData.status === 'finished') {
                    disarmMatchDisconnect();
                    settleMatch(currentRoomCode, currentMatchId, matchData);
                }

                initBoard(); drawBoard(); updateGameUI(); checkTimer();

                if (matchData.status === 'playing' && !unsubOpponent) {
                    unsubOpponent = onValue(playerRef(currentRoomCode, oppId), (snap) => {
                        if (!snap.exists()) return;
                        const data = snap.val();
                        opponentSynced = true;
                        opponentMatchId = data.currentMatchId || null;
                        if (typeof data.lastHeartbeat === 'number' && data.lastHeartbeat !== opponentLastHeartbeatValue) {
                            opponentLastHeartbeatValue = data.lastHeartbeat;
                            opponentHeartbeatLocalTime = getServerTime();
                        }
                        if (data.status === 'away') {
                            if (opponentStatus !== 'away') { opponentStatus = 'away'; opponentAwayStartTime = getServerTime(); }
                        } else if (data.status === 'offline') {
                            opponentStatus = 'offline';
                        } else {
                            opponentStatus = 'online'; opponentAwayStartTime = 0;
                        }
                    });
                }
            });
        }

        function disarmMatchDisconnect() {
            if (!matchDisconnectArmed || !currentRoomCode || !currentMatchId) return;
            matchDisconnectArmed = false;
            try { onDisconnect(matchRef(currentRoomCode, currentMatchId)).cancel(); } catch (e) { }
        }

        function turnStartTime() {
            // 서버가 기록한 lastMoveTime 기준 → 새로고침으로 타이머를 초기화할 수 없음
            const t = matchData?.lastMoveTime;
            return typeof t === 'number' ? t : gameSyncStartedAt;
        }

        function checkTimer() {
            if (!matchData || matchData.status !== 'playing') return;

            // 상대방 이탈 확인 (첫 동기화 전에는 판정하지 않음)
            if (unsubOpponent && opponentSynced) {
                const eH = getServerTime() - opponentHeartbeatLocalTime;
                const eA = opponentStatus === 'away' ? (getServerTime() - opponentAwayStartTime) : 0;
                const gone = opponentStatus === 'offline' || eH > AFK_LIMIT_MS || (opponentStatus === 'away' && eA > AFK_LIMIT_MS);
                if (gone) {
                    unsubOpponent(); unsubOpponent = null;
                    triggerOpponentForfeit();
                    return;
                }
                // 매칭 정보 불일치(드문 경합) 감지: 아직 한 수도 두지 않았고 3초 이상 지났을 때만
                if (opponentMatchId && opponentMatchId !== currentMatchId &&
                    (matchData.moves?.length || 0) === 0 && (getServerTime() - gameSyncStartedAt) > 3000) {
                    unsubOpponent(); unsubOpponent = null;
                    finishMatchAtomic(currentRoomCode, currentMatchId, null, 'error');
                    return;
                }
            }

            const isMyTurn = ((matchData.moves?.length || 0) % 2 === 0 ? 'black' : 'white') === myColor;
            const elapsedTurnMs = getServerTime() - turnStartTime();
            const remain = Math.max(0, TURN_LIMIT_SEC - (elapsedTurnMs / 1000));

            // [응급처치 3] 상대 턴이 제한시간+여유를 넘겨도 아무 변화가 없으면 경기 정체로 판단.
            // 상대 클라이언트가 살아 있다면 30초에 스스로 패스하므로, 90초 무변화는
            // "상대가 이 경기에 들어오지 못한 상태"를 뜻합니다. 승패 없이 종료하고 재매칭합니다.
            if (!isMyTurn && !stallHandled && elapsedTurnMs > TURN_LIMIT_SEC * 1000 + STALL_LIMIT_MS) {
                stallHandled = true;
                finishMatchAtomic(currentRoomCode, currentMatchId, null, 'error');
                return;
            }

            const bar = document.getElementById('timer-progress-bar');
            if (bar) {
                bar.style.width = (remain / TURN_LIMIT_SEC * 100) + '%';
                bar.className = `progress-bar ${remain <= 10 ? 'bg-danger' : 'bg-primary'}`;
            }
            if (isMyTurn && remain === 0 && !isSubmittingMove) passTurnDueToTimeout();
        }

        async function passTurnDueToTimeout() {
            if (isSubmittingMove) return;
            isSubmittingMove = true;
            try { await submitMove(null); } catch (e) { } finally { isSubmittingMove = false; }
        }

        // 착수 / 패스를 트랜잭션으로 처리 → 연타·동시 착수에도 수가 사라지지 않음
        async function submitMove(coord) {
            const matchId = currentMatchId;
            const color = myColor;
            if (!matchId || !color) return { ok: false, reason: 'nomatch' };

            let outcome = { ok: false, reason: 'aborted' };

            const res = await runTransaction(matchRef(currentRoomCode, matchId), (cur) => {
                if (!cur || cur.status !== 'playing') { outcome = { ok: false, reason: 'finished' }; return; }
                const moves = cur.moves || [];
                const turnColor = moves.length % 2 === 0 ? 'black' : 'white';
                if (turnColor !== color) { outcome = { ok: false, reason: 'notyourturn' }; return; }

                const board = buildBoard(moves);

                if (coord === null) {
                    const next = [...moves, { pass: true }];
                    cur.moves = next;
                    cur.lastMoveTime = getServerTime();
                    if (trailingPassCount(next) >= MAX_CONSECUTIVE_PASS) {
                        cur.status = 'finished'; cur.winner = null; cur.endReason = 'pass';
                    } else {
                        cur.currentTurn = turnColor === 'black' ? 'white' : 'black';
                    }
                    outcome = { ok: true };
                    return cur;
                }

                const { x, y } = coord;
                if (!inRange(x, y)) { outcome = { ok: false, reason: 'range' }; return; }
                if (board[`${x},${y}`]) { outcome = { ok: false, reason: 'occupied' }; return; }

                board[`${x},${y}`] = turnColor;
                const next = [...moves, { x, y }];
                cur.moves = next;
                cur.lastMoveTime = getServerTime();

                const win = checkWin(board, x, y, turnColor);
                const stoneCount = Object.keys(board).length;

                if (win) {
                    cur.status = 'finished';
                    cur.winner = turnColor === 'black' ? cur.player1 : cur.player2;
                    cur.winLine = win;
                } else if (stoneCount >= (BOARD_N + 1) * (BOARD_N + 1)) {
                    cur.status = 'finished'; cur.winner = null; cur.endReason = 'full';
                } else {
                    cur.currentTurn = turnColor === 'black' ? 'white' : 'black';
                }
                outcome = { ok: true };
                return cur;
            });

            if (!res.committed) return outcome.ok ? { ok: false, reason: 'conflict' } : outcome;
            return outcome;
        }

        function updateGameUI() {
            if (!matchData) return;
            document.getElementById('player-name-black').textContent = `${matchData.player1} (흑)`;
            document.getElementById('player-name-white').textContent = `${matchData.player2} (백)`;

            const isBlackTurn = (matchData.moves?.length || 0) % 2 === 0;
            const bB = document.getElementById('player-bar-black'), bW = document.getElementById('player-bar-white');

            if (matchData.status === 'finished') {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                bB.classList.remove('active-turn'); bW.classList.remove('active-turn');
                const bar = document.getElementById('timer-progress-bar');
                if (bar) bar.style.width = '0%';
                drawBoard();

                if (resultHandled) return;   // 스냅샷이 여러 번 와도 안내는 한 번만
                resultHandled = true;

                // [응급처치 3·4] 정체(error)·취소(abandoned)는 승패 없이 대기실로 복귀
                if (matchData.endReason === 'error' || matchData.endReason === 'abandoned') {
                    const msg = matchData.endReason === 'abandoned'
                        ? '경기가 취소되었습니다.<br>대기실로 돌아가 새 상대를 찾습니다.<br>(승패는 기록되지 않습니다)'
                        : '통신이 지연되어 대전 정보가 어긋났습니다.<br>대기실로 돌아가 새 상대를 찾습니다.<br>(승패는 기록되지 않습니다)';
                    customAlert('다시 매칭합니다', msg)
                        .then(() => document.getElementById('btn-back-to-waiting').click());
                    return;
                }

                document.getElementById('game-input-area').classList.add('d-none');
                document.getElementById('game-result-area').classList.remove('d-none');

                if (matchData.endReason === 'kick' || matchData.endReason === 'offline') {
                    if (matchData.winner === currentNickname) {
                        customAlert('🎉 승리!', '상대방이 이탈하거나 강퇴되어 몰수승으로 처리되었습니다.')
                            .then(() => document.getElementById('btn-back-to-waiting').click());
                    } else if (matchData.winner) {
                        customAlert('😢 패배', '1분 이상 자리를 비워 몰수패로 처리되었습니다.')
                            .then(() => document.getElementById('btn-back-to-waiting').click());
                    }
                    return;
                }

                document.getElementById('game-result-title').innerHTML =
                    matchData.winner === currentNickname ? '🎉 승리!' : matchData.winner ? '😢 패배' : '🤝 무승부';
                document.getElementById('game-result-desc').textContent =
                    matchData.winner === currentNickname ? '축하합니다! 대전에서 승리했습니다.'
                        : matchData.winner ? `${matchData.winner} 학생이 승리했습니다.`
                            : matchData.endReason === 'pass' ? '양쪽 모두 시간 내에 두지 않아 무승부로 끝났습니다.'
                                : '좌표평면이 가득 찼습니다.';
                return;
            }

            bB.classList.toggle('active-turn', isBlackTurn);
            bW.classList.toggle('active-turn', !isBlackTurn);

            const isMyTurn = (isBlackTurn ? 'black' : 'white') === myColor;
            const btn = document.getElementById('btn-place-stone');
            const text = document.getElementById('game-status-text');
            btn.disabled = !isMyTurn || isSubmittingMove;
            btn.className = `btn fw-bold px-4 py-2 ${isMyTurn ? 'btn-primary' : 'btn-secondary disabled'}`;
            btn.textContent = '두기';
            text.textContent = isMyTurn ? '내 차례입니다! 좌표를 선택하고 돌을 놓으세요.' : '상대방의 차례입니다. 잠시 기다려주세요.';
            text.className = `small text-center mt-2 mb-0 ${isMyTurn ? 'text-primary fw-bold' : 'text-muted'}`;
        }

        document.getElementById('btn-place-stone').addEventListener('click', async () => {
            if (isSubmittingMove) return;
            if (!matchData || matchData.status !== 'playing') return;
            if (((matchData.moves?.length || 0) % 2 === 0 ? 'black' : 'white') !== myColor) return;
            if ((getServerTime() - turnStartTime()) / 1000 >= TURN_LIMIT_SEC) return;

            const rX = document.getElementById('roulette-x'), rY = document.getElementById('roulette-y');
            const x = getRouletteValue(rX), y = getRouletteValue(rY);
            if (!inRange(x, y)) return await customAlert("좌표 확인", `-${HALF_N}부터 ${HALF_N} 사이의 좌표를 선택해주세요.`);
            if (boardState[`${x},${y}`]) return await customAlert("좌표 확인", "이미 돌이 놓인 자리입니다.");

            const btn = document.getElementById('btn-place-stone');
            isSubmittingMove = true;
            btn.disabled = true;
            btn.textContent = '두는 중...';
            try {
                const r = await submitMove({ x, y });
                if (r.ok) { setRouletteValue(rX, 0); setRouletteValue(rY, 0); }
                else if (r.reason === 'occupied') await customAlert("좌표 확인", "방금 상대가 그 자리에 두었습니다. 다른 좌표를 선택해주세요.");
                else if (r.reason === 'notyourturn' || r.reason === 'conflict') await customAlert("알림", "차례가 넘어갔습니다. 판을 다시 확인해주세요.");
            } catch (e) {
                await customAlert("연결 확인", "돌을 놓지 못했습니다. 네트워크 상태를 확인하고 다시 시도해주세요.");
            } finally {
                isSubmittingMove = false;
                updateGameUI();
            }
        });

        // [응급처치 4] 상대가 경기에 들어오지 않을 때 학생이 직접 빠져나오는 탈출구
        document.getElementById('btn-abandon-match').addEventListener('click', async () => {
            if (!currentMatchId || !matchData || matchData.status !== 'playing') return;
            if ((matchData.moves?.length || 0) > 0) return;   // 수가 시작된 뒤에는 취소 불가
            const ok = await customConfirm('매칭 취소',
                '상대의 응답이 없어 경기를 취소할까요?<br>승패는 기록되지 않고, 대기실로 돌아가 새 상대를 찾습니다.');
            if (!ok) return;
            await finishMatchAtomic(currentRoomCode, currentMatchId, null, 'abandoned');
            // 이후 처리는 unsubMatch 스냅샷 → updateGameUI의 abandoned 분기가 담당
        });

        // =====================================================================
        // 정리 및 전환
        // =====================================================================
        document.getElementById('btn-back-to-waiting').addEventListener('click', async () => {
            disarmMatchDisconnect();
            const finishedId = currentMatchId;
            cleanupMatchSubs();
            currentMatchId = null; matchData = null; myColor = null;
            boardState = {}; winStones = []; resultHandled = false;

            try {
                await update(playerRef(currentRoomCode, currentNickname), { currentMatchId: null, currentOpponent: null });
            } catch (e) { }

            // 양쪽 모두 나갔다면 끝난 경기 데이터를 정리해 방을 가볍게 유지
            if (finishedId) {
                try {
                    const mSnap = await get(matchRef(currentRoomCode, finishedId));
                    if (mSnap.exists()) {
                        const m = mSnap.val();
                        const other = m.player1 === currentNickname ? m.player2 : m.player1;
                        let otherStill = false;
                        if (other) {
                            const oSnap = await get(ref(db, `gomoku_rooms/${currentRoomCode}/players/${other}/currentMatchId`));
                            otherStill = oSnap.val() === finishedId;
                        }
                        if (!otherStill) await remove(matchRef(currentRoomCode, finishedId));
                    }
                } catch (e) { }
            }

            enterWaitingRoom();
        });

        function cleanupMatchSubs() {
            if (unsubMatch) { unsubMatch(); unsubMatch = null; }
            if (unsubOpponent) { unsubOpponent(); unsubOpponent = null; }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            // [응급처치 4] 경기 관련 타이머·버튼도 함께 정리
            clearTimeout(abandonBtnTimer); abandonBtnTimer = null;
            document.getElementById('btn-abandon-match')?.classList.add('d-none');
        }
        function cleanupWaiting() {
            if (unsubWaiting) { unsubWaiting(); unsubWaiting = null; }
            if (unsubMatchPtr) { unsubMatchPtr(); unsubMatchPtr = null; }   // [응급처치 1] 포인터 구독 해제
            if (waitingInterval) { clearInterval(waitingInterval); waitingInterval = null; }
            if (currentRoomCode && currentNickname) {
                try { onDisconnect(waitingRef(currentRoomCode, currentNickname)).cancel(); } catch (e) { }
            }
        }
        function cleanupAdmin() {
            if (unsubAdminPlayers) { unsubAdminPlayers(); unsubAdminPlayers = null; }
            if (adminRenderInterval) { clearInterval(adminRenderInterval); adminRenderInterval = null; }
        }
        function cleanupAll() {
            // [보강] 강퇴·중복 접속으로 물러날 때 onDisconnect 예약을 반드시 해제.
            // 해제하지 않으면 곧 이어지는 location.reload()가 연결 종료로 인식되어
            // 서버가 진행 중이던 경기를 몰수패로 덮고, 내 상태를 offline으로 덮어씁니다.
            disarmMatchDisconnect();
            if (currentRoomCode && currentNickname) {
                try { onDisconnect(playerRef(currentRoomCode, currentNickname)).cancel(); } catch (e) { }
            }
            cleanupMatchSubs(); cleanupWaiting(); cleanupAdmin();
            if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
            if (unsubMe) { unsubMe(); unsubMe = null; }
            document.removeEventListener('visibilitychange', handleVisibility);
        }

        window.addEventListener('resize', () => { if (matchData) { initBoard(); drawBoard(); } });

        // dashboard.css가 Pretendard를 @import로 불러오므로, 폰트 로드 후 좌표 숫자를 다시 그립니다
        if (document.fonts?.ready) document.fonts.ready.then(() => { if (matchData) drawBoard(); });
    </script>
</body>

</html>
