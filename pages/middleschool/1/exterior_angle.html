<!DOCTYPE html>

  <!-- 파비콘 -->

  <!-- Bootstrap Icons -->

  <!-- 공통 네비게이션 CSS -->
  <link rel="stylesheet" href="../../../css/navbar.css" />

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --border: #e5e7eb;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .page-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .content-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      background: #fff;
    }

    .board-canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 600 / 480;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
      touch-action: none;
      user-select: none;
    }

    .angle-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .3rem .6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: .9rem;
      transition: opacity .2s;
    }

    .angle-badge .dot {
      width: .7rem;
      height: .7rem;
      border-radius: 50%;
    }

    .angle-badge.pending {
      opacity: .4;
    }
  </style>
</head>

<body>
  <!-- 네비게이션바 -->
  <script src="../../../js/navbar.js" data-type="middleschool"></script>

  <main class="page-wrap">
    <header class="mb-4 text-center">
      <h1 class="fw-bold mb-2">📐 다각형의 외각의 크기의 합</h1>
      <p class="text-secondary mb-0">다각형을 만들고, 외각을 한곳에 모아 보세요. 외각의 크기의 합은 얼마일까요?</p>
    </header>

    <div class="row g-4">
      <!-- 왼쪽: 다각형 만들기 -->
      <section class="col-lg-6">
        <div class="content-card h-100">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-pentagon text-primary"></i> 다각형 만들기</h2>
            <span id="polygonNameBadge" class="badge text-bg-primary fs-6">-</span>
          </div>
          <p id="leftStatus" class="small text-secondary mb-2">빈 곳을 눌러 점을 찍어 보세요.</p>

          <canvas id="polygonCanvas" class="board-canvas"></canvas>

          <div class="d-flex flex-wrap gap-2 mt-3 align-items-center">
            <button id="undoButton" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> 점 지우기</button>
            <button id="clearButton" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> 새로 그리기</button>
            <select id="presetSelect" class="form-select form-select-sm w-auto">
              <option value="" selected>정다각형 예시</option>
              <option value="3">정삼각형</option>
              <option value="4">정사각형</option>
              <option value="5">정오각형</option>
              <option value="6">정육각형</option>
              <option value="7">정칠각형</option>
              <option value="8">정팔각형</option>
            </select>
            <div class="form-check form-switch ms-auto mb-0">
              <input class="form-check-input" type="checkbox" role="switch" id="labelToggle" checked>
              <label class="form-check-label small" for="labelToggle">각도 표시</label>
            </div>
          </div>
        </div>
      </section>

      <!-- 오른쪽: 외각 모으기 -->
      <section class="col-lg-6">
        <div class="content-card h-100">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-pie-chart text-success"></i> 외각 모으기</h2>
            <div class="btn-group btn-group-sm" role="group">
              <button id="stepButton" class="btn btn-outline-success"><i class="bi bi-skip-forward"></i> 하나씩</button>
              <button id="collectAllButton" class="btn btn-success"><i class="bi bi-bullseye"></i> 모두 모으기</button>
              <button id="scatterButton" class="btn btn-outline-secondary"><i class="bi bi-arrows-angle-expand"></i> 흩어 놓기</button>
            </div>
          </div>
          <p class="small text-secondary mb-2">외각을 <b>평행이동</b>하여 한 점에 모아 봅니다.</p>

          <canvas id="collectCanvas" class="board-canvas"></canvas>

          <div id="angleBadges" class="d-flex flex-wrap gap-2 mt-3"></div>
          <div id="sumText" class="alert alert-light border mt-3 mb-0 py-2 small">왼쪽에서 다각형을 완성하면 외각이 나타납니다.</div>
        </div>
      </section>
    </div>

    <!-- 탐구 기록 -->
    <section class="content-card mt-4">
      <h2 class="h5 fw-bold mb-2"><i class="bi bi-journal-text text-warning"></i> 탐구 기록</h2>
      <p class="small text-secondary mb-2">외각을 모두 모으면 자동으로 기록됩니다. 여러 가지 다각형으로 탐구해 보고, 규칙을 찾아보세요.</p>
      <div class="table-responsive">
        <table class="table table-sm table-bordered text-center align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>다각형</th>
              <th>꼭짓점의 개수</th>
              <th>내각의 크기의 합</th>
              <th>외각의 크기의 합</th>
            </tr>
          </thead>
          <tbody id="recordBody">
            <tr id="emptyRecordRow">
              <td colspan="4" class="text-secondary small">아직 기록이 없습니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ---------- 상수 & 상태 ---------- */
    const LOGICAL_WIDTH = 600;
    const LOGICAL_HEIGHT = 480;
    const MAX_VERTICES = 12;
    const MIN_TURN = Math.PI / 180; // 1° 이하의 외각(거의 일직선)은 허용하지 않음
    const VERTEX_COLORS = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899',
      '#14b8a6', '#f97316', '#6366f1', '#84cc16', '#06b6d4', '#a16207'];
    const VERTEX_NAMES = 'ABCDEFGHIJKL';
    const KOREAN_NUMBERS = ['', '', '', '삼', '사', '오', '육', '칠', '팔', '구', '십', '십일', '십이'];

    const polygonCanvas = document.getElementById('polygonCanvas');
    const collectCanvas = document.getElementById('collectCanvas');
    const polygonContext = setupCanvas(polygonCanvas);
    const collectContext = setupCanvas(collectCanvas);

    const state = {
      points: [],
      isClosed: false,
      hoverPoint: null,
      dragIndex: -1,
      dragMoved: false,
      closeCandidate: false,
      showLabels: true,
      warningUntil: 0,
      warningTimer: null,
      progress: [],   // 각 외각의 모임 진행도(0~1)
      target: []      // 목표 진행도(0 또는 1)
    };
    const records = {};
    let animationId = null;

    /* ---------- 캔버스 기본 ---------- */
    function setupCanvas(canvas) {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = LOGICAL_WIDTH * ratio;
      canvas.height = LOGICAL_HEIGHT * ratio;
      const context = canvas.getContext('2d');
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      return context;
    }

    function toLogicalPoint(event, canvas) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * LOGICAL_WIDTH / rect.width,
        y: (event.clientY - rect.top) * LOGICAL_HEIGHT / rect.height
      };
    }

    function getHitRadius(canvas) {
      return 18 * LOGICAL_WIDTH / canvas.getBoundingClientRect().width;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function hexToRgba(hex, alpha) {
      const value = parseInt(hex.slice(1), 16);
      return `rgba(${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}, ${alpha})`;
    }

    /* ---------- 기하 계산 ---------- */
    function normalizeAngle(angle) {
      while (angle > Math.PI) angle -= 2 * Math.PI;
      while (angle < -Math.PI) angle += 2 * Math.PI;
      return angle;
    }

    // 각 꼭짓점에서 [들어오는 변의 방향(연장선 방향), 회전각(=부호 있는 외각)]
    function getExteriorAngles(points) {
      const count = points.length;
      return points.map((current, index) => {
        const previous = points[(index - 1 + count) % count];
        const next = points[(index + 1) % count];
        const incomingDirection = Math.atan2(current.y - previous.y, current.x - previous.x);
        const outgoingDirection = Math.atan2(next.y - current.y, next.x - current.x);
        return { incomingDirection, turn: normalizeAngle(outgoingDirection - incomingDirection) };
      });
    }

    // 점들을 순서대로 닫았을 때 (일직선 꼭짓점이 없는) 볼록다각형인지 판별
    function isConvexPolygon(points) {
      if (points.length < 3) return true;
      const exteriorAngles = getExteriorAngles(points);
      const firstSign = Math.sign(exteriorAngles[0].turn);
      const totalTurn = exteriorAngles.reduce((sum, angle) => sum + angle.turn, 0);
      return exteriorAngles.every(angle =>
          Math.sign(angle.turn) === firstSign
          && Math.abs(angle.turn) > MIN_TURN
          && Math.abs(angle.turn) < Math.PI - MIN_TURN)
        && Math.abs(Math.abs(totalTurn) - 2 * Math.PI) < 1e-6;
    }

    function analyzePolygon() {
      const exteriorAngles = getExteriorAngles(state.points);
      const degrees = roundKeepingSum(exteriorAngles.map(angle => Math.abs(angle.turn) * 180 / Math.PI));
      return { exteriorAngles, degrees };
    }

    function showWarning() {
      state.warningUntil = Date.now() + 1500;
      clearTimeout(state.warningTimer);
      state.warningTimer = setTimeout(renderAll, 1600);
    }

    // 반올림한 값들의 합이 실제 합(반올림)과 같도록 보정
    function roundKeepingSum(values) {
      const targetSum = Math.round(values.reduce((sum, value) => sum + value, 0));
      const floored = values.map(Math.floor);
      let remainder = targetSum - floored.reduce((sum, value) => sum + value, 0);
      values.map((value, index) => ({ index, fraction: value - Math.floor(value) }))
        .sort((a, b) => b.fraction - a.fraction)
        .forEach(item => { if (remainder > 0) { floored[item.index] += 1; remainder -= 1; } });
      return floored;
    }

    function getCentroid(points) {
      const sum = points.reduce((acc, point) => ({ x: acc.x + point.x, y: acc.y + point.y }), { x: 0, y: 0 });
      return { x: sum.x / points.length, y: sum.y / points.length };
    }

    function getPolygonName(count) {
      return count >= 3 ? `${KOREAN_NUMBERS[count]}각형` : '-';
    }

    /* ---------- 공통 그리기 ---------- */
    function drawGrid(context) {
      context.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      context.strokeStyle = '#eef0f3';
      context.lineWidth = 1;
      for (let x = 20; x < LOGICAL_WIDTH; x += 20) {
        context.beginPath(); context.moveTo(x, 0); context.lineTo(x, LOGICAL_HEIGHT); context.stroke();
      }
      for (let y = 20; y < LOGICAL_HEIGHT; y += 20) {
        context.beginPath(); context.moveTo(0, y); context.lineTo(LOGICAL_WIDTH, y); context.stroke();
      }
    }

    function drawWedge(context, center, radius, startAngle, turn, color, alpha) {
      context.beginPath();
      context.moveTo(center.x, center.y);
      context.arc(center.x, center.y, radius, startAngle, startAngle + turn, turn < 0);
      context.closePath();
      context.fillStyle = hexToRgba(color, alpha);
      context.fill();
      context.strokeStyle = color;
      context.lineWidth = 1.5;
      context.stroke();
    }

    function drawText(context, text, x, y, color, font) {
      context.font = font;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineWidth = 4;
      context.strokeStyle = 'rgba(255,255,255,0.9)';
      context.strokeText(text, x, y);
      context.fillStyle = color;
      context.fillText(text, x, y);
    }

    function tracePolygon(context, points, shouldClose) {
      context.beginPath();
      points.forEach((point, index) => index === 0 ? context.moveTo(point.x, point.y) : context.lineTo(point.x, point.y));
      if (shouldClose) context.closePath();
    }

    /* ---------- 왼쪽: 다각형 그리기 ---------- */
    function drawPolygonBoard() {
      const context = polygonContext;
      const points = state.points;
      drawGrid(context);

      if (points.length === 0) {
        drawText(context, '빈 곳을 눌러 첫 점을 찍어 보세요', LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2, '#9ca3af', '600 18px Pretendard Variable, sans-serif');
        return;
      }

      // 변
      tracePolygon(context, points, state.isClosed);
      if (state.isClosed) {
        context.fillStyle = 'rgba(37, 99, 235, 0.06)';
        context.fill();
      }
      context.strokeStyle = '#1f2937';
      context.lineWidth = 2.5;
      context.stroke();

      // 그리는 중 미리보기 선
      if (!state.isClosed && state.hoverPoint && state.dragIndex < 0) {
        const lastPoint = points[points.length - 1];
        const canAdd = findVertexIndex(state.hoverPoint) >= 0 || isConvexPolygon([...points, state.hoverPoint]);
        context.setLineDash([6, 6]);
        context.strokeStyle = canAdd ? '#9ca3af' : '#ef4444';
        context.lineWidth = 1.5;
        context.beginPath();
        context.moveTo(lastPoint.x, lastPoint.y);
        context.lineTo(state.hoverPoint.x, state.hoverPoint.y);
        context.stroke();
        context.setLineDash([]);
      }

      // 외각 (연장선 + 부채꼴)
      if (state.isClosed) {
        const { exteriorAngles, degrees } = analyzePolygon();
        exteriorAngles.forEach((angle, index) => {
          const vertex = points[index];
          const color = VERTEX_COLORS[index];
          context.setLineDash([5, 5]);
          context.strokeStyle = '#9ca3af';
          context.lineWidth = 1.5;
          context.beginPath();
          context.moveTo(vertex.x, vertex.y);
          context.lineTo(vertex.x + 75 * Math.cos(angle.incomingDirection), vertex.y + 75 * Math.sin(angle.incomingDirection));
          context.stroke();
          context.setLineDash([]);

          drawWedge(context, vertex, 30, angle.incomingDirection, angle.turn, color, 0.4);

          if (state.showLabels) {
            const labelAngle = angle.incomingDirection + angle.turn / 2;
            drawText(context, `${degrees[index]}°`, vertex.x + 50 * Math.cos(labelAngle), vertex.y + 50 * Math.sin(labelAngle),
              color, '700 15px Pretendard Variable, sans-serif');
          }
        });
      }

      // 꼭짓점 & 이름
      const centroid = getCentroid(points);
      points.forEach((point, index) => {
        const isFirstClosable = !state.isClosed && index === 0 && points.length >= 3;
        if (isFirstClosable) {
          context.beginPath();
          context.arc(point.x, point.y, 14, 0, Math.PI * 2);
          context.fillStyle = 'rgba(16, 185, 129, 0.18)';
          context.fill();
        }
        context.beginPath();
        context.arc(point.x, point.y, 7, 0, Math.PI * 2);
        context.fillStyle = isFirstClosable ? '#10b981' : '#ffffff';
        context.fill();
        context.strokeStyle = state.isClosed ? VERTEX_COLORS[index] : '#1f2937';
        context.lineWidth = 2.5;
        context.stroke();

        let labelX = point.x - 14;
        let labelY = point.y - 16;
        if (state.isClosed) {
          const distance = Math.hypot(centroid.x - point.x, centroid.y - point.y) || 1;
          labelX = point.x + (centroid.x - point.x) / distance * 22;
          labelY = point.y + (centroid.y - point.y) / distance * 22;
        }
        drawText(context, VERTEX_NAMES[index], labelX, labelY, '#1f2937', '700 16px Pretendard Variable, sans-serif');
      });
    }

    /* ---------- 오른쪽: 외각 모으기 ---------- */
    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function getFitMapping(points) {
      const xs = points.map(point => point.x);
      const ys = points.map(point => point.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const margin = 70;
      const scale = Math.min((LOGICAL_WIDTH - 2 * margin) / Math.max(maxX - minX, 1),
        (LOGICAL_HEIGHT - 2 * margin) / Math.max(maxY - minY, 1), 1);
      const offsetX = LOGICAL_WIDTH / 2 - (minX + maxX) / 2 * scale;
      const offsetY = LOGICAL_HEIGHT / 2 - (minY + maxY) / 2 * scale;
      return point => ({ x: point.x * scale + offsetX, y: point.y * scale + offsetY });
    }

    function drawCollectBoard() {
      const context = collectContext;
      drawGrid(context);

      if (!state.isClosed) {
        drawText(context, '왼쪽에서 다각형을 완성해 주세요', LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2, '#9ca3af', '600 18px Pretendard Variable, sans-serif');
        return;
      }

      const { exteriorAngles, degrees } = analyzePolygon();
      const mapPoint = getFitMapping(state.points);
      const mappedPoints = state.points.map(mapPoint);
      const center = { x: LOGICAL_WIDTH / 2, y: LOGICAL_HEIGHT / 2 };
      const averageProgress = state.progress.reduce((sum, value) => sum + value, 0) / state.progress.length;

      // 흐린 다각형
      context.globalAlpha = 1 - 0.75 * averageProgress;
      tracePolygon(context, mappedPoints, true);
      context.fillStyle = 'rgba(37, 99, 235, 0.05)';
      context.fill();
      context.setLineDash([6, 5]);
      context.strokeStyle = '#94a3b8';
      context.lineWidth = 1.5;
      context.stroke();
      context.setLineDash([]);
      context.globalAlpha = 1;

      // 원 안내선
      const collectedRadius = 150;
      context.setLineDash([4, 6]);
      context.strokeStyle = 'rgba(148, 163, 184, 0.6)';
      context.lineWidth = 1;
      context.beginPath();
      context.arc(center.x, center.y, collectedRadius, 0, Math.PI * 2);
      context.stroke();
      context.setLineDash([]);

      exteriorAngles.forEach((angle, index) => {
        const progress = easeInOut(state.progress[index]);
        const startPoint = mappedPoints[index];
        const position = {
          x: startPoint.x + (center.x - startPoint.x) * progress,
          y: startPoint.y + (center.y - startPoint.y) * progress
        };
        const radius = 34 + (collectedRadius - 34) * progress;
        const color = VERTEX_COLORS[index];
        drawWedge(context, position, radius, angle.incomingDirection, angle.turn, color, 0.35 + 0.3 * progress);

        if (state.showLabels) {
          const labelAngle = angle.incomingDirection + angle.turn / 2;
          const labelRadius = progress > 0.5 ? radius * 0.68 : radius + 14;
          drawText(context, `${degrees[index]}°`, position.x + labelRadius * Math.cos(labelAngle), position.y + labelRadius * Math.sin(labelAngle),
            color, '700 15px Pretendard Variable, sans-serif');
        }
      });

      // 완성
      if (state.progress.every(value => value >= 1)) {
        context.strokeStyle = '#111827';
        context.lineWidth = 2.5;
        context.beginPath();
        context.arc(center.x, center.y, collectedRadius, 0, Math.PI * 2);
        context.stroke();
        drawText(context, '한 바퀴 = 360°', center.x, center.y + collectedRadius + 24, '#111827', '800 18px Pretendard Variable, sans-serif');
      }
      context.beginPath();
      context.arc(center.x, center.y, 4, 0, Math.PI * 2);
      context.fillStyle = '#111827';
      context.fill();
    }

    /* ---------- 정보 패널 ---------- */
    function updateInfoPanel() {
      const count = state.points.length;
      const nameBadge = document.getElementById('polygonNameBadge');
      const leftStatus = document.getElementById('leftStatus');
      const badgeContainer = document.getElementById('angleBadges');
      const sumText = document.getElementById('sumText');

      nameBadge.textContent = state.isClosed ? getPolygonName(count) : `점 ${count}개`;
      document.getElementById('undoButton').disabled = state.isClosed || count === 0;

      const isWarning = Date.now() < state.warningUntil;
      leftStatus.className = `small mb-2 ${isWarning ? 'text-danger fw-semibold' : 'text-secondary'}`;

      if (!state.isClosed) {
        leftStatus.textContent = isWarning
          ? '볼록다각형이 되는 위치에만 점을 찍거나 옮길 수 있어요.'
          : count < 3
            ? '빈 곳을 눌러 점을 찍어 보세요. (볼록다각형만 만들 수 있어요)'
            : '첫 번째 점(초록색)을 누르면 다각형이 완성됩니다.';
        badgeContainer.innerHTML = '';
        sumText.className = 'alert alert-light border mt-3 mb-0 py-2 small';
        sumText.textContent = '왼쪽에서 다각형을 완성하면 외각이 나타납니다.';
        setCollectButtonsDisabled(true);
        return;
      }

      const { degrees } = analyzePolygon();
      leftStatus.textContent = isWarning
        ? '볼록다각형이 유지되는 범위에서만 꼭짓점을 옮길 수 있어요.'
        : '꼭짓점을 드래그하여 모양을 바꿔 보세요. 점선은 변의 연장선입니다.';
      setCollectButtonsDisabled(false);

      badgeContainer.innerHTML = degrees.map((degree, index) => `
        <span class="angle-badge ${state.target[index] ? '' : 'pending'}">
          <span class="dot" style="background:${VERTEX_COLORS[index]}"></span>∠${VERTEX_NAMES[index]}의 외각 <b>${degree}°</b>
        </span>`).join('');

      const collectedDegrees = degrees.filter((degree, index) => state.progress[index] >= 1);
      const isComplete = collectedDegrees.length === count;
      const collectedSum = collectedDegrees.reduce((sum, degree) => sum + degree, 0);

      if (collectedDegrees.length === 0) {
        sumText.className = 'alert alert-light border mt-3 mb-0 py-2 small';
        sumText.innerHTML = '<b>하나씩</b> 또는 <b>모두 모으기</b>를 눌러 외각을 한 점에 모아 보세요.';
      } else if (!isComplete) {
        sumText.className = 'alert alert-light border mt-3 mb-0 py-2 small';
        sumText.innerHTML = `지금까지 모은 외각의 합: ${collectedDegrees.join('° + ')}° = <b>${collectedSum}°</b>`;
      } else {
        sumText.className = 'alert alert-success mt-3 mb-0 py-2';
        sumText.innerHTML = `${getPolygonName(count)}의 외각의 크기의 합: ${degrees.join('° + ')}° = <b>${collectedSum}°</b>`;
        saveRecord(count);
      }
    }

    function setCollectButtonsDisabled(isDisabled) {
      ['stepButton', 'collectAllButton', 'scatterButton'].forEach(id => document.getElementById(id).disabled = isDisabled);
    }

    function saveRecord(count) {
      if (records[count]) return;
      records[count] = true;
      document.getElementById('emptyRecordRow')?.remove();
      const recordBody = document.getElementById('recordBody');
      const row = document.createElement('tr');
      row.dataset.count = count;
      row.innerHTML = `<td>${getPolygonName(count)}</td><td>${count}</td><td>180° × ${count - 2} = ${180 * (count - 2)}°</td><td class="fw-bold text-success">360°</td>`;
      const nextRow = [...recordBody.children].find(existingRow => Number(existingRow.dataset.count) > count);
      recordBody.insertBefore(row, nextRow || null);
    }

    /* ---------- 렌더링 & 애니메이션 ---------- */
    function renderAll() {
      drawPolygonBoard();
      drawCollectBoard();
      updateInfoPanel();
    }

    function startAnimation() {
      if (animationId) return;
      const step = () => {
        let isMoving = false;
        state.progress.forEach((value, index) => {
          const target = state.target[index];
          if (value === target) return;
          // 모을 때는 앞의 외각이 어느 정도 이동한 뒤 차례로 출발
          const canStart = target === 0 || index === 0 || state.target[index - 1] === 0 || state.progress[index - 1] > 0.35;
          if (canStart) {
            state.progress[index] = target > value ? Math.min(1, value + 0.03) : Math.max(0, value - 0.05);
          }
          isMoving = true;
        });
        renderAll();
        animationId = isMoving ? requestAnimationFrame(step) : null;
      };
      animationId = requestAnimationFrame(step);
    }

    function resetCollection() {
      state.progress = state.points.map(() => 0);
      state.target = state.points.map(() => 0);
    }

    /* ---------- 왼쪽 캔버스 조작 ---------- */
    function findVertexIndex(point) {
      const hitRadius = getHitRadius(polygonCanvas);
      for (let index = state.points.length - 1; index >= 0; index--) {
        const vertex = state.points[index];
        if (Math.hypot(vertex.x - point.x, vertex.y - point.y) <= hitRadius) return index;
      }
      return -1;
    }

    function updateCursor(point) {
      if (state.dragIndex >= 0) polygonCanvas.style.cursor = 'grabbing';
      else if (findVertexIndex(point) >= 0) polygonCanvas.style.cursor = 'grab';
      else polygonCanvas.style.cursor = state.isClosed ? 'default' : 'crosshair';
    }

    polygonCanvas.addEventListener('pointerdown', event => {
      const point = toLogicalPoint(event, polygonCanvas);
      const vertexIndex = findVertexIndex(point);
      polygonCanvas.setPointerCapture(event.pointerId);

      if (vertexIndex >= 0) {
        state.dragIndex = vertexIndex;
        state.dragMoved = false;
        state.closeCandidate = !state.isClosed && vertexIndex === 0 && state.points.length >= 3;
      } else if (!state.isClosed && state.points.length < MAX_VERTICES) {
        const newPoint = { x: clamp(point.x, 10, LOGICAL_WIDTH - 10), y: clamp(point.y, 10, LOGICAL_HEIGHT - 10) };
        if (isConvexPolygon([...state.points, newPoint])) {
          state.points.push(newPoint);
          state.dragIndex = state.points.length - 1;
          state.dragMoved = true;
        } else {
          showWarning();
        }
      }
      updateCursor(point);
      renderAll();
    });

    polygonCanvas.addEventListener('pointermove', event => {
      const point = toLogicalPoint(event, polygonCanvas);
      state.hoverPoint = point;
      if (state.dragIndex >= 0) {
        const vertex = state.points[state.dragIndex];
        if (Math.hypot(vertex.x - point.x, vertex.y - point.y) > 2) state.dragMoved = true;
        if (state.dragMoved) {
          const movedPoint = { x: clamp(point.x, 10, LOGICAL_WIDTH - 10), y: clamp(point.y, 10, LOGICAL_HEIGHT - 10) };
          const candidatePoints = state.points.map((existing, index) => index === state.dragIndex ? movedPoint : existing);
          if (isConvexPolygon(candidatePoints)) {
            vertex.x = movedPoint.x;
            vertex.y = movedPoint.y;
          } else {
            showWarning();
          }
        }
      }
      updateCursor(point);
      renderAll();
    });

    function finishPointer() {
      if (state.closeCandidate && !state.dragMoved) {
        state.isClosed = true;
        resetCollection();
      }
      state.dragIndex = -1;
      state.closeCandidate = false;
      renderAll();
    }

    polygonCanvas.addEventListener('pointerup', finishPointer);
    polygonCanvas.addEventListener('pointercancel', finishPointer);
    polygonCanvas.addEventListener('pointerleave', () => {
      if (state.dragIndex < 0) { state.hoverPoint = null; renderAll(); }
    });

    /* ---------- 버튼 ---------- */
    document.getElementById('undoButton').addEventListener('click', () => {
      if (state.isClosed) return;
      state.points.pop();
      renderAll();
    });

    document.getElementById('clearButton').addEventListener('click', () => {
      state.points = [];
      state.isClosed = false;
      resetCollection();
      document.getElementById('presetSelect').value = '';
      renderAll();
    });

    document.getElementById('presetSelect').addEventListener('change', event => {
      const count = Number(event.target.value);
      if (!count) return;
      const startAngle = -Math.PI / 2 + (count % 2 === 0 ? Math.PI / count : 0);
      state.points = Array.from({ length: count }, (_, index) => ({
        x: LOGICAL_WIDTH / 2 + 170 * Math.cos(startAngle + index * 2 * Math.PI / count),
        y: LOGICAL_HEIGHT / 2 + 170 * Math.sin(startAngle + index * 2 * Math.PI / count)
      }));
      state.isClosed = true;
      resetCollection();
      renderAll();
    });

    document.getElementById('labelToggle').addEventListener('change', event => {
      state.showLabels = event.target.checked;
      renderAll();
    });

    document.getElementById('stepButton').addEventListener('click', () => {
      const nextIndex = state.target.findIndex(value => value === 0);
      if (nextIndex >= 0) state.target[nextIndex] = 1;
      startAnimation();
    });

    document.getElementById('collectAllButton').addEventListener('click', () => {
      state.target = state.target.map(() => 1);
      startAnimation();
    });

    document.getElementById('scatterButton').addEventListener('click', () => {
      state.target = state.target.map(() => 0);
      startAnimation();
    });

    renderAll();
  </script>
</body>

</html>
