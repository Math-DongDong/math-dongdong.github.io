<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>π 외우자! | Math Day</title>

  <link rel="icon" href="../../../../assets/images/mainPage/동동이.jpg" type="image/jpeg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../../../../css/mathday-navbar.css" />

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #6366f1;
      --accent-soft: #f0f0ff;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .page-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .content-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .page-title {
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 800;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* π 숫자 표시 영역 */
    .pi-board {
      min-height: 260px;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      color: #94a3b8;
      text-align: center;
      font-size: 1.05rem;
    }

    .pi-board.playing {
      border-style: solid;
      border-color: var(--accent);
      background: #fbfbff;
      color: var(--text);
    }

    .pi-line {
      font-family: 'Consolas', 'D2Coding', monospace;
      font-size: clamp(1.1rem, 3.2vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.9;
      white-space: nowrap;
    }

    .pi-line .group { margin-right: 1.1em; }
    .pi-line .group:last-child { margin-right: 0; }

    /* 안내 문구 */
    .range-info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-weight: 600;
    }

    /* 타이머 */
    .timer-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      text-align: center;
      min-width: 150px;
    }

    .timer-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.1rem;
    }

    .timer-value {
      font-size: 2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .timer-value.hurry { color: var(--danger); }

    .btn-start {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.8rem 1.6rem;
    }

    .btn-start:hover:not(:disabled) { background: #4f46e5; color: #fff; }
    .btn-start:disabled { background: #c7d2fe; }

    /* 종료 시 풍선 */
    .balloon-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2000;
    }

    .balloon {
      position: absolute;
      bottom: -80px;
      font-size: 2.2rem;
      animation: floatUp 3.4s ease-in forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-115vh) rotate(18deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .balloon { animation-duration: 0.01ms; }
    }

    .rule-list { line-height: 1.9; }
  </style>
</head>

<body>
  <script src="../../../../js/mathday-navbar.js"></script>

  <main class="page-wrap">
    <h1 class="page-title">π 외우자!</h1>

    <section class="content-card mb-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
        <button id="startBtn" class="btn btn-start">
          <i class="bi bi-play-fill me-1"></i>π 외우기
        </button>
        <div class="timer-box">
          <div class="timer-label">남은 시간</div>
          <div id="timerValue" class="timer-value">–</div>
        </div>
      </div>

      <div id="piBoard" class="pi-board mb-3">버튼을 누르면 여기에 π 값이 표시됩니다.</div>

      <p id="rangeInfo" class="range-info mb-0">외워야 할 숫자가 여기에 나타납니다.</p>
    </section>

    <section class="content-card">
      <h2 class="section-title">게임 방법</h2>
      <ul class="rule-list">
        <li>한 모둠씩 앞으로 나온다.</li>
        <li><strong>[π 외우기]를 누르면 31.4초 동안 외우기 시작!</strong> 화면에 <strong>π의 소수점 아래 특정 100자리</strong>가 표시됩니다.</li>
        <li>시간이 끝나면 숫자가 사라집니다. 모둠원들은 순서대로 눈을 가린 뒤 차례대로 큰 소리로 외우고, 다른 학생들은 틀린 자리를 확인한다. (각 팀마다 기회는 단 2번!)</li>
        <li>가장 많이 외운 팀이 승리!</li>
      </ul>
    </section>
  </main>

  <div id="balloonLayer" class="balloon-layer" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // π 소수점 아래 1000자리
    const PI_DIGITS =
      "14159265358979323846264338327950288419716939937510" +
      "58209749445923078164062862089986280348253421170679" +
      "82148086513282306647093844609550582231725359408128" +
      "48111745028410270193852110555964462294895493038196" +
      "44288109756659334461284756482337867831652712019091" +
      "45648566923460348610454326648213393607260249141273" +
      "72458700660631558817488152092096282925409171536436" +
      "78925903600113305305488204665213841469519415116094" +
      "33057270365759591953092186117381932611793105118548" +
      "07446237996274956735188575272489122793818301194912";

    const CHUNK_LENGTH = 100;      // 외워야 할 자릿수
    const COUNTDOWN_SECONDS = 31.4;
    const GROUP_SIZE = 5;          // 5자리씩 묶기
    const GROUPS_PER_LINE = 6;     // 6묶음(30자리)마다 줄바꿈

    const startButton = document.getElementById('startBtn');
    const piBoard = document.getElementById('piBoard');
    const rangeInfo = document.getElementById('rangeInfo');
    const timerValue = document.getElementById('timerValue');
    const balloonLayer = document.getElementById('balloonLayer');

    let timerId = null;

    /** 100자리 숫자를 5자리씩 묶고 6묶음마다 줄바꿈한 HTML로 변환 */
    function formatPiDigits(digits) {
      const groups = [];
      for (let i = 0; i < digits.length; i += GROUP_SIZE) {
        groups.push(digits.substr(i, GROUP_SIZE));
      }

      let html = '';
      for (let i = 0; i < groups.length; i += GROUPS_PER_LINE) {
        const lineGroups = groups.slice(i, i + GROUPS_PER_LINE);
        html += '<div class="pi-line">' +
          lineGroups.map(g => '<span class="group">' + g + '</span>').join('') +
          '</div>';
      }
      return html;
    }

    function showBalloons() {
      const icons = ['🎈', '🎉', 'π', '🥳'];
      for (let i = 0; i < 16; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        balloon.textContent = icons[i % icons.length];
        balloon.style.left = Math.random() * 92 + 'vw';
        balloon.style.animationDelay = (Math.random() * 0.9) + 's';
        balloonLayer.appendChild(balloon);
        setTimeout(() => balloon.remove(), 4600);
      }
    }

    function finishRound() {
      clearInterval(timerId);
      timerId = null;
      timerValue.textContent = '0.0';
      timerValue.classList.remove('hurry');
      piBoard.classList.remove('playing');
      piBoard.innerHTML = '⏰ 시간 종료! 이제 눈을 가리고 외워 봅시다.';
      startButton.disabled = false;
      startButton.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i>다시 도전';
      showBalloons();
    }

    function startRound() {
      const maxStartIndex = PI_DIGITS.length - CHUNK_LENGTH;
      const startIndex = Math.floor(Math.random() * (maxStartIndex + 1));
      const endIndex = startIndex + CHUNK_LENGTH;
      const chunk = PI_DIGITS.slice(startIndex, endIndex);

      piBoard.classList.add('playing');
      piBoard.innerHTML = '<div>' + formatPiDigits(chunk) + '</div>';
      rangeInfo.textContent =
        'π 소수점 아래 ' + (startIndex + 1) + '번째 자리부터 ' + endIndex + '번째 자리까지의 숫자';

      startButton.disabled = true;
      startButton.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>외우는 중…';

      const endTime = Date.now() + COUNTDOWN_SECONDS * 1000;
      timerValue.textContent = COUNTDOWN_SECONDS.toFixed(1);

      timerId = setInterval(() => {
        const remaining = (endTime - Date.now()) / 1000;
        if (remaining <= 0) {
          finishRound();
          return;
        }
        timerValue.textContent = remaining.toFixed(1);
        timerValue.classList.toggle('hurry', remaining <= 5);
      }, 100);
    }

    startButton.addEventListener('click', startRound);

    // 스페이스바로도 시작 (전자칠판 편의)
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space' && !startButton.disabled) {
        event.preventDefault();
        startRound();
      }
    });
  </script>
</body>

</html>
