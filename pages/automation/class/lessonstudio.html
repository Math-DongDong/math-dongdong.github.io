      };

      /* ===== 13. PptxExporter / HtmlExporter ===== */

      // 화면 밖에 실제 크기(1280x720) 무대를 만들어 쓴다.
      const OffscreenStage = {
        host: null,
        acquire() {
          if (!OffscreenStage.host) {
            const host = document.createElement('div');
            host.style.cssText = 'position:fixed;left:-20000px;top:0;width:1280px;height:720px;z-index:-1;';
            document.body.append(host);
            OffscreenStage.host = host;
          }
          return OffscreenStage.host;
        },
        release() {
          if (OffscreenStage.host) { OffscreenStage.host.remove(); OffscreenStage.host = null; }
        },
        async renderSlide(lesson, slide) {
          const host = OffscreenStage.acquire();
          const result = SlideRenderer.render(lesson, slide, host, 'export', { scale: 1 });
          try { await document.fonts.ready; } catch (err) { /* 무시 */ }
          const images = Array.from(result.stage.querySelectorAll('img'));
          await Promise.all(images.map(img => img.complete ? Promise.resolve() :
            new Promise(resolve => { img.onload = img.onerror = resolve; })));
          await new Promise(resolve => setTimeout(resolve, 180));
          return result.stage;
        }
      };

      const PptxExporter = {
        lesson: null,

        openDialog(lesson) {
          PptxExporter.lesson = lesson;
          document.getElementById('ls-pptx-status').textContent = '';
          document.getElementById('ls-pptx-font').value = SettingsStore.all.pptxFont;
          document.getElementById('ls-pptx-progress').classList.add('d-none');
          bootstrap.Modal.getOrCreateInstance(document.getElementById('ls-modal-pptx')).show();
        },

        async run() {
          const lesson = PptxExporter.lesson;
          if (!lesson) return;
          const mode = (document.querySelector('input[name="ls-pptx-mode"]:checked') || {}).value || 'hybrid';
          const asPptTable = document.getElementById('ls-pptx-table').checked;
          const status = document.getElementById('ls-pptx-status');
          const progress = document.getElementById('ls-pptx-progress');
          const bar = progress.querySelector('.progress-bar');
          progress.classList.remove('d-none');

          let slides = lesson.slides;
          const hiddenCount = lesson.slides.filter(s => s.hidden).length;
          if (hiddenCount) {
            const include = await Util.confirm('숨긴 장 ' + hiddenCount + '개도 함께 내보낼까요?', { okText: '포함', cancelText: '제외' });
            if (!include) slides = lesson.slides.filter(s => !s.hidden);
          }

          try {
            status.textContent = '라이브러리를 불러오는 중…';
            const [PptxGenJS, htmlToImage] = await Promise.all([
              LibraryLoader.pptxgen(),
              LibraryLoader.htmlToImage()
            ]);
            await LibraryLoader.fileSaver().catch(() => null);

            // 수식이 있는 슬라이드면 KaTeX 글꼴을 한 번만 받아 두었다가 모든 수식 캡처에 쓴다.
            const hasMath = slides.some(slide => /\\\(|\\\[|\$\$/.test(slide.html || ''));
            const fontEmbedCss = hasMath ? await PptxExporter.katexFontCss() : '';

            const pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_WIDE';
            pptx.title = lesson.meta.title || '슬라이드';
            pptx.company = 'HTML 슬라이드 생성';
            const fontFace = document.getElementById('ls-pptx-font').value;
            SettingsStore.write(SettingsStore.KEYS.pptxFont, fontFace);

            for (let i = 0; i < slides.length; i++) {
              const slide = slides[i];
              status.textContent = (i + 1) + ' / ' + slides.length + '장 변환 중…';
              bar.style.width = Math.round((i / slides.length) * 100) + '%';

              const stage = await OffscreenStage.renderSlide(lesson, slide);
              const pptSlide = pptx.addSlide();
              if (slide.hidden) { try { pptSlide.hidden = true; } catch (err) { /* 무시 */ } }

              if (mode === 'image') {
                const png = await htmlToImage.toPng(stage, { pixelRatio: 2, skipFonts: true, width: STAGE_W, height: STAGE_H });
                pptSlide.addImage({ data: png, x: 0, y: 0, w: 13.333, h: 7.5 });
              } else {
                await PptxExporter.buildHybridSlide(pptSlide, stage, htmlToImage, fontFace, asPptTable, fontEmbedCss);
              }

              const notes = [];
              if (slide.script) notes.push('[시나리오]\n' + slide.script);
              if (slide.memo) notes.push('[메모]\n' + slide.memo);
              if (notes.length) pptSlide.addNotes(notes.join('\n\n'));
            }

            bar.style.width = '100%';
            status.textContent = '파일을 만드는 중…';
            let blob;
            try { blob = await pptx.write({ outputType: 'blob' }); }
            catch (err) { blob = await pptx.write('blob'); }
            Util.saveBlob(blob, Util.safeFileName(lesson.meta.title) + '_' + Util.todayStamp() + '.pptx');
            status.textContent = '완료했습니다.';
            Util.toast('PPTX를 내려받았습니다.', 'success');
          } catch (err) {
            status.textContent = '실패: ' + err.message;
            Util.toast('PPTX 내보내기에 실패했습니다: ' + err.message, 'danger');
          } finally {
            OffscreenStage.release();
          }
        },

        // KaTeX 글꼴을 data URI로 담은 CSS를 만든다(한 번만 받아 두고 재사용).
        async katexFontCss() {
          if (PptxExporter._katexFontCss != null) return PptxExporter._katexFontCss;
          PptxExporter._katexFontCss = '';
          try {
            const response = await fetch(CDN.katexCss);
            if (!response.ok) return '';
            const text = await response.text();
            const base = CDN.katexCss.replace(/[^/]+$/, '');
            const faces = text.match(/@font-face\s*{[^}]*}/g) || [];
            const families = ['KaTeX_Main', 'KaTeX_Math', 'KaTeX_Size1', 'KaTeX_Size2',
              'KaTeX_Size3', 'KaTeX_Size4', 'KaTeX_AMS', 'KaTeX_Caligraphic', 'KaTeX_Typewriter'];
            const deadline = Date.now() + 20000;
            let out = '';
            let count = 0;
            for (const face of faces) {
              if (count >= 24 || Date.now() > deadline) break;
              if (!families.some(name => face.indexOf(name) >= 0)) continue;
              const match = face.match(/url\(([^)]*\.woff2)\)/);
              if (!match) continue;
              const fontUrl = base + match[1].replace(/^['"]|['"]$/g, '');
              const fontResponse = await fetch(fontUrl);
              if (!fontResponse.ok) continue;
              const dataUrl = await Util.blobToDataUrl(await fontResponse.blob());
              out += face.replace(/src\s*:[^;]+;/, 'src: url(' + dataUrl + ') format("woff2");') + '\n';
              count++;
            }
            PptxExporter._katexFontCss = out;
          } catch (err) {
            PptxExporter._katexFontCss = '';
          }
          return PptxExporter._katexFontCss;
        },

        /* --- 하이브리드: 배경은 그림, 글은 글상자 --- */

        async buildHybridSlide(pptSlide, stage, htmlToImage, fontFace, asPptTable, fontEmbedCss) {
          const base = stage.getBoundingClientRect();
          const toInch = px => px / 96;
          const rectOf = el => {
            const rect = el.getBoundingClientRect();
            return {
              x: toInch(rect.left - base.left), y: toInch(rect.top - base.top),
              w: toInch(rect.width), h: toInch(rect.height)
            };
          };

          const groups = PptxExporter.classify(stage, asPptTable);
          const hideList = groups.textBlocks.concat(groups.photos, groups.graphics, groups.tables);
          const previous = hideList.map(el => el.style.visibility);
          hideList.forEach(el => { el.style.visibility = 'hidden'; });

          const backgroundPng = await htmlToImage.toPng(stage, { pixelRatio: 2, skipFonts: true, width: STAGE_W, height: STAGE_H });
          pptSlide.addImage({ data: backgroundPng, x: 0, y: 0, w: 13.333, h: 7.5 });

          hideList.forEach((el, i) => { el.style.visibility = previous[i] || ''; });

          for (const element of groups.graphics) {
            try {
              const isMath = element.classList.contains('katex') || element.classList.contains('katex-display') ||
                !!element.querySelector('.katex');
              const png = await htmlToImage.toPng(element, (isMath && fontEmbedCss)
                ? { pixelRatio: 2, fontEmbedCSS: fontEmbedCss }
                : { pixelRatio: 2, skipFonts: true });
              pptSlide.addImage(Object.assign({ data: png }, rectOf(element)));
            } catch (err) { /* 이 요소만 건너뛴다 */ }
          }

          for (const img of groups.photos) {
            try {
              const dataUrl = await PptxExporter.imageDataUrl(img);
              if (!dataUrl) continue;
              const box = rectOf(img);
              const fit = getComputedStyle(img).objectFit;
              const options = Object.assign({ data: dataUrl }, box);
              if (fit === 'cover' || fit === 'contain') {
                options.sizing = { type: fit === 'cover' ? 'cover' : 'contain', w: box.w, h: box.h };
              }
              const radius = parseFloat(getComputedStyle(img).borderRadius) || 0;
              if (radius > 0 && Math.abs(img.clientWidth - img.clientHeight) < 4 && radius >= img.clientWidth / 2 - 2) {
                options.rounding = true;
              }
              pptSlide.addImage(options);
            } catch (err) { /* 이 사진만 건너뛴다 */ }
          }

          for (const table of groups.tables) {
            try { PptxExporter.addTable(pptSlide, table, rectOf(table), fontFace); }
            catch (err) { /* 건너뛴다 */ }
          }

          groups.textBlocks.forEach(block => {
            const runs = PptxExporter.textRuns(block);
            if (!runs.length) return;
            const box = rectOf(block);
            const computed = getComputedStyle(block);
            const fontSize = parseFloat(computed.fontSize) || 24;
            const lineHeight = parseFloat(computed.lineHeight) || fontSize * 1.45;
            pptSlide.addText(runs, {
              x: box.x, y: box.y, w: box.w * 1.03, h: box.h,
              margin: 0, valign: 'top', fit: 'none', fontFace,
              align: ['left', 'center', 'right'].includes(computed.textAlign) ? computed.textAlign : 'left',
              lineSpacingMultiple: Math.max(0.6, Math.min(3, lineHeight / fontSize)),
              objectName: block.getAttribute('data-eid') || undefined
            });
          });
        },

        classify(stage, asPptTable) {
          const textBlocks = [];
          const photos = [];
          const graphics = [];
          const tables = [];

          const isGraphic = el => {
            const computed = getComputedStyle(el);
            if (computed.transform && computed.transform !== 'none') return true;
            if ((computed.webkitBackgroundClip || computed.backgroundClip) === 'text') return true;
            if (computed.writingMode && computed.writingMode !== 'horizontal-tb') return true;
            return false;
          };

          stage.querySelectorAll('svg').forEach(el => { if (!el.parentElement || !el.parentElement.closest('svg')) graphics.push(el); });
          stage.querySelectorAll('.katex-display, .katex').forEach(el => {
            if (!el.parentElement.closest('.katex')) graphics.push(el);
          });
          stage.querySelectorAll('table').forEach(el => { (asPptTable ? tables : graphics).push(el); });
          stage.querySelectorAll('img[src]').forEach(el => photos.push(el));

          const skip = el => graphics.some(g => g === el || g.contains(el))
            || tables.some(t => t === el || t.contains(el))
            || photos.some(p => p === el);

          stage.querySelectorAll('ul, ol').forEach(list => {
            if (skip(list)) return;
            if (list.querySelector('li')) textBlocks.push(list);
          });

          stage.querySelectorAll('[data-eid]').forEach(el => {
            if (skip(el)) return;
            if (el.closest('ul, ol') && textBlocks.includes(el.closest('ul, ol'))) return;
            if (textBlocks.some(block => block.contains(el))) return;
            if (isGraphic(el)) { graphics.push(el); return; }
            const hasOwnText = Array.from(el.childNodes).some(node => node.nodeType === 3 && node.textContent.trim());
            if (hasOwnText) textBlocks.push(el);
          });

          return { textBlocks, photos, graphics, tables };
        },

        async imageDataUrl(img) {
          const assetId = img.getAttribute('data-ls-asset');
          if (assetId) {
            const asset = await LessonStore.getAsset(assetId);
            if (asset) return await Util.blobToDataUrl(asset.blob);
          }
          const src = img.getAttribute('src') || '';
          if (src.startsWith('data:')) return src;
          if (src.startsWith('blob:')) {
            const response = await fetch(src);
            return await Util.blobToDataUrl(await response.blob());
          }
          return null;
        },

        // 한 블록 안의 strong/em/u/span을 text run으로 나눈다.
        textRuns(block) {
          const runs = [];
          const isList = ['UL', 'OL'].includes(block.tagName);

          const styleOf = node => {
            const computed = getComputedStyle(node);
            return {
              fontSize: Math.round((parseFloat(computed.fontSize) || 24) * 0.75),
              bold: parseInt(computed.fontWeight, 10) >= 600,
              italic: computed.fontStyle === 'italic',
              underline: computed.textDecorationLine.includes('underline') ? { style: 'sng' } : undefined,
              color: (Util.rgbToHex(computed.color) || '#000000').replace('#', '')
            };
          };

          const walk = (node, into) => {
            Array.from(node.childNodes).forEach(child => {
              if (child.nodeType === 3) {
                const text = child.textContent.replace(/\s+/g, ' ');
                if (!text.trim()) return;
                into.push({ text, options: styleOf(node) });
              } else if (child.nodeType === 1) {
                const tag = child.tagName.toLowerCase();
                if (tag === 'br') {
                  if (into.length) into[into.length - 1].options.breakLine = true;
                  else into.push({ text: '', options: { breakLine: true } });
                  return;
                }
                if (['img', 'svg'].includes(tag)) return;
                walk(child, into);
              }
            });
          };

          if (isList) {
            const bulletType = block.tagName === 'OL' ? { type: 'number' } : true;
            Array.from(block.children).forEach((li, index) => {
              const itemRuns = [];
              walk(li, itemRuns);
              if (!itemRuns.length) return;
              itemRuns.forEach(run => { run.options.bullet = bulletType; });
              itemRuns[itemRuns.length - 1].options.breakLine = index < block.children.length - 1;
              runs.push(...itemRuns);
            });
          } else {
            walk(block, runs);
          }
          return runs;
        },

        addTable(pptSlide, table, box, fontFace) {
          const rows = Array.from(table.rows).map(tr => Array.from(tr.cells).map(cell => {
            const computed = getComputedStyle(cell);
            return {
              text: cell.textContent.trim(),
              options: {
                fontSize: Math.round((parseFloat(computed.fontSize) || 24) * 0.75),
                bold: parseInt(computed.fontWeight, 10) >= 600,
                color: (Util.rgbToHex(computed.color) || '#000000').replace('#', ''),
                fill: Util.isTransparent(computed.backgroundColor) ? undefined
                  : { color: (Util.rgbToHex(computed.backgroundColor) || '#ffffff').replace('#', '') },
                colspan: cell.colSpan > 1 ? cell.colSpan : undefined,
                rowspan: cell.rowSpan > 1 ? cell.rowSpan : undefined
              }
            };
          }));
          const widths = Array.from(table.rows[0] ? table.rows[0].cells : []).map(cell => cell.getBoundingClientRect().width / 96);
          pptSlide.addTable(rows, {
            x: box.x, y: box.y, w: box.w, colW: widths.length ? widths : undefined,
            fontFace, border: { type: 'solid', pt: 0.5, color: 'CCCCCC' }
          });
        }
      };

      /* --- HTML 내보내기 --- */

      const HtmlExporter = {
        // 앱 스타일시트에서 디자인 키트 규칙만 모은다(중복 정의를 피하려고).
        kitCss() {
          let out = '';
          Array.from(document.styleSheets).forEach(sheet => {
            let rules;
            try { rules = sheet.cssRules; } catch (err) { return; }
            Array.from(rules || []).forEach(rule => {
              if (rule.type === CSSRule.KEYFRAMES_RULE) {
                if (/^ls-/.test(rule.name)) out += rule.cssText + '\n';
                return;
              }
              if (rule.type !== CSSRule.STYLE_RULE) return;
              if (!/\.ls-/.test(rule.selectorText)) return;
              if (/ls-thumb|ls-editor|ls-presenter|ls-screen|ls-handle|ls-guide|ls-path|ls-code|ls-swatch|ls-mini|ls-note|ls-print|ls-handout|ls-app|ls-fullscreen|ls-selected|ls-overflow/.test(rule.selectorText)) return;
              out += rule.cssText + '\n';
            });
          });
          return out;
        },

        async build(lesson, studentMode) {
          const theme = LessonModel.theme(lesson);
          const slides = LessonModel.visibleSlides(lesson);
          const parts = [];

          for (const slide of slides) {
            const stage = await OffscreenStage.renderSlide(lesson, slide);
            const clone = stage.cloneNode(true);
            // 이미지들을 data URI로 바꾼다
            const images = Array.from(clone.querySelectorAll('img'));
            for (const img of images) {
              const original = stage.querySelector('img[data-ls-asset="' + (img.getAttribute('data-ls-asset') || '') + '"]');
              const dataUrl = await PptxExporter.imageDataUrl(original || img);
              if (dataUrl) img.setAttribute('src', dataUrl);
              else img.removeAttribute('src');
              img.removeAttribute('data-ls-asset');
            }
            const scoped = SlideSanitizer.scopeCss(slide.css || '', slide.sid, []);
            parts.push({ slide, html: clone.innerHTML, css: scoped });
          }
          OffscreenStage.release();

          const metaJson = JSON.stringify({
            title: lesson.meta.title,
            theme, objectives: studentMode ? [] : (lesson.meta.objectives || []),
            phases: lesson.phases || []
          });

          const sections = parts.map(part => {
            const notes = studentMode ? '' :
              '<aside class="ls-notes" hidden><div class="ls-script">' + Util.escapeHtml(part.slide.script || '') +
              '</div><div class="ls-memo">' + Util.escapeHtml(part.slide.memo || '') + '</div></aside>';
            return '<section class="ls-slide" data-sid="' + part.slide.sid + '" data-phase="' +
              Util.escapeHtml(part.slide.phase || '') + '" data-minutes="' + (part.slide.minutes || 0) + '">' +
              (part.css ? '<style data-ls-css>' + part.css + '</style>' : '') +
              '<div class="ls-stage" data-ls-sid="' + part.slide.sid + '" style="' +
              SlideRenderer.themeCssText(theme) + '">' + part.html + '</div>' + notes + '</section>';
          }).join('\n');

          return [
            '<!DOCTYPE html>',
            '<html lang="ko"><head><meta charset="UTF-8">',
            '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
            '<meta name="generator" content="lesson-studio">',
            '<title>' + Util.escapeHtml(lesson.meta.title || '슬라이드') + '</title>',
            '<link rel="stylesheet" href="' + CDN.katexCss + '">',
            '<script type="application/json" id="ls-meta">' + metaJson.replace(/</g, '\\u003c') + '<\/script>',
            '<style>',
            'body{margin:0;background:#111;font-family:' + THEME_FONT + ';}',
            '.ls-deck{display:block}',
            '.ls-slide{display:none;align-items:center;justify-content:center;height:100vh}',
            '.ls-slide.active{display:flex}',
            '.ls-stage{width:1280px;height:720px;position:relative;overflow:hidden;transform-origin:center center;background:var(--ls-bg);color:var(--ls-fg);line-height:1.45}',
            '.ls-stage p,.ls-stage h1,.ls-stage h2,.ls-stage h3,.ls-stage h4,.ls-stage ul,.ls-stage ol{margin:0}',
            '.ls-stage ul,.ls-stage ol{padding-left:1.2em}',
            '.ls-stage img{max-width:100%}',
            '.ls-notes{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:#fff;border-top:2px solid #333;padding:12px 18px;font-size:16px;white-space:pre-wrap}',
            '.ls-bar{position:fixed;top:8px;right:12px;color:#aaa;font-size:14px;z-index:5}',
            HtmlExporter.kitCss(),
            '</style></head><body>',
            '<div class="ls-bar"><span id="ls-pos"></span> · ← → 넘기기 · F 전체 화면' + (studentMode ? '' : ' · N 시나리오') + '</div>',
            '<main class="ls-deck" data-ls-transition="' + (lesson.meta.transition || 'none') + '">', sections, '</main>',
            '<script>',
            HtmlExporter.viewerScript(studentMode),
            '<\/script></body></html>'
          ].join('\n');
        },

        viewerScript(studentMode) {
          return [
            '(function(){',
            'var slides=[].slice.call(document.querySelectorAll(".ls-slide"));',
            'var at=0, notesOn=false;',
            'function fit(){slides.forEach(function(s){var st=s.querySelector(".ls-stage");',
            'var k=Math.min(window.innerWidth/1280, window.innerHeight/720);st.style.transform="scale("+k+")";',
            'st.style.position="absolute";st.style.left=((window.innerWidth-1280)/2)+"px";st.style.top=((window.innerHeight-720)/2)+"px";});}',
            'var trans=(document.querySelector(".ls-deck").getAttribute("data-ls-transition")||"none");',
            'function show(i){at=Math.max(0,Math.min(slides.length-1,i));',
            'slides.forEach(function(s,n){s.classList.toggle("active",n===at);',
            '["fade","slide","zoom"].forEach(function(t){s.classList.remove("ls-trans-"+t);});});',
            'var cur=slides[at];',
            'if(cur&&trans!=="none"){cur.classList.add("ls-trans-"+trans);}',
            'var stg=cur&&cur.querySelector(".ls-stage");',
            'if(stg){stg.classList.remove("ls-animate");void stg.offsetWidth;stg.classList.add("ls-animate");}',
            'var box=document.getElementById("ls-pos");if(box)box.textContent=(at+1)+" / "+slides.length;',
            'document.querySelectorAll(".ls-notes").forEach(function(n,k){n.hidden=!(notesOn&&k===at);});fit();}',
            'document.addEventListener("keydown",function(e){',
            'if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ")show(at+1);',
            'if(e.key==="ArrowLeft"||e.key==="PageUp")show(at-1);',
            'if(e.key.toLowerCase()==="f"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}',
            studentMode ? '' : 'if(e.key.toLowerCase()==="n"){notesOn=!notesOn;show(at);}',
            '});',
            'window.addEventListener("resize",fit);show(0);})();'
          ].filter(Boolean).join('\n');
        },

        async download(lesson, studentMode) {
          Util.toast('HTML 파일을 만드는 중…');
          try {
            const html = await HtmlExporter.build(lesson, studentMode);
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            await LibraryLoader.fileSaver().catch(() => null);
            Util.saveBlob(blob, Util.safeFileName(lesson.meta.title) +
              (studentMode ? '_배포용_' : '_') + Util.todayStamp() + '.html');
            Util.toast('HTML 파일을 내려받았습니다.', 'success');
          } catch (err) {
            Util.toast('HTML 내보내기에 실패했습니다: ' + err.message, 'danger');
          }
        }
      };

      /* ===== 14. PptxImporter / HtmlImporter / PdfImporter ===== */

      const Xml = {
        parse(text) { return new DOMParser().parseFromString(text, 'application/xml'); },
        first(node, name) { return node ? node.getElementsByTagName(name)[0] || null : null; },
        all(node, name) { return node ? Array.from(node.getElementsByTagName(name)) : []; },
        childrenOf(node, name) {
          return node ? Array.from(node.children).filter(child => child.nodeName === name) : [];
        },
        attr(node, name, fallback) {
          if (!node) return fallback;
          const value = node.getAttribute(name);
          return value === null ? fallback : value;
        }
      };

      const PptxImporter = {
        EMU_PER_PX: 9525,

        async slideOrder(zip) {
          const presentationXml = zip.file('ppt/presentation.xml');
          if (!presentationXml) return Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort();
          const doc = Xml.parse(await presentationXml.async('string'));
          const relsFile = zip.file('ppt/_rels/presentation.xml.rels');
          const rels = relsFile ? PptxImporter.readRels(Xml.parse(await relsFile.async('string')), 'ppt/') : {};
          const ids = Xml.all(doc, 'p:sldId');
          const order = ids.map(node => rels[node.getAttribute('r:id')]).filter(Boolean);
          return order.length ? order : Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort();
        },

        readRels(relsDoc, baseDir) {
          const map = {};
          Xml.all(relsDoc, 'Relationship').forEach(rel => {
            const id = rel.getAttribute('Id');
            let target = rel.getAttribute('Target') || '';
            if (rel.getAttribute('TargetMode') === 'External') { map[id] = null; return; }
            target = target.replace(/^\.\.\//, '');
            map[id] = target.startsWith('/') ? target.slice(1)
              : (target.startsWith('ppt/') ? target : (baseDir + target).replace(/\/[^/]+\/\.\.\//g, '/'));
          });
          return map;
        },

        async relsFor(zip, path) {
          const dir = path.slice(0, path.lastIndexOf('/'));
          const name = path.slice(path.lastIndexOf('/') + 1);
          const file = zip.file(dir + '/_rels/' + name + '.rels');
          if (!file) return {};
          const parentDir = dir.replace(/\/[^/]+$/, '/');
          return PptxImporter.readRels(Xml.parse(await file.async('string')), parentDir);
        },

        async readNotes(zip, slidePath) {
          const rels = await PptxImporter.relsFor(zip, slidePath);
          const notesPath = Object.values(rels).find(target => target && /notesSlide\d+\.xml$/.test(target));
          if (!notesPath || !zip.file(notesPath)) return '';
          const doc = Xml.parse(await zip.file(notesPath).async('string'));
          const shapes = Xml.all(doc, 'p:sp').filter(sp => {
            const ph = Xml.first(sp, 'p:ph');
            const type = ph ? ph.getAttribute('type') : null;
            return type !== 'sldImg' && type !== 'sldNum';
          });
          return shapes.map(sp => Xml.all(sp, 'a:p').map(p => Xml.all(p, 'a:t').map(t => t.textContent).join('')).join('\n')).join('\n').trim();
        },

        async readTheme(zip) {
          const file = zip.file('ppt/theme/theme1.xml');
          const colors = { dk1: '#000000', lt1: '#ffffff', dk2: '#44546a', lt2: '#e7e6e6', accent1: '#4472c4', accent2: '#ed7d31', accent3: '#a5a5a5', accent4: '#ffc000', accent5: '#5b9bd5', accent6: '#70ad47', hlink: '#0563c1', folHlink: '#954f72' };
          if (!file) return colors;
          const doc = Xml.parse(await file.async('string'));
          const scheme = Xml.first(doc, 'a:clrScheme');
          if (!scheme) return colors;
          Array.from(scheme.children).forEach(node => {
            const key = node.nodeName.replace('a:', '');
            const srgb = Xml.first(node, 'a:srgbClr');
            const sys = Xml.first(node, 'a:sysClr');
            if (srgb) colors[key] = '#' + srgb.getAttribute('val');
            else if (sys) colors[key] = '#' + (sys.getAttribute('lastClr') || '000000');
          });
          return colors;
        },

        resolveColor(fillParent, theme) {
          if (!fillParent) return null;
          const srgb = Xml.first(fillParent, 'a:srgbClr');
          if (srgb) return '#' + srgb.getAttribute('val');
          const scheme = Xml.first(fillParent, 'a:schemeClr');
          if (scheme) {
            const name = scheme.getAttribute('val');
            const alias = { tx1: 'dk1', bg1: 'lt1', tx2: 'dk2', bg2: 'lt2' };
            return theme[alias[name] || name] || '#333333';
          }
          return null;
        },

        xfrmOf(node, scale) {
          const xfrm = Xml.first(node, 'a:xfrm');
          if (!xfrm) return null;
          const off = Xml.first(xfrm, 'a:off');
          const ext = Xml.first(xfrm, 'a:ext');
          if (!off || !ext) return null;
          return {
            x: parseInt(off.getAttribute('x'), 10) * scale,
            y: parseInt(off.getAttribute('y'), 10) * scale,
            w: parseInt(ext.getAttribute('cx'), 10) * scale,
            h: parseInt(ext.getAttribute('cy'), 10) * scale,
            rot: parseInt(Xml.attr(xfrm, 'rot', '0'), 10) / 60000,
            flipH: Xml.attr(xfrm, 'flipH', '0') === '1',
            flipV: Xml.attr(xfrm, 'flipV', '0') === '1'
          };
        },

        // 레이아웃·마스터에서 자리표시자의 위치를 물려받는다.
        async placeholderMap(zip, slidePath) {
          const map = {};
          const rels = await PptxImporter.relsFor(zip, slidePath);
          const layoutPath = Object.values(rels).find(target => target && /slideLayout\d+\.xml$/.test(target));
          const chain = [];
          if (layoutPath && zip.file(layoutPath)) {
            chain.push(layoutPath);
            const layoutRels = await PptxImporter.relsFor(zip, layoutPath);
            const masterPath = Object.values(layoutRels).find(target => target && /slideMaster\d+\.xml$/.test(target));
            if (masterPath && zip.file(masterPath)) chain.push(masterPath);
          }
          for (const path of chain.reverse()) {
            const doc = Xml.parse(await zip.file(path).async('string'));
            Xml.all(doc, 'p:sp').forEach(sp => {
              const ph = Xml.first(sp, 'p:ph');
              if (!ph) return;
              const key = (ph.getAttribute('type') || 'body') + ':' + (ph.getAttribute('idx') || '0');
              map[key] = sp;
              map[ph.getAttribute('type') || 'body'] = map[ph.getAttribute('type') || 'body'] || sp;
            });
          }
          return map;
        },

        textBodyToHtml(txBody, theme, scale, defaultPt) {
          const bodyPr = Xml.first(txBody, 'a:bodyPr');
          const anchor = Xml.attr(bodyPr, 'anchor', 't');
          const paragraphs = Xml.all(txBody, 'a:p');
          let html = '';
          let listOpen = null;

          paragraphs.forEach(p => {
            const pPr = Xml.first(p, 'a:pPr');
            const align = { l: 'left', ctr: 'center', r: 'right', just: 'justify' }[Xml.attr(pPr, 'algn', 'l')] || 'left';
            const level = parseInt(Xml.attr(pPr, 'lvl', '0'), 10);
            const isBullet = pPr && (Xml.first(pPr, 'a:buChar') || Xml.first(pPr, 'a:buAutoNum')) && !Xml.first(pPr, 'a:buNone');
            const isNumber = pPr && Xml.first(pPr, 'a:buAutoNum');

            let inner = '';
            Array.from(p.children).forEach(child => {
              if (child.nodeName === 'a:br') { inner += '<br>'; return; }
              if (child.nodeName !== 'a:r') return;
              const rPr = Xml.first(child, 'a:rPr');
              const text = Util.escapeHtml(Xml.all(child, 'a:t').map(t => t.textContent).join(''));
              if (!text) return;
              const pt = rPr && rPr.getAttribute('sz') ? parseInt(rPr.getAttribute('sz'), 10) / 100 : defaultPt;
              const px = Math.max(8, Math.round(pt * 12700 * scale));
              const color = PptxImporter.resolveColor(Xml.first(rPr, 'a:solidFill'), theme);
              const styles = ['font-size:' + px + 'px'];
              if (rPr && rPr.getAttribute('b') === '1') styles.push('font-weight:700');
              if (rPr && rPr.getAttribute('i') === '1') styles.push('font-style:italic');
              if (rPr && rPr.getAttribute('u') && rPr.getAttribute('u') !== 'none') styles.push('text-decoration:underline');
              if (color) styles.push('color:' + color);
              inner += '<span style="' + styles.join(';') + '">' + text + '</span>';
            });

            if (!inner) { if (!listOpen) html += '<p>&nbsp;</p>'; return; }

            if (isBullet) {
              const tag = isNumber ? 'ol' : 'ul';
              if (listOpen !== tag) {
                if (listOpen) html += '</' + listOpen + '>';
                html += '<' + tag + '>';
                listOpen = tag;
              }
              html += '<li style="margin-left:' + (level * 20) + 'px;text-align:' + align + '">' + inner + '</li>';
            } else {
              if (listOpen) { html += '</' + listOpen + '>'; listOpen = null; }
              html += '<p style="text-align:' + align + ';margin-left:' + (level * 20) + 'px">' + inner + '</p>';
            }
          });
          if (listOpen) html += '</' + listOpen + '>';
          return { html, anchor };
        },

        async shapeToHtml(context, node, offset) {
          const { theme, scale, rels, zip, media } = context;
          const name = node.nodeName;
          let out = '';

          if (name === 'p:grpSp') {
            const grpXfrm = Xml.first(node, 'a:xfrm');
            let childOffset = offset;
            if (grpXfrm) {
              const off = Xml.first(grpXfrm, 'a:off');
              const chOff = Xml.first(grpXfrm, 'a:chOff');
              if (off && chOff) {
                childOffset = {
                  x: offset.x + (parseInt(off.getAttribute('x'), 10) - parseInt(chOff.getAttribute('x'), 10)) * scale,
                  y: offset.y + (parseInt(off.getAttribute('y'), 10) - parseInt(chOff.getAttribute('y'), 10)) * scale
                };
              }
            }
            for (const child of Array.from(node.children)) {
              if (['p:sp', 'p:pic', 'p:grpSp', 'p:graphicFrame', 'mc:AlternateContent'].includes(child.nodeName)) {
                out += await PptxImporter.shapeToHtml(context, child, childOffset);
              }
            }
            return out;
          }

          if (name === 'mc:AlternateContent') {
            const fallback = Xml.first(node, 'mc:Fallback');
            if (fallback) {
              for (const child of Array.from(fallback.children)) {
                out += await PptxImporter.shapeToHtml(context, child, offset);
              }
              return out;
            }
            context.unconverted.push('호환 요소');
            return '';
          }

          let box = PptxImporter.xfrmOf(node, scale);
          if (!box && name === 'p:sp') {
            const ph = Xml.first(node, 'p:ph');
            if (ph) {
              const key = (ph.getAttribute('type') || 'body') + ':' + (ph.getAttribute('idx') || '0');
              const inherited = context.placeholders[key] || context.placeholders[ph.getAttribute('type') || 'body'];
              if (inherited) box = PptxImporter.xfrmOf(inherited, scale);
            }
          }
          if (!box) box = { x: 80, y: 80, w: 1120, h: 120, rot: 0 };
          box = { x: box.x + offset.x, y: box.y + offset.y, w: box.w, h: box.h, rot: box.rot, flipH: box.flipH, flipV: box.flipV };

          const transforms = [];
          if (box.rot) transforms.push('rotate(' + box.rot.toFixed(2) + 'deg)');
          if (box.flipH) transforms.push('scaleX(-1)');
          if (box.flipV) transforms.push('scaleY(-1)');
          const place = 'left:' + Math.round(box.x) + 'px;top:' + Math.round(box.y) + 'px;width:' +
            Math.round(box.w) + 'px;height:' + Math.round(box.h) + 'px' +
            (transforms.length ? ';transform:' + transforms.join(' ') : '');

          if (name === 'p:pic') {
            const blip = Xml.first(node, 'a:blip');
            const embed = blip && blip.getAttribute('r:embed');
            const target = embed ? rels[embed] : null;
            if (target && zip.file(target)) {
              if (/\.(emf|wmf)$/i.test(target)) {
                context.unconverted.push('EMF/WMF 그림');
                return '<div class="ls-abs ls-placeholder-box" style="' + place + '" data-ls-placeholder="그림(변환 안 됨)"></div>';
              }
              let assetId = media[target];
              if (!assetId) {
                const blob = await zip.file(target).async('blob');
                const typed = new Blob([blob], { type: PptxImporter.mimeOf(target) });
                const shrunk = await Util.shrinkImage(typed, LIMITS.imageMaxSide);
                assetId = await LessonStore.saveAsset(context.lessonId, shrunk.blob, shrunk);
                media[target] = assetId;
              }
              const fit = 'object-fit:cover';
              return '<img class="ls-abs" style="' + place + ';' + fit + '" src="asset:' + assetId + '" alt="">';
            }
            context.unconverted.push('그림');
            return '<div class="ls-abs ls-placeholder-box" style="' + place + '" data-ls-placeholder="그림"></div>';
          }

          if (name === 'p:graphicFrame') {
            const table = Xml.first(node, 'a:tbl');
            if (table) {
              const widths = Xml.all(table, 'a:gridCol').map(col => Math.round(parseInt(col.getAttribute('w'), 10) * scale));
              let html = '<table class="ls-table" style="width:100%">';
              Xml.all(table, 'a:tr').forEach(tr => {
                html += '<tr>';
                Xml.childrenOf(tr, 'a:tc').forEach((tc, index) => {
                  const span = parseInt(Xml.attr(tc, 'gridSpan', '1'), 10);
                  const rowSpan = parseInt(Xml.attr(tc, 'rowSpan', '1'), 10);
                  if (Xml.attr(tc, 'hMerge', '0') === '1' || Xml.attr(tc, 'vMerge', '0') === '1') return;
                  const txBody = Xml.first(tc, 'a:txBody');
                  const content = txBody ? PptxImporter.textBodyToHtml(txBody, theme, scale, 18).html : '';
                  const fill = PptxImporter.resolveColor(Xml.first(Xml.first(tc, 'a:tcPr'), 'a:solidFill'), theme);
                  html += '<td' + (span > 1 ? ' colspan="' + span + '"' : '') + (rowSpan > 1 ? ' rowspan="' + rowSpan + '"' : '') +
                    ' style="' + (fill ? 'background:' + fill + ';' : '') +
                    (widths[index] ? 'width:' + widths[index] + 'px' : '') + '">' + content + '</td>';
                });
                html += '</tr>';
              });
              html += '</table>';
              return '<div class="ls-abs" style="' + place + '">' + html + '</div>';
            }
            context.unconverted.push('차트/SmartArt');
            return '<div class="ls-abs ls-placeholder-box" style="' + place + '" data-ls-placeholder="차트(변환 안 됨)"></div>';
          }

          // p:sp — 도형 + 글
          const spPr = Xml.first(node, 'p:spPr');
          const prst = Xml.attr(Xml.first(spPr, 'a:prstGeom'), 'prst', 'rect');
          const fillColor = PptxImporter.resolveColor(Xml.first(spPr, 'a:solidFill'), theme);
          const line = Xml.first(spPr, 'a:ln');
          const lineColor = PptxImporter.resolveColor(line, theme);
          const lineWidth = line && line.getAttribute('w') ? Math.max(1, Math.round(parseInt(line.getAttribute('w'), 10) * scale)) : 0;
          const dash = line && Xml.first(line, 'a:prstDash');

          const styles = [place];
          if (fillColor && !Xml.first(spPr, 'a:noFill')) styles.push('background:' + fillColor);
          if (lineColor && lineWidth) {
            styles.push('border:' + lineWidth + 'px ' + (dash ? 'dashed' : 'solid') + ' ' + lineColor);
          }
          if (/roundRect/i.test(prst)) styles.push('border-radius:16px');
          if (/ellipse|circle/i.test(prst)) styles.push('border-radius:50%');
          if (/^line/i.test(prst) || prst === 'straightConnector1') styles.push('height:0');

          const txBody = Xml.first(node, 'p:txBody');
          let inner = '';
          let anchor = 't';
          if (txBody) {
            const ph = Xml.first(node, 'p:ph');
            const phType = ph ? ph.getAttribute('type') : null;
            const defaultPt = ['title', 'ctrTitle'].includes(phType) ? 44 : 24;
            const converted = PptxImporter.textBodyToHtml(txBody, theme, scale, defaultPt);
            inner = converted.html;
            anchor = converted.anchor;
          }
          if (anchor === 'ctr') styles.push('display:flex;flex-direction:column;justify-content:center');
          if (anchor === 'b') styles.push('display:flex;flex-direction:column;justify-content:flex-end');

          if (!inner && !fillColor && !lineColor) return '';
          return '<div class="ls-abs" style="' + styles.join(';') + '">' + inner + '</div>';
        },

        mimeOf(path) {
          if (/\.png$/i.test(path)) return 'image/png';
          if (/\.jpe?g$/i.test(path)) return 'image/jpeg';
          if (/\.gif$/i.test(path)) return 'image/gif';
          if (/\.webp$/i.test(path)) return 'image/webp';
          if (/\.svg$/i.test(path)) return 'image/svg+xml';
          return 'application/octet-stream';
        },

        async parse(file, lessonId) {
          const JSZip = await LibraryLoader.jszip();
          const zip = await JSZip.loadAsync(file);
          const theme = await PptxImporter.readTheme(zip);
          const presentation = Xml.parse(await zip.file('ppt/presentation.xml').async('string'));
          const size = Xml.first(presentation, 'p:sldSz');
          const cx = parseInt(Xml.attr(size, 'cx', '12192000'), 10);
          const cy = parseInt(Xml.attr(size, 'cy', '6858000'), 10);
          const scale = Math.min(STAGE_W / cx, STAGE_H / cy);
          const marginX = (STAGE_W - cx * scale) / 2;
          const marginY = (STAGE_H - cy * scale) / 2;

          const order = await PptxImporter.slideOrder(zip);
          const unconverted = [];
          const media = {};
          const slides = [];

          for (let i = 0; i < order.length; i++) {
            const path = order[i];
            const doc = Xml.parse(await zip.file(path).async('string'));
            const rels = await PptxImporter.relsFor(zip, path);
            const placeholders = await PptxImporter.placeholderMap(zip, path);
            const context = { theme, scale, rels, zip, media, unconverted, lessonId, placeholders };
            const tree = Xml.first(doc, 'p:spTree');
            let html = '';
            for (const child of Array.from(tree ? tree.children : [])) {
              if (['p:sp', 'p:pic', 'p:grpSp', 'p:graphicFrame', 'mc:AlternateContent'].includes(child.nodeName)) {
                html += await PptxImporter.shapeToHtml(context, child, { x: marginX, y: marginY });
              }
            }

            // 배경
            const bg = Xml.first(doc, 'p:bg');
            const bgColor = bg ? PptxImporter.resolveColor(Xml.first(bg, 'a:solidFill'), theme) : null;

            // 제목
            const titleShape = Xml.all(doc, 'p:sp').find(sp => {
              const ph = Xml.first(sp, 'p:ph');
              return ph && ['title', 'ctrTitle'].includes(ph.getAttribute('type'));
            });
            const title = titleShape
              ? Xml.all(titleShape, 'a:t').map(t => t.textContent).join('').trim().slice(0, 40)
              : '';

            const notes = await PptxImporter.readNotes(zip, path);
            let script = notes;
            let memo = '';
            const marker = notes.indexOf('[메모]');
            if (notes.startsWith('[시나리오]')) {
              script = (marker >= 0 ? notes.slice(0, marker) : notes).replace('[시나리오]', '').trim();
              if (marker >= 0) memo = notes.slice(marker).replace('[메모]', '').trim();
            }

            slides.push({
              title: title || ('슬라이드 ' + (i + 1)),
              html: '<div style="position:absolute;inset:0' + (bgColor ? ';background:' + bgColor : '') + '">' + html + '</div>',
              css: '',
              script, memo,
              hidden: Xml.attr(doc.documentElement, 'show', '1') === '0'
            });
          }

          return { slides, unconverted };
        }
      };

      const HtmlImporter = {
        parse(text, lessonId) {
          const doc = new DOMParser().parseFromString(text, 'text/html');
          const unconverted = [];
          const metaScript = doc.querySelector('#ls-meta');
          let meta = null;
          if (metaScript) {
            try { meta = JSON.parse(metaScript.textContent); } catch (err) { meta = null; }
          }

          let nodes = Array.from(doc.querySelectorAll('section.ls-slide'));
          let kind = 'lesson-studio';
          if (!nodes.length) {
            const selectors = ['.reveal .slides > section', 'section.slide', '.slide', '[data-slide]', '.step'];
            for (const selector of selectors) {
              const found = Array.from(doc.querySelectorAll(selector));
              if (found.length) { nodes = found; kind = 'deck'; break; }
            }
          }
          if (!nodes.length) {
            nodes = Array.from(doc.querySelectorAll('body > section'));
            kind = 'section';
          }
          if (!nodes.length) {
            // h1/h2 단위로 자른다
            kind = 'heading';
            const blocks = [];
            let current = null;
            Array.from(doc.body.children).forEach(child => {
              if (/^H[12]$/.test(child.tagName) || !current) {
                current = doc.createElement('div');
                blocks.push(current);
              }
              current.append(child.cloneNode(true));
            });
            nodes = blocks;
          }

          // 문서 수준 CSS 중 장 안 요소에 걸리는 규칙만 모은다
          let documentCss = '';
          Array.from(doc.querySelectorAll('style')).forEach(styleEl => {
            if (styleEl.hasAttribute('data-ls-css')) return;
            documentCss += styleEl.textContent + '\n';
          });

          const slides = nodes.map((node, index) => {
            let stage = node.querySelector('.ls-stage') || node;
            const own = node.querySelector('style[data-ls-css]');
            let css = own ? own.textContent : documentCss;
            if (own) {
              // 내보낼 때 붙인 범위 접두사를 떼어 낸다
              css = css.replace(/\.ls-stage\[data-ls-sid="[^"]*"\]\s?/g, '');
            }
            const holder = document.createElement('div');
            holder.innerHTML = stage.innerHTML;
            holder.querySelectorAll('style, script, link, iframe').forEach(el => el.remove());
            holder.querySelectorAll('img').forEach(img => {
              const src = img.getAttribute('src') || '';
              if (!src.startsWith('data:image/')) {
                unconverted.push('외부 이미지');
                img.removeAttribute('src');
                img.setAttribute('data-ls-placeholder', img.getAttribute('alt') || '외부 이미지');
              }
            });

            const notesNode = node.querySelector('aside.ls-notes, aside.notes, .notes, .speaker-notes');
            const script = notesNode ? (notesNode.querySelector('.ls-script') || notesNode).textContent.trim() : '';
            const memo = notesNode && notesNode.querySelector('.ls-memo') ? notesNode.querySelector('.ls-memo').textContent.trim() : '';
            if (notesNode && holder.contains(notesNode)) notesNode.remove();

            return {
              title: (node.getAttribute('data-title') || '').trim() || LessonModel.titleFromHtml(holder.innerHTML),
              html: holder.innerHTML,
              css,
              script, memo,
              phase: node.getAttribute('data-phase') || '',
              minutes: parseInt(node.getAttribute('data-minutes'), 10) || 2,
              hidden: false
            };
          });

          return { slides, meta, unconverted, kind };
        },

        // data: 이미지를 assets로 옮긴다.
        async moveDataImages(lessonId, slides) {
          for (const slide of slides) {
            const holder = document.createElement('div');
            holder.innerHTML = slide.html;
            const images = Array.from(holder.querySelectorAll('img[src^="data:image/"]'));
            for (const img of images) {
              try {
                const blob = Util.dataUrlToBlob(img.getAttribute('src'));
                const shrunk = await Util.shrinkImage(blob, LIMITS.imageMaxSide);
                const assetId = await LessonStore.saveAsset(lessonId, shrunk.blob, shrunk);
                img.setAttribute('src', 'asset:' + assetId);
              } catch (err) { img.removeAttribute('src'); }
            }
            slide.html = holder.innerHTML;
          }
        }
      };

      const PdfImporter = {
        async toImageSlides(file, lessonId, onStatus) {
          const pdfjs = await LibraryLoader.pdfjs();
          const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
          const slides = [];
          for (let pageNo = 1; pageNo <= doc.numPages; pageNo++) {
            if (onStatus) onStatus(pageNo + ' / ' + doc.numPages + '쪽 변환 중…');
            const page = await doc.getPage(pageNo);
            const viewport = page.getViewport({ scale: 1 });
            const scale = 1920 / Math.max(viewport.width, viewport.height);
            const scaled = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(scaled.width);
            canvas.height = Math.round(scaled.height);
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaled }).promise;
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const assetId = await LessonStore.saveAsset(lessonId, blob, { width: canvas.width, height: canvas.height });
            const content = await page.getTextContent();
            const text = content.items.map(item => item.str).join(' ').replace(/\s+/g, ' ').trim();
            slides.push({
              title: file.name + ' p.' + pageNo,
              html: '<img class="ls-abs" style="left:0;top:0;width:1280px;height:720px;object-fit:contain" src="asset:' + assetId + '" alt="">',
              css: '', script: text.slice(0, 2000), memo: '', minutes: 2, hidden: false
            });
          }
          return { slides, unconverted: [] };
        }
      };

      /* --- 가져오기 묶음 --- */

      const Importer = {
        async openFile(file) {
          if (!file) return;
          if (file.size > LIMITS.importFileBytes) { Util.toast('100MB가 넘는 파일은 열 수 없습니다.', 'warning'); return; }
          if (/\.ppt$/i.test(file.name)) {
            Util.toast('옛 .ppt 형식입니다. PowerPoint에서 .pptx로 저장 후 열어 주세요.', 'warning');
            return;
          }

          const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
          const isZip = head[0] === 0x50 && head[1] === 0x4b;
          const isPptx = /\.pptx$/i.test(file.name) && isZip;
          const isHtml = /\.html?$/i.test(file.name) && !isZip;
          if (!isPptx && !isHtml) {
            Util.toast('.pptx 또는 .html 파일만 이어서 편집할 수 있습니다.', 'warning');
            return;
          }

          Util.toast('파일을 읽는 중…');
          const lesson = LessonModel.create({ title: file.name.replace(/\.[^.]+$/, '') });
          let parsed;
          try {
            if (isPptx) parsed = await PptxImporter.parse(file, lesson.id);
            else {
              parsed = HtmlImporter.parse(await file.text(), lesson.id);
              await HtmlImporter.moveDataImages(lesson.id, parsed.slides);
              if (parsed.meta) {
                lesson.meta.title = parsed.meta.title || lesson.meta.title;
                lesson.meta.theme = THEMES[parsed.meta.theme] ? parsed.meta.theme : lesson.meta.theme;
                lesson.meta.objectives = parsed.meta.objectives || [];
                if (parsed.meta.phases && parsed.meta.phases.length) lesson.phases = parsed.meta.phases;
              }
            }
          } catch (err) {
            Util.toast('파일을 변환하지 못했습니다: ' + err.message, 'danger');
            return;
          }

          if (!parsed.slides.length) { Util.toast('장을 찾지 못했습니다.', 'warning'); return; }

          const origin = isPptx ? 'import-pptx' : 'import-html';
          parsed.slides.slice(0, LIMITS.maxSlides).forEach((item, index) => {
            const sid = 's' + Util.pad(index + 1, 2);
            const clean = SlideSanitizer.sanitizeSlide({ html: item.html, css: item.css || '', sid });
            lesson.slides.push(LessonModel.newSlide({
              sid,
              title: item.title || ('슬라이드 ' + (index + 1)),
              phase: item.phase || '',
              html: clean.html, css: clean.css,
              script: item.script || '', memo: item.memo || '',
              minutes: item.minutes || 2, hidden: !!item.hidden, origin
            }));
          });

          // 같은 제목의 슬라이드가 있으면 선택
          const existing = (await LessonStore.listLessons())
            .filter(item => !item.deletedAt && item.meta.title === lesson.meta.title);
          let targetId = lesson.id;
          if (existing.length) {
            const overwrite = await Util.confirm(
              '같은 제목의 슬라이드가 있습니다.\n기존 슬라이드를 덮어쓸까요? (취소하면 새로 가져옵니다)',
              { okText: '덮어쓰기', cancelText: '새로 가져오기', danger: true });
            if (overwrite) {
              VersionStore.add(existing[0], '가져오기 덮어쓰기 직전');
              targetId = existing[0].id;
              lesson.id = targetId;
              lesson.createdAt = existing[0].createdAt;
            }
          }

          await LessonStore.putLesson(lesson);
          // 덮어쓰기 확인창이 닫히는 동안을 기다렸다가 결과 모달을 띄운다
          await new Promise(resolve => setTimeout(resolve, 400));
          Importer.showResult(lesson, parsed, isPptx);
        },

        showResult(lesson, parsed, isPptx) {
          const box = document.createElement('div');
          const counts = {};
          (parsed.unconverted || []).forEach(name => { counts[name] = (counts[name] || 0) + 1; });
          const summary = document.createElement('p');
          const details = Object.keys(counts).map(name => name + ' ' + counts[name]).join(', ');
          summary.textContent = lesson.slides.length + '장 가져옴' + (details ? ' · 변환 못 한 요소: ' + details : '');
          box.append(summary);

          if (isPptx) {
            const note = document.createElement('p');
            note.className = 'small text-muted';
            note.textContent = '이 앱이 내보낸 PPTX를 다시 열면 글·사진·노트는 편집할 수 있고 디자인은 그림으로 남습니다. ' +
              '원래 HTML 디자인으로 이어서 편집하려면 이 도구에서 내려받은 HTML 파일을 쓰거나 [AI로 정돈하기]를 눌러 주세요.';
            box.append(note);
          }

          const start = document.createElement('button');
          start.className = 'btn btn-primary';
          start.textContent = '편집 시작';
          start.setAttribute('data-bs-dismiss', 'modal');
          start.addEventListener('click', () => App.go('#/edit/' + lesson.id));

          const tidy = document.createElement('button');
          tidy.className = 'btn btn-outline-primary';
          tidy.textContent = 'AI로 정돈하기';
          tidy.setAttribute('data-bs-dismiss', 'modal');
          tidy.addEventListener('click', () => {
            Importer.tidyAfterLoad = true;
            App.go('#/edit/' + lesson.id);
          });

          Util.showInfo('가져오기 결과', box, [start, tidy]);
        },

        // 편집기에서 가져온 장을 디자인 키트 기반으로 다시 그리게 한다.
        tidyAll() {
          if (!EditorView.lesson) return;
          EditorView.multi = EditorView.lesson.slides.map((slide, index) => index);
          EditorView.drawThumbs();
          const tab = document.querySelector('[data-prop-tab="ai"]');
          if (tab) tab.click();
          const target = document.getElementById('ls-ai-target');
          const instruction = document.getElementById('ls-ai-instruction');
          if (target) target.value = 'multi';
          if (instruction) {
            instruction.value = '절대 배치로 가져온 이 장들을 디자인 키트(ls-pad, ls-stack, ls-title, ls-body, ls-card 등)와 CSS 변수를 쓴 깔끔한 레이아웃으로 다시 그려라. 글과 이미지는 그대로 살리고 배치만 정돈하라.';
          }
          Util.toast('AI 수정 탭에서 [AI로 고치기]를 누르면 정돈합니다.');
        }
      };

      /* ===== 15. Router (해시) + 시작 ===== */

      const Router = {
        parse() {
          const raw = location.hash.replace(/^#/, '') || '/list';
          const [path, search] = raw.split('?');
          const query = {};
          new URLSearchParams(search || '').forEach((value, key) => { query[key] = value; });
          const parts = path.split('/').filter(Boolean);
          return { view: parts[0] || 'list', id: parts[1] || null, query };
        },

        async route() {
          const { view, id, query } = Router.parse();
          try {
            if (view === 'new') return await NewLessonView.show();
            if (view === 'edit' && id) {
              await EditorView.show(id);
              if (Importer.tidyAfterLoad) { Importer.tidyAfterLoad = false; setTimeout(() => Importer.tidyAll(), 400); }
              return;
            }
            if (view === 'present' && id) return await PresenterView.show(id, query);
            if (view === 'screen' && id) return await ScreenView.show(id);
            if (view === 'print' && id) return await PrintView.show(id, query);
            return await ListView.show();
          } catch (err) {
            Util.toast('화면을 여는 데 실패했습니다: ' + err.message, 'danger');
          }
        }
      };

      function boot() {
        App.main = document.getElementById('ls-main');

        // 모달·파일 입력 전역 연결
        document.getElementById('ls-modal-pptx').addEventListener('click', event => {
          if (event.target.closest('[data-act="run-pptx"]')) PptxExporter.run();
        });
        document.getElementById('ls-modal-diff').addEventListener('click', event => {
          if (event.target.closest('[data-act="diff-apply"]')) AiReviseTab.apply();
          if (event.target.closest('[data-act="diff-retry"]')) {
            bootstrap.Modal.getOrCreateInstance(document.getElementById('ls-modal-diff')).hide();
            AiReviseTab.run();
          }
        });
        document.getElementById('ls-offcanvas-versions').addEventListener('click', async event => {
          if (!EditorView.lesson) return;
          if (event.target.closest('[data-act="snapshot-now"]')) {
            VersionStore.add(EditorView.lesson, '직접 기록');
            Util.toast('지금 상태를 임시 기록에 남겼습니다.', 'success');
            VersionDrawer.open();
          }
          if (event.target.closest('[data-act="clear-versions"]')) {
            if (!(await Util.confirm('이 슬라이드의 임시 기록을 모두 지울까요?', { danger: true, okText: '지우기' }))) return;
            VersionStore.clear(EditorView.lesson.id);
            Util.toast('임시 기록을 지웠습니다.');
            VersionDrawer.open();
          }
        });
        document.getElementById('ls-file-import').addEventListener('change', async event => {
          const file = (event.target.files || [])[0];
          event.target.value = '';
          await Importer.openFile(file);
        });

        window.addEventListener('hashchange', Router.route);
        Router.route();
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>

</html>
