          for (const item of sources) {
            const file = item.file;
            if (onStatus) onStatus(file.name + ' 읽는 중…');
            const lower = file.name.toLowerCase();
            try {
              if (lower.endsWith('.pdf')) {
                const out = await extractPdf(file, budget, item.pageRange);
                parts.push(...out.parts);
                used.push({ name: file.name, kind: 'pdf', pages: out.pages, note: out.note });
              } else if (lower.endsWith('.pptx')) {
                const out = await extractPptxText(file, budget);
                parts.push(...out.parts);
                used.push({ name: file.name, kind: 'pptx', pages: out.pages, note: out.note });
              } else if (/^image\//.test(file.type)) {
                const shrunk = await Util.shrinkImage(file, 1600);
                if (shrunk.blob.size < budget.remaining) {
                  budget.remaining -= shrunk.blob.size;
                  parts.push({ text: '<자료 name="' + file.name + '" kind="image"></자료>' });
                  parts.push({ inlineData: { mimeType: shrunk.blob.type || 'image/png', data: await Util.blobToBase64(shrunk.blob) } });
                  used.push({ name: file.name, kind: 'image', pages: 1 });
                }
              } else {
                const text = await readText(file);
                parts.push({ text: '<자료 name="' + file.name + '" kind="text">\n' + text + '\n</자료>' });
                used.push({ name: file.name, kind: 'text', pages: 0 });
              }
            } catch (err) {
              Util.toast(file.name + ' 자료를 읽지 못했습니다: ' + err.message, 'warning');
            }
          }

          return { parts, used };
        }

        return { build, parsePageRange, extractPptxText };
      })();

      /* ===== 11. UndoHistory / VersionHistory ===== */

      function UndoHistory(limit) {
        const stack = [];
        let index = -1;
        return {
          reset(state) { stack.length = 0; stack.push(JSON.stringify(state)); index = 0; },
          push(state) {
            const snapshot = JSON.stringify(state);
            if (stack[index] === snapshot) return;
            stack.splice(index + 1);
            stack.push(snapshot);
            if (stack.length > (limit || LIMITS.undoSteps)) stack.shift();
            index = stack.length - 1;
          },
          canUndo() { return index > 0; },
          canRedo() { return index < stack.length - 1; },
          undo() { if (index > 0) { index--; return JSON.parse(stack[index]); } return null; },
          redo() { if (index < stack.length - 1) { index++; return JSON.parse(stack[index]); } return null; }
        };
      }

      /* ===== 12. PresentationSync (BroadcastChannel) ===== */

      function PresentationSync(lessonId, onMessage) {
        let channel = null;
        try { channel = new BroadcastChannel('lesson-studio:' + lessonId); } catch (err) { channel = null; }
        if (channel && onMessage) channel.onmessage = event => onMessage(event.data || {});
        return {
          post(message) { if (channel) { try { channel.postMessage(message); } catch (err) { /* 무시 */ } } },
          close() { if (channel) { try { channel.close(); } catch (err) { /* 무시 */ } } }
        };
      }

      // 같은 슬라이드를 두 탭에서 열었는지 확인한다.
      function EditLock(lessonId, onBusy) {
        let channel = null;
        try { channel = new BroadcastChannel('lesson-studio-lock:' + lessonId); } catch (err) { return { close() { } }; }
        const me = Util.uid('t_');
        channel.onmessage = event => {
          const data = event.data || {};
          if (data.type === 'hello' && data.from !== me) channel.postMessage({ type: 'busy', from: me });
          if (data.type === 'busy' && data.from !== me) onBusy();
        };
        channel.postMessage({ type: 'hello', from: me });
        return { close() { try { channel.close(); } catch (err) { /* 무시 */ } } };
      }

      /* ===== 10. 화면들 ===== */

      const App = {
        main: null,
        currentView: null,

        mount(templateId) {
          if (App.currentView && typeof App.currentView.destroy === 'function') {
            try { App.currentView.destroy(); } catch (err) { /* 무시 */ }
          }
          App.currentView = null;
          const tpl = document.getElementById(templateId);
          // 화면마다 <main>에 붙인 이벤트가 쌓이지 않도록 컨테이너를 통째로 새로 만든다.
          const fresh = document.createElement('main');
          fresh.id = 'ls-main';
          fresh.className = App.main.className;
          App.main.replaceWith(fresh);
          App.main = fresh;
          App.main.append(tpl.content.cloneNode(true));
          return App.main;
        },

        setFullscreenMode(on) {
          document.body.classList.toggle('ls-fullscreen-mode', !!on);
        },

        go(hash) { location.hash = hash; }
      };

      /* --- 목록 화면 --- */

      const ListView = {
        async show() {
          App.setFullscreenMode(false);
          document.body.classList.remove('ls-screen-body');
          const root = App.mount('tpl-list');
          const grid = root.querySelector('#ls-list-grid');

          // 첫 화면 입력창: 보내면 새로 만들기 화면에서 대화를 이어 간다.
          const composer = ChatComposer.create(root.querySelector('#ls-home-composer'), {
            placeholder: '어떤 슬라이드를 만들까요? 주제·분량·대상·분위기를 자유롭게 써 주세요.',
            onSend: (text, sources) => {
              NewLessonView.pending = { text, sources, meta: composer.readMeta(), autoSend: true };
              App.go('#/new');
            }
          });
          ListView.syncKeyState();

          async function draw() {
            const all = await LessonStore.listLessons();
            // 예전 휴지통에 남아 있던 항목은 더 보여 줄 곳이 없으므로 정리한다.
            for (const lesson of all.filter(item => item.deletedAt)) await LessonStore.deleteLesson(lesson.id);
            const list = all.filter(item => !item.deletedAt)
              .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
            grid.textContent = '';
            root.querySelector('#ls-list-heading').classList.toggle('d-none', !list.length);
            list.forEach(lesson => grid.append(ListView.card(lesson, draw)));
          }

          root.addEventListener('click', event => {
            const button = event.target.closest('[data-act]');
            if (!button) return;
            const act = button.dataset.act;
            if (act === 'settings') SettingsModal.open();
            if (act === 'open-file') document.getElementById('ls-file-import').click();
          });

          // 끌어다 놓기: PPTX·HTML은 이어서 편집, 그 밖의 자료는 입력창에 첨부
          const stop = event => { event.preventDefault(); event.stopPropagation(); };
          ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(type => root.addEventListener(type, stop));
          root.addEventListener('drop', async event => {
            const files = Array.from(event.dataTransfer.files || []);
            if (!files.length) return;
            if (/\.(pptx|html?)$/i.test(files[0].name)) await Importer.openFile(files[0]);
            else if (SettingsStore.hasApiKey()) composer.addFiles(files);
            else { NewLessonView.pending = { sources: files.map(file => ({ file, pageRange: '' })) }; App.go('#/new'); }
          });

          await draw();
          App.currentView = { destroy() { composer.destroy(); } };
        },

        // 키가 있으면 입력창을, 없으면 키 입력 안내를 보여 준다.
        syncKeyState() {
          const hasKey = SettingsStore.hasApiKey();
          const banner = document.getElementById('ls-nokey-banner');
          const chat = document.getElementById('ls-home-chat');
          if (banner) banner.classList.toggle('d-none', hasKey);
          if (chat) chat.classList.toggle('d-none', !hasKey);
        },

        card(lesson, refresh) {
          const col = document.createElement('div');
          col.className = 'col';
          const card = document.createElement('article');
          card.className = 'card h-100 shadow-sm';

          const thumbHost = document.createElement('div');
          thumbHost.className = 'ratio ratio-16x9 border-bottom overflow-hidden bg-light';
          card.append(thumbHost);

          const body = document.createElement('div');
          body.className = 'card-body';
          const title = document.createElement('h2');
          title.className = 'h6 fw-bold mb-1 text-truncate';
          title.textContent = lesson.meta.title || '제목 없음';
          const meta = document.createElement('p');
          meta.className = 'small text-muted mb-0';
          meta.textContent = [lesson.slides.length + '장', Util.formatWhen(lesson.updatedAt) + ' 수정']
            .filter(Boolean).join(' · ');
          body.append(title, meta);
          card.append(body);

          const footer = document.createElement('div');
          footer.className = 'card-footer bg-white d-flex flex-wrap gap-1';
          footer.append(
            ListView.button('편집', 'bi-pencil', () => App.go('#/edit/' + lesson.id)),
            ListView.button('발표', 'bi-play', () => App.go('#/present/' + lesson.id))
          );
          const group = document.createElement('div');
          group.className = 'btn-group btn-group-sm ms-auto';
          const toggle = document.createElement('button');
          toggle.className = 'btn btn-outline-secondary dropdown-toggle';
          toggle.setAttribute('data-bs-toggle', 'dropdown');
          toggle.innerHTML = '<i class="bi bi-three-dots"></i>';
          const menu = document.createElement('ul');
          menu.className = 'dropdown-menu dropdown-menu-end';
          [
            ['복제', async () => { await ListView.duplicate(lesson); refresh(); }],
            ['PPTX로 내려받기', () => PptxExporter.openDialog(lesson)],
            ['HTML로 내려받기', () => HtmlExporter.download(lesson, false)],
            ['PDF로 인쇄', () => window.open(location.pathname + '#/print/' + lesson.id + '?mode=slides', '_blank')],
            ['삭제', async () => {
              const ok = await Util.confirm('"' + (lesson.meta.title || '제목 없음') + '"을(를) 삭제할까요?\n되돌릴 수 없습니다.',
                { danger: true, okText: '삭제' });
              if (!ok) return;
              await LessonStore.deleteLesson(lesson.id);
              refresh();
            }]
          ].forEach(([label, handler]) => {
            const li = document.createElement('li');
            const item = document.createElement('button');
            item.className = 'dropdown-item';
            item.textContent = label;
            item.addEventListener('click', handler);
            li.append(item);
            menu.append(li);
          });
          group.append(toggle, menu);
          footer.append(group);
          card.append(footer);
          col.append(card);

          const cover = LessonModel.visibleSlides(lesson)[0] || lesson.slides[0];
          if (cover) {
            const holder = document.createElement('div');
            thumbHost.append(holder);
            requestAnimationFrame(() => {
              SlideRenderer.render(lesson, cover, holder, 'thumb', { scale: (thumbHost.clientWidth || 320) / STAGE_W, skipMath: true });
            });
          }
          return col;
        },

        button(label, icon, handler) {
          const el = document.createElement('button');
          el.className = 'btn btn-sm btn-outline-secondary';
          el.innerHTML = '<i class="bi ' + icon + '"></i> ';
          el.append(document.createTextNode(label));
          el.addEventListener('click', handler);
          return el;
        },

        async duplicate(lesson) {
          const copy = JSON.parse(JSON.stringify(lesson));
          copy.id = Util.uid('l_');
          copy.meta.title = (lesson.meta.title || '슬라이드') + ' (복제)';
          copy.createdAt = copy.updatedAt = Util.nowIso();
          copy.revision = 0;
          const map = await LessonStore.copyAssets(lesson.id, copy.id);
          copy.slides.forEach(slide => {
            slide.html = String(slide.html).replace(/asset:([A-Za-z0-9_]+)/g, (full, id) => 'asset:' + (map[id] || id));
          });
          await LessonStore.putLesson(copy);
          Util.toast('복제했습니다.', 'success');
          return copy;
        }
      };

      /* --- 테마 고르기 (견본 썸네일) --- */

      const ThemePicker = {
        // 디자인 키트로 그린 견본 한 장. 테마마다 이 장을 작게 그려 대략적인 모습을 보여 준다.
        SAMPLE: {
          sid: 's01',
          css: '',
          html: '<div class="ls-pad ls-stack" style="gap:28px">' +
            '<div class="ls-kicker">PRESENTATION</div>' +
            '<h1 class="ls-title">슬라이드 제목</h1>' +
            '<div class="ls-grid-2">' +
            '<div class="ls-card ls-body">카드 상자<br><span class="ls-muted">보조 설명 글</span></div>' +
            '<div class="ls-callout ls-body">강조 상자<br><span class="ls-accent-text">핵심 문장</span></div>' +
            '</div>' +
            '<div><span class="ls-badge">배지</span></div>' +
            '</div>'
        },

        build(host, value, onChange) {
          ThemePicker.release(host);
          host.textContent = '';
          host.className = 'row row-cols-2 row-cols-sm-3 g-2';
          const frames = [];
          Object.keys(THEMES).forEach(name => {
            const col = document.createElement('div');
            col.className = 'col';
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn btn-light border w-100 p-1 ls-theme-option';
            button.dataset.theme = name;
            const frame = document.createElement('div');
            frame.className = 'ls-thumb-frame';
            const label = document.createElement('div');
            label.className = 'small mt-1';
            label.textContent = THEMES[name].label;
            button.append(frame, label);
            button.addEventListener('click', () => {
              ThemePicker.select(host, name);
              if (onChange) onChange(name);
            });
            col.append(button);
            host.append(col);
            const drawn = SlideRenderer.render({ meta: { theme: name } }, ThemePicker.SAMPLE, frame, 'thumb', { scale: 0.1, skipMath: true });
            frames.push({ frame, drawn });
          });
          // 모달·접힌 칸 안에서는 처음 폭이 0이므로, 보이는 순간의 폭에 맞춰 다시 줄인다.
          const fit = () => frames.forEach(({ frame, drawn }) => {
            if (frame.clientWidth) SlideRenderer.scale(drawn.wrap, drawn.stage, frame.clientWidth / STAGE_W);
          });
          if (window.ResizeObserver) {
            host._themeObserver = new ResizeObserver(fit);
            frames.forEach(({ frame }) => host._themeObserver.observe(frame));
          }
          requestAnimationFrame(fit);
          ThemePicker.select(host, THEMES[value] ? value : DEFAULT_THEME);
        },

        select(host, name) {
          host.dataset.value = name;
          host.querySelectorAll('.ls-theme-option').forEach(button => {
            const on = button.dataset.theme === name;
            button.classList.toggle('active', on);
            button.setAttribute('aria-pressed', String(on));
          });
        },

        value(host) { return THEMES[host.dataset.value] ? host.dataset.value : DEFAULT_THEME; },

        release(host) {
          if (host && host._themeObserver) { host._themeObserver.disconnect(); host._themeObserver = null; }
        }
      };

      /* --- 설정 모달 --- */

      const SettingsModal = {
        _wired: false,

        open() {
          const el = document.getElementById('ls-modal-settings');
          SettingsModal.fill(el);
          SettingsModal.wire(el);
          bootstrap.Modal.getOrCreateInstance(el).show();
        },

        fill(el) {
          const settings = SettingsStore.all;
          el.querySelector('#ls-set-key').value = settings.apiKey;
          el.querySelector('#ls-set-remember').checked = SettingsStore.isKeyRemembered();
          el.querySelector('#ls-set-model').value = settings.model;
        },

        wire(el) {
          if (SettingsModal._wired) return;
          SettingsModal._wired = true;

          el.addEventListener('click', event => {
            if (!event.target.closest('[data-act="save-settings"]')) return;
            const key = el.querySelector('#ls-set-key').value.trim();
            const remember = el.querySelector('#ls-set-remember').checked;
            SettingsStore.saveApiKey(key, remember);
            SettingsStore.write(SettingsStore.KEYS.model, el.querySelector('#ls-set-model').value.trim() || DEFAULT_MODEL);
            SettingsStore.LEGACY_MODEL_KEYS.forEach(name => SettingsStore.write(name, null));
            bootstrap.Modal.getOrCreateInstance(el).hide();
            Util.toast(remember || !key ? 'AI 설정을 저장했습니다.' : 'AI 설정을 이 탭에만 적용했습니다. (브라우저 미저장)', 'success');
            ListView.syncKeyState();
          });
        }
      };

      /* --- 챗봇식 입력창 (첫 화면·새로 만들기 화면 공용) --- */

      const ChatComposer = {
        /**
         * options.placeholder: 안내 문구
         * options.onSend(text, sources): false를 돌려주면 입력 내용을 그대로 둔다.
         * options.usedBytes(): 이미 보낸 첨부 용량(합계 한도 계산용)
         */
        create(host, options) {
          host.textContent = '';
          host.append(document.getElementById('tpl-composer').content.cloneNode(true));
          const box = host.querySelector('.ls-composer');
          const input = box.querySelector('[data-role="input"]');
          const fileInput = box.querySelector('[data-role="file"]');
          const fileList = box.querySelector('[data-role="files"]');
          const optionsPane = box.querySelector('[data-role="options"]');
          const optionsToggle = box.querySelector('[data-role="toggle-options"]');
          const sendButton = box.querySelector('[data-role="send"]');
          const themeHost = box.querySelector('[data-opt="theme"]');
          if (options.placeholder) input.placeholder = options.placeholder;
          // 고른 테마는 다음 새 슬라이드의 기본값으로 기억한다.
          ThemePicker.build(themeHost, SettingsStore.all.theme, name => SettingsStore.write(SettingsStore.KEYS.theme, name));

          const composer = {
            sources: [],
            busy: false,

            focus() { input.focus(); },
            setText(text) { input.value = text; composer.autoSize(); input.focus(); },
            setPlaceholder(text) { input.placeholder = text; },

            setBusy(on) {
              composer.busy = on;
              sendButton.disabled = on;
              sendButton.innerHTML = on ? '<span class="spinner-border spinner-border-sm"></span>' : '<i class="bi bi-arrow-up"></i>';
            },

            autoSize() {
              input.style.height = 'auto';
              input.style.height = Math.min(input.scrollHeight + 2, 240) + 'px';
            },

            addFiles(files) { composer.addSources(files.map(file => ({ file, pageRange: '' }))); },

            addSources(list) {
              let total = (options.usedBytes ? options.usedBytes() : 0) +
                composer.sources.reduce((sum, s) => sum + s.file.size, 0);
              list.forEach(source => {
                const file = source.file;
                if (/\.ppt$/i.test(file.name)) {
                  Util.toast('옛 .ppt 형식입니다. PowerPoint에서 .pptx나 .pdf로 저장 후 올려 주세요.', 'warning');
                  return;
                }
                if (file.size > LIMITS.sourceFileBytes) {
                  Util.toast(file.name + ' 파일이 30MB를 넘습니다.', 'warning');
                  return;
                }
                if (total + file.size > LIMITS.sourceTotalBytes) {
                  Util.toast('첨부 합계 60MB를 넘습니다.', 'warning');
                  return;
                }
                total += file.size;
                composer.sources.push({ file, pageRange: source.pageRange || '' });
              });
              composer.drawFiles();
            },

            drawFiles() {
              fileList.textContent = '';
              fileList.classList.toggle('mb-1', composer.sources.length > 0);
              composer.sources.forEach((source, index) => {
                const chip = document.createElement('span');
                chip.className = 'd-inline-flex align-items-center gap-1 border rounded-pill bg-light px-2 py-1 small';
                const name = document.createElement('span');
                name.className = 'text-truncate';
                name.style.maxWidth = '220px';
                name.textContent = '📎 ' + source.file.name + ' (' + (source.file.size / 1048576).toFixed(1) + 'MB)';
                chip.append(name);
                if (/\.pdf$/i.test(source.file.name)) {
                  const range = document.createElement('input');
                  range.className = 'form-control form-control-sm py-0';
                  range.style.width = '90px';
                  range.placeholder = '쪽 3-8';
                  range.value = source.pageRange;
                  range.addEventListener('input', () => { source.pageRange = range.value; });
                  chip.append(range);
                }
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'btn-close btn-sm';
                remove.setAttribute('aria-label', '첨부 빼기');
                remove.addEventListener('click', () => {
                  composer.sources.splice(index, 1);
                  composer.drawFiles();
                });
                chip.append(remove);
                fileList.append(chip);
              });
            },

            readMeta() {
              return { theme: ThemePicker.value(themeHost) };
            },

            setMeta(meta) {
              ThemePicker.select(themeHost, THEMES[meta.theme] ? meta.theme : SettingsStore.all.theme);
            },

            send() {
              if (composer.busy) return;
              const text = input.value.trim();
              if (!text && !composer.sources.length) {
                Util.toast('만들고 싶은 내용을 쓰거나 자료를 첨부해 주세요.', 'warning');
                return;
              }
              if (options.onSend(text, composer.sources.slice()) === false) return;
              input.value = '';
              composer.sources = [];
              composer.drawFiles();
              composer.autoSize();
            },

            destroy() {
              ThemePicker.release(themeHost);
            }
          };

          input.addEventListener('input', () => composer.autoSize());
          input.addEventListener('keydown', event => {
            // 한글 조합 중 Enter는 글자 확정용이므로 보내지 않는다.
            if (event.key !== 'Enter' || event.shiftKey || event.isComposing || event.keyCode === 229) return;
            event.preventDefault();
            composer.send();
          });
          input.addEventListener('paste', event => {
            const files = Array.from((event.clipboardData && event.clipboardData.files) || []);
            if (!files.length) return;
            event.preventDefault();
            composer.addFiles(files);
          });
          sendButton.addEventListener('click', () => composer.send());
          box.querySelector('[data-role="attach"]').addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', () => {
            composer.addFiles(Array.from(fileInput.files || []));
            fileInput.value = '';
          });
          optionsToggle.addEventListener('click', () => {
            const open = optionsPane.classList.toggle('d-none') === false;
            optionsToggle.classList.toggle('active', open);
          });
          ['dragenter', 'dragover'].forEach(type => box.addEventListener(type, event => {
            event.preventDefault(); event.stopPropagation(); box.classList.add('border-primary');
          }));
          ['dragleave', 'drop'].forEach(type => box.addEventListener(type, event => {
            event.preventDefault(); event.stopPropagation(); box.classList.remove('border-primary');
          }));
          box.addEventListener('drop', event => composer.addFiles(Array.from(event.dataTransfer.files || [])));

          return composer;
        }
      };

      /* --- 새로 만들기 화면 (챗봇식 대화) --- */

      const NewLessonView = {
        pending: null,       // 첫 화면에서 넘어온 요청 { text, sources, meta, autoSend }
        session: null,       // 대화를 새로 시작하면 바뀐다(늦게 온 응답 무시용)
        composer: null,
        sources: [],         // 이번 대화에서 보낸 자료 전체
        sourcesDirty: false,
        sourceParts: [],
        sourcesUsed: [],
        request: '',
        outline: null,
        meta: null,
        busy: false,
        aborter: null,

        async show() {
          App.setFullscreenMode(false);
          const root = App.mount('tpl-new');
          const session = {};
          Object.assign(NewLessonView, {
            session, sources: [], sourcesDirty: false, sourceParts: [], sourcesUsed: [],
            request: '', outline: null, meta: null, busy: false, aborter: null
          });

          const composer = ChatComposer.create(root.querySelector('#ls-chat-composer'), {
            placeholder: '어떤 슬라이드를 만들까요? 주제·분량·대상·분위기를 자유롭게 써 주세요.',
            onSend: (text, sources) => NewLessonView.send(root, text, sources),
            usedBytes: () => NewLessonView.sources.reduce((sum, s) => sum + s.file.size, 0)
          });
          NewLessonView.composer = composer;

          NewLessonView.bubble(root, 'ai',
            '어떤 슬라이드를 만들까요? 주제와 분량, 보여 줄 대상, 원하는 분위기를 자유롭게 말해 주세요.\n' +
            'PDF·PPTX·이미지 자료를 첨부하면 그 내용을 바탕으로 구성합니다. 먼저 목차를 보여 드리고, 마음에 들면 슬라이드를 만듭니다.');

          root.addEventListener('click', event => {
            const button = event.target.closest('[data-act]');
            if (!button) return;
            const act = button.dataset.act;
            if (act === 'back') App.go('#/list');
            if (act === 'restart') NewLessonView.show();
            if (act === 'outline-add') NewLessonView.addOutlineRow(root, { title: '새 장', phase: '전개', points: [], designHint: '', minutes: 3 });
            if (act === 'make-slides') NewLessonView.makeSlides(root);
            if (act === 'gen-abort' && NewLessonView.aborter) NewLessonView.aborter.abort();
          });

          const pending = NewLessonView.pending;
          NewLessonView.pending = null;
          if (pending) {
            if (pending.meta) composer.setMeta(pending.meta);
            if (pending.sources) composer.addSources(pending.sources);
            if (pending.text) composer.setText(pending.text);
            if (pending.autoSend) composer.send();
          }
          composer.focus();

          App.currentView = {
            destroy() {
              if (NewLessonView.session === session) NewLessonView.session = null;
              if (NewLessonView.aborter) NewLessonView.aborter.abort();
              composer.destroy();
            }
          };
        },

        // 보낸 말: 목차가 없으면 새 요청, 목차가 있으면 고칠 점으로 받는다.
        send(root, text, sources) {
          if (NewLessonView.busy) return false;
          if (!SettingsStore.hasApiKey()) {
            Util.toast('먼저 AI 설정에서 Gemini API 키를 입력해 주세요.', 'warning');
            SettingsModal.open();
            return false;
          }
          NewLessonView.bubble(root, 'user', text, sources);
          if (sources.length) {
            NewLessonView.sources = NewLessonView.sources.concat(sources);
            NewLessonView.sourcesDirty = true;
          }
          if (NewLessonView.outline) NewLessonView.fixOutline(root, text, sources.length > 0);
          else NewLessonView.makeOutline(root, text);
          return true;
        },

        /** 대화 말풍선을 붙이고, 내용을 바꿀 수 있는 손잡이를 돌려준다. */
        bubble(root, role, text, sources) {
          const log = root.querySelector('#ls-chat-log');
          const row = document.createElement('div');
          const body = document.createElement('div');
          const textEl = document.createElement('div');
          textEl.className = 'ls-chat-text';
          body.append(textEl);

          if (role === 'user') {
            row.className = 'd-flex justify-content-end';
            body.className = 'bg-primary text-white rounded-4 px-3 py-2 ls-chat-bubble';
            textEl.textContent = text || '(첨부한 자료로 만들어 주세요)';
            if (sources && sources.length) {
              const files = document.createElement('div');
              files.className = 'small opacity-75 mt-1';
              files.textContent = sources.map(s => '📎 ' + s.file.name + (s.pageRange ? ' (' + s.pageRange + '쪽)' : '')).join('  ');
              body.append(files);
            }
            row.append(body);
          } else {
            row.className = 'd-flex align-items-start gap-2';
            const avatar = document.createElement('div');
            avatar.className = 'rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center flex-shrink-0 ls-chat-avatar';
            avatar.innerHTML = '<i class="bi bi-stars"></i>';
            body.className = 'bg-light border rounded-4 px-3 py-2 ls-chat-bubble';
            textEl.textContent = text || '';
            row.append(avatar, body);
          }
          log.append(row);
          row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

          return {
            wait(message) {
              textEl.className = 'ls-chat-text text-muted';
              textEl.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>';
              textEl.append(document.createTextNode(message));
            },
            say(message) {
              textEl.className = 'ls-chat-text';
              textEl.textContent = message;
            },
            fail(message) {
              textEl.className = 'ls-chat-text text-danger';
              textEl.textContent = '⚠ ' + message + '\n다시 보내 보세요.';
            },
            attach(node) {
              const previous = node.parentElement;
              if (previous && previous.classList.contains('ls-chat-bubble')) previous.classList.remove('ls-wide');
              body.classList.add('ls-wide');
              body.append(node);
              node.classList.remove('d-none');
              row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
          };
        },

        setBusy(on) {
          NewLessonView.busy = on;
          if (NewLessonView.composer) NewLessonView.composer.setBusy(on);
          App.main.querySelectorAll('[data-act="make-slides"], [data-act="outline-add"]').forEach(button => {
            button.disabled = on;
          });
        },

        metaText(meta) {
          return [
            '- 장 수·말투·확인 문제·요약 장·수식 사용: 요청에 적힌 대로 따르고, 없으면 내용에 맞게 정한다',
            '- 테마: ' + (THEMES[meta.theme] ? THEMES[meta.theme].label : meta.theme),
            '- 발표 대본(script): 장마다 작성'
          ].join('\n');
        },

        // 새로 받은 자료가 있으면 Gemini에 보낼 형태로 다시 만든다.
        async prepareSources(reply) {
          if (!NewLessonView.sourcesDirty) return;
          const built = await SourceExtractor.build(NewLessonView.sources, status => reply.wait(status));
          NewLessonView.sourceParts = built.parts;
          NewLessonView.sourcesUsed = built.used;
          NewLessonView.sourcesDirty = false;
        },

        async makeOutline(root, text) {
          const session = NewLessonView.session;
          const meta = NewLessonView.composer.readMeta();
          NewLessonView.request = text || NewLessonView.request;
          meta.request = NewLessonView.request;

          const reply = NewLessonView.bubble(root, 'ai');
          reply.wait('요청을 읽고 있어요…');
          NewLessonView.setBusy(true);
          NewLessonView.aborter = new AbortController();
          try {
            await NewLessonView.prepareSources(reply);
            reply.wait('목차를 짜는 중…');
            const parts = [{
              text: '아래 조건으로 발표 슬라이드의 목차(구조)를 만들어라.\n\n[요청]\n' + (meta.request || '(첨부 자료 중심으로 구성)') +
                '\n\n[조건]\n' + NewLessonView.metaText(meta)
            }].concat(NewLessonView.sourceParts);

            const result = await GeminiService.generateJson({
              model: SettingsStore.all.model,
              parts,
              schema: SCHEMAS.outline,
              signal: NewLessonView.aborter.signal
            });
            if (session !== NewLessonView.session) return;
            NewLessonView.meta = meta;
            NewLessonView.showOutline(root, reply, result,
              '“' + (result.title || '새 슬라이드') + '” 목차를 ' + (result.slides || []).length + '장으로 잡았어요.\n' +
              '표에서 바로 고치거나, 아래 입력창에 고칠 점을 말해 주세요. 마음에 들면 [이대로 슬라이드 만들기]를 누르세요.');
          } catch (err) {
            if (session !== NewLessonView.session) return;
            if (err.needsKey) SettingsModal.open();
            reply.fail(err.message);
          } finally {
            if (session === NewLessonView.session) NewLessonView.setBusy(false);
          }
        },

        async fixOutline(root, text, withNewFiles) {
          const session = NewLessonView.session;
          const current = NewLessonView.readOutline(root);
          const meta = Object.assign(NewLessonView.composer.readMeta(), { request: NewLessonView.request });

          const reply = NewLessonView.bubble(root, 'ai');
          reply.wait('목차를 고치는 중…');
          NewLessonView.setBusy(true);
          NewLessonView.aborter = new AbortController();
          try {
            await NewLessonView.prepareSources(reply);
            reply.wait('목차를 고치는 중…');
            const result = await GeminiService.generateJson({
              model: SettingsStore.all.model,
              parts: [{
                text: '아래 목차를 요청대로 고쳐서 같은 형식으로 다시 출력하라.\n\n[처음 요청]\n' + (meta.request || '(첨부 자료 중심으로 구성)') +
                  '\n\n[현재 목차]\n' + JSON.stringify(current) +
                  '\n\n[고칠 점]\n' + (text || '새로 첨부한 자료 내용을 반영해 줘') +
                  '\n\n[조건]\n' + NewLessonView.metaText(meta)
              }].concat(withNewFiles ? NewLessonView.sourceParts : []),
              schema: SCHEMAS.outline,
              signal: NewLessonView.aborter.signal
            });
            if (session !== NewLessonView.session) return;
            NewLessonView.meta = meta;
            NewLessonView.showOutline(root, reply, result,
              '목차를 고쳤어요. 지금 ' + (result.slides || []).length + '장입니다. 더 고칠 점이 있으면 말해 주세요.');
          } catch (err) {
            if (session !== NewLessonView.session) return;
            reply.fail(err.message);
          } finally {
            if (session === NewLessonView.session) NewLessonView.setBusy(false);
          }
        },

        // 목차 카드를 가장 최근 AI 답 아래로 옮겨 붙인다.
        showOutline(root, reply, outline, message) {
          NewLessonView.outline = outline;
          NewLessonView.drawOutline(root, outline);
          reply.say(message);
          reply.attach(root.querySelector('#ls-outline-card'));
          NewLessonView.composer.setPlaceholder('고칠 점을 말해 주세요. 예) 3장을 두 장으로 나누고, 마지막에 퀴즈를 넣어 줘');
        },

        drawOutline(root, outline) {
          root.querySelector('#ls-outline-title').value = outline.title || '새 슬라이드';
          root.querySelector('#ls-outline-objectives').value = (outline.objectives || []).join('\n');
          const body = root.querySelector('#ls-outline-body');
          body.textContent = '';
          (outline.slides || []).forEach(slide => NewLessonView.addOutlineRow(root, slide));
          NewLessonView.updateOutlineSum(root);
          if (body.dataset.sortable) return;
          body.dataset.sortable = '1';
          LibraryLoader.sortable().then(Sortable => {
            Sortable.create(body, { handle: '.ls-drag', animation: 150, onEnd: () => NewLessonView.renumber(root) });
          }).catch(() => { /* 순서 바꾸기만 못 쓴다 */ });
        },

        addOutlineRow(root, slide) {
          const body = root.querySelector('#ls-outline-body');
          const tr = document.createElement('tr');

          const handle = document.createElement('td');
          handle.className = 'ls-drag text-muted';
          handle.style.cursor = 'grab';
          handle.innerHTML = '<i class="bi bi-grip-vertical"></i>';

          const number = document.createElement('td');
          number.className = 'ls-rownum small text-muted';

          const make = (value, cls) => {
            const td = document.createElement('td');
            const input = document.createElement('input');
            input.className = 'form-control form-control-sm ' + (cls || '');
            input.value = value || '';
            td.append(input);
            return { td, input };
          };

          const title = make(slide.title, 'ls-f-title');
          const phase = make(slide.phase, 'ls-f-phase');
          const points = make((slide.points || []).join(' / '), 'ls-f-points');
          const hint = make(slide.designHint, 'ls-f-hint');
          const minutes = make(slide.minutes, 'ls-f-min');
          minutes.input.type = 'number';
          minutes.input.addEventListener('input', () => NewLessonView.updateOutlineSum(root));

          const remove = document.createElement('td');
          const removeButton = document.createElement('button');
          removeButton.className = 'btn btn-sm btn-outline-danger py-0 px-1';
          removeButton.innerHTML = '<i class="bi bi-x"></i>';
          removeButton.addEventListener('click', () => { tr.remove(); NewLessonView.renumber(root); NewLessonView.updateOutlineSum(root); });
          remove.append(removeButton);

          tr.append(handle, number, title.td, phase.td, points.td, hint.td, minutes.td, remove);
          body.append(tr);
          NewLessonView.renumber(root);
        },

        renumber(root) {
          root.querySelectorAll('#ls-outline-body tr').forEach((tr, index) => {
            tr.querySelector('.ls-rownum').textContent = String(index + 1);
          });
        },

        readOutline(root) {
          const slides = Array.from(root.querySelectorAll('#ls-outline-body tr')).map(tr => ({
            title: tr.querySelector('.ls-f-title').value.trim() || '제목 없는 장',
            phase: tr.querySelector('.ls-f-phase').value.trim() || '전개',
            points: tr.querySelector('.ls-f-points').value.split('/').map(s => s.trim()).filter(Boolean),
            designHint: tr.querySelector('.ls-f-hint').value.trim(),
            minutes: parseInt(tr.querySelector('.ls-f-min').value, 10) || 2
          }));
          return {
            title: root.querySelector('#ls-outline-title').value.trim() || '새 슬라이드',
            objectives: root.querySelector('#ls-outline-objectives').value.split('\n').map(s => s.trim()).filter(Boolean),
            phases: NewLessonView.outline && NewLessonView.outline.phases ? NewLessonView.outline.phases : PHASE_DEFAULT,
            slides
          };
        },

        updateOutlineSum(root) {
          const outline = NewLessonView.readOutline(root);
          const total = outline.slides.reduce((sum, s) => sum + s.minutes, 0);
          root.querySelector('#ls-outline-sum').textContent = outline.slides.length + '장 · 합계 ' + total + '분';
        },

        async makeSlides(root) {
          if (NewLessonView.busy) return;
          const outline = NewLessonView.readOutline(root);
          if (!outline.slides.length) { Util.toast('장이 없습니다.', 'warning'); return; }
          if (outline.slides.length > LIMITS.maxSlides) { Util.toast('장표는 ' + LIMITS.maxSlides + '장까지 만들 수 있습니다.', 'warning'); return; }

          const session = NewLessonView.session;
          const meta = Object.assign(NewLessonView.composer.readMeta(), { request: NewLessonView.request });
          NewLessonView.setBusy(true);
          const reply = NewLessonView.bubble(root, 'ai', outline.slides.length + '장을 만들고 있어요. 다 되면 편집 화면으로 넘어갑니다.');
          reply.attach(root.querySelector('#ls-gen-card'));
          const bar = root.querySelector('#ls-gen-bar');
          const status = root.querySelector('#ls-gen-status');
          const thumbs = root.querySelector('#ls-gen-thumbs');
          thumbs.textContent = '';

          const lesson = LessonModel.create({
            title: outline.title, objectives: outline.objectives, theme: meta.theme
          });
          lesson.phases = outline.phases && outline.phases.length ? outline.phases : PHASE_DEFAULT;
          lesson.sourcesUsed = NewLessonView.sourcesUsed || [];
          lesson.ai = { model: SettingsStore.all.model, promptSummary: (meta.request || '').slice(0, 300) };

          NewLessonView.aborter = new AbortController();
          const signal = NewLessonView.aborter.signal;
          const sourceParts = NewLessonView.sourceParts || [];
          const outlineText = outline.slides.map((s, i) => (i + 1) + '. [' + s.phase + '] ' + s.title +
            ' — ' + (s.points || []).join(' / ') + ' (' + s.minutes + '분)').join('\n');

          let designRef = null;
          const BATCH = 3;

          for (let start = 0; start < outline.slides.length; start += BATCH) {
            if (signal.aborted) break;
            const chunk = outline.slides.slice(start, start + BATCH);
            status.textContent = (start + 1) + '~' + (start + chunk.length) + '번 장을 만드는 중…';

            const askText = [
              '다음 발표 자료의 슬라이드를 만들어라.',
              '',
              '[사용자의 요청]',
              meta.request || '(첨부 자료 중심으로 구성)',
              '',
              '[발표 자료 정보]',
              '- 제목: ' + outline.title,
              NewLessonView.metaText(meta),
              '',
              '[전체 목차]',
              outlineText,
              '',
              '[이번에 만들 장]',
              chunk.map((s, i) => (start + i + 1) + '. [' + s.phase + '] ' + s.title +
                '\n   핵심: ' + (s.points || []).join(' / ') +
                '\n   디자인 힌트: ' + (s.designHint || '') +
                '\n   예상 시간: ' + s.minutes + '분').join('\n'),
              '',
              'slides 배열에 정확히 ' + chunk.length + '개를 같은 순서로 출력하라.',
              designRef ? '\n[디자인 기준 장]\nHTML:\n' + designRef.html + '\nCSS:\n' + designRef.css : ''
            ].join('\n');

            let got = null;
            for (let attempt = 0; attempt < 2 && !got; attempt++) {
              try {
                const result = await GeminiService.generateJson({
                  model: SettingsStore.all.model,
                  parts: [{ text: askText }].concat(sourceParts),
                  schema: SCHEMAS.slides,
                  signal,
                  onProgress: length => { status.textContent = '작성 중… ' + length + '자'; }
                });
                if (result && Array.isArray(result.slides) && result.slides.length) got = result.slides;
              } catch (err) {
                if (signal.aborted) break;
                if (attempt === 1) Util.toast(err.message, 'danger');
              }
            }
            if (session !== NewLessonView.session) return;
            if (signal.aborted) break;

            const made = got || chunk.map(s => ({
              title: s.title, phase: s.phase, html: '', css: '', script: '', memo: 'AI 생성 실패 — 편집기에서 "AI로 채우기"를 눌러 주세요.', minutes: s.minutes
            }));

            made.slice(0, chunk.length).forEach((item, i) => {
              const sid = 's' + Util.pad(lesson.slides.length + 1, 2);
              const html = item.html || '<div class="ls-pad ls-stack ls-center"><h1 class="ls-title">' +
                Util.escapeHtml(item.title || chunk[i].title) + '</h1></div>';
              const clean = SlideSanitizer.sanitizeSlide({ html, css: item.css || '', sid });
              const slide = LessonModel.newSlide({
                sid,
                title: item.title || chunk[i].title,
                phase: item.phase || chunk[i].phase,
                html: clean.html,
                css: clean.css,
                script: item.script || '',
                memo: item.memo || '',
                minutes: item.minutes || chunk[i].minutes,
                sources: item.sources || [],
                origin: got ? 'ai' : 'manual'
              });
              lesson.slides.push(slide);
              if (!designRef && got && slide.html) designRef = { html: slide.html, css: slide.css };

              const col = document.createElement('div');
              col.className = 'col';
              const frame = document.createElement('div');
              frame.className = 'ls-thumb-frame';
              col.append(frame);
              const caption = document.createElement('div');
              caption.className = 'small text-truncate';
              caption.textContent = lesson.slides.length + '. ' + slide.title;
              col.append(caption);
              thumbs.append(col);
              requestAnimationFrame(() => SlideRenderer.render(lesson, slide, frame, 'thumb', { scale: frame.clientWidth / STAGE_W, skipMath: true }));
            });

            bar.style.width = Math.round(((start + chunk.length) / outline.slides.length) * 100) + '%';
          }

          if (session !== NewLessonView.session) return;
          if (!lesson.slides.length) {
            status.textContent = '';
            reply.say(signal.aborted ? '만들기를 중단했어요. 목차를 고치거나 다시 눌러 주세요.' : '만들어진 장이 없습니다. 잠시 뒤 다시 시도해 주세요.');
            root.querySelector('#ls-gen-card').classList.add('d-none');
            NewLessonView.setBusy(false);
            return;
          }

          await LessonStore.putLesson(lesson);
          VersionStore.add(lesson, 'AI 생성 완료');
          status.textContent = signal.aborted ? '중단 — 만든 ' + lesson.slides.length + '장까지 저장했습니다.' : '완성! 편집기로 이동합니다.';
          App.go('#/edit/' + lesson.id);
        }
      };

      /* --- 편집기 --- */

      const EditorView = {
        lesson: null,
        index: 0,
        multi: [],
        selectedEid: null,
        stage: null,
        history: null,
        readOnly: false,
        _lock: null,
        _sortable: null,
        _saveTimer: null,

        async show(lessonId) {
          App.setFullscreenMode(false);
          const lesson = await LessonStore.getLesson(lessonId);
          if (!lesson) { Util.toast('슬라이드를 찾을 수 없습니다.', 'danger'); App.go('#/list'); return; }

          const root = App.mount('tpl-editor');
          EditorView.lesson = LessonModel.ensureSids(lesson);
          EditorView.index = 0;
          EditorView.multi = [];
          EditorView.selectedEid = null;
          EditorView.readOnly = false;
          EditorView.history = UndoHistory(LIMITS.undoSteps);
          EditorView.history.reset(lesson);

          root.querySelector('#ls-ed-title').value = lesson.meta.title || '';
          root.querySelector('#ls-ed-title').addEventListener('input', event => {
            EditorView.lesson.meta.title = event.target.value;
            EditorView.markDirty();
          });

          EditorView._lock = EditLock(lesson.id, () => {
            EditorView.readOnly = true;
            root.querySelector('#ls-readonly-banner').classList.remove('d-none');
          });

          root.addEventListener('click', EditorView.onToolbarClick);
          root.querySelectorAll('[data-bottom-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
              root.querySelectorAll('[data-bottom-tab]').forEach(t => t.classList.toggle('active', t === tab));
              root.querySelectorAll('[data-bottom-pane]').forEach(pane => {
                pane.classList.toggle('d-none', pane.dataset.bottomPane !== tab.dataset.bottomTab);
              });
            });
          });
          root.querySelectorAll('[data-prop-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
              root.querySelectorAll('[data-prop-tab]').forEach(t => t.classList.toggle('active', t === tab));
              root.querySelectorAll('[data-prop-pane]').forEach(pane => {
                pane.classList.toggle('d-none', pane.dataset.propPane !== tab.dataset.propTab);
              });
              EditorView.drawProps();
            });
          });

          const scriptBox = document.getElementById('ls-script');
          const memoBox = document.getElementById('ls-memo');
          const saveNotes = Util.debounce(() => EditorView.saveNotes(), 400);
          scriptBox.addEventListener('input', () => {
            EditorView.current().script = scriptBox.value;
            const seconds = Util.readingSeconds(scriptBox.value);
            document.getElementById('ls-script-info').textContent =
              scriptBox.value.length + '자 · 읽기 약 ' + Math.floor(seconds / 60) + '분 ' + (seconds % 60) + '초';
            saveNotes();
          });
          memoBox.addEventListener('input', () => { EditorView.current().memo = memoBox.value; saveNotes(); });

          document.addEventListener('keydown', EditorView.onKeyDown);
          window.addEventListener('resize', EditorView.onResize);
          window.addEventListener('pagehide', EditorView.flushSave);

          const imageInput = document.getElementById('ls-file-image');
          imageInput.addEventListener('change', EditorView.onImagePicked);

          EditorView.drawThumbs();
          EditorView.drawStage();
          EditorView.drawProps();
          VersionStore.add(lesson, '편집 시작');
          await LessonStore.requestPersist();

          App.currentView = {
            destroy() {
              EditorView.flushSave();
              document.removeEventListener('keydown', EditorView.onKeyDown);
              window.removeEventListener('resize', EditorView.onResize);
              window.removeEventListener('pagehide', EditorView.flushSave);
              imageInput.removeEventListener('change', EditorView.onImagePicked);
              if (EditorView._lock) EditorView._lock.close();
              EditorView.lesson = null;
            }
          };
        },

        current() { return EditorView.lesson.slides[EditorView.index] || LessonModel.newSlide({ sid: 'none' }); },

        /* --- 저장 --- */

        markDirty(options) {
          const state = document.getElementById('ls-save-state');
          if (EditorView.readOnly) { if (state) state.textContent = '읽기 전용'; return; }
          if (state) state.textContent = '저장 중…';
          if (!(options && options.skipHistory)) EditorView.history.push(EditorView.lesson);
          EditorView.queueSnapshot();
          clearTimeout(EditorView._saveTimer);
          EditorView._saveTimer = setTimeout(EditorView.flushSave, 800);
        },

        async flushSave() {
          clearTimeout(EditorView._saveTimer);
          if (!EditorView.lesson || EditorView.readOnly) return;
          try {
            await LessonStore.putLesson(EditorView.lesson);
            const state = document.getElementById('ls-save-state');
            if (state) state.textContent = '저장됨 · 방금';
          } catch (err) {
            Util.toast('저장에 실패했습니다: ' + err.message, 'danger');
          }
        },

        saveNotes() { EditorView.markDirty({ skipHistory: true }); },

        /* --- 장표 목록 --- */

        drawThumbs() {
          const host = document.getElementById('ls-thumbs');
          if (!host) return;
          host.textContent = '';
          let lastPhase = null;
          EditorView.lesson.slides.forEach((slide, index) => {
            if (slide.phase && slide.phase !== lastPhase) {
              const head = document.createElement('div');
              head.className = 'small fw-semibold text-secondary mt-2 ls-phase-head';
              head.textContent = slide.phase;
              host.append(head);
              lastPhase = slide.phase;
            }
            const item = document.createElement('div');
            item.className = 'ls-thumb-item mb-1' +
              (index === EditorView.index ? ' active' : '') +
              (EditorView.multi.includes(index) ? ' multi-selected' : '') +
              (slide.hidden ? ' is-hidden-slide' : '');
            item.dataset.index = String(index);

            const row = document.createElement('div');
            row.className = 'd-flex align-items-center justify-content-between';
            const label = document.createElement('span');
            label.className = 'small text-muted';
            label.textContent = (index + 1) + (slide.hidden ? ' (숨김)' : '');
            const more = document.createElement('button');
            more.className = 'btn btn-sm btn-link p-0 text-secondary';
            more.innerHTML = '<i class="bi bi-three-dots"></i>';
            more.addEventListener('click', event => { event.stopPropagation(); EditorView.slideMenu(index, more); });
            row.append(label, more);

            const frame = document.createElement('div');
            frame.className = 'ls-thumb-frame';
            const caption = document.createElement('div');
            caption.className = 'small text-truncate';
            caption.textContent = slide.title || '제목 없음';

            item.append(row, frame, caption);
            item.addEventListener('click', event => {
              if (event.ctrlKey || event.metaKey) {
                const position = EditorView.multi.indexOf(index);
                if (position >= 0) EditorView.multi.splice(position, 1); else EditorView.multi.push(index);
                EditorView.drawThumbs();
                EditorView.drawProps();
                return;
              }
              if (event.shiftKey) {
                const from = Math.min(EditorView.index, index);
                const to = Math.max(EditorView.index, index);
                EditorView.multi = [];
                for (let i = from; i <= to; i++) EditorView.multi.push(i);
                EditorView.drawThumbs();
                EditorView.drawProps();
                return;
              }
              EditorView.goSlide(index);
            });
            host.append(item);

            // 보이는 썸네일만 그린다
            const observer = new IntersectionObserver(entries => {
              entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                observer.disconnect();
                SlideRenderer.render(EditorView.lesson, slide, frame, 'thumb',
                  { scale: (frame.clientWidth || 160) / STAGE_W, skipMath: true });
              });
            }, { root: host.parentElement, rootMargin: '300px' });
            observer.observe(frame);
          });

          LibraryLoader.sortable().then(Sortable => {
            if (EditorView._sortable) { try { EditorView._sortable.destroy(); } catch (err) { /* 무시 */ } }
            EditorView._sortable = Sortable.create(host, {
              draggable: '.ls-thumb-item',
              animation: 150,
              onEnd(event) {
                const slides = EditorView.lesson.slides;
                const moved = slides.splice(event.oldDraggableIndex, 1)[0];
                slides.splice(event.newDraggableIndex, 0, moved);
                EditorView.index = event.newDraggableIndex;
                EditorView.multi = [];
                EditorView.markDirty();
                EditorView.drawThumbs();
                EditorView.drawStage();
              }
            });
          }).catch(() => { /* 순서 바꾸기만 못 쓴다 */ });
        },

        goSlide(index) {
          if (index < 0 || index >= EditorView.lesson.slides.length) return;
          EditorView.commitEditing();
          EditorView.index = index;
          EditorView.multi = [];
          EditorView.selectedEid = null;
          EditorView.drawThumbs();
          EditorView.drawStage();
          EditorView.drawProps();
        },

        /* --- 무대 --- */

        drawStage() {
          const host = document.getElementById('ls-stage-host');
          if (!host) return;
          const slide = EditorView.current();
          const available = host.clientWidth || 800;
          const result = SlideRenderer.render(EditorView.lesson, slide, host, 'edit', { maxWidth: available });
          EditorView.stage = result.stage;
          EditorView.stageWrap = result.wrap;

          const layer = document.createElement('div');
          layer.className = 'ls-handle-layer';
          result.wrap.append(layer);
          EditorView.handleLayer = layer;

          result.stage.addEventListener('mousedown', EditorView.onStageMouseDown);
          result.stage.addEventListener('dblclick', EditorView.onStageDblClick);
          result.stage.addEventListener('paste', EditorView.onStagePaste);
          result.wrap.addEventListener('dragover', event => event.preventDefault());
          result.wrap.addEventListener('drop', EditorView.onStageDrop);

          document.getElementById('ls-slide-pos').textContent =
            (EditorView.index + 1) + ' / ' + EditorView.lesson.slides.length;
          document.getElementById('ls-script').value = slide.script || '';
          document.getElementById('ls-memo').value = slide.memo || '';
          const seconds = Util.readingSeconds(slide.script);
          document.getElementById('ls-script-info').textContent =
            (slide.script || '').length + '자 · 읽기 약 ' + Math.floor(seconds / 60) + '분 ' + (seconds % 60) + '초';

          setTimeout(() => {
            const overflow = SlideRenderer.markOverflow(result.stage);
            const flag = document.getElementById('ls-overflow-flag');
            if (flag) flag.classList.toggle('d-none', overflow === 0);
            if (overflow) Util.toast('글이 넘칩니다. [AI 수정]의 "넘치지 않게 줄이기"를 써 보세요.', 'warning');
          }, 350);

          if (EditorView.selectedEid) EditorView.selectByEid(EditorView.selectedEid);
        },

        onResize: Util.debounce(() => { if (EditorView.lesson) EditorView.drawStage(); }, 250),

        // 수정이 멈추면 곧바로 임시 기록을 남긴다(탭을 닫으면 사라지는 세션 저장소).
        queueSnapshot: Util.debounce(() => {
          if (EditorView.lesson && !EditorView.readOnly) VersionStore.add(EditorView.lesson, '자동 임시 저장');
        }, 1500),

        stageScale() { return parseFloat(EditorView.stageWrap && EditorView.stageWrap.dataset.lsScale) || 1; },

        /* --- 선택 --- */

        onStageMouseDown(event) {
          if (EditorView.readOnly) return;
          const editing = event.target.closest('[contenteditable="true"]');
          if (editing) return;
          const handle = event.target.closest('.ls-handle');
          if (handle) return;

          let target = event.target.closest('[data-eid]');
          if (event.altKey && target) {
            const parent = target.parentElement && target.parentElement.closest('[data-eid]');
            if (parent) target = parent;
          }
          EditorView.select(target);
          if (target && (target.classList.contains('ls-abs') || target.style.position === 'absolute')) {
            EditorView.startDrag(event, target);
          }
        },

        select(element) {
          if (!EditorView.stage) return;
          EditorView.stage.querySelectorAll('.ls-selected').forEach(el => el.classList.remove('ls-selected'));
          EditorView.selectedEid = element ? element.getAttribute('data-eid') : null;
          const bar = document.getElementById('ls-path-bar');
          if (element) {
            element.classList.add('ls-selected');
            const chain = [];
            let node = element;
            while (node && node !== EditorView.stage) { chain.unshift(node.tagName.toLowerCase()); node = node.parentElement; }
            bar.textContent = chain.join(' › ');
          } else if (bar) {
            bar.textContent = '';
          }
          EditorView.drawHandles(element);
          EditorView.drawFormatPane(document.querySelector('[data-prop-pane="format"]'));
        },

        selectByEid(eid) {
          const element = EditorView.stage && EditorView.stage.querySelector('[data-eid="' + CSS.escape(eid) + '"]');
          if (element) EditorView.select(element);
        },

        selectedElement() {
          if (!EditorView.stage || !EditorView.selectedEid) return null;
          return EditorView.stage.querySelector('[data-eid="' + CSS.escape(EditorView.selectedEid) + '"]');
        },

        drawHandles(element) {
          const layer = EditorView.handleLayer;
          if (!layer) return;
          layer.textContent = '';
          if (!element) return;
          const isAbs = element.classList.contains('ls-abs') || getComputedStyle(element).position === 'absolute';
          if (!isAbs) return;
          const scale = EditorView.stageScale();
          const base = EditorView.stage.getBoundingClientRect();
          const rect = element.getBoundingClientRect();
          const left = (rect.left - base.left);
          const top = (rect.top - base.top);
          ['nw', 'ne', 'sw', 'se'].forEach(dir => {
            const handle = document.createElement('div');
            handle.className = 'ls-handle';
            handle.dataset.dir = dir;
            handle.style.left = (left + (dir.includes('e') ? rect.width : 0) - 6) + 'px';
            handle.style.top = (top + (dir.includes('s') ? rect.height : 0) - 6) + 'px';
            handle.addEventListener('mousedown', event => EditorView.startResize(event, element, dir));
            layer.append(handle);
          });
        },

        /* --- 끌어 옮기기 / 크기 조절 --- */

        startDrag(event, element) {
          event.preventDefault();
          const scale = EditorView.stageScale();
          const startX = event.clientX;
          const startY = event.clientY;
          const left = parseFloat(element.style.left) || 0;
          const top = parseFloat(element.style.top) || 0;

          const move = moveEvent => {
            let nextLeft = left + (moveEvent.clientX - startX) / scale;
            let nextTop = top + (moveEvent.clientY - startY) / scale;
            const snapped = EditorView.snap(element, nextLeft, nextTop);
            element.style.left = Math.round(snapped.left) + 'px';
            element.style.top = Math.round(snapped.top) + 'px';
            EditorView.drawHandles(element);
          };
          const up = () => {
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
            EditorView.clearGuides();
            EditorView.commitStage();
          };
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up);
        },

        startResize(event, element, dir) {
          event.preventDefault();
          event.stopPropagation();
          const scale = EditorView.stageScale();
          const startX = event.clientX;
          const startY = event.clientY;
          const rect = element.getBoundingClientRect();
          const width0 = rect.width / scale;
          const height0 = rect.height / scale;
          const left0 = parseFloat(element.style.left) || 0;
          const top0 = parseFloat(element.style.top) || 0;
          const ratio = width0 / Math.max(1, height0);

          const move = moveEvent => {
            const dx = (moveEvent.clientX - startX) / scale;
            const dy = (moveEvent.clientY - startY) / scale;
            let width = width0 + (dir.includes('e') ? dx : -dx);
            let height = height0 + (dir.includes('s') ? dy : -dy);
            if (moveEvent.shiftKey) height = width / ratio;
            width = Math.max(20, width);
            height = Math.max(20, height);
            element.style.width = Math.round(width) + 'px';
            element.style.height = Math.round(height) + 'px';
            if (dir.includes('w')) element.style.left = Math.round(left0 + (width0 - width)) + 'px';
            if (dir.includes('n')) element.style.top = Math.round(top0 + (height0 - height)) + 'px';
            EditorView.drawHandles(element);
          };
          const up = () => {
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
            EditorView.commitStage();
          };
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up);
        },

        // 무대 중앙·가장자리에 맞춤선
        snap(element, left, top) {
          EditorView.clearGuides();
          const rect = element.getBoundingClientRect();
          const scale = EditorView.stageScale();
          const width = rect.width / scale;
          const height = rect.height / scale;
          const tolerance = 6;
          const targetsX = [0, (STAGE_W - width) / 2, STAGE_W - width];
          const targetsY = [0, (STAGE_H - height) / 2, STAGE_H - height];
          targetsX.forEach((value, i) => {
            if (Math.abs(left - value) < tolerance) {
              left = value;
              EditorView.showGuide('v', (i === 0 ? 0 : i === 1 ? STAGE_W / 2 : STAGE_W));
            }
          });
          targetsY.forEach((value, i) => {
            if (Math.abs(top - value) < tolerance) {
              top = value;
              EditorView.showGuide('h', (i === 0 ? 0 : i === 1 ? STAGE_H / 2 : STAGE_H));
            }
          });
          return { left, top };
        },

        showGuide(axis, position) {
          const scale = EditorView.stageScale();
          const guide = document.createElement('div');
          guide.className = 'ls-guide ' + axis;
          if (axis === 'v') guide.style.left = (position * scale) + 'px';
          else guide.style.top = (position * scale) + 'px';
          EditorView.handleLayer.append(guide);
        },

        clearGuides() {
          if (EditorView.handleLayer) EditorView.handleLayer.querySelectorAll('.ls-guide').forEach(el => el.remove());
        },

        /* --- 글 고치기 --- */

        onStageDblClick(event) {
          if (EditorView.readOnly) return;
          const target = event.target.closest('[data-eid]');
          if (!target) return;
          EditorView.startEditing(target);
        },

        startEditing(element) {
          if (!element || element.querySelector('img, svg')) return;
          EditorView.commitEditing();
          element.setAttribute('contenteditable', 'true');
          element.focus();
          element.addEventListener('paste', EditorView.onPlainPaste);
          element.addEventListener('blur', EditorView.commitEditing, { once: true });
        },

        onPlainPaste(event) {
          event.preventDefault();
          const text = (event.clipboardData || window.clipboardData).getData('text/plain');
          const selection = window.getSelection();
          if (!selection.rangeCount) return;
          selection.deleteFromDocument();
          selection.getRangeAt(0).insertNode(document.createTextNode(text));
          selection.collapseToEnd();
        },

        commitEditing() {
          if (!EditorView.stage) return;
          const editing = EditorView.stage.querySelector('[contenteditable="true"]');
          if (!editing) return;
          editing.removeAttribute('contenteditable');
          editing.removeEventListener('paste', EditorView.onPlainPaste);
          EditorView.commitStage();
        },

        // 무대의 현재 DOM을 slide.html에 반영한다.
        commitStage(options) {
          if (!EditorView.stage || EditorView.readOnly) return;
          const clone = EditorView.stage.cloneNode(true);
          clone.querySelectorAll('.ls-selected, .ls-overflow-warn').forEach(el => {
            el.classList.remove('ls-selected', 'ls-overflow-warn');
            if (!el.getAttribute('class')) el.removeAttribute('class');
          });
          clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
          // 표시용 자리 상자를 원래 img로 되돌린다
          clone.querySelectorAll('[data-ls-ph-render]').forEach(box => {
            const img = document.createElement('img');
            img.setAttribute('data-ls-placeholder', box.getAttribute('data-ls-placeholder') || '사진');
            img.setAttribute('alt', box.getAttribute('data-ls-placeholder') || '사진');
            if (box.hasAttribute('data-eid')) img.setAttribute('data-eid', box.getAttribute('data-eid'));
            if (box.getAttribute('style')) img.setAttribute('style', box.getAttribute('style'));
            const classes = (box.getAttribute('class') || '').split(' ').filter(c => c && c !== 'ls-placeholder-box');
            if (classes.length) img.setAttribute('class', classes.join(' '));
            box.replaceWith(img);
          });
          // 임시 objectURL을 asset: 주소로 되돌린다
          clone.querySelectorAll('img[data-ls-asset]').forEach(img => {
            img.setAttribute('src', 'asset:' + img.getAttribute('data-ls-asset'));
            img.removeAttribute('data-ls-asset');
          });
          // KaTeX 결과는 저장하지 않는다(원본 LaTeX 유지)
          clone.querySelectorAll('.katex-display, .katex').forEach(node => {
            const annotation = node.querySelector('annotation[encoding="application/x-tex"]');
            const tex = annotation ? annotation.textContent : null;
            const isDisplay = node.classList.contains('katex-display');
            node.replaceWith(document.createTextNode(tex ? (isDisplay ? '\\[' + tex + '\\]' : '\\(' + tex + '\\)') : ''));
          });

          const slide = EditorView.current();
          const clean = SlideSanitizer.sanitizeSlide({ html: clone.innerHTML, css: slide.css, sid: slide.sid });
          slide.html = clean.html;
          slide.title = slide.titleLocked ? slide.title : LessonModel.titleFromHtml(clean.html);
          EditorView.markDirty(options);
          EditorView.refreshThumb(EditorView.index);
        },

        refreshThumb(index) {
          const item = document.querySelector('#ls-thumbs .ls-thumb-item[data-index="' + index + '"]');
          if (!item) return;
          const frame = item.querySelector('.ls-thumb-frame');
          const caption = item.querySelector('.small.text-truncate');
          const slide = EditorView.lesson.slides[index];
          if (caption) caption.textContent = slide.title || '제목 없음';
          if (frame) SlideRenderer.render(EditorView.lesson, slide, frame, 'thumb', { scale: (frame.clientWidth || 160) / STAGE_W, skipMath: true });
        }
      };

      /* --- 편집기: 도구 모음·단축키·요소 추가 --- */

      Object.assign(EditorView, {

        onToolbarClick(event) {
          const button = event.target.closest('[data-act]');
          if (!button || !EditorView.lesson) return;
          const act = button.dataset.act;
          const actions = {
            'back': () => App.go('#/list'),
            'undo': () => EditorView.undo(),
            'redo': () => EditorView.redo(),
            'present': () => App.go('#/present/' + EditorView.lesson.id),
            'help': () => EditorView.showHelp(),
            'versions': () => VersionDrawer.open(),
            'prev-slide': () => EditorView.goSlide(EditorView.index - 1),
            'next-slide': () => EditorView.goSlide(EditorView.index + 1),
            'to-abs': () => EditorView.toAbsolute(),
            'preview-anim': () => EditorView.previewAnimation(),
            'add-text': () => EditorView.addElement('text'),
            'add-image': () => document.getElementById('ls-file-image').click(),
            'add-shape': () => EditorView.chooseShape(button),
            'add-math': () => EditorView.promptMath(),
            'add-table': () => EditorView.addElement('table'),
            'slide-new-blank': () => EditorView.addSlide('blank'),
            'slide-new-tpl': () => EditorView.chooseTemplate(button),
            'slide-new-ai': () => AiReviseTab.createSlideByAi(),
            'exp-pptx': () => PptxExporter.openDialog(EditorView.lesson),
            'exp-html': () => HtmlExporter.download(EditorView.lesson, false),
            'exp-html-student': () => HtmlExporter.download(EditorView.lesson, true),
            'exp-pdf': () => window.open(location.pathname + '#/print/' + EditorView.lesson.id + '?mode=slides', '_blank')
          };
          if (actions[act]) { event.preventDefault(); actions[act](); }
        },

        onKeyDown(event) {
          if (!EditorView.lesson) return;
          const target = event.target;
          const inField = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
          const ctrl = event.ctrlKey || event.metaKey;

          if (ctrl && event.key.toLowerCase() === 's') { event.preventDefault(); EditorView.flushSave(); return; }
          if (ctrl && event.key.toLowerCase() === 'z' && !event.shiftKey) { event.preventDefault(); EditorView.undo(); return; }
          if (ctrl && (event.key.toLowerCase() === 'y' || (event.key.toLowerCase() === 'z' && event.shiftKey))) {
            event.preventDefault(); EditorView.redo(); return;
          }
          if (event.key === 'F5' || (ctrl && event.key === 'Enter')) {
            event.preventDefault();
            App.go('#/present/' + EditorView.lesson.id + '?from=' + EditorView.index);
            return;
          }

          // 입력칸 안에서는 Ctrl+[ / Ctrl+] 만 장 이동으로 동작한다.
          if (ctrl && (event.key === '[' || event.key === ']')) {
            event.preventDefault();
            if (inField) {
              EditorView.goSlide(EditorView.index + (event.key === ']' ? 1 : -1));
            } else {
              EditorView.reorderElement(event.key === ']' ? 1 : -1);
            }
            return;
          }
          if (ctrl && ['b', 'i', 'u'].includes(event.key.toLowerCase())) {
            if (target && target.isContentEditable) {
              event.preventDefault();
              EditorView.wrapSelection(event.key.toLowerCase());
            }
            return;
          }
          if (inField) return;

          if (ctrl && event.key.toLowerCase() === 'd') {
            event.preventDefault();
            if (EditorView.selectedEid) EditorView.duplicateElement(); else EditorView.duplicateSlide(EditorView.index);
            return;
          }
          if (event.key === 'Delete' && EditorView.selectedEid) { event.preventDefault(); EditorView.deleteElement(); return; }
          if (event.key === 'Enter' && EditorView.selectedEid) {
            event.preventDefault();
            EditorView.startEditing(EditorView.selectedElement());
            return;
          }
          if (event.key === 'Escape') { EditorView.commitEditing(); EditorView.select(null); return; }
          if (event.key === 'Tab' && EditorView.stage) {
            event.preventDefault();
            const all = Array.from(EditorView.stage.querySelectorAll('[data-eid]'));
            const at = all.findIndex(el => el.getAttribute('data-eid') === EditorView.selectedEid);
            EditorView.select(all[(at + 1) % Math.max(1, all.length)] || null);
            return;
          }

          const element = EditorView.selectedElement();
          if (element && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) {
            const isAbs = element.classList.contains('ls-abs') || getComputedStyle(element).position === 'absolute';
            if (isAbs) {
              event.preventDefault();
              const step = event.shiftKey ? 10 : 1;
              const left = parseFloat(element.style.left) || 0;
              const top = parseFloat(element.style.top) || 0;
              if (event.key === 'ArrowLeft') element.style.left = (left - step) + 'px';
              if (event.key === 'ArrowRight') element.style.left = (left + step) + 'px';
              if (event.key === 'ArrowUp') element.style.top = (top - step) + 'px';
              if (event.key === 'ArrowDown') element.style.top = (top + step) + 'px';
              EditorView.drawHandles(element);
              EditorView.commitStage();
              return;
            }
          }

          if (!EditorView.selectedEid) {
            if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); EditorView.goSlide(EditorView.index - 1); }
            if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); EditorView.goSlide(EditorView.index + 1); }
          }
        },

        // 선택 영역을 strong/em/u로 감싸거나 푼다(execCommand를 쓰지 않는다).
        wrapSelection(key) {
          const tag = { b: 'strong', i: 'em', u: 'u' }[key];
          const selection = window.getSelection();
          if (!selection || !selection.rangeCount || selection.isCollapsed) return;
          const range = selection.getRangeAt(0);
          const anchor = range.commonAncestorContainer.nodeType === 1
            ? range.commonAncestorContainer
            : range.commonAncestorContainer.parentElement;
          const existing = anchor && anchor.closest(tag);
          if (existing) {
            const parent = existing.parentNode;
            while (existing.firstChild) parent.insertBefore(existing.firstChild, existing);
            parent.removeChild(existing);
            return;
          }
          const wrapper = document.createElement(tag);
          try { range.surroundContents(wrapper); } catch (err) { /* 여러 요소에 걸치면 건너뛴다 */ }
        },

        undo() {
          const state = EditorView.history.undo();
          if (!state) return;
          EditorView.lesson = state;
          EditorView.index = Math.min(EditorView.index, state.slides.length - 1);
          EditorView.selectedEid = null;
          EditorView.drawThumbs();
          EditorView.drawStage();
          EditorView.drawProps();
          EditorView.markDirty({ skipHistory: true });
        },

        redo() {
          const state = EditorView.history.redo();
          if (!state) return;
          EditorView.lesson = state;
          EditorView.index = Math.min(EditorView.index, state.slides.length - 1);
          EditorView.selectedEid = null;
          EditorView.drawThumbs();
          EditorView.drawStage();
          EditorView.drawProps();
          EditorView.markDirty({ skipHistory: true });
        },

        /* --- 요소 조작 --- */

        insertIntoStage(node) {
          if (!EditorView.stage) return;
          node.setAttribute('data-ls-new', '1');
          const container = EditorView.stage.firstElementChild || EditorView.stage;
          container.append(node);
          EditorView.commitStage({ skipHistory: true });
          EditorView.drawStage();
          const added = EditorView.stage.querySelector('[data-ls-new]');
          if (added) {
            added.removeAttribute('data-ls-new');
            EditorView.select(added);
            EditorView.commitStage();
          }
        },

        chooseShape(anchor) {
          EditorView.pickMenu(anchor, [
            ['사각형', () => EditorView.addElement('rect')],
            ['둥근 사각형', () => EditorView.addElement('roundRect')],
            ['원', () => EditorView.addElement('ellipse')],
            ['선', () => EditorView.addElement('line')],
            ['화살표', () => EditorView.addElement('arrow')]
          ]);
        },

        // LaTeX 입력 + 미리보기
        promptMath() {
          const box = document.createElement('div');
          const input = document.createElement('input');
          input.className = 'form-control';
          input.value = 'x^2 + 2x - 3 = 0';
          const label = document.createElement('label');
          label.className = 'form-label small';
          label.textContent = 'LaTeX 수식 (예: \\frac{1}{2}, x^2)';
          const preview = document.createElement('div');
          preview.className = 'border rounded p-3 mt-3 text-center';
          preview.style.minHeight = '70px';
          const draw = async () => {
            preview.textContent = '';
            try {
              const katex = await LibraryLoader.katex();
              katex.render(input.value, preview, { throwOnError: false, displayMode: true });
            } catch (err) {
              preview.textContent = input.value;
            }
          };
          input.addEventListener('input', Util.debounce(draw, 250));
          box.append(label, input, preview);

          const insert = document.createElement('button');
          insert.className = 'btn btn-primary';
