<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 슬라이드 편집 도구</title>
  <meta name="description"
    content="말로 요청하거나 PPT·PDF 자료를 주면 Gemini AI가 HTML 슬라이드를 만들고, 편집·발표·PPTX 내려받기까지 하는 도구">

  <!-- 파비콘 -->
  <link rel="icon" href="../../../assets/images/mainPage/동동이.jpg" type="image/jpeg" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

  <!-- 공통 네비게이션 CSS -->
  <link rel="stylesheet" href="../../../css/navbar.css" />

  <!-- HTML 정리(보안상 항상 필요) -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');

    :root {
      --app-bg: #ffffff;
      --app-text: #1f2937;
      --app-muted: #6b7280;
      --app-border: #e5e7eb;
      --app-primary: #6366f1;
      --app-primary-soft: #eef2ff;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background-color: var(--app-bg);
      color: var(--app-text);
      font-family: 'Pretendard Variable', 'Pretendard', system-ui, sans-serif;
    }

    body.ls-fullscreen-mode nav,
    body.ls-fullscreen-mode .navbar,
    body.ls-fullscreen-mode #navbar-container { display: none !important; }

    .ls-app-main { padding: 1rem 1rem 3rem; }
    body.ls-fullscreen-mode .ls-app-main { padding: 0; }

    /* ===== 토스트 ===== */
    #ls-toast-area {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 2100;
      display: flex; flex-direction: column; gap: .5rem; max-width: min(92vw, 420px);
    }

    /* ===== 무대(stage) ===== */
    .ls-stage {
      width: 1280px; height: 720px;
      position: relative; overflow: hidden;
      transform-origin: top left;
      background: var(--ls-bg);
      color: var(--ls-fg);
      font-family: 'Pretendard Variable', 'Pretendard', system-ui, sans-serif;
      line-height: 1.45;
    }

    .ls-stage img { max-width: 100%; }

    .ls-stage p, .ls-stage ul, .ls-stage ol, .ls-stage h1, .ls-stage h2,
    .ls-stage h3, .ls-stage h4, .ls-stage h5, .ls-stage h6 { margin: 0; }

    .ls-stage ul, .ls-stage ol { padding-left: 1.2em; }

    /* ===== 디자인 키트 ===== */
    .ls-pad { padding: 64px 80px; width: 100%; height: 100%; }
    .ls-stack { display: flex; flex-direction: column; gap: 24px; }
    .ls-row { display: flex; flex-direction: row; gap: 24px; align-items: flex-start; }
    .ls-center { justify-content: center; align-items: center; text-align: center; }
    .ls-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .ls-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .ls-abs { position: absolute; }

    .ls-kicker { font-size: 22px; font-weight: 700; letter-spacing: .04em; color: var(--ls-accent); }
    .ls-title { font-size: 52px; font-weight: 800; line-height: 1.2; }
    .ls-subtitle { font-size: 32px; font-weight: 700; line-height: 1.3; }
    .ls-body { font-size: 28px; line-height: 1.5; }
    .ls-small { font-size: 22px; line-height: 1.5; }
    .ls-muted { color: var(--ls-muted); }
    .ls-accent-text { color: var(--ls-accent); }

    .ls-card {
      background: var(--ls-card); border: 1px solid var(--ls-border);
      border-radius: 18px; padding: 24px 28px;
    }
    .ls-callout {
      background: var(--ls-accent-soft); border-left: 8px solid var(--ls-accent);
      border-radius: 12px; padding: 20px 26px;
    }
    .ls-badge {
      display: inline-block; background: var(--ls-accent); color: #fff;
      border-radius: 999px; padding: 6px 18px; font-size: 20px; font-weight: 700;
    }
    .ls-number-big { font-size: 120px; font-weight: 800; line-height: 1; color: var(--ls-accent); }
    .ls-quote { font-size: 30px; font-style: italic; border-left: 6px solid var(--ls-border); padding-left: 20px; }
    .ls-divider { height: 3px; background: var(--ls-border); border: 0; border-radius: 2px; }

    .ls-table { width: 100%; border-collapse: collapse; font-size: 24px; }
    .ls-table th, .ls-table td { border: 1px solid var(--ls-border); padding: 12px 16px; text-align: left; }
    .ls-table th { background: var(--ls-accent-soft); font-weight: 700; }

    .ls-quiz { font-size: 30px; font-weight: 700; }
    .ls-quiz-option {
      font-size: 26px; background: var(--ls-card); border: 2px solid var(--ls-border);
      border-radius: 12px; padding: 14px 20px; margin-top: 12px;
    }
    .ls-stage.ls-reveal-answer .ls-quiz-option[data-ls-answer="true"] {
      border-color: var(--ls-accent); background: var(--ls-accent-soft); font-weight: 800;
    }
    .ls-quiz-explain { display: none; font-size: 24px; margin-top: 16px; color: var(--ls-muted); }
    .ls-stage.ls-reveal-answer .ls-quiz-explain { display: block; }

    /* ===== 등장 효과 / 장 전환 ===== */
    @keyframes ls-kf-fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes ls-kf-up { from { opacity: 0; transform: translateY(42px) } to { opacity: 1; transform: none } }
    @keyframes ls-kf-down { from { opacity: 0; transform: translateY(-42px) } to { opacity: 1; transform: none } }
    @keyframes ls-kf-left { from { opacity: 0; transform: translateX(-64px) } to { opacity: 1; transform: none } }
    @keyframes ls-kf-right { from { opacity: 0; transform: translateX(64px) } to { opacity: 1; transform: none } }
    @keyframes ls-kf-zoom { from { opacity: 0; transform: scale(.82) } to { opacity: 1; transform: none } }
    @keyframes ls-kf-pop { 0% { opacity: 0; transform: scale(.6) } 60% { opacity: 1; transform: scale(1.06) } 100% { transform: none } }

    .ls-stage.ls-animate [class*="ls-anim-"] {
      animation-duration: .6s;
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(.22, .8, .3, 1);
    }
    .ls-stage.ls-animate .ls-anim-fade { animation-name: ls-kf-fade; }
    .ls-stage.ls-animate .ls-anim-up { animation-name: ls-kf-up; }
    .ls-stage.ls-animate .ls-anim-down { animation-name: ls-kf-down; }
    .ls-stage.ls-animate .ls-anim-left { animation-name: ls-kf-left; }
    .ls-stage.ls-animate .ls-anim-right { animation-name: ls-kf-right; }
    .ls-stage.ls-animate .ls-anim-zoom { animation-name: ls-kf-zoom; }
    .ls-stage.ls-animate .ls-anim-pop { animation-name: ls-kf-pop; }
    .ls-stage.ls-animate .ls-delay-1 { animation-delay: .15s; }
    .ls-stage.ls-animate .ls-delay-2 { animation-delay: .3s; }
    .ls-stage.ls-animate .ls-delay-3 { animation-delay: .45s; }
    .ls-stage.ls-animate .ls-delay-4 { animation-delay: .6s; }
    .ls-stage.ls-animate .ls-delay-5 { animation-delay: .75s; }
    .ls-stage.ls-animate .ls-delay-6 { animation-delay: .9s; }

    .ls-stage-wrap.ls-trans-fade, .ls-slide.ls-trans-fade { animation: ls-kf-fade .45s both; }
    .ls-stage-wrap.ls-trans-slide, .ls-slide.ls-trans-slide { animation: ls-kf-right .45s both; }
    .ls-stage-wrap.ls-trans-zoom, .ls-slide.ls-trans-zoom { animation: ls-kf-zoom .45s both; }

    @media (prefers-reduced-motion: reduce) {
      .ls-stage.ls-animate [class*="ls-anim-"],
      .ls-stage-wrap[class*="ls-trans-"],
      .ls-slide[class*="ls-trans-"] { animation: none !important; }
    }

    /* 이미지 자리 표시 */
    .ls-placeholder-box {
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: repeating-linear-gradient(45deg, rgba(127,127,127,.08) 0 10px, rgba(127,127,127,.16) 10px 20px);
      border: 2px dashed var(--ls-border); border-radius: 12px;
      color: var(--ls-muted); font-size: 20px; padding: 12px; min-height: 120px;
    }

    /* ===== 챗봇식 입력창·대화 ===== */
    .ls-composer-input { resize: none; max-height: 240px; }
    .ls-send { width: 2.25rem; height: 2.25rem; padding: 0; }
    .ls-chat-dock { position: sticky; bottom: 0; background: #fff; padding: .5rem 0 .75rem; z-index: 5; }
    .ls-chat-bubble { max-width: 85%; min-width: 0; }
    .ls-chat-bubble.ls-wide { max-width: none; flex: 1 1 auto; }
    .ls-chat-text { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
    .ls-chat-avatar { width: 2rem; height: 2rem; }
    .ls-theme-option.active { border-color: var(--app-primary) !important; box-shadow: 0 0 0 .2rem var(--app-primary-soft); }

    /* ===== 편집기 ===== */
    .ls-editor-grid { display: grid; grid-template-columns: 210px minmax(0, 1fr) 330px; gap: .75rem; align-items: start; }
    .ls-slidelist { max-height: calc(100vh - 220px); overflow-y: auto; }
    .ls-props { max-height: calc(100vh - 220px); overflow-y: auto; }

    .ls-thumb-item { cursor: pointer; border: 2px solid transparent; border-radius: 10px; padding: 4px; }
    .ls-thumb-item.active { border-color: var(--app-primary); background: var(--app-primary-soft); }
    .ls-thumb-item.multi-selected { border-color: #0ea5e9; }
    .ls-thumb-item.is-hidden-slide { opacity: .5; }
    .ls-thumb-frame {
      width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--app-border);
      border-radius: 6px; background: #fff; position: relative;
    }
    .ls-thumb-frame .ls-stage { pointer-events: none; }

    .ls-stage-wrap {
      position: relative; margin: 0 auto;
      box-shadow: 0 6px 28px rgba(15, 23, 42, .14); border-radius: 6px; overflow: hidden;
      background: #fff;
    }

    .ls-stage.ls-edit-mode [data-eid]:hover { outline: 1px dashed rgba(99, 102, 241, .8); outline-offset: 2px; }
    .ls-stage.ls-edit-mode .ls-selected { outline: 2px solid #6366f1 !important; outline-offset: 2px; }
    .ls-stage .ls-overflow-warn { outline: 2px solid #ef4444 !important; }
    .ls-stage [contenteditable="true"] { outline: 2px solid #0ea5e9 !important; cursor: text; }

    .ls-handle-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
    .ls-handle {
      position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid #6366f1;
      border-radius: 50%; pointer-events: auto; z-index: 51;
    }
    .ls-handle[data-dir="nw"], .ls-handle[data-dir="se"] { cursor: nwse-resize; }
    .ls-handle[data-dir="ne"], .ls-handle[data-dir="sw"] { cursor: nesw-resize; }
    .ls-guide { position: absolute; background: #ec4899; pointer-events: none; z-index: 52; }
    .ls-guide.v { width: 1px; top: 0; bottom: 0; }
    .ls-guide.h { height: 1px; left: 0; right: 0; }

    .ls-path-bar { font-size: .75rem; color: var(--app-muted); min-height: 1.2rem; }
    .ls-code-area { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .8rem; }
    .ls-swatch { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--app-border); cursor: pointer; }

    /* ===== 발표자 화면 ===== */
    .ls-presenter { height: 100vh; display: flex; flex-direction: column; background: #0f172a; color: #e2e8f0; }
    .ls-presenter .ls-pbar { padding: .5rem .75rem; border-bottom: 1px solid #1e293b; }
    .ls-presenter-body { flex: 1; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: .75rem; padding: .75rem; min-height: 0; }
    .ls-presenter-side { display: flex; flex-direction: column; gap: .5rem; min-height: 0; }
    .ls-presenter-notes { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; padding: 0 .75rem .75rem; height: 32vh; }
    .ls-note-pane { background: #111827; border: 1px solid #1f2937; border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
    .ls-note-pane textarea {
      flex: 1; background: transparent; color: #e2e8f0; border: 0; resize: none; outline: none;
      padding: .5rem .75rem; font-size: var(--ls-note-size, 20px); line-height: 1.6;
    }
    .ls-mini-list { overflow-y: auto; min-height: 0; flex: 1; }
    .ls-mini-item { cursor: pointer; border-radius: 6px; padding: .2rem .4rem; font-size: .85rem; }
    .ls-mini-item:hover { background: #1e293b; }
    .ls-mini-item.active { background: #334155; font-weight: 700; }

    /* ===== 청중 화면 ===== */
    body.ls-screen-body { background: #000; overflow: hidden; }
    .ls-screen-root { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
    .ls-screen-root.cursor-hidden { cursor: none; }
    .ls-screen-root.blank-black { background: #000; }
    .ls-screen-root.blank-white { background: #fff; }
    .ls-screen-root.blank-on .ls-stage-wrap { visibility: hidden; }

    /* ===== 인쇄 ===== */
    .ls-print-root { background: #fff; }
    .ls-print-slide-page { width: 13.333in; height: 7.5in; overflow: hidden; page-break-after: always; position: relative; }
    .ls-handout-page { width: 210mm; min-height: 297mm; padding: 12mm; page-break-after: always; }
    .ls-handout-line { border-bottom: 1px solid #cbd5e1; height: 26px; }

    @media print {
      body { background: #fff !important; }
      .ls-no-print { display: none !important; }
    }

    @media (max-width: 991.98px) {
      .ls-editor-grid { grid-template-columns: 1fr; }
      .ls-slidelist, .ls-props { max-height: 320px; }
      .ls-presenter-body { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <!-- 네비게이션바 -->
  <script src="../../../js/navbar.js"></script>

  <main class="container-fluid ls-app-main" id="ls-main"></main>

  <div id="ls-toast-area" aria-live="polite" aria-atomic="true"></div>

  <!-- ========== 화면 템플릿 ========== -->
  <template id="tpl-list">
    <section class="container py-3">
      <header>
        <div class="text-center mb-4">
          <h1 class="fw-bold text-primary mt-2">
            <i class="bi bi-easel2"></i> HTML 슬라이드 편집 도구
          </h1>
          <p class="text-muted fs-6">
            만들고 싶은 내용을 말하거나 PPT·PDF 자료를 주면 Gemini가 슬라이드를 HTML로 만들어 줍니다.
          </p>
        </div>
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
          <button class="btn btn-outline-primary" data-act="open-file"><i class="bi bi-folder2-open"></i> 파일 열어서 이어서 편집</button>
          <button class="btn btn-outline-secondary" data-act="settings"><i class="bi bi-robot"></i> AI 설정</button>
        </div>
      </header>

      <div class="alert alert-warning text-center d-none mx-auto" id="ls-nokey-banner" style="max-width: 820px;">
        <i class="bi bi-key"></i> Gemini API 키를 입력하면 AI에게 말로 슬라이드를 만들어 달라고 할 수 있습니다.
        <button class="btn btn-sm btn-warning ms-1" data-act="settings">AI 설정에서 키 입력</button>
      </div>

      <div class="mx-auto mb-5 d-none" id="ls-home-chat" style="max-width: 820px;">
        <div id="ls-home-composer"></div>
      </div>

      <h2 class="h6 fw-bold text-muted mb-2 d-none" id="ls-list-heading">내 슬라이드</h2>
      <div id="ls-list-grid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"></div>

      <footer class="mt-5 pt-3 border-top small text-muted">
        <p class="mb-0"><i class="bi bi-exclamation-triangle"></i> 만든 슬라이드는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 사라지니, 중요한 자료는 PPTX나 HTML로 내려받아 두세요.</p>
      </footer>
    </section>
  </template>

  <template id="tpl-new">
    <section class="container py-3" style="max-width: 980px;">
      <nav class="d-flex align-items-center gap-2 mb-3">
        <button class="btn btn-sm btn-outline-secondary" data-act="back"><i class="bi bi-arrow-left"></i> 목록</button>
        <h1 class="h5 fw-bold mb-0">새 슬라이드 만들기</h1>
        <button class="btn btn-sm btn-outline-secondary ms-auto" data-act="restart"><i class="bi bi-arrow-repeat"></i> 새 대화</button>
      </nav>

      <div id="ls-chat-log" class="d-flex flex-column gap-3 mb-3"></div>

      <div class="ls-chat-dock">
        <div id="ls-chat-composer"></div>
        <p class="small text-muted mt-1 mb-0"><i class="bi bi-shield-lock"></i> 첨부 자료와 요청 내용은 Google Gemini API로 전송됩니다. 개인정보가 담긴 자료는 첨부하지 마세요.</p>
      </div>

      <!-- AI 답 안에 붙는 목차 카드 -->
      <div class="card mt-2 d-none" id="ls-outline-card">
        <div class="card-body p-2 text-body">
          <div class="row g-2 align-items-end mb-2">
            <div class="col-sm-8"><label class="form-label small mb-1" for="ls-outline-title">제목</label><input class="form-control form-control-sm" id="ls-outline-title"></div>
            <div class="col-sm-4 text-sm-end"><span class="badge text-bg-secondary" id="ls-outline-sum"></span></div>
          </div>
          <div class="mb-2">
            <label class="form-label small mb-1" for="ls-outline-objectives">목표·핵심 메시지</label>
            <textarea class="form-control form-control-sm" id="ls-outline-objectives" rows="2" placeholder="한 줄에 하나씩"></textarea>
          </div>
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-2">
              <thead><tr><th style="width:2.5rem"></th><th style="width:3rem">#</th><th>장 제목</th><th style="width:7rem">흐름</th><th>핵심 포인트</th><th>디자인 힌트</th><th style="width:5rem">분</th><th style="width:3rem"></th></tr></thead>
              <tbody id="ls-outline-body"></tbody>
            </table>
          </div>
          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <button class="btn btn-sm btn-outline-secondary" data-act="outline-add"><i class="bi bi-plus-lg"></i> 장 추가</button>
            <button class="btn btn-primary" data-act="make-slides"><i class="bi bi-easel"></i> 이대로 슬라이드 만들기</button>
          </div>
        </div>
      </div>

      <!-- AI 답 안에 붙는 생성 진행 카드 -->
      <div class="mt-2 d-none" id="ls-gen-card">
        <div class="progress mb-2" role="progressbar"><div class="progress-bar progress-bar-striped progress-bar-animated" id="ls-gen-bar" style="width:0%"></div></div>
        <p class="small text-muted" id="ls-gen-status">준비 중…</p>
        <div class="row row-cols-2 row-cols-md-4 g-2" id="ls-gen-thumbs"></div>
        <button class="btn btn-outline-danger btn-sm mt-2" data-act="gen-abort"><i class="bi bi-stop-circle"></i> 중단</button>
      </div>
    </section>
  </template>

  <!-- 챗봇식 입력창 (첫 화면·새로 만들기 화면 공용) -->
  <template id="tpl-composer">
    <div class="card shadow-sm rounded-4 ls-composer">
      <div class="card-body p-2">
        <div class="d-flex flex-wrap gap-1 px-1" data-role="files"></div>
        <textarea class="form-control border-0 shadow-none ls-composer-input" rows="2" data-role="input"
          placeholder="어떤 슬라이드를 만들까요?"></textarea>

        <div class="border-top mt-2 pt-2 px-1 d-none" data-role="options">
          <div class="small mb-1">테마 <span class="text-muted">(고른 테마는 다음에도 기본으로 쓰입니다)</span></div>
          <div data-opt="theme"></div>
        </div>

        <div class="d-flex align-items-center gap-1 mt-1">
          <button type="button" class="btn btn-sm btn-light" data-role="attach" title="자료 첨부 (PDF·PPTX·이미지·TXT/MD)"><i class="bi bi-paperclip"></i></button>
          <button type="button" class="btn btn-sm btn-light" data-role="toggle-options"><i class="bi bi-palette"></i> 테마</button>
          <span class="small text-muted ms-2 d-none d-sm-inline">Enter 보내기 · Shift+Enter 줄바꿈</span>
          <button type="button" class="btn btn-primary rounded-circle ms-auto ls-send" data-role="send" title="보내기"><i class="bi bi-arrow-up"></i></button>
        </div>
        <input type="file" class="d-none" data-role="file" multiple accept=".pdf,.pptx,.png,.jpg,.jpeg,.webp,.txt,.md,.ppt">
      </div>
    </div>
  </template>

  <template id="tpl-editor">
    <section>
      <div class="d-flex flex-wrap align-items-center gap-2 border-bottom pb-2 mb-2">

        todayStamp() {
          const d = new Date();
          return '' + d.getFullYear() + Util.pad(d.getMonth() + 1, 2) + Util.pad(d.getDate(), 2);
        },

        formatWhen(iso) {
          if (!iso) return '';
          const t = new Date(iso).getTime();
          const diff = Date.now() - t;
          if (diff < 60000) return '방금';
          if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
          if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
          const d = new Date(t);
          return `${d.getFullYear()}.${Util.pad(d.getMonth() + 1, 2)}.${Util.pad(d.getDate(), 2)}`;
        },

        safeFileName(name) {
          return String(name || '슬라이드').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').trim().slice(0, 80) || '슬라이드';
        },

        escapeHtml(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        },

        debounce(fn, ms) {
          let timer = null;
          const wrapped = function (...args) {
            clearTimeout(timer);
            timer = setTimeout(() => { timer = null; fn.apply(this, args); }, ms);
          };
          wrapped.flush = function (...args) {
            if (timer) { clearTimeout(timer); timer = null; fn.apply(this, args); }
          };
          wrapped.cancel = function () { clearTimeout(timer); timer = null; };
          return wrapped;
        },

        clamp(v, min, max) { return Math.min(max, Math.max(min, v)); },

        async sha256(blobOrBuffer) {
          const buf = blobOrBuffer instanceof Blob ? await blobOrBuffer.arrayBuffer() : blobOrBuffer;
          const digest = await crypto.subtle.digest('SHA-256', buf);
          return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        },

        blobToDataUrl(blob) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
          });
        },

        async blobToBase64(blob) {
          const url = await Util.blobToDataUrl(blob);
          return String(url).slice(String(url).indexOf(',') + 1);
        },

        dataUrlToBlob(dataUrl) {
          const comma = dataUrl.indexOf(',');
          const header = dataUrl.slice(0, comma);
          const mime = (header.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
          if (/;base64/i.test(header)) {
            const bin = atob(dataUrl.slice(comma + 1));
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return new Blob([arr], { type: mime });
          }
          return new Blob([decodeURIComponent(dataUrl.slice(comma + 1))], { type: mime });
        },

        loadImage(src) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
            img.src = src;
          });
        },

        // 긴 변을 maxSide로 줄인다. SVG/GIF는 그대로 둔다.
        async shrinkImage(blob, maxSide) {
          const limit = maxSide || LIMITS.imageMaxSide;
          if (/svg|gif/i.test(blob.type)) return { blob, width: 0, height: 0 };
          const url = URL.createObjectURL(blob);
          try {
            const img = await Util.loadImage(url);
            const longSide = Math.max(img.naturalWidth, img.naturalHeight);
            if (longSide <= limit && blob.size <= LIMITS.maxImageBytes) {
              return { blob, width: img.naturalWidth, height: img.naturalHeight };
            }
            const ratio = Math.min(1, limit / longSide);
            const w = Math.max(1, Math.round(img.naturalWidth * ratio));
            const h = Math.max(1, Math.round(img.naturalHeight * ratio));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const type = /png/i.test(blob.type) ? 'image/png' : 'image/jpeg';
            const out = await new Promise(res => canvas.toBlob(res, type, 0.9));
            return { blob: out || blob, width: w, height: h };
          } catch (err) {
            return { blob, width: 0, height: 0 };
          } finally {
            URL.revokeObjectURL(url);
          }
        },

        toast(message, kind) {
          const area = document.getElementById('ls-toast-area');
          if (!area) return;
          const box = document.createElement('div');
          box.className = 'toast align-items-center text-bg-' + (kind || 'dark') + ' border-0 show';
          const row = document.createElement('div');
          row.className = 'd-flex';
          const body = document.createElement('div');
          body.className = 'toast-body';
          body.textContent = message;
          const close = document.createElement('button');
          close.type = 'button';
          close.className = 'btn-close btn-close-white me-2 m-auto';
          close.addEventListener('click', () => box.remove());
          row.append(body, close);
          box.append(row);
          area.append(box);
          setTimeout(() => box.remove(), kind === 'danger' ? 9000 : 4500);
        },

        // Bootstrap 모달 기반 확인창. resolve(true/false)
        confirm(message, options) {
          const opts = options || {};
          return new Promise(resolve => {
            const el = document.getElementById('ls-modal-info');
            el.querySelector('#ls-info-title').textContent = opts.title || '확인';
            const body = el.querySelector('#ls-info-body');
            body.textContent = '';
            String(message).split('\n').forEach(line => {
              const p = document.createElement('p');
              p.className = 'mb-1';
              p.textContent = line;
              body.append(p);
            });
            const footer = el.querySelector('#ls-info-footer');
            footer.textContent = '';
            const cancel = document.createElement('button');
            cancel.className = 'btn btn-secondary';
            cancel.textContent = opts.cancelText || '취소';
            const ok = document.createElement('button');
            ok.className = 'btn btn-' + (opts.danger ? 'danger' : 'primary');
            ok.textContent = opts.okText || '확인';
            footer.append(cancel, ok);
            const modal = bootstrap.Modal.getOrCreateInstance(el);
            let answer = false;
            let done = false;
            const finish = () => { if (done) return; done = true; resolve(answer); };
            // 나타나는 중에 눌러 hide()가 무시되더라도 멈추지 않도록 한 번 더 닫는다.
            const close = () => {
              try { modal.hide(); } catch (err) { /* 무시 */ }
              setTimeout(() => {
                if (done) return;
                try { modal.hide(); } catch (err) { /* 무시 */ }
                setTimeout(finish, 400);
              }, 600);
            };
            ok.addEventListener('click', () => { answer = true; close(); });
            cancel.addEventListener('click', () => { answer = false; close(); });
            el.addEventListener('hidden.bs.modal', finish, { once: true });
            modal.show();
          });
        },

        // 안내용 모달(내용은 DOM 노드로 받는다)
        showInfo(title, node, footerNodes) {
          const el = document.getElementById('ls-modal-info');
          el.querySelector('#ls-info-title').textContent = title;
          const body = el.querySelector('#ls-info-body');
          body.textContent = '';
          body.append(node);
          const footer = el.querySelector('#ls-info-footer');
          footer.textContent = '';
          (footerNodes || []).forEach(n => footer.append(n));
          const close = document.createElement('button');
          close.className = 'btn btn-secondary';
          close.textContent = '닫기';
          close.setAttribute('data-bs-dismiss', 'modal');
          footer.append(close);
          bootstrap.Modal.getOrCreateInstance(el).show();
          return el;
        },

        saveBlob(blob, filename) {
          if (window.saveAs) { window.saveAs(blob, filename); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        },

        rgbToHex(value) {
          if (!value) return null;
          const v = String(value).trim();
          if (v.startsWith('#')) {
            if (v.length === 4) return '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
            return v.slice(0, 7);
          }
          const m = v.match(/rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i);
          if (!m) return null;
          const hex = n => Util.clamp(Math.round(parseFloat(n)), 0, 255).toString(16).padStart(2, '0');
          return '#' + hex(m[1]) + hex(m[2]) + hex(m[3]);
        },

        isTransparent(value) {
          if (!value) return true;
          const m = String(value).match(/rgba?\([^)]*?,\s*([\d.]+)\s*\)/);
          return String(value) === 'transparent' || (m && parseFloat(m[1]) === 0);
        },

        readingSeconds(text) {
          // 한국어 대본 기준 분당 약 300자
          return Math.round((String(text || '').replace(/\s/g, '').length / 300) * 60);
        }
      };

      /* ===== 3. SettingsStore (localStorage) ===== */

      const SettingsStore = {
        KEYS: {
          apiKey: 'lessonStudio.geminiApiKey',
          model: 'lessonStudio.geminiModel',
          theme: 'lessonStudio.defaultTheme',
          pptxFont: 'lessonStudio.pptxFont'
        },

        // [이 기기에 저장]을 끈 키는 이 탭에서만 쓴다(탭을 닫으면 브라우저가 지운다).
        SESSION_KEY: 'lessonStudio.geminiApiKey.session',

        // 예전에 구조 잡기용·생성용으로 나눠 저장하던 모델 이름(생성용을 우선 이어받는다)
        LEGACY_MODEL_KEYS: ['lessonStudio.geminiModelSlides', 'lessonStudio.geminiModelOutline'],

        read(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            return raw === null ? fallback : raw;
          } catch (err) { return fallback; }
        },

        write(key, value) {
          try {
            if (value === null || value === undefined || value === '') localStorage.removeItem(key);
            else localStorage.setItem(key, String(value));
            return true;
          } catch (err) {
            Util.toast('이 브라우저에서는 설정을 저장할 수 없습니다.', 'warning');
            return false;
          }
        },

        get all() {
          const K = SettingsStore.KEYS;
          return {
            apiKey: SettingsStore.apiKey(),
            model: SettingsStore.read(K.model, '') ||
              SettingsStore.LEGACY_MODEL_KEYS.map(key => SettingsStore.read(key, '')).find(Boolean) || DEFAULT_MODEL,
            theme: SettingsStore.read(K.theme, DEFAULT_THEME),
            pptxFont: SettingsStore.read(K.pptxFont, '맑은 고딕')
          };
        },

        apiKey() {
          let sessionKey = '';
          try { sessionKey = sessionStorage.getItem(SettingsStore.SESSION_KEY) || ''; } catch (err) { /* 무시 */ }
          return SettingsStore.read(SettingsStore.KEYS.apiKey, '') || sessionKey;
        },

        hasApiKey() { return !!SettingsStore.apiKey(); },

        isKeyRemembered() { return !!SettingsStore.read(SettingsStore.KEYS.apiKey, ''); },

        saveApiKey(key, remember) {
          try {
            if (remember || !key) sessionStorage.removeItem(SettingsStore.SESSION_KEY);
            else sessionStorage.setItem(SettingsStore.SESSION_KEY, key);
          } catch (err) { /* 무시 */ }
          SettingsStore.write(SettingsStore.KEYS.apiKey, remember ? key : null);
        }
      };

      /* ===== 3-1. VersionStore (임시 기록) =====
         수정할 때마다 브라우저 세션 저장소에 남긴다.
         sessionStorage는 탭을 닫는 순간 브라우저가 스스로 비우므로,
         "창을 닫으면 임시 기록도 사라진다"는 조건이 그대로 지켜진다. */

      const VersionStore = {
        PREFIX: 'lessonStudio.versions.',
        MAX_ENTRIES: 40,      // 메모리에 두는 기록 수
        MIRROR_ENTRIES: 5,    // 새로고침 대비로 세션 저장소에 남기는 수
        MIRROR_BYTES: 1200000,

        _mem: new Map(),

        _key(lessonId) { return VersionStore.PREFIX + lessonId; },

        // 메모리를 주 저장소로 쓰고, 비어 있으면(새로고침 직후) 세션 거울에서 되살린다.
        _entries(lessonId) {
          if (!VersionStore._mem.has(lessonId)) {
            let restored = [];
            try {
              const raw = sessionStorage.getItem(VersionStore._key(lessonId));
              const parsed = raw ? JSON.parse(raw) : [];
              if (Array.isArray(parsed)) restored = parsed;
            } catch (err) { restored = []; }
            VersionStore._mem.set(lessonId, restored);
          }
          return VersionStore._mem.get(lessonId);
        },

        // 최근 것이 위로 오게 돌려준다.
        list(lessonId) { return VersionStore._entries(lessonId).slice().reverse(); },

        add(lesson, reason) {
          if (!lesson || !lesson.id) return false;
          const body = JSON.stringify(lesson);
          const list = VersionStore._entries(lesson.id);
          if (list.length && list[list.length - 1].body === body) return false; // 바뀐 게 없으면 건너뛴다
          list.push({
            createdAt: Util.nowIso(),
            reason: reason || '자동 임시 저장',
            slides: (lesson.slides || []).length,
            body
          });
          while (list.length > VersionStore.MAX_ENTRIES) list.shift();
          VersionStore._mirror(lesson.id, list);
          return true;
        },

        // 세션 저장소에는 최근 몇 건만, 용량 안에서 조용히 복사해 둔다.
        _mirror(lessonId, list) {
          const keep = [];
          let bytes = 0;
          for (let i = list.length - 1; i >= 0 && keep.length < VersionStore.MIRROR_ENTRIES; i--) {
            bytes += list[i].body.length;
            if (keep.length && bytes > VersionStore.MIRROR_BYTES) break;
            keep.unshift(list[i]);
          }
          while (keep.length) {
            try {
              sessionStorage.setItem(VersionStore._key(lessonId), JSON.stringify(keep));
              return;
            } catch (err) {
              keep.shift(); // 용량이 모자라면 오래된 것부터 뺀다
            }
          }
          try { sessionStorage.removeItem(VersionStore._key(lessonId)); } catch (err) { /* 무시 */ }
        },

        restore(entry) {
          try { return JSON.parse(entry.body); } catch (err) { return null; }
        },

        clear(lessonId) {
          VersionStore._mem.delete(lessonId);
          try { sessionStorage.removeItem(VersionStore._key(lessonId)); } catch (err) { /* 무시 */ }
        }
      };

      /* ===== 4. LessonStore (IndexedDB) ===== */

      const LessonStore = {
        DB_NAME: 'lesson-studio',
        DB_VERSION: 1,
        _db: null,

        async open() {
          if (LessonStore._db) return LessonStore._db;
          LessonStore._db = await new Promise((resolve, reject) => {
            const request = indexedDB.open(LessonStore.DB_NAME, LessonStore.DB_VERSION);
            request.onupgradeneeded = () => {
              const db = request.result;
              if (!db.objectStoreNames.contains('lessons')) db.createObjectStore('lessons', { keyPath: 'id' });
              if (!db.objectStoreNames.contains('assets')) {
                const store = db.createObjectStore('assets', { keyPath: 'assetId' });
                store.createIndex('lessonId', 'lessonId', { unique: false });
                store.createIndex('sha256', 'sha256', { unique: false });
              }
              if (!db.objectStoreNames.contains('versions')) {
                const store = db.createObjectStore('versions', { autoIncrement: true });
                store.createIndex('lessonId', 'lessonId', { unique: false });
              }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
          return LessonStore._db;
        },

        async _tx(storeNames, mode, work) {
          const db = await LessonStore.open();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(storeNames, mode);
            let result;
            tx.oncomplete = () => resolve(result);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('저장소 작업이 중단되었습니다.'));
            Promise.resolve(work(tx)).then(value => { result = value; }).catch(err => {
              try { tx.abort(); } catch (e) { /* 무시 */ }
              reject(err);
            });
          });
        },

        _req(request) {
          return new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        },

        async listLessons() {
          return LessonStore._tx(['lessons'], 'readonly', tx => LessonStore._req(tx.objectStore('lessons').getAll()));
        },

        async getLesson(id) {
          return LessonStore._tx(['lessons'], 'readonly', tx => LessonStore._req(tx.objectStore('lessons').get(id)));
        },

        async putLesson(lesson) {
          lesson.updatedAt = Util.nowIso();
          lesson.revision = (lesson.revision || 0) + 1;
          await LessonStore._tx(['lessons'], 'readwrite', tx => LessonStore._req(tx.objectStore('lessons').put(lesson)));
          return lesson;
        },

        async deleteLesson(id) {
          VersionStore.clear(id);
          const assetIds = (await LessonStore.listAssets(id)).map(a => a.assetId);
          return LessonStore._tx(['lessons', 'assets', 'versions'], 'readwrite', async tx => {
            tx.objectStore('lessons').delete(id);
            assetIds.forEach(assetId => tx.objectStore('assets').delete(assetId));
            const index = tx.objectStore('versions').index('lessonId');
            const keys = await LessonStore._req(index.getAllKeys(IDBKeyRange.only(id)));
            keys.forEach(key => tx.objectStore('versions').delete(key));
          });
        },

        /* --- assets --- */

        async listAssets(lessonId) {
          return LessonStore._tx(['assets'], 'readonly', tx =>
            LessonStore._req(tx.objectStore('assets').index('lessonId').getAll(IDBKeyRange.only(lessonId))));
        },

        async getAsset(assetId) {
          return LessonStore._tx(['assets'], 'readonly', tx => LessonStore._req(tx.objectStore('assets').get(assetId)));
        },

        // 같은 sha256이 이미 있으면 재사용한다.
        async saveAsset(lessonId, blob, meta) {
          const info = meta || {};
          const hash = await Util.sha256(blob);
          const existing = (await LessonStore.listAssets(lessonId)).find(a => a.sha256 === hash);
          if (existing) return existing.assetId;
          const assetId = Util.uid('a_');
          const record = {
            assetId, lessonId, blob, mime: blob.type || 'application/octet-stream',
            w: info.width || 0, h: info.height || 0, sha256: hash
          };
          await LessonStore._tx(['assets'], 'readwrite', tx => LessonStore._req(tx.objectStore('assets').put(record)));
          return assetId;
        },

        async copyAssets(fromLessonId, toLessonId) {
          const assets = await LessonStore.listAssets(fromLessonId);
          const map = {};
          for (const asset of assets) {
            const copy = Object.assign({}, asset, { assetId: Util.uid('a_'), lessonId: toLessonId });
            map[asset.assetId] = copy.assetId;
            await LessonStore._tx(['assets'], 'readwrite', tx => LessonStore._req(tx.objectStore('assets').put(copy)));
          }
          return map;
        },

        async requestPersist() {
          try {
            if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
          } catch (err) { /* 무시 */ }
        }
      };

      /* --- 슬라이드 묶음 모델 도우미 --- */

      const LessonModel = {
        create(meta) {
          const settings = SettingsStore.all;
          return {
            id: Util.uid('l_'),
            schemaVersion: SCHEMA_VERSION,
            meta: Object.assign({
              title: '새 슬라이드', subject: '',
              language: 'ko', objectives: [], theme: settings.theme, tags: [], transition: 'none'
            }, meta || {}),
            phases: JSON.parse(JSON.stringify(PHASE_DEFAULT)),
            slides: [],
            sourcesUsed: [],
            ai: null,
            deletedAt: null,
            createdAt: Util.nowIso(),
            updatedAt: Util.nowIso(),
            revision: 0
          };
        },

        newSlide(partial) {
          return Object.assign({
            sid: '', title: '제목 없는 장', phase: '', html: '', css: '',
            script: '', memo: '', minutes: 2, hidden: false, sources: [], origin: 'manual'
          }, partial || {});
        },

        // 한 묶음 안에서 겹치지 않는 sid를 만든다.
        nextSid(lesson) {
          const used = new Set(lesson.slides.map(s => s.sid));
          let n = lesson.slides.length + 1;
          let sid = 's' + Util.pad(n, 2);
          while (used.has(sid)) { n++; sid = 's' + Util.pad(n, 2); }
          return sid;
        },

        ensureSids(lesson) {
          lesson.slides.forEach(slide => { if (!slide.sid) slide.sid = LessonModel.nextSid(lesson); });
          return lesson;
        },

        theme(lesson) { return THEMES[lesson && lesson.meta && lesson.meta.theme] ? lesson.meta.theme : DEFAULT_THEME; },

        visibleSlides(lesson) { return lesson.slides.filter(s => !s.hidden); },

        totalMinutes(lesson) { return lesson.slides.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0); },

        // 목록·검색용 제목을 HTML의 첫 제목에서 뽑는다.
        titleFromHtml(html) {
          const doc = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html');
          const heading = doc.querySelector('h1, h2, h3, .ls-title, .ls-subtitle, p');
          const text = heading ? heading.textContent.trim().replace(/\s+/g, ' ') : '';
          return text.slice(0, 40) || '제목 없는 장';
        }
      };

      /* ===== 5. SlideSanitizer (DOMPurify + CSS scoping) ===== */

      const SlideSanitizer = (function () {
        const ALLOWED_TAGS = [
          'div', 'section', 'article', 'header', 'footer',
          'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'span', 'strong', 'b', 'em', 'i', 'u', 's',
          'mark', 'small', 'sub', 'sup', 'br', 'hr',
          'ul', 'ol', 'li', 'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td', 'caption',
          'img', 'figure', 'figcaption', 'blockquote', 'cite', 'code', 'pre',
          'svg', 'g', 'path', 'rect', 'circle', 'ellipse', 'line', 'polyline', 'polygon',
          'text', 'tspan', 'defs', 'lineargradient', 'radialgradient', 'stop', 'marker'
        ];

        const ALLOWED_ATTR = [
          'class', 'style', 'data-eid', 'src', 'alt', 'title', 'colspan', 'rowspan', 'width', 'height',
          'viewbox', 'viewBox', 'd', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry',
          'points', 'fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'transform',
          'opacity', 'font-size', 'font-weight', 'text-anchor', 'dominant-baseline', 'offset',
          'stop-color', 'stop-opacity', 'gradientunits', 'gradientUnits', 'marker-end', 'marker-start',
          'markerwidth', 'markerheight', 'refx', 'refy', 'orient', 'preserveaspectratio', 'id'
        ];

        const FORBID_TAGS = ['script', 'style', 'link', 'meta', 'iframe', 'object', 'embed', 'form',
          'input', 'button', 'textarea', 'select', 'a', 'video', 'audio', 'canvas', 'foreignobject'];

        let hooksReady = false;

        function installHooks() {
          if (hooksReady || typeof DOMPurify === 'undefined') return;
          DOMPurify.addHook('afterSanitizeAttributes', node => {
            if (!node.getAttribute) return;

            // 외부 링크는 전부 제거(SVG 내부 #id 참조만 허용)
            ['href', 'xlink:href'].forEach(name => {
              const value = node.getAttribute(name);
              if (value === null) return;
              if (!/^#[\w-]+$/.test(value.trim())) node.removeAttribute(name);
            });

            // 이미지 주소 제한
            if (node.tagName && node.tagName.toLowerCase() === 'img') {
              const src = node.getAttribute('src');
              if (src !== null && !isAllowedSrc(src)) {
                node.removeAttribute('src');
                if (!node.getAttribute('data-ls-placeholder')) {
                  node.setAttribute('data-ls-placeholder', node.getAttribute('alt') || '외부 이미지(불러오지 않음)');
                }
              }
            }

            // style 속성 정리
            const style = node.getAttribute('style');
            if (style !== null) {
              const cleaned = cleanDeclarations(style);
              if (cleaned) node.setAttribute('style', cleaned);
              else node.removeAttribute('style');
            }
          });
          hooksReady = true;
        }

        function isAllowedSrc(src) {
          const v = String(src).trim();
          return /^asset:[A-Za-z0-9_]+$/.test(v)
            || /^data:image\/(png|jpeg|jpg|webp|gif|svg\+xml);/i.test(v)
            || /^blob:/i.test(v);
        }

        // 선언부(declaration) 문자열에서 위험한 값을 뺀다.
        function cleanDeclarations(text, keyframeMap) {
          return String(text)
            .split(';')
            .map(part => part.trim())
            .filter(Boolean)
            .map(part => {
              const colon = part.indexOf(':');
              if (colon < 0) return '';
              const prop = part.slice(0, colon).trim().toLowerCase();
              let value = part.slice(colon + 1).trim();
              if (/expression|behavior|@import|javascript:/i.test(value)) return '';
              if (/url\(/i.test(value) && !/url\(\s*['"]?data:image\//i.test(value)) return '';
              if (prop === 'position' && /fixed/i.test(value)) value = 'absolute';
              if (prop === 'behavior' || prop === '-moz-binding') return '';
              if (keyframeMap && (prop === 'animation' || prop === 'animation-name')) {
                Object.keys(keyframeMap).forEach(name => {
                  const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                  value = value.replace(new RegExp('(^|[\\s,])' + escaped + '(?![\\w-])', 'g'), '$1' + keyframeMap[name]);
                });
              }
              return prop + ': ' + value;
            })
            .filter(Boolean)
            .join('; ');
        }

        // data-eid를 붙일 대상인지
        function needsEid(el) {
          const tag = el.tagName.toLowerCase();
          if (['img', 'svg'].includes(tag)) return true;
          if (['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'li', 'td', 'th', 'blockquote', 'figcaption', 'caption', 'pre'].includes(tag)) return true;
          if (['div', 'span', 'section'].includes(tag)) {
            const hasOwnText = Array.from(el.childNodes).some(n => n.nodeType === 3 && n.textContent.trim());
            return hasOwnText;
          }
          return false;
        }

        function assignEids(root, usedSet) {
          const used = usedSet || new Set();
          root.querySelectorAll('[data-eid]').forEach(el => used.add(el.getAttribute('data-eid')));
          let counter = 1;
          const nextEid = () => {
            let eid = 'e' + Util.pad(counter++, 4);
            while (used.has(eid)) eid = 'e' + Util.pad(counter++, 4);
            used.add(eid);
            return eid;
          };
          root.querySelectorAll('*').forEach(el => {
            if (el.closest('svg') && el.tagName.toLowerCase() !== 'svg') return;
            if (el.hasAttribute('data-eid')) return;
            if (needsEid(el)) el.setAttribute('data-eid', nextEid());
          });
          return root;
        }

        /* --- CSS 범위 제한 --- */

        function parseSheet(css) {
          try {
            const sheet = new CSSStyleSheet();
            sheet.replaceSync(css);
            return sheet;
          } catch (err) { /* 폴백으로 간다 */ }
          try {
            const doc = document.implementation.createHTMLDocument('ls');
            const styleEl = doc.createElement('style');
            styleEl.textContent = css;
            doc.head.append(styleEl);
            return styleEl.sheet;
          } catch (err) {
            return null;
          }
        }

        function scopeSelector(selector, scope) {
          return selector.split(',').map(part => {
            const sel = part.trim();
            if (!sel) return '';
            if (/^(:root|html|body)$/i.test(sel)) return scope;
            if (sel === '*') return scope + ', ' + scope + ' *';
            if (/^(:root|html|body)\b/i.test(sel)) return scope + ' ' + sel.replace(/^(:root|html|body)\s*/i, '');
            return scope + ' ' + sel;
          }).filter(Boolean).join(', ');
        }

        // @keyframes 이름도 장 단위로 바꿔 다른 장과 섞이지 않게 한다.
        function collectKeyframes(rules, sid, map) {
          Array.from(rules || []).forEach(rule => {
            if (rule.type === CSSRule.KEYFRAMES_RULE) map[rule.name] = 'ls-' + sid + '-' + rule.name;
            else if (rule.type === CSSRule.MEDIA_RULE) collectKeyframes(rule.cssRules, sid, map);
          });
          return map;
        }

        function rulesToText(rules, scope, removed, keyframeMap) {
          let out = '';
          Array.from(rules || []).forEach(rule => {
            if (rule.type === CSSRule.STYLE_RULE) {
              const body = cleanDeclarations(rule.style.cssText, keyframeMap);
              if (body) out += scopeSelector(rule.selectorText, scope) + ' { ' + body + ' }\n';
            } else if (rule.type === CSSRule.MEDIA_RULE) {
              const inner = rulesToText(rule.cssRules, scope, removed, keyframeMap);
              if (inner) out += '@media ' + rule.conditionText + ' {\n' + inner + '}\n';
            } else if (rule.type === CSSRule.KEYFRAMES_RULE) {
              const frames = Array.from(rule.cssRules || [])
                .map(frame => frame.keyText + ' { ' + cleanDeclarations(frame.style.cssText) + ' }')
                .join(' ');
              out += '@keyframes ' + ((keyframeMap && keyframeMap[rule.name]) || rule.name) + ' { ' + frames + ' }\n';
            } else {
              removed.push('CSS ' + (rule.cssText || '').slice(0, 40));
            }
          });
          return out;
        }

        function scopeCss(css, sid, removed) {
          if (!css || !css.trim()) return '';
          const scope = '.ls-stage[data-ls-sid="' + sid + '"]';
          const sheet = parseSheet(css);
          if (!sheet) { removed.push('CSS(해석 실패)'); return ''; }
          const keyframeMap = collectKeyframes(sheet.cssRules, sid, {});
          return rulesToText(sheet.cssRules, scope, removed, keyframeMap);
        }

        /* --- 공개 API --- */

        function sanitizeSlide(input) {
          installHooks();
          const sid = input.sid || 's00';
          const removed = [];
          let rawHtml = String(input.html || '');
          if (rawHtml.length > LIMITS.maxSlideHtml) {
            rawHtml = rawHtml.slice(0, LIMITS.maxSlideHtml);
            removed.push('HTML 길이 초과분');
          }

          let clean = rawHtml;
          if (typeof DOMPurify !== 'undefined') {
            clean = DOMPurify.sanitize(rawHtml, {
              ALLOWED_TAGS, ALLOWED_ATTR, FORBID_TAGS,
              FORBID_ATTR: ['href', 'xlink:href', 'srcset', 'formaction', 'xmlns:xlink'],
              ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|callto|sms|cid|xmpp|asset|blob):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i,
              ALLOW_DATA_ATTR: true,
              ALLOW_ARIA_ATTR: false,
              KEEP_CONTENT: true,
              RETURN_DOM: false
            });
            (DOMPurify.removed || []).forEach(item => {
              const name = item.element ? item.element.nodeName : (item.attribute ? item.attribute.name : '요소');
              const lower = String(name).toLowerCase();
              // DOMPurify가 보고하는 문서 껍데기는 사용자에게 알릴 내용이 아니다
              if (['body', 'html', 'head', '#document', '#document-fragment'].includes(lower)) return;
              removed.push(lower);
            });
          } else {
            clean = Util.escapeHtml(rawHtml);
            removed.push('DOMPurify 미로딩(글자만 남김)');
          }

          const holder = document.createElement('div');
          holder.innerHTML = clean;
          assignEids(holder);

          let rawCss = String(input.css || '');
          if (rawCss.length > LIMITS.maxSlideCss) {
            rawCss = rawCss.slice(0, LIMITS.maxSlideCss);
            removed.push('CSS 길이 초과분');
          }
          const scopedCss = scopeCss(rawCss, sid, removed);

          return {
            html: holder.innerHTML,
            css: rawCss,
            scopedCss,
            removed: Array.from(new Set(removed))
          };
        }

        return { sanitizeSlide, scopeCss, assignEids, cleanDeclarations, isAllowedSrc, ALLOWED_TAGS };
      })();

      /* ===== 6. SlideRenderer (무대, 썸네일, KaTeX, 넘침 감지) ===== */

      const AssetUrls = {
        _cache: new Map(),
        async urlFor(assetId) {
          if (AssetUrls._cache.has(assetId)) return AssetUrls._cache.get(assetId);
          const asset = await LessonStore.getAsset(assetId);
          if (!asset) return null;
          const url = URL.createObjectURL(asset.blob);
          AssetUrls._cache.set(assetId, url);
          return url;
        },
        forget(assetId) {
          const url = AssetUrls._cache.get(assetId);
          if (url) { URL.revokeObjectURL(url); AssetUrls._cache.delete(assetId); }
        }
      };

      const SlideRenderer = {
        themeVars(themeName) {
          const theme = THEMES[themeName] || THEMES[DEFAULT_THEME];
          return {
            '--ls-bg': theme.bg, '--ls-fg': theme.fg, '--ls-muted': theme.muted,
            '--ls-accent': theme.accent, '--ls-accent-2': theme.accent2,
            '--ls-accent-soft': theme.accentSoft, '--ls-card': theme.card,
            '--ls-border': theme.border, '--ls-font': THEME_FONT
          };
        },

        applyTheme(stage, themeName) {
          const vars = SlideRenderer.themeVars(themeName);
          Object.keys(vars).forEach(name => stage.style.setProperty(name, vars[name]));
          stage.style.fontFamily = 'var(--ls-font)';
        },

        themeCssText(themeName) {
          const vars = SlideRenderer.themeVars(themeName);
          return Object.keys(vars).map(name => name + ': ' + vars[name] + ';').join(' ');
        },

        /**
         * 슬라이드를 무대에 그린다.
         * mode: edit | present | thumb | export | print
         */
        render(lesson, slide, container, mode, options) {
          const opts = options || {};
          const clean = SlideSanitizer.sanitizeSlide({ html: slide.html, css: slide.css, sid: slide.sid });

          container.textContent = '';
          const wrap = document.createElement('div');
          wrap.className = 'ls-stage-wrap';

          const styleEl = document.createElement('style');
          styleEl.setAttribute('data-ls-scope', slide.sid);
          styleEl.textContent = clean.scopedCss;

          const stage = document.createElement('div');
          stage.className = 'ls-stage';
          stage.dataset.lsSid = slide.sid;
          stage.dataset.lsMode = mode;
          if (mode === 'edit') stage.classList.add('ls-edit-mode');
          const playAnim = !!opts.animate || mode === 'present';
          if (playAnim) stage.classList.add('ls-animate');
          SlideRenderer.applyTheme(stage, LessonModel.theme(lesson));
          if (slide.background) stage.style.background = slide.background;
          stage.innerHTML = clean.html;

          const transition = opts.transition || (lesson.meta && lesson.meta.transition);
          if (playAnim && transition && transition !== 'none') wrap.classList.add('ls-trans-' + transition);

          wrap.append(styleEl, stage);
          container.append(wrap);

          SlideRenderer.scale(wrap, stage, opts.scale != null ? opts.scale : SlideRenderer.fitScale(container, opts.maxWidth));

          SlideRenderer.wireAssets(stage);
          SlideRenderer.drawPlaceholders(stage);
          if (!opts.skipMath) SlideRenderer.renderMath(stage);

          return { wrap, stage, removed: clean.removed };
        },

        fitScale(container, maxWidth) {
          const available = maxWidth || container.clientWidth || container.getBoundingClientRect().width || STAGE_W;
          return Math.max(0.05, Math.min(1.6, available / STAGE_W));
        },

        scale(wrap, stage, scale) {
          stage.style.transform = 'scale(' + scale + ')';
          wrap.style.width = Math.round(STAGE_W * scale) + 'px';
          wrap.style.height = Math.round(STAGE_H * scale) + 'px';
          wrap.dataset.lsScale = String(scale);
        },

        async wireAssets(stage) {
          const images = Array.from(stage.querySelectorAll('img[src^="asset:"]'));
          for (const img of images) {
            const assetId = img.getAttribute('src').slice('asset:'.length);
            const url = await AssetUrls.urlFor(assetId);
            if (url) { img.dataset.lsAsset = assetId; img.src = url; }
            else {
              img.removeAttribute('src');
              img.setAttribute('data-ls-placeholder', '이미지를 찾을 수 없습니다');
              SlideRenderer.drawPlaceholders(stage);
            }
          }
        },

        // src 없는 img[data-ls-placeholder]를 보기 좋은 상자로 바꾼다(표시 전용).
        drawPlaceholders(stage) {
          stage.querySelectorAll('img[data-ls-placeholder]').forEach(img => {
            if (img.getAttribute('src')) return;
            const box = document.createElement('div');
            box.className = 'ls-placeholder-box';
            box.setAttribute('data-ls-placeholder', img.getAttribute('data-ls-placeholder') || '사진');
            box.setAttribute('data-ls-ph-render', '1');
            if (img.hasAttribute('data-eid')) box.setAttribute('data-eid', img.getAttribute('data-eid'));
            if (img.getAttribute('style')) box.setAttribute('style', img.getAttribute('style'));
            if (img.getAttribute('class')) box.className += ' ' + img.getAttribute('class');
            const label = document.createElement('span');
            label.textContent = '🖼 ' + (img.getAttribute('data-ls-placeholder') || '사진');
            box.append(label);
            img.replaceWith(box);
          });
        },

        async renderMath(stage) {
          const text = stage.textContent || '';
          if (!/\\\(|\\\[|\$\$/.test(text)) return;
          try {
            await LibraryLoader.katex();
            window.renderMathInElement(stage, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false,
              ignoredClasses: ['ls-no-math']
            });
          } catch (err) {
            Util.toast('수식 표시 라이브러리를 불러오지 못했습니다.', 'warning');
          }
        },

        // 1280x720을 넘는 요소를 표시한다. 넘친 요소 수를 돌려준다.
        markOverflow(stage) {
          let count = 0;
          stage.querySelectorAll('.ls-overflow-warn').forEach(el => el.classList.remove('ls-overflow-warn'));
          const scale = parseFloat(stage.parentElement && stage.parentElement.dataset.lsScale) || 1;
          const base = stage.getBoundingClientRect();
          stage.querySelectorAll('[data-eid]').forEach(el => {
            const rect = el.getBoundingClientRect();
            const left = (rect.left - base.left) / scale;
            const top = (rect.top - base.top) / scale;
            const right = left + rect.width / scale;
            const bottom = top + rect.height / scale;
            if (left < -2 || top < -2 || right > STAGE_W + 2 || bottom > STAGE_H + 2) {
              el.classList.add('ls-overflow-warn');
              count++;
            }
          });
          if (stage.scrollHeight > stage.clientHeight + 2 || stage.scrollWidth > stage.clientWidth + 2) count++;
          return count;
        }
      };

      /* ===== 7. LibraryLoader (CDN 지연 로드) ===== */

      const LibraryLoader = (function () {
        const cache = new Map();

        function loadScript(url) {
          if (cache.has(url)) return cache.get(url);
          const promise = new Promise((resolve, reject) => {
            const el = document.createElement('script');
            el.src = url;
            el.onload = () => resolve(true);
            el.onerror = () => reject(new Error('라이브러리를 불러오지 못했습니다: ' + url));
            document.head.append(el);
          });
          cache.set(url, promise);
          return promise;
        }

        function loadCss(url) {
          const key = 'css:' + url;
          if (cache.has(key)) return cache.get(key);
          const promise = new Promise((resolve, reject) => {
            const el = document.createElement('link');
            el.rel = 'stylesheet';
            el.href = url;
            el.onload = () => resolve(true);
            el.onerror = () => reject(new Error('스타일을 불러오지 못했습니다: ' + url));
            document.head.append(el);
          });
          cache.set(key, promise);
          return promise;
        }

        async function guard(label, work) {
          try { return await work(); }
          catch (err) {
            Util.toast(label + ' 기능을 쓸 수 없습니다. 학교망에서 차단되었을 수 있습니다.', 'danger');
            throw err;
          }
        }

        return {
          loadScript, loadCss,
          sortable: () => guard('장표 순서 바꾸기', async () => { await loadScript(CDN.sortable); return window.Sortable; }),
          katex: () => guard('수식', async () => {
            await Promise.all([loadCss(CDN.katexCss), loadScript(CDN.katexJs)]);
            await loadScript(CDN.katexAuto);
            return window.katex;
          }),
          jszip: () => guard('ZIP 파일 처리', async () => { await loadScript(CDN.jszip); return window.JSZip; }),
          pptxgen: () => guard('PowerPoint 내보내기', async () => { await loadScript(CDN.pptxgen); return window.PptxGenJS; }),
          htmlToImage: () => guard('슬라이드 이미지 변환', async () => { await loadScript(CDN.htmlToImage); return window.htmlToImage; }),
          fileSaver: () => guard('파일 저장', async () => { await loadScript(CDN.fileSaver); return window.saveAs; }),
          pdfjs: () => guard('PDF 읽기', async () => {
            if (window.__lsPdfjs) return window.__lsPdfjs;
            const lib = await import(CDN.pdfjs);
            lib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker;
            window.__lsPdfjs = lib;
            return lib;
          })
        };
      })();

      /* ===== 8. GeminiService + Prompts + Schemas ===== */

      const SYSTEM_INSTRUCTION = [

        '- 색은 CSS 변수만 쓴다: var(--ls-bg) var(--ls-fg) var(--ls-muted) var(--ls-accent) var(--ls-accent-2) var(--ls-accent-soft) var(--ls-card) var(--ls-border). (테마를 바꿔도 디자인이 유지되도록)',

        '- 수식은 LaTeX로 인라인 \\( … \\), 블록 \\[ … \\] 로 쓴다($ 기호 구분자 금지).',
        '- 확인 문제는 ls-quiz 구조로, 정답 보기에 data-ls-answer="true", 해설은 ls-quiz-explain.',
        '- [수정 요청일 때] 받은 HTML에서 유지하는 요소는 data-eid 속성을 그대로 두고, 새 요소에는 data-eid를 붙이지 않는다. 사용자가 넣은 이미지(src="asset:…")는 지우지 말고 그대로 둔다.',
        '- 같은 발표 자료의 장들은 "디자인 기준" 장의 색 사용·배치·머리말 스타일을 따라 통일한다.',
        '',

        '- script: 발표자가 그대로 읽을 수 있는 구어체, minutes에 맞는 분량(분당 약 300자). 수업이면 학생에게 던질 질문을 넣는다.',
        '- phase: 흐름 구간 이름(예: 도입·전개·정리, 서론·본론·결론). 요청의 성격에 맞게 정한다.',
        '- memo: 준비물, 예상 질문·오개념, 시간 조절 팁을 짧게.',
        '',
        '[개인정보] 실존 인물의 이름·연락처 등 개인정보를 만들거나 반복하지 않는다.'
      ].join('\n');

      const SCHEMAS = {
        outline: {
          type: 'object',
          properties: {
            title: { type: 'string' },
            objectives: { type: 'array', items: { type: 'string' } },
            phases: {
              type: 'array',
              items: {
                type: 'object',
                properties: { name: { type: 'string' }, minutes: { type: 'integer' } },
                required: ['name', 'minutes']

            },
            slides: {
              type: 'array',
              items: {
                type: 'object',
                properties: {
                  title: { type: 'string' },
                  phase: { type: 'string' },
                  points: { type: 'array', items: { type: 'string' } },
                  designHint: { type: 'string' },
                  minutes: { type: 'integer' }
                },
                required: ['title', 'phase', 'points', 'designHint', 'minutes']
              }
            }
          },
          required: ['title', 'objectives', 'phases', 'slides']
        },

        slides: {
          type: 'object',
          properties: {
            slides: {
              type: 'array',
              items: {
                type: 'object',
                properties: {
                  title: { type: 'string' },
                  phase: { type: 'string' },
                  html: { type: 'string' },
                  css: { type: 'string' },
                  script: { type: 'string' },
                  memo: { type: 'string' },
                  minutes: { type: 'integer' },
                  sources: {
                    type: 'array',
                    items: {
                      type: 'object',
                      properties: { name: { type: 'string' }, page: { type: 'integer' } },
                      required: ['name']
                    }
                  }
                },
                required: ['title', 'phase', 'html', 'css', 'script', 'memo', 'minutes']
              }
            }
          },
          required: ['slides']
        },

        revise: {
          type: 'object',
          properties: {
            slides: {
              type: 'array',
              items: {
                type: 'object',
                properties: {
                  sid: { type: 'string' },
                  html: { type: 'string' },
                  css: { type: 'string' },
                  script: { type: 'string' },
                  memo: { type: 'string' },
                  changeSummary: { type: 'string' }
                },
                required: ['sid', 'html', 'css', 'script', 'memo', 'changeSummary']
              }
            }
          },
          required: ['slides']
        }
      };

      const GeminiService = (function () {
        // 긴 응답도 글자가 계속 들어오는 동안은 기다리고, 아무 응답 없이 멈춘 경우만 끊는다.
        const IDLE_TIMEOUT_MS = 180000;    // 첫 글자(생각하는 시간 포함) 또는 다음 글자까지
        const TOTAL_TIMEOUT_MS = 900000;   // 한 번 호출의 최대 시간

        function apiKey() { return SettingsStore.apiKey(); }

        function describeError(status, bodyText) {
          if (status === 400) return '요청 형식이 올바르지 않습니다. 자료 크기를 줄이거나 다시 시도해 주세요.';
          if (status === 401 || status === 403) return 'API 키에 문제가 있습니다. AI 설정에서 키를 확인해 주세요.';
          if (status === 429) return 'Gemini 사용량 한도를 넘었습니다. 잠시 뒤 다시 시도해 주세요.';
          if (status >= 500) return 'Gemini 서버가 응답하지 않습니다. 잠시 뒤 다시 시도해 주세요.';
          return 'AI 호출에 실패했습니다 (코드 ' + status + ').';
        }

        function buildBody(options, schemaStyle) {
          const body = {
            systemInstruction: { parts: [{ text: options.system || SYSTEM_INSTRUCTION }] },
            contents: [{ role: 'user', parts: options.parts }]
          };
          if (options.schema) {
            // 최신 필드(responseFormat) 우선, 거부되면 예전 필드로 한 번 더 시도한다.
            body.generationConfig = schemaStyle === 'legacy'
              ? { responseMimeType: 'application/json', responseJsonSchema: options.schema }
              : { responseFormat: { text: { mimeType: 'APPLICATION_JSON', schema: options.schema } } };
          }
          return body;
        }

        async function postOnce(model, body, signal, onProgress) {
          const useStream = typeof onProgress === 'function';
          const url = GEMINI_BASE + '/models/' + encodeURIComponent(model) +
            (useStream ? ':streamGenerateContent?alt=sse' : ':generateContent');

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() },
            body: JSON.stringify(body),
            signal
          });

          if (!res.ok) {
            const text = await res.text().catch(() => '');
            const err = new Error(describeError(res.status, text));
            err.status = res.status;
            err.bodyText = text;
            throw err;
          }

          if (!useStream) {
            const data = await res.json();
            return collect(data);
          }

          // SSE 스트리밍
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let text = '';
          let usage = 0;
          let finishReason = null;
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data:')) continue;
              const payload = line.slice(5).trim();
              if (!payload || payload === '[DONE]') continue;
              let chunk;
              try { chunk = JSON.parse(payload); } catch (err) { continue; }
              const piece = collect(chunk);
              text += piece.text;
              usage = piece.usage || usage;
              finishReason = piece.finishReason || finishReason;
              onProgress(text.length);
            }
          }
          return { text, usage, finishReason };
        }

        function collect(data) {
          const candidate = (data.candidates || [])[0] || {};
          const parts = (candidate.content && candidate.content.parts) || [];
          const text = parts.map(p => p.text || '').join('');
          const usage = data.usageMetadata ? (data.usageMetadata.totalTokenCount || 0) : 0;
          return { text, usage, finishReason: candidate.finishReason || null };
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        /**
         * JSON 응답을 받는 공통 호출. 재시도·시간 제한·중단을 모두 여기서 처리한다.
         */
        async function generateJson(options) {
          if (!apiKey()) {
            const err = new Error('Gemini API 키가 없습니다. AI 설정에서 키를 입력해 주세요.');
            err.needsKey = true;
            throw err;
          }

          const controller = new AbortController();
          const outerSignal = options.signal;
          if (outerSignal) {
            if (outerSignal.aborted) controller.abort();
            else outerSignal.addEventListener('abort', () => controller.abort(), { once: true });
          }
          let timedOut = '';
          const totalTimer = setTimeout(() => { timedOut = 'total'; controller.abort(); }, TOTAL_TIMEOUT_MS);
          let idleTimer = null;
          const bump = () => {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => { timedOut = 'idle'; controller.abort(); }, IDLE_TIMEOUT_MS);
          };
          const onProgress = length => { bump(); if (options.onProgress) options.onProgress(length); };
          bump();

          let schemaStyle = 'modern';
          let lastError = null;

          try {
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const body = buildBody(options, schemaStyle);
                bump();
                const result = await postOnce(options.model, body, controller.signal, onProgress);

                if (result.finishReason && !['STOP', 'MAX_TOKENS', null].includes(result.finishReason)) {
                  throw new Error('AI가 안전 정책으로 응답을 멈췄습니다 (' + result.finishReason + '). 요청 내용을 바꿔 보세요.');
                }
                return parseJson(result.text);
              } catch (err) {
                if (timedOut && !(outerSignal && outerSignal.aborted)) {
                  throw new Error(timedOut === 'idle'
                    ? 'AI가 3분 동안 응답하지 않아 중단했습니다. 잠시 뒤 다시 시도하거나 더 빠른 모델(예: flash)로 바꿔 보세요.'
                    : 'AI 응답이 15분을 넘겨 중단했습니다. 첨부 자료를 줄이거나 장 수를 나눠 요청해 보세요.');
                }
                if (err.name === 'AbortError') throw new Error('중단했습니다.');
                lastError = err;

                // 최신 responseFormat 필드를 못 알아들으면 예전 필드로 한 번 더
                if (err.status === 400 && schemaStyle === 'modern' && options.schema) {
                  schemaStyle = 'legacy';
                  continue;
                }
                if (err.status === 429 || (err.status >= 500 && err.status < 600)) {
                  await sleep(1200 * Math.pow(2, attempt));
                  continue;
                }
                if (err.isJsonParse && attempt === 0) {
                  options = Object.assign({}, options, {
                    parts: options.parts.concat([{ text: '앞선 응답이 JSON으로 해석되지 않았다. 설명 없이 JSON만 다시 출력하라.' }])
                  });
                  continue;
                }
                throw err;
              }
            }
            throw lastError || new Error('AI 호출에 실패했습니다.');
          } finally {
            clearTimeout(totalTimer);
            clearTimeout(idleTimer);
          }
        }

        function parseJson(text) {
          const trimmed = String(text || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
          try {
            return JSON.parse(trimmed);
          } catch (err) {
            const start = trimmed.indexOf('{');
            const end = trimmed.lastIndexOf('}');
            if (start >= 0 && end > start) {
              try { return JSON.parse(trimmed.slice(start, end + 1)); } catch (inner) { /* 아래로 */ }
            }
            const error = new Error('AI 응답을 JSON으로 읽지 못했습니다.');
            error.isJsonParse = true;
            throw error;
          }
        }

        return { generateJson, describeError };
      })();

      /* ===== 9. SourceExtractor (PDF/PPTX/이미지/텍스트) ===== */

      const SourceExtractor = (function () {
        const INLINE_BUDGET_BYTES = 14 * 1024 * 1024; // 요청 전체 약 20MB 한도를 넘지 않도록
        const TEXT_LIMIT = 200000;

        function parsePageRange(text, max) {
          const value = String(text || '').trim();
          if (!value) return null;
          const pages = new Set();
          value.split(',').forEach(chunk => {
            const m = chunk.trim().match(/^(\d+)\s*-\s*(\d+)$/);
            if (m) {
              for (let i = parseInt(m[1], 10); i <= parseInt(m[2], 10); i++) if (i >= 1 && i <= max) pages.add(i);
            } else if (/^\d+$/.test(chunk.trim())) {
              const n = parseInt(chunk.trim(), 10);
              if (n >= 1 && n <= max) pages.add(n);
            }
          });
          return pages.size ? Array.from(pages).sort((a, b) => a - b) : null;
        }

        async function readText(file) {
          const text = await file.text();
          return text.slice(0, TEXT_LIMIT);
        }

        async function extractPdf(file, budget, pageRangeText) {
          const parts = [];
          const useInline = file.size <= budget.remaining && !pageRangeText;
          if (useInline) {
            budget.remaining -= file.size;
            parts.push({ text: '<자료 name="' + file.name + '" kind="pdf">' });
            parts.push({ inlineData: { mimeType: 'application/pdf', data: await Util.blobToBase64(file) } });
            parts.push({ text: '</자료>' });
            return { parts, pages: 0, note: 'PDF 원본 전달' };
          }

          const pdfjs = await LibraryLoader.pdfjs();
          const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
          const selected = parsePageRange(pageRangeText, doc.numPages) || Array.from({ length: doc.numPages }, (_, i) => i + 1);
          let body = '';
          const imageParts = [];
          let rendered = 0;

          for (const pageNo of selected) {
            const page = await doc.getPage(pageNo);
            const content = await page.getTextContent();
            const text = content.items.map(item => item.str).join(' ').replace(/\s+/g, ' ').trim();
            if (text.length > 20) {
              body += '[p.' + pageNo + '] ' + text + '\n';
            } else if (rendered < 20) {
              // 글자가 거의 없는 쪽(스캔본)은 그림으로
              const viewport = page.getViewport({ scale: 1 });
              const scale = Math.min(1600 / Math.max(viewport.width, viewport.height), 2);
              const scaled = page.getViewport({ scale });
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(scaled.width);
              canvas.height = Math.round(scaled.height);
              await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaled }).promise;
              const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.82));
              if (blob && blob.size < budget.remaining) {
                budget.remaining -= blob.size;
                imageParts.push({ text: '[' + file.name + ' p.' + pageNo + ' 이미지]' });
                imageParts.push({ inlineData: { mimeType: 'image/jpeg', data: await Util.blobToBase64(blob) } });
                rendered++;
              }
            }
          }

          parts.push({ text: '<자료 name="' + file.name + '" kind="pdf">\n' + body.slice(0, TEXT_LIMIT) + '\n</자료>' });
          parts.push(...imageParts);
          return { parts, pages: doc.numPages, note: '글자 추출 ' + selected.length + '쪽' + (rendered ? ', 이미지 ' + rendered + '쪽' : '') };
        }

        // PPTX 안의 글자·노트·큰 이미지를 뽑는다(가져오기에서도 재사용).
        async function extractPptxText(file, budget) {
          const JSZip = await LibraryLoader.jszip();
          const zip = await JSZip.loadAsync(file);
          const order = await PptxImporter.slideOrder(zip);
          let body = '';
          const imageParts = [];
          let imageCount = 0;

          for (let i = 0; i < order.length; i++) {
            const path = order[i];
            const xml = await zip.file(path).async('string');
            const doc = new DOMParser().parseFromString(xml, 'application/xml');
            const texts = Array.from(doc.getElementsByTagName('a:t')).map(n => n.textContent).join(' ').replace(/\s+/g, ' ').trim();
            body += '[슬라이드 ' + (i + 1) + '] ' + texts + '\n';
            const notes = await PptxImporter.readNotes(zip, path);
            if (notes) body += '노트: ' + notes.replace(/\s+/g, ' ').trim() + '\n';
          }

          if (budget) {
            const mediaNames = Object.keys(zip.files).filter(n => /^ppt\/media\/.+\.(png|jpe?g|webp)$/i.test(n));
            for (const name of mediaNames) {
              if (imageCount >= 10) break;
              const blob = await zip.file(name).async('blob');
              if (blob.size < 60000 || blob.size > budget.remaining) continue;
              const shrunk = await Util.shrinkImage(blob, 1600);
              budget.remaining -= shrunk.blob.size;
              imageParts.push({ inlineData: { mimeType: shrunk.blob.type || 'image/png', data: await Util.blobToBase64(shrunk.blob) } });
              imageCount++;
            }
          }

          const parts = [{ text: '<자료 name="' + file.name + '" kind="pptx">\n' + body.slice(0, TEXT_LIMIT) + '\n</자료>' }];
          parts.push(...imageParts);
          return { parts, pages: order.length, note: order.length + '장' + (imageCount ? ', 이미지 ' + imageCount : '') };
        }

        /**
         * 첨부 목록을 Gemini parts 배열로 바꾼다.
         * sources: [{ file, pageRange }]
         */
        async function build(sources, onStatus) {
          const budget = { remaining: INLINE_BUDGET_BYTES };
          const parts = [];
          const used = [];
