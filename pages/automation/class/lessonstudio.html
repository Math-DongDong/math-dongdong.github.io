          insert.textContent = '넣기';
          insert.setAttribute('data-bs-dismiss', 'modal');
          insert.addEventListener('click', () => {
            if (input.value.trim()) EditorView.addElement('math', { latex: input.value.trim() });
          });
          Util.showInfo('수식 넣기', box, [insert]);
          draw();
        },

        addElement(kind, options) {
          if (EditorView.readOnly) return;
          const wrapper = document.createElement('div');
          wrapper.className = 'ls-abs';
          wrapper.style.left = '120px';
          wrapper.style.top = '120px';

          if (kind === 'text') {
            wrapper.className = 'ls-abs ls-body';
            wrapper.style.width = '420px';
            wrapper.textContent = '새 글상자';
          } else if (kind === 'rect' || kind === 'roundRect' || kind === 'ellipse') {
            wrapper.style.width = '260px';
            wrapper.style.height = kind === 'ellipse' ? '200px' : '160px';
            wrapper.style.background = 'var(--ls-accent-soft)';
            wrapper.style.border = '3px solid var(--ls-accent)';
            if (kind === 'roundRect') wrapper.style.borderRadius = '20px';
            if (kind === 'ellipse') wrapper.style.borderRadius = '50%';
          } else if (kind === 'line' || kind === 'arrow') {
            wrapper.style.width = '320px';
            wrapper.style.height = '40px';
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 320 40');
            svg.setAttribute('width', '320');
            svg.setAttribute('height', '40');
            const markerId = 'arw-' + Util.uid('').slice(0, 6);
            svg.innerHTML = (kind === 'arrow'
              ? '<defs><marker id="' + markerId + '" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">' +
                '<path d="M0,0 L10,5 L0,10 z" fill="var(--ls-accent)"/></marker></defs>'
              : '') +
              '<line x1="4" y1="20" x2="310" y2="20" stroke="var(--ls-accent)" stroke-width="5"' +
              (kind === 'arrow' ? ' marker-end="url(#' + markerId + ')"' : '') + '/>';
            wrapper.append(svg);
          } else if (kind === 'math') {
            wrapper.className = 'ls-abs ls-body';
            wrapper.textContent = '\\(' + (options && options.latex ? options.latex : 'x') + '\\)';
          } else if (kind === 'table') {
            const rows = parseInt(window.prompt('행 수', '3'), 10) || 3;
            const cols = parseInt(window.prompt('열 수', '3'), 10) || 3;
            wrapper.style.width = '600px';
            const table = document.createElement('table');
            table.className = 'ls-table';
            for (let r = 0; r < rows; r++) {
              const tr = document.createElement('tr');
              for (let c = 0; c < cols; c++) {
                const cell = document.createElement(r === 0 ? 'th' : 'td');
                cell.textContent = r === 0 ? '제목' + (c + 1) : '내용';
                tr.append(cell);
              }
              table.append(tr);
            }
            wrapper.append(table);
          }
          EditorView.insertIntoStage(wrapper);
        },

        async onImagePicked(event) {
          const file = (event.target.files || [])[0];
          event.target.value = '';
          if (!file) return;
          const targetEid = EditorView._replaceEid;
          EditorView._replaceEid = null;
          await EditorView.insertImageFile(file, targetEid);
        },

        async insertImageFile(file, targetEid) {
          if (EditorView.readOnly) return;
          if (file.size > LIMITS.maxImageBytes * 4) { Util.toast('이미지가 너무 큽니다.', 'warning'); return; }
          const shrunk = await Util.shrinkImage(file, LIMITS.imageMaxSide);
          const assetId = await LessonStore.saveAsset(EditorView.lesson.id, shrunk.blob, shrunk);
          const slide = EditorView.current();

          if (targetEid) {
            const holder = document.createElement('div');
            holder.innerHTML = slide.html;
            const target = holder.querySelector('[data-eid="' + CSS.escape(targetEid) + '"]');
            if (target && target.tagName.toLowerCase() === 'img') {
              target.setAttribute('src', 'asset:' + assetId);
              target.removeAttribute('data-ls-placeholder');
              slide.html = holder.innerHTML;
              EditorView.markDirty();
              EditorView.drawStage();
              EditorView.refreshThumb(EditorView.index);
              return;
            }
          }

          const img = document.createElement('img');
          img.className = 'ls-abs';
          img.style.left = '120px';
          img.style.top = '120px';
          img.style.width = Math.min(520, shrunk.width || 520) + 'px';
          img.setAttribute('src', 'asset:' + assetId);
          img.setAttribute('alt', file.name);
          EditorView.insertIntoStage(img);
        },

        async onStagePaste(event) {
          if (EditorView.readOnly) return;
          const items = Array.from((event.clipboardData || {}).items || []);
          const imageItem = items.find(item => item.type && item.type.startsWith('image/'));
          if (imageItem) {
            event.preventDefault();
            const blob = imageItem.getAsFile();
            if (blob) await EditorView.insertImageFile(blob);
          }
        },

        async onStageDrop(event) {
          event.preventDefault();
          const file = (event.dataTransfer.files || [])[0];
          if (file && /^image\//.test(file.type)) await EditorView.insertImageFile(file);
        },

        deleteElement() {
          const element = EditorView.selectedElement();
          if (!element) return;
          element.remove();
          EditorView.selectedEid = null;
          EditorView.commitStage();
          EditorView.drawStage();
        },

        duplicateElement() {
          const element = EditorView.selectedElement();
          if (!element) return;
          const copy = element.cloneNode(true);
          copy.querySelectorAll('[data-eid]').forEach(el => el.removeAttribute('data-eid'));
          copy.removeAttribute('data-eid');
          copy.classList.remove('ls-selected');
          if (copy.classList.contains('ls-abs')) {
            copy.style.left = ((parseFloat(copy.style.left) || 0) + 24) + 'px';
            copy.style.top = ((parseFloat(copy.style.top) || 0) + 24) + 'px';
          }
          element.after(copy);
          EditorView.commitStage();
          EditorView.drawStage();
        },

        reorderElement(direction) {
          const element = EditorView.selectedElement();
          if (!element) return;
          if (direction > 0 && element.nextElementSibling) element.nextElementSibling.after(element);
          if (direction < 0 && element.previousElementSibling) element.previousElementSibling.before(element);
          EditorView.commitStage();
          EditorView.drawStage();
        },

        // 등장 효과·장 전환을 그대로 한 번 재생해 본다.
        previewAnimation() {
          const host = document.getElementById('ls-stage-host');
          if (!host) return;
          EditorView.commitEditing();
          SlideRenderer.render(EditorView.lesson, EditorView.current(), host, 'present',
            { maxWidth: host.clientWidth || 800, animate: true });
          clearTimeout(EditorView._previewTimer);
          EditorView._previewTimer = setTimeout(() => {
            if (EditorView.lesson) EditorView.drawStage();
          }, 2400);
        },

        // 선택 요소의 효과 클래스를 하나만 남긴다.
        setAnimClass(group, value) {
          const element = EditorView.selectedElement();
          if (!element) return;
          group.forEach(name => element.classList.remove(name));
          if (value) element.classList.add(value);
          if (!element.getAttribute('class')) element.removeAttribute('class');
          EditorView.commitStage();
        },

        // 흐름 배치 요소를 현재 위치 그대로 절대 배치로 바꾼다.
        toAbsolute() {
          const element = EditorView.selectedElement();
          if (!element) { Util.toast('먼저 요소를 선택해 주세요.', 'warning'); return; }
          const scale = EditorView.stageScale();
          const base = EditorView.stage.getBoundingClientRect();
          const rect = element.getBoundingClientRect();
          element.classList.add('ls-abs');
          element.style.left = Math.round((rect.left - base.left) / scale) + 'px';
          element.style.top = Math.round((rect.top - base.top) / scale) + 'px';
          element.style.width = Math.round(rect.width / scale) + 'px';
          element.style.height = Math.round(rect.height / scale) + 'px';
          EditorView.commitStage();
          EditorView.drawStage();
          EditorView.selectByEid(EditorView.selectedEid);
        },

        /* --- 장 관리 --- */

        // 기본 틀 5종
        slideTemplates: {
          cover: ['표지 (제목 + 부제)',
            '<div class="ls-pad ls-stack ls-center"><p class="ls-kicker">단원 · 차시</p>' +
            '<h1 class="ls-title">제목을 입력하세요</h1><p class="ls-subtitle ls-muted">부제를 입력하세요</p></div>'],
          bullets: ['제목 + 목록',
            '<div class="ls-pad ls-stack"><p class="ls-kicker">소제목</p><h1 class="ls-title">제목을 입력하세요</h1>' +
            '<ul class="ls-body"><li>핵심 1</li><li>핵심 2</li><li>핵심 3</li></ul></div>'],
          compare: ['2단 비교',
            '<div class="ls-pad ls-stack"><h1 class="ls-title">무엇이 다를까?</h1><div class="ls-grid-2">' +
            '<div class="ls-card"><p class="ls-subtitle ls-accent-text">왼쪽</p><p class="ls-body">설명을 적으세요</p></div>' +
            '<div class="ls-card"><p class="ls-subtitle ls-accent-text">오른쪽</p><p class="ls-body">설명을 적으세요</p></div>' +
            '</div></div>'],
          steps: ['3단계 카드',
            '<div class="ls-pad ls-stack"><h1 class="ls-title">세 단계로 정리</h1><div class="ls-grid-3">' +
            '<div class="ls-card"><div class="ls-number-big">1</div><p class="ls-body">첫째</p></div>' +

          quiz: ['확인 문제',

            '<div class="ls-quiz-option">① 보기 1</div>' +
            '<div class="ls-quiz-option" data-ls-answer="true">② 보기 2 (정답)</div>' +
            '<div class="ls-quiz-option">③ 보기 3</div>' +
            '<p class="ls-quiz-explain">해설을 적으세요</p></div>']
        },

        chooseTemplate(anchor, atIndex) {
          const entries = Object.keys(EditorView.slideTemplates).map(key => [
            EditorView.slideTemplates[key][0],
            () => EditorView.addSlide(key, atIndex)
          ]);
          EditorView.pickMenu(anchor || document.querySelector('[data-act="slide-new-tpl"]') || document.body, entries);
        },

        addSlide(kind, atIndex) {
          const lesson = EditorView.lesson;
          if (lesson.slides.length >= LIMITS.maxSlides) { Util.toast('장표는 ' + LIMITS.maxSlides + '장까지입니다.', 'warning'); return; }
          const sid = LessonModel.nextSid(lesson);
          const preset = EditorView.slideTemplates[kind];
          const html = preset
            ? preset[1]
            : '<div class="ls-pad ls-stack"><h1 class="ls-title">제목</h1></div>';
          const clean = SlideSanitizer.sanitizeSlide({ html, css: '', sid });
          const slide = LessonModel.newSlide({
            sid, title: '새 장', phase: EditorView.current().phase || '',
            html: clean.html, minutes: 2, origin: 'manual'
          });
          const position = atIndex == null ? EditorView.index + 1 : atIndex;
          lesson.slides.splice(position, 0, slide);
          EditorView.markDirty();
          EditorView.index = position;
          EditorView.drawThumbs();
          EditorView.drawStage();
        },

        duplicateSlide(index) {
          const lesson = EditorView.lesson;
          const copy = JSON.parse(JSON.stringify(lesson.slides[index]));
          copy.sid = LessonModel.nextSid(lesson);
          copy.title = copy.title + ' (복제)';
          lesson.slides.splice(index + 1, 0, copy);
          EditorView.markDirty();
          EditorView.index = index + 1;
          EditorView.drawThumbs();
          EditorView.drawStage();
        },

        async removeSlide(index) {
          if (EditorView.lesson.slides.length <= 1) { Util.toast('마지막 장은 지울 수 없습니다.', 'warning'); return; }
          if (!(await Util.confirm('이 장을 지울까요?', { danger: true, okText: '삭제' }))) return;
          EditorView.lesson.slides.splice(index, 1);
          EditorView.index = Math.max(0, Math.min(index, EditorView.lesson.slides.length - 1));
          EditorView.markDirty();
          EditorView.drawThumbs();
          EditorView.drawStage();
        },

        // 작은 선택 메뉴를 띄운다. entries: [[이름, 실행], ...]
        pickMenu(anchor, entries) {
          const menu = document.createElement('div');
          menu.className = 'list-group shadow position-fixed';
          menu.style.zIndex = '2000';
          const rect = anchor.getBoundingClientRect();
          menu.style.left = Math.min(window.innerWidth - 220, rect.left) + 'px';
          menu.style.top = (rect.bottom + 4) + 'px';
          menu.style.width = '200px';
          entries.forEach(([label, handler]) => {
            const item = document.createElement('button');
            item.className = 'list-group-item list-group-item-action py-1 small';
            item.textContent = label;
            item.addEventListener('click', () => { menu.remove(); handler(); });
            menu.append(item);
          });
          document.body.append(menu);
          setTimeout(() => {
            const close = event => {
              if (!menu.contains(event.target)) { menu.remove(); document.removeEventListener('click', close); }
            };
            document.addEventListener('click', close);
          }, 0);
        },

        slideMenu(index, anchor) {
          const slide = EditorView.lesson.slides[index];
          EditorView.pickMenu(anchor, [
            ['이 다음에 빈 장', () => EditorView.addSlide('blank', index + 1)],
            ['이 다음에 기본 틀', () => EditorView.chooseTemplate(anchor, index + 1)],
            ['AI로 이 다음에 장 추가', () => AiReviseTab.createSlideByAi(index + 1)],
            ['복제', () => EditorView.duplicateSlide(index)],
            [slide.hidden ? '숨김 해제' : '숨기기', () => {
              slide.hidden = !slide.hidden;
              EditorView.markDirty();
              EditorView.drawThumbs();
            }],
            ['삭제', () => EditorView.removeSlide(index)]
          ]);
        },

        showHelp() {
          const box = document.createElement('div');
          const rows = [
            ['← → / PageUp PageDown', '이전·다음 장 (요소 선택이 없을 때)'],
            ['Ctrl+Z / Ctrl+Shift+Z, Ctrl+Y', '되돌리기 / 다시하기'],
            ['Ctrl+D', '복제 (선택 요소 또는 장)'],
            ['Delete', '선택 요소 삭제'],
            ['Enter / Esc', '글 고치기 시작 / 종료'],
            ['Tab', '다음 요소 선택'],
            ['Alt+클릭', '부모 요소 선택'],
            ['방향키 / Shift+방향키', '자유 배치 요소 1px / 10px 이동'],
            ['Ctrl+[ / Ctrl+]', '무대 선택 시 앞·뒤로 보내기, 입력칸에서는 장 이동'],
            ['Ctrl+S', '즉시 저장'],
            ['F5 또는 Ctrl+Enter', '현재 장부터 발표']
          ];
          const table = document.createElement('table');
          table.className = 'table table-sm';
          rows.forEach(([key, description]) => {
            const tr = document.createElement('tr');
            const th = document.createElement('th');
            th.style.width = '40%';
            th.textContent = key;
            const td = document.createElement('td');
            td.textContent = description;
            tr.append(th, td);
            table.append(tr);
          });
          box.append(table);
          Util.showInfo('단축키', box);
        }
      });

      /* --- 편집기: 속성 패널 --- */

      Object.assign(EditorView, {

        drawProps() {
          const panes = {
            format: document.querySelector('[data-prop-pane="format"]'),
            slide: document.querySelector('[data-prop-pane="slide"]'),
            lesson: document.querySelector('[data-prop-pane="lesson"]'),
            ai: document.querySelector('[data-prop-pane="ai"]')
          };
          if (!panes.format) return;
          EditorView.drawFormatPane(panes.format);
          EditorView.drawSlidePane(panes.slide);
          EditorView.drawLessonPane(panes.lesson);
          AiReviseTab.draw(panes.ai);
        },

        field(label, node) {
          const wrap = document.createElement('div');
          wrap.className = 'mb-2';
          const text = document.createElement('label');
          text.className = 'form-label small mb-1';
          text.textContent = label;
          wrap.append(text, node);
          return wrap;
        },

        applyStyle(property, value) {
          const element = EditorView.selectedElement();
          if (!element) return;
          if (value === '' || value == null) element.style.removeProperty(property);
          else element.style.setProperty(property, value);
          EditorView.commitStage();
          EditorView.drawHandles(element);
        },

        drawFormatPane(pane) {
          pane.textContent = '';
          const element = EditorView.selectedElement();
          if (!element) {
            const hint = document.createElement('p');
            hint.className = 'small text-muted';
            hint.textContent = '무대에서 요소를 클릭하면 서식을 바꿀 수 있습니다.';
            pane.append(hint);
            return;
          }
          const computed = getComputedStyle(element);

          const size = document.createElement('input');
          size.type = 'number';
          size.className = 'form-control form-control-sm';
          size.value = Math.round(parseFloat(computed.fontSize));
          size.addEventListener('change', () => EditorView.applyStyle('font-size', size.value + 'px'));
          pane.append(EditorView.field('글자 크기(px)', size));

          const weight = document.createElement('select');
          weight.className = 'form-select form-select-sm';
          [['', '기본'], ['400', '보통'], ['600', '약간 굵게'], ['700', '굵게'], ['800', '아주 굵게']].forEach(([value, label]) => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = label;
            weight.append(option);
          });
          weight.addEventListener('change', () => EditorView.applyStyle('font-weight', weight.value));
          pane.append(EditorView.field('굵기', weight));

          // 테마 팔레트 + 직접 선택
          const colorRow = document.createElement('div');
          colorRow.className = 'd-flex flex-wrap gap-1 align-items-center';
          const theme = THEMES[LessonModel.theme(EditorView.lesson)];
          [['--ls-fg', theme.fg], ['--ls-muted', theme.muted], ['--ls-accent', theme.accent], ['--ls-accent-2', theme.accent2]]
            .forEach(([variable, hex]) => {
              const swatch = document.createElement('button');
              swatch.className = 'ls-swatch';
              swatch.style.background = hex;
              swatch.title = variable;
              swatch.addEventListener('click', () => EditorView.applyStyle('color', 'var(' + variable + ')'));
              colorRow.append(swatch);
            });
          const picker = document.createElement('input');
          picker.type = 'color';
          picker.className = 'form-control form-control-color form-control-sm';
          picker.value = Util.rgbToHex(computed.color) || '#000000';
          picker.addEventListener('input', () => EditorView.applyStyle('color', picker.value));
          colorRow.append(picker);
          pane.append(EditorView.field('글자 색', colorRow));

          const align = document.createElement('div');
          align.className = 'btn-group btn-group-sm w-100';
          [['left', 'bi-text-left'], ['center', 'bi-text-center'], ['right', 'bi-text-right']].forEach(([value, icon]) => {
            const button = document.createElement('button');
            button.className = 'btn btn-outline-secondary';
            button.innerHTML = '<i class="bi ' + icon + '"></i>';
            button.addEventListener('click', () => EditorView.applyStyle('text-align', value));
            align.append(button);
          });
          pane.append(EditorView.field('정렬', align));

          const lineHeight = document.createElement('input');
          lineHeight.type = 'number';
          lineHeight.step = '0.05';
          lineHeight.className = 'form-control form-control-sm';
          lineHeight.value = (parseFloat(computed.lineHeight) / parseFloat(computed.fontSize) || 1.45).toFixed(2);
          lineHeight.addEventListener('change', () => EditorView.applyStyle('line-height', lineHeight.value));
          pane.append(EditorView.field('줄 간격', lineHeight));

          const background = document.createElement('input');
          background.type = 'color';
          background.className = 'form-control form-control-color form-control-sm';
          background.value = Util.rgbToHex(computed.backgroundColor) || '#ffffff';
          background.addEventListener('input', () => EditorView.applyStyle('background-color', background.value));
          pane.append(EditorView.field('배경색', background));

          const border = document.createElement('input');
          border.className = 'form-control form-control-sm';
          border.placeholder = '예: 2px solid var(--ls-border)';
          border.value = element.style.border || '';
          border.addEventListener('change', () => EditorView.applyStyle('border', border.value));
          pane.append(EditorView.field('테두리', border));

          const radius = document.createElement('input');
          radius.type = 'number';
          radius.className = 'form-control form-control-sm';
          radius.value = parseInt(computed.borderRadius, 10) || 0;
          radius.addEventListener('change', () => EditorView.applyStyle('border-radius', radius.value + 'px'));
          pane.append(EditorView.field('모서리 둥글기(px)', radius));

          const padding = document.createElement('input');
          padding.type = 'number';
          padding.className = 'form-control form-control-sm';
          padding.value = parseInt(computed.paddingTop, 10) || 0;
          padding.addEventListener('change', () => EditorView.applyStyle('padding', padding.value + 'px'));
          pane.append(EditorView.field('안쪽 여백(px)', padding));

          const opacity = document.createElement('input');
          opacity.type = 'range';
          opacity.min = '0'; opacity.max = '1'; opacity.step = '0.05';
          opacity.className = 'form-range';
          opacity.value = computed.opacity || '1';
          opacity.addEventListener('change', () => EditorView.applyStyle('opacity', opacity.value));
          pane.append(EditorView.field('투명도', opacity));

          if (element.tagName.toLowerCase() === 'img') {

      /* --- 편집기: AI 수정 탭 --- */

      const AiReviseTab = {
        pending: null,
        lastRequest: null,

        draw(pane) {
          if (!pane) return;
          if (pane.children.length) return; // 입력 중인 지시문을 지우지 않는다
          pane.textContent = '';

          const target = document.createElement('select');
          target.className = 'form-select form-select-sm';
          target.id = 'ls-ai-target';
          [['slide', '이 장'], ['element', '선택한 요소만'], ['multi', '선택한 여러 장']].forEach(([value, label]) => {
            const option = document.createElement('option');
            option.value = value; option.textContent = label;
            target.append(option);
          });
          pane.append(EditorView.field('무엇을 고칠까요?', target));

          const quick = document.createElement('div');
          quick.className = 'd-flex flex-wrap gap-1 mb-2';
          [
            ['더 쉽게', '처음 듣는 사람도 이해하기 쉬운 말로 바꿔라.'],
            ['더 짧게', '내용을 절반 분량으로 줄여라.'],
            ['넘치지 않게 줄이기', '1280x720 무대를 넘지 않도록 글자 크기와 분량을 줄여 다시 배치하라.'],
            ['예시 추가', '청중이 이해하기 쉬운 구체적 예시를 하나 더 넣어라.'],
            ['그림·도식으로', '글 설명을 svg 도식이나 표로 바꿔 시각적으로 표현하라.'],
            ['확인 문제로', '이 장을 ls-quiz 구조의 확인 문제 장으로 바꿔라.'],
            ['디자인 새로', '내용은 유지하고 배치와 디자인만 새롭게 바꿔라.'],
            ['시나리오 다시 쓰기', 'script(시나리오)를 더 자연스러운 구어체로 다시 써라.']
          ].forEach(([label, instruction]) => {
            const button = document.createElement('button');
            button.className = 'btn btn-sm btn-outline-secondary py-0 px-2';
            button.textContent = label;
            if (label === '넘치지 않게 줄이기' && document.getElementById('ls-overflow-flag') &&
              !document.getElementById('ls-overflow-flag').classList.contains('d-none')) {
              button.className = 'btn btn-sm btn-warning py-0 px-2';
            }
            button.addEventListener('click', () => {
              document.getElementById('ls-ai-instruction').value = instruction;
              AiReviseTab.run();
            });
            quick.append(button);
          });
          pane.append(quick);

          const instruction = document.createElement('textarea');
          instruction.className = 'form-control form-control-sm';
          instruction.id = 'ls-ai-instruction';
          instruction.rows = 3;
          instruction.placeholder = '예) 그래프를 SVG로 그리고 설명은 2줄로';
          pane.append(EditorView.field('자유 지시', instruction));

          const makeCheck = (id, label, checked) => {
            const wrap = document.createElement('div');
            wrap.className = 'form-check';
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.className = 'form-check-input';
            input.id = id;
            input.checked = !!checked;
            const text = document.createElement('label');
            text.className = 'form-check-label small';
            text.htmlFor = id;
            text.textContent = label;
            wrap.append(input, text);
            return wrap;
          };
          pane.append(makeCheck('ls-ai-keep-design', '디자인 유지(내용만 고치기)', false));

          const run = document.createElement('button');
          run.className = 'btn btn-primary btn-sm w-100 mt-2';
          run.id = 'ls-ai-run';
          run.innerHTML = '<i class="bi bi-magic"></i> AI로 고치기';
          run.addEventListener('click', () => AiReviseTab.run());
          pane.append(run);
        },

        targets() {
          const mode = (document.getElementById('ls-ai-target') || {}).value || 'slide';
          if (mode === 'multi' && EditorView.multi.length) {
            return EditorView.multi.slice().sort((a, b) => a - b).map(i => EditorView.lesson.slides[i]);
          }
          return [EditorView.current()];
        },

        async run() {
          if (EditorView.readOnly) { Util.toast('읽기 전용 상태입니다.', 'warning'); return; }
          if (!SettingsStore.hasApiKey()) { SettingsModal.open(); return; }
          const mode = (document.getElementById('ls-ai-target') || {}).value || 'slide';
          const instruction = (document.getElementById('ls-ai-instruction') || {}).value || '';
          if (!instruction.trim()) { Util.toast('어떻게 고칠지 적어 주세요.', 'warning'); return; }

          const slides = AiReviseTab.targets();
          const keepDesign = (document.getElementById('ls-ai-keep-design') || {}).checked;
          const lesson = EditorView.lesson;
          const outlineText = lesson.slides.map((s, i) => (i + 1) + '. ' + s.title).join('\n');

          let scopeNote = '';
          if (mode === 'element' && EditorView.selectedEid) {
            scopeNote = '\n[특히 고칠 요소] data-eid="' + EditorView.selectedEid + '" 인 요소만 바꾸고 나머지는 그대로 둔다.';
          }

          const askText = [
            '아래 슬라이드를 요청대로 고쳐라. 응답의 sid는 요청과 똑같이 써라.',
            '',
            '[발표 자료 정보]',
            '- 제목: ' + lesson.meta.title,
            '- 테마: ' + LessonModel.theme(lesson),
            '',
            '[전체 목차]',
            outlineText,
            '',
            '[요청]',
            instruction + scopeNote + (keepDesign ? '\n현재 CSS와 배치는 그대로 두고 내용만 바꿔라.' : ''),
            '',
            '[대상 장]',
            slides.map(slide => [
              'sid: ' + slide.sid,
              'title: ' + slide.title,
              'minutes: ' + slide.minutes,
              'html:',
              slide.html,
              'css:',
              slide.css || '(없음)',
              'script:',
              slide.script || '(없음)',
              'memo:',
              slide.memo || '(없음)'
            ].join('\n')).join('\n---\n')
          ].join('\n');

          const run = document.getElementById('ls-ai-run');
          run.disabled = true;
          run.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 고치는 중…';
          AiReviseTab.lastRequest = { askText, slides };

          try {
            const result = await GeminiService.generateJson({
              model: SettingsStore.all.model,
              parts: [{ text: askText }],
              schema: SCHEMAS.revise
            });
            const got = (result.slides || []).filter(item => slides.some(slide => slide.sid === item.sid));
            if (!got.length) { Util.toast('AI 응답의 sid가 요청과 달라 적용하지 않았습니다.', 'danger'); return; }
            AiReviseTab.preview(got);
          } catch (err) {
            Util.toast(err.message, 'danger');
          } finally {
            run.disabled = false;
            run.innerHTML = '<i class="bi bi-magic"></i> AI로 고치기';
          }
        },

        preview(items) {
          AiReviseTab.pending = items;
          const body = document.getElementById('ls-diff-body');
          body.textContent = '';
          items.forEach(item => {
            const slide = EditorView.lesson.slides.find(s => s.sid === item.sid);
            if (!slide) return;
            const clean = SlideSanitizer.sanitizeSlide({ html: item.html, css: item.css || '', sid: slide.sid });
            item._clean = clean;

            const block = document.createElement('div');
            block.className = 'mb-4';
            const heading = document.createElement('h3');
            heading.className = 'h6';
            heading.textContent = slide.title + ' — ' + (item.changeSummary || '');
            const row = document.createElement('div');
            row.className = 'row g-2';
            [['변경 전', slide], ['변경 후', Object.assign({}, slide, { html: clean.html, css: clean.css })]].forEach(([label, data]) => {
              const col = document.createElement('div');
              col.className = 'col-6';
              const caption = document.createElement('div');
              caption.className = 'small text-muted';
              caption.textContent = label;
              const frame = document.createElement('div');
              frame.className = 'ls-thumb-frame';
              col.append(caption, frame);
              row.append(col);
              requestAnimationFrame(() => SlideRenderer.render(EditorView.lesson, data, frame, 'thumb',
                { scale: (frame.clientWidth || 300) / STAGE_W, skipMath: true }));
            });
            block.append(heading, row);
            body.append(block);
          });
          bootstrap.Modal.getOrCreateInstance(document.getElementById('ls-modal-diff')).show();
        },

        async apply() {
          const items = AiReviseTab.pending;
          if (!items) return;

          // 사용자가 넣은 이미지가 사라지는지 확인한다.
          let lost = 0;
          items.forEach(item => {
            const slide = EditorView.lesson.slides.find(s => s.sid === item.sid);
            if (!slide) return;
            const before = (slide.html.match(/asset:[A-Za-z0-9_]+/g) || []);
            const after = (item._clean.html.match(/asset:[A-Za-z0-9_]+/g) || []);
            lost += before.filter(id => !after.includes(id)).length;
          });
          if (lost > 0) {
            const keep = await Util.confirm('이미지 ' + lost + '개가 빠집니다. 그대로 적용할까요?', { okText: '적용', danger: true });
            if (!keep) return;
          }

          VersionStore.add(EditorView.lesson, 'AI 수정 적용 전');
          items.forEach(item => {
            const slide = EditorView.lesson.slides.find(s => s.sid === item.sid);
            if (!slide) return;
            slide.html = item._clean.html;
            slide.css = item._clean.css;
            if (item.script) slide.script = item.script;
            if (item.memo) slide.memo = item.memo;
            slide.title = LessonModel.titleFromHtml(slide.html);
            slide.origin = 'ai';
          });
          EditorView.markDirty();
          EditorView.drawThumbs();
          EditorView.drawStage();
          AiReviseTab.pending = null;
          bootstrap.Modal.getOrCreateInstance(document.getElementById('ls-modal-diff')).hide();
          Util.toast('적용했습니다. Ctrl+Z로 되돌릴 수 있습니다.', 'success');
        },

        async createSlideByAi(atIndex) {
          if (!SettingsStore.hasApiKey()) { SettingsModal.open(); return; }
          const instruction = window.prompt('어떤 장을 추가할까요?', '앞 장 내용을 정리하는 요약 장');
          if (!instruction) return;
          const lesson = EditorView.lesson;
          const position = atIndex == null ? EditorView.index + 1 : atIndex;
          const reference = lesson.slides[0];

          try {
            const result = await GeminiService.generateJson({
              model: SettingsStore.all.model,
              parts: [{
                text: [
                  '아래 발표 자료에 새 장 1개를 만들어라. slides 배열에 1개만 출력한다.',
                  '[제목] ' + lesson.meta.title,
                  '[전체 목차]',
                  lesson.slides.map((s, i) => (i + 1) + '. ' + s.title).join('\n'),
                  '[요청] ' + instruction,
                  reference ? '[디자인 기준 장]\nHTML:\n' + reference.html + '\nCSS:\n' + (reference.css || '') : ''
                ].join('\n')
              }],
              schema: SCHEMAS.slides
            });
            const item = (result.slides || [])[0];
            if (!item) { Util.toast('AI가 장을 만들지 못했습니다.', 'danger'); return; }
            const sid = LessonModel.nextSid(lesson);
            const clean = SlideSanitizer.sanitizeSlide({ html: item.html, css: item.css || '', sid });
            lesson.slides.splice(position, 0, LessonModel.newSlide({
              sid, title: item.title || '새 장', phase: item.phase || '',
              html: clean.html, css: clean.css, script: item.script || '', memo: item.memo || '',
              minutes: item.minutes || 2, origin: 'ai'
            }));
            EditorView.markDirty();
            EditorView.index = position;
            EditorView.drawThumbs();
            EditorView.drawStage();
          } catch (err) {
            Util.toast(err.message, 'danger');
          }
        }
      };

      /* --- 임시 기록 서랍 --- */

      const VersionDrawer = {
        open() {
          const el = document.getElementById('ls-offcanvas-versions');
          const list = el.querySelector('#ls-version-list');
          list.textContent = '';
          const versions = VersionStore.list(EditorView.lesson.id);
          if (!versions.length) {
            list.textContent = '아직 기록이 없습니다.';
          }
          versions.forEach(version => {
            const item = document.createElement('div');
            item.className = 'border rounded p-2 mb-2';
            const title = document.createElement('div');
            title.className = 'small fw-semibold';
            title.textContent = Util.formatWhen(version.createdAt) + ' · ' + version.reason;
            const info = document.createElement('div');
            info.className = 'small text-muted';
            info.textContent = (version.slides || 0) + '장';
            const restore = document.createElement('button');
            restore.className = 'btn btn-sm btn-outline-primary mt-1';
            restore.textContent = '이 시점으로 되돌리기';
            restore.addEventListener('click', async () => {
              if (!(await Util.confirm('지금 상태를 기록에 남기고 이 시점으로 되돌립니다.', { okText: '되돌리기' }))) return;
              VersionStore.add(EditorView.lesson, '되돌리기 직전');
              const restored = VersionStore.restore(version);
              if (!restored) { Util.toast('이 기록을 읽을 수 없습니다.', 'danger'); return; }
              restored.id = EditorView.lesson.id;
              EditorView.lesson = restored;
              EditorView.index = 0;
              EditorView.history.reset(restored);
              EditorView.markDirty({ skipHistory: true });
              EditorView.drawThumbs();
              EditorView.drawStage();
              EditorView.drawProps();
              bootstrap.Offcanvas.getOrCreateInstance(el).hide();
            });
            item.append(title, info, restore);
            list.append(item);
          });
          bootstrap.Offcanvas.getOrCreateInstance(el).show();
        }
      };

      /* --- 발표자 화면 --- */

      const PresenterView = {
        lesson: null,
        order: [],
        position: 0,
        sync: null,
        blank: null,
        reveal: false,

        async show(lessonId, query) {
          const lesson = await LessonStore.getLesson(lessonId);
          if (!lesson) { Util.toast('슬라이드를 찾을 수 없습니다.', 'danger'); App.go('#/list'); return; }
          App.setFullscreenMode(true);
          const root = App.mount('tpl-presenter');

          PresenterView.lesson = lesson;
          PresenterView.order = lesson.slides.map((slide, index) => index).filter(index => !lesson.slides[index].hidden);
          const from = parseInt((query || {}).from, 10);
          PresenterView.position = Math.max(0, PresenterView.order.indexOf(isNaN(from) ? PresenterView.order[0] : from));
          PresenterView.blank = null;
          PresenterView.reveal = false;

          root.querySelector('#ls-pr-title').textContent = lesson.meta.title || '';

          PresenterView.sync = PresentationSync(lesson.id, message => {
            if (message.type === 'hello') PresenterView.broadcast();
            if (message.type === 'notes') PresenterView.onRemoteNotes(message);
          });

          root.addEventListener('click', event => {
            const button = event.target.closest('[data-act]');
            if (!button) return;
            const act = button.dataset.act;
            if (act === 'open-screen') PresenterView.openScreen();
            if (act === 'blank') PresenterView.toggleBlank('black');
            if (act === 'answer') { PresenterView.reveal = !PresenterView.reveal; PresenterView.draw(); }
            if (act === 'fullscreen') PresenterView.requestFullscreen();
            if (act === 'to-editor') App.go('#/edit/' + lesson.id);
            if (act === 'font-up') PresenterView.fontSize(2);
            if (act === 'font-down') PresenterView.fontSize(-2);
          });

          const scriptBox = root.querySelector('#ls-pr-script');
          const memoBox = root.querySelector('#ls-pr-memo');
          const save = Util.debounce(async () => {
            await LessonStore.putLesson(PresenterView.lesson);
          }, 600);
          scriptBox.addEventListener('input', () => { PresenterView.currentSlide().script = scriptBox.value; save(); });
          memoBox.addEventListener('input', () => { PresenterView.currentSlide().memo = memoBox.value; save(); });

          document.addEventListener('keydown', PresenterView.onKeyDown);
          window.addEventListener('resize', PresenterView.onResize);

          PresenterView.draw();

          App.currentView = {
            destroy() {
              document.removeEventListener('keydown', PresenterView.onKeyDown);
              window.removeEventListener('resize', PresenterView.onResize);
              if (PresenterView.sync) PresenterView.sync.close();
              PresenterView.lesson = null;
            }
          };
        },

        currentIndex() { return PresenterView.order[PresenterView.position]; },
        currentSlide() { return PresenterView.lesson.slides[PresenterView.currentIndex()]; },

        fontSize(delta) {
          const root = document.querySelector('.ls-presenter');
          const current = parseInt(getComputedStyle(root).getPropertyValue('--ls-note-size'), 10) || 20;
          root.style.setProperty('--ls-note-size', Util.clamp(current + delta, 12, 48) + 'px');
        },

        draw() {
          const lesson = PresenterView.lesson;
          if (!lesson) return;
          const slide = PresenterView.currentSlide();
          const nextIndex = PresenterView.order[PresenterView.position + 1];

          document.getElementById('ls-pr-pos').textContent = (PresenterView.position + 1) + ' / ' + PresenterView.order.length;

          const currentHost = document.getElementById('ls-pr-current');
          const result = SlideRenderer.render(lesson, slide, currentHost, 'present',
            { maxWidth: currentHost.clientWidth || 800 });
          if (PresenterView.reveal) result.stage.classList.add('ls-reveal-answer');

          const nextHost = document.getElementById('ls-pr-next');
          nextHost.textContent = '';
          if (nextIndex != null) {
            SlideRenderer.render(lesson, lesson.slides[nextIndex], nextHost, 'thumb',
              { maxWidth: nextHost.clientWidth || 260, skipMath: true });
          } else {
            nextHost.textContent = '마지막 장입니다.';
          }

          const list = document.getElementById('ls-pr-list');
          list.textContent = '';
          let lastPhase = null;
          PresenterView.order.forEach((slideIndex, position) => {
            const item = lesson.slides[slideIndex];
            if (item.phase && item.phase !== lastPhase) {
              const head = document.createElement('div');
              head.className = 'small text-secondary mt-2';
              head.textContent = item.phase;
              list.append(head);
              lastPhase = item.phase;
            }
            const row = document.createElement('div');
            row.className = 'ls-mini-item' + (position === PresenterView.position ? ' active' : '');
            row.textContent = (position + 1) + '. ' + (item.title || '');
            row.addEventListener('click', () => PresenterView.goTo(position));
            list.append(row);
          });

          document.getElementById('ls-pr-script').value = slide.script || '';
          document.getElementById('ls-pr-memo').value = slide.memo || '';
          PresenterView.broadcast();
        },

        onResize: Util.debounce(() => { if (PresenterView.lesson) PresenterView.draw(); }, 250),

        broadcast() {
          if (!PresenterView.sync) return;
          PresenterView.sync.post({
            type: 'state',
            index: PresenterView.currentIndex(),
            blank: PresenterView.blank,
            reveal: PresenterView.reveal
          });
        },

        onRemoteNotes(message) {
          const slide = PresenterView.lesson.slides.find(s => s.sid === message.sid);
          if (!slide) return;
          if (message.script != null) slide.script = message.script;
          if (message.memo != null) slide.memo = message.memo;
        },

        goTo(position) {
          PresenterView.position = Util.clamp(position, 0, PresenterView.order.length - 1);
          PresenterView.reveal = false;
          PresenterView.draw();
        },

        toggleBlank(kind) {
          PresenterView.blank = PresenterView.blank === kind ? null : kind;
          PresenterView.broadcast();
          Util.toast(PresenterView.blank ? '청중 화면을 가렸습니다.' : '청중 화면을 다시 켰습니다.');
        },

        openScreen() {
          const url = location.pathname + '#/screen/' + PresenterView.lesson.id;
          window.open(url, 'ls-screen-' + PresenterView.lesson.id);
          setTimeout(() => PresenterView.broadcast(), 800);
        },

        requestFullscreen() {
          const el = document.documentElement;
          if (document.fullscreenElement) document.exitFullscreen();
          else if (el.requestFullscreen) el.requestFullscreen();
        },

        onKeyDown(event) {
          const target = event.target;
          if (target && (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT')) return;
          const key = event.key;
          if (['ArrowRight', 'PageDown', ' ', 'Spacebar'].includes(key)) { event.preventDefault(); PresenterView.goTo(PresenterView.position + 1); }
          else if (['ArrowLeft', 'PageUp'].includes(key)) { event.preventDefault(); PresenterView.goTo(PresenterView.position - 1); }
          else if (key === 'Home') { event.preventDefault(); PresenterView.goTo(0); }
          else if (key === 'End') { event.preventDefault(); PresenterView.goTo(PresenterView.order.length - 1); }
          else if (key.toLowerCase() === 'b') PresenterView.toggleBlank('black');
          else if (key.toLowerCase() === 'w') PresenterView.toggleBlank('white');
          else if (key.toLowerCase() === 'o') PresenterView.openScreen();
          else if (key.toLowerCase() === 'f') PresenterView.requestFullscreen();
          else if (/^\d$/.test(key)) {
            PresenterView._buffer = (PresenterView._buffer || '') + key;
          } else if (key === 'Enter' && PresenterView._buffer) {
            PresenterView.goTo(parseInt(PresenterView._buffer, 10) - 1);
            PresenterView._buffer = '';
          }
        }
      };

      /* --- 청중 화면 --- */

      const ScreenView = {
        lesson: null,
        index: 0,
        sync: null,
        reveal: false,
        blank: null,

        async show(lessonId) {
          const lesson = await LessonStore.getLesson(lessonId);
          if (!lesson) { Util.toast('슬라이드를 찾을 수 없습니다.', 'danger'); return; }
          App.setFullscreenMode(true);
          document.body.classList.add('ls-screen-body');
          App.mount('tpl-screen');

          ScreenView.lesson = lesson;
          ScreenView.index = Math.max(0, lesson.slides.findIndex(s => !s.hidden));

          ScreenView.sync = PresentationSync(lesson.id, message => {
            if (message.type !== 'state') return;
            ScreenView.index = message.index;
            ScreenView.blank = message.blank;
            ScreenView.reveal = !!message.reveal;
            ScreenView.draw();
          });
          ScreenView.sync.post({ type: 'hello' });

          const root = document.getElementById('ls-screen-root');
          let hideTimer = null;
          const onMove = () => {
            root.classList.remove('cursor-hidden');
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => root.classList.add('cursor-hidden'), 2000);
          };
          root.addEventListener('mousemove', onMove);
          root.addEventListener('click', () => {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen();
            }
          });
          document.addEventListener('keydown', ScreenView.onKeyDown);
          window.addEventListener('resize', ScreenView.onResize);
          onMove();
          ScreenView.draw();

          App.currentView = {
            destroy() {
              document.removeEventListener('keydown', ScreenView.onKeyDown);
              window.removeEventListener('resize', ScreenView.onResize);
              document.body.classList.remove('ls-screen-body');
              if (ScreenView.sync) ScreenView.sync.close();
              ScreenView.lesson = null;
            }
          };
        },

        draw() {
          const root = document.getElementById('ls-screen-root');
          const host = document.getElementById('ls-screen-host');
          if (!root || !host || !ScreenView.lesson) return;
          const slide = ScreenView.lesson.slides[ScreenView.index];
          if (!slide) return;
          const scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
          const result = SlideRenderer.render(ScreenView.lesson, slide, host, 'present', { scale });
          if (ScreenView.reveal) result.stage.classList.add('ls-reveal-answer');
          root.classList.toggle('blank-on', !!ScreenView.blank);
          root.classList.toggle('blank-black', ScreenView.blank === 'black');
          root.classList.toggle('blank-white', ScreenView.blank === 'white');
        },

        onResize: Util.debounce(() => ScreenView.draw(), 200),

        onKeyDown(event) {
          const slides = ScreenView.lesson ? ScreenView.lesson.slides : [];
          const visible = slides.map((s, i) => i).filter(i => !slides[i].hidden);
          const position = visible.indexOf(ScreenView.index);
          if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
            event.preventDefault();
            ScreenView.index = visible[Math.min(visible.length - 1, position + 1)];
            ScreenView.draw();
          }
          if (['ArrowLeft', 'PageUp'].includes(event.key)) {
            event.preventDefault();
            ScreenView.index = visible[Math.max(0, position - 1)];
            ScreenView.draw();
          }
          if (event.key.toLowerCase() === 'f') {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
          }
        }
      };

      /* --- 인쇄 화면 --- */

      const PrintView = {
        async show(lessonId, query) {
          const lesson = await LessonStore.getLesson(lessonId);
          if (!lesson) { Util.toast('슬라이드를 찾을 수 없습니다.', 'danger'); return; }
          App.setFullscreenMode(true);
          App.mount('tpl-print');
          const root = document.getElementById('ls-print-root');
          const mode = (query && query.mode) === 'handout' ? 'handout' : 'slides';
          const slides = LessonModel.visibleSlides(lesson);

          const style = document.createElement('style');
          style.textContent = mode === 'slides'
            ? '@page { size: 13.333in 7.5in; margin: 0; }'
            : '@page { size: A4 portrait; margin: 0; }';
          root.append(style);

          const bar = document.createElement('div');
          bar.className = 'ls-no-print p-2 border-bottom d-flex gap-2 align-items-center';
          const note = document.createElement('span');
          note.className = 'small text-muted';
          note.textContent = '인쇄 대화상자에서 대상을 "PDF로 저장"으로 골라 주세요.';
          const again = document.createElement('button');
          again.className = 'btn btn-sm btn-primary';
          again.textContent = '다시 인쇄';
          again.addEventListener('click', () => window.print());
          const toggle = document.createElement('a');
          toggle.className = 'btn btn-sm btn-outline-secondary';
          toggle.href = '#/print/' + lesson.id + '?mode=' + (mode === 'slides' ? 'handout' : 'slides');
          toggle.textContent = mode === 'slides' ? '유인물 모드' : '슬라이드 모드';
          bar.append(again, toggle, note);
          root.append(bar);

          if (mode === 'slides') {
            slides.forEach(slide => {
              const page = document.createElement('div');
              page.className = 'ls-print-slide-page';
              root.append(page);
              SlideRenderer.render(lesson, slide, page, 'print', { scale: 1 });
            });
          } else {
            const teacher = true;
            slides.forEach((slide, index) => {
              const page = document.createElement('div');
              page.className = 'ls-handout-page';
              const heading = document.createElement('h2');
              heading.className = 'h6';
              heading.textContent = (index + 1) + '. ' + (slide.title || '');
              const host = document.createElement('div');
              page.append(heading, host);
              root.append(page);
              SlideRenderer.render(lesson, slide, host, 'print', { scale: (186 / 25.4 * 96) / STAGE_W });

              if (teacher) {
                const scriptBox = document.createElement('div');
                scriptBox.className = 'mt-3 small';
                const scriptTitle = document.createElement('div');
                scriptTitle.className = 'fw-bold';
                scriptTitle.textContent = '시나리오';
                const scriptText = document.createElement('p');
                scriptText.style.whiteSpace = 'pre-wrap';
                scriptText.textContent = slide.script || '';
                const memoTitle = document.createElement('div');
                memoTitle.className = 'fw-bold mt-2';
                memoTitle.textContent = '메모';
                const memoText = document.createElement('p');
                memoText.style.whiteSpace = 'pre-wrap';
                memoText.textContent = slide.memo || '';
                scriptBox.append(scriptTitle, scriptText, memoTitle, memoText);
                page.append(scriptBox);
              }
              const lines = document.createElement('div');
              lines.className = 'mt-3';
              for (let i = 0; i < 6; i++) {
                const line = document.createElement('div');
                line.className = 'ls-handout-line';
                lines.append(line);
              }
              page.append(lines);

          // 이미지·글꼴·수식이 모두 준비된 뒤 인쇄한다.
          try { await document.fonts.ready; } catch (err) { /* 무시 */ }
